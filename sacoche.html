<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#f5a53a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Ta sacoche — Battle Dock</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="chaud.css?v=2">
<style>
.ob{position:relative;display:flex;gap:15px;padding:16px 17px;margin-bottom:13px;
  border-radius:18px;background:var(--creme);border:3px solid var(--encre);
  }
.ob .vi{flex:0 0 58px;height:58px;border-radius:16px;display:flex;
  align-items:center;justify-content:center;overflow:hidden;
  background:var(--creme2);border:2.5px solid var(--encre)}
.ob .vi svg{width:38px;height:38px;display:block}
.ob .tx{flex:1;min-width:0}
.ob .tx b{display:block;font-family:'DM Serif Display',Georgia,serif;
  font-size:20px;line-height:1.15}
.ob .tx .n{display:block;font-size:13px;font-weight:600;
  color:rgba(18,48,63,.7);margin-top:6px;line-height:1.5}
.ob .tx .d{display:block;font-size:12px;font-weight:600;font-style:italic;
  color:rgba(18,48,63,.5);margin-top:7px;line-height:1.5}
/* ---------- d'où il vient, et quand ----------
   La date était enregistrée et jamais montrée. Pour un souvenir,
   c'est pourtant ce qui compte le plus. */
.ob .tx .ou{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap;
  margin-top:11px;padding-top:10px;
  border-top:2.5px solid rgba(18,48,63,.1);
  font-size:11.5px;font-weight:700;color:rgba(18,48,63,.5)}
.ob .tx .ou em{font-style:normal;color:var(--encre)}
.ob .tx .ou i{width:3.5px;height:3.5px;border-radius:50%;
  background:rgba(18,48,63,.24);align-self:center}
/* les plus vieux objets se distinguent : tu les traînes depuis longtemps */
.ob .tx .ou .vieux{color:#a8741a}
.ob .nb{position:absolute;top:14px;right:15px;min-width:30px;height:30px;
  border-radius:11px;display:flex;align-items:center;justify-content:center;
  padding:0 8px;font-family:'DM Serif Display',Georgia,serif;font-size:17px;
  background:var(--or);border:2.5px solid var(--encre)}
</style>
</head>
<body>

<div class="pont">
  <div class="tete">
    <span class="q"><b>Ta sacoche</b><span id="s-sous">—</span></span>
    <button class="retour" id="retour">‹ Retour</button>
  </div>
  <div id="corps" class="attend"></div>
  <p class="pied">Battle Dock — Marseille</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="bd.js?v=3"></script>
<script>
/* le contenu paraît d'un trait, une fois complet */
function paraitre(){
  const e = document.getElementById('corps');
  if (e){ e.classList.remove('attend'); e.classList.add('venu'); }
}

const GENRES = [
  ['quete',    'Ce qui sert à quelque chose'],
  ['outil',    'Ce qui te sert tous les jours'],
  ['souvenir', 'Ce que tu gardes'] ];

/* la date, comme on la dirait : « le 17 août », « hier », « aujourd'hui » */
function leJour(iso){
  if (!iso) return '';
  const d = new Date(iso), n = new Date();
  const jours = Math.floor((n - d) / 86400000);
  if (jours <= 0) return "aujourd'hui";
  if (jours === 1) return 'hier';
  if (jours < 7) return 'il y a ' + jours + ' jours';
  return 'le ' + d.toLocaleDateString('fr-FR', { day:'numeric', month:'long' });
}

/* depuis combien de temps tu le portes */
function depuis(iso){
  if (!iso) return 0;
  return Math.floor((new Date() - new Date(iso)) / 86400000);
}

/* la ligne du bas : d'où il vient, et quand tu l'as eu */
function provenance(o){
  const bouts = [];
  if (o.d_ou) bouts.push('<em>' + o.d_ou + '</em>');
  if (o.pris_le){
    const j = depuis(o.pris_le);
    bouts.push('<span class="' + (j >= 14 ? 'vieux' : '') + '">'
      + leJour(o.pris_le) + '</span>');
  }
  if (!bouts.length) return '';
  return '<span class="ou">' + bouts.join('<i></i>') + '</span>';
}

function objetSVG(k){
  const O = {
    cle: `<path d="M17 22a7 7 0 1 0 0-14 7 7 0 0 0 0 14z" fill="none" stroke="#c9a374" stroke-width="3"/>
      <circle cx="17" cy="15" r="2.6" fill="#3a3028"/>
      <path d="M24 15h20M40 15v6M35 15v4M44 15v7" stroke="#c9a374" stroke-width="3"
        stroke-linecap="round"/>
      <path d="M17 8.4a7 7 0 0 0-6.4 4.2 7 7 0 0 1 9.6 8.6A7 7 0 0 0 17 8.4z"
        fill="#e0bc8c" opacity=".5"/>`,

    carte: `<path d="M5 8l12-3 13 4 12-3v22l-12 3-13-4-12 3z" fill="#e4d8b8"/>
      <path d="M5 8l12-3v22l-12 3z" fill="#f0e6cc"/>
      <path d="M17 5v22M30 9v22" stroke="#c4b490" stroke-width="1"/>
      <path d="M9 15q6-3 11 1t9-1" stroke="#8a9aa8" stroke-width="1.4" fill="none"/>
      <path d="M11 21q7-2 12 2" stroke="#8a9aa8" stroke-width="1.2" fill="none"/>
      <path d="M24 17l3 3M27 17l-3 3" stroke="#8a4a3a" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M42 6v22l-2-1V7z" fill="#c4b490"/>
      <path d="M42 6l-2 1v20l2 1z" fill="#3a3630" opacity=".2"/>`,

    boussole: `<circle cx="24" cy="18" r="14" fill="#a8823c"/>
      <circle cx="24" cy="18" r="11.6" fill="#e8dcc0"/>
      <circle cx="24" cy="18" r="11.6" fill="none" stroke="#8a6a30" stroke-width="1"/>
      <path d="M24 8v3M24 25v3M14 18h3M31 18h3" stroke="#6d5a38" stroke-width="1.4"/>
      <path d="M24 9l3 8-3 2-3-2z" fill="#b8483a"/>
      <path d="M24 27l-3-8 3-2 3 2z" fill="#e8e2d4"/>
      <circle cx="24" cy="18" r="1.6" fill="#6d5a38"/>
      <path d="M24 4a14 14 0 0 0-9.9 4.1 14 14 0 0 1 19.8 19.8A14 14 0 0 0 24 4z"
        fill="#e0c088" opacity=".34"/>
      <path d="M20 4h8v2h-8z" fill="#8a6a30"/>`,

    bague: `<ellipse cx="24" cy="19" rx="10" ry="11" fill="none" stroke="#9a9aa0" stroke-width="3.4"/>
      <ellipse cx="24" cy="19" rx="10" ry="11" fill="none" stroke="#d0d0d6" stroke-width="1.2"
        stroke-dasharray="8 20" stroke-dashoffset="14"/>
      <path d="M19 9q5-3 10 0" stroke="#e4e4e8" stroke-width="1.4" fill="none"/>
      <ellipse cx="24" cy="19" rx="6.4" ry="7.4" fill="#2a2e36" opacity=".2"/>`,

    lettre: `<path d="M7 10h34v20H7z" fill="#f0e8d4"/>
      <path d="M7 10h34v20H7z" fill="none" stroke="#c9bda0" stroke-width="1"/>
      <path d="M7 10l17 11 17-11" fill="none" stroke="#c9bda0" stroke-width="1.4"/>
      <path d="M7 30l12-9M41 30l-12-9" fill="none" stroke="#dcd2ba" stroke-width="1"/>
      <circle cx="24" cy="22" r="4.6" fill="#a8433a"/>
      <circle cx="24" cy="22" r="4.6" fill="none" stroke="#7a2e28" stroke-width=".8"/>
      <path d="M22 20.4l4 3.2M26 20.4l-4 3.2" stroke="#7a2e28" stroke-width="1"/>`,

    couteau: `<path d="M6 22q10-9 22-10 4-.4 5 1.4t-2 4Q20 22 8 25z" fill="#c4ccd2"/>
      <path d="M6 22q10-9 22-10 4-.4 5 1.4-12 2-25 11z" fill="#e8eef2"/>
      <path d="M31 17l11 3.4q2 .6 2 2.2t-2 2.2L31 25z" fill="#6d4a30"/>
      <path d="M31 17l11 3.4q2 .6 2 2.2l-13-2z" fill="#8a6444"/>
      <circle cx="36" cy="21.4" r="1" fill="#3a2a1c"/>
      <circle cx="40" cy="22" r="1" fill="#3a2a1c"/>`,

    medaille: `<circle cx="24" cy="21" r="11" fill="#b4a068"/>
      <circle cx="24" cy="21" r="9.2" fill="#cdb87e"/>
      <circle cx="24" cy="21" r="9.2" fill="none" stroke="#9a8850" stroke-width=".8"/>
      <path d="M24 14v5M21.4 19h5.2M24 19v9" stroke="#7a6a3c" stroke-width="1.6"
        stroke-linecap="round"/>
      <path d="M19 27q5 3 10 0" stroke="#7a6a3c" stroke-width="1.2" fill="none"/>
      <path d="M24 10a11 11 0 0 0-7.8 3.2 11 11 0 0 1 15.6 15.6A11 11 0 0 0 24 10z"
        fill="#e0cf9a" opacity=".4"/>
      <path d="M22 10l2-6 2 6z" fill="#8a7a48"/>`,

    carnet: `<path d="M9 7h28q2 0 2 2v22q0 2-2 2H9z" fill="#7a5c3a"/>
      <path d="M11 7h26v26H11z" fill="#e4d8bc"/>
      <path d="M11 7h26v26H11z" fill="none" stroke="#c4b494" stroke-width=".8"/>
      <path d="M15 13h18M15 17h18M15 21h14M15 25h16M15 29h11"
        stroke="#a89a80" stroke-width="1"/>
      <path d="M15 17h18" stroke="#8a4a3a" stroke-width="1.2"/>
      <path d="M9 7h3v26H9z" fill="#5a4028"/>
      <path d="M37 15h5v6l-2.5-2-2.5 2z" fill="#b8483a"/>`
  }[k] || '';
  return '<svg viewBox="0 0 48 40" xmlns="http://www.w3.org/2000/svg">' + O + '</svg>';
}

(async () => {
  const C = document.getElementById('corps');
  try {
    const d = await BD.charger();
    if (!d){ location.href = 'index.html'; return; }

    const S = d.sacoche || [];
    const vieux = S.reduce((a, o) =>
      Math.max(a, depuis(o.pris_le)), 0);
    document.getElementById('s-sous').textContent = !S.length
      ? 'Elle est vide'
      : S.length + (S.length > 1 ? ' objets' : ' objet')
        + (vieux >= 2 ? ' · le plus ancien depuis ' + vieux + ' jours' : '');

    if (!S.length){
      C.innerHTML = '<p class="vide">Ta sacoche est vide.<br>'
        + 'Ce que tu ramasseras en chemin finira là — '
        + 'ce qu\'on te donne, ce que tu trouves, ce qu\'on t\'oublie.</p>'; paraitre();
      return;
    }

    let h = '';
    GENRES.forEach(([g, titre]) => {
      /* le plus ancien en tête : c'est celui qui a le plus d'histoire */
      const L = S.filter(o => o.genre === g)
        .sort((a, b) => new Date(a.pris_le || 0) - new Date(b.pris_le || 0));
      if (!L.length) return;
      h += '<p class="sec">' + titre + '</p>';
      h += L.map(o =>
        '<div class="ob">'
        + (o.combien > 1 ? '<span class="nb">' + o.combien + '</span>' : '')
        + '<span class="vi">' + objetSVG(o.signe) + '</span>'
        + '<span class="tx"><b>' + o.nom + '</b>'
        + '<span class="n">' + o.note + '</span>'
        + (o.detail ? '<span class="d">' + o.detail + '</span>' : '')
        + provenance(o)
        + '</span></div>').join('');
    });

    /* ce qui n'entre dans aucun genre */
    const connus = GENRES.map(x => x[0]);
    const reste = S.filter(o => connus.indexOf(o.genre) < 0);
    if (reste.length){
      h += '<p class="sec">Le reste</p>'
        + reste.map(o =>
          '<div class="ob">'
          + (o.combien > 1 ? '<span class="nb">' + o.combien + '</span>' : '')
          + '<span class="vi">' + objetSVG(o.signe) + '</span>'
          + '<span class="tx"><b>' + o.nom + '</b>'
          + '<span class="n">' + o.note + '</span>'
          + provenance(o)
          + '</span></div>').join('');
    }

    C.innerHTML = h; paraitre();

  } catch(e){
    console.warn(e);
    C.innerHTML = '<p class="vide">La sacoche n\'a pas répondu.</p>'; paraitre();
  }
})();

document.getElementById('retour').onclick = () => location.href = 'hub.html?v=3';
</script>
</body>
</html>
