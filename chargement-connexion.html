<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>Le Rex du Quartier — Bobinage</title>
<style>
:root{--safeT:env(safe-area-inset-top,0px);--safeB:env(safe-area-inset-bottom,0px)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:Georgia,serif;min-height:100dvh;overflow:hidden;
  background:radial-gradient(ellipse at 50% 40%,#4a1220,#2a0a12 55%,#12040a 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  padding:var(--safeT) 0 var(--safeB);
  opacity:0;animation:entre .6s forwards;
}
@keyframes entre{to{opacity:1}}
body.sort{animation:sortie .7s forwards}
@keyframes sortie{to{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
.tourne{animation:spin 1.6s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.pelli{stroke-dasharray:6 8;animation:defile 1s linear infinite}
@keyframes defile{to{stroke-dashoffset:-14}}
.titre{font-size:15px;letter-spacing:.26em;text-transform:uppercase;color:#f7dd9a}
.pct{font-family:'Courier New',monospace;font-size:13px;letter-spacing:.2em;color:#caa24a;min-height:16px}
.vanne{font-family:'Courier New',monospace;font-size:12px;color:#c9a48c;text-align:center;max-width:78vw;line-height:1.6;min-height:38px}

/* ------------------------------------------------------------
   LE CHARGEMENT

   Il y avait une bobine qui tournait, une barre de progression,
   un pourcentage et une vanne différente toutes les trois
   secondes. Beaucoup de spectacle pour dire « patiente ».

   Blanc franc, un mot, trois points. On n'annonce plus de
   pourcentage : il était faux la moitié du temps, et une barre
   qui stagne inquiète plus qu'elle ne rassure.
   ------------------------------------------------------------ */
html,body{background:#fff !important}
body{margin:0;min-height:100vh;min-height:100dvh;
  display:flex;align-items:center;justify-content:center;
  font-family:'Outfit',system-ui,sans-serif}
.chg{font-family:'Marcellus',Georgia,serif;font-size:18px;
  letter-spacing:.24em;text-indent:.24em;color:#3a3230}
.chg i{font-style:normal;opacity:0;animation:chgPoint 1.4s infinite}
.chg i:nth-child(2){animation-delay:.22s}
.chg i:nth-child(3){animation-delay:.44s}
@keyframes chgPoint{0%,66%,100%{opacity:0}22%,60%{opacity:1}}
@media (prefers-reduced-motion:reduce){
  .chg i{animation:none;opacity:1}
}
</style>
</head>
<body>
<div class="chg">Chargement<i>.</i><i>.</i><i>.</i></div>

<script>

/* Les éléments d'habillage (pourcentage, vanne, barre) ont disparu
   avec la refonte du chargement. Plutôt que de parsemer le script
   de vérifications, on rend ces accès inoffensifs : un objet muet
   qui accepte tout ce qu'on lui écrit. */
const __muet = new Proxy({}, {get:()=>(()=>{}), set:()=>true});
function __el(id){ return document.getElementById(id) || __muet; }

/* ============================================================
   CONTRÔLE DE VERSION — avant toute chose

   Cette page s'affiche à chaque connexion : c'est l'endroit idéal
   pour rattraper une version périmée. On compare le tampon courant
   à celui réellement servi par le serveur. S'ils diffèrent, on
   purge le cache et on recharge CETTE page ; elle repartira alors
   sur des fichiers neufs et enverra le joueur vers un jeu à jour.

   Le tampon VERSION est mis à jour automatiquement par le
   cache-bust global à chaque déploiement.
   ============================================================ */
const VERSION = "becf21cb";

async function verifieVersion(){
  /* on n'ennuie le serveur qu'une fois par session de navigation */
  try{
    if(sessionStorage.getItem("version_verifiee") === VERSION) return;
  }catch(e){}

  try{
    const rep = await fetch("jeu.html?sonde=" + Date.now(), {
      cache: "reload", credentials: "same-origin"
    });
    if(!rep.ok) return;
    const html = await rep.text();
    const m = html.match(/\?v=([0-9a-f]{8})/);
    const serveur = m ? m[1] : null;

    try{ sessionStorage.setItem("version_verifiee", VERSION); }catch(e){}

    /* le serveur a du neuf que ce chargement n'a pas : on se rafraîchit */
    if(serveur && serveur !== VERSION){
      /* purge des caches applicatifs et des service workers */
      try{
        if(window.caches && caches.keys){
          const noms = await caches.keys();
          await Promise.all(noms.map(n => caches.delete(n)));
        }
      }catch(e){}
      try{
        if(navigator.serviceWorker && navigator.serviceWorker.getRegistrations){
          const rs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(rs.map(r => r.unregister()));
        }
      }catch(e){}
      /* on recharge cette page sous une adresse jamais vue */
      location.replace("chargement-connexion.html?frais=" + Date.now());
      /* on stoppe tout : le rechargement prend le relais */
      throw new Error("rafraichissement");
    }
  }catch(e){
    if(String(e.message) === "rafraichissement") throw e;
    /* réseau capricieux : on continue sans bloquer la connexion */
  }
}

/* on lance la vérification, mais elle ne doit jamais empêcher
   d'entrer dans le jeu si le réseau coince */
const versionOK = verifieVersion().catch(()=>{});

/* ============================================================
   POINT DE CONTRÔLE — la destination dépend de l'état officiel
   ============================================================ */
if(!localStorage.getItem("rex_session")) location.replace("index.html");

const SB_URL = "https://zpfkekiavlfphialvphi.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpwZmtla2lhdmxmcGhpYWx2cGhpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3Mjc4MzIsImV4cCI6MjEwMTMwMzgzMn0.ORa4y_AMjuWbxboKm3o6Jn7ryYjkOm4mSgLa2Schv98";

let DESTINATION = "jeu.html";
let etapesFaites = 0;
const TOTAL_ETAPES = 4;

function sess(){ try{ return JSON.parse(localStorage.getItem("rex_session")); }catch(e){ return null; } }

async function lit(chemin){
  const s = sess();
  const rep = await fetch(SB_URL + "/rest/v1/" + chemin, {
    headers:{"apikey":SB_KEY, "Authorization":"Bearer " + s.access_token}
  });
  if(rep.status === 401) throw new Error("session");
  return rep.json();
}

async function renouvelle(){
  const s = sess();
  if(!s?.refresh_token) return false;
  const rep = await fetch(SB_URL + "/auth/v1/token?grant_type=refresh_token", {
    method:"POST", headers:{"apikey":SB_KEY,"Content-Type":"application/json"},
    body: JSON.stringify({refresh_token:s.refresh_token})
  });
  if(!rep.ok) return false;
  const d = await rep.json();
  if(!d.access_token) return false;
  localStorage.setItem("rex_session", JSON.stringify({...s,
    access_token:d.access_token, refresh_token:d.refresh_token || s.refresh_token,
    user_id: d.user?.id || s.user_id, expire_le: Date.now() + (d.expires_in||3600)*1000}));
  return true;
}

/* la progression affichée suit les étapes réellement terminées */
const controle = (async ()=>{
  try{
    const s = sess();
    if(s?.expire_le && Date.now() > s.expire_le - 60000){
      if(!await renouvelle()){ localStorage.removeItem("rex_session"); location.replace("index.html"); return; }
    }
    etapesFaites = 1;

    const cinemas = await lit(`cinemas?user_id=eq.${sess().user_id}&select=*`);
    if(!Array.isArray(cinemas) || cinemas.length === 0){ DESTINATION = "inscription.html"; etapesFaites = TOTAL_ETAPES; return; }
    const cine = cinemas[0];
    etapesFaites = 2;

    /* une salle au minimum : rattrapage des anciennes parties */
    const salles = await lit(`salles?cinema_id=eq.${cine.id}&select=id&limit=1`);
    etapesFaites = 3;

    /* état de la journée : un bilan en attente prend la priorité */
    const journees = await lit(`journees?cinema_id=eq.${cine.id}&jour=eq.${cine.jour}&select=statut,resultats`);
    const j = Array.isArray(journees) && journees[0];
    if(j && j.statut === "running" && j.resultats) DESTINATION = "bilan.html";
    else DESTINATION = "jeu.html";
    etapesFaites = TOTAL_ETAPES;
  }catch(e){
    if(String(e.message) === "session"){
      if(!await renouvelle()){ localStorage.removeItem("rex_session"); location.replace("index.html"); return; }
    }
    /* réseau capricieux : on laisse jeu.html gérer, il rechargera l'état officiel */
    DESTINATION = "jeu.html";
    etapesFaites = TOTAL_ETAPES;
  }
})();

const VANNES = [
  "« Sens de rotation ? Aucune idée. Ça tourne, c'est déjà Cannes. »",
  "« La pellicule fait 2 km. J'ai compté. Une fois. Jamais deux. »",
  "« Je graisse la manivelle. Avec du beurre. On fait avec ce qu'on a. »",
  "« Le projecteur chauffe. Moi aussi. On est une équipe. »",
  "« Ta salle arrive. Je passe un coup de balai entre les rangs 3 et 4. »"
];

const elPct = __el("pct");
const elVanne = __el("vanne");
elVanne.textContent = VANNES[Math.floor(Math.random()*VANNES.length)];

let p = 0, fini = false;
const debut = Date.now();
let derniereVanne = Date.now();

const timer = setInterval(()=>{
  /* le pourcentage suit les étapes réellement terminées */
  const cible = Math.round((etapesFaites / TOTAL_ETAPES) * 100);
  if(p < cible) p = Math.min(cible, p + 14);

  if(Date.now()-derniereVanne > 3000){
    elVanne.textContent = VANNES[Math.floor(Math.random()*VANNES.length)];
    derniereVanne = Date.now();
  }
  elPct.textContent = "BOBINAGE… " + Math.floor(p) + "%";

  /* ------------------------------------------------------------
     ON PART DÈS QUE C'EST PRÊT

     Cette condition comparait le temps écoulé à DUREE_MIN — une
     constante qui n'existe que dans chargement.html, pas ici. À
     chaque tic, une fois la barre pleine, la ligne levait une
     ReferenceError : la redirection n'arrivait jamais et l'écran
     restait bloqué à 90 %. Ce n'était pas « trop long », c'était
     infini.

     On enlève aussi l'attente artificielle qui suivait : quand les
     données sont là, on entre dans le cinéma.
     ------------------------------------------------------------ */
  if(p >= 100 && !fini){
    fini = true;
    clearInterval(timer);
    location.replace(DESTINATION);
  }
},50);
</script>
</body>
</html>
