<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#2f6ba0">
<title>Battle Dock — Palma</title>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none}
html,body{height:100%;overflow:hidden;background:#1b3550;
  font-family:'Courier Prime',monospace;color:#fff}
#sc{position:fixed;inset:0;z-index:1}
#sc svg{display:block;width:100%;height:100%}

/* le rideau d'arrivée */
.rid{position:fixed;inset:0;z-index:20;background:#0e1c2e;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  transition:opacity 1.2s}
.rid.parti{opacity:0;pointer-events:none}
.rid .su{font-size:9px;letter-spacing:.34em;text-transform:uppercase;color:#f0c46a}
.rid b{font-size:38px;font-weight:700;letter-spacing:-.01em}
.rid span{font-size:11px;letter-spacing:.2em;text-transform:uppercase;
  color:rgba(255,255,255,.44)}

.tete{position:fixed;left:0;right:0;top:0;z-index:6;
  padding:calc(env(safe-area-inset-top) + 14px) 14px 0;display:flex;align-items:center;gap:10px;
  opacity:0;transition:opacity .8s .6s}
.tete.on{opacity:1}
.tete .ret{flex:0 0 40px;height:40px;border-radius:9px;
  border:1.5px solid rgba(255,255,255,.3);background:rgba(16,34,52,.4);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  display:flex;align-items:center;justify-content:center;cursor:pointer}
.tete .ret svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}
.tete .ou{flex:1;min-width:0;background:rgba(16,34,52,.4);
  border:1.5px solid rgba(255,255,255,.26);border-radius:9px;padding:7px 13px;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.tete .ou b{display:block;font-size:14px;font-weight:700}
.tete .ou span{display:block;font-size:8px;letter-spacing:.18em;text-transform:uppercase;
  color:rgba(255,255,255,.56);margin-top:2px}
.tete .eu{flex:0 0 auto;background:rgba(16,34,52,.4);border:1.5px solid rgba(255,255,255,.26);
  border-radius:9px;padding:9px 12px;backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);font-size:12.5px;font-weight:700;color:#ffd894}

/* ce qu'on te dit en arrivant */
.dit{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 108px);
  z-index:5;padding:0 22px;opacity:0;transition:opacity .8s 1s}
.dit.on{opacity:1}
.dit p{font-size:14.5px;line-height:1.7;color:#fff;
  font-family:system-ui,sans-serif;text-shadow:0 2px 14px rgba(8,24,40,.8);
  padding:14px 16px;border-radius:11px;background:rgba(16,34,52,.5);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.14)}

.bas{position:fixed;left:14px;right:14px;bottom:0;z-index:6;
  padding-bottom:calc(env(safe-area-inset-bottom) + 14px);display:flex;gap:7px;
  opacity:0;transition:opacity .8s 1.2s}
.bas.on{opacity:1}
.bas button{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:11px 3px;border:1.5px solid rgba(255,255,255,.26);border-radius:9px;
  background:rgba(16,34,52,.5);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);cursor:pointer;
  font-family:'Courier Prime',monospace;transition:transform .11s}
.bas button:active{transform:scale(.95)}
.bas button:disabled{opacity:.4;cursor:default}
.bas button.vif{border-color:rgba(240,196,106,.75);background:rgba(52,44,26,.6)}
.bas svg{width:20px;height:20px;stroke:rgba(255,255,255,.72);fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.bas button.vif svg{stroke:#f0c46a}
.bas span{font-size:9px;color:rgba(255,255,255,.72);text-align:center;line-height:1.2}
.bas button.vif span{color:#f0c46a;font-weight:700}

.onde{will-change:transform}
.o0{animation:v0 30s linear infinite}.o1{animation:v1 40s linear infinite}
.o2{animation:v0 52s linear infinite}.o3{animation:v1 64s linear infinite}
@keyframes v0{to{transform:translateX(50px)}}
@keyframes v1{to{transform:translateX(-50px)}}
.amarre{animation:souleve 6.4s ease-in-out infinite}
@keyframes souleve{0%,50%,100%{transform:translateY(0)}
  25%{transform:translateY(-3px)}75%{transform:translateY(2.2px)}}

.nue{animation:derive 140s linear infinite}
.nue.n1{animation-duration:190s}.nue.n2{animation-duration:110s}
@keyframes derive{to{transform:translateX(620px)}}

@media (prefers-reduced-motion:reduce){*{animation:none !important}}

/* ---------- le voile ---------- */
.voile{position:fixed;inset:0;z-index:20;background:rgba(8,18,30,.6);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  opacity:0;pointer-events:none;transition:opacity .24s}
.voile.on{opacity:1;pointer-events:auto}

/* ---------- les contrats ---------- */
.ct{position:fixed;z-index:22;left:14px;right:14px;
  top:calc(env(safe-area-inset-top) + 76px);max-width:352px;margin:0 auto;
  max-height:calc(100vh - env(safe-area-inset-top) - 118px);overflow-y:auto;
  background:rgba(16,32,50,.96);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:2px solid rgba(255,255,255,.28);border-radius:10px;
  box-shadow:0 14px 44px rgba(6,16,28,.66);
  opacity:0;transform:scale(.94) translateY(10px);pointer-events:none;
  transition:opacity .22s,transform .26s cubic-bezier(.2,.9,.3,1)}
.ct.on{opacity:1;transform:none;pointer-events:auto}
.ct::-webkit-scrollbar{display:none}
.ct .haut{display:flex;align-items:center;padding:14px 15px;
  border-bottom:1px solid rgba(255,255,255,.14);
  background:linear-gradient(180deg,rgba(255,255,255,.07),transparent)}
.ct .haut .ti{flex:1}
.ct .haut b{display:block;font-size:15px;color:#fff;font-weight:700;letter-spacing:.04em}
.ct .haut span{display:block;font-size:8px;letter-spacing:.16em;text-transform:uppercase;
  color:rgba(255,255,255,.5);margin-top:3px}
.ct .haut .fer{background:none;border:0;cursor:pointer;color:rgba(255,255,255,.5);
  font-size:22px;line-height:1;padding:3px 2px}
.ct .cale{padding:11px 15px;font-size:11px;color:rgba(255,255,255,.5);
  border-bottom:1px solid rgba(255,255,255,.1);font-family:system-ui,sans-serif}
.ct .cale b{color:#f0c46a;font-family:'Courier Prime',monospace}
.ct ul{list-style:none}
.ct li{padding:15px;border-bottom:1px solid rgba(255,255,255,.08)}
.ct li:last-child{border-bottom:0}
.ct li.rien{text-align:center;color:rgba(255,255,255,.4);font-size:12px;
  padding:26px 15px;font-family:system-ui,sans-serif}
.ct li .l1{display:flex;align-items:flex-start;gap:12px}
.ct li .l1 .tx{flex:1;min-width:0}
.ct li .l1 b{display:block;font-size:15px;color:#fff;font-weight:700}
.ct li .l1 .no{display:block;font-size:11.5px;color:rgba(255,255,255,.5);margin-top:5px;
  font-family:system-ui,sans-serif;line-height:1.5}
.ct li .l1 .px{flex:0 0 auto;text-align:right}
.ct li .l1 .px em{display:block;font-style:normal;font-size:19px;font-weight:700;
  color:#ffd894}
.ct li .l1 .px .de{display:block;font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  margin-top:4px}
.ct li .l2{display:flex;align-items:center;gap:10px;margin-top:12px}
.ct li .l2 .kg{flex:1;font-size:10.5px;color:rgba(255,255,255,.4);
  font-family:system-ui,sans-serif}
.ct li .l2 .kg i{display:block;font-style:normal;margin-top:3px}
.ct li button{flex:0 0 auto;padding:11px 20px;border:0;border-radius:8px;cursor:pointer;
  background:linear-gradient(180deg,#f6cd76,#dca94a);color:#1c1a16;
  font-family:'Courier Prime',monospace;font-size:12.5px;font-weight:700}
.ct li button:disabled{background:rgba(255,255,255,.08);color:rgba(255,255,255,.34);
  cursor:default}
.ct li.pris{background:rgba(140,224,168,.06)}
.ct .mot{padding:13px 15px;border-top:1px solid rgba(255,255,255,.14);
  font-size:10px;color:rgba(255,255,255,.36);line-height:1.6;text-align:center;
  font-family:system-ui,sans-serif}

</style>
</head>
<body>

<div id="sc"></div>

<div class="rid" id="rid">
  <p class="su">Deux jours de mer</p>
  <b>Palma</b>
  <span>Majorque</span>
</div>

<div class="tete" id="tete">
  <span class="ou"><b>Palma</b><span>Majorque</span></span>
  <span class="eu" id="eu">—</span>
</div>

<div class="dit" id="dit"><p id="d-t">—</p></div>

<div class="voile" id="voile"></div>

<section class="ct" id="ct">
  <div class="haut">
    <span class="ti"><b>Les contrats</b><span id="k-ou">Ce que Pere te confie</span></span>
    <button class="fer" id="k-fer">×</button>
  </div>
  <p class="cale">Ta cale : <b id="k-cale">—</b></p>
  <ul id="k-liste"><li class="rien">On regarde ce qu'il y a…</li></ul>
  <p class="mot" id="k-mot"></p>
</section>

<div class="bas" id="bas"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="bd.js"></script>
<script>
/* ============================================================
   PALMA — la Seu vue depuis la mer, en fin d'après-midi
   ============================================================ */
const W = 480, F = 727, OEIL = 2.2, HORIZON = 330;
const px = (m,d) => m*F/d, sol = d => HORIZON + OEIL*F/d, pX = (X,d) => 240 + X*F/d;
const rnd = s => { const x = Math.sin(s*127.1)*43758.5; return x - Math.floor(x); };
const rnd2 = (a,b) => { const x = Math.sin(a*127.1+b*311.7)*43758.5; return x - Math.floor(x); };
function hx(c){ return [parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)]; }
function ch(a){ return '#'+a.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join(''); }
function mel(a,b,k){ const A=hx(a),B=hx(b); return ch([0,1,2].map(i=>A[i]+(B[i]-A[i])*k)); }

/* le soleil est bas à tribord : la pierre dorée s'embrase */
const OR = '#ffcf8a', OMBRE = '#3a4260';
const clair = (c,k) => mel(c, OR, k===undefined?.3:k);
const sombre = (c,k) => mel(c, OMBRE, k===undefined?.28:k);
const loin = (c,d) => mel(c, mel('#e8d8c0', OR, .4), Math.min(.5, Math.pow(d/300,.8)));

let HAUT=-200, BAS=900;
function cadrer(l,h){
  const t = W*h/l;
  HAUT = HORIZON - t*.66; BAS = HAUT + t;
  return { y:HAUT, h:t };
}

/* ---------- le ciel et la baie ---------- */
function ciel(){
  let s = `<defs>
    <linearGradient id="p-ciel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#2f6ba0"/>
      <stop offset="20%"  stop-color="#5a93bc"/>
      <stop offset="42%"  stop-color="#93b8ce"/>
      <stop offset="62%"  stop-color="#cdcdc4"/>
      <stop offset="80%"  stop-color="#eecfa0"/>
      <stop offset="94%"  stop-color="#f8dcaa"/>
      <stop offset="100%" stop-color="#fce4b8"/></linearGradient>
    <linearGradient id="p-eau" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#dcc498"/>
      <stop offset="5%"   stop-color="#a8b8a8"/>
      <stop offset="18%"  stop-color="#5e9aa8"/>
      <stop offset="42%"  stop-color="#3a7e98"/>
      <stop offset="72%"  stop-color="#276484"/>
      <stop offset="100%" stop-color="#1b4c6c"/></linearGradient>
    <radialGradient id="p-halo" cx="0.5" cy="0.5">
      <stop offset="0%"   stop-color="${OR}" stop-opacity=".54"/>
      <stop offset="46%"  stop-color="${OR}" stop-opacity=".16"/>
      <stop offset="100%" stop-color="${OR}" stop-opacity="0"/></radialGradient>
    <filter id="p-flou"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>`;
  const yh = sol(2000);
  s += `<rect x="0" y="${HAUT}" width="${W}" height="${(yh-HAUT).toFixed(1)}" fill="url(#p-ciel)"/>`;
  /* le soleil, bas à droite */
  s += `<ellipse cx="404" cy="${(yh-52).toFixed(0)}" rx="230" ry="170" fill="url(#p-halo)"/>`;
  s += `<circle cx="404" cy="${(yh-52).toFixed(0)}" r="19" fill="#fff4d8"/>`;

  /* les nuages, étalés sur toute la hauteur du ciel */
  for (let i = 0; i < 16; i++){
    const y = HAUT + 20 + rnd(i*7)*((yh-HAUT)*.82);
    const x = -60 + rnd(i*11)*580;
    s += `<g class="nue n${i%3}"><ellipse cx="${x.toFixed(0)}" cy="${y.toFixed(0)}"
      rx="${(44+rnd(i*3)*140).toFixed(0)}" ry="${(4+rnd(i*5)*10).toFixed(0)}"
      fill="${mel('#ffffff', OR, .2 + (y-HAUT)/(yh-HAUT)*.5)}"
      opacity="${(.14+rnd(i)*.26).toFixed(2)}"/></g>`;
  }
  /* l'eau */
  s += `<rect x="0" y="${yh.toFixed(1)}" width="${W}" height="${(BAS-yh+10).toFixed(1)}"
    fill="url(#p-eau)"/>`;
  /* le chemin du soleil */
  s += `<path d="M386 ${yh.toFixed(0)} L422 ${yh.toFixed(0)} L560 ${(BAS+20).toFixed(0)}
    L246 ${(BAS+20).toFixed(0)} Z" fill="${OR}" filter="url(#p-flou)" opacity=".26"/>`;
  /* la houle */
  for (let n = 0; n < 11; n++){
    const d = 900/Math.pow(n+1,1.24), y = sol(d);
    if (y > BAS-2 || y < yh) continue;
    const amp = px(.2,d), esp = px(7,d);
    let p = `M-150 ${y.toFixed(1)} `;
    for (let k=0;k<24;k++) p += `q${(esp*.5).toFixed(1)} ${(-amp).toFixed(1)} ${esp.toFixed(1)} 0 `;
    s += `<g class="onde o${n%4}"><path d="${p}" stroke="#fff"
      stroke-width="${Math.max(.4,amp*.36).toFixed(2)}" fill="none"
      opacity="${(.17-n*.013).toFixed(3)}"/></g>`;
  }
  return s;
}

/* ---------- la Seu : la cathédrale, énorme, au bord de l'eau ---------- */
function cathedrale(){
  const d = 190, y = sol(d), m = u => px(u, d), cx = pX(-1.6, d);
  const P  = loin('#e8cf9a', d);          /* le grès doré */
  const PC = clair('#fbe6bc', .34);       /* ce que le soleil touche */
  const PO = sombre('#b09a6c', .2);       /* l'ombre */
  const TO = sombre('#7a6a54', .24);      /* les toits */
  let s = `<g class="seu">`;

  /* --- la terrasse qui la porte, au-dessus de l'eau --- */
  s += `<path d="M${(cx-m(56)).toFixed(1)} ${y.toFixed(1)} v${(-m(9)).toFixed(1)}
    h${m(112).toFixed(1)} v${m(9).toFixed(1)} z" fill="${PO}"/>`;
  s += `<path d="M${(cx-m(56)).toFixed(1)} ${(y-m(9)).toFixed(1)}
    h${m(112).toFixed(1)} v${m(1.4).toFixed(1)} h${(-m(112)).toFixed(1)} z" fill="${PC}"/>`;
  /* les arcs du soubassement */
  for (let k = 0; k < 16; k++){
    const x = cx - m(53) + m(k * 7);
    s += `<path d="M${x.toFixed(1)} ${y.toFixed(1)} v${(-m(4.4)).toFixed(1)}
      a${m(2.2).toFixed(1)} ${m(2.4).toFixed(1)} 0 0 1 ${m(4.4).toFixed(1)} 0
      v${m(4.4).toFixed(1)} z" fill="${sombre('#5a5a5e',.3)}" opacity=".62"/>`;
  }

  /* --- le corps de la nef --- */
  const H = 44;
  s += `<path d="M${(cx-m(38)).toFixed(1)} ${(y-m(9)).toFixed(1)} v${(-m(H)).toFixed(1)}
    h${m(76).toFixed(1)} v${m(H).toFixed(1)} z" fill="${P}"/>`;
  /* le pan de droite, en plein soleil */
  s += `<path d="M${(cx+m(14)).toFixed(1)} ${(y-m(9)).toFixed(1)} v${(-m(H)).toFixed(1)}
    h${m(24).toFixed(1)} v${m(H).toFixed(1)} z" fill="${PC}" opacity=".5"/>`;
  /* et l'ombre à gauche */
  s += `<path d="M${(cx-m(38)).toFixed(1)} ${(y-m(9)).toFixed(1)} v${(-m(H)).toFixed(1)}
    h${m(11).toFixed(1)} v${m(H).toFixed(1)} z" fill="${PO}" opacity=".4"/>`;

  /* --- les contreforts et leurs arcs-boutants : la signature de la Seu --- */
  for (let k = 0; k < 9; k++){
    const x = cx - m(36) + m(k * 9);
    /* le pilier */
    s += `<path d="M${x.toFixed(1)} ${(y-m(9)).toFixed(1)} v${(-m(H*.82)).toFixed(1)}
      h${m(3.4).toFixed(1)} v${m(H*.82).toFixed(1)} z"
      fill="${k > 4 ? PC : P}" opacity="${k > 4 ? .9 : 1}"/>`;
    /* le pinacle qui le termine */
    s += `<path d="M${(x-m(.6)).toFixed(1)} ${(y-m(9+H*.82)).toFixed(1)}
      l${m(2.3).toFixed(1)} ${(-m(5.5)).toFixed(1)} l${m(2.3).toFixed(1)} ${m(5.5).toFixed(1)} z"
      fill="${k > 4 ? PC : sombre(P,.14)}"/>`;
    /* l'arc-boutant, qui rejoint la nef */
    if (k < 8)
      s += `<path d="M${(x+m(3.4)).toFixed(1)} ${(y-m(9+H*.5)).toFixed(1)}
        q${m(2.8).toFixed(1)} ${(-m(3.4)).toFixed(1)} ${m(5.6).toFixed(1)} ${(-m(1)).toFixed(1)}"
        stroke="${sombre(P,.1)}" stroke-width="${m(1.2).toFixed(1)}" fill="none"/>`;
  }

  /* --- les hautes fenêtres, entre les contreforts --- */
  for (let k = 0; k < 8; k++){
    const x = cx - m(31.5) + m(k * 9);
    s += `<path d="M${x.toFixed(1)} ${(y-m(14)).toFixed(1)} v${(-m(22)).toFixed(1)}
      a${m(2.1).toFixed(1)} ${m(3).toFixed(1)} 0 0 1 ${m(4.2).toFixed(1)} 0
      v${m(22).toFixed(1)} z" fill="${sombre('#4a4a52',.24)}" opacity=".72"/>`;
    /* un éclat de vitrail */
    s += `<path d="M${(x+m(.4)).toFixed(1)} ${(y-m(16)).toFixed(1)} v${(-m(18)).toFixed(1)}
      a${m(1.6).toFixed(1)} ${m(2.4).toFixed(1)} 0 0 1 ${m(1.4).toFixed(1)} ${(-m(.2)).toFixed(1)}"
      stroke="${clair('#c98a5a',.4)}" stroke-width="${m(.6).toFixed(1)}" fill="none" opacity=".5"/>`;
  }

  /* --- le toit --- */
  s += `<path d="M${(cx-m(39)).toFixed(1)} ${(y-m(9+H)).toFixed(1)}
    h${m(78).toFixed(1)} l${(-m(6)).toFixed(1)} ${(-m(7)).toFixed(1)}
    h${(-m(66)).toFixed(1)} z" fill="${TO}"/>`;
  s += `<path d="M${(cx-m(39)).toFixed(1)} ${(y-m(9+H)).toFixed(1)}
    h${m(30).toFixed(1)} l${(-m(2.4)).toFixed(1)} ${(-m(7)).toFixed(1)}
    h${(-m(25.6)).toFixed(1)} z" fill="${clair(TO,.2)}"/>`;

  /* --- la rosace, sur le pignon ouest --- */
  const rx = cx - m(30), ry = y - m(9 + H * .62);
  s += `<circle cx="${rx.toFixed(1)}" cy="${ry.toFixed(1)}" r="${m(7).toFixed(1)}"
    fill="${sombre('#4a4a52',.22)}"/>`;
  s += `<circle cx="${rx.toFixed(1)}" cy="${ry.toFixed(1)}" r="${m(5.6).toFixed(1)}"
    fill="${sombre('#6a4a52',.2)}"/>`;
  for (let k = 0; k < 12; k++){
    const a = k * Math.PI / 6;
    s += `<path d="M${rx.toFixed(1)} ${ry.toFixed(1)}
      l${(Math.cos(a)*m(5.6)).toFixed(1)} ${(Math.sin(a)*m(5.6)).toFixed(1)}"
      stroke="${P}" stroke-width="${m(.7).toFixed(1)}"/>`;
  }
  s += `<circle cx="${rx.toFixed(1)}" cy="${ry.toFixed(1)}" r="${m(1.6).toFixed(1)}" fill="${P}"/>`;

  /* --- le clocher, à gauche --- */
  const bx = cx - m(43);
  s += `<path d="M${(bx-m(5)).toFixed(1)} ${(y-m(9)).toFixed(1)} v${(-m(H+13)).toFixed(1)}
    h${m(10).toFixed(1)} v${m(H+13).toFixed(1)} z" fill="${P}"/>`;
  s += `<path d="M${(bx+m(2)).toFixed(1)} ${(y-m(9)).toFixed(1)} v${(-m(H+13)).toFixed(1)}
    h${m(3).toFixed(1)} v${m(H+13).toFixed(1)} z" fill="${PC}" opacity=".6"/>`;
  /* les abat-sons */
  [0,1].forEach(q =>
    s += `<path d="M${(bx-m(2.6)).toFixed(1)} ${(y-m(9+H+2+q*5)).toFixed(1)}
      v${(-m(4)).toFixed(1)} a${m(2.6).toFixed(1)} ${m(2.8).toFixed(1)} 0 0 1 ${m(5.2).toFixed(1)} 0
      v${m(4).toFixed(1)} z" fill="${sombre('#3e3e46',.24)}" opacity=".7"/>`);
  /* le couronnement crénelé */
  s += `<path d="M${(bx-m(6)).toFixed(1)} ${(y-m(9+H+13)).toFixed(1)}
    h${m(12).toFixed(1)} v${m(2).toFixed(1)} h${(-m(12)).toFixed(1)} z" fill="${PC}"/>`;
  for (let k = 0; k < 5; k++)
    s += `<path d="M${(bx-m(5.4)+m(k*2.6)).toFixed(1)} ${(y-m(9+H+15)).toFixed(1)}
      h${m(1.5).toFixed(1)} v${(-m(2)).toFixed(1)} h${(-m(1.5)).toFixed(1)} z" fill="${PC}"/>`;

  /* --- l'abside, à droite, plus basse --- */
  s += `<path d="M${(cx+m(38)).toFixed(1)} ${(y-m(9)).toFixed(1)} v${(-m(H*.66)).toFixed(1)}
    h${m(13).toFixed(1)} v${m(H*.66).toFixed(1)} z" fill="${PC}" opacity=".82"/>`;
  s += `<path d="M${(cx+m(37)).toFixed(1)} ${(y-m(9+H*.66)).toFixed(1)}
    h${m(15).toFixed(1)} l${(-m(2)).toFixed(1)} ${(-m(4)).toFixed(1)}
    h${(-m(11)).toFixed(1)} z" fill="${clair(TO,.26)}"/>`;

  return s + `</g>`;
}

/* ---------- la ville basse, qui l'entoure ---------- */
function ville(){
  let s = '';
  /* les maisons, sur deux rangs, de part et d'autre de la cathédrale */
  [[230, 1], [205, 2]].forEach(([d, rang]) => {
    const y = sol(d), m = u => px(u, d);
    for (let k = 0; k < 30; k++){
      /* on saute la bande centrale : la cathédrale y est */
      const X = -70 + k * 4.8 + rnd(k * 3 + rang) * 2;
      if (Math.abs(X + 1.6) < 42) continue;
      const h = 5 + rnd(k * 11 + rang) * 8;
      const l = 3.4 + rnd(k * 5 + rang) * 3;
      const x = pX(X, d);
      if (x < -40 || x > W + 40) continue;
      const c = ['#e8d4a8','#dcc79c','#e0cb9e','#d4bc90'][k % 4];
      s += `<path d="M${x.toFixed(1)} ${y.toFixed(1)} v${(-m(h)).toFixed(1)}
        h${m(l).toFixed(1)} v${m(h).toFixed(1)} z" fill="${loin(c, d)}"/>`;
      /* le toit de tuiles */
      s += `<path d="M${(x-m(.6)).toFixed(1)} ${(y-m(h)).toFixed(1)}
        h${m(l+1.2).toFixed(1)} l${(-m(.7)).toFixed(1)} ${(-m(1.3)).toFixed(1)}
        h${(-m(l-.2)).toFixed(1)} z" fill="${loin('#b86a44', d)}"/>`;
      /* quelques fenêtres */
      for (let q = 0; q < 2; q++)
        if (rnd(k * 7 + q) > .45)
          s += `<rect x="${(x + m(.7 + q * 1.5)).toFixed(1)}"
            y="${(y - m(h * .62 - q * .6)).toFixed(1)}"
            width="${m(.7).toFixed(1)}" height="${m(1.1).toFixed(1)}"
            fill="${loin('#8a7458', d)}" opacity=".6"/>`;
    }
  });

  /* le môle et le phare, à droite */
  const dm = 175, ym = sol(dm), mm = u => px(u, dm);
  s += `<path d="M${pX(24,dm).toFixed(1)} ${ym.toFixed(1)} v${(-mm(3)).toFixed(1)}
    h${(pX(70,dm)-pX(24,dm)).toFixed(1)} v${mm(3).toFixed(1)} z"
    fill="${loin('#c4b494', dm)}"/>`;
  const pxr = pX(64, dm);
  s += `<path d="M${(pxr-mm(2)).toFixed(1)} ${(ym-mm(3)).toFixed(1)}
    v${(-mm(13)).toFixed(1)} h${mm(4).toFixed(1)} v${mm(13).toFixed(1)} z"
    fill="${loin('#f4e8cc', dm)}"/>`;
  s += `<path d="M${(pxr-mm(2.7)).toFixed(1)} ${(ym-mm(16)).toFixed(1)}
    h${mm(5.4).toFixed(1)} v${mm(2.4).toFixed(1)} h${(-mm(5.4)).toFixed(1)} z"
    fill="${loin('#7a6a54', dm)}"/>`;

  /* des barques mouillées devant la ville */
  [[110,-24],[96,26],[130,-38],[86,14],[120,40]].forEach(([d,X],k)=>{
    const x = pX(X,d), y = sol(d), m = u => px(u,d);
    if (x < -30 || x > W+30) return;
    s += `<path d="M${(x-m(1.6)).toFixed(1)} ${(y-m(.4)).toFixed(1)}
      q${m(.3).toFixed(1)} ${m(.5).toFixed(1)} ${m(1.6).toFixed(1)} ${m(.5).toFixed(1)}
      q${m(1.3).toFixed(1)} 0 ${m(1.6).toFixed(1)} ${(-m(.5)).toFixed(1)} z"
      fill="${loin('#8a6a44', d)}"/>`;
    if (k % 2)
      s += `<path d="M${x.toFixed(1)} ${(y-m(.5)).toFixed(1)} v${(-m(3.4)).toFixed(1)}"
        stroke="${loin('#6d5a44', d)}" stroke-width="${Math.max(.5,m(.14)).toFixed(1)}"/>`;
  });
  return s;
}

/* ---------- les collines derrière ---------- */
function collines(){
  let s = '';
  [[900, 60, mel('#9ab0a8','#cdd8d0',.5)],
   [520, 52, mel('#8aa090','#c4d0c0',.34)]].forEach(([d, h, c], j) => {
    const y0 = sol(d);
    const crete = u => h + Math.sin(u*5.4+j*2.2)*h*.3 + Math.sin(u*11+j*3)*h*.14;
    let p = `M-40 ${(y0+40).toFixed(1)} `;
    for (let k = 0; k <= 26; k++){
      const u = k/26;
      p += `L${(-40+(W+80)*u).toFixed(1)} ${(y0-px(crete(u),d)).toFixed(1)} `;
    }
    p += `L${(W+40)} ${(y0+40).toFixed(1)} Z`;
    s += `<path d="${p}" fill="${loin(c, d)}"/>`;
  });
  return s;
}

/* ---- palettes ---- */
const BOIS  = ['#b58f60','#c9a374','#a5825c','#96754a','#8a6a42'];
const CLAIR = '#e4c79c', SOMBRE = '#7a5c38', FOND = '#5c4930';

/* ============================================================
   Le dessin. Tout est paramétré par le niveau.
   Repère : la barque est dessinée dans un cadre 300 x 170,
   la ligne de flottaison est à y = 118.
   ============================================================ */
let uidB = 0;

function barqueQ(n, route){
  const P = PALIERS_B[n-1];
  const L = 76 + n * 5.6;            /* longueur */
  const H = 15 + n * 0.62;           /* creux du bordé au-dessus de l'eau */
  const T = 6 + n * 0.34;            /* tirant d'eau */
  const cx = 150, flot = 122;
  const x0 = cx - L / 2;
  const g = v => (x0 + v).toFixed(1);
  const u = 'b' + (++uidB);
  let s = '';

  /* ---------- la ligne de sheer : le haut du bordé ---------- */
  /* étrave relevée à gauche, creux au milieu, poupe relevée à droite */
  const yEtrave = flot - H * 1.28;
  const yCreux  = flot - H * 0.92;
  const yPoupe  = flot - H * 1.12;
  const sheer = `M${g(0)} ${yEtrave.toFixed(1)}
    C${g(L*.2)} ${(yEtrave + (yCreux-yEtrave)*.9).toFixed(1)} ${g(L*.36)} ${yCreux.toFixed(1)} ${g(L*.54)} ${yCreux.toFixed(1)}
    C${g(L*.74)} ${yCreux.toFixed(1)} ${g(L*.9)} ${(yCreux + (yPoupe-yCreux)*.5).toFixed(1)} ${g(L)} ${yPoupe.toFixed(1)}`;

  /* ---------- la coque complète ---------- */
  const coque = sheer
    + ` L${g(L*.965)} ${(flot + T*.42).toFixed(1)}`
    + ` C${g(L*.78)} ${(flot + T).toFixed(1)} ${g(L*.24)} ${(flot + T).toFixed(1)} ${g(L*.055)} ${(flot + T*.3).toFixed(1)}`
    + ` Z`;

  s += `<defs><clipPath id="${u}"><path d="${coque}"/></clipPath></defs>`;

  /* reflet dans l'eau */
  s += `<ellipse cx="${cx}" cy="${(flot + T*.7).toFixed(1)}" rx="${(L*.5).toFixed(0)}" ry="4"
    fill="#0e4a68" opacity=".2"/>`;

  /* la chaloupe (18+), posée en travers du pont */
  if (n >= 18){
    s += `<g transform="translate(${g(L*.58)},${(yCreux - 3).toFixed(1)})">
      <path d="M0 0 q3 8 10 9 h20 q7 -1 10 -9 q-6 3 -13 3 H13 q-7 0 -13 -3 z" fill="#96754a"/>
      <path d="M-1 -2 q5 4 12 4 h18 q7 0 12 -4 v3 q-5 3 -12 3 H11 q-7 0 -12 -3 z" fill="#c9a374"/></g>`;
  }

  /* ---------- le corps de la coque ---------- */
  s += `<path d="${coque}" fill="${BOIS[2]}"/>`;

  /* les bordages : des courbes parallèles au sheer, découpées par la coque */
  const nb = Math.min(7, 3 + Math.floor(n / 3.4));
  s += `<g clip-path="url(#${u})">`;
  for (let i = 0; i < nb; i++){
    const dy = (H + T) * (i / nb);
    const c = BOIS[i % BOIS.length];
    s += `<path d="${sheer}" transform="translate(0,${dy.toFixed(1)})" fill="none"
      stroke="${c}" stroke-width="${((H + T) / nb * 1.5).toFixed(1)}"/>`;
  }
  /* les coutures calfatées (2+) */
  if (n >= 2){
    for (let i = 1; i < nb; i++){
      const dy = (H + T) * (i / nb);
      s += `<path d="${sheer}" transform="translate(0,${dy.toFixed(1)})" fill="none"
        stroke="#3a2c1e" stroke-width=".9" opacity=".45"/>`;
    }
  }
  /* les œuvres vives, sous la flottaison */
  s += `<rect x="0" y="${flot}" width="300" height="60"
    fill="${n >= 10 ? '#33454f' : '#6d5334'}" opacity="${n >= 10 ? '.9' : '.55'}"/>`;
  /* le bordé doublé (16+) */
  if (n >= 16)
    s += `<path d="${sheer}" transform="translate(0,${(H*.9).toFixed(1)})" fill="none"
      stroke="#6d5334" stroke-width="2.4" opacity=".7"/>`;
  s += `</g>`;

  /* ---------- le liston (5+) ---------- */
  if (n >= 5){
    s += `<path d="${sheer}" fill="none" stroke="${CLAIR}" stroke-width="${(2.4 + n*.06).toFixed(1)}"
      stroke-linecap="round"/>`;
  } else {
    s += `<path d="${sheer}" fill="none" stroke="${BOIS[0]}" stroke-width="2" stroke-linecap="round"/>`;
  }
  /* l'ourlet clair du dessus */
  s += `<path d="${sheer}" transform="translate(0,-1)" fill="none" stroke="#f0dcb4"
    stroke-width="1" opacity=".6"/>`;

  /* ---------- l'étrave et l'étambot ---------- */
  s += `<path d="M${g(0)} ${yEtrave.toFixed(1)} C${g(-2)} ${(yEtrave + H*.7).toFixed(1)}
    ${g(1)} ${(flot).toFixed(1)} ${g(L*.055)} ${(flot + T*.3).toFixed(1)}"
    fill="none" stroke="${SOMBRE}" stroke-width="2.6" stroke-linecap="round"/>`;
  s += `<path d="M${g(L)} ${yPoupe.toFixed(1)} L${g(L*.965)} ${(flot + T*.42).toFixed(1)}"
    stroke="${SOMBRE}" stroke-width="2.6" stroke-linecap="round" fill="none"/>`;

  /* ---------- l'intérieur, vu par-dessus le bordé ---------- */
  s += `<path d="${sheer}" transform="translate(0,2.2)" fill="none" stroke="${FOND}"
    stroke-width="${Math.max(2.2, H*.22).toFixed(1)}"/>`;

  /* ---------- le pont ---------- */
  const pont = (a, b, coul, clair) => {
    s += `<path d="${sheer}" transform="translate(0,2)" fill="none" stroke="${coul}"
      stroke-width="${Math.max(2.4, H*.2).toFixed(1)}"
      stroke-dasharray="${(L*(b-a)).toFixed(0)} ${L.toFixed(0)}"
      stroke-dashoffset="${(-L*a).toFixed(0)}"/>`;
    s += `<path d="${sheer}" transform="translate(0,.6)" fill="none" stroke="${clair}"
      stroke-width="1.2" stroke-dasharray="${(L*(b-a)).toFixed(0)} ${L.toFixed(0)}"
      stroke-dashoffset="${(-L*a).toFixed(0)}"/>`;
  };
  if (n >= 11)      pont(.03, .95, '#b8946a', '#dfc094');   /* tillac : pont continu */
  else if (n >= 6)  pont(.04, .34, '#b8946a', '#dfc094');   /* demi-pont avant */

  /* ---------- le banc de nage (3+) ---------- */
  if (n >= 3 && n < 11)
    s += `<rect x="${g(L*.4)}" y="${(yCreux + 1.6).toFixed(1)}" width="${(L*.22).toFixed(0)}"
      height="${Math.max(2, H*.14).toFixed(1)}" rx="1" fill="#8a6a42"/>`;

  /* ---------- les avirons (4+ jusqu'au pont) ---------- */
  if (n >= 4 && n < 11){
    [[L*.34, 'av-1'], [L*.62, 'av-2']].forEach(([dx, cl]) => {
      const ax = +g(dx), ay = yCreux + 1;
      const dep = (flot + 7) - ay;      /* la pelle plonge sous la flottaison */
      /* le tolet, point de pivot */
      s += `<rect x="${(ax-1.4).toFixed(1)}" y="${(ay-3.6).toFixed(1)}" width="2.8" height="4.4"
        rx="1" fill="#6d5334"/>`;
      s += `<g class="aviron ${cl}" style="transform-origin:${ax}px ${ay.toFixed(1)}px">`;
      /* le manche, vers l'intérieur et vers le haut */
      s += `<path d="M${ax} ${ay.toFixed(1)} l-13 -6" stroke="#96754a"
        stroke-width="2.2" stroke-linecap="round"/>`;
      s += `<circle cx="${(ax-13).toFixed(1)}" cy="${(ay-6).toFixed(1)}" r="1.6" fill="#8a6a42"/>`;
      /* le fût, vers l'extérieur et vers l'eau */
      s += `<path d="M${ax} ${ay.toFixed(1)} l21 ${dep.toFixed(1)}" stroke="#a5825c"
        stroke-width="2.4" stroke-linecap="round"/>`;
      /* la pelle */
      s += `<path d="M${(ax+19).toFixed(1)} ${(ay+dep-2).toFixed(1)}
        q5.4 1 7 6 q1.6 5.4 -2 7.4 q-3.8 2 -6.8 -1.6 q-3 -3.6 -1.6 -8.6 z" fill="#c9a374"/>`;
      s += `<path d="M${(ax+19.6).toFixed(1)} ${(ay+dep-1).toFixed(1)}
        q4.4 1.4 5.6 5.4" stroke="#dfc094" stroke-width="1.2" fill="none"/>`;
      s += `</g>`;
    });
  }

  /* ---------- le panneau de cale (12+) ---------- */
  if (n >= 12){
    s += `<rect x="${g(L*.46)}" y="${(yCreux - 1.4).toFixed(1)}" width="${(L*.15).toFixed(0)}"
      height="${Math.max(2.6, H*.12).toFixed(1)}" rx="1" fill="#8a6a42" stroke="#6d5334" stroke-width=".8"/>`;
  }

  /* ---------- le rouf (14+) ---------- */
  if (n >= 14){
    const rx = +g(L*.62), ry = yCreux - 1, rh = H*.5, rw = L*.2;
    s += `<path d="M${rx} ${ry.toFixed(1)} h${rw.toFixed(0)} v-${rh.toFixed(1)} h-${rw.toFixed(0)} z" fill="#c9a374"/>`;
    s += `<path d="M${(rx-2).toFixed(1)} ${(ry-rh).toFixed(1)} h${(rw+4).toFixed(0)} l-2.4 -3.4 h-${(rw-.8).toFixed(0)} z" fill="#8a4a3a"/>`;
    s += `<rect x="${(rx+2.6).toFixed(1)}" y="${(ry-rh+2.4).toFixed(1)}" width="${(rw*.26).toFixed(1)}"
      height="${(rh*.42).toFixed(1)}" fill="#6d8fa4" opacity=".85"/>`;
    s += `<rect x="${(rx+rw*.56).toFixed(1)}" y="${(ry-rh+2.4).toFixed(1)}" width="${(rw*.26).toFixed(1)}"
      height="${(rh*.42).toFixed(1)}" fill="#6d8fa4" opacity=".85"/>`;
  }

  /* ---------- le grand mât (7+) ---------- */
  const mxP = n >= 13 ? .34 : .46;
  if (n >= 7){
    const mx = +g(L * mxP);
    const pied = yCreux + 1;
    const mh = n >= 8 ? 46 + n * 2.3 : 32;
    s += `<path d="M${mx} ${pied.toFixed(1)} v-${mh.toFixed(0)}" stroke="#8a6a42"
      stroke-width="${(2 + n*.07).toFixed(1)}" stroke-linecap="round"/>`;
    s += `<path d="M${(mx-.7).toFixed(1)} ${pied.toFixed(1)} v-${mh.toFixed(0)}" stroke="#c9a374"
      stroke-width=".9" opacity=".7"/>`;
    const ay = pied - mh;

    if (n === 7){
      s += `<path class="voile" d="M${mx} ${(ay+5).toFixed(1)} q15 7 20 21 q-13 5 -20 4 z" fill="#ddd2b6"/>`;
      s += `<path d="M${mx} ${(ay+5).toFixed(1)} q15 7 20 21 q-8 3 -12 3 z" fill="#f0e8d2"/>`;
    } else {
      /* la voile latine : antenne inclinée sur toute la hauteur */
      s += `<path d="M${(mx-20).toFixed(1)} ${(ay + mh*.5).toFixed(1)} L${(mx+34).toFixed(1)} ${(ay-4).toFixed(1)}"
        stroke="#a5825c" stroke-width="2.2" stroke-linecap="round"/>`;
      s += `<path class="voile" d="M${(mx-18).toFixed(1)} ${(ay + mh*.48).toFixed(1)}
        L${(mx+32).toFixed(1)} ${(ay-3).toFixed(1)}
        Q${(mx+14).toFixed(1)} ${(ay + mh*.56).toFixed(1)} ${(mx+2).toFixed(1)} ${pied.toFixed(1)} Z" fill="#e4dbc0"/>`;
      s += `<path d="M${(mx-18).toFixed(1)} ${(ay + mh*.48).toFixed(1)}
        L${(mx+32).toFixed(1)} ${(ay-3).toFixed(1)}
        Q${(mx+20).toFixed(1)} ${(ay + mh*.38).toFixed(1)} ${(mx+8).toFixed(1)} ${(ay + mh*.62).toFixed(1)} Z" fill="#f6f0dc"/>`;
      s += `<g stroke="#c9bfa2" stroke-width=".7" opacity=".65">
        <path d="M${(mx-6).toFixed(1)} ${(ay+mh*.5).toFixed(1)} L${(mx+9).toFixed(1)} ${(pied-5).toFixed(1)}"/>
        <path d="M${(mx+9).toFixed(1)} ${(ay+mh*.26).toFixed(1)} L${(mx+15).toFixed(1)} ${(pied-11).toFixed(1)}"/></g>`;
      s += `<g stroke="#c9b58c" stroke-width=".8" opacity=".75">
        <path d="M${mx} ${(ay+5).toFixed(1)} L${g(L*.1)} ${(yCreux-1).toFixed(1)}"/>
        <path d="M${mx} ${(ay+5).toFixed(1)} L${g(L*.86)} ${(yCreux-1).toFixed(1)}"/></g>`;
    }
  }

  /* ---------- le foc et son beaupré (13+) ---------- */
  if (n >= 13){
    const bx = +g(-8), by = yEtrave - 3;
    const mx = +g(L*mxP), mh = 46 + n*2.3, ay = yCreux + 1 - mh;
    s += `<path d="M${g(L*.02)} ${(yEtrave+2).toFixed(1)} L${bx} ${by.toFixed(1)}"
      stroke="#a5825c" stroke-width="2.2" stroke-linecap="round"/>`;
    s += `<path class="voile" d="M${bx} ${by.toFixed(1)} L${mx} ${(ay + mh*.2).toFixed(1)}
      Q${(bx+17).toFixed(1)} ${(ay + mh*.66).toFixed(1)} ${(bx+12).toFixed(1)} ${(yEtrave+4).toFixed(1)} Z"
      fill="#eee6cc"/>`;
    s += `<path d="M${bx} ${by.toFixed(1)} L${mx} ${(ay + mh*.2).toFixed(1)}
      Q${(bx+24).toFixed(1)} ${(ay + mh*.5).toFixed(1)} ${(bx+20).toFixed(1)} ${(ay + mh*.8).toFixed(1)} Z"
      fill="#f8f2de"/>`;
  }

  /* ---------- le tapecul (15+) ---------- */
  if (n >= 15){
    const mx2 = +g(L*.86), mh2 = 30 + n, pied2 = yCreux + 1;
    s += `<path d="M${mx2} ${pied2.toFixed(1)} v-${mh2.toFixed(0)}" stroke="#8a6a42"
      stroke-width="2.2" stroke-linecap="round"/>`;
    s += `<path d="M${(mx2-12).toFixed(1)} ${(pied2 - mh2*.44).toFixed(1)} L${(mx2+18).toFixed(1)} ${(pied2 - mh2 + 2).toFixed(1)}"
      stroke="#a5825c" stroke-width="1.9" stroke-linecap="round"/>`;
    s += `<path class="voile" d="M${(mx2-10).toFixed(1)} ${(pied2 - mh2*.42).toFixed(1)}
      L${(mx2+16).toFixed(1)} ${(pied2 - mh2 + 3).toFixed(1)}
      Q${(mx2+5).toFixed(1)} ${(pied2 - mh2*.4).toFixed(1)} ${(mx2+2).toFixed(1)} ${pied2.toFixed(1)} Z"
      fill="#e4dbc0"/>`;
  }

  /* ---------- le safran (9+) ---------- */
  if (n >= 9){
    s += `<path d="M${g(L*.97)} ${(flot - H*.5).toFixed(1)} q6 4 6 ${(T*1.1).toFixed(1)}
      q0 ${(T*.5).toFixed(1)} -6 ${(T*.5).toFixed(1)} z" fill="#7a5c38"/>`;
    s += `<path d="M${g(L*.94)} ${(yPoupe + 2).toFixed(1)} l13 -6" stroke="#a5825c"
      stroke-width="2" stroke-linecap="round"/>`;
  }

  /* ---------- le treuil (17+) ---------- */
  if (n >= 17){
    const tx = +g(L*.44);
    s += `<rect x="${(tx-4.4).toFixed(1)}" y="${(yCreux - 6).toFixed(1)}" width="9" height="6" rx="2" fill="#5c6a74"/>`;
    s += `<circle cx="${tx}" cy="${(yCreux - 3).toFixed(1)}" r="2.2" fill="#8a9299"/>`;
  }

  /* ---------- le pavillon (19+) ---------- */
  if (n >= 19){
    const mx = +g(L * mxP), mh = 46 + n * 2.3, tete = yCreux + 1 - mh;
    /* la drisse et le petit mât de pavillon */
    s += `<path d="M${mx} ${tete.toFixed(1)} v-9" stroke="#8a6a42" stroke-width="1.6" stroke-linecap="round"/>`;
    /* le pavillon, qui claque */
    s += `<g class="pavillon" style="transform-origin:${mx}px ${(tete-8).toFixed(1)}px">`;
    s += `<path d="M${mx} ${(tete-9).toFixed(1)} q9 1.6 17 -1.4 q-2 4 0 7.4 q-8 3 -17 1.4 z" fill="#c74a33"/>`;
    s += `<path d="M${mx} ${(tete-9).toFixed(1)} q9 1.6 17 -1.4 q-1 2 -.6 3.6 q-8 2.4 -16.4 1 z" fill="#e0684a"/>`;
    s += `</g>`;
  }

  /* ---------- le nom peint (20) ---------- */
  if (n >= 20)
    s += `<text x="${g(L*.1)}" y="${(flot - H*.34).toFixed(1)}" font-family="Bebas Neue,sans-serif"
      font-size="8.4" letter-spacing="1.2" fill="#f2e6c8" opacity=".85">LA ZIZOUIN</text>`;

  /* ---------- l'eau, selon l'allure ---------- */
  /* la proue est à gauche : le sillage traîne derrière, donc à droite */
  if (route){
    const nv = Math.max(2, Math.round(P.vit * 1.6));
    for (let i = 0; i < nv; i++)
      s += `<path class="sillage sl${i % 3}" d="M${g(L + 4 + i*4)} ${(flot + 1 + i*2.6).toFixed(1)}
        q${(16+i*7).toFixed(0)} 2 ${(30+i*13).toFixed(0)} 0"
        stroke="#fff" stroke-width="${(1.6 - i*.16).toFixed(2)}" fill="none"
        opacity="${(.44 - i*.05).toFixed(2)}"/>`;
    /* la moustache d'étrave, elle, est bien à l'avant */
    s += `<path class="etrave" d="M${g(-3)} ${(flot - 1).toFixed(1)} q-9 4 -19 3"
      stroke="#fff" stroke-width="2" fill="none" opacity=".55"/>`;
    s += `<path class="etrave e2" d="M${g(1)} ${(flot + 2.4).toFixed(1)} q-8 4 -17 3"
      stroke="#fff" stroke-width="1.4" fill="none" opacity=".36"/>`;
    /* le remous sous la poupe */
    s += `<ellipse class="remous" cx="${g(L + 2)}" cy="${(flot + 3).toFixed(1)}" rx="9" ry="2.4"
      fill="#fff" opacity=".24"/>`;
  } else {
    /* au mouillage : la chaîne d'ancre à l'étrave */
    s += `<path d="M${g(L*.03)} ${(yEtrave + 4).toFixed(1)} q-4 8 -3 16"
      stroke="#6d6a62" stroke-width="1.4" fill="none" stroke-dasharray="2 1.6"/>`;
    s += `<path d="M${g(-4)} ${(flot + 2).toFixed(1)} q22 3 40 0"
      stroke="#fff" stroke-width="1.2" fill="none" opacity=".26"/>`;
  }

  return s;
}

/* ---------- ta barque, amarrée au quai ---------- */
function barque(niveau, marque){
  const d = 56, y = sol(d), m = u => px(u,d), x = pX(-11, d);
  /* barqueQ dessine dans un carré de 300, la flottaison à 122 */
  const k = m(2.4 + niveau * .1) / (76 + niveau * 5.6);
  let s = `<g class="amarre">`;
  s += `<ellipse cx="${x.toFixed(1)}" cy="${(y+m(.12)).toFixed(1)}"
    rx="${m(2.6).toFixed(1)}" ry="${m(.3).toFixed(1)}" fill="#12324a" opacity=".28"/>`;
  s += `<g transform="translate(${x.toFixed(1)},${y.toFixed(1)}) scale(${k.toFixed(4)})">`
    + `<g transform="translate(-150,-122)">` + barqueQ(niveau, false) + `</g></g>`;
  /* l'amarre qui monte au quai */
  s += `<path d="M${(x+m(2.1)).toFixed(1)} ${(y-m(.6)).toFixed(1)}
    q${m(1.2).toFixed(1)} ${(-m(.6)).toFixed(1)} ${m(2.2).toFixed(1)} ${(-m(1.4)).toFixed(1)}"
    stroke="${sombre('#8a7a5c',.2)}" stroke-width="${Math.max(.5,m(.1)).toFixed(1)}" fill="none"/>`;
  /* ton pavillon, planté sur le quai à côté de ta barque */
  if (marque){
    const px2 = x + m(2.6);
    s += `<path d="M${px2.toFixed(1)} ${y.toFixed(1)} v${(-m(1.9)).toFixed(1)}"
      stroke="${sombre('#6d5a44',.2)}" stroke-width="${Math.max(.6,m(.1)).toFixed(1)}"/>`;
    s += `<path d="M${px2.toFixed(1)} ${(y-m(1.9)).toFixed(1)}
      l${m(.8).toFixed(1)} ${m(.24).toFixed(1)} l${(-m(.8)).toFixed(1)} ${m(.24).toFixed(1)} z"
      fill="${marque}"/>`;
  }
  return s + `</g>`;
}

function palma(MOI2){
  let s = ciel();
  s += collines();
  s += ville();
  s += cathedrale();
  s += barque((MOI2 && MOI2.barque) || 1, MOI2 && MOI2.couleur);
  s += `<defs><radialGradient id="p-vig" cx="0.5" cy="0.46" r="0.8">
    <stop offset="50%" stop-color="#1b3550" stop-opacity="0"/>
    <stop offset="100%" stop-color="#1b3550" stop-opacity=".2"/></radialGradient></defs>`;
  s += `<rect x="0" y="${HAUT}" width="${W}" height="${(BAS-HAUT).toFixed(1)}" fill="url(#p-vig)"/>`;
  return s;
}


function decor(){
  const v = cadrer(innerWidth, innerHeight);
  document.getElementById('sc').innerHTML =
    '<svg viewBox="0 ' + v.y.toFixed(1) + ' ' + W + ' ' + v.h.toFixed(1) + '" '
    + 'preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">'
    + palma(MOI) + '</svg>';
}

let MOI = null;
let chargesCt = false;

async function poserContrats(d, forcer){
  const el = document.getElementById('k-liste');
  if (!el) return;
  if (chargesCt && !forcer) return;
  chargesCt = true;

  const r = await BD.agir('contrats_du_jour');
  if (!r.ok){
    el.innerHTML = '<li class="rien">' + (r.pourquoi === 'sans_bateau'
      ? "Il te faut un bateau avant qu'on te confie quoi que ce soit."
      : "Rien pour l'instant. Reviens plus tard.") + '</li>';
    document.getElementById('k-cale').textContent = '—';
    return;
  }

  const occupe = (d.cale || []).reduce((n, o) => n + (+o.places || 1), 0);
  const libre = r.places - occupe;
  document.getElementById('k-cale').innerHTML =
    '<b>' + libre + ' / ' + r.places + '</b> ' + (r.places > 1 ? 'places libres' : 'place libre');

  const L = r.contrats || [];
  if (!L.length){
    el.innerHTML = '<li class="rien">Personne ne cherche de bras aujourd\'hui.</li>';
    return;
  }

  el.innerHTML = L.map(c => {
    const pris = c.etat === 'pris';
    const tient = libre >= c.places;
    const d2 = +c.demande, pr = +c.pression || 0;
    /* ce qu'on en dit dépend surtout de ce qui arrive au port là-bas */
    const mot = pr >= 18 ? ['Le port en déborde', '#e08a6a']
      : pr >= 9 ? ['Il en arrive beaucoup', '#e0a878']
      : d2 >= 1.2 ? ['On en manque là-bas', '#8ce0a8']
      : d2 >= 1.02 ? ['La demande est bonne', '#c4d88a']
      : d2 >= 0.85 ? ['Le cours est normal', 'rgba(255,255,255,.5)']
      : ['Ils en ont déjà beaucoup', '#e0a878'];
    return '<li class="' + (pris ? 'pris' : '') + '">'
      + '<div class="l1"><span class="tx"><b>' + c.nom + '</b>'
      + '<span class="no">' + c.note + '</span></span>'
      + '<span class="px"><em>' + c.paie + ' €</em>'
      + '<i style="color:' + mot[1] + '">' + mot[0] + '</i></span></div>'
      + '<div class="l2"><span class="d">' + c.kg + ' kg — '
      + c.places + (c.places > 1 ? ' places' : ' place') + ' en cale'
      + (pr >= 3 ? '<br><span style="color:' + mot[1] + '">'
          + Math.round(pr) + ' livrées ces jours-ci</span>' : '') + '</span>'
      + (pris ? '<span class="fait">À bord ✓</span>'
         : '<button data-c="' + c.id + '"' + (tient ? '' : ' disabled') + '>'
           + (tient ? 'Charger' : 'Cale pleine') + '</button>')
      + '</div></li>';
  }).join('');

  const OU = { anse:'chez toi', barcelone:'à Barcelone', palma:'à Palma' };
  const ou2 = document.getElementById('k-ou');
  if (ou2) ou2.textContent = r.depuis === 'barcelone'
    ? 'Ce que Miquel te confie' : "Ce qu'on te propose aujourd'hui";
  document.getElementById('k-mot').innerHTML =
    'Les contrats changent chaque jour. Tu es payé en arrivant '
    + (OU[r.vers] || 'à destination') + '.<br>'
    + '<span style="color:rgba(255,255,255,.34)">Plus une marchandise arrive là-bas, '
    + 'moins elle vaut — pour tout le monde.</span>';

  el.querySelectorAll('[data-c]').forEach(b =>
    b.onclick = async () => {
      b.disabled = true; b.textContent = '…';
      const p = await BD.agir('prendre_contrat', { p_id: b.dataset.c });
      if (p.ok){
        secousse('bien');
        const f = await BD.charger();
        Object.assign(d, f);
        poserBarre(d); poserMenu(d); poserBarque(d); poserBas(d);
        poserContrats(d, true);
      } else {
        b.textContent = p.pourquoi === 'cale_pleine' ? 'Cale pleine' : 'Impossible';
      }
    });
}



let ctOuvert = false;
function basculerContrats(o, d){
  ctOuvert = o === undefined ? !ctOuvert : o;
  document.getElementById('ct').classList.toggle('on', ctOuvert);
  document.getElementById('voile').classList.toggle('on', ctOuvert);
  if (ctOuvert && d) poserContrats(d);
}
document.getElementById('k-fer').onclick = () => basculerContrats(false);
document.getElementById('voile').onclick = () => basculerContrats(false);

const ICO = {
  frere:'<path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/>',
  marche:'<path d="M4 8h16v13H4zM4 8l2-4h12l2 4M9 21v-7h6v7"/>',
  moulin:'<path d="M12 12v9M8 21h8M12 12L4 6M12 12l8-6M12 12l-6 8M12 12l6 8"/>',
  barque:'<path d="M3 18q2.4 1.6 4.8 0t4.8 0 4.8 0T21 18M5 14h14l-2-4H7zM12 10V4M12 4l6 3-6 2"/>'
};
const LIEUX = [
  { k:'frere',  n:"Le frère d'Ardit", ouvert:false },
  { k:'marche', n:'Le marché',        ouvert:false },
  { k:'moulin', n:'Les moulins',      ouvert:false },
  { k:'barque', n:'Reprendre la mer', ouvert:true }
];



(async () => {
  let d;
  try {
    d = await BD.charger();
    if (!d){ location.href = 'index.html'; return; }
  } catch(e){ return; }
  if (d.parti_le){ location.href = 'mer.html'; return; }
  if (d.port !== 'palma'){ location.href = 'jeu.html'; return; }

  document.getElementById('eu').textContent =
    Number(d.euros || 0).toLocaleString('fr-FR', {minimumFractionDigits:2}) + ' €';

  MOI = { barque: d.barque || 1,
    couleur: ((COULEURS.find(c => c.k === ((d.affaire||{}).couleur)) || {}).c) };
  decor();
  /* où en es-tu avec cette maison ? */
  const aLettre = (d.sacoche || []).some(o => o.k === 'lettre');
  const Q = d.quetes || [];
  const ardit = Q.find(q => q.k === 'ardit');
  const pere  = Q.find(q => q.k === 'pere');
  /* le frère t'attend si tu as porté la lettre et que tu es niveau 4 */
  const suite = !aLettre && ardit && ardit.etape >= 2 && !pere && (d.niveau || 1) >= 4;

  document.getElementById('d-t').textContent =
    aLettre
      ? "La cathédrale te regarde arriver. Quelque part derrière, il y a un homme "
        + "qui ne t'attend pas."
      : pere
        ? "Tu connais le chemin de la ruelle, maintenant. Il y a du drap qui t'attend."
        : suite
          ? "La maison derrière la Seu. Tu ne sais pas s'il y a encore quelqu'un dedans."
          : "Le port sent la résine et le poisson. Personne ne fait attention à toi.";

  LIEUX[0].ouvert = aLettre || suite;
  if (!aLettre && (pere || suite)) LIEUX[0].n = 'Chez Pere';
  /* le chargement s'ouvre quand il te confie son tissu */
  LIEUX[1].n = 'Le chargement';
  LIEUX[1].ouvert = !!pere;
  document.getElementById('bas').innerHTML = LIEUX.map(L =>
    '<button class="' + (L.ouvert ? 'vif' : '') + '" data-k="' + L.k + '"'
    + (L.ouvert ? '' : ' disabled') + '>'
    + '<svg viewBox="0 0 24 24">' + ICO[L.k] + '</svg>'
    + '<span>' + L.n + '</span></button>').join('');

  document.querySelectorAll('[data-k="barque"]').forEach(b =>
    b.onclick = () => location.href = 'voyager.html');
  document.querySelectorAll('[data-k="frere"]').forEach(b =>
    b.onclick = () => location.href = 'ardit.html');
  document.querySelectorAll('[data-k="marche"]').forEach(b =>
    b.onclick = () => basculerContrats(true, d));
  document.querySelectorAll('[data-k="frere"]').forEach(b =>
    b.onclick = () => location.href = 'ardit.html');

  /* le rideau se lève */
  setTimeout(() => {
    document.getElementById('rid').classList.add('parti');
    document.getElementById('tete').classList.add('on');
    document.getElementById('dit').classList.add('on');
    document.getElementById('bas').classList.add('on');
  }, 1600);
})();

let t = null;
addEventListener('resize', () => { clearTimeout(t); t = setTimeout(decor, 200); });
</script>
