<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#101f2e">
<title>Battle Dock — Titou</title>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=DM+Serif+Display&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="couleurs.css?v=2">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none}
html,body{height:100%;overflow:hidden;background:var(--nuit-mer);
  font-family:'Nunito',system-ui,sans-serif;color:#fff}

/* la rue s'efface derrière : on est là pour lire */
#rue{position:fixed;left:0;right:0;top:0;height:42%;overflow:hidden}
#rue svg{display:block;width:100%;height:100%}
#rue::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(10,16,28,.34) 0%,rgba(10,16,28,.12) 30%,
    rgba(10,16,28,.6) 74%,rgba(10,16,28,.97) 100%)}

/* ================= l'avertissement ================= */
.avert{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:24px;padding:34px 30px;
  background:rgba(6,12,22,.95);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  transition:opacity .6s}
.avert.parti{opacity:0;pointer-events:none}
.avert .ic{width:54px;height:54px;border-radius:14px;
  background:rgba(240,196,106,.14);border:1px solid rgba(240,196,106,.34);
  display:flex;align-items:center;justify-content:center}
.avert .ic svg{width:25px;height:25px;stroke:#f0c46a;fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.avert h1{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:#f0c46a;
  text-align:center}
.avert p{font-size:15px;line-height:1.9;color:rgba(255,255,255,.86);
  text-align:center;max-width:330px;font-family:system-ui,sans-serif}
.avert p b{color:#fff;font-weight:600}
.avert p.petit{font-size:13px;color:rgba(255,255,255,.58);line-height:1.8}
.avert button{margin-top:8px;padding:17px 42px;border:0;border-radius:9px;cursor:pointer;
  background:linear-gradient(180deg,#f6cd76,#dca94a);color:#1c1a16;
  box-shadow:0 6px 26px rgba(240,196,106,.3);
  font-family:'Nunito',system-ui,sans-serif;font-size:15px;font-weight:700;letter-spacing:.08em}
.avert button:active{transform:scale(.985)}

/* ================= lui ================= */
.qui{position:fixed;left:0;right:0;top:0;z-index:3;
  padding:calc(env(safe-area-inset-top) + 16px) 22px 0;
  opacity:0;transition:opacity .8s .3s}
.qui.on{opacity:1}
.qui b{display:block;font-size:21px;font-weight:700;letter-spacing:.04em;
  text-shadow:0 2px 16px rgba(4,10,20,.8)}
.qui span{display:block;font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;
  color:rgba(255,255,255,.56);margin-top:4px}

/* ================= la lecture ================= */
.dit{position:fixed;left:0;right:0;bottom:0;top:34%;z-index:4;
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:0 22px calc(env(safe-area-inset-bottom) + 24px);
  background:linear-gradient(180deg,rgba(10,16,28,0) 0,rgba(10,16,28,.94) 30px,
    rgba(10,16,28,.98) 100%)}
.dit::-webkit-scrollbar{display:none}
.lignes{display:flex;flex-direction:column;gap:16px;padding:26px 0 24px}

/* le corps du texte : grand, aéré, contrasté */
.lignes p{font-size:16.5px;line-height:1.78;color:rgba(255,255,255,.82);
  font-family:system-ui,-apple-system,sans-serif;letter-spacing:.005em;
  opacity:0;transform:translateY(9px);
  animation:venir .75s cubic-bezier(.2,.85,.3,1) forwards}
/* ce qu'il dit à voix haute : plus grand, plus blanc */
.lignes p.parle{color:#fff;font-size:18px;line-height:1.66;font-weight:400;
  padding-left:15px;border-left:2.5px solid rgba(240,196,106,.72)}
/* ce que ton instinct te souffle */
.lignes p.souffle{font-size:14.5px;line-height:1.7;color:#a8cbe8;
  padding:14px 15px;background:rgba(90,140,190,.12);
  border:1px solid rgba(138,184,224,.24);border-radius:9px;font-style:normal}
.lignes p.souffle em{display:block;font-style:normal;font-weight:600;
  letter-spacing:.14em;font-size:10px;text-transform:uppercase;
  color:rgba(138,184,224,.75);margin-bottom:7px}
@keyframes venir{to{opacity:1;transform:none}}

/* ================= tes réponses ================= */
.choix{display:flex;flex-direction:column;gap:10px;padding-bottom:8px;
  opacity:0;animation:venir .6s forwards}
.choix button{width:100%;text-align:left;
  padding:16px 17px;border:1.5px solid rgba(255,255,255,.22);border-radius:11px;
  background:rgba(18,28,46,.82);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);cursor:pointer;
  font-family:'Nunito',system-ui,sans-serif;transition:transform .11s,border-color .2s,background .2s}
.choix button:active{transform:scale(.987);background:rgba(28,40,62,.9)}
.choix button b{display:block;font-size:15.5px;font-weight:700;color:#fff;line-height:1.5}
.choix button span.s{display:block;font-size:12.5px;color:rgba(255,255,255,.56);
  margin-top:6px;font-family:system-ui,sans-serif;line-height:1.5}
.choix button .cle{display:inline-block;margin-top:9px;font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;padding:4px 10px;border-radius:12px;
  background:rgba(140,224,168,.16);color:#8ce0a8}
.choix button.ferme{opacity:.46;cursor:default;border-style:dashed}
.choix button.ferme .cle{background:rgba(224,138,106,.16);color:#e08a6a}
.choix button.ferme b{color:rgba(255,255,255,.62)}

/* ================= la fin ================= */
.fin{position:fixed;inset:0;z-index:12;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:18px;padding:34px;
  background:rgba(6,12,22,.94);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  opacity:0;pointer-events:none;transition:opacity .6s}
.fin.on{opacity:1;pointer-events:auto}
.fin .t{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:#f0c46a}
.fin .g{font-size:58px;font-weight:700;line-height:1;color:#ffd894;
  text-shadow:0 0 50px rgba(255,200,120,.3)}
.fin .p{font-size:14.5px;line-height:1.85;color:rgba(255,255,255,.76);text-align:center;
  max-width:320px;font-family:system-ui,sans-serif}
.fin .plus{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin-top:4px}
.fin .plus span{font-size:12px;padding:8px 14px;border-radius:20px;
  background:rgba(140,224,168,.14);color:#8ce0a8;border:1px solid rgba(140,224,168,.26)}
.fin .caisse:empty{display:none}
.fin .caisse{display:flex;align-items:center;gap:12px;margin-top:6px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);
  border-radius:10px;padding:14px 16px;max-width:320px}
.fin .caisse .ic{flex:0 0 36px;height:36px;border-radius:8px;
  background:rgba(201,163,116,.18);display:flex;align-items:center;justify-content:center}
.fin .caisse .ic svg{width:19px;height:19px;stroke:#c9a374;fill:none;stroke-width:1.7}
.fin .caisse .tx b{display:block;font-size:13.5px;color:#fff}
.fin .caisse .tx span{display:block;font-size:11.5px;color:rgba(255,255,255,.5);
  margin-top:3px;font-family:system-ui,sans-serif;line-height:1.5}
.fin button{margin-top:10px;padding:17px 40px;border:0;border-radius:9px;cursor:pointer;
  background:linear-gradient(180deg,#f6cd76,#dca94a);color:#1c1a16;
  font-family:'Nunito',system-ui,sans-serif;font-size:15px;font-weight:700;letter-spacing:.08em}

/* ================= le décor ================= */
.linge{animation:flotte 9s ease-in-out infinite}
@keyframes flotte{0%,100%{transform:skewX(-2.4deg)}50%{transform:skewX(2.4deg)}}
.platane{animation:souffle 15s ease-in-out infinite;transform-origin:50% 100%}
@keyframes souffle{0%,100%{transform:rotate(-.26deg)}50%{transform:rotate(.26deg)}}
.lampe{animation:veilleuse 6s ease-in-out infinite}
@keyframes veilleuse{0%,100%{opacity:.86}48%{opacity:1}}
.etoile{animation:scint 4.4s ease-in-out infinite}
.e1{animation-duration:6s;animation-delay:-1.4s}
.e2{animation-duration:3.4s;animation-delay:-2.6s}
@keyframes scint{0%,100%{opacity:.18}50%{opacity:.62}}
.pnj{animation:attend 6.4s ease-in-out infinite}
@keyframes attend{0%,100%{transform:translateY(0)}50%{transform:translateY(-.7px)}}
.clope{animation:braise 4.2s ease-in-out infinite}
@keyframes braise{0%,100%{opacity:.5}18%{opacity:1}30%{opacity:.6}}
.fumee{animation:monte 7s ease-in-out infinite}
@keyframes monte{0%{opacity:.22;transform:translate(0,0) scale(1)}
  100%{opacity:0;transform:translate(3px,-9px) scale(1.7)}}
.signe{display:none}
@media (prefers-reduced-motion:reduce){*{animation:none !important}}

/* ---------- ce qui vit sur le quai ---------- */
.onde{will-change:transform}
.o0{animation:w0 30s linear infinite}.o1{animation:w1 42s linear infinite}
.o2{animation:w0 54s linear infinite}.o3{animation:w1 68s linear infinite}
@keyframes w0{to{transform:translateX(50px)}}
@keyframes w1{to{transform:translateX(-50px)}}
.barq{animation:tangue 5.4s ease-in-out infinite;transform-box:fill-box;
  transform-origin:50% 90%}
.b1{animation-duration:6.8s;animation-delay:-1.7s}
.b2{animation-duration:4.6s;animation-delay:-3.2s}
.b3{animation-duration:7.6s;animation-delay:-.9s}
@keyframes tangue{0%,100%{transform:rotate(-.7deg)}50%{transform:rotate(.7deg)}}
/* le gamin : il balance les jambes et il mâche */
.jambes{animation:balance 2.2s ease-in-out infinite;transform-box:fill-box;
  transform-origin:50% 0%}
@keyframes balance{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg)}}
.gamin{animation:respire 4.2s ease-in-out infinite}
@keyframes respire{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.2px)}}
.bouche{animation:mache 1.1s ease-in-out infinite;transform-box:fill-box;
  transform-origin:50% 50%}
@keyframes mache{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.4)}}
.yeux{animation:cligne 5.6s infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes cligne{0%,95%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.bras{animation:croque 3.4s ease-in-out infinite;transform-box:fill-box;
  transform-origin:20% 90%}
@keyframes croque{0%,60%,100%{transform:rotate(0)}
  74%{transform:rotate(-9deg)}86%{transform:rotate(-2deg)}}
.mou{animation:sautille 6s ease-in-out infinite}
.m1{animation-delay:-2.6s}
@keyframes sautille{0%,88%,100%{transform:translateY(0)}
  93%{transform:translate(3px,-4px)}}
@media (prefers-reduced-motion:reduce){*{animation:none !important}}

/* ---------- la voix des gens ----------
   Courier Prime ne sert plus qu'à ça : ce qu'un personnage dit.
   Le reste de la page est en Nunito, comme dans tout le jeu. */
.parle, .dit p.parle, .voix{
  font-family:'Courier Prime',monospace;letter-spacing:-.01em}
</style>
</head>
<body>

<div id="rue"></div>

<div class="qui" id="qui"><b>Titou</b><span>Neuf ans, peut-être dix</span></div>

<div class="dit">
  <div class="lignes" id="lignes"></div>
  <div class="choix" id="choix"></div>
</div>

<div class="avert" id="avert">
  <h1 id="a-t">Sur le quai</h1>
  <p>Un gamin t'a repéré. <b>Il ne te lâchera pas.</b></p>
  <p class="petit">Il a une information. Elle a un prix.</p>
  <button id="a-ok">J'ai compris</button>
</div>

<div class="fin" id="fin">
  <p class="t" id="f-t">Il remonte sur sa bitte</p>
  <p class="g" id="f-g">—</p>
  <p class="p" id="f-p">—</p>
  <div class="caisse" id="f-caisse">
    <span class="ic"><svg viewBox="0 0 24 24">
      <path d="M4 8h16v12H4zM4 8l2-4h12l2 4M9 12h6"/></svg></span>
    <span class="tx"><b>Une caisse sans marque</b>
      <span>Elle est plus lourde qu'elle ne devrait l'être. Elle prend une place en cale.</span></span>
  </div>
  <div class="plus" id="f-plus"></div>
  <button id="f-b">Continuer</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="bd.js?v=4"></script>
<script>

/* ============================================================
   LE VIEUX-PORT AU MATIN — Titou sur sa bitte
   Composition : le môle en diagonale nous mène à lui,
   les mâts découpent le fond, la lumière vient de la gauche.
   ============================================================ */
const W = 480, F = 727, OEIL = 1.72, HZ = 262;
const px = (m,d) => m*F/d, sol = d => HZ + OEIL*F/d, pX = (X,d) => 240 + X*F/d;
const rnd = s => { const x = Math.sin(s*127.1)*43758.5; return x - Math.floor(x); };
const rnd2 = (a,b) => { const x = Math.sin(a*127.1+b*311.7)*43758.5; return x - Math.floor(x); };
function hx(c){ return [parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)]; }
function ch(a){ return '#'+a.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join(''); }
function mel(a,b,k){ const A=hx(a),B=hx(b); return ch([0,1,2].map(i=>A[i]+(B[i]-A[i])*k)); }

/* le soleil est bas à gauche : matin d'été */
const JOUR = '#fff0c8', OMB = '#4a5068';
const clair  = (c,k) => mel(c, JOUR, k===undefined?.3:k);
const sombre = (c,k) => mel(c, OMB,  k===undefined?.3:k);
const loin   = (c,d) => mel(c, mel('#dcd4bc', JOUR, .5), Math.min(.5, Math.pow(d/90,.8)));
/* la lumière vient de la gauche : ce qui est à droite s'assombrit */
const cote = (x, c, k) => mel(c, x < 240 ? JOUR : OMB, (k||.2) * Math.abs(x-240)/240);

let HAUT=-200, BAS=900;
function cadrer(l,h){
  const t = W*h/l;
  HAUT = HZ - t*.46; BAS = HAUT + t;
  return { y:HAUT, h:t };
}

/* ---------- le ciel et le bassin ---------- */
function fond(){
  const yh = sol(900);
  let s = `<defs>
    <linearGradient id="t-ciel" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%"   stop-color="#2f74ac"/>
      <stop offset="26%"  stop-color="#68a0c4"/>
      <stop offset="58%"  stop-color="#a8c4cc"/>
      <stop offset="84%"  stop-color="#e0d4b0"/>
      <stop offset="100%" stop-color="#f4e6c0"/></linearGradient>
    <linearGradient id="t-eau" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#b4b49c"/>
      <stop offset="12%"  stop-color="#6a8e94"/>
      <stop offset="46%"  stop-color="#3e6e7e"/>
      <stop offset="100%" stop-color="#2a5264"/></linearGradient>
    <linearGradient id="t-quai" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%"   stop-color="#e0d4b0"/>
      <stop offset="46%"  stop-color="#c4b492"/>
      <stop offset="100%" stop-color="#96876a"/></linearGradient>
    <radialGradient id="t-halo" cx="0.12" cy="0.1">
      <stop offset="0%"   stop-color="#fff4d4" stop-opacity=".62"/>
      <stop offset="44%"  stop-color="#ffe0a0" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#ffd090" stop-opacity="0"/></radialGradient>
    <filter id="t-flou"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>`;
  s += `<rect x="0" y="${HAUT}" width="${W}" height="${(yh-HAUT).toFixed(1)}"
    fill="url(#t-ciel)"/>`;
  s += `<ellipse cx="40" cy="${(HAUT+70).toFixed(0)}" rx="300" ry="240"
    fill="url(#t-halo)"/>`;

  /* les collines de l'autre rive, très pâles */
  const dc = 1400, yc = sol(dc);
  let p = `M-40 ${(yc+60).toFixed(0)} `;
  for (let k = 0; k <= 22; k++){
    const u = k/22;
    const h = 46 + Math.sin(u*4.2)*22 + Math.sin(u*11)*9;
    p += `L${(-40+(W+80)*u).toFixed(0)} ${(yc-px(h,dc)).toFixed(1)} `;
  }
  s += `<path d="${p}L${W+40} ${(yc+60).toFixed(0)} Z"
    fill="${loin('#a8b0a8', dc)}" opacity=".7"/>`;

  /* la ville d'en face : façades ocre serrées, le long du quai */
  [[620, 1], [420, 2]].forEach(([d, rang]) => {
    const y = sol(d), m = u => px(u, d);
    for (let k = 0; k < 34; k++){
      const X = -180 + k*11 + rnd(k*3+rang)*5;
      const h = 14 + rnd(k*11+rang)*16;
      const l = 7 + rnd(k*5+rang)*5;
      const x = pX(X, d);
      if (x < -40 || x > W+40) continue;
      const c = ['#f0dcb0','#e4d0a4','#ecd8ac','#dcc89c'][k%4];
      s += `<path d="M${x.toFixed(1)} ${y.toFixed(1)} v${(-m(h)).toFixed(1)}
        h${m(l).toFixed(1)} v${m(h).toFixed(1)} z"
        fill="${cote(x, loin(c, d), .3)}"/>`;
      s += `<path d="M${(x-m(.8)).toFixed(1)} ${(y-m(h)).toFixed(1)}
        h${m(l+1.6).toFixed(1)} l${(-m(1)).toFixed(1)} ${(-m(2.4)).toFixed(1)}
        h${(-m(l-.4)).toFixed(1)} z" fill="${loin('#b06a48', d)}"/>`;
      /* les fenêtres */
      for (let q = 0; q < 4; q++)
        if (rnd(k*7+q+rang) > .35)
          s += `<rect x="${(x+m(1.4+(q%2)*3.2)).toFixed(1)}"
            y="${(y-m(h*.72-q*3)).toFixed(1)}" width="${m(1.6).toFixed(1)}"
            height="${m(2.4).toFixed(1)}" fill="${loin('#7a6a52', d)}" opacity=".5"/>`;
    }
  });

  /* l'eau du bassin */
  s += `<rect x="0" y="${yh.toFixed(1)}" width="${W}"
    height="${(sol(30)-yh).toFixed(1)}" fill="url(#t-eau)"/>`;
  for (let n = 0; n < 14; n++){
    const d = 800/Math.pow(n+1,1.2), y = sol(d);
    if (y > sol(30) || y < yh) continue;
    const amp = px(.16,d), esp = px(9,d);
    let p2 = `M-140 ${y.toFixed(1)} `;
    for (let k=0;k<26;k++) p2 += `q${(esp*.5).toFixed(1)} ${(-amp).toFixed(1)} ${esp.toFixed(1)} 0 `;
    s += `<g class="onde o${n%4}"><path d="${p2}" stroke="#fff"
      stroke-width="${Math.max(.4,amp*.5).toFixed(2)}" fill="none"
      opacity="${(.15-n*.008).toFixed(3)}"/></g>`;
  }
  return s;
}

/* ---------- les barques amarrées, et leurs mâts ---------- */
function barques(){
  let s = '';
  const B = [
    [150, -52, '#8a4a3a'], [126, 34, '#3a5a6a'], [104, -30, '#7a6a3a'],
    [88,  46, '#4a6a4a'],  [74, -46, '#8a5a4a'], [62, 26, '#3a4a6a'],
    [52, -60, '#6a4a5a']
  ];
  B.forEach(([d, X, c], i) => {
    const y = sol(d), m = u => px(u,d), x = pX(X, d);
    s += `<g class="barq b${i%4}">`;
    /* la coque */
    s += `<path d="M${(x-m(3.4)).toFixed(1)} ${(y-m(.8)).toFixed(1)}
      q${m(.6).toFixed(1)} ${m(1.1).toFixed(1)} ${m(2.8).toFixed(1)} ${m(1.1).toFixed(1)}
      h${m(1.2).toFixed(1)} q${m(2.2).toFixed(1)} 0 ${m(2.8).toFixed(1)} ${(-m(1.1)).toFixed(1)}
      q${(-m(3.4)).toFixed(1)} ${(-m(.5)).toFixed(1)} ${(-m(6.8)).toFixed(1)} 0 z"
      fill="${cote(x, loin(c, d), .34)}"/>`;
    s += `<path d="M${(x-m(3.4)).toFixed(1)} ${(y-m(.8)).toFixed(1)}
      q${m(3.4).toFixed(1)} ${(-m(.5)).toFixed(1)} ${m(6.8).toFixed(1)} 0"
      stroke="${clair(c,.5)}" stroke-width="${Math.max(.6,m(.2)).toFixed(1)}" fill="none"/>`;
    /* le mât, qui découpe le ciel */
    const hm = 10 + rnd(i*7)*7;
    s += `<path d="M${x.toFixed(1)} ${(y-m(1)).toFixed(1)} v${(-m(hm)).toFixed(1)}"
      stroke="${loin('#6a5a44', d)}" stroke-width="${Math.max(.6,m(.22)).toFixed(1)}"/>`;
    /* la vergue, sur certains */
    if (i % 3 === 0)
      s += `<path d="M${(x-m(2)).toFixed(1)} ${(y-m(hm*.72)).toFixed(1)}
        h${m(4).toFixed(1)}" stroke="${loin('#6a5a44', d)}"
        stroke-width="${Math.max(.5,m(.16)).toFixed(1)}"/>`;
    /* le reflet */
    s += `<path d="M${(x-m(3)).toFixed(1)} ${(y+m(.3)).toFixed(1)}
      q${m(3).toFixed(1)} ${m(1.4).toFixed(1)} ${m(6).toFixed(1)} 0 z"
      fill="${loin(c, d)}" opacity=".22"/>`;
    s += `</g>`;
  });
  return s;
}

/* ---------- le quai, en diagonale ---------- */
function quaiSol(){
  let s = `<rect x="0" y="${sol(30).toFixed(1)}" width="${W}"
    height="${(BAS-sol(30)+10).toFixed(1)}" fill="url(#t-quai)"/>`;
  /* les dalles, qui fuient */
  let d = 30, i = 0;
  while (d > 2 && i < 60){
    const d2 = d/1.08, y1 = sol(d), y2 = sol(d2);
    if (y1 > BAS) break;
    if (y2-y1 > .7)
      for (let c = -11; c <= 11; c++){
        const t = rnd2(i, c+24);
        const dec = (i%2)*.5;
        const xa = pX((c+dec)*1.1, d), xb = pX((c+1+dec)*1.1, d);
        const xa2 = pX((c+dec)*1.1, d2), xb2 = pX((c+1+dec)*1.1, d2);
        if (xb < -30 && xb2 < -30) continue;
        if (xa > W+30 && xa2 > W+30) continue;
        const cx2 = (xa+xb)/2;
        s += `<path d="M${xa.toFixed(1)} ${y1.toFixed(1)} L${xb.toFixed(1)} ${y1.toFixed(1)}
          L${xb2.toFixed(1)} ${y2.toFixed(1)} L${xa2.toFixed(1)} ${y2.toFixed(1)} Z"
          fill="${cote(cx2, loin(t>.6?'#d8c8a4':t>.3?'#c0b08c':'#a89874', d), .26)}"
          opacity="${(.5+t*.34).toFixed(2)}"/>`;
      }
    d = d2; i++;
  }
  /* le bord du quai, avec sa margelle */
  s += `<path d="M0 ${sol(30).toFixed(1)} h${W}" stroke="#8a7a5c" stroke-width="2.4"/>`;
  s += `<path d="M0 ${(sol(30)-2).toFixed(1)} h${W}" stroke="${clair('#e8dcc0',.4)}"
    stroke-width="1.6" opacity=".7"/>`;
  return s;
}

/* ---------- ce qui traîne sur le quai ---------- */
function fourbi(){
  let s = '';
  /* des caisses empilées, à droite, en contre-jour */
  [[13, 7.5, 2], [15, 8.6, 1], [11, 6.4, 3]].forEach(([d, X, n]) => {
    const y = sol(d), m = u => px(u,d), x = pX(X, d);
    for (let k = 0; k < n; k++){
      const yy = y - m(1.5*k);
      s += `<path d="M${(x-m(.75)).toFixed(1)} ${yy.toFixed(1)} v${(-m(1.4)).toFixed(1)}
        h${m(1.5).toFixed(1)} v${m(1.4).toFixed(1)} z"
        fill="${cote(x, loin('#a5825c', d), .34)}"/>`;
      s += `<path d="M${(x-m(.75)).toFixed(1)} ${(yy-m(1.4)).toFixed(1)}
        h${m(1.5).toFixed(1)} v${m(.14).toFixed(1)} h${(-m(1.5)).toFixed(1)} z"
        fill="${clair('#c9a374',.36)}"/>`;
      s += `<path d="M${(x-m(.75)).toFixed(1)} ${(yy-m(.7)).toFixed(1)}
        h${m(1.5).toFixed(1)}" stroke="${sombre('#6d5238',.3)}" stroke-width="1"
        opacity=".5"/>`;
    }
  });
  /* un cordage lové, à gauche */
  const dc = 10, xc = pX(-7.5, dc), yc = sol(dc), mc = u => px(u,dc);
  for (let k = 0; k < 4; k++)
    s += `<ellipse cx="${xc.toFixed(1)}" cy="${(yc-mc(.08+k*.13)).toFixed(1)}"
      rx="${mc(.95-k*.11).toFixed(1)}" ry="${mc(.3-k*.035).toFixed(1)}" fill="none"
      stroke="${loin('#b8a078', dc)}" stroke-width="${mc(.19).toFixed(1)}"/>`;
  /* un filet étendu, au sol à gauche */
  const df = 16, xf = pX(-8, df), yf = sol(df), mf = u => px(u,df);
  for (let k = 0; k < 9; k++)
    s += `<path d="M${(xf-mf(2)+mf(k*.5)).toFixed(1)} ${yf.toFixed(1)}
      l${mf(.9).toFixed(1)} ${(-mf(.5)).toFixed(1)}
      M${(xf-mf(2)+mf(k*.5)).toFixed(1)} ${(yf-mf(.5)).toFixed(1)}
      l${mf(.9).toFixed(1)} ${mf(.5).toFixed(1)}"
      stroke="${loin('#8a8a6a', df)}" stroke-width=".8" opacity=".5"/>`;
  /* deux mouettes posées */
  [[19, -4.4],[22, 5.2]].forEach(([d, X], i) => {
    const y = sol(d), m = u => px(u,d), x = pX(X, d);
    s += `<g class="mou m${i}">`;
    s += `<ellipse cx="${x.toFixed(1)}" cy="${(y-m(.28)).toFixed(1)}"
      rx="${m(.34).toFixed(2)}" ry="${m(.2).toFixed(2)}" fill="${loin('#f0ece0', d)}"/>`;
    s += `<circle cx="${(x-m(.26)).toFixed(1)}" cy="${(y-m(.46)).toFixed(1)}"
      r="${m(.14).toFixed(2)}" fill="${loin('#f4f0e4', d)}"/>`;
    s += `<path d="M${(x-m(.38)).toFixed(1)} ${(y-m(.46)).toFixed(1)}
      l${(-m(.14)).toFixed(2)} ${m(.04).toFixed(2)} l${m(.14).toFixed(2)} ${m(.05).toFixed(2)} z"
      fill="#e0a040"/>`;
    s += `<path d="M${(x-m(.1)).toFixed(1)} ${(y-m(.1)).toFixed(1)} v${m(.1).toFixed(2)}
      M${(x+m(.08)).toFixed(1)} ${(y-m(.1)).toFixed(1)} v${m(.1).toFixed(2)}"
      stroke="#e0a040" stroke-width="${Math.max(.5,m(.05)).toFixed(1)}"/>`;
    s += `</g>`;

  return s;
}

    fill="${chevC}" opacity=".7"/>`;

  /* ---- les oreilles, décollées ---- */
  [[-1.02, -1],[1.02, 1]].forEach(([dx, sg]) =>
    s += `<ellipse cx="${(tx+t*dx).toFixed(1)}" cy="${(ty+t*.06).toFixed(1)}"
      rx="${(t*.14).toFixed(2)}" ry="${(t*.2).toFixed(2)}" fill="${peau}"
      transform="rotate(${sg*10} ${(tx+t*dx).toFixed(1)} ${(ty+t*.06).toFixed(1)})"/>`);

  /* ---- les yeux : grands, très ouverts ---- */
  s += `<g class="yeux">`;
  [[-.34],[.34]].forEach(([dx]) => {
    const ex = tx + t*dx, ey = ty - t*.06;
    s += `<ellipse cx="${ex.toFixed(1)}" cy="${ey.toFixed(1)}"
      rx="${(t*.19).toFixed(2)}" ry="${(t*.21).toFixed(2)}" fill="#f4ece0"/>`;
    s += `<circle cx="${(ex+t*.02).toFixed(1)}" cy="${ey.toFixed(1)}"
      r="${(t*.13).toFixed(2)}" fill="#3a2818"/>`;
    s += `<circle cx="${(ex+t*.02).toFixed(1)}" cy="${ey.toFixed(1)}"
      r="${(t*.07).toFixed(2)}" fill="#100a06"/>`;
    s += `<circle cx="${(ex-t*.03).toFixed(1)}" cy="${(ey-t*.06).toFixed(1)}"
      r="${(t*.045).toFixed(2)}" fill="#fff" opacity=".9"/>`;
    /* le sourcil, haut : il est toujours en train de s'étonner */
    s += `<path d="M${(ex-t*.2).toFixed(1)} ${(ey-t*.34).toFixed(1)}
      q${(t*.2).toFixed(2)} ${(-t*.1).toFixed(2)} ${(t*.4).toFixed(2)} ${(t*.02).toFixed(2)}"
      stroke="${chev}" stroke-width="${(t*.07).toFixed(2)}" fill="none"
      stroke-linecap="round"/>`;
  });
  s += `</g>`;

  /* ---- le nez, un bouton ---- */
  s += `<ellipse cx="${tx.toFixed(1)}" cy="${(ty+t*.26).toFixed(1)}"
    rx="${(t*.07).toFixed(2)}" ry="${(t*.055).toFixed(2)}" fill="${peauO}" opacity=".6"/>`;

  /* ---- la bouche : il mâche ---- */
  s += `<path class="bouche" d="M${(tx-t*.18).toFixed(1)} ${(ty+t*.56).toFixed(1)}
    q${(t*.18).toFixed(2)} ${(t*.14).toFixed(2)} ${(t*.36).toFixed(2)} 0"
    stroke="#8a4038" stroke-width="${(t*.075).toFixed(2)}" fill="none"
    stroke-linecap="round"/>`;
  /* quelques miettes */
  s += `<circle cx="${(tx+t*.24).toFixed(1)}" cy="${(ty+t*.66).toFixed(1)}"
    r="${(t*.03).toFixed(2)}" fill="#d4a568"/>`;
  s += `<circle cx="${(tx-t*.12).toFixed(1)}" cy="${(ty+t*.72).toFixed(1)}"
    r="${(t*.022).toFixed(2)}" fill="#d4a568"/>`;
  s += `</g>`;
  return s;
}

}

const NOMS = { instinct:'Instinct', sang_froid:'Sang-froid', discussion:'Discussion',
               negociation:'Négociation', precision_:'Précision', chance:'Chance' };
let MOI = { instinct:0, sang_froid:0, discussion:0, negociation:0, precision_:0 };
let fini = false, monteNiveau = false, bonus = 0;

function dessiner(){
  const v = cadrer(innerWidth, innerHeight);
  document.getElementById('rue').innerHTML =
    '<svg viewBox="0 ' + v.y.toFixed(1) + ' ' + W + ' ' + v.h.toFixed(1) + '" '
    + 'preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">'
    + scene() + '</svg>';
}
dessiner();

const assez = b => !b || Object.entries(b).every(([k, v]) => (MOI[k] || 0) >= v);

function jouer(cle){
  const E = TITOU[cle];
  if (!E) return;
  const L = document.getElementById('lignes'), C = document.getElementById('choix');
  L.innerHTML = ''; C.innerHTML = '';
  if (E.gain) bonus += E.gain;
  E.dit.forEach((t2, i) => {
    const p2 = document.createElement('p');
    if (t2.trim().startsWith('«')) p2.className = 'parle';
    p2.textContent = t2;
    p2.style.animationDelay = (i * .48) + 's';
    L.appendChild(p2);
  });
  let n = E.dit.length;
  if (E.lire){
    const [k, v] = Object.entries(E.lire)[0];
    if (k !== 'texte' && assez({ [k]: v })){
      const p2 = document.createElement('p');
      p2.className = 'souffle';
      p2.innerHTML = '<em>Ton instinct</em>' + E.lire.texte;
      p2.style.animationDelay = (n * .48) + 's';
      L.appendChild(p2); n++;
    }
  }
  document.querySelector('.dit').scrollTop = 0;
  C.style.animationDelay = (n * .48 + .3) + 's';
  E.choix.forEach(c => {
    const ok = assez(c.besoin);
    const b = document.createElement('button');
    if (!ok) b.className = 'ferme';
    let h = '<b>' + c.t + '</b>';
    if (c.s) h += '<span class="s">' + c.s + '</span>';
    if (c.besoin){
      const [k, v] = Object.entries(c.besoin)[0];
      h += '<span class="cle">' + NOMS[k] + ' ' + v
        + (ok ? '' : ' — tu as ' + (MOI[k] || 0)) + '</span>';
    }
    b.innerHTML = h;
    if (ok) b.onclick = () => c.fin ? terminer(c.fin) : jouer(c.vers);
    C.appendChild(b);
  });
}

async function terminer(quoi){
  if (fini) return; fini = true;
  const L = document.getElementById('lignes'), C = document.getElementById('choix');
  C.innerHTML = '<button disabled style="opacity:.5">…</button>';
  const r = await BD.agir('conclure_titou', { p_issue: quoi });
  const D = APRES_TITOU[quoi] || [], F = FINS_T[quoi];
  L.innerHTML = '';
  D.forEach((t2, i) => {
    const p2 = document.createElement('p');
    if (t2.trim().startsWith('«')) p2.className = 'parle';
    p2.textContent = t2;
    p2.style.animationDelay = (i * .48) + 's';
    L.appendChild(p2);
  });
  document.querySelector('.dit').scrollTop = 0;
  C.style.animationDelay = (D.length * .48 + .4) + 's';
  C.innerHTML = '<button id="suite"><b>Continuer</b></button>';
  document.getElementById('suite').onclick = () => {
    monteNiveau = !!(r.niveau && r.niveau.monte);
    const cs = document.getElementById('f-caisse');
    if (cs) cs.remove();
    document.getElementById('f-t').textContent = 'Est-nord-est, deux jours';
    document.getElementById('f-g').textContent = 'Ajaccio';
    document.getElementById('f-g').style.fontSize = '30px';
    document.getElementById('f-p').textContent = F.mot;
    const P = ['−' + F.cout + ' €'];
    if (r.ok && r.xp) P.push('+' + r.xp + " points d'expérience");
    P.push('Un cap de plus depuis Marseille');
    if (monteNiveau) P.push('Tu changes de niveau');
    document.getElementById('f-plus').innerHTML =
      P.map(x => '<span>' + x + '</span>').join('');
    document.getElementById('f-b').textContent =
      monteNiveau ? 'Voir ton niveau' : 'Retourner au port';
    document.getElementById('fin').classList.add('on');
  };
}

document.getElementById('a-ok').onclick = () => {
  document.getElementById('avert').classList.add('parti');
  document.getElementById('qui').classList.add('on');
  setTimeout(() => jouer('debut'), 300);
};
document.getElementById('f-b').onclick = () => location.href =
  (monteNiveau ? 'niveau.html' : 'jeu.html');

(async () => {
  let d;
  try {
    d = await BD.charger();
    if (!d){ location.href = 'index.html'; return; }
  } catch(e){ return; }
  const r = await BD.agir('chez_titou');
  if (!r.ok || (r.titou)){ location.href = 'jeu.html'; return; }
  const c = d.competences || {};
  MOI = { instinct:+d.instinct||0, sang_froid:+d.sang_froid||0,
          discussion:+c.discussion||0, negociation:+c.negociation||0,
          precision_:+c.precision_||0 };
})();

let t2 = null;
/* la barre d'adresse qui se cache envoie un resize : on ne redessine
   que si le cadre a vraiment changé, sinon l'écran clignote */
let __L = innerWidth, __H = innerHeight, __t = null;
function surRedimension(refaire){
  const dl = Math.abs(innerWidth - __L), dh = Math.abs(innerHeight - __H);
  if (dl < 2 && dh < 120) return;
  __L = innerWidth; __H = innerHeight;
  clearTimeout(__t);
  __t = setTimeout(refaire, 220);
}
addEventListener('resize', () => surRedimension(dessiner));
