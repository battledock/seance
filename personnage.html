<style>
:root{
  --nuit:#050d16;
  --eau:#0a1c2e;
  --acier:#1e3d59;
  --brume:#7fa3c0;
  --sable:#e8e2d4;
  --ocre:#e0913a;
  --ocre-fonce:#a3611f;
  --erreur:#e05c4a;
  --ok:#4fb286;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--nuit);
  color:var(--sable);
  font-family:'Nunito',system-ui,sans-serif;
  overflow-x:hidden;
  overscroll-behavior-x:none;
  background-image:
    radial-gradient(90% 50% at 50% 0%, rgba(30,61,89,.55), transparent 62%),
    radial-gradient(70% 40% at 50% 100%, rgba(224,145,58,.08), transparent 70%);
  background-attachment:fixed;
}

.ecran{
  max-width:440px;margin:0 auto;
  padding:calc(env(safe-area-inset-top) + 26px) 20px calc(env(safe-area-inset-bottom) + 130px);
}

.entete{text-align:center;margin-bottom:20px}
.entete .sur{
  font-size:10px;letter-spacing:.36em;text-transform:uppercase;
  color:var(--brume);padding-left:.36em;margin-bottom:8px;
}
.entete h1{
  font-family:'DM Serif Display',Georgia,serif;
  font-size:34px;line-height:1;letter-spacing:.03em;
}

/* ---- PORTRAIT ---- */
.cadre{
  position:sticky;
  top:calc(env(safe-area-inset-top) + 8px);
  z-index:4;
  background:linear-gradient(180deg,#0d2338 0%,#081826 100%);
  border:1px solid rgba(127,163,192,.18);
  border-radius:18px;
  padding:14px 14px 10px;
  margin-bottom:6px;
  overflow:hidden;
}
.cadre::before{
  content:"";position:absolute;left:0;right:0;bottom:0;height:52%;
  background:radial-gradient(70% 100% at 50% 100%, rgba(224,145,58,.13), transparent 70%);
  pointer-events:none;
}
.cadre svg{
  display:block;width:auto;height:32vh;max-height:260px;
  margin:0 auto;position:relative;image-rendering:pixelated;
  transition:height .28s ease;
}
.cadre.compact{padding:8px 14px 6px}
.cadre.compact svg{height:14vh;max-height:110px}
.cadre.compact .rappel{opacity:1}
.rappel{
  position:absolute;left:16px;right:16px;bottom:9px;
  display:flex;justify-content:space-between;align-items:baseline;
  font-size:11px;color:var(--brume);
  opacity:0;transition:opacity .28s ease;pointer-events:none;
}
.rappel b{font-weight:500;color:var(--sable)}
@media (prefers-reduced-motion:reduce){
  .cadre svg,.rappel{transition:none}
}

.matricule{
  display:flex;justify-content:space-between;align-items:center;
  font-size:9px;letter-spacing:.2em;text-transform:uppercase;
  color:rgba(127,163,192,.55);
  margin-bottom:22px;padding:0 4px;
}

/* ---- REGLAGES ---- */
.bloc{margin-bottom:20px}
.bloc > .titre{
  font-size:10px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--brume);margin-bottom:9px;
}
.rangee{
  display:flex;gap:8px;
  overflow-x:auto;
  padding-bottom:4px;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}
.rangee::-webkit-scrollbar{display:none}

.pastille{
  flex:0 0 auto;
  width:38px;height:38px;border-radius:50%;
  border:2px solid transparent;
  box-shadow:inset 0 0 0 1px rgba(5,13,22,.5);
  cursor:pointer;padding:0;
  transition:transform .12s;
}
.pastille[aria-pressed="true"]{border-color:var(--ocre)}
.pastille:active{transform:scale(.92)}

.jeton{
  flex:0 0 auto;
  background:rgba(10,28,46,.75);
  border:1px solid rgba(127,163,192,.2);
  border-radius:9px;
  padding:9px 14px;
  font-family:'Nunito',system-ui,sans-serif;
  font-size:13px;color:var(--brume);
  white-space:nowrap;cursor:pointer;
  transition:transform .12s, color .2s, border-color .2s, background .2s;
}
.jeton[aria-pressed="true"]{
  background:rgba(224,145,58,.14);
  border-color:var(--ocre);
  color:var(--sable);
}
.jeton:active{transform:scale(.96)}

/* ---- NOM ---- */
.champ label{
  display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--brume);margin-bottom:8px;
}
.champ input{
  width:100%;
  background:rgba(5,13,22,.55);
  border:1px solid rgba(127,163,192,.2);
  border-radius:10px;
  padding:14px 15px;
  font-family:'Nunito',system-ui,sans-serif;font-size:16px;
  color:var(--sable);
  transition:border-color .2s;
}
.champ input::placeholder{color:rgba(127,163,192,.4)}
.champ input:focus{outline:none;border-color:var(--ocre)}
.compteur{
  display:flex;justify-content:space-between;
  margin-top:6px;font-size:11px;color:rgba(127,163,192,.65);
}

.secondaire{
  width:100%;margin-top:14px;
  background:none;
  border:1px solid rgba(127,163,192,.28);
  border-radius:10px;padding:13px;
  font-family:'Nunito',system-ui,sans-serif;
  font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
  color:var(--brume);cursor:pointer;
  transition:transform .12s, border-color .2s, color .2s;
}
.secondaire:active{transform:scale(.985);border-color:var(--ocre);color:var(--sable)}

.message{
  display:none;margin-bottom:14px;
  padding:11px 13px;border-radius:9px;font-size:13px;line-height:1.4;
}
.message.visible{display:block}
.message.erreur{background:rgba(224,92,74,.12);border:1px solid rgba(224,92,74,.35);color:#f0a99f}
.message.ok{background:rgba(79,178,134,.12);border:1px solid rgba(79,178,134,.35);color:#9adcbf}

/* ---- BARRE BASSE ---- */
.barre{
  position:fixed;left:0;right:0;bottom:0;z-index:5;
  padding:14px 20px calc(env(safe-area-inset-bottom) + 16px);
  background:linear-gradient(180deg, rgba(5,13,22,0) 0%, rgba(5,13,22,.9) 32%, var(--nuit) 100%);
}
.barre .dedans{max-width:440px;margin:0 auto}
.principal{
  width:100%;
  background:var(--ocre);border:0;border-radius:10px;
  padding:17px;
  font-family:'Nunito',system-ui,sans-serif;
  font-size:13px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
  color:#1a0f02;cursor:pointer;
  transition:transform .12s, background .2s;
}
.principal:active{transform:scale(.985);background:var(--ocre-fonce)}
.principal:disabled{opacity:.5;cursor:default}

.deconnexion{
  display:block;width:100%;margin-top:10px;
  background:none;border:0;
  font-family:'Nunito',system-ui,sans-serif;font-size:12px;
  color:rgba(127,163,192,.55);cursor:pointer;
}

@keyframes apparait{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ecran{animation:apparait .4s ease-out}
@media (prefers-reduced-motion:reduce){.ecran{animation:none}}
</style>
</head>
<body>

<main class="ecran">
  <div class="entete">
    <p class="sur">Bureau du personnel</p>
    <h1>Ta fiche</h1>
  </div>

  <div class="cadre">

  <div class="bloc">
    <p class="titre">Barbe</p>

  <div class="bloc">
    <p class="titre">Bouche</p>

  </div>

    <div class="rangee" id="r-tete"></div>
  </div>

  <div class="bloc">
    <p class="titre">Lunettes</p>
    <div class="rangee" id="r-lunettes"></div>
  </div>

  <div class="bloc">
    <p class="titre">Boucle d'oreille</p>

  <div class="bloc">

  <div class="bloc champ">

    <input type="text" id="pseudo" maxlength="18" placeholder="" autocomplete="off" autocapitalize="words" enterkeyhint="done">
    <div class="compteur">
      <span>Visible par les autres joueurs</span>
      <span id="compte">0/18</span>
    </div>
  </div>
</main>

<div class="barre">
  <div class="dedans">
    <button class="principal" id="valider">Continuer</button>
    <button class="deconnexion" id="sortir">Se déconnecter</button>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://zpfkekiavlfphialvphi.supabase.co';
const SUPABASE_KEY = 'sb_publishable__dfR2lEOwKjhhtavvJEvGw_KVACZnHP';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);

/* ---------- PALETTES ---------- */
const PEAUX = [
  { id:'p1', c:'#f2d3b6', o:'#d9ab86' },
  { id:'p2', c:'#e5bc96', o:'#c4936b' },
  { id:'p3', c:'#cf9b6f', o:'#a97449' },
  { id:'p4', c:'#a97048', o:'#83502e' },
  { id:'p5', c:'#7d4c2c', o:'#5c341a' },
  { id:'p6', c:'#4f2f1c', o:'#39200f' }
];
const CHEVEUX = [
  { id:'c1', c:'#171310', o:'#000000' },
  { id:'c2', c:'#3d2b1e', o:'#241a12' },
  { id:'c3', c:'#6b4526', o:'#472c16' },
  { id:'c4', c:'#a8763c', o:'#7c5426' },
  { id:'c5', c:'#c9a86a', o:'#9c8049' },
  { id:'c6', c:'#8f2f1e', o:'#661d10' },
  { id:'c7', c:'#9aa3a8', o:'#727b80' }
];
const VESTES = [
  { id:'v1', c:'#c8641f', o:'#8f4310', n:'Orange' },
  { id:'v2', c:'#1f5f8f', o:'#123f61', n:'Bleu' },
  { id:'v3', c:'#3d6b4a', o:'#264730', n:'Vert' },
  { id:'v4', c:'#8f2f2a', o:'#5f1c19', n:'Rouge' },
  { id:'v5', c:'#4a4f57', o:'#2f333a', n:'Gris' },
  { id:'v6', c:'#c9b47a', o:'#9a8654', n:'Sable' }
];
const COIFFURES = ['Rasé','Court','Ondulé','Épais','Queue','Dégarni'];
const BARBES    = ['Glabre','Bouc','Courte','Pleine','Moustache','Rouflaquettes'];
const TETES     = ['Rien','Bonnet','Casquette','Casque','Bandana'];
const YEUX = [
  { id:'y1', c:'#3b2415', n:'Marron' }, { id:'y2', c:'#6b4a1e', n:'Noisette' },
  { id:'y3', c:'#3f6b45', n:'Vert' },   { id:'y4', c:'#2f6b8f', n:'Bleu' },
  { id:'y5', c:'#6b7378', n:'Gris' },   { id:'y6', c:'#1a1208', n:'Noir' }
];
const FOULARDS = [
  null,
  { id:'f1', c:'#b5342b', o:'#7d2119' }, { id:'f2', c:'#2f6b8f', o:'#1d4460' },
  { id:'f3', c:'#d8b24a', o:'#a2842e' }, { id:'f4', c:'#e8e2d4', o:'#b2ab9c' }
];
const OR = '#e0b23a', ARGENT = '#c3cad0';
const BOUCHES  = ['Neutre','Sourire','Serrée','Dents','Dent en or'];
const LUNETTES = ['Sans','De vue','Soleil','Sécurité','Bandeau'];
const BOUCLES  = ['Sans','Une','Deux or','Deux argent'];
const MOTIFS   = ['Uni','Marinière','Gilet fluo','Bretelles'];
const NOMS_FOULARD = ['Sans','Rouge','Bleu','Jaune','Blanc'];

/* ---------- ÉTAT ---------- */
let etat = { peau:0, cheveux:1, coiffure:1, barbe:2, tete:1, veste:0,
             yeux:0, bouche:0, lunettes:0, boucle:0, motif:0, foulard:0 };

/* ---------- PORTRAIT PIXEL ---------- */
const GW = 16, GH = 18;
const BLANC = '#f6f1e6', NOIR = '#1a1208', BOUCHE = '#7a3a2e', COL = '#161d24';
const CASQUE = '#e8a51e', CASQUE_O = '#b8790c';

function zone(g, x0, y0, x1, y1, c){
  for (let y = Math.max(0, y0); y <= Math.min(GH - 1, y1); y++)
    for (let x = Math.max(0, x0); x <= Math.min(GW - 1, x1); x++) g[y][x] = c;
}
function pt(g, cases, c){
  for (const [x, y] of cases) if (x >= 0 && x < GW && y >= 0 && y < GH) g[y][x] = c;
}

function grille(){
  const P = PEAUX[etat.peau], C = CHEVEUX[etat.cheveux], V = VESTES[etat.veste];
  const co = etat.coiffure, ba = etat.barbe, te = etat.tete;
  const chauve = co === 0, casque = te === 3, poil = !chauve && !casque;
  const bc = chauve ? '#3d2b1e' : C.c;
  const bo = chauve ? '#241a12' : C.o;
  const g = Array.from({ length: GH }, () => new Array(GW).fill(null));

  zone(g, 1, 14, 14, 17, V.c);
  zone(g, 2, 13, 13, 13, V.c);
  zone(g, 1, 14, 3, 17, V.o);
  zone(g, 12, 14, 14, 17, V.o);
  zone(g, 2, 13, 3, 13, V.o);
  zone(g, 12, 13, 13, 13, V.o);

  const mo = etat.motif;
  if (mo === 1){
    zone(g, 1, 15, 14, 15, '#e8e2d4'); zone(g, 1, 17, 14, 17, '#e8e2d4');
    zone(g, 1, 15, 3, 15, '#b2ab9c'); zone(g, 12, 15, 14, 15, '#b2ab9c');
    zone(g, 1, 17, 3, 17, '#b2ab9c'); zone(g, 12, 17, 14, 17, '#b2ab9c');
  }
  if (mo === 2){
    zone(g, 1, 14, 14, 14, '#d7e84a'); zone(g, 1, 16, 14, 16, '#d7e84a');
    zone(g, 1, 14, 3, 14, '#a8b82e'); zone(g, 12, 14, 14, 14, '#a8b82e');
    zone(g, 1, 16, 3, 16, '#a8b82e'); zone(g, 12, 16, 14, 16, '#a8b82e');
  }
  if (mo === 3){
    zone(g, 4, 14, 4, 17, '#3a2c1d'); zone(g, 11, 14, 11, 17, '#3a2c1d');
    pt(g, [[4,15],[11,15]], OR);
  }

  zone(g, 6, 11, 9, 12, P.c);
  zone(g, 6, 11, 9, 11, P.o);
  zone(g, 9, 11, 9, 12, P.o);

  pt(g, [[6,13],[9,13],[7,14],[8,14]], COL);
  pt(g, [[5,13],[10,13],[6,14],[9,14]], V.o);

  const F = FOULARDS[etat.foulard];
  if (F){
    zone(g, 5, 12, 10, 13, F.c);
    zone(g, 4, 13, 11, 13, F.c);
    pt(g, [[9,12],[10,12],[10,13],[11,13]], F.o);
    pt(g, [[7,13],[8,14]], F.o);
  }

  pt(g, [[3,6],[3,7],[12,6],[12,7]], P.c);
  pt(g, [[3,7],[12,7]], P.o);

  zone(g, 4, 3, 11, 9, P.c);
  zone(g, 5, 10, 10, 10, P.c);
  zone(g, 11, 3, 11, 9, P.o);
  pt(g, [[10,10]], P.o);

  if (ba === 1){ zone(g, 6, 9, 9, 10, bc); pt(g, [[9,9],[9,10]], bo); }
  if (ba === 2){
    zone(g, 4, 8, 11, 9, bc); zone(g, 5, 10, 10, 10, bc);
    pt(g, [[4,7],[11,7],[11,8],[11,9],[10,10]], bo);
  }
  if (ba === 3){
    zone(g, 4, 7, 11, 10, bc); zone(g, 5, 11, 10, 11, bc);
    pt(g, [[4,6],[11,6]], bc);
    pt(g, [[11,6],[11,7],[11,8],[11,9],[11,10],[10,11]], bo);
  }
  if (ba === 5){
    zone(g, 4, 5, 4, 8, bc); zone(g, 11, 5, 11, 8, bc);
    pt(g, [[11,5],[11,6],[11,7],[11,8]], bo);
  }

  const oeil = YEUX[etat.yeux].c;
  pt(g, [[5,5],[6,5],[9,5],[10,5]], BLANC);
  pt(g, [[6,5],[9,5]], oeil);
  pt(g, [[7,7],[8,7]], P.o);

  const bo2 = etat.bouche;
  if (bo2 === 0){ zone(g, 6, 9, 9, 9, BOUCHE); pt(g, [[6,9],[9,9]], P.o); }
  if (bo2 === 1){ zone(g, 6, 9, 9, 9, BOUCHE); pt(g, [[5,8],[10,8]], P.o); }
  if (bo2 === 2){ zone(g, 6, 9, 9, 9, P.o); }
  if (bo2 === 3){ zone(g, 6, 9, 9, 9, BOUCHE); pt(g, [[7,9],[8,9]], BLANC); }
  if (bo2 === 4){ zone(g, 6, 9, 9, 9, BOUCHE); pt(g, [[7,9]], BLANC); pt(g, [[8,9]], OR); }

  if (ba === 1 || ba === 3 || ba === 4){ zone(g, 6, 8, 9, 8, bc); pt(g, [[9,8]], bo); }
  if (ba === 4) zone(g, 6, 9, 9, 9, BOUCHE);

  pt(g, [[5,4],[6,4],[9,4],[10,4]], poil ? bc : P.o);
  if (poil) pt(g, [[10,4]], bo);

  if (poil){
    if (co === 1){
      zone(g, 4, 2, 11, 2, C.c);
      pt(g, [[3,3],[3,4],[12,3],[12,4]], C.c);
      pt(g, [[11,2],[12,3],[12,4]], C.o);
    }
    if (co === 2){
      zone(g, 5, 1, 10, 1, C.c); zone(g, 4, 2, 11, 2, C.c);
      pt(g, [[3,3],[3,4],[12,3],[12,4]], C.c);
      pt(g, [[5,2],[7,2],[9,2],[6,1],[9,1]], C.o);
      pt(g, [[11,2],[12,3],[12,4]], C.o);
    }
    if (co === 3){
      zone(g, 4, 1, 11, 2, C.c); zone(g, 3, 2, 3, 5, C.c); zone(g, 12, 2, 12, 5, C.c);
      pt(g, [[5,0],[6,0],[7,0],[8,0],[9,0],[10,0]], C.c);
      pt(g, [[10,0],[11,1],[11,2],[12,2],[12,3],[12,4],[12,5]], C.o);
    }
    if (co === 4){
      zone(g, 4, 2, 11, 2, C.c);
      pt(g, [[3,3],[12,3]], C.c);
      pt(g, [[12,4],[13,4],[13,5],[13,6],[12,6]], C.c);
      pt(g, [[11,2],[13,5],[13,6]], C.o);
    }
    if (co === 5){
      zone(g, 6, 2, 9, 2, C.c);
      pt(g, [[4,3],[3,3],[3,4],[11,3],[12,3],[12,4]], C.c);
      pt(g, [[9,2],[11,3],[12,3],[12,4]], C.o);
    }
  }

  const lu = etat.lunettes;
  if (lu === 1){
    pt(g, [[4,5],[7,5],[8,5],[11,5]], '#2b2119');
    pt(g, [[5,5],[10,5]], BLANC);
    pt(g, [[6,5],[9,5]], oeil);
    pt(g, [[3,5],[12,5]], '#2b2119');
  }
  if (lu === 2){
    zone(g, 4, 5, 11, 5, '#1e1a16');
    pt(g, [[5,5],[9,5]], '#4a4038');
    pt(g, [[3,5],[12,5],[7,5],[8,5]], '#2b2119');
  }
  if (lu === 3){
    zone(g, 4, 5, 11, 5, '#cfe0a8');
    pt(g, [[6,5],[9,5]], oeil);
    pt(g, [[7,5],[8,5]], '#8fa36a');
    pt(g, [[3,5],[12,5]], '#8fa36a');
  }
  if (lu === 4){
    pt(g, [[9,5],[10,5],[11,5],[12,5]], '#1e1a16');
    pt(g, [[11,4],[12,4],[8,4]], '#1e1a16');
  }

  if (etat.boucle === 1) pt(g, [[12,8]], OR);
  if (etat.boucle === 2) pt(g, [[12,8],[3,8]], OR);
  if (etat.boucle === 3) pt(g, [[12,8],[3,8]], ARGENT);

  if (te === 1){
    pt(g, [[7,0],[8,0]], V.c);
    zone(g, 4, 1, 11, 1, V.o);
    zone(g, 3, 2, 12, 3, V.c);
    pt(g, [[11,1],[12,2],[12,3]], V.o);
    zone(g, 3, 3, 12, 3, V.o);
  }
  if (te === 2){
    zone(g, 4, 0, 11, 1, V.c);
    zone(g, 3, 2, 12, 2, V.o);
    zone(g, 2, 3, 13, 3, V.o);
    pt(g, [[11,0],[11,1],[12,2],[13,3]], V.o);
    pt(g, [[4,0],[5,0]], V.c);
  }
  if (te === 3){
    zone(g, 4, 0, 11, 1, CASQUE);
    zone(g, 3, 2, 12, 2, CASQUE);
    zone(g, 2, 3, 13, 3, CASQUE_O);
    pt(g, [[7,0],[8,0],[7,1],[8,1]], CASQUE_O);
    pt(g, [[11,0],[11,1],[12,2]], CASQUE_O);
  }
  if (te === 4){
    zone(g, 4, 1, 11, 2, V.c);
    pt(g, [[3,2],[12,2],[3,3],[12,3]], V.c);
    pt(g, [[5,1],[8,1],[10,2]], V.o);
    pt(g, [[13,3],[13,4],[12,4]], V.c);
    pt(g, [[11,1],[11,2],[12,2],[13,4]], V.o);
  }
  return g;
}

function dessiner(){
  const g = grille(), out = [];
  for (let y = 0; y < GH; y++){
    let x = 0;
    while (x < GW){
      const c = g[y][x];
      if (c === null){ x++; continue; }
      let n = 1;
      while (x + n < GW && g[y][x + n] === c) n++;
      out.push(`<rect x="${x}" y="${y}" width="${n}" height="1" fill="${c}"/>`);
      x += n;
    }
  }
  $('portrait').innerHTML = out.join('');
}

/* ---------- CONTROLES ---------- */
function pastilles(cible, liste, cle){
  $(cible).innerHTML = liste.map((o,i) =>
    `<button class="pastille" data-i="${i}" aria-pressed="${etat[cle]===i}" aria-label="${o.n||o.id}" style="background:${o.c}"></button>`
  ).join('');
  $(cible).querySelectorAll('.pastille').forEach(b =>
    b.addEventListener('click', () => { etat[cle] = +b.dataset.i; rafraichir(); })
  );
}
function jetons(cible, liste, cle){
  $(cible).innerHTML = liste.map((n,i) =>
    `<button class="jeton" data-i="${i}" aria-pressed="${etat[cle]===i}">${n}</button>`
  ).join('');
  $(cible).querySelectorAll('.jeton').forEach(b =>
    b.addEventListener('click', () => { etat[cle] = +b.dataset.i; rafraichir(); })
  );
}

function rafraichir(){
  pastilles('r-peau', PEAUX, 'peau');
  pastilles('r-yeux', YEUX, 'yeux');
  pastilles('r-cheveux', CHEVEUX, 'cheveux');
  pastilles('r-veste', VESTES, 'veste');
  jetons('r-coiffure', COIFFURES, 'coiffure');
  jetons('r-barbe', BARBES, 'barbe');
  jetons('r-bouche', BOUCHES, 'bouche');
  jetons('r-tete', TETES, 'tete');
  jetons('r-lunettes', LUNETTES, 'lunettes');
  jetons('r-boucle', BOUCLES, 'boucle');
  jetons('r-motif', MOTIFS, 'motif');
  jetons('r-foulard', NOMS_FOULARD, 'foulard');
  dessiner();
}

function majCompte(){
  const v = $('pseudo').value;
  $('compte').textContent = v.length + '/18';
  $('rappel-nom').innerHTML = v.trim() ? '<b>' + v.trim().replace(/[<>&]/g, '') + '</b>' : 'Sans pseudo';
}
$('pseudo').addEventListener('input', () => { majCompte(); cacherMessage(); });

/* ---------- CADRE COLLANT ---------- */
const cadre = document.querySelector('.cadre');
const sentinelle = document.createElement('div');
sentinelle.style.cssText = 'position:absolute;top:0;height:1px;width:1px';
document.querySelector('.entete').appendChild(sentinelle);

if ('IntersectionObserver' in window){
  new IntersectionObserver(
    ([e]) => cadre.classList.toggle('compact', !e.isIntersecting),
    { rootMargin: '-90px 0px 0px 0px' }
  ).observe(sentinelle);
} else {
  addEventListener('scroll', () => cadre.classList.toggle('compact', scrollY > 90), { passive:true });
}

/* ---------- MESSAGES ---------- */
const boite = $('message');
function montrerMessage(t, type='erreur'){
  boite.textContent = t;
  boite.className = 'message visible ' + type;
  boite.scrollIntoView({ behavior:'smooth', block:'center' });
}
function cacherMessage(){ boite.className = 'message'; }

/* ---------- SESSION ---------- */
let utilisateur = null;
(async () => {
  utilisateur = await BD.utilisateur();
  if (!utilisateur) return location.replace('index.html');
  $('mat').textContent = 'Matricule ' + utilisateur.id.slice(0, 6).toUpperCase();

  const d = await BD.charger();
  if (d && d.pseudo) return location.replace(BD.PAGES[d.etape] || 'visite.html');

  rafraichir();
})();

/* ---------- ENREGISTREMENT ---------- */
$('valider').addEventListener('click', async () => {
  const pseudo = $('pseudo').value.trim().replace(/\s+/g, ' ');
  if (pseudo.length < 3 || pseudo.length > 18) return montrerMessage('Le pseudo fait entre 3 et 18 caractères.');
  if (!/^[\p{L}\p{N} '\-]+$/u.test(pseudo)) return montrerMessage('Lettres, chiffres, espaces, apostrophes et tirets seulement.');
  cacherMessage();

  const btn = $('valider');
  btn.disabled = true;
  btn.textContent = 'Enregistrement…';
  try {
    const r = await BD.enregistrer({
      pseudo,
      avatar: {
        peau: etat.peau, yeux: etat.yeux, cheveux: etat.cheveux, coiffure: etat.coiffure,
        barbe: etat.barbe, bouche: etat.bouche, tete: etat.tete, lunettes: etat.lunettes,
        boucle: etat.boucle, veste: etat.veste, motif: etat.motif, foulard: etat.foulard
      },
      etape: 'visite'
    });
    if (!r) throw new Error('Enregistrement impossible.');
    montrerMessage('Fiche enregistrée.', 'ok');
    setTimeout(() => location.href = 'visite.html', 700);
  } catch (e) {
    montrerMessage(e.message || 'Enregistrement impossible. Réessaie.');
    btn.disabled = false;
    btn.textContent = 'Continuer';
  }
});

$('sortir').addEventListener('click', () => BD.deconnexion());
</script>
