<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#050d16">
<title>Battledock — Tes compétences</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="couleurs.css?v=1">
<style>
:root{--nuit:#050d16;--brume:#7fa3c0;--sable:#e8e2d4;--ocre:#e0913a;--ocre-f:#a3611f;
      --papier:#e9e4d6;--encre:#2b2a26;--vert:#4fb286;--rouge:#e05c4a}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--nuit);color:var(--sable);
  font-family:'Barlow',system-ui,sans-serif;overflow-x:hidden;
  background-image:radial-gradient(100% 45% at 50% 0%, rgba(42,90,122,.5), transparent 64%);
  background-attachment:fixed;transition:background-color .3s;
}
body.chauffe{background-image:radial-gradient(100% 55% at 50% 0%, rgba(224,145,58,.28), transparent 66%)}
body.urgence{animation:pulseFond .5s infinite alternate}
@keyframes pulseFond{from{background-color:var(--nuit)}to{background-color:#160a0a}}

.ecran{max-width:460px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 20px) 18px calc(env(safe-area-inset-bottom) + 116px)}

/* ---------- écran d'accroche ---------- */
.accroche{text-align:center}
.accroche .sur{font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:var(--brume);margin-bottom:8px;padding-left:.34em}
.accroche h1{font-family:'Bebas Neue',sans-serif;font-size:31px;letter-spacing:.03em;line-height:1.05;margin-bottom:16px}

.perso{display:flex;gap:12px;align-items:flex-start;margin-bottom:20px;text-align:left}
.perso svg{flex:0 0 96px;width:96px;height:auto;border-radius:12px;border:1px solid rgba(127,163,192,.2)}
.bulle{position:relative;flex:1;background:rgba(233,228,214,.94);color:var(--encre);
  border-radius:14px;padding:13px 15px;font-size:14.5px;line-height:1.5;transition:background .25s}
.bulle::before{content:"";position:absolute;left:-7px;top:16px;border:7px solid transparent;border-right-color:rgba(233,228,214,.94);border-left:0}
.bulle em{font-style:normal;color:#7a756a;font-size:12.5px;display:block;margin-top:6px}
.perso.parle .bulle{background:#fff}

.ecouteur{
  display:flex;align-items:center;gap:14px;width:100%;
  background:linear-gradient(135deg,#1d3a52,#12283a);
  border:1px solid rgba(224,145,58,.4);border-radius:14px;
  padding:16px;cursor:pointer;text-align:left;color:var(--sable);
  font-family:'Barlow',sans-serif;transition:transform .12s,border-color .2s;
}
.ecouteur:active{transform:scale(.985)}
.ecouteur svg{flex:0 0 38px;width:38px;height:38px}
.ecouteur .t{flex:1}
.ecouteur .t b{display:block;font-size:15px;font-weight:600;margin-bottom:2px}
.ecouteur .t span{display:block;font-size:12.5px;color:#9dbcd4}
.ecouteur .play{flex:0 0 34px;height:34px;border-radius:50%;background:var(--ocre);
  display:flex;align-items:center;justify-content:center}
.ecouteur .play::after{content:"";border-left:11px solid #1a0f02;border-top:7px solid transparent;border-bottom:7px solid transparent;margin-left:3px}

/* ---------- chrono ---------- */
.chrono{
  position:sticky;top:calc(env(safe-area-inset-top) + 4px);z-index:6;
  display:flex;align-items:center;gap:13px;
  background:rgba(10,28,46,.94);backdrop-filter:blur(12px);
  border:1px solid rgba(127,163,192,.22);border-radius:14px;
  padding:11px 14px;margin-bottom:16px;
}
.chrono.rouge{border-color:rgba(224,92,74,.6)}
.anneau{flex:0 0 44px;width:44px;height:44px;position:relative}
.anneau svg{transform:rotate(-90deg)}
.anneau b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:'Courier Prime',monospace;font-size:15px;font-weight:700}
.chrono .info{flex:1;min-width:0}
.chrono .info b{display:block;font-size:13.5px;font-weight:600;margin-bottom:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chrono .info span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--brume)}
.egaliseur{display:flex;gap:2.5px;align-items:flex-end;height:22px;flex:0 0 auto}
.egaliseur i{width:3px;background:var(--ocre);border-radius:1.5px;height:20%}
.egaliseur.on i{animation:eq .7s ease-in-out infinite alternate}
.egaliseur i:nth-child(2){animation-delay:.1s}
.egaliseur i:nth-child(3){animation-delay:.25s}
.egaliseur i:nth-child(4){animation-delay:.05s}
.egaliseur i:nth-child(5){animation-delay:.3s}
@keyframes eq{from{height:18%}to{height:100%}}

/* ---------- points ---------- */
.pastilleP{
  display:flex;justify-content:space-between;align-items:baseline;
  margin:0 2px 14px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--brume);
}
.pastilleP b{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:.04em;color:var(--ocre)}
.pastilleP b.zero{color:var(--vert)}

.stat{
  background:rgba(10,28,46,.7);border:1px solid rgba(127,163,192,.16);
  border-radius:12px;padding:13px 14px;margin-bottom:10px;
}
.stat .haut{display:flex;align-items:center;gap:11px;margin-bottom:9px}
.stat .haut svg{flex:0 0 26px;width:26px;height:26px}
.stat .haut .n{flex:1;font-size:15px;font-weight:600}
.stat .haut .v{font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--ocre);min-width:24px;text-align:right}
.stat .d{font-size:12.5px;color:#8fa9bd;line-height:1.4;margin-bottom:10px}
.stat .bas{display:flex;align-items:center;gap:10px}
.jauge{flex:1;display:flex;gap:3px}
.jauge i{flex:1;height:9px;border-radius:2px;background:rgba(127,163,192,.16)}
.jauge i.plein{background:var(--ocre)}
.pm{flex:0 0 auto;display:flex;gap:7px}
.pm button{
  width:40px;height:40px;border-radius:10px;border:1px solid rgba(127,163,192,.25);
  background:rgba(5,13,22,.6);color:var(--sable);font-size:21px;line-height:1;cursor:pointer;
  transition:transform .1s,border-color .15s;font-family:'Barlow',sans-serif;
}
.pm button:active{transform:scale(.9)}
.pm button:disabled{opacity:.3;cursor:default}
.pm button.plus{border-color:rgba(224,145,58,.5)}

.etape{display:none}
.etape.on{display:block;animation:entre .4s ease-out}
@keyframes entre{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- bilan ---------- */
.bilan{background:var(--papier);color:var(--encre);border-radius:12px;padding:20px 18px;font-family:'Courier Prime',monospace}
.bilan h3{font-family:'Barlow',sans-serif;font-size:10px;letter-spacing:.24em;text-transform:uppercase;text-align:center;color:#7a756a;margin-bottom:14px}
.bilan .l{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px dotted rgba(43,42,38,.25);font-size:13px}
.bilan .l b{font-weight:700}
.bilan .l.auto b{color:#a8452e}
.bilan .pied{text-align:center;font-size:11.5px;color:#7a756a;margin-top:13px;line-height:1.6}

.barre{position:fixed;left:0;right:0;bottom:0;z-index:7;
  padding:14px 18px calc(env(safe-area-inset-bottom) + 16px);
  background:linear-gradient(180deg,rgba(5,13,22,0),rgba(5,13,22,.92) 32%,var(--nuit))}
.barre .dedans{max-width:460px;margin:0 auto;display:flex;gap:9px}
.principal{flex:1;background:var(--ocre);border:0;border-radius:10px;padding:17px;
  font-family:'Barlow',sans-serif;font-size:13px;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;color:#1a0f02;cursor:pointer;transition:transform .12s,background .2s}
.principal:active{transform:scale(.985);background:var(--ocre-f)}
.principal:disabled{opacity:.45;cursor:default}
.second{flex:0 0 auto;background:none;border:1px solid rgba(127,163,192,.3);border-radius:10px;
  padding:17px 16px;font-family:'Barlow',sans-serif;font-size:12px;font-weight:600;
  letter-spacing:.1em;text-transform:uppercase;color:var(--brume);cursor:pointer}
.second:disabled{opacity:.3;cursor:default}

.g-buste{animation:resp 3.6s ease-in-out infinite;transform-origin:48px 92px}
@keyframes resp{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.02)}}
.g-tete{animation:hoche 1.9s ease-in-out infinite;transform-origin:48px 60px}
@keyframes hoche{0%,100%{transform:rotate(0) translateY(0)}50%{transform:rotate(-2.5deg) translateY(-1.5px)}}
.g-paup{transform:scaleY(0);transform-origin:48px 38px;animation:cligne 5.2s infinite}
@keyframes cligne{0%,95.5%{transform:scaleY(0)}96.5%,98.5%{transform:scaleY(1)}100%{transform:scaleY(0)}}
.note-mus{opacity:0}
.joue .note-mus{animation:flotte 2.4s ease-out infinite}
.joue .g-tete{animation:hoche 1s ease-in-out infinite}
@keyframes flotte{0%{opacity:0;transform:translate(0,0) rotate(0)}
  25%{opacity:.9}100%{opacity:0;transform:translate(10px,-22px) rotate(18deg)}}
@media (prefers-reduced-motion:reduce){
  .g-buste,.g-tete,.egaliseur.on i,.note-mus,.etape.on,body.urgence{animation:none}
  .g-paup{animation:none;transform:scaleY(0)}
}
</style>
</head>
<body>

<main class="ecran">

  <!-- ---------- 0 : l'accroche ---------- -->
  <section class="etape on" id="e0">
    <div class="accroche">
      <p class="sur">Vestiaire — 6 h 14</p>
      <h1>Le gars du casier d'à côté</h1>
    </div>

    <div class="perso" id="perso">
      <svg viewBox="0 0 96 104" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect width="96" height="104" rx="10" fill="#1b2a20"/>
        <rect width="96" height="70" fill="#22342a"/>
        <g fill="#2c4436">
          <rect x="4" y="6" width="26" height="60" rx="2"/>
          <rect x="66" y="6" width="26" height="60" rx="2"/>
        </g>
        <g fill="#1a2a20">
          <rect x="7" y="10" width="20" height="2"/><rect x="7" y="15" width="20" height="2"/>
          <rect x="69" y="10" width="20" height="2"/><rect x="69" y="15" width="20" height="2"/>
        </g>
        <circle cx="26" cy="40" r="2.4" fill="#8a939b"/>
        <circle cx="70" cy="40" r="2.4" fill="#8a939b"/>
        <rect x="0" y="66" width="96" height="4" fill="#2c4436"/>
        <ellipse cx="48" cy="101" rx="34" ry="3" fill="#040c14" opacity=".3"/>

        <g class="g-buste">
          <path d="M16 92 q0 -22 14 -27 h36 q14 5 14 27 z" fill="#c8641f"/>
          <path d="M48 65 h18 q14 5 14 27 h-32 z" fill="#a04d12"/>
          <path d="M38 63 h20 v11 q-10 5 -20 0 z" fill="#a97048"/>
          <path d="M36 66 q12 12 24 0 l5 3 -17 15 -17 -15 z" fill="#c8641f"/>
          <path d="M36 66 q12 12 24 0 l5 3 -17 15 -17 -15 z" fill="#1a1208" opacity=".18"/>
        </g>

        <g class="g-tete">
          <ellipse cx="29" cy="40" rx="4" ry="6" fill="#a97048"/>
          <ellipse cx="67" cy="40" rx="4" ry="6" fill="#a97048"/>
          <path d="M30 38 q0 -22 18 -22 t18 22 q0 18 -18 24 q-18 -6 -18 -24 z" fill="#b57c50"/>
          <path d="M48 16 q18 0 18 22 q0 18 -18 24 z" fill="#94603a" opacity=".4"/>
          <path d="M28 32 q2 -22 20 -22 t20 22 q-6 -12 -20 -12 t-20 12 z" fill="#171310"/>
          <path d="M30 30 q4 -8 10 -10 q-4 8 -4 12 z" fill="#0b0908"/>
          <path d="M36 34 q6 -3 11 -1" stroke="#171310" stroke-width="2.2" fill="none" stroke-linecap="round"/>
          <path d="M60 34 q-6 -3 -11 -1" stroke="#171310" stroke-width="2.2" fill="none" stroke-linecap="round"/>
          <ellipse cx="41" cy="40" rx="4.4" ry="3.2" fill="#f6f1e6"/>
          <circle cx="41.6" cy="40.2" r="1.9" fill="#2a1c12"/>
          <ellipse cx="55" cy="40" rx="4.4" ry="3.2" fill="#f6f1e6"/>
          <circle cx="55.6" cy="40.2" r="1.9" fill="#2a1c12"/>
          <g class="g-paup">
            <rect x="36" y="36" width="10" height="8" rx="1" fill="#b57c50"/>
            <rect x="50" y="36" width="10" height="8" rx="1" fill="#b57c50"/>
          </g>
          <path d="M46 45 q-1 6 -3 8 q0 2 5 2 t5 -2 q-2 -2 -3 -8" fill="#94603a" opacity=".5"/>
          <path d="M39 57 q9 7 18 0 q-4 6 -9 6 t-9 -6 z" fill="#7d3a2e"/>
          <path d="M41 58 q7 3 14 0 q-3 2 -7 2 t-7 -2 z" fill="#f2eee2"/>
          <path d="M30 40 q-6 -2 -6 -8 q0 -8 8 -8" fill="none" stroke="#d8d3c4" stroke-width="2"/>
          <circle cx="30" cy="42" r="3" fill="#e9e4d6"/>
        </g>

        <g class="note-mus" fill="#e0913a">
          <path d="M74 46 v-11 l7 -2 v11" stroke="#e0913a" stroke-width="1.6" fill="none"/>
          <circle cx="72.5" cy="46" r="2.4"/><circle cx="79.5" cy="44" r="2.4"/>
        </g>
      </svg>
      <div class="bulle" id="bulle">
        Tiens. Écoute ça.
        <em>Il te tend un écouteur. Il ne s'est pas présenté.</em>
      </div>
    </div>

    <button class="ecouteur" id="ecouteur">
      <svg viewBox="0 0 38 38" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect width="38" height="38" rx="7" fill="#0f2131"/>
        <path d="M15 26 V12 l11 -3 v14" stroke="#e0913a" stroke-width="2.4" fill="none"/>
        <circle cx="12.5" cy="26" r="3.6" fill="#e0913a"/>
        <circle cx="23.5" cy="23" r="3.6" fill="#e0913a"/>
      </svg>
      <span class="t">
        <b>Sa musique préférée</b>
        <span id="etat-mus">Il insiste. Appuie pour écouter.</span>
      </span>
      <span class="play"></span>
    </button>
  </section>

  <!-- ---------- 1 : les compétences ---------- -->
  <section class="etape" id="e1">
    <div class="chrono" id="chrono">
      <div class="anneau">
        <svg viewBox="0 0 44 44" width="44" height="44" xmlns="http://www.w3.org/2000/svg">
          <circle cx="22" cy="22" r="19" fill="none" stroke="rgba(127,163,192,.2)" stroke-width="4"/>
          <circle id="arc" cx="22" cy="22" r="19" fill="none" stroke="#e0913a" stroke-width="4"
                  stroke-linecap="round" stroke-dasharray="119.4" stroke-dashoffset="0"/>
        </svg>
        <b id="secondes">45</b>
      </div>
      <div class="info">
        <b id="titre-mus">Ça tourne. Dépêche-toi.</b>
        <span id="sous-mus">Répartis tes points</span>
      </div>
      <div class="egaliseur on"><i></i><i></i><i></i><i></i><i></i></div>
    </div>

    <div class="pastilleP"><span>Points à placer</span><b id="restants">10</b></div>
    <div id="stats"></div>
  </section>

  <!-- ---------- 2 : bilan ---------- -->
  <section class="etape" id="e2">
    <div class="perso" id="perso2" style="margin-bottom:16px">
      <div class="bulle" id="bulle2" style="margin-left:0"></div>
    </div>
    <div class="bilan">
      <h3>Fiche d'aptitude</h3>
      <div id="bilan-lignes"></div>
      <p class="pied" id="bilan-pied"></p>
    </div>
  </section>
</main>

<div class="barre"><div class="dedans">
  <button class="second" id="refaire" style="display:none">Recommencer</button>
  <button class="principal" id="suivant" disabled>Écoute d'abord</button>
</div></div>

<audio id="son" preload="auto" playsinline crossorigin="anonymous" src="musique.mp3"></audio>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="bd.js"></script>
<script>
const $ = id => document.getElementById(id);
const son = $('son');

/* --- lecture avec repli Web Audio si la balise <audio> est bloquée --- */
let ctx = null, source = null, tampon = null, joueWebAudio = false, promesseTampon = null;
/* on télécharge le morceau tout de suite, sans le décoder */
let octets = fetch('musique.mp3').then(r => r.arrayBuffer()).catch(() => null);

async function chargerTampon(){
  if (tampon) return tampon;
  if (promesseTampon) return promesseTampon;
  promesseTampon = (async () => {
    let buf = await octets;
    if (!buf) buf = await (await fetch('musique.mp3')).arrayBuffer();
    ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
    tampon = await ctx.decodeAudioData(buf.slice(0));
    return tampon;
  })();
  return promesseTampon;
}

async function jouer(){
  /* le contexte doit naître du geste de l'utilisateur */
  try {
    ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') await ctx.resume();
  } catch (e) {}
  try {
    son.currentTime = 0;
    son.volume = 1;
    await son.play();
    await new Promise(r => setTimeout(r, 350));
    if (!son.paused && son.currentTime > 0.05){ joueWebAudio = false; return true; }
  } catch (e) {}
  try {
    const b = await chargerTampon();
    if (ctx.state === 'suspended') await ctx.resume();
    if (source) { try { source.stop(); } catch(e){} }
    source = ctx.createBufferSource();
    source.buffer = b;
    gain = ctx.createGain();
    source.connect(gain).connect(ctx.destination);
    source.start(0);
    joueWebAudio = true;
    return true;
  } catch (e) {
    $('sous-mus').textContent = 'Son bloqué — le chrono tourne quand même';
    return false;
  }
}

let gain = null;
function arreterSon(){
  if (joueWebAudio && source){
    try {
      const t = ctx.currentTime;
      gain.gain.setValueAtTime(gain.gain.value, t);
      gain.gain.linearRampToValueAtTime(0.0001, t + 0.6);
      source.stop(t + 0.7);
    } catch(e){}
    source = null;
    return;
  }
  const fade = setInterval(() => {
    if (son.volume > 0.06) son.volume -= 0.06;
    else { son.pause(); son.volume = 1; clearInterval(fade); }
  }, 60);
}

const DUREE = 45;
const POINTS = 10;

const STATS = [
  { id:'force', n:'Force', d:"Ce que tu portes sans faire de bruit. Charge max et vitesse de chargement.",
    i:'<path d="M4 14 h4 v-4 h10 v4 h4 v6 h-4 v4 H8 v-4 H4 z" fill="#e0913a"/><rect x="1" y="10" width="3" height="10" rx="1.5" fill="#c47a22"/><rect x="22" y="10" width="3" height="10" rx="1.5" fill="#c47a22"/>' },
  { id:'endurance', n:'Endurance', d:"Le nombre d'heures avant que tu t'assoies. Tenue sur un quart entier.",
    i:'<path d="M13 24 C4 17 2 12 2 9 a6 6 0 0 1 11 -3 a6 6 0 0 1 11 3 c0 3 -2 8 -11 15 z" fill="#e05c4a"/><path d="M2 13 h5 l2 -4 l3 8 l2 -6 l2 3 h8" stroke="#12283a" stroke-width="1.6" fill="none"/>' },
  { id:'precision', n:'Précision', d:"Poser sans casser. Réduit la casse, bonus sur les marchandises fragiles.",
    i:'<circle cx="13" cy="13" r="11" fill="none" stroke="#4fb286" stroke-width="2.4"/><circle cx="13" cy="13" r="5.5" fill="none" stroke="#4fb286" stroke-width="2.4"/><circle cx="13" cy="13" r="1.8" fill="#4fb286"/>' },
  { id:'negociation', n:'Négociation', d:"Le prix que tu obtiens. Achats moins chers, ventes plus hautes.",
    i:'<path d="M13 2 L24 8 v10 l-11 6 -11 -6 V8 z" fill="none" stroke="#c9a83a" stroke-width="2"/><path d="M8 13 h10 M13 9 v8" stroke="#c9a83a" stroke-width="2.2" stroke-linecap="round"/>' },
  { id:'discussion', n:'Discussion', d:"Ce qu'on te raconte. Infos, rumeurs, tuyaux qu'on ne donne pas aux autres.",
    i:'<path d="M2 5 h16 q2 0 2 2 v7 q0 2 -2 2 H9 l-5 4 v-4 H2 q-2 0 -2 -2 V7 q0 -2 2 -2 z" fill="#7fa3c0"/><path d="M22 10 h2 q2 0 2 2 v6 q0 2 -2 2 h-1 v3 l-4 -3 h-4 q-1 0 -1.6 -.6" fill="#4a7f9e"/>' }
];

let val = {}, restants = POINTS, minuteur = null, reste = DUREE, fini = false, essais = 0;
STATS.forEach(s => val[s.id] = 1);

/* ---------- rendu des stats ---------- */
function rendre(){
  $('stats').innerHTML = STATS.map(s => {
    const v = val[s.id];
    return `<div class="stat">
      <div class="haut">
        <svg viewBox="0 0 26 26" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${s.i}</svg>
        <span class="n">${s.n}</span><span class="v" id="v-${s.id}">${v}</span>
      </div>
      <p class="d">${s.d}</p>
      <div class="bas">
        <span class="jauge">${[1,2,3,4,5,6].map(k => `<i class="${k <= v ? 'plein' : ''}"></i>`).join('')}</span>
        <span class="pm">
          <button data-s="${s.id}" data-d="-1" ${v <= 1 ? 'disabled' : ''}>−</button>
          <button class="plus" data-s="${s.id}" data-d="1" ${(v >= 6 || restants <= 0) ? 'disabled' : ''}>+</button>
        </span>
      </div>
    </div>`;
  }).join('');
  $('stats').querySelectorAll('button').forEach(b =>
    b.addEventListener('click', () => bouger(b.dataset.s, +b.dataset.d)));
  $('restants').textContent = restants;
  $('restants').classList.toggle('zero', restants === 0);
  $('suivant').disabled = restants > 0;
  $('suivant').textContent = restants > 0 ? 'Place tes ' + restants + ' points' : 'Valider';
}

function bouger(id, d){
  if (fini) return;
  if (d > 0 && (restants <= 0 || val[id] >= 6)) return;
  if (d < 0 && val[id] <= 1) return;
  val[id] += d; restants -= d;
  rendre();
}

/* ---------- musique + chrono ---------- */
$('ecouteur').addEventListener('click', () => {
  jouer().then(ok => { if (!ok) $('etat-mus').textContent = 'Le son est coupé sur ton téléphone.'; });
  $('perso').classList.add('joue');
  $('e0').classList.remove('on');
  $('e1').classList.add('on');
  document.body.classList.add('chauffe');
  rendre();
  demarrer();
});

const CIRC = 2 * Math.PI * 19;
function demarrer(){
  reste = DUREE; fini = false;
  $('chrono').classList.remove('rouge');
  document.body.classList.remove('urgence');
  $('titre-mus').textContent = 'Ça tourne. Dépêche-toi.';
  clearInterval(minuteur);
  const t0 = Date.now();
  minuteur = setInterval(() => {
    reste = Math.max(0, DUREE - (Date.now() - t0) / 1000);
    $('secondes').textContent = Math.ceil(reste);
    $('arc').style.strokeDashoffset = (CIRC * (1 - reste / DUREE)).toFixed(1);
    if (reste <= 10){
      $('chrono').classList.add('rouge');
      document.body.classList.add('urgence');
      $('arc').style.stroke = '#e05c4a';
      $('titre-mus').textContent = 'La chanson va finir !';
    }
    if (reste <= 0) tempsEcoule();
  }, 100);
}

function stopper(){
  clearInterval(minuteur);
  fini = true;
  document.body.classList.remove('urgence');
  arreterSon();
  $('perso').classList.remove('joue');
  document.querySelector('.egaliseur').classList.remove('on');
}

let auto = [];
function tempsEcoule(){
  stopper();
  auto = [];
  while (restants > 0){
    const dispo = STATS.filter(s => val[s.id] < 6);
    const s = dispo[Math.floor(Math.random() * dispo.length)];
    val[s.id]++; restants--;
    auto.push(s.id);
  }
  rendre();
  bilan(true);
}

$('suivant').addEventListener('click', () => {
  if ($('e2').classList.contains('on')){
    $('suivant').disabled = true;
    $('suivant').textContent = 'Enregistrement…';
    $('refaire').style.display = 'none';
    terminerCompetences(auto.length > 0);
    return;
  }
  stopper();
  bilan(false);
});

/* ---------- bilan ---------- */
function bilan(parDefaut){
  $('e1').classList.remove('on');
  $('e2').classList.add('on');
  document.body.classList.remove('chauffe');

  $('bulle2').innerHTML = parDefaut
    ? "Ah... plus de batterie. Bon, bah on va te faire des stats aléatoirement !"
      + "<em>Il range son téléphone. Il n'a pas proposé de recharger.</em>"
    : "Pas mal. Moi j'ai tout mis dans la discussion."
      + "<em>Il reprend son écouteur sans attendre de réponse.</em>";

  $('bilan-lignes').innerHTML = STATS.map(s => {
    const parLui = auto.includes(s.id);
    return `<div class="l ${parLui ? 'auto' : ''}">
      <span>${s.n}${parLui ? ' *' : ''}</span><b>${val[s.id]} / 6</b></div>`;
  }).join('');

  $('bilan-pied').innerHTML = parDefaut
    ? '* Attribué à la fin du morceau.<br>Tu peux tout refaire une fois.'
    : 'Répartition validée dans les temps.<br>Non modifiable.';

  $('refaire').style.display = parDefaut && essais === 0 ? 'block' : 'none';
  $('suivant').disabled = false;
  $('suivant').textContent = 'Continuer';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

$('refaire').addEventListener('click', () => {
  essais++;
  STATS.forEach(s => val[s.id] = 1);
  restants = POINTS; auto = [];
  $('e2').classList.remove('on');
  $('e1').classList.add('on');
  document.body.classList.add('chauffe');
  document.querySelector('.egaliseur').classList.add('on');
  $('arc').style.stroke = '#e0913a';
  $('perso').classList.add('joue');
  $('refaire').style.display = 'none';
  jouer();
  rendre();
  demarrer();
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

/* ---------- Battle Dock ---------- */
let FICHE = null;
(async () => {
  FICHE = await BD.garder('competences');
  if (!FICHE) return;
  const EQ = await BD.lire('equipement');
  Object.assign(etat, BD.avatarDe(FICHE, EQ));
})();

async function terminerCompetences(parDefaut){
  await BD.poser('competences', {
    force: val.force, endurance: val.endurance, precision_: val.precision,
    negociation: val.negociation, discussion: val.discussion,
    par_defaut: !!parDefaut
  });
  await BD.avancer('competences');
}

</script>
