<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Battle Dock — la mer par tous les temps</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#12303f;font-family:'Nunito',system-ui,sans-serif;color:#fdf6e6;padding:26px 16px 56px}
.tit{max-width:1040px;margin:0 auto 18px}
.tit h1{font-family:'DM Serif Display',Georgia,serif;font-size:26px}
.tit p{font-size:13px;color:rgba(253,246,230,.55);margin-top:6px;line-height:1.6}
.barre{max-width:1040px;margin:0 auto 22px;display:flex;flex-wrap:wrap;gap:9px}
.barre button{display:flex;align-items:center;gap:8px;padding:9px 16px 9px 11px;
  border-radius:24px;cursor:pointer;font-size:13px;font-weight:900;
  border:3px solid #fdf6e6;background:transparent;color:#fdf6e6;font-family:'Nunito',sans-serif}
.barre button svg{width:20px;height:20px;overflow:visible}
.barre button svg [stroke]{stroke:#fdf6e6}
.barre button.on{background:#f0a92e;color:#12303f;border-color:#f0a92e}
.barre button.on svg [stroke]{stroke:#12303f}
.rang{max-width:1040px;margin:0 auto;display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.tel{position:relative;isolation:isolate;width:340px;height:640px;border-radius:36px;
  overflow:hidden;border:6px solid #fdf6e6;background:#2b6f92;flex:0 0 auto;
  font-family:'Nunito',system-ui,sans-serif;color:#fdf6e6}
.cote{flex:1;min-width:260px}
.cote h3{font-size:11px;letter-spacing:.2em;text-transform:uppercase;
  color:rgba(253,246,230,.55);margin-bottom:12px;font-weight:900}
.fiche{border:3px solid #fdf6e6;border-radius:16px;overflow:hidden}
.fiche div{display:flex;justify-content:space-between;gap:12px;padding:12px 15px;
  font-size:13px;border-bottom:2px solid rgba(253,246,230,.2)}
.fiche div:last-child{border-bottom:0}
.fiche div span{color:rgba(253,246,230,.6);font-weight:700}
.fiche div b{font-weight:900}
.fiche div b.bon{color:#7fd8a0} .fiche div b.dur{color:#f0a92e}
.jauge{margin-top:18px}
.jauge label{font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:rgba(253,246,230,.5);font-weight:900}
.jauge input{width:100%;margin-top:10px;accent-color:#f0a92e}
.note{font-size:12.5px;color:rgba(253,246,230,.5);line-height:1.7;margin-top:18px}

/* ============================================================
   EN MER — l'affiche
   Deux aplats francs séparés d'une ligne d'horizon nette. Le
   disque traverse le ciel : sa course EST la traversée. Pas de
   jauge, pas de carte posée par-dessus — le décor dit tout.
   ============================================================ */

:root{
  --encre:#12303f; --creme:#fdf6e6; --or:#f0a92e;
  --ciel:#f0a94e; --eau:#2b6f92; --disque:#fff0c4;
}


/* ---------- le ciel ---------- */
#ciel{position:absolute;left:0;right:0;top:0;height:62%;z-index:-3;
  background:var(--ciel)}
/* ---------- l'eau, et la ligne d'horizon qui les sépare ---------- */
#eau{position:absolute;left:0;right:0;bottom:0;height:38%;z-index:-3;
  background:var(--eau);border-top:4px solid var(--encre)}

/* ---------- les étoiles ---------- */
#etoiles{position:absolute;left:0;right:0;top:0;height:62%;z-index:-2;opacity:0;
  pointer-events:none;transition:opacity .5s linear;
  background-image:
    radial-gradient(1.7px 1.7px at 11% 20%,#fff6e0 50%,transparent 51%),
    radial-gradient(1.4px 1.4px at 29% 8%, #fff6e0 50%,transparent 51%),
    radial-gradient(2.1px 2.1px at 47% 28%,#fff6e0 50%,transparent 51%),
    radial-gradient(1.4px 1.4px at 63% 12%,#fff6e0 50%,transparent 51%),
    radial-gradient(1.8px 1.8px at 81% 24%,#fff6e0 50%,transparent 51%),
    radial-gradient(1.4px 1.4px at 19% 38%,#fff6e0 50%,transparent 51%),
    radial-gradient(1.7px 1.7px at 55% 44%,#fff6e0 50%,transparent 51%),
    radial-gradient(1.4px 1.4px at 91% 7%, #fff6e0 50%,transparent 51%),
    radial-gradient(1.9px 1.9px at 73% 36%,#fff6e0 50%,transparent 51%),
    radial-gradient(1.4px 1.4px at 36% 52%,#fff6e0 50%,transparent 51%),
    radial-gradient(1.5px 1.5px at 6% 48%, #fff6e0 50%,transparent 51%),
    radial-gradient(1.6px 1.6px at 96% 42%,#fff6e0 50%,transparent 51%)}

/* ---------- le disque : sa course dit où tu en es ---------- */
#disque{position:absolute;z-index:-2;width:26vw;max-width:132px;aspect-ratio:1;
  border-radius:50%;margin:-13vw 0 0 -13vw;pointer-events:none;
  background:var(--disque);border:4px solid var(--encre)}

/* ---------- la houle : trois rangs de tirets ----------
   Son amplitude et sa vitesse suivent le temps qu'il fait. */
.houle{position:absolute;left:-60%;right:-60%;z-index:-1;height:5px;border-radius:3px;
  background:repeating-linear-gradient(90deg,#fdf6e6 0 26px,transparent 26px 62px);
  will-change:transform;transition:opacity .8s,height .8s}
.h1{bottom:29%;opacity:calc(.16 * var(--mer,1));animation:file calc(14s / var(--vit,1)) linear infinite}
.h2{bottom:22%;opacity:calc(.2 * var(--mer,1));height:calc(6px * var(--mer,1));
  animation:file calc(10s / var(--vit,1)) linear infinite reverse}
.h3{bottom:12%;opacity:calc(.26 * var(--mer,1));height:calc(8px * var(--mer,1));
  animation:file calc(7s / var(--vit,1)) linear infinite}
@keyframes file{to{transform:translateX(62px)}}

/* ---------- la barque, posée sur l'horizon ----------
   Par gros temps elle monte plus haut et gîte davantage. */
#barque{position:absolute;left:50%;bottom:34%;z-index:0;width:126px;margin-left:-63px;
  animation:souleve var(--bal,4.8s) ease-in-out infinite;will-change:transform}
#barque svg{display:block;width:100%;height:auto;
  animation:penche var(--bal,4.8s) ease-in-out infinite;transform-origin:50% 88%}
@keyframes souleve{0%,50%,100%{transform:translateY(0)}
  25%{transform:translateY(calc(-8px * var(--lev,1)))}
  75%{transform:translateY(calc(6px * var(--lev,1)))}}
@keyframes penche{0%{transform:rotate(calc(2.4deg * var(--gite,1)))}
  25%{transform:rotate(0)}
  50%{transform:rotate(calc(-2.4deg * var(--gite,1)))}
  75%{transform:rotate(0)}
  100%{transform:rotate(calc(2.4deg * var(--gite,1)))}}

/* ============================================================
   LE TEMPS QU'IL FAIT, EN MER
   Même langue que le reste de l'affiche : des aplats, des
   contours d'encre à 4 px, du crème. Pas un seul dégradé.
   ============================================================ */

/* ---------- les nuages : des formes pleines qui dérivent ---------- */
#nuages{position:absolute;left:0;right:0;top:0;height:62%;z-index:-1;
  opacity:0;pointer-events:none;transition:opacity 1s}
#nuages.on{opacity:1}
#nuages i{position:absolute;display:block;will-change:transform}
#nuages i svg{display:block;width:100%;height:auto;overflow:visible}
#nuages .n1{left:-38%;top:6%;width:52%;animation:derive 34s linear infinite}
#nuages .n2{left:-46%;top:20%;width:64%;animation:derive 46s linear infinite;
  animation-delay:-14s}
#nuages .n3{left:-30%;top:33%;width:40%;animation:derive 26s linear infinite;
  animation-delay:-8s}
@keyframes derive{to{transform:translateX(260%)}}
/* le mistral pousse tout devant lui */
#nuages.vite .n1{animation-duration:9s}
#nuages.vite .n2{animation-duration:13s}
#nuages.vite .n3{animation-duration:7s}

/* ---------- la pluie : des traits francs, espacés, en biais ----------
   Peu de traits, bien visibles. Une averse, pas un grésil. */
#grain{position:absolute;inset:-40% -40%;z-index:1;opacity:0;pointer-events:none;
  transition:opacity 1s;transform:rotate(15deg)}
#grain.on{opacity:1}
#grain i{position:absolute;left:0;right:0;top:0;height:200%;
  background-image:repeating-linear-gradient(90deg,
    #eaf2f6 0 4px, transparent 4px 74px);
  -webkit-mask-image:repeating-linear-gradient(180deg,
    #000 0 30px, transparent 30px 96px);
  mask-image:repeating-linear-gradient(180deg,
    #000 0 30px, transparent 30px 96px);
  animation:verse .62s linear infinite}
#grain .g1{opacity:.75}
#grain .g2{left:31px;top:-48px;opacity:.42;animation-duration:.46s}
@keyframes verse{to{transform:translateY(96px)}}

/* ---------- la brume : elle ne se pose pas, elle efface ----------
   Pas de bandes grises par-dessus : l'horizon disparaît, la barque
   et le disque s'estompent. La brume, c'est du décor en moins. */
.tel.noyee #eau{border-top-color:transparent}
.tel.noyee #barque{opacity:.62;filter:blur(.6px)}
.tel.noyee #disque{opacity:.34}
.tel.noyee .houle{opacity:.07!important}
.tel.noyee .haut .nom{opacity:.8}
/* un banc de brume unique, posé sur l'horizon, qui respire */
#brume{position:absolute;left:-30%;right:-30%;top:44%;height:26%;z-index:2;
  border-radius:50%;background:#e4e2d6;opacity:0;pointer-events:none;
  filter:blur(22px);transition:opacity 1.4s;
  animation:respire 13s ease-in-out infinite}
#brume.on{opacity:.85}
@keyframes respire{0%,100%{transform:translateX(0) scaleY(1)}
  50%{transform:translateX(4%) scaleY(1.18)}}

/* ---------- l'éclair : une forme découpée, pas une lueur ---------- */
#foudre{position:absolute;left:0;right:0;top:0;height:70%;z-index:3;
  pointer-events:none;opacity:0}
#foudre svg{position:absolute;top:0;width:26%;height:auto;overflow:visible}
#foudre.frappe{animation:frappe .58s steps(1,end)}
@keyframes frappe{
  0%{opacity:0}8%{opacity:1}20%{opacity:0}30%{opacity:1}44%{opacity:0}
  54%{opacity:1}70%{opacity:0}100%{opacity:0}}
/* le ciel blanchit une fraction de seconde avec lui */
#jour{position:absolute;inset:0;z-index:2;background:#fffaf0;opacity:0;
  pointer-events:none}
#jour.frappe{animation:blanchit .58s steps(1,end)}
@keyframes blanchit{
  0%{opacity:0}8%{opacity:.46}20%{opacity:0}30%{opacity:.3}44%{opacity:0}
  54%{opacity:.34}70%{opacity:0}100%{opacity:0}}

/* ---------- le vent : les mêmes tirets que la houle, dans le ciel ---------- */
#vent{position:absolute;left:0;right:0;top:0;height:60%;z-index:1;
  opacity:0;pointer-events:none;transition:opacity 1s}
#vent.on{opacity:.62}
#vent i{position:absolute;left:-70%;right:-70%;height:4px;border-radius:3px;
  background:repeating-linear-gradient(90deg,
    #fdf6e6 0 34px, transparent 34px 150px);
  will-change:transform;animation:souffle 2.4s linear infinite}
#vent .v1{top:22%;opacity:.9}
#vent .v2{top:31%;opacity:.6;animation-duration:1.8s;animation-delay:-.7s}
#vent .v3{top:44%;opacity:.75;animation-duration:3s;animation-delay:-1.4s}
@keyframes souffle{to{transform:translateX(150px)}}

/* ---------- le bandeau qui nomme le temps ---------- */
.meteo{position:absolute;z-index:5;right:24px;top:calc(0px + 26px);
  display:flex;align-items:center;gap:9px;padding:9px 15px 9px 12px;border-radius:24px;
  background:var(--creme);border:4px solid var(--encre);
  opacity:0;transform:translateY(-10px);transition:opacity .6s,transform .6s}
.meteo.on{opacity:1;transform:none}
.meteo svg{display:block;width:24px;height:24px;overflow:visible}
.meteo span{font-size:11px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;
  color:var(--encre);white-space:nowrap}

/* ---------- le cap, écrit à même le ciel ---------- */
.haut{position:absolute;left:24px;right:24px;z-index:3;
  top:calc(0px + 26px)}
.haut .de{font-size:10px;font-weight:800;letter-spacing:.28em;text-transform:uppercase;
  color:rgba(253,246,230,.68)}
.haut .nom{font-family:'DM Serif Display',Georgia,serif;
  font-size:clamp(40px,13vw,64px);line-height:.94;margin-top:9px;
  color:var(--creme);text-shadow:0 3px 0 rgba(18,48,63,.24)}
/* le filet, coupé par l'heure du bord */
.haut .fil{display:flex;align-items:center;gap:12px;margin-top:16px}
.haut .fil i{flex:1;height:3px;border-radius:2px;background:rgba(253,246,230,.36)}
.haut .fil span{font-size:11px;font-weight:800;letter-spacing:.2em;
  color:rgba(253,246,230,.9);white-space:nowrap}

/* ---------- le mot du moment, à même l'eau ---------- */
.bas{position:absolute;left:24px;right:24px;z-index:4;
  bottom:calc(0px + 24px);text-align:center}
.bas .mot{font-family:'DM Serif Display',Georgia,serif;font-size:20px;line-height:1.25;
  color:var(--creme);text-shadow:0 2px 12px rgba(8,24,38,.4)}
.bas .reste{font-size:10.5px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;
  color:rgba(253,246,230,.6);margin-top:11px}

.arriver{width:100%;margin-top:22px;padding:20px;border-radius:18px;cursor:pointer;
  font-family:'DM Serif Display',Georgia,serif;font-size:22px;color:var(--encre);
  background:var(--or);border:4px solid var(--encre);
  opacity:0;transform:translateY(14px);pointer-events:none;
  transition:opacity .7s,transform .7s cubic-bezier(.2,.8,.3,1),background .12s}
.arriver.on{opacity:1;transform:none;pointer-events:auto}
.arriver:active{background:#d9962a}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
:focus-visible{outline:3px solid #fffaf0;outline-offset:2px}

/* ---------- l'aube, le temps que la page se pose ---------- */
#charge{position:absolute;inset:0;z-index:90;background:#f0a94e;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
  transition:opacity .45s ease}
#charge.parti{opacity:0;pointer-events:none}
#charge .ti{font-family:'DM Serif Display',Georgia,serif;font-size:27px;color:#fffaf0}
#charge .fl{width:118px;height:3px;border-radius:2px;
  background:rgba(255,250,240,.28);overflow:hidden}
#charge .fl i{display:block;width:38%;height:100%;border-radius:2px;background:#fffaf0;
  animation:vague 1.15s ease-in-out infinite}
@keyframes vague{0%{transform:translateX(-115%)}100%{transform:translateX(275%)}}

</style></head><body>
<div class="tit"><h1>La mer, par tous les temps</h1>
<p>Chaque ciel a sa palette choisie — plus de couleurs moyennées. Fais glisser la traversée.</p></div>
<div class="barre" id="barre"></div>
<div class="rang">
  <div class="tel" id="tel">

<div id="charge" class="parti" style="display:none"><div class="ti">Battle Dock</div><div class="fl"><i></i></div></div>

<div id="ciel"></div>
<div id="etoiles"></div>
<div id="disque"></div>
<div id="eau"></div>
<i class="houle h1"></i><i class="houle h2"></i><i class="houle h3"></i>

<div id="nuages">
  <i class="n1"><svg viewBox="0 0 200 82" xmlns="http://www.w3.org/2000/svg">
    <path d="M28 74 q-26 0 -26 -21 q0 -19 21 -22 q3 -25 30 -25 q19 0 28 15
      q11 -12 28 -12 q28 0 32 26 q23 2 23 20 q0 19 -25 19 Z"
      fill="var(--nuage,#fdf6e6)" stroke="#12303f" stroke-width="5"
      stroke-linejoin="round"/></svg></i>
  <i class="n2"><svg viewBox="0 0 240 92" xmlns="http://www.w3.org/2000/svg">
    <path d="M34 84 q-31 0 -31 -25 q0 -22 26 -25 q6 -30 38 -30 q23 0 33 18
      q13 -14 33 -14 q34 0 38 31 q28 3 28 24 q0 21 -30 21 Z"
      fill="var(--nuage,#fdf6e6)" stroke="#12303f" stroke-width="5"
      stroke-linejoin="round"/></svg></i>
  <i class="n3"><svg viewBox="0 0 160 66" xmlns="http://www.w3.org/2000/svg">
    <path d="M24 58 q-21 0 -21 -17 q0 -15 17 -18 q3 -20 25 -20 q15 0 22 12
      q9 -10 23 -10 q22 0 26 21 q18 2 18 16 q0 16 -20 16 Z"
      fill="var(--nuage,#fdf6e6)" stroke="#12303f" stroke-width="5"
      stroke-linejoin="round"/></svg></i>
</div>

<div id="vent"><i class="v1"></i><i class="v2"></i><i class="v3"></i></div>

<div id="brume"></div>
<div id="jour"></div>
<div id="foudre">
  <svg id="fd-s" viewBox="0 0 60 150" xmlns="http://www.w3.org/2000/svg">
    <path d="M36 2 L8 84 L28 84 L20 148 L54 60 L32 60 Z"
      fill="#fff6d8" stroke="#12303f" stroke-width="5" stroke-linejoin="round"/>
  </svg>
</div>

<div class="meteo" id="meteo">
  <svg id="mt-ic" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"></svg>
  <span id="mt-n">—</span>
</div>

<div id="barque">
  <svg viewBox="0 0 126 76" xmlns="http://www.w3.org/2000/svg">
    <path d="M63 6 L100 54 L65 54 Z" fill="#fdf6e6" stroke="#12303f"
      stroke-width="4" stroke-linejoin="round"/>
    <path d="M59 18 L28 54 L59 54 Z" fill="#f0a92e" stroke="#12303f"
      stroke-width="4" stroke-linejoin="round"/>
    <rect x="59" y="4" width="5" height="52" rx="2.5" fill="#12303f"/>
    <path d="M10 54 q53 22 106 0 l-12 16 q-42 12 -82 0 Z" fill="#12303f"/>
  </svg>
</div>

<div class="haut">
  <p class="de" id="de">—</p>
  <p class="nom" id="nom">—</p>
  <p class="fil"><i></i><span id="heure">—</span><i></i></p>
</div>

<div class="bas">
  <p class="mot" id="mot">—</p>
  <p class="reste" id="reste">—</p>
  <button class="arriver" id="arriver">Débarquer</button>
</div>

</div>
  <div class="cote">
    <h3>Ce que ce ciel change</h3>
    <div class="fiche" id="fiche"></div>
    <div class="jauge"><label>Où en est la traversée</label>
      <input type="range" id="av" min="0" max="100" value="20"></div>
    <p class="note">Au milieu du parcours c'est la nuit : la palette du ciel s'assombrit
      vers le bleu de nuit, puis revient.</p>
  </div>
</div>
<script>

/* ---------- mélanger deux couleurs ---------- */
const hx = c => [parseInt(c.slice(1,3),16), parseInt(c.slice(3,5),16), parseInt(c.slice(5,7),16)];
const ch = a => '#' + a.map(v => Math.round(v).toString(16).padStart(2,'0')).join('');
const mel = (a, b, k) => { const A = hx(a), B = hx(b);
  return ch([0,1,2].map(i => A[i] + (B[i]-A[i]) * k)); };

/* la lumière de chaque port : un ciel, une eau, un disque */
const CIELS = {
  anse:      { ciel:'#f0a94e', eau:'#2b6f92', sol:'#fff0c4' },
  barcelone: { ciel:'#e88a44', eau:'#1f5a80', sol:'#fff0c4' },
  ajaccio:   { ciel:'#dd9aa4', eau:'#2a5f74', sol:'#fff0dc' },
  palma:     { ciel:'#f2c866', eau:'#188498', sol:'#fff8dc' }
};
/* le large, au milieu : la nuit */
const LARGE = { ciel:'#1c2c4a', eau:'#122536', sol:'#e8eef8' };

/* ============================================================
   CE QUE LE TEMPS FAIT À LA MER
   Chaque ciel a sa teinte, sa houle, son roulis et ses couches.
   force = à quel point la teinte mange les couleurs du port.
   ============================================================ */
const METEO = {
  /* Beau fixe : on ne touche à rien, le port garde sa lumière */
  beau: { nom:'Beau fixe', palette:null,
    mer:.85, vit:.85, lev:.7, gite:.7, bal:'5.4s' },

  /* les autres imposent leur propre palette, franche, choisie */
  grand_bleu: { nom:'Grand bleu',
    palette:{ ciel:'#4fc3e8', eau:'#0a7ba6', sol:'#fff8d0' },
    mer:.65, vit:.7, lev:.5, gite:.45, bal:'6.4s' },

  mistral: { nom:'Mistral',
    palette:{ ciel:'#7ec4de', eau:'#15628f', sol:'#fdf6e6' },
    mer:1.1, vit:2.1, lev:1.1, gite:1.5, bal:'2.9s',
    vent:true, nuages:'#fdf6e6', vite:true },

  brume: { nom:'Brume',
    palette:{ ciel:'#d5d3c6', eau:'#8e9a9c', sol:'#eae7d8' },
    mer:.4, vit:.6, lev:.6, gite:.55, bal:'6.4s', noyee:true },

  houle: { nom:'Houle',
    palette:{ ciel:'#5c7d90', eau:'#0e3a54', sol:'#dde6e8' },
    mer:2, vit:1.5, lev:2.2, gite:2, bal:'2.4s', nuages:'#9fb0ba' },

  orage: { nom:'Orage',
    palette:{ ciel:'#26313d', eau:'#081c2a', sol:'#b9c6ce' },
    mer:2.3, vit:1.8, lev:2.6, gite:2.4, bal:'2.1s',
    nuages:'#3d4854', pluie:true, foudre:true }
};
let TEMPS = METEO.beau;

/* les signes du ciel, au trait, comme les tuiles du hub */
const E = '#12303f', C = '#fdf6e6', O = '#f0a92e';
const SIGNES = {
  beau: '<circle cx="20" cy="20" r="9" fill="' + O + '" stroke="' + E + '" stroke-width="3"/>'
    + '<g stroke="' + E + '" stroke-width="3" stroke-linecap="round">'
    + '<path d="M20 3v4M20 33v4M3 20h4M33 20h4M8 8l3 3M29 29l3 3M32 8l-3 3M11 29l-3 3"/></g>',

  grand_bleu: '<circle cx="20" cy="20" r="10" fill="' + O + '" stroke="' + E + '" stroke-width="3"/>'
    + '<g stroke="' + E + '" stroke-width="3" stroke-linecap="round">'
    + '<path d="M20 2v5M20 33v5M2 20h5M33 20h5"/></g>',

    + '<path d="M3 23q5-6 10 0t10 0t10 0"/>'
    + '<path d="M3 32q5-6 10 0t10 0t10 0"/></g>',

  orage: '<path d="M11 25a7 7 0 0 1 1-14a9 9 0 0 1 17 2a6 6 0 0 1-1 12Z" '
    + 'fill="' + C + '" stroke="' + E + '" stroke-width="3" stroke-linejoin="round"/>'

const GRAND= { anse:'Marseille', barcelone:'Barcelone', palma:'Palma', ajaccio:'Ajaccio' };
const MOT  = { barcelone:'Débarquer à Barcelone', palma:'Débarquer à Palma',
               ajaccio:'Débarquer à Ajaccio', anse:'Rentrer chez toi' };

let DE = 'anse', VERS = 'barcelone', JOURS = 1;

/* ce qu'on se dit en route — le ciel change les mots */
const DITS = {
  orage: ["Le port s'efface, et le ciel est déjà noir",
    'La pluie te rentre dedans par le travers', 'Tu ne vois plus la proue',
    'La nuit et la foudre, en même temps', 'Ça se calme, un peu',
    'Une côte, là-bas, entre deux grains', 'On entre dans le port, trempé'],
  houle: ["Le port s'efface derrière toi", 'La mer travaille sous la coque',
    'Chaque creux te soulève le ventre', 'La nuit, et la mer qui cogne',
    "Le ciel pâlit à l'avant", 'Une côte, là-bas', 'On entre dans le port'],
  brume: ['Le port disparaît en trois minutes', 'Du gris, devant et derrière',
    "Tu avances à l'oreille", 'La nuit ne change pas grand-chose',
    'Une clarté, quelque part', 'Une forme, là-bas — une côte ?',
    'Le port sort du gris'],
  mistral: ["Le port s'efface, poussé par le nord", 'Le vent te fait filer',
    'La voile tient bon', 'La nuit, et le vent qui ne tombe pas',
    "Le ciel pâlit à l'avant", 'Une côte, là-bas — déjà',
    'On entre dans le port en avance']
};

function moment(p){
  const i = p < 8 ? 0 : p < 24 ? 1 : p < 42 ? 2 : p < 58 ? 3
          : p < 76 ? 4 : p < 92 ? 5 : 6;
  const D = DITS[TEMPS && TEMPS.k];
  if (D) return D[i];
  return ["Le port s'efface derrière toi", "Plus rien que de l'eau",
    'La lumière baisse',
    JOURS > 1 ? 'Deux nuits à tenir' : 'La nuit, seul à la barre',
    "Le ciel pâlit à l'avant", 'Une côte, là-bas', 'On entre dans le port'][i];
}

function heureDe(p){
  const h = (8 + JOURS * 24 * p / 100) % 24;
  return String(Math.floor(h)).padStart(2, '0')
    + ':' + String(Math.floor((h % 1) * 12) * 5).padStart(2, '0');
}

/* ---------- peindre : trois couleurs et une position ---------- */
const R = document.documentElement.style;
let dernierTc = '';
function peindre(p){
  const A = CIELS[DE] || CIELS.anse, B = CIELS[VERS] || CIELS.barcelone;
  const t = Math.min(1, Math.max(0, p / 100));
  const k = Math.sin(Math.PI * t) * .94;      /* à quel point on est au large */
  const c = mel(mel(A.ciel, B.ciel, t), LARGE.ciel, k);

  /* Le ciel du jour impose sa palette. On ne moyenne pas deux
     couleurs : ça donne de la boue. On passe de l'une à l'autre. */
  const P = TEMPS.palette;
  const cc = P ? mel(P.ciel, LARGE.ciel, k * .8) : c;
  R.setProperty('--ciel', cc);
  R.setProperty('--eau', P ? mel(P.eau, LARGE.eau, k * .8)
                           : mel(mel(A.eau, B.eau, t), LARGE.eau, k));
  R.setProperty('--disque', P ? mel(P.sol, LARGE.sol, k * .6)
                              : mel(mel(A.sol, B.sol, t), LARGE.sol, k));

  /* le disque décrit son arc : c'est lui, la jauge */
  const d = document.getElementById('disque');
  d.style.left = (8 + t * 84) + '%';
  d.style.top  = (60 - Math.sin(Math.PI * t) * 44) + '%';

  document.getElementById('etoiles').style.opacity = (k * .95).toFixed(2);

  if (cc !== dernierTc){
    document.getElementById('tc').setAttribute('content', cc);
    dernierTc = cc;
  }
}

/* ============================================================
   POSER LE TEMPS
   On règle la houle et le roulis, on allume les couches, et
   pour l'orage on lance la foudre à intervalles irréguliers.
   ============================================================ */
let foudreEnCours = null;

function poserLeTemps(k){
  TEMPS = METEO[k] ? Object.assign({ k: k }, METEO[k])
                   : Object.assign({ k: 'beau' }, METEO.beau);
  const T = TEMPS;

  /* la mer et la barque suivent le ciel */
  R.setProperty('--mer', T.mer);
  R.setProperty('--vit', T.vit);
  R.setProperty('--lev', T.lev);
  R.setProperty('--gite', T.gite);
  R.setProperty('--bal', T.bal);

  /* les nuages : présents seulement quand le ciel en a */
  const nu = document.getElementById('nuages');
  nu.className = T.nuages ? ('on' + (T.vite ? ' vite' : '')) : '';
  R.setProperty('--nuage', T.nuages || '#fdf6e6');

  document.getElementById('vent').className = T.vent ? 'on' : '';
  document.getElementById('brume').className = T.noyee ? 'on' : '';
  document.getElementById('tel').classList.toggle('noyee', !!T.noyee);
  document.getElementById('grain').className = T.pluie ? 'on' : '';

  document.getElementById('mt-ic').innerHTML = SIGNES[T.k] || SIGNES.beau;
  document.getElementById('mt-n').textContent = T.nom;
  setTimeout(() => document.getElementById('meteo').classList.add('on'), 700);

  if (foudreEnCours){ clearTimeout(foudreEnCours); foudreEnCours = null; }
  if (T.foudre) foudroyer();
}

/* un éclair tombe où il veut, quand il veut */
function foudroyer(){
  const f = document.getElementById('foudre');
  const j = document.getElementById('jour');
  const sv = document.getElementById('fd-s');
  foudreEnCours = setTimeout(() => {
    if (document.hidden){ foudroyer(); return; }
    /* on le pose ailleurs à chaque fois, et pas toujours de la même taille */
    sv.style.left = (10 + Math.random() * 66) + '%';
    sv.style.width = (16 + Math.random() * 16) + '%';
    sv.style.transform = 'scaleX(' + (Math.random() < .5 ? -1 : 1) + ')';
    f.classList.remove('frappe'); j.classList.remove('frappe');
    void f.offsetWidth;
    f.classList.add('frappe'); j.classList.add('frappe');
    foudroyer();
  }, 2400 + Math.random() * 6400);
}

/* ============================================================
   LA TRAVERSÉE
   ============================================================ */
let AUBE = false;
function leverAube(){
  if (AUBE) return;
  AUBE = true;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    const ch = document.getElementById('charge');
    if (!ch) return;
    ch.classList.add('parti');
    setTimeout(() => ch.remove(), 500);
  }));
}
setTimeout(leverAube, 6000);

function poser(p){
  peindre(p);
  document.getElementById('heure').textContent = heureDe(p);
  document.getElementById('mot').textContent = moment(p);
  document.getElementById('reste').textContent = p >= 100 ? 'Tu es arrivé'
    : 'Encore ' + Math.max(1, Math.round((100 - p) / 100 * JOURS * 24)) + ' h de mer';
}

async function arriver_X(){
  const bt = document.getElementById('arriver');
  const r = await BD.agir('accoster');
  if (r && r.ok){
    /* le premier drap à Barcelone : la planche se joue avant tout le reste */
    if (r.livraison && r.livraison.enchere){ location.href = 'drap.html'; return; }
    const PAGE = { barcelone:'barcelone.html', palma:'palma.html',
                   ajaccio:'ajaccio.html', anse:'jeu.html' };
    let suite = PAGE[r.port] || 'jeu.html';
    let m = MOT[r.port] || 'Débarquer';
    if (r.niveau && r.niveau.monte){ suite = 'niveau.html'; m = 'Tu as changé de niveau'; }
    else if (r.port === 'anse'){
      try {
        const f = await BD.charger();
        const aCaisse = (f.cale || []).some(o => o && o.quoi === 'caisse');
        const vecue = (f.rencontres || []).includes('caisse_toussaint');
        if (aCaisse && !vecue){ suite = 'retour.html'; m = 'Débarquer'; }
      } catch(e){}
    }
    bt.textContent = m;
    bt.classList.add('on');
    bt.onclick = () => location.href = suite;
  } else if (r && r.pourquoi === 'trop_tot'){
    /* le serveur trouve que c'est trop tôt : on attend le temps qu'il dit */
    setTimeout(arriver, ((r.reste || 2) + 1) * 1000);
  } else {
    bt.textContent = 'Retour au port';
    bt.classList.add('on');
    bt.onclick = () => location.href = 'jeu.html';
  }
}

JOURS = 2; DE = 'anse'; VERS = 'palma';
document.getElementById('de').textContent = 'Cap sur';
document.getElementById('nom').textContent = 'Palma';
document.getElementById('arriver').style.display = 'none';

const CH = { beau:['—','—'], grand_bleu:['−10 % en mer','+12 % payé'],
  mistral:['−15 % en mer','−5 % payé'], brume:['+15 % en mer','—'],
  houle:['+25 % en mer','+8 % payé'], orage:['+40 % en mer','+22 % payé'] };
const ORDRE = ['beau','grand_bleu','mistral','brume','houle','orage'];

function fiche(k){
  const T = METEO[k], c = CH[k];
  const cl = v => v === '—' ? '' :
    (v[0]==='−' && v.indexOf('mer')>0) || (v[0]==='+' && v.indexOf('payé')>0) ? 'bon':'dur';
  const co = [T.nuages&&'nuages', T.vent&&'vent', T.pluie&&'pluie',
    T.noyee&&'brume', T.foudre&&'foudre'].filter(Boolean).join(' + ');
  document.getElementById('fiche').innerHTML =
      '<div><span>Traversée</span><b class="'+cl(c[0])+'">'+c[0]+'</b></div>'
    + '<div><span>Contrats</span><b class="'+cl(c[1])+'">'+c[1]+'</b></div>'
    + '<div><span>Houle</span><b>×'+T.mer+'</b></div>'
    + '<div><span>Roulis</span><b>×'+T.gite+'</b></div>'
    + '<div><span>Au-dessus</span><b>'+(co||'rien')+'</b></div>';
}
function choisir(k){
  poserLeTemps(k); fiche(k);
  document.querySelectorAll('#barre button').forEach(b=>b.classList.toggle('on', b.dataset.k===k));
  poser(+document.getElementById('av').value);
}
document.getElementById('barre').innerHTML = ORDRE.map(k =>
  '<button data-k="'+k+'"><svg viewBox="0 0 40 40">'+SIGNES[k]+'</svg>'+METEO[k].nom+'</button>').join('');
document.getElementById('barre').onclick = e => {
  const b = e.target.closest('[data-k]'); if (b) choisir(b.dataset.k); };
document.getElementById('av').oninput = e => poser(+e.target.value);
choisir('orage');
</script></body></html>
