<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>Séance — Bobinage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Outfit:wght@200;300;400;500&display=swap" rel="stylesheet">

<style>
:root{--safeT:env(safe-area-inset-top,0px);--safeB:env(safe-area-inset-bottom,0px)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:Georgia,serif;min-height:100dvh;overflow:hidden;
  background:radial-gradient(ellipse at 50% 40%,#4a1220,#2a0a12 55%,#12040a 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  padding:var(--safeT) 0 var(--safeB);
  opacity:0;animation:entre .6s forwards;
}
@keyframes entre{to{opacity:1}}
body.sort{animation:sortie .7s forwards}
@keyframes sortie{to{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
.tourne{animation:spin 1.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pelli{stroke-dasharray:6 8;animation:defile 1s linear infinite}
@keyframes defile{to{stroke-dashoffset:-14}}
/* même bobine, même typographie que le voile du jeu : le joueur
   ne doit pas sentir qu'il change de programme entre deux écrans */
body::before{content:"";position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 60% 40% at 50% 38%,rgba(232,184,75,.09),transparent 70%)}
.rideauCh{position:fixed;top:0;bottom:0;width:clamp(26px,7vw,42px);z-index:1;pointer-events:none}
.rideauCh svg{width:100%;height:100%;display:block}
.rideauCh.g{left:0}
.rideauCh.d{right:0;transform:scaleX(-1)}
.bobineCh{position:relative;z-index:2;width:min(42vw,150px)}
.bobineCh svg{width:100%;display:block}
.roue{animation:spin 2.6s linear infinite;transform-origin:37px 37px}
.pellicule{stroke-dasharray:5 9;animation:defile 1.1s linear infinite}
.titre{position:relative;z-index:2;font-family:'Marcellus',Georgia,serif;font-size:19px;
  letter-spacing:.26em;text-transform:uppercase;color:#f7dd9a;
  text-shadow:0 0 20px rgba(247,221,154,.4)}
.sousTitre{position:relative;z-index:2;font-family:'Outfit',system-ui,sans-serif;font-size:9px;
  font-weight:300;letter-spacing:.24em;text-transform:uppercase;color:#8a7e68;margin-top:-6px}
.vanne{position:relative;z-index:2;font-family:'Outfit',system-ui,sans-serif;font-size:11.5px;
  font-weight:300;letter-spacing:.06em;color:#c9bda6;text-align:center;max-width:72vw;
  line-height:1.65;min-height:38px;transition:opacity .3s}
.piste{position:relative;z-index:2;width:min(58vw,220px);height:3px;border-radius:2px;
  background:rgba(202,162,74,.18);overflow:hidden}
.piste i{display:block;height:100%;width:0;border-radius:2px;
  background:linear-gradient(90deg,#caa24a,#f7dd9a);transition:width .4s ease}
.pct{position:relative;z-index:2;font-family:'Outfit',system-ui,sans-serif;font-size:9.5px;
  font-weight:300;letter-spacing:.22em;color:#8a7e68;min-height:14px}
</style>
</head>
<body>

<div class="rideauCh g" aria-hidden="true">
  <svg viewBox="0 0 34 600" preserveAspectRatio="none">
    <defs><linearGradient id="vv" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a0a12"/><stop offset=".34" stop-color="#6e1424"/>
      <stop offset=".66" stop-color="#52101c"/><stop offset="1" stop-color="#2e070e"/></linearGradient></defs>
    <path d="M0 0 L34 0 Q26 300 34 600 L0 600 Z" fill="url(#vv)"/>
    <g stroke="#000" stroke-opacity=".28" stroke-width="1.6" fill="none">
      <path d="M8 0 Q4 300 8 600"/><path d="M18 0 Q13 300 18 600"/><path d="M28 0 Q22 300 28 600"/>
    </g></svg>
</div>
<div class="rideauCh d" aria-hidden="true">
  <svg viewBox="0 0 34 600" preserveAspectRatio="none">
    <path d="M0 0 L34 0 Q26 300 34 600 L0 600 Z" fill="url(#vv)"/>
    <g stroke="#000" stroke-opacity=".28" stroke-width="1.6" fill="none">
      <path d="M8 0 Q4 300 8 600"/><path d="M18 0 Q13 300 18 600"/><path d="M28 0 Q22 300 28 600"/>
    </g></svg>
</div>

<div class="bobineCh" aria-hidden="true">
  <svg viewBox="0 0 74 74">
    <g class="roue">
      <circle cx="37" cy="37" r="32" fill="none" stroke="#caa24a" stroke-width="3"/>
      <circle cx="37" cy="37" r="7" fill="#caa24a"/>
      <g fill="#caa24a" opacity=".85">
        <circle cx="37" cy="16" r="5.4"/><circle cx="55" cy="47" r="5.4"/>
        <circle cx="19" cy="47" r="5.4"/></g>
      <circle cx="37" cy="37" r="21" fill="none" stroke="#571520" stroke-width="7"/>
    </g>
    <circle class="pellicule" cx="37" cy="37" r="32" fill="none" stroke="#f7dd9a"
      stroke-width="1.6" opacity=".6"/>
  </svg>
</div>

<div class="titre">Séance</div>
<div class="sousTitre" id="sousTitre"></div>
<div class="vanne" id="vanne">« Sens de rotation ? Aucune idée. Ça tourne, c'est déjà Cannes. »</div>
<div class="piste"><i id="piste"></i></div>
<div class="pct" id="pct">0 %</div>

<script>
/* garde : pas de session → retour au guichet */
if(!localStorage.getItem("rex_session")) location.replace("index.html");

const DUREE_MIN = 3200;   /* durée mini d'affichage (ms) */
let DESTINATION = localStorage.getItem("rex_dest") || "jeu.html";

/* vérifie si le cinéma existe déjà : sinon, cérémonie obligatoire */
(async ()=>{
  if(DESTINATION !== "jeu.html") return;
  if(localStorage.getItem("rex_cinema")) return;
  try{
    const sess = JSON.parse(localStorage.getItem("rex_session"));
    const rep = await fetch("https://zpfkekiavlfphialvphi.supabase.co/rest/v1/cinemas?user_id=eq."+sess.user_id+"&select=*",{
      headers:{
        "apikey":"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpwZmtla2lhdmxmcGhpYWx2cGhpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3Mjc4MzIsImV4cCI6MjEwMTMwMzgzMn0.ORa4y_AMjuWbxboKm3o6Jn7ryYjkOm4mSgLa2Schv98",
        "Authorization":"Bearer "+sess.access_token
      }
    });
    const data = await rep.json();
    if(Array.isArray(data) && data.length) localStorage.setItem("rex_cinema", JSON.stringify(data[0]));
    else DESTINATION = "inscription.html";
  }catch(e){ /* réseau KO : on laisse jeu.html gérer */ }
})();

/* Bob ne dit pas la même chose à un inconnu et à un habitué.
   La destination est déjà connue : autant s'en servir. */
const VANNES_RETOUR = [
  "« Sens de rotation ? Aucune idée. Ça tourne, c'est déjà Cannes. »",
  "« La pellicule fait 2 km. J'ai compté. Une fois. Jamais deux. »",
  "« Je graisse la manivelle. Avec du beurre. On fait avec ce qu'on a. »",
  "« Le projecteur chauffe. Moi aussi. On est une équipe. »",
  "« Je rallume la salle. Le rang 12 grince toujours, rassure-toi. »",
  "« Ta salle arrive. Je passe un coup de balai entre les rangs 3 et 4. »"
];
const VANNES_PREMIERE = [
  "« Un nouveau patron ! Je descends chercher les clés. Elles sont quelque part. »",
  "« J'époussette le comptoir. Il n'a pas servi depuis un moment. »",
  "« Attends, je remonte le rideau. À la main. Comme en 1953. »",
  "« Je cherche une ampoule pour l'enseigne. Il m'en reste une. Peut-être. »",
  "« On va bien s'entendre. Enfin, je crois. Je dis ça à tout le monde. »"
];
const PREMIERE = DESTINATION === "inscription.html";
const VANNES = PREMIERE ? VANNES_PREMIERE : VANNES_RETOUR;
const VANNE_GLISSE = "« 87%… retour à 40. La bobine a glissé, on en parle plus. »";

const elPct = document.getElementById("pct");
const elVanne = document.getElementById("vanne");
const elPiste = document.getElementById("piste");
elVanne.textContent = VANNES[Math.floor(Math.random()*VANNES.length)];
const elSous = document.getElementById("sousTitre");
if(elSous) elSous.textContent = PREMIERE ? "Première ouverture" : "On rallume la salle";

/* la vanne change en fondu plutôt que d'un coup */
function ditVanne(t){
  elVanne.style.opacity = 0;
  setTimeout(()=>{ elVanne.textContent = t; elVanne.style.opacity = 1; }, 300);
}

/* le pourcentage et la barre avancent ensemble */
function avance(v){
  elPct.textContent = Math.round(v) + " %";
  if(elPiste) elPiste.style.width = Math.max(0, Math.min(100, v)) + "%";
}

let p = 0, aGlisse = false, fini = false;
const debut = Date.now();
let derniereVanne = Date.now();

const timer = setInterval(()=>{
  p += Math.random()*9;
  /* une seule glissade possible, pour le gag */
  if(!PREMIERE && !aGlisse && p>82 && p<92 && Math.random()<.4){
    p = 40; aGlisse = true;
    ditVanne(VANNE_GLISSE);
    derniereVanne = Date.now();
  }
  /* vanne qui tourne toutes les ~3s */
  if(Date.now()-derniereVanne > 3000){
    ditVanne(VANNES[Math.floor(Math.random()*VANNES.length)]);
    derniereVanne = Date.now();
  }
  avance(p);
  if(p >= 100){
    p = 100;
    if(!fini && Date.now()-debut >= DUREE_MIN){
      fini = true;
      clearInterval(timer);
      avance(100);
      elPct.textContent = "PROJECTION";
      ditVanne("« Silence dans la salle… PROJECTION ! »");
      setTimeout(()=>{
        document.body.classList.add("sort");
        setTimeout(()=>location.replace(DESTINATION), 720);
      }, 700);
      return;
    }
  }
},260);
</script>
</body>
</html>
