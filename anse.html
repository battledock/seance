<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#16304a">
<title>Battle Dock — Ton anse</title>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none}
html,body{height:100%;overflow:hidden;background:#0e1c2e;
  font-family:'Courier Prime',monospace;color:#fff}

#anse{position:fixed;left:0;right:0;top:0;height:46%;overflow:hidden}
#anse svg{display:block;width:100%;height:100%}
#anse::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(14,28,46,.28) 0,rgba(14,28,46,0) 34%,
    rgba(14,28,46,.7) 80%,rgba(14,28,46,.99) 100%)}

.tete{position:fixed;left:0;right:0;top:0;z-index:6;
  padding:calc(env(safe-area-inset-top) + 13px) 14px 0;
  display:flex;align-items:center;gap:10px}
.tete .ret{flex:0 0 40px;height:40px;border-radius:8px;
  border:1.5px solid rgba(255,255,255,.3);background:rgba(10,20,34,.44);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  display:flex;align-items:center;justify-content:center;cursor:pointer}
.tete .ret svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}
.tete .id{flex:1;min-width:0;display:flex;align-items:center;gap:10px;
  background:rgba(10,20,34,.44);border:1.5px solid rgba(255,255,255,.24);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-radius:8px;padding:6px 12px 6px 7px}
.tete .id .em{flex:0 0 30px;height:30px;display:flex;align-items:center;justify-content:center}
.tete .id .em svg{width:19px;height:19px}
.tete .id b{display:block;font-size:13px;font-weight:700;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.tete .id span{display:block;font-size:8px;letter-spacing:.14em;text-transform:uppercase;
  color:rgba(255,255,255,.5);margin-top:2px}
.tete .eu{flex:0 0 auto;background:rgba(10,20,34,.44);border:1.5px solid rgba(255,255,255,.24);
  border-radius:8px;padding:9px 12px;backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);font-size:12.5px;font-weight:700;color:#ffd894}

.w{position:fixed;left:0;right:0;top:41%;bottom:0;z-index:5;overflow-y:auto;
  padding:0 14px calc(env(safe-area-inset-bottom) + 18px)}
.w::-webkit-scrollbar{display:none}

.tt{font-size:7.5px;letter-spacing:.22em;text-transform:uppercase;
  color:rgba(255,255,255,.4);margin:16px 3px 10px}
.tt:first-child{margin-top:6px}

/* la production */
.prod{background:rgba(18,32,50,.82);border:1.5px solid rgba(255,255,255,.16);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-radius:11px;padding:16px;margin-bottom:4px}
.prod .l1{display:flex;align-items:flex-start;gap:13px}
.prod .l1 .ic{flex:0 0 42px;height:42px;border-radius:10px;
  background:rgba(240,196,106,.16);display:flex;align-items:center;justify-content:center}
.prod .l1 .ic svg{width:21px;height:21px;stroke:#f0c46a;fill:none;stroke-width:1.7;
  stroke-linejoin:round}
.prod .l1 .tx{flex:1;min-width:0}
.prod .l1 .tx b{display:block;font-size:15px;color:#fff;font-weight:700}
.prod .l1 .tx span{display:block;font-size:11px;color:rgba(255,255,255,.52);margin-top:4px;
  font-family:system-ui,sans-serif;line-height:1.5}
.prod .l1 .px{flex:0 0 auto;text-align:right}
.prod .l1 .px em{display:block;font-style:normal;font-size:20px;font-weight:700;color:#ffd894}
.prod .jauge{height:6px;background:rgba(255,255,255,.13);border-radius:4px;overflow:hidden;
  margin-top:14px}
.prod .jauge i{display:block;height:100%;border-radius:4px;
  background:linear-gradient(90deg,#b8934a,#ffd894);transition:width .7s}
.prod .jauge i.plein{background:linear-gradient(90deg,#b8483a,#e08a6a)}
.prod .sous{display:flex;justify-content:space-between;margin-top:8px;font-size:10px;
  color:rgba(255,255,255,.44);font-family:system-ui,sans-serif}
.prod button{width:100%;margin-top:14px;padding:14px;border:0;border-radius:9px;cursor:pointer;
  background:linear-gradient(180deg,#f6cd76,#dca94a);color:#1c1a16;
  font-family:'Courier Prime',monospace;font-size:13.5px;font-weight:700;letter-spacing:.06em;
  transition:transform .12s}
.prod button:active{transform:scale(.986)}
.prod button:disabled{background:rgba(255,255,255,.08);color:rgba(255,255,255,.36);
  cursor:default}

/* les constructions */
.bat{background:rgba(18,32,50,.72);border:1.5px solid rgba(255,255,255,.13);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-radius:11px;padding:15px;margin-bottom:9px}
.bat .l1{display:flex;align-items:center;gap:10px}
.bat .l1 b{flex:1;font-size:15px;color:#fff;font-weight:700}
.bat .l1 .px{flex:0 0 auto;font-size:13.5px;font-weight:700;color:#ffd894}
.bat .l1 .px.fait{color:#8ce0a8;font-size:11px}
.bat .a{display:block;font-size:11.5px;color:rgba(255,255,255,.56);margin-top:6px;
  font-family:system-ui,sans-serif;line-height:1.5}
.bat .niv{display:flex;gap:4px;margin-top:11px}
.bat .niv i{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.12)}
.bat .niv i.on{background:#f0c46a}
.bat .n{display:block;font-size:11px;color:rgba(255,255,255,.42);margin-top:10px;
  font-family:system-ui,sans-serif;font-style:italic;line-height:1.5}
.bat .ef{display:inline-block;font-size:10px;margin-top:9px;padding:4px 10px;
  border-radius:12px;background:rgba(140,224,168,.14);color:#8ce0a8}
.bat button{width:100%;margin-top:12px;padding:12px;border:1.5px solid rgba(240,196,106,.5);
  border-radius:8px;cursor:pointer;background:rgba(52,44,26,.5);color:#f0c46a;
  font-family:'Courier Prime',monospace;font-size:12.5px;font-weight:700;letter-spacing:.05em}
.bat button:disabled{border-color:rgba(255,255,255,.12);background:rgba(255,255,255,.05);
  color:rgba(255,255,255,.36);cursor:default}
.mot{font-size:10.5px;color:rgba(255,255,255,.38);line-height:1.65;text-align:center;
  margin:16px 6px 4px;font-family:system-ui,sans-serif}

.onde{will-change:transform}
.o0{animation:v0 30s linear infinite}.o1{animation:v1 40s linear infinite}
.o2{animation:v0 52s linear infinite}.o3{animation:v1 64s linear infinite}
@keyframes v0{to{transform:translateX(50px)}}
@keyframes v1{to{transform:translateX(-50px)}}
.pin{animation:brise 15s ease-in-out infinite;transform-origin:50% 100%}
@keyframes brise{0%,100%{transform:rotate(-.4deg)}50%{transform:rotate(.4deg)}}
.barque{animation:tangue 9s ease-in-out infinite;transform-box:fill-box;
  transform-origin:50% 90%}
@keyframes tangue{0%,100%{transform:rotate(-.8deg)}50%{transform:rotate(.8deg)}}
.fumee{animation:monte 9s ease-in-out infinite}
.vapeur{animation:monte 6s ease-in-out infinite}
.braise{animation:feu 3.4s ease-in-out infinite}
@keyframes feu{0%,100%{opacity:.34}44%{opacity:.7}}
.lueur{animation:veilleuse 7s ease-in-out infinite}
@keyframes monte{0%{opacity:.28;transform:translate(0,0) scale(1)}
  100%{opacity:0;transform:translate(4px,-14px) scale(1.9)}}
.lampe{animation:veilleuse 6s ease-in-out infinite}
@keyframes veilleuse{0%,100%{opacity:.84}48%{opacity:1}}
.etoile{animation:scint 4.4s ease-in-out infinite}
@keyframes scint{0%,100%{opacity:.2}50%{opacity:.7}}
@media (prefers-reduced-motion:reduce){*{animation:none !important}}
</style>
</head>
<body>

<div id="anse"></div>

<div class="tete">
  <button class="ret" id="ret"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
  <span class="id"><span class="em" id="t-em"></span>
    <span><b id="t-nom">—</b><span id="t-met">—</span></span></span>
  <span class="eu" id="t-eu">—</span>
</div>

<div class="w">
  <p class="tt">Ce qui a séché</p>
  <div class="prod" id="prod"></div>
  <p class="tt">Ce que tu peux bâtir</p>
  <div id="batis"></div>
  <p class="mot">Ton anse produit même quand tu es en mer.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="bd.js"></script>
<script>
/* ============================================================
   TA FABRIQUE — vue depuis la terrasse de l'anse
   Elle change avec ton métier, ton niveau, ta marque.
   ============================================================ */

const W = 480;
const FOCALE = 727;
const OEIL = 1.6;
const HORIZON = 250;

const px  = (m, d) => m * FOCALE / d;
const sol = d => HORIZON + OEIL * FOCALE / d;
const pX  = (X, d) => 240 + X * FOCALE / d;
const rnd = s => { const x = Math.sin(s * 127.1) * 43758.5; return x - Math.floor(x); };
const rnd2 = (a,b) => { const x = Math.sin(a*127.1 + b*311.7) * 43758.5; return x - Math.floor(x); };

function hx(c){ return [parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)]; }
function ch(a){ return '#'+a.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join(''); }
function mel(a,b,k){ const A=hx(a),B=hx(b); return ch([0,1,2].map(i=>A[i]+(B[i]-A[i])*k)); }

const TEMPS = {
  matin:  { nom:'Au petit matin', ciel:['#2f5f92','#5b8fb8','#93b8cf','#c4d4d4','#e8d4b0','#f6e0b8'],
            or:'#ffd8a0', ombre:'#2a3a54', roche:'#d8c8a8', pin:'#4a6b52',
            eau:['#b8a888','#7d9aa4','#4a8296'], voile:.16, sol:{x:190,y:158,r:13} },
  midi:   { nom:'En plein midi', ciel:['#2472a8','#4494c4','#78b0d0','#a8cade','#cfe0e8','#e8f0f0'],
            or:'#fff0c8', ombre:'#1c3a56', roche:'#f0e4c8', pin:'#3f6b48',
            eau:['#a8d4d8','#74c0cc','#3fa0bc'], voile:.06, sol:{x:250,y:42,r:15} },
  soir:   { nom:'À la tombée du jour', ciel:['#1a2c4e','#33507a','#5a6c8c','#8a7c88','#c48a68','#e8a870'],
            or:'#ffb870', ombre:'#141e30', roche:'#c4a884', pin:'#33503c',
            eau:['#b87c58','#74665e','#3f5468'], voile:.24, sol:{x:112,y:216,r:16} },
  nuit:   { nom:'La nuit est tombée', ciel:['#080f22','#101c36','#1b2d4c','#2a4460','#3c5674','#506684'],
            or:'#a8c0e0', ombre:'#060a14', roche:'#6a6270', pin:'#1f3038',
            eau:['#36465a','#26364a','#1a2838'], voile:.34, sol:{x:334,y:56,r:9} }
};
let T = TEMPS.matin;
function regler(t){ T = TEMPS[t] || TEMPS.matin; return T; }

const clair  = (c,k) => mel(c, T.or, k===undefined?.28:k);
const sombre = (c,k) => mel(c, T.ombre, k===undefined?.3:k);
const voiler = (c,d) => mel(c, mel(T.ciel[4], T.or,.3), Math.min(.5, Math.pow(d/170,.85)));
const nuit = () => (T === TEMPS.nuit || T === TEMPS.soir);

let HAUT=-120, BAS=900;
function cadrer(l,h){
  const total = W*h/l;
  HAUT = HORIZON - total*.70;
  BAS = HAUT + total;
  return { y:HAUT, h:total };
}

/* ---------- le fond : ciel, mer, falaises ---------- */
function fond(){
  let s = `<defs><linearGradient id="f-ciel" x1="0" y1="0" x2="0" y2="1">`
    + T.ciel.map((c,i)=>`<stop offset="${[0,20,42,62,84,100][i]}%" stop-color="${c}"/>`).join('')
    + `</linearGradient><linearGradient id="f-eau" x1="0" y1="0" x2="0" y2="1">`
    + T.eau.map((c,i)=>`<stop offset="${[0,44,100][i]}%" stop-color="${c}"/>`).join('')
    + `</linearGradient>
    <radialGradient id="f-halo" cx="0.5" cy="0.5">
      <stop offset="0%" stop-color="${T.or}" stop-opacity=".46"/>
      <stop offset="100%" stop-color="${T.or}" stop-opacity="0"/></radialGradient></defs>`;
  s += `<rect x="0" y="${HAUT}" width="${W}" height="${(sol(300)-HAUT).toFixed(1)}" fill="url(#f-ciel)"/>`;
  s += `<ellipse cx="${T.sol.x}" cy="${T.sol.y}" rx="180" ry="130" fill="url(#f-halo)"/>`;
  s += `<circle cx="${T.sol.x}" cy="${T.sol.y}" r="${T.sol.r}" fill="${mel('#fffdf4',T.or,.3)}"/>`;
  if (nuit())
    for (let i=0;i<26;i++)
      s += `<circle class="etoile e${i%4}" cx="${(rnd(i*19+2)*W).toFixed(0)}"
        cy="${(HAUT+rnd(i*13+7)*(HORIZON-HAUT)*.85).toFixed(0)}"
        r="${(.5+rnd(i*23)*.7).toFixed(2)}" fill="#fff" opacity=".55"/>`;

  /* la mer, au fond à gauche : on est au bord de l'eau */
  const ym = sol(300);
  s += `<rect x="0" y="${ym.toFixed(1)}" width="${W}" height="${(sol(46)-ym).toFixed(1)}"
    fill="url(#f-eau)"/>`;
  for (let n=0;n<5;n++){
    const d = 240/Math.pow(n+1,1.2), y = sol(d);
    if (y > sol(46)) continue;
    s += `<g class="onde o${n%4}"><path d="M-90 ${y.toFixed(1)} `;
    let p='';
    for(let k=0;k<20;k++) p += `q${px(3,d).toFixed(1)} ${(-px(.16,d)).toFixed(1)} ${px(6,d).toFixed(1)} 0 `;
    s += p + `" stroke="#fff" stroke-width="${Math.max(.4,px(.09,d)).toFixed(2)}"
      fill="none" opacity="${(.14-n*.02).toFixed(2)}"/></g>`;
  }

  /* les falaises, qui ferment derrière */
  [[-1,0],[1,6]].forEach(([cote,g])=>{
    const P=[[210,26],[140,22],[92,25],[60,21],[40,26],[26,23],[17,30]];
    let d='';
    P.forEach(([dd,X],i)=>{
      const h = 15 + Math.sin(i*1.6+g)*6 + Math.sin(i*.7)*4;
      d += (i?'L':'M') + pX(cote*X,dd).toFixed(1) + ' ' + (sol(dd)-px(h,dd)).toFixed(1) + ' ';
    });
    for(let i=P.length-1;i>=0;i--) d += 'L'+pX(cote*P[i][1],P[i][0]).toFixed(1)+' '+sol(P[i][0]).toFixed(1)+' ';
    s += `<path d="${d}Z" fill="${cote<0?clair(T.roche,.14):sombre(T.roche,.26)}"/>`;
    /* les pins dessus */
    for(let k=0;k<9;k++){
      const dd = 20+rnd(g*7+k)*160, X = cote*(23+rnd(g*11+k)*7);
      const h = 15+rnd(k)*7, x=pX(X,dd), y=sol(dd)-px(h,dd), t=px(2.4,dd);
      if(t<.8) continue;
      s += `<g class="pin"><path d="M${x.toFixed(1)} ${y.toFixed(1)} l${(t*.05).toFixed(1)} ${(-t*.45).toFixed(1)}"
        stroke="${sombre('#5a4a38',.3)}" stroke-width="${Math.max(.4,t*.08).toFixed(2)}"/>`;
      [[0,-.55,1],[-.45,-.46,.62],[.45,-.48,.66]].forEach(([dx,dy,r],q)=>
        s += `<ellipse cx="${(x+dx*t*.75).toFixed(1)}" cy="${(y+dy*t).toFixed(1)}"
          rx="${(t*.56*r).toFixed(1)}" ry="${(t*.27*r).toFixed(1)}"
          fill="${voiler(q%2?T.pin:clair(T.pin,.22),dd)}"/>`);
      s += `</g>`;
    }
  });
  return s;
}

/* ---------- le sol de la terrasse ---------- */
function terrasse(){
  let s = `<rect x="0" y="${sol(46).toFixed(1)}" width="${W}"
    height="${(BAS-sol(46)+8).toFixed(1)}" fill="${voiler(sombre(T.roche,.16),30)}"/>`;
  /* la terre battue, en bandes de profondeur */
  let d = 46, i = 0;
  while (d > 3.2 && i < 90){
    const d2 = d/1.055, y1 = sol(d), y2 = sol(d2);
    if (y1 > BAS) break;
    if (y2-y1 > .5){
      const n = 14;
      for (let c = -n; c <= n; c++){
        const t = rnd2(i, c+40);
        const xa = pX(c*1.1, d), xb = pX((c+1)*1.05, d);
        const xa2 = pX(c*1.1, d2), xb2 = pX((c+1)*1.05, d2);
        if (xb < -40 && xb2 < -40) continue;
        if (xa > W+40 && xa2 > W+40) continue;
        s += `<path d="M${xa.toFixed(1)} ${y1.toFixed(1)} L${xb.toFixed(1)} ${y1.toFixed(1)}
          L${xb2.toFixed(1)} ${y2.toFixed(1)} L${xa2.toFixed(1)} ${y2.toFixed(1)} Z"
          fill="${t>.66?clair(T.roche,.2):t>.33?T.roche:sombre(T.roche,.14)}"
          opacity="${(.28+t*.3).toFixed(2)}"/>`;
      }
    }
    d = d2; i++;
  }
  return s;
}

/* ============================================================
   LE BÂTIMENT — quatre étapes
   ============================================================ */
function batiment(niv, M){
  const d = 20, y = sol(d), m = u => px(u, d);
  const X = -.4;
  const cx = pX(X, d);
  const mur   = voiler(clair('#e4d4b4', .16), d);
  const murO  = voiler(sombre('#c0ad8c', .2), d);
  const murC  = voiler(clair('#f4e8cc', .26), d);
  const toit  = voiler(sombre('#a8543a', .14), d);
  const toitC = voiler(clair('#c9714a', .24), d);
  const bois  = voiler(sombre('#6d5238', .2), d);
  const vitre = nuit() ? '#ffcf82' : voiler(sombre('#2f4050', .18), d);

  /* les proportions grandissent avec le niveau */
  const L = [3.4, 5.4, 7.6, 10.5][niv] || 3.4;      /* largeur en mètres */
  const H = [2.4, 3.2, 4, 5][niv] || 2.4;     /* hauteur des murs */
  const g = cx - m(L/2), dr = cx + m(L/2);

  let s = `<g class="fab">`;

  /* --- l'ombre portée au sol --- */
  s += `<ellipse cx="${cx.toFixed(1)}" cy="${y.toFixed(1)}" rx="${m(L*.62).toFixed(1)}"
    ry="${m(.5).toFixed(1)}" fill="${T.ombre}" opacity=".2"/>`;

  if (niv === 0){
    /* --- trois planches : un abri bancal --- */
    s += `<path d="M${g.toFixed(1)} ${y.toFixed(1)} L${(g+m(.2)).toFixed(1)} ${(y-m(1.9)).toFixed(1)}
      L${(dr-m(.1)).toFixed(1)} ${(y-m(1.6)).toFixed(1)} L${dr.toFixed(1)} ${y.toFixed(1)} Z"
      fill="${murO}" opacity=".9"/>`;
    /* les planches disjointes */
    for (let k = 0; k < 5; k++)
      s += `<path d="M${(g+m(.1+k*L*.19)).toFixed(1)} ${y.toFixed(1)}
        v${(-m(1.55+rnd(k)*.35)).toFixed(1)}"
        stroke="${bois}" stroke-width="${Math.max(.6, m(.1)).toFixed(1)}"/>`;
    /* la bâche, tendue de travers */
    s += `<path d="M${(g-m(.3)).toFixed(1)} ${(y-m(1.95)).toFixed(1)}
      L${(dr+m(.3)).toFixed(1)} ${(y-m(1.5)).toFixed(1)}
      L${(dr+m(.2)).toFixed(1)} ${(y-m(1.3)).toFixed(1)}
      L${(g-m(.2)).toFixed(1)} ${(y-m(1.75)).toFixed(1)} Z"
      fill="${voiler(sombre('#7a8a6a', .2), d)}"/>`;
    return s + `</g>`;
  }

  /* --- le corps du bâtiment --- */
  s += `<path d="M${g.toFixed(1)} ${y.toFixed(1)} v${(-m(H)).toFixed(1)}
    h${m(L).toFixed(1)} v${m(H).toFixed(1)} z" fill="${mur}"/>`;
  /* le pan de droite, à l'ombre */
  s += `<path d="M${(dr-m(L*.3)).toFixed(1)} ${y.toFixed(1)} v${(-m(H)).toFixed(1)}
    h${m(L*.3).toFixed(1)} v${m(H).toFixed(1)} z" fill="${murO}" opacity=".55"/>`;
  /* le soubassement de pierre */
  s += `<path d="M${g.toFixed(1)} ${y.toFixed(1)} v${(-m(.4)).toFixed(1)}
    h${m(L).toFixed(1)} v${m(.4).toFixed(1)} z" fill="${voiler(sombre(T.roche,.2), d)}"/>`;

  /* --- le toit --- */
  const th = niv >= 2 ? .9 : .6;
  s += `<path d="M${(g-m(.35)).toFixed(1)} ${(y-m(H)).toFixed(1)}
    h${m(L+.7).toFixed(1)} l${(-m(.5)).toFixed(1)} ${(-m(th)).toFixed(1)}
    h${(-m(L-.3)).toFixed(1)} z" fill="${toit}"/>`;
  s += `<path d="M${(g-m(.35)).toFixed(1)} ${(y-m(H)).toFixed(1)}
    h${m(L*.4).toFixed(1)} l${(-m(.2)).toFixed(1)} ${(-m(th)).toFixed(1)}
    h${(-m(L*.4-.15)).toFixed(1)} z" fill="${toitC}"/>`;
  /* les tuiles */
  for (let k = 0; k < Math.round(L*3.4); k++)
    s += `<path d="M${(g-m(.3)+m(k*.3)).toFixed(1)} ${(y-m(H)).toFixed(1)}
      l${(m(.14)).toFixed(1)} ${(-m(th)).toFixed(1)}"
      stroke="${sombre(toit,.2)}" stroke-width=".5" opacity=".4"/>`;

  /* --- la porte --- */
  const pw = niv >= 2 ? 1.1 : .8;
  s += `<path d="M${(cx-m(pw/2)).toFixed(1)} ${y.toFixed(1)} v${(-m(H*.62)).toFixed(1)}
    h${m(pw).toFixed(1)} v${m(H*.62).toFixed(1)} z" fill="${sombre(M.c, .34)}"/>`;
  s += `<path d="M${(cx-m(pw/2)).toFixed(1)} ${y.toFixed(1)} v${(-m(H*.62)).toFixed(1)}
    h${m(pw*.32).toFixed(1)} v${m(H*.62).toFixed(1)} z" fill="${clair(M.c, .2)}" opacity=".7"/>`;

  /* --- les fenêtres, de plus en plus nombreuses --- */
  const nf = [0, 1, 3, 5][niv] || 0;
  for (let k = 0; k < nf; k++){
    const t = (k + .5) / nf;
    const fx = g + m(L * t) + (t > .45 && t < .55 ? m(pw) : 0);
    if (Math.abs(fx - cx) < m(pw * .8)) continue;
    s += `<rect x="${(fx-m(.32)).toFixed(1)}" y="${(y-m(H*.82)).toFixed(1)}"
      width="${m(.64).toFixed(1)}" height="${m(.62).toFixed(1)}" fill="${vitre}"/>`;
    /* les volets, de ta couleur */
    s += `<path d="M${(fx-m(.34)).toFixed(1)} ${(y-m(H*.82)).toFixed(1)}
      h${m(.16).toFixed(1)} v${m(.62).toFixed(1)} h${(-m(.16)).toFixed(1)} z
      M${(fx+m(.18)).toFixed(1)} ${(y-m(H*.82)).toFixed(1)}
      h${m(.16).toFixed(1)} v${m(.62).toFixed(1)} h${(-m(.16)).toFixed(1)} z"
      fill="${voiler(M.c, d)}"/>`;
    if (nuit())
      s += `<rect class="lueur" x="${(fx-m(.6)).toFixed(1)}" y="${(y-m(H*.82+.3)).toFixed(1)}"
        width="${m(1.2).toFixed(1)}" height="${m(1.2).toFixed(1)}"
        fill="#ffcf82" opacity=".08"/>`;
  }

  /* --- la cheminée, dès le second niveau --- */
  if (niv >= 1){
    const chx = g + m(L * .78);
    const chh = niv >= 3 ? 2.6 : niv >= 2 ? 1.5 : .8;
    s += `<path d="M${(chx-m(.28)).toFixed(1)} ${(y-m(H+th*.6)).toFixed(1)}
      v${(-m(chh)).toFixed(1)} h${m(.56).toFixed(1)} v${m(chh).toFixed(1)} z"
      fill="${niv>=3 ? voiler(sombre('#8a4a38',.2),d) : murO}"/>`;
    s += `<path d="M${(chx-m(.36)).toFixed(1)} ${(y-m(H+th*.6+chh)).toFixed(1)}
      h${m(.72).toFixed(1)} v${m(.16).toFixed(1)} h${(-m(.72)).toFixed(1)} z"
      fill="${sombre(murO,.24)}"/>`;
    /* la fumée */
    s += `<g class="fumee" opacity=".3">`;
    for (let k = 0; k < 5; k++)
      s += `<ellipse cx="${(chx+m(k*.12)).toFixed(1)}"
        cy="${(y-m(H+th*.6+chh+.4+k*.6)).toFixed(1)}"
        rx="${m(.22+k*.14).toFixed(1)}" ry="${m(.15+k*.1).toFixed(1)}" fill="#e0dcd0"/>`;
    s += `</g>`;
  }

  /* --- l'enseigne, avec ton nom et ton signe --- */
  if (niv >= 1){
    const ey = y - m(H * .92);
    const ew = Math.min(m(L * .82), m(4.6));
    s += `<g class="enseigne">`;
    /* la planche */
    s += `<path d="M${(cx-ew/2).toFixed(1)} ${(ey-m(.62)).toFixed(1)}
      h${ew.toFixed(1)} v${m(.62).toFixed(1)} h${(-ew).toFixed(1)} z"
      fill="${voiler(sombre('#3a2e22',.2), d)}"/>`;
    s += `<path d="M${(cx-ew/2).toFixed(1)} ${(ey-m(.62)).toFixed(1)}
      h${ew.toFixed(1)} v${m(.09).toFixed(1)} h${(-ew).toFixed(1)} z"
      fill="${clair('#6d5238',.3)}" opacity=".7"/>`;
    /* l'écusson peint dessus */
    const ex = cx - ew/2 + m(.42), es = m(.4);
    s += `<rect x="${(ex-es/2).toFixed(1)}" y="${(ey-m(.44)).toFixed(1)}"
      width="${es.toFixed(1)}" height="${es.toFixed(1)}"
      rx="${(M.ecusson==='rond'?es/2:M.ecusson==='doux'?es*.28:1.5).toFixed(1)}"
      fill="${voiler(M.c, d)}"/>`;
    /* le nom, écrit dessus */
    s += `<text x="${(ex+es*.9).toFixed(1)}" y="${(ey-m(.17)).toFixed(1)}"
      font-family="Courier Prime, monospace" font-size="${m(.34).toFixed(1)}"
      font-weight="700" fill="${clair(M.c2, .3)}"
      letter-spacing=".4">${(M.nom||'').slice(0,16).toUpperCase()}</text>`;
    s += `</g>`;
  }
  return s + `</g>`;
}

/* ============================================================
   LE MATÉRIEL — ce qu'on voit dépend de ton métier
   ============================================================ */
function materiel(metier, niv, sechoir, M){
  if (!niv) return '';
  let s = `<g class="mat">`;
  const bois = c => voiler(sombre('#7a5c3a', .2), 12);

  /* ---------- le savon : cuves, moules, blocs qui sèchent ---------- */
  if (metier === 'savon'){
    /* les cuves de cuisson, à gauche */
    const n = Math.min(3, niv);
    for (let k = 0; k < n; k++){
      const d = 10.5 + k*1.6, X = -2.4 - k*.35, y = sol(d), m = u => px(u,d);
      const x = pX(X, d);
      s += `<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="${m(.9).toFixed(1)}"
        ry="${m(.22).toFixed(1)}" fill="${T.ombre}" opacity=".2"/>`;
      /* le foyer de pierre */
      s += `<path d="M${(x-m(.8)).toFixed(1)} ${y.toFixed(1)} v${(-m(.5)).toFixed(1)}
        h${m(1.6).toFixed(1)} v${m(.5).toFixed(1)} z" fill="${voiler(sombre(T.roche,.24),d)}"/>`;
      if (nuit())
        s += `<ellipse class="braise" cx="${x.toFixed(1)}" cy="${(y-m(.24)).toFixed(1)}"
          rx="${m(.5).toFixed(1)}" ry="${m(.16).toFixed(1)}" fill="#ff8a3a" opacity=".5"/>`;
      /* la cuve de cuivre */
      s += `<path d="M${(x-m(.78)).toFixed(1)} ${(y-m(.5)).toFixed(1)}
        q0 ${(-m(.9)).toFixed(1)} ${m(.78).toFixed(1)} ${(-m(.9)).toFixed(1)}
        q${m(.78).toFixed(1)} 0 ${m(.78).toFixed(1)} ${m(.9).toFixed(1)} z"
        fill="${voiler(sombre('#a8763a',.14),d)}"/>`;
      s += `<path d="M${(x-m(.78)).toFixed(1)} ${(y-m(.5)).toFixed(1)}
        q0 ${(-m(.9)).toFixed(1)} ${m(.78).toFixed(1)} ${(-m(.9)).toFixed(1)}
        q${(-m(.24)).toFixed(1)} ${m(.24).toFixed(1)} ${(-m(.42)).toFixed(1)} ${m(.9).toFixed(1)} z"
        fill="${clair('#e0a860',.34)}" opacity=".8"/>`;
      s += `<ellipse cx="${x.toFixed(1)}" cy="${(y-m(1.4)).toFixed(1)}" rx="${m(.78).toFixed(1)}"
        ry="${m(.2).toFixed(1)}" fill="${voiler(sombre('#6d4a28',.2),d)}"/>`;
      /* la vapeur */
      s += `<g class="vapeur" opacity=".22">`;
      [0,1,2].forEach(q => s += `<ellipse cx="${(x+m(q*.16)).toFixed(1)}"
        cy="${(y-m(1.8+q*.55)).toFixed(1)}" rx="${m(.3+q*.16).toFixed(1)}"
        ry="${m(.18+q*.1).toFixed(1)}" fill="#fff"/>`);
      s += `</g>`;
    }
    /* les blocs de savon qui sèchent, empilés à droite */
    const nb = [0, 2, 4, 7][niv] || 0;
    for (let k = 0; k < nb; k++){
      const d = 10 + (k % 3) * 1.3, X = 1.9 + Math.floor(k / 3) * .85;
      const y = sol(d), m = u => px(u,d), x = pX(X, d);
      const hh = 3 + (k % 4);
      for (let e = 0; e < hh; e++)
        s += `<path d="M${(x-m(.42)).toFixed(1)} ${(y-m(e*.2)).toFixed(1)}
          v${(-m(.19)).toFixed(1)} h${m(.84).toFixed(1)} v${m(.19).toFixed(1)} z"
          fill="${voiler(e%2 ? clair('#e8d8a0',.2) : '#dcc890', d)}"/>`;
    }
  }

  /* ---------- le poisson : claies, filets, sel ---------- */
  if (metier === 'poisson'){
    const n = [1, 2, 4, 6][niv] || 1;
    for (let k = 0; k < n; k++){
      const d = 10 + (k % 3) * 1.5, X = -2.5 + (k % 2) * 5 + Math.floor(k/2)*.5;
      const y = sol(d), m = u => px(u,d), x = pX(X, d);
      s += `<path d="M${(x-m(.9)).toFixed(1)} ${y.toFixed(1)} v${(-m(1.5)).toFixed(1)}
        M${(x+m(.9)).toFixed(1)} ${y.toFixed(1)} v${(-m(1.5)).toFixed(1)}"
        stroke="${voiler(sombre('#7a5c3a',.2),d)}" stroke-width="${Math.max(.5,m(.11)).toFixed(1)}"/>`;
      [0,.5,1].forEach(u => {
        s += `<path d="M${(x-m(1)).toFixed(1)} ${(y-m(.5+u)).toFixed(1)} h${m(2).toFixed(1)}"
          stroke="${voiler(sombre('#7a5c3a',.2),d)}" stroke-width="${Math.max(.4,m(.08)).toFixed(1)}"/>`;
        for (let q = 0; q < 6; q++)
          s += `<ellipse cx="${(x-m(.82)+m(q*.33)).toFixed(1)}" cy="${(y-m(.44+u)).toFixed(1)}"
            rx="${m(.13).toFixed(2)}" ry="${m(.05).toFixed(2)}"
            fill="${voiler('#c9bda0',d)}" opacity=".9"/>`;
      });
    }
  }

  /* ---------- le cordage : la corderie, longue et basse ---------- */
  if (metier === 'cordage'){
    const n = [1, 2, 3, 4][niv] || 1;
    for (let k = 0; k < n; k++){
      const d = 11 + k * 1.8, X = 0, y = sol(d), m = u => px(u,d);
      /* les chandeliers, alignés */
      for (let q = -3; q <= 3; q++){
        const x = pX(q * 1.15, d);
        s += `<path d="M${x.toFixed(1)} ${y.toFixed(1)} v${(-m(1.1)).toFixed(1)}"
          stroke="${voiler(sombre('#7a5c3a',.2),d)}" stroke-width="${Math.max(.4,m(.09)).toFixed(1)}"/>`;
      }
      /* le fil tendu d'un bout à l'autre */
      s += `<path d="M${pX(-3.6,d).toFixed(1)} ${(y-m(1.1)).toFixed(1)}
        h${(pX(3.6,d)-pX(-3.6,d)).toFixed(1)}"
        stroke="${voiler('#c4a878',d)}" stroke-width="${Math.max(.5,m(.1)).toFixed(1)}"/>`;
    }
    /* les rouleaux de corde finis */
    const nr = [0, 2, 4, 7][niv] || 0;
    for (let k = 0; k < nr; k++){
      const d = 9.5 + (k % 3) * 1.1, X = 1.9 + Math.floor(k/3) * .8;
      const y = sol(d), m = u => px(u,d), x = pX(X, d);
      s += `<ellipse cx="${x.toFixed(1)}" cy="${(y-m(.16)).toFixed(1)}" rx="${m(.5).toFixed(1)}"
        ry="${m(.2).toFixed(1)}" fill="${voiler('#b8a078',d)}"/>`;
      s += `<ellipse cx="${x.toFixed(1)}" cy="${(y-m(.16)).toFixed(1)}" rx="${m(.24).toFixed(1)}"
        ry="${m(.1).toFixed(1)}" fill="${voiler(sombre('#8a7550',.2),d)}"/>`;
    }
  }

  /* ---------- l'huile : meule, pressoir, jarres ---------- */
  if (metier === 'huile'){
    /* la meule, à gauche */
    const d = 11, y = sol(d), m = u => px(u,d), x = pX(-2.3, d);
    s += `<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="${m(1.5).toFixed(1)}"
      ry="${m(.4).toFixed(1)}" fill="${voiler(sombre(T.roche,.22),d)}"/>`;
    s += `<ellipse cx="${x.toFixed(1)}" cy="${(y-m(.3)).toFixed(1)}" rx="${m(1.5).toFixed(1)}"
      ry="${m(.4).toFixed(1)}" fill="${voiler(T.roche,d)}"/>`;
    /* la roue de pierre, dressée */
    s += `<ellipse cx="${(x+m(.5)).toFixed(1)}" cy="${(y-m(.85)).toFixed(1)}"
      rx="${m(.18).toFixed(1)}" ry="${m(.62).toFixed(1)}" fill="${voiler(sombre(T.roche,.3),d)}"/>`;
    s += `<path d="M${x.toFixed(1)} ${(y-m(1.5)).toFixed(1)} v${m(.7).toFixed(1)}
      M${x.toFixed(1)} ${(y-m(1.2)).toFixed(1)} h${m(.5).toFixed(1)}"
      stroke="${voiler(sombre('#6d5238',.2),d)}" stroke-width="${Math.max(.5,m(.1)).toFixed(1)}"/>`;
    /* les jarres */
    const nj = [0, 3, 6, 10][niv] || 0;
    for (let k = 0; k < nj; k++){
      const dd = 9.6 + (k % 4) * .8, X = 1.8 + Math.floor(k/4) * .7;
      const yy = sol(dd), mm = u => px(u,dd), xx = pX(X, dd);
      s += `<path d="M${(xx-mm(.16)).toFixed(1)} ${yy.toFixed(1)}
        q${(-mm(.24)).toFixed(1)} ${(-mm(.4)).toFixed(1)} 0 ${(-mm(.68)).toFixed(1)}
        h${mm(.32).toFixed(1)} q${mm(.24).toFixed(1)} ${mm(.28).toFixed(1)} 0 ${mm(.68).toFixed(1)} z"
        fill="${voiler(k%3 ? '#a8794a' : '#8a6440', dd)}"/>`;
    }
  }

  /* ---------- le séchoir, commun à tous ---------- */
  if (sechoir > 0){
    const n = [0, 2, 4, 7][sechoir] || 0;
    for (let k = 0; k < n; k++){
      const d = 8.4 + (k % 3) * .9, X = -2 - Math.floor(k/3) * .8;
      const y = sol(d), m = u => px(u,d), x = pX(X, d);
      s += `<path d="M${(x-m(.7)).toFixed(1)} ${y.toFixed(1)} v${(-m(1.3)).toFixed(1)}
        M${(x+m(.7)).toFixed(1)} ${y.toFixed(1)} v${(-m(1.3)).toFixed(1)}"
        stroke="${voiler(sombre('#7a5c3a',.2),d)}" stroke-width="${Math.max(.5,m(.1)).toFixed(1)}"/>`;
      [0,.45].forEach(u =>
        s += `<path d="M${(x-m(.8)).toFixed(1)} ${(y-m(.6+u)).toFixed(1)} h${m(1.6).toFixed(1)}"
          stroke="${voiler(sombre('#7a5c3a',.2),d)}" stroke-width="${Math.max(.4,m(.08)).toFixed(1)}"/>`);
      const C = { savon:'#e8d8a0', poisson:'#c9bda0', cordage:'#b8a078', huile:'#a8c46a' }[M.metier] || '#e8d8a0';
      for (let q = 0; q < 8; q++)
        s += `<rect x="${(x-m(.7)+m((q%4)*.36)).toFixed(1)}"
          y="${(y-m(.64+(q<4?0:.45))).toFixed(1)}" width="${m(.24).toFixed(2)}"
          height="${m(.28).toFixed(2)}" rx="${m(.04).toFixed(2)}" fill="${voiler(C,d)}"/>`;
    }
  }

  /* ---------- des caisses à ta marque, devant ---------- */
  const nc = [0, 2, 3, 5][niv] || 0;
  for (let k = 0; k < nc; k++){
    const d = 6.6 + (k % 2) * .8, X = 1.7 + Math.floor(k/2) * .7;
    const y = sol(d), m = u => px(u,d), x = pX(X, d);
    s += `<path d="M${(x-m(.44)).toFixed(1)} ${y.toFixed(1)} v${(-m(.62)).toFixed(1)}
      h${m(.88).toFixed(1)} v${m(.62).toFixed(1)} z" fill="${voiler('#a5825c',d)}"/>`;
    s += `<path d="M${(x-m(.44)).toFixed(1)} ${(y-m(.62)).toFixed(1)}
      h${m(.88).toFixed(1)} v${m(.09).toFixed(1)} h${(-m(.88)).toFixed(1)} z"
      fill="${clair('#c9a374',.3)}"/>`;
    /* ta marque, tamponnée dessus */
    s += `<rect x="${(x-m(.14)).toFixed(1)}" y="${(y-m(.44)).toFixed(1)}"
      width="${m(.28).toFixed(2)}" height="${m(.28).toFixed(2)}"
      rx="${(M.ecusson==='rond'?m(.14):m(.05)).toFixed(2)}"
      fill="${voiler(M.c,d)}" opacity=".9"/>`;
  }
  return s + `</g>`;
}

/* ---------- la scène ---------- */
function fabrique(A){
  const M = { c:A.c || '#4a5460', c2:A.c2 || '#74808e', nom:A.nom || '',
              ecusson:A.ecusson || 'carre', metier:A.metier || 'savon' };
  let s = fond() + terrasse();
  s += batiment(A.atelier || 0, M);
  s += materiel(M.metier, A.atelier || 0, A.sechoir || 0, M);
  s += `<defs><radialGradient id="f-vig" cx="0.5" cy="0.44" r="0.8">
    <stop offset="48%" stop-color="${T.ombre}" stop-opacity="0"/>
    <stop offset="100%" stop-color="${T.ombre}" stop-opacity="${T.voile}"/></radialGradient></defs>`;
  s += `<rect x="0" y="${HAUT}" width="${W}" height="${(BAS-HAUT).toFixed(1)}" fill="url(#f-vig)"/>`;
  return s;
}

const ECUSSONS = [

/* ---------- les formes de ton signe ---------- */
const SIGNES = [
  { k:'ancre',   n:'Ancre' },    { k:'poisson', n:'Poisson' },
  { k:'vague',   n:'Vague' },    { k:'olive',   n:'Olivier' },
  { k:'noeud',   n:'Nœud' },     { k:'etoile',  n:'Étoile' },
  { k:'soleil',  n:'Soleil' },   { k:'barque',  n:'Barque' },
  { k:'phare',   n:'Phare' },    { k:'cle',     n:'Clé' },
  { k:'balance', n:'Balance' },  { k:'compas',  n:'Compas' },
  { k:'gouvernail', n:'Barre' }, { k:'cigale',  n:'Cigale' },
  { k:'croix',   n:'Croix' },    { k:'main',    n:'Main' },
  { k:'roue',    n:'Roue' },     { k:'mistral', n:'Mistral' },
  { k:'jarre',   n:'Jarre' },    { k:'pin',     n:'Pin' }
];

/* le dessin d'un signe, dans un carré de 24 */
function signe(k, c){
  const S = {
    ancre:   '<path d="M12 6v13M7 11h10M12 19c-4 0-6-3-6-5M12 19c4 0 6-3 6-5" stroke="'+c+'" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="12" cy="5" r="2.4" fill="none" stroke="'+c+'" stroke-width="2"/>',
    poisson: '<path d="M4 12c3-4 8-5 11-3 2 1 3 2 4 3-1 1-2 2-4 3-3 2-8 1-11-3z" fill="'+c+'"/><path d="M19 12l3-3v6z" fill="'+c+'"/><circle cx="8" cy="11" r="1" fill="#fff"/>',
    vague:   '<path d="M3 10q3-3 6 0t6 0 6 0M3 15q3-3 6 0t6 0 6 0" stroke="'+c+'" stroke-width="2.2" fill="none" stroke-linecap="round"/>',
    olive:   '<path d="M12 20V8M12 8c0-3 3-5 6-4 0 3-3 5-6 4zM12 12c0-3-3-5-6-4 0 3 3 5 6 4z" stroke="'+c+'" stroke-width="2" fill="none" stroke-linecap="round"/>',
    noeud:   '<path d="M8 8a4 4 0 1 0 8 8M16 8a4 4 0 1 1-8 8" stroke="'+c+'" stroke-width="2.2" fill="none" stroke-linecap="round"/>',
    etoile:  '<path d="M12 3l2.6 6.5L21 10l-5 4.2 1.6 6.8L12 17.4 6.4 21 8 14.2 3 10l6.4-.5z" fill="'+c+'"/>',
    soleil:  '<circle cx="12" cy="12" r="4.6" fill="'+c+'"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2" stroke="'+c+'" stroke-width="2" stroke-linecap="round"/>',
    barque:  '<path d="M3 15q3 2 6 0t6 0 6 0M5 12h14l-2-4H7z" stroke="'+c+'" stroke-width="2" fill="none" stroke-linejoin="round"/><path d="M12 8V3" stroke="'+c+'" stroke-width="2" stroke-linecap="round"/>',
    phare:   '<path d="M9 21h6l-1-11h-4zM10 10V6h4v4M12 6V3" stroke="'+c+'" stroke-width="2" fill="none" stroke-linejoin="round"/><path d="M5 6l3 1M19 6l-3 1" stroke="'+c+'" stroke-width="1.8" stroke-linecap="round"/>',
    cle:     '<circle cx="8" cy="8" r="4" fill="none" stroke="'+c+'" stroke-width="2"/><path d="M11 11l8 8M16 16l2 2M14 18l2 2" stroke="'+c+'" stroke-width="2" stroke-linecap="round"/>',
    balance: '<path d="M12 4v16M6 20h12M4 8h16M4 8l-2 5a3 3 0 0 0 4 0zM20 8l2 5a3 3 0 0 1-4 0z" stroke="'+c+'" stroke-width="1.8" fill="none" stroke-linejoin="round"/>',
    compas:  '<path d="M12 4v5M9 21l3-12 3 12" stroke="'+c+'" stroke-width="2" fill="none" stroke-linejoin="round"/><circle cx="12" cy="4" r="1.8" fill="'+c+'"/>',
    gouvernail:'<circle cx="12" cy="12" r="6" fill="none" stroke="'+c+'" stroke-width="2"/><circle cx="12" cy="12" r="2" fill="'+c+'"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4M5 5l3 3M16 16l3 3M19 5l-3 3M8 16l-3 3" stroke="'+c+'" stroke-width="1.8" stroke-linecap="round"/>',
    cigale:  '<ellipse cx="12" cy="14" rx="3" ry="6" fill="'+c+'"/><path d="M11 9C7 6 3 8 4 12c1 3 5 3 7 1M13 9c4-3 8-1 7 3-1 3-5 3-7 1" fill="'+c+'" opacity=".55"/><circle cx="12" cy="7" r="2" fill="'+c+'"/>',
    croix:   '<path d="M12 3v18M3 12h18" stroke="'+c+'" stroke-width="2.6" stroke-linecap="round"/><circle cx="12" cy="12" r="3" fill="none" stroke="'+c+'" stroke-width="1.6"/>',
    main:    '<path d="M9 20v-7M9 13V6a1.5 1.5 0 0 1 3 0v6M12 12V5a1.5 1.5 0 0 1 3 0v7M15 12V7a1.5 1.5 0 0 1 3 0v8c0 3-2 5-5 5H9l-3-4 2-1" stroke="'+c+'" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>',
    roue:    '<circle cx="12" cy="12" r="8" fill="none" stroke="'+c+'" stroke-width="2"/><circle cx="12" cy="12" r="2.4" fill="'+c+'"/><path d="M12 4v4M12 16v4M4 12h4M16 12h4" stroke="'+c+'" stroke-width="1.8"/>',
    mistral: '<path d="M3 8h11a3 3 0 1 0-3-3M3 13h15a3 3 0 1 1-3 3M3 18h9" stroke="'+c+'" stroke-width="2" fill="none" stroke-linecap="round"/>',
    jarre:   '<path d="M9 4h6M10 4c0 2-4 3-4 8 0 5 2 8 6 8s6-3 6-8c0-5-4-6-4-8" stroke="'+c+'" stroke-width="1.9" fill="none" stroke-linejoin="round"/><path d="M6 13h12" stroke="'+c+'" stroke-width="1.5"/>',
    pin:     '<path d="M12 21v-4M12 3l5 7h-3l4 6H6l4-6H7z" stroke="'+c+'" stroke-width="1.9" fill="none" stroke-linejoin="round"/>'
  }[k] || '';
  return '<svg viewBox="0 0 24 24">' + S + '</svg>';
}

const MET = { savon:'Savonnier', poisson:'Sécheur', cordage:'Cordier', huile:'Huilier' };
let D = null;

function decor(){
  const A = D.affaire || {};
  const c = COULEURS.find(x => x.k === A.couleur) || COULEURS[0];
  const h = new Date().getHours();
  regler(h < 7 ? 'nuit' : h < 11 ? 'matin' : h < 16 ? 'midi' : h < 20 ? 'soir' : 'nuit');
  const el = document.getElementById('anse');
  const v = cadrer(el.clientWidth || innerWidth, el.clientHeight || innerHeight * .46);
  el.innerHTML = '<svg viewBox="0 ' + v.y.toFixed(1) + ' ' + W + ' ' + v.h.toFixed(1) + '" '
    + 'preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">'
    + fabrique({ metier:A.metier, atelier:A.atelier || 0, sechoir:A.sechoir || 0,
        c:c.c, c2:c.c2, nom:A.nom, ecusson:A.ecusson }) + '</svg>';
}

function entete(){
  const A = D.affaire || {};
  const c = COULEURS.find(x => x.k === A.couleur) || COULEURS[0];
  const f = (ECUSSONS.find(x => x.k === A.ecusson) || ECUSSONS[0]).r;
  const em = document.getElementById('t-em');
  em.style.background = c.c; em.style.borderRadius = f;
  em.innerHTML = signe(A.signe || 'ancre', '#fff');
  document.getElementById('t-nom').textContent = A.nom || 'Ton anse';
  document.getElementById('t-met').textContent = MET[A.metier] || '—';
  document.getElementById('t-eu').textContent =
    Number(D.euros || 0).toLocaleString('fr-FR', {minimumFractionDigits:2}) + ' €';
}

function poserProd(){
  const A = D.affaire || {}, P = A.prod || {};
  const stock = +P.stock || 0, cap = +P.capacite || 1;
  const vaut = +P.vaut || 0;
  const el = document.getElementById('prod');
  el.innerHTML = '<div class="l1">'
    + '<span class="ic"><svg viewBox="0 0 24 24">'
    + '<path d="M4 8h16v12H4zM4 8l2-4h12l2 4M9 12h6"/></svg></span>'
    + '<span class="tx"><b>' + stock.toFixed(1) + ' pièces</b>'
    + '<span>' + (+P.par_jour || 0).toFixed(1) + ' par jour, à '
    + (+P.prix_piece || 0).toFixed(1) + ' € la pièce.</span></span>'
    + '<span class="px"><em>' + vaut + ' €</em></span></div>'
    + '<div class="jauge"><i class="' + (P.plein ? 'plein' : '') + '" style="width:'
    + Math.min(100, stock / cap * 100).toFixed(1) + '%"></i></div>'
    + '<div class="sous"><span>Ta réserve</span><span>'
    + stock.toFixed(1) + ' / ' + cap + '</span></div>'
    + '<button id="ram"' + (stock < 1 ? ' disabled' : '') + '>'
    + (P.plein ? 'Ta réserve déborde — ramasser ' + vaut + ' €'
       : stock < 1 ? 'Rien à prendre pour l\'instant'
       : 'Ramasser — ' + vaut + ' €') + '</button>';
  const b = document.getElementById('ram');
  if (b && stock >= 1) b.onclick = async () => {
    b.disabled = true; b.textContent = '…';
    const r = await BD.agir('ramasser');
    if (r.ok){ D = await BD.charger(); entete(); poserProd(); poserBatis(); }
    else b.textContent = "Ça n'a pas marché";
  };
}

function poserBatis(){
  const A = D.affaire || {};
  document.getElementById('batis').innerHTML = BATIS.map(B => {
    const n = +A[B.k] || 0;
    const act = B.N[n], suiv = B.N[n + 1];
    const peut = suiv && Number(D.euros || 0) >= suiv.prix;
    let s = '<div class="bat"><div class="l1"><b>' + B.n + '</b>'
      + (suiv ? '<span class="px">' + suiv.prix.toLocaleString('fr-FR') + ' €</span>'
              : '<span class="px fait">Au bout ✓</span>') + '</div>'
      + '<span class="a">' + act.n + ' — ' + act.d + '</span>'
      + '<div class="niv">' + B.N.map((_, i) =>
          '<i class="' + (i <= n ? 'on' : '') + '"></i>').join('') + '</div>';
    if (suiv){
      s += '<span class="n">Ensuite : ' + suiv.n + ' — ' + suiv.d + '</span>';
      const g = [];
      ['prod','stock','bonus'].forEach(k => {
        if (suiv[k] === undefined) return;
        const dd = (suiv[k] || 0) - (act[k] || 0);
        if (dd) g.push('+' + dd + ' ' +
          { prod:'de production', stock:'de réserve', bonus:'au chargement' }[k]);
      });
      if (g.length) s += '<span class="ef">' + g.join(' · ') + '</span>';
      s += '<button data-b="' + B.k + '"' + (peut ? '' : ' disabled') + '>'
        + (peut ? 'Bâtir' : 'Il te manque '
            + (suiv.prix - Number(D.euros || 0)).toLocaleString('fr-FR') + ' €')
        + '</button>';
    }
    return s + '</div>';
  }).join('');

  document.querySelectorAll('[data-b]').forEach(b =>
    b.onclick = async () => {
      b.disabled = true; b.textContent = 'On monte…';
      const r = await BD.agir('batir', { p_quoi: b.dataset.b });
      if (r.ok){ D = await BD.charger(); decor(); entete(); poserProd(); poserBatis(); }
      else b.textContent = r.pourquoi === 'trop_cher' ? 'Pas assez' : "Ça n'a pas marché";
    });
}

document.getElementById('ret').onclick = () => location.href = 'jeu.html';

(async () => {
  try {
    D = await BD.charger();
    if (!D){ location.href = 'index.html'; return; }
  } catch(e){ return; }
  if (!D.affaire){ location.href = 'registre.html'; return; }
  if (D.parti_le || D.port !== 'anse'){ location.href = 'jeu.html'; return; }
  decor(); entete(); poserProd(); poserBatis();
})();

let t = null;
addEventListener('resize', () => { clearTimeout(t); t = setTimeout(() => D && decor(), 200); });
</script>
