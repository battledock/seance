<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#16304a">
<title>Battle Dock — Ton anse</title>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none}
html,body{height:100%;overflow:hidden;background:#f4efe3;
  font-family:'Courier Prime',monospace;color:#26313f}

/* ---------- la fabrique, en haut ---------- */
#anse{position:fixed;left:0;right:0;top:0;height:46%;overflow:hidden}
#anse svg{display:block;width:100%;height:100%}
#anse::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(244,239,227,.18) 0,rgba(244,239,227,0) 44%,
    rgba(244,239,227,.72) 84%,rgba(244,239,227,1) 100%)}

/* ---------- l'entête ---------- */
.tete{position:fixed;left:0;right:0;top:0;z-index:6;
  padding:calc(env(safe-area-inset-top) + 13px) 14px 0;
  display:flex;align-items:center;gap:10px}
.tete .ret{flex:0 0 40px;height:40px;border-radius:9px;
  border:1.5px solid rgba(38,49,63,.16);background:rgba(255,253,248,.86);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  box-shadow:0 2px 8px rgba(80,64,40,.09);
  display:flex;align-items:center;justify-content:center;cursor:pointer}
.tete .ret svg{width:18px;height:18px;stroke:#4a5a6d;fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}
.tete .id{flex:1;min-width:0;display:flex;align-items:center;gap:10px;
  background:rgba(255,253,248,.86);border:1.5px solid rgba(38,49,63,.14);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  box-shadow:0 2px 8px rgba(80,64,40,.09);
  border-radius:9px;padding:6px 12px 6px 7px}
.tete .id .em{flex:0 0 30px;height:30px;display:flex;align-items:center;justify-content:center}
.tete .id .em svg{width:19px;height:19px}
.tete .id b{display:block;font-size:13px;font-weight:700;color:#1b2836;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.tete .id span{display:block;font-size:8px;letter-spacing:.14em;text-transform:uppercase;
  color:rgba(38,49,63,.5);margin-top:2px}
.tete .eu{flex:0 0 auto;background:rgba(255,253,248,.86);border:1.5px solid rgba(38,49,63,.14);
  border-radius:9px;padding:9px 12px;backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);box-shadow:0 2px 8px rgba(80,64,40,.09);
  font-size:12.5px;font-weight:700;color:#b8863a}

/* ---------- le corps ---------- */
.w{position:fixed;left:0;right:0;top:41%;bottom:0;z-index:5;overflow-y:auto;
  padding:0 14px calc(env(safe-area-inset-bottom) + 18px)}
.w::-webkit-scrollbar{display:none}
.tt{font-size:7.5px;letter-spacing:.22em;text-transform:uppercase;
  color:rgba(38,49,63,.42);margin:16px 3px 10px}
.tt:first-child{margin-top:6px}

/* ---------- la production ---------- */
.prod{background:#fffdf8;border:1.5px solid rgba(38,49,63,.12);border-radius:12px;
  padding:16px;margin-bottom:4px;
  box-shadow:0 1px 2px rgba(80,64,40,.05),0 8px 22px rgba(80,64,40,.06)}
.prod .l1{display:flex;align-items:flex-start;gap:13px}
.prod .l1 .ic{flex:0 0 42px;height:42px;border-radius:10px;
  background:rgba(184,134,58,.13);display:flex;align-items:center;justify-content:center}
.prod .l1 .ic svg{width:21px;height:21px;stroke:#b8863a;fill:none;stroke-width:1.7;
  stroke-linejoin:round}
.prod .l1 .tx{flex:1;min-width:0}
.prod .l1 .tx b{display:block;font-size:16px;color:#1b2836;font-weight:700}
.prod .l1 .tx span{display:block;font-size:11.5px;color:rgba(38,49,63,.55);margin-top:4px;
  font-family:system-ui,sans-serif;line-height:1.5}
.prod .l1 .px em{display:block;font-style:normal;font-size:21px;font-weight:700;color:#b8863a}
.prod .jauge{height:7px;background:rgba(38,49,63,.09);border-radius:4px;overflow:hidden;
  margin-top:14px}
.prod .jauge i{display:block;height:100%;border-radius:4px;
  background:linear-gradient(90deg,#d8a848,#f0c46a);transition:width .7s}
.prod .jauge i.plein{background:linear-gradient(90deg,#b8483a,#e08a6a)}
.prod .sous{display:flex;justify-content:space-between;margin-top:8px;font-size:10.5px;
  color:rgba(38,49,63,.46);font-family:system-ui,sans-serif}
.prod button{width:100%;margin-top:14px;padding:15px;border:0;border-radius:9px;cursor:pointer;
  background:#1b2836;color:#f6f2e8;
  box-shadow:0 3px 10px rgba(27,40,54,.18);
  font-family:'Courier Prime',monospace;font-size:13.5px;font-weight:700;letter-spacing:.06em;
  transition:transform .12s}
.prod button:active{transform:scale(.986)}
.prod button:disabled{background:rgba(38,49,63,.09);color:rgba(38,49,63,.34);
  box-shadow:none;cursor:default}

/* ---------- les onglets des constructions ---------- */
.ongB{display:flex;gap:6px;margin-bottom:11px}
.ongB button{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;
  padding:12px 3px 10px;border:1.5px solid rgba(38,49,63,.12);border-radius:10px;
  background:#fffdf8;cursor:pointer;font-family:'Courier Prime',monospace;
  box-shadow:0 1px 2px rgba(80,64,40,.04);transition:all .18s}
.ongB button.on{border-color:#b8863a;background:#fdf6e8;
  box-shadow:0 2px 8px rgba(184,134,58,.16)}
.ongB svg{width:19px;height:19px;stroke:rgba(38,49,63,.44);fill:none;stroke-width:1.7;
  stroke-linejoin:round;stroke-linecap:round}
.ongB button.on svg{stroke:#b8863a}
.ongB .pts{display:flex;gap:2.5px}
.ongB .pts i{width:5px;height:5px;border-radius:50%;background:rgba(38,49,63,.14)}
.ongB .pts i.on{background:#b8863a}

/* ---------- le détail ---------- */
.det{background:#fffdf8;border:1.5px solid rgba(38,49,63,.12);border-radius:12px;
  overflow:hidden;box-shadow:0 1px 2px rgba(80,64,40,.05),0 8px 22px rgba(80,64,40,.06)}
.det .h{padding:17px 18px 15px;border-bottom:1px solid rgba(38,49,63,.09)}
.det .h b{display:block;font-size:18px;color:#1b2836;font-weight:700;letter-spacing:.02em}
.det .h span{display:block;font-size:12px;color:rgba(38,49,63,.52);margin-top:6px;
  font-family:system-ui,sans-serif;line-height:1.55}
.det .etat{display:flex;align-items:center;gap:11px;padding:14px 18px;
  border-bottom:1px solid rgba(38,49,63,.08);background:rgba(38,49,63,.025)}
.det .etat .n{flex:0 0 auto;font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  color:rgba(38,49,63,.42)}
.det .etat b{flex:1;font-size:14px;color:#1b2836;font-weight:700}
.det .suite{padding:17px 18px}
.det .suite .fl{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.det .suite .fl svg{width:15px;height:15px;stroke:#b8863a;fill:none;stroke-width:2}
.det .suite .fl b{flex:1;font-size:15px;color:#b8863a;font-weight:700}
.det .suite .fl .px{font-size:15px;font-weight:700;color:#1b2836}
.det .suite .d{font-size:12.5px;color:rgba(38,49,63,.55);line-height:1.6;
  font-family:system-ui,sans-serif}
.det .gains{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px}
.det .gains span{font-size:11px;padding:5px 12px;border-radius:14px;
  background:rgba(74,122,84,.11);color:#3f6b48;font-family:system-ui,sans-serif;font-weight:600}
.det button.go{width:100%;margin-top:16px;padding:15px;border:0;border-radius:9px;
  cursor:pointer;background:#1b2836;color:#f6f2e8;
  box-shadow:0 3px 10px rgba(27,40,54,.18);
  font-family:'Courier Prime',monospace;font-size:13.5px;font-weight:700;letter-spacing:.06em;
  transition:transform .12s}
.det button.go:active{transform:scale(.986)}
.det button.go:disabled{background:rgba(38,49,63,.09);color:rgba(38,49,63,.34);
  box-shadow:none;cursor:default}
.det .fini{padding:24px 18px;text-align:center;font-size:13px;color:#3f6b48;
  font-family:system-ui,sans-serif}

.mot{font-size:10.5px;color:rgba(38,49,63,.4);line-height:1.65;text-align:center;
  margin:16px 6px 4px;font-family:system-ui,sans-serif}

/* ---------- ton enseigne ---------- */
.ens{background:#fffdf8;border:1.5px solid rgba(38,49,63,.12);border-radius:12px;
  padding:17px 18px;box-shadow:0 1px 2px rgba(80,64,40,.05),0 8px 22px rgba(80,64,40,.06)}
.ens .lab{font-size:7.5px;letter-spacing:.2em;text-transform:uppercase;
  color:rgba(38,49,63,.42);margin:0 0 9px}
.ens .lab.b{margin-top:18px}
.ens input{width:100%;padding:15px 16px;border:1.5px solid rgba(38,49,63,.16);
  border-radius:9px;background:#fff;color:#1b2836;
  font-family:'Courier Prime',monospace;font-size:17px;font-weight:700;
  text-align:center;-webkit-user-select:text;user-select:text}
.ens input:focus{outline:none;border-color:#b8863a}
.ens .gr{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ens .gr button{display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:10px 3px 9px;border:1.5px solid rgba(38,49,63,.12);border-radius:9px;
  background:#fff;cursor:pointer;transition:all .16s}
.ens .gr button.on{border-color:#b8863a;background:#fdf6e8}
.ens .gr .p{width:26px;height:26px;border-radius:6px;
  box-shadow:inset 0 1px 3px rgba(0,0,0,.14)}
.ens .gr span{font-size:7.5px;color:rgba(38,49,63,.5);text-align:center;line-height:1.15;
  padding:0 1px}
.ens .fixe{display:flex;align-items:center;gap:11px;margin-top:16px;padding:13px 14px;
  border-radius:9px;background:rgba(38,49,63,.04);border:1px solid rgba(38,49,63,.09)}
.ens .fixe .em{flex:0 0 36px;height:36px;display:flex;align-items:center;justify-content:center}
.ens .fixe .em svg{width:22px;height:22px}
.ens .fixe .tx{flex:1;min-width:0}
.ens .fixe .tx b{display:block;font-size:16px;font-weight:700}
.ens .fixe .tx span{display:block;font-size:10px;color:rgba(38,49,63,.44);margin-top:3px;
  font-family:system-ui,sans-serif}
.ens .go{width:100%;margin-top:15px;padding:15px;border:0;border-radius:9px;cursor:pointer;
  background:#1b2836;color:#f6f2e8;box-shadow:0 3px 10px rgba(27,40,54,.18);
  font-family:'Courier Prime',monospace;font-size:13.5px;font-weight:700;letter-spacing:.06em}
.ens .go:disabled{background:rgba(38,49,63,.09);color:rgba(38,49,63,.34);
  box-shadow:none;cursor:default}

/* ---------- la confirmation ---------- */
.cf{position:fixed;z-index:30;left:20px;right:20px;top:50%;max-width:320px;margin:0 auto;
  transform:translateY(-50%) scale(.94);background:#fffdf8;
  border:1.5px solid rgba(38,49,63,.14);border-radius:12px;
  box-shadow:0 16px 50px rgba(80,64,40,.24);
  opacity:0;pointer-events:none;transition:opacity .22s,transform .26s cubic-bezier(.2,.9,.3,1)}
.cf.on{opacity:1;transform:translateY(-50%) scale(1);pointer-events:auto}
.cfv{position:fixed;inset:0;z-index:29;background:rgba(38,49,63,.42);
  opacity:0;pointer-events:none;transition:opacity .22s}
.cfv.on{opacity:1;pointer-events:auto}
.cf .h{padding:22px 20px 0;text-align:center}
.cf .h .ic{width:46px;height:46px;border-radius:12px;margin:0 auto 14px;
  background:rgba(184,134,58,.14);display:flex;align-items:center;justify-content:center}
.cf .h .ic svg{width:22px;height:22px;stroke:#b8863a;fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.cf .h b{display:block;font-size:16px;color:#1b2836;font-weight:700}
.cf .h .px{display:block;font-size:30px;font-weight:700;color:#b8863a;margin-top:12px}
.cf .h span{display:block;font-size:12px;color:rgba(38,49,63,.52);margin-top:10px;
  font-family:system-ui,sans-serif;line-height:1.55}
.cf .bt{display:flex;gap:9px;padding:20px}
.cf .bt button{flex:1;padding:14px 6px;border-radius:9px;cursor:pointer;
  font-family:'Courier Prime',monospace;font-size:12.5px;font-weight:700}
.cf .bt .non{border:1.5px solid rgba(38,49,63,.18);background:#fff;color:rgba(38,49,63,.66)}
.cf .bt .oui{border:0;background:#1b2836;color:#f6f2e8}

/* ---------- ce qui vit ---------- */
.onde{will-change:transform}
.o0{animation:v0 30s linear infinite}.o1{animation:v1 40s linear infinite}
.o2{animation:v0 52s linear infinite}.o3{animation:v1 64s linear infinite}
@keyframes v0{to{transform:translateX(50px)}}
@keyframes v1{to{transform:translateX(-50px)}}
.pin{animation:brise 15s ease-in-out infinite;transform-origin:50% 100%}
@keyframes brise{0%,100%{transform:rotate(-.4deg)}50%{transform:rotate(.4deg)}}
.fumee{animation:monte 9s ease-in-out infinite}
.vapeur{animation:monte 6s ease-in-out infinite}
@keyframes monte{0%{opacity:.28;transform:translate(0,0) scale(1)}
  100%{opacity:0;transform:translate(4px,-14px) scale(1.9)}}
.braise{animation:feu 3.4s ease-in-out infinite}
@keyframes feu{0%,100%{opacity:.5}44%{opacity:.85}}
@media (prefers-reduced-motion:reduce){*{animation:none !important}}
</style>
</head>
<body>

<div id="anse"></div>

<div class="tete">
  <button class="ret" id="ret"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
  <span class="id"><span class="em" id="t-em"></span>
    <span><b id="t-nom">—</b><span id="t-met">—</span></span></span>
  <span class="eu" id="t-eu">—</span>
</div>

<div class="cfv" id="cfv"></div>
<div class="cf" id="cf">
  <div class="h">
    <span class="ic"><svg viewBox="0 0 24 24">
      <path d="M12 9v4M12 17h.01M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>
    </svg></span>
    <b id="c-t">—</b><span class="px" id="c-px">—</span><span id="c-d">—</span>
  </div>
  <div class="bt"><button class="non" id="c-non">Non</button>
    <button class="oui" id="c-oui">Oui, dépenser</button></div>
</div>

<div class="w">
  <p class="tt">Ce qui a séché</p>
  <div class="prod" id="prod"></div>
  <p class="tt">Ce que tu bâtis</p>
  <div class="ongB" id="ongB"></div>
  <div class="det" id="det"></div>
  <p class="tt">Ton enseigne</p>
  <div class="ens" id="ens"></div>
  <p class="mot">Ton anse produit même quand tu es en mer.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="bd.js?v=3"></script>
<script>
/* ============================================================
   TA FABRIQUE — vue depuis la terrasse de l'anse
   Elle change avec ton métier, ton niveau, ta marque.
   ============================================================ */

const W = 480;
const FOCALE = 727;
const OEIL = 1.6;
const HORIZON = 250;

const px  = (m, d) => m * FOCALE / d;
const sol = d => HORIZON + OEIL * FOCALE / d;
const pX  = (X, d) => 240 + X * FOCALE / d;
const rnd = s => { const x = Math.sin(s * 127.1) * 43758.5; return x - Math.floor(x); };
const rnd2 = (a,b) => { const x = Math.sin(a*127.1 + b*311.7) * 43758.5; return x - Math.floor(x); };

function hx(c){ return [parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)]; }
function ch(a){ return '#'+a.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join(''); }
function mel(a,b,k){ const A=hx(a),B=hx(b); return ch([0,1,2].map(i=>A[i]+(B[i]-A[i])*k)); }

const TEMPS = {
  aube: {
    nom: "À l'aube",
    /* le ciel de l'aube : bleu profond en haut, or à l'horizon */
    ciel:['#4a86c0','#6ea4d0','#96c0de','#bad6e8','#dce8ea','#f4ecd8','#fff2dc'],
    or:'#ffe4b8', ombre:'#3a4a68',
    roche:'#e4d8bc', rocheO:'#c0b092',
    pin:'#5c7f5e',
    eau:['#e8d8b8','#c4c0a8','#8ab0b8','#5a9ab0'],
    mur:'#f4e8d0', murO:'#d4c4a4', murC:'#fffaf0',
    toit:'#c26a44', toitC:'#e08a5c',
    voile:.08, sol:{x:214,y:172,r:15}
  }
};
let T = TEMPS.aube;
function regler(){ T = TEMPS.aube; return T; }

const clair  = (c,k) => mel(c, T.or, k===undefined?.3:k);
const sombre = (c,k) => mel(c, T.ombre, k===undefined?.22:k);
const voiler = (c,d) => mel(c, mel(T.ciel[4], T.or,.42), Math.min(.44, Math.pow(d/190,.85)));
const nuit = () => false;   /* c'est toujours l'aube ici */
const tot = () => true;

let HAUT=-120, BAS=900;
function cadrer(l,h){
  const total = W*h/l;
  HAUT = HORIZON - total*.70;
  BAS = HAUT + total;
  return { y:HAUT, h:total };
}

/* ---------- le fond : ciel, mer, falaises ---------- */
function fond(){
  let s = `<defs><linearGradient id="f-ciel" x1="0" y1="0" x2="0" y2="1">`
    + T.ciel.map((c,i)=>`<stop offset="${[0,16,34,52,70,86,100][i]}%" stop-color="${c}"/>`).join('')
    + `</linearGradient><linearGradient id="f-eau" x1="0" y1="0" x2="0" y2="1">`
    + T.eau.map((c,i)=>`<stop offset="${[0,22,58,100][i]}%" stop-color="${c}"/>`).join('')
    + `</linearGradient>
    <radialGradient id="f-halo" cx="0.5" cy="0.5">
      <stop offset="0%" stop-color="${T.or}" stop-opacity=".46"/>
      <stop offset="100%" stop-color="${T.or}" stop-opacity="0"/></radialGradient></defs>`;
  s += `<rect x="0" y="${HAUT}" width="${W}" height="${(sol(300)-HAUT).toFixed(1)}" fill="url(#f-ciel)"/>`;
  s += `<ellipse cx="${T.sol.x}" cy="${T.sol.y}" rx="180" ry="130" fill="url(#f-halo)"/>`;
  s += `<circle cx="${T.sol.x}" cy="${T.sol.y}" r="${T.sol.r}" fill="${mel('#fffdf4',T.or,.3)}"/>`;
  /* les dernières étoiles, en haut du ciel */
  for (let i=0;i<18;i++)
      s += `<circle class="etoile e${i%4}" cx="${(rnd(i*19+2)*W).toFixed(0)}"
        cy="${(HAUT+rnd(i*13+7)*(HORIZON-HAUT)*.85).toFixed(0)}"
        r="${(.4+rnd(i*23)*.6).toFixed(2)}" fill="#fff"
        opacity="${(.32*(1-rnd(i*13+7))).toFixed(2)}"/>`;

  /* la mer, au fond à gauche : on est au bord de l'eau */
  const ym = sol(300);
  s += `<rect x="0" y="${ym.toFixed(1)}" width="${W}" height="${(sol(46)-ym).toFixed(1)}"
    fill="url(#f-eau)"/>`;
  for (let n=0;n<5;n++){
    const d = 240/Math.pow(n+1,1.2), y = sol(d);
    if (y > sol(46)) continue;
    s += `<g class="onde o${n%4}"><path d="M-90 ${y.toFixed(1)} `;
    let p='';
    for(let k=0;k<20;k++) p += `q${px(3,d).toFixed(1)} ${(-px(.16,d)).toFixed(1)} ${px(6,d).toFixed(1)} 0 `;
    s += p + `" stroke="#fff" stroke-width="${Math.max(.4,px(.09,d)).toFixed(2)}"
      fill="none" opacity="${(.14-n*.02).toFixed(2)}"/></g>`;
  }

  /* --- les collines de garrigue --- */
  /* On calcule la crête une fois, et on plante les pins DESSUS. */
  const PLANS = [
    { d:150, base:12, c:mel(T.roche, T.ciel[4], .5),  amp:5.5, n:9, pins:0 },
    { d:82,  base:11, c:mel(T.roche, T.ciel[4], .26), amp:6.5, n:8, pins:9 },
    { d:46,  base:9,  c:mel(T.roche, T.ciel[5], .06), amp:6,   n:7, pins:11 }
  ];

  PLANS.forEach((P, j) => {
    const y0 = sol(P.d);
    /* la hauteur de la crête, en mètres, pour une position à l'écran */
    const crete = u => P.base
      + Math.sin(u * 6.3 + j * 2.1) * P.amp * .5
      + Math.sin(u * 13.7 + j * 4.4) * P.amp * .26
      + Math.sin(u * 2.9 + j) * P.amp * .3;
    /* et la même chose en y à l'écran */
    const yc = u => y0 - px(crete(u), P.d);

    let p = `M-40 ${(y0 + 60).toFixed(1)} L-40 ${yc(-.08).toFixed(1)} `;
    for (let k = 0; k <= P.n * 3; k++){
      const u = k / (P.n * 3);
      p += `L${(-40 + (W + 80) * u).toFixed(1)} ${yc(u).toFixed(1)} `;
    }
    p += `L${(W + 40)} ${(y0 + 60).toFixed(1)} Z`;
    s += `<path d="${p}" fill="${voiler(P.c, P.d)}"/>`;

    /* les pins, plantés sur la crête */
    for (let k = 0; k < P.pins; k++){
      const u = (k + .5) / P.pins + (rnd(j * 13 + k) - .5) * .07;
      if (u < 0 || u > 1) continue;
      const x = -40 + (W + 80) * u;
      const y = yc(u) + 1;                    /* le pied touche la crête */
      const t = px(2.4, P.d) * (.8 + rnd(j * 7 + k) * .5);
      if (t < .8) continue;
      s += `<g class="pin">`;
      s += `<path d="M${x.toFixed(1)} ${y.toFixed(1)} l${(t*.06).toFixed(1)} ${(-t*.5).toFixed(1)}"
        stroke="${voiler(sombre('#5a4a38', .26), P.d)}"
        stroke-width="${Math.max(.4, t*.09).toFixed(2)}"/>`;
      [[0,-.58,1],[-.44,-.48,.62],[.44,-.5,.66]].forEach(([dx,dy,r],q)=>
        s += `<ellipse cx="${(x + dx*t*.7).toFixed(1)}" cy="${(y + dy*t).toFixed(1)}"
          rx="${(t*.5*r).toFixed(1)}" ry="${(t*.24*r).toFixed(1)}"
          fill="${voiler(q%2 ? T.pin : clair(T.pin,.2), P.d)}"/>`);
      s += `</g>`;
    }
  });

  /* la brume de l'aube, au pied des collines */
  s += `<defs><linearGradient id="f-brume" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="${T.ciel[5]}" stop-opacity="0"/>
    <stop offset="70%" stop-color="${T.ciel[5]}" stop-opacity=".26"/>
    <stop offset="100%" stop-color="${T.ciel[5]}" stop-opacity="0"/></linearGradient></defs>`;
  s += `<rect x="0" y="${(sol(56)-22).toFixed(1)}" width="${W}" height="40"
    fill="url(#f-brume)"/>`;
  return s;
}

/* ---------- le sol de la terrasse ---------- */
function terrasse(){
  let s = `<rect x="0" y="${sol(46).toFixed(1)}" width="${W}"
    height="${(BAS-sol(46)+8).toFixed(1)}" fill="${voiler(sombre(T.roche,.16),30)}"/>`;
  /* la terre battue, en bandes de profondeur */
  let d = 46, i = 0;
  while (d > 3.2 && i < 90){
    const d2 = d/1.055, y1 = sol(d), y2 = sol(d2);
    if (y1 > BAS) break;
    if (y2-y1 > .5){
      const n = 14;
      for (let c = -n; c <= n; c++){
        const t = rnd2(i, c+40);
        const xa = pX(c*1.1, d), xb = pX((c+1)*1.05, d);
        const xa2 = pX(c*1.1, d2), xb2 = pX((c+1)*1.05, d2);
        if (xb < -40 && xb2 < -40) continue;
        if (xa > W+40 && xa2 > W+40) continue;
        s += `<path d="M${xa.toFixed(1)} ${y1.toFixed(1)} L${xb.toFixed(1)} ${y1.toFixed(1)}
          L${xb2.toFixed(1)} ${y2.toFixed(1)} L${xa2.toFixed(1)} ${y2.toFixed(1)} Z"
          fill="${t>.66?clair(T.roche,.2):t>.33?T.roche:sombre(T.roche,.14)}"
          opacity="${(.28+t*.3).toFixed(2)}"/>`;
      }
    }
    d = d2; i++;
  }
  return s;
}

/* ============================================================
   LE BÂTIMENT — quatre étapes
   ============================================================ */
function batiment(niv, M){
  const d = 20, y = sol(d), m = u => px(u, d);
  const cx = pX(-.4, d);
  const mur   = voiler(clair(T.mur, .14), d);
  const murO  = voiler(sombre(T.murO, .18), d);
  const murC  = voiler(clair(T.murC, .26), d);
  const toit  = voiler(sombre(T.toit, .12), d);
  const toitC = voiler(clair(T.toitC, .22), d);
  const bois  = voiler(sombre('#6d5238', .2), d);
  const pierre= voiler(sombre(T.rocheO, .16), d);
  const vitre = voiler(sombre('#2a3a4c', .2), d);

  const L = [3.4, 5.4, 7.6, 10.5][niv] || 3.4;
  const H = [2.4, 3.2, 4, 5][niv] || 2.4;
  const g = cx - m(L/2), dr = cx + m(L/2);

  let s = `<g class="fab">`;

  /* ---------- l'ombre longue, vers la gauche (le jour se lève à droite) ---------- */
  s += `<path d="M${g.toFixed(1)} ${y.toFixed(1)} h${m(L).toFixed(1)}
    l${(-m(L*.5)).toFixed(1)} ${m(.9).toFixed(1)} h${(-m(L)).toFixed(1)} z"
    fill="${T.ombre}" opacity=".11"/>`;

  if (niv === 0){
    /* --- trois planches et une bâche --- */
    for (let k = 0; k < 6; k++){
      const px2 = g + m(.15 + k * L * .16);
      const hh = 1.4 + rnd(k*3) * .7;
      s += `<path d="M${px2.toFixed(1)} ${y.toFixed(1)} v${(-m(hh)).toFixed(1)}"
        stroke="${k < 3 ? clair(bois,.2) : bois}"
        stroke-width="${Math.max(.8, m(.13)).toFixed(1)}" stroke-linecap="round"/>`;
    }
    /* la bâche, tendue de travers */
    s += `<path d="M${(g-m(.4)).toFixed(1)} ${(y-m(2.05)).toFixed(1)}
      Q${cx.toFixed(1)} ${(y-m(1.55)).toFixed(1)} ${(dr+m(.4)).toFixed(1)} ${(y-m(1.75)).toFixed(1)}
      L${(dr+m(.3)).toFixed(1)} ${(y-m(1.5)).toFixed(1)}
      Q${cx.toFixed(1)} ${(y-m(1.32)).toFixed(1)} ${(g-m(.3)).toFixed(1)} ${(y-m(1.82)).toFixed(1)} Z"
      fill="${voiler(sombre('#8a9070', .18), d)}"/>`;
    s += `<path d="M${(g-m(.4)).toFixed(1)} ${(y-m(2.05)).toFixed(1)}
      Q${cx.toFixed(1)} ${(y-m(1.55)).toFixed(1)} ${(dr+m(.4)).toFixed(1)} ${(y-m(1.75)).toFixed(1)}"
      stroke="${clair('#b8bc98',.3)}" stroke-width="${Math.max(.5,m(.07)).toFixed(1)}" fill="none"/>`;
    /* la bassine, posée par terre */
    s += `<ellipse cx="${(cx+m(.9)).toFixed(1)}" cy="${(y-m(.18)).toFixed(1)}"
      rx="${m(.5).toFixed(1)}" ry="${m(.18).toFixed(1)}" fill="${voiler('#8a7c68',d)}"/>`;
    s += `<ellipse cx="${(cx+m(.9)).toFixed(1)}" cy="${(y-m(.24)).toFixed(1)}"
      rx="${m(.42).toFixed(1)}" ry="${m(.14).toFixed(1)}" fill="${clair('#c4b49c',.2)}"/>`;
    return s + `</g>`;
  }

  /* ---------- le soubassement de pierre ---------- */
  s += `<path d="M${(g-m(.08)).toFixed(1)} ${y.toFixed(1)} v${(-m(.55)).toFixed(1)}
    h${m(L+.16).toFixed(1)} v${m(.55).toFixed(1)} z" fill="${pierre}"/>`;
  /* les pierres, une à une */
  for (let k = 0; k < Math.round(L*2.2); k++){
    const px2 = g + m(k * .46), t = rnd2(k, 3);
    s += `<rect x="${px2.toFixed(1)}" y="${(y-m(.5+ (k%2)*.02)).toFixed(1)}"
      width="${m(.42).toFixed(1)}" height="${m(.22).toFixed(1)}" rx="1"
      fill="${t>.5 ? clair(pierre,.14) : sombre(pierre,.1)}" opacity=".7"/>`;
  }

  /* ---------- le corps ---------- */
  s += `<path d="M${g.toFixed(1)} ${(y-m(.5)).toFixed(1)} v${(-m(H-.5)).toFixed(1)}
    h${m(L).toFixed(1)} v${m(H-.5).toFixed(1)} z" fill="${mur}"/>`;
  /* le crépi : des plaques irrégulières, comme un mur usé */
  for (let k = 0; k < Math.round(L*4); k++){
    const t = rnd2(k, 11);
    const px2 = g + m(rnd(k*5)*L), py = y - m(.6 + rnd(k*7)*(H-.9));
    s += `<ellipse cx="${px2.toFixed(1)}" cy="${py.toFixed(1)}"
      rx="${m(.3+t*.5).toFixed(1)}" ry="${m(.18+t*.26).toFixed(1)}"
      fill="${t>.5 ? murC : murO}" opacity="${(.1+t*.14).toFixed(2)}"/>`;
  }
  /* le pan de droite, dans l'ombre du matin */
  s += `<path d="M${(dr-m(L*.26)).toFixed(1)} ${(y-m(.5)).toFixed(1)} v${(-m(H-.5)).toFixed(1)}
    h${m(L*.26).toFixed(1)} v${m(H-.5).toFixed(1)} z" fill="${murO}" opacity=".24"/>`;
  /* et le bord gauche prend le premier soleil */
  s += `<path d="M${g.toFixed(1)} ${(y-m(.5)).toFixed(1)} v${(-m(H-.5)).toFixed(1)}
    h${m(.28).toFixed(1)} v${m(H-.5).toFixed(1)} z" fill="${clair(T.or,.5)}" opacity=".26"/>`;

  /* ---------- le toit ---------- */
  const th = niv >= 2 ? 1 : .7, deb = .42;
  s += `<path d="M${(g-m(deb)).toFixed(1)} ${(y-m(H)).toFixed(1)}
    h${m(L+deb*2).toFixed(1)} l${(-m(.6)).toFixed(1)} ${(-m(th)).toFixed(1)}
    h${(-m(L+deb*2-1.2)).toFixed(1)} z" fill="${toit}"/>`;
  /* la partie éclairée */
  s += `<path d="M${(g-m(deb)).toFixed(1)} ${(y-m(H)).toFixed(1)}
    h${m(L*.42).toFixed(1)} l${(-m(.25)).toFixed(1)} ${(-m(th)).toFixed(1)}
    h${(-m(L*.42-.35)).toFixed(1)} z" fill="${toitC}"/>`;
  /* les tuiles rondes */
  const nt = Math.round(L * 4.4);
  for (let k = 0; k < nt; k++){
    const x1 = g - m(deb) + m((L+deb*2) * k/nt);
    const x2 = g - m(deb) + m(.6) + m((L+deb*2-1.2) * k/nt);
    s += `<path d="M${x1.toFixed(1)} ${(y-m(H)).toFixed(1)} L${x2.toFixed(1)} ${(y-m(H+th)).toFixed(1)}"
      stroke="${sombre(toit,.24)}" stroke-width="${Math.max(.4,m(.05)).toFixed(2)}" opacity=".34"/>`;
  }
  /* le faîtage */
  s += `<path d="M${(g-m(deb)+m(.6)).toFixed(1)} ${(y-m(H+th)).toFixed(1)}
    h${m(L+deb*2-1.2).toFixed(1)}" stroke="${clair(toit,.24)}"
    stroke-width="${Math.max(.8,m(.11)).toFixed(1)}" stroke-linecap="round"/>`;
  /* la génoise sous le toit, ce double rang de tuiles typique */
  s += `<path d="M${(g-m(.14)).toFixed(1)} ${(y-m(H)).toFixed(1)}
    h${m(L+.28).toFixed(1)} v${(-m(.13)).toFixed(1)} h${(-m(L+.28)).toFixed(1)} z"
    fill="${sombre(toit,.3)}"/>`;

  /* ---------- la porte, avec son encadrement ---------- */
  const pw = niv >= 2 ? 1.15 : .85, ph = H * .58;
  s += `<path d="M${(cx-m(pw/2+.12)).toFixed(1)} ${y.toFixed(1)} v${(-m(ph+.12)).toFixed(1)}
    h${m(pw+.24).toFixed(1)} v${m(ph+.12).toFixed(1)} z" fill="${pierre}"/>`;
  s += `<path d="M${(cx-m(pw/2)).toFixed(1)} ${y.toFixed(1)} v${(-m(ph)).toFixed(1)}
    h${m(pw).toFixed(1)} v${m(ph).toFixed(1)} z" fill="${sombre(M.c, .38)}"/>`;
  /* les planches de la porte */
  for (let k = 1; k < 4; k++)
    s += `<path d="M${(cx-m(pw/2)+m(pw*k/4)).toFixed(1)} ${y.toFixed(1)} v${(-m(ph)).toFixed(1)}"
      stroke="${sombre(M.c,.52)}" stroke-width="${Math.max(.4,m(.04)).toFixed(2)}" opacity=".6"/>`;
  /* le battant gauche, éclairé */
  s += `<path d="M${(cx-m(pw/2)).toFixed(1)} ${y.toFixed(1)} v${(-m(ph)).toFixed(1)}
    h${m(pw*.16).toFixed(1)} v${m(ph).toFixed(1)} z" fill="${clair(M.c, .28)}" opacity=".7"/>`;
  /* le seuil */
  s += `<path d="M${(cx-m(pw/2+.2)).toFixed(1)} ${y.toFixed(1)}
    h${m(pw+.4).toFixed(1)} v${m(.1).toFixed(1)} h${(-m(pw+.4)).toFixed(1)} z"
    fill="${clair(pierre,.2)}"/>`;

  /* ---------- les fenêtres ---------- */
  const nf = [0, 2, 4, 6][niv] || 0;
  for (let k = 0; k < nf; k++){
    const cote = k % 2 ? 1 : -1;
    const rang = Math.floor(k / 2);
    const fx = cx + cote * m(pw/2 + .75 + rang * 1.5);
    if (fx < g + m(.3) || fx > dr - m(.3)) continue;
    const fy = y - m(H * .78);
    /* l'encadrement */
    s += `<path d="M${(fx-m(.42)).toFixed(1)} ${(fy-m(.06)).toFixed(1)}
      h${m(.84).toFixed(1)} v${m(.78).toFixed(1)} h${(-m(.84)).toFixed(1)} z"
      fill="${pierre}"/>`;
    /* la vitre */
    s += `<rect x="${(fx-m(.33)).toFixed(1)}" y="${fy.toFixed(1)}"
      width="${m(.66).toFixed(1)}" height="${m(.6).toFixed(1)}" fill="${vitre}"/>`;
    /* le reflet du ciel dedans */
    s += `<path d="M${(fx-m(.33)).toFixed(1)} ${(fy+m(.6)).toFixed(1)}
      L${(fx-m(.33)).toFixed(1)} ${(fy+m(.22)).toFixed(1)}
      L${(fx+m(.06)).toFixed(1)} ${fy.toFixed(1)} L${(fx+m(.33)).toFixed(1)} ${fy.toFixed(1)}
      L${(fx+m(.33)).toFixed(1)} ${(fy+m(.14)).toFixed(1)} Z"
      fill="${clair(T.ciel[4],.3)}" opacity=".34"/>`;
    /* la croisée */
    s += `<path d="M${fx.toFixed(1)} ${fy.toFixed(1)} v${m(.6).toFixed(1)}
      M${(fx-m(.33)).toFixed(1)} ${(fy+m(.3)).toFixed(1)} h${m(.66).toFixed(1)}"
      stroke="${bois}" stroke-width="${Math.max(.4,m(.05)).toFixed(2)}"/>`;
    /* les volets, de ta couleur, rabattus contre le mur */
    [-1, 1].forEach(sg =>
      s += `<path d="M${(fx + sg*m(.42)).toFixed(1)} ${(fy-m(.04)).toFixed(1)}
        h${(sg*m(.2)).toFixed(1)} v${m(.7).toFixed(1)} h${(-sg*m(.2)).toFixed(1)} z"
        fill="${sg < 0 ? clair(M.c,.22) : sombre(M.c,.2)}"/>`);
    /* l'appui */
    s += `<path d="M${(fx-m(.5)).toFixed(1)} ${(fy+m(.72)).toFixed(1)}
      h${m(1).toFixed(1)} v${m(.09).toFixed(1)} h${(-m(1)).toFixed(1)} z"
      fill="${clair(pierre,.24)}"/>`;
  }

  /* ---------- la cheminée ---------- */
  if (niv >= 1){
    const chx = g + m(L * .8);
    const chh = [0, .9, 1.7, 2.8][niv];
    const brique = niv >= 3 ? voiler(sombre('#9a4a34',.16), d) : murO;
    s += `<path d="M${(chx-m(.3)).toFixed(1)} ${(y-m(H+th*.5)).toFixed(1)}
      v${(-m(chh)).toFixed(1)} h${m(.6).toFixed(1)} v${m(chh).toFixed(1)} z" fill="${brique}"/>`;
    s += `<path d="M${(chx-m(.3)).toFixed(1)} ${(y-m(H+th*.5)).toFixed(1)}
      v${(-m(chh)).toFixed(1)} h${m(.16).toFixed(1)} v${m(chh).toFixed(1)} z"
      fill="${clair(brique,.24)}"/>`;
    if (niv >= 3)
      for (let k = 0; k < 8; k++)
        s += `<path d="M${(chx-m(.3)).toFixed(1)} ${(y-m(H+th*.5+k*chh/8)).toFixed(1)}
          h${m(.6).toFixed(1)}" stroke="${sombre(brique,.2)}" stroke-width=".4" opacity=".4"/>`;
    /* le chapeau */
    s += `<path d="M${(chx-m(.4)).toFixed(1)} ${(y-m(H+th*.5+chh)).toFixed(1)}
      h${m(.8).toFixed(1)} v${m(.16).toFixed(1)} h${(-m(.8)).toFixed(1)} z"
      fill="${sombre(brique,.26)}"/>`;
    /* la fumée */
    s += `<g class="fumee" opacity=".26">`;
    for (let k = 0; k < 5; k++)
      s += `<ellipse cx="${(chx+m(k*.14)).toFixed(1)}"
        cy="${(y-m(H+th*.5+chh+.45+k*.7)).toFixed(1)}"
        rx="${m(.24+k*.16).toFixed(1)}" ry="${m(.16+k*.11).toFixed(1)}" fill="#f0ece0"/>`;
    s += `</g>`;
  }

  /* ---------- l'enseigne ---------- */
  if (niv >= 1){
    const ey = y - m(H * .9);
    const ew = Math.min(m(L * .76), m(5));
    s += `<g class="enseigne">`;
    /* l'ombre portée sur le mur */
    s += `<path d="M${(cx-ew/2+m(.06)).toFixed(1)} ${(ey-m(.6)).toFixed(1)}
      h${ew.toFixed(1)} v${m(.66).toFixed(1)} h${(-ew).toFixed(1)} z"
      fill="${T.ombre}" opacity=".2"/>`;
    /* la planche */
    s += `<path d="M${(cx-ew/2).toFixed(1)} ${(ey-m(.66)).toFixed(1)}
      h${ew.toFixed(1)} v${m(.66).toFixed(1)} h${(-ew).toFixed(1)} z"
      fill="${voiler(sombre('#4a3826',.16), d)}"/>`;
    s += `<path d="M${(cx-ew/2).toFixed(1)} ${(ey-m(.66)).toFixed(1)}
      h${ew.toFixed(1)} v${m(.08).toFixed(1)} h${(-ew).toFixed(1)} z"
      fill="${clair('#8a6a48',.32)}"/>`;
    /* l'écusson peint */
    const ex = cx - ew/2 + m(.42), es = m(.42);
    s += `<rect x="${(ex-es/2).toFixed(1)}" y="${(ey-m(.54)).toFixed(1)}"
      width="${es.toFixed(1)}" height="${es.toFixed(1)}"
      rx="${(M.ecusson==='rond'?es/2:M.ecusson==='doux'?es*.3:1.5).toFixed(1)}"
      fill="${voiler(M.c, d)}"/>`;
    /* le nom */
    s += `<text x="${(ex+es*.85).toFixed(1)}" y="${(ey-m(.19)).toFixed(1)}"
      font-family="Courier Prime, monospace" font-size="${m(.36).toFixed(1)}"
      font-weight="700" fill="${clair(M.c2, .34)}"
      letter-spacing=".5">${(M.nom||'').slice(0,16).toUpperCase()}</text>`;
    s += `</g>`;
  }
  return s + `</g>`;
}

/* ============================================================
   LE MATÉRIEL — ce qu'on voit dépend de ton métier
   ============================================================ */
function materiel(metier, niv, sechoir, M){
  if (!niv) return '';
  let s = `<g class="mat">`;
  const bois = c => voiler(sombre('#7a5c3a', .2), 12);

  /* ---------- le savon : cuves, moules, blocs qui sèchent ---------- */
  if (metier === 'savon'){
    const n = Math.min(3, niv);
    for (let k = 0; k < n; k++){
      const d = 10.2 + k*1.6, X = -1.85 - k*.3, y = sol(d), m = u => px(u,d);
      const x = pX(X, d);
      const fer = voiler(sombre('#3a3a42', .18), d);
      const cuivre = voiler(sombre('#a8763a', .1), d);

      /* l'ombre au sol */
      s += `<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="${m(.75).toFixed(1)}"
        ry="${m(.18).toFixed(1)}" fill="${T.ombre}" opacity=".18"/>`;

      /* le foyer : un socle de pierres, pas un champignon */
      s += `<path d="M${(x-m(.62)).toFixed(1)} ${y.toFixed(1)} v${(-m(.55)).toFixed(1)}
        h${m(1.24).toFixed(1)} v${m(.55).toFixed(1)} z"
        fill="${voiler(sombre(T.rocheO,.14), d)}"/>`;
      for (let q = 0; q < 5; q++)
        s += `<rect x="${(x-m(.58)+m(q*.24)).toFixed(1)}" y="${(y-m(.5+(q%2)*.02)).toFixed(1)}"
          width="${m(.21).toFixed(1)}" height="${m(.2).toFixed(1)}" rx="1"
          fill="${rnd2(k,q) > .5 ? clair(T.rocheO,.16) : sombre(T.rocheO,.18)}" opacity=".6"/>`;
      /* la bouche du foyer, avec les braises */
      s += `<path d="M${(x-m(.26)).toFixed(1)} ${y.toFixed(1)} v${(-m(.3)).toFixed(1)}
        q${m(.26).toFixed(1)} ${(-m(.1)).toFixed(1)} ${m(.52).toFixed(1)} 0
        v${m(.3).toFixed(1)} z" fill="${sombre('#1a1410',.3)}"/>`;
      s += `<ellipse class="braise" cx="${x.toFixed(1)}" cy="${(y-m(.1)).toFixed(1)}"
        rx="${m(.2).toFixed(1)}" ry="${m(.07).toFixed(1)}" fill="#e06a2a" opacity=".7"/>`;
      /* les bûches qui dépassent */
      s += `<path d="M${(x-m(.34)).toFixed(1)} ${(y-m(.06)).toFixed(1)} l${(-m(.24)).toFixed(1)} ${(-m(.06)).toFixed(1)}
        M${(x-m(.3)).toFixed(1)} ${(y-m(.14)).toFixed(1)} l${(-m(.2)).toFixed(1)} ${m(.02).toFixed(1)}"
        stroke="${voiler(sombre('#6d5238',.2),d)}"
        stroke-width="${Math.max(.5,m(.07)).toFixed(1)}" stroke-linecap="round"/>`;

      /* le chaudron : un demi-cercle, posé, avec son rebord */
      s += `<path d="M${(x-m(.56)).toFixed(1)} ${(y-m(.55)).toFixed(1)}
        a${m(.56).toFixed(1)} ${m(.5).toFixed(1)} 0 0 0 ${m(1.12).toFixed(1)} 0 z"
        fill="${cuivre}"/>`;
      /* le côté éclairé */
      s += `<path d="M${(x-m(.56)).toFixed(1)} ${(y-m(.55)).toFixed(1)}
        a${m(.56).toFixed(1)} ${m(.5).toFixed(1)} 0 0 0 ${m(.4).toFixed(1)} ${m(.4).toFixed(1)}
        a${m(.4).toFixed(1)} ${m(.36).toFixed(1)} 0 0 1 ${(-m(.18)).toFixed(1)} ${(-m(.4)).toFixed(1)} z"
        fill="${clair('#e8b46a',.36)}" opacity=".85"/>`;
      /* le rebord */
      s += `<ellipse cx="${x.toFixed(1)}" cy="${(y-m(.55)).toFixed(1)}" rx="${m(.58).toFixed(1)}"
        ry="${m(.11).toFixed(1)}" fill="${clair(cuivre,.2)}"/>`;
      s += `<ellipse cx="${x.toFixed(1)}" cy="${(y-m(.56)).toFixed(1)}" rx="${m(.48).toFixed(1)}"
        ry="${m(.085).toFixed(1)}" fill="${voiler('#d8c68a', d)}"/>`;
      /* l'anse de fer */
      s += `<path d="M${(x-m(.5)).toFixed(1)} ${(y-m(.6)).toFixed(1)}
        q${m(.5).toFixed(1)} ${(-m(.46)).toFixed(1)} ${m(1).toFixed(1)} 0"
        stroke="${fer}" stroke-width="${Math.max(.5,m(.06)).toFixed(1)}" fill="none"/>`;

      /* la vapeur */
      s += `<g class="vapeur" opacity=".2">`;
      [0,1,2].forEach(q => s += `<ellipse cx="${(x+m(.06+q*.14)).toFixed(1)}"
        cy="${(y-m(.9+q*.5)).toFixed(1)}" rx="${m(.24+q*.14).toFixed(1)}"
        ry="${m(.15+q*.09).toFixed(1)}" fill="#fff"/>`);
      s += `</g>`;
    }
    /* les blocs de savon qui sèchent, empilés à droite */
    const nb = [0, 2, 4, 7][niv] || 0;
    for (let k = 0; k < nb; k++){
      const d = 10 + (k % 3) * 1.3, X = 1.9 + Math.floor(k / 3) * .85;
      const y = sol(d), m = u => px(u,d), x = pX(X, d);
      const hh = 3 + (k % 4);
      for (let e = 0; e < hh; e++)
        s += `<path d="M${(x-m(.42)).toFixed(1)} ${(y-m(e*.2)).toFixed(1)}
          v${(-m(.19)).toFixed(1)} h${m(.84).toFixed(1)} v${m(.19).toFixed(1)} z"
          fill="${voiler(e%2 ? clair('#e8d8a0',.2) : '#dcc890', d)}"/>`;
    }
  }

  /* ---------- le poisson : claies, filets, sel ---------- */
  if (metier === 'poisson'){
    const n = [1, 2, 4, 6][niv] || 1;
    for (let k = 0; k < n; k++){
      const d = 10 + (k % 3) * 1.5, X = -2.5 + (k % 2) * 5 + Math.floor(k/2)*.5;
      const y = sol(d), m = u => px(u,d), x = pX(X, d);
      s += `<path d="M${(x-m(.9)).toFixed(1)} ${y.toFixed(1)} v${(-m(1.5)).toFixed(1)}
        M${(x+m(.9)).toFixed(1)} ${y.toFixed(1)} v${(-m(1.5)).toFixed(1)}"
        stroke="${voiler(sombre('#7a5c3a',.2),d)}" stroke-width="${Math.max(.5,m(.11)).toFixed(1)}"/>`;
      [0,.5,1].forEach(u => {
        s += `<path d="M${(x-m(1)).toFixed(1)} ${(y-m(.5+u)).toFixed(1)} h${m(2).toFixed(1)}"
          stroke="${voiler(sombre('#7a5c3a',.2),d)}" stroke-width="${Math.max(.4,m(.08)).toFixed(1)}"/>`;
        for (let q = 0; q < 6; q++)
          s += `<ellipse cx="${(x-m(.82)+m(q*.33)).toFixed(1)}" cy="${(y-m(.44+u)).toFixed(1)}"
            rx="${m(.13).toFixed(2)}" ry="${m(.05).toFixed(2)}"
            fill="${voiler('#c9bda0',d)}" opacity=".9"/>`;
      });
    }
  }

  /* ---------- le cordage : la corderie, longue et basse ---------- */
  if (metier === 'cordage'){
    const n = [1, 2, 3, 4][niv] || 1;
    for (let k = 0; k < n; k++){
      const d = 11 + k * 1.8, X = 0, y = sol(d), m = u => px(u,d);
      /* les chandeliers, alignés */
      for (let q = -3; q <= 3; q++){
        const x = pX(q * 1.15, d);
        s += `<path d="M${x.toFixed(1)} ${y.toFixed(1)} v${(-m(1.1)).toFixed(1)}"
          stroke="${voiler(sombre('#7a5c3a',.2),d)}" stroke-width="${Math.max(.4,m(.09)).toFixed(1)}"/>`;
      }
      /* le fil tendu d'un bout à l'autre */
      s += `<path d="M${pX(-3.6,d).toFixed(1)} ${(y-m(1.1)).toFixed(1)}
        h${(pX(3.6,d)-pX(-3.6,d)).toFixed(1)}"
        stroke="${voiler('#c4a878',d)}" stroke-width="${Math.max(.5,m(.1)).toFixed(1)}"/>`;
    }
    /* les rouleaux de corde finis */
    const nr = [0, 2, 4, 7][niv] || 0;
    for (let k = 0; k < nr; k++){
      const d = 9.5 + (k % 3) * 1.1, X = 1.9 + Math.floor(k/3) * .8;
      const y = sol(d), m = u => px(u,d), x = pX(X, d);
      s += `<ellipse cx="${x.toFixed(1)}" cy="${(y-m(.16)).toFixed(1)}" rx="${m(.5).toFixed(1)}"
        ry="${m(.2).toFixed(1)}" fill="${voiler('#b8a078',d)}"/>`;
      s += `<ellipse cx="${x.toFixed(1)}" cy="${(y-m(.16)).toFixed(1)}" rx="${m(.24).toFixed(1)}"
        ry="${m(.1).toFixed(1)}" fill="${voiler(sombre('#8a7550',.2),d)}"/>`;
    }
  }

  /* ---------- l'huile : meule, pressoir, jarres ---------- */
  if (metier === 'huile'){
    /* la meule, à gauche */
    const d = 11, y = sol(d), m = u => px(u,d), x = pX(-2.3, d);
    s += `<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="${m(1.5).toFixed(1)}"
      ry="${m(.4).toFixed(1)}" fill="${voiler(sombre(T.roche,.22),d)}"/>`;
    s += `<ellipse cx="${x.toFixed(1)}" cy="${(y-m(.3)).toFixed(1)}" rx="${m(1.5).toFixed(1)}"
      ry="${m(.4).toFixed(1)}" fill="${voiler(T.roche,d)}"/>`;
    /* la roue de pierre, dressée */
    s += `<ellipse cx="${(x+m(.5)).toFixed(1)}" cy="${(y-m(.85)).toFixed(1)}"
      rx="${m(.18).toFixed(1)}" ry="${m(.62).toFixed(1)}" fill="${voiler(sombre(T.roche,.3),d)}"/>`;
    s += `<path d="M${x.toFixed(1)} ${(y-m(1.5)).toFixed(1)} v${m(.7).toFixed(1)}
      M${x.toFixed(1)} ${(y-m(1.2)).toFixed(1)} h${m(.5).toFixed(1)}"
      stroke="${voiler(sombre('#6d5238',.2),d)}" stroke-width="${Math.max(.5,m(.1)).toFixed(1)}"/>`;
    /* les jarres */
    const nj = [0, 3, 6, 10][niv] || 0;
    for (let k = 0; k < nj; k++){
      const dd = 9.6 + (k % 4) * .8, X = 1.8 + Math.floor(k/4) * .7;
      const yy = sol(dd), mm = u => px(u,dd), xx = pX(X, dd);
      s += `<path d="M${(xx-mm(.16)).toFixed(1)} ${yy.toFixed(1)}
        q${(-mm(.24)).toFixed(1)} ${(-mm(.4)).toFixed(1)} 0 ${(-mm(.68)).toFixed(1)}
        h${mm(.32).toFixed(1)} q${mm(.24).toFixed(1)} ${mm(.28).toFixed(1)} 0 ${mm(.68).toFixed(1)} z"
        fill="${voiler(k%3 ? '#a8794a' : '#8a6440', dd)}"/>`;
    }
  }

  /* ---------- le séchoir, commun à tous ---------- */
  if (sechoir > 0){
    const n = [0, 2, 4, 7][sechoir] || 0;
    for (let k = 0; k < n; k++){
      const d = 8 + (k % 3) * .9, X = -2.35 - Math.floor(k/3) * .75;
      const y = sol(d), m = u => px(u,d), x = pX(X, d);
      s += `<path d="M${(x-m(.7)).toFixed(1)} ${y.toFixed(1)} v${(-m(1.3)).toFixed(1)}
        M${(x+m(.7)).toFixed(1)} ${y.toFixed(1)} v${(-m(1.3)).toFixed(1)}"
        stroke="${voiler(sombre('#7a5c3a',.2),d)}" stroke-width="${Math.max(.5,m(.1)).toFixed(1)}"/>`;
      [0,.45].forEach(u =>
        s += `<path d="M${(x-m(.8)).toFixed(1)} ${(y-m(.6+u)).toFixed(1)} h${m(1.6).toFixed(1)}"
          stroke="${voiler(sombre('#7a5c3a',.2),d)}" stroke-width="${Math.max(.4,m(.08)).toFixed(1)}"/>`);
      const C = { savon:'#e8d8a0', poisson:'#c9bda0', cordage:'#b8a078', huile:'#a8c46a' }[M.metier] || '#e8d8a0';
      for (let q = 0; q < 8; q++)
        s += `<rect x="${(x-m(.7)+m((q%4)*.36)).toFixed(1)}"
          y="${(y-m(.64+(q<4?0:.45))).toFixed(1)}" width="${m(.24).toFixed(2)}"
          height="${m(.28).toFixed(2)}" rx="${m(.04).toFixed(2)}" fill="${voiler(C,d)}"/>`;
    }
  }

  /* ---------- des caisses à ta marque, devant ---------- */
  const nc = [0, 2, 3, 5][niv] || 0;
  for (let k = 0; k < nc; k++){
    const d = 6.6 + (k % 2) * .8, X = 1.7 + Math.floor(k/2) * .7;
    const y = sol(d), m = u => px(u,d), x = pX(X, d);
    s += `<path d="M${(x-m(.44)).toFixed(1)} ${y.toFixed(1)} v${(-m(.62)).toFixed(1)}
      h${m(.88).toFixed(1)} v${m(.62).toFixed(1)} z" fill="${voiler('#a5825c',d)}"/>`;
    s += `<path d="M${(x-m(.44)).toFixed(1)} ${(y-m(.62)).toFixed(1)}
      h${m(.88).toFixed(1)} v${m(.09).toFixed(1)} h${(-m(.88)).toFixed(1)} z"
      fill="${clair('#c9a374',.3)}"/>`;
    /* ta marque, tamponnée dessus */
    s += `<rect x="${(x-m(.14)).toFixed(1)}" y="${(y-m(.44)).toFixed(1)}"
      width="${m(.28).toFixed(2)}" height="${m(.28).toFixed(2)}"
      rx="${(M.ecusson==='rond'?m(.14):m(.05)).toFixed(2)}"
      fill="${voiler(M.c,d)}" opacity=".9"/>`;
  }
  return s + `</g>`;
}

/* ---------- la scène ---------- */
function fabrique(A){
  const M = { c:A.c || '#4a5460', c2:A.c2 || '#74808e', nom:A.nom || '',
              ecusson:A.ecusson || 'carre', metier:A.metier || 'savon' };
  let s = fond() + terrasse();
  s += batiment(A.atelier || 0, M);
  s += materiel(M.metier, A.atelier || 0, A.sechoir || 0, M);
  s += `<defs><radialGradient id="f-vig" cx="0.5" cy="0.44" r="0.8">
    <stop offset="48%" stop-color="${T.ombre}" stop-opacity="0"/>
    <stop offset="100%" stop-color="${T.ombre}" stop-opacity="${T.voile}"/></radialGradient></defs>`;
  s += `<rect x="0" y="${HAUT}" width="${W}" height="${(BAS-HAUT).toFixed(1)}" fill="url(#f-vig)"/>`;
  return s;
}

    + 'preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">'
    + fabrique({ metier:A.metier, atelier:A.atelier || 0, sechoir:A.sechoir || 0,
        c:c.c, c2:c.c2, nom:A.nom, ecusson:A.ecusson }) + '</svg>';
}

function entete(){
  const A = D.affaire || {};
  const c = COULEURS.find(x => x.k === A.couleur) || COULEURS[0];
  const f = (ECUSSONS.find(x => x.k === A.ecusson) || ECUSSONS[0]).r;
  const em = document.getElementById('t-em');
  em.style.background = c.c; em.style.borderRadius = f;
  em.innerHTML = signe(A.signe || 'ancre', '#fff');
  document.getElementById('t-nom').textContent = A.nom || 'Ton anse';
  document.getElementById('t-met').textContent = MET[A.metier] || '—';
  document.getElementById('t-eu').textContent =
    Number(D.euros || 0).toLocaleString('fr-FR', {minimumFractionDigits:2}) + ' €';
}

function poserProd(){
  const A = D.affaire || {}, P = A.prod || {};
  const stock = +P.stock || 0, cap = +P.capacite || 1;
  const vaut = +P.vaut || 0;
  const el = document.getElementById('prod');
  el.innerHTML = '<div class="l1">'
    + '<span class="ic"><svg viewBox="0 0 24 24">'
    + '<path d="M4 8h16v12H4zM4 8l2-4h12l2 4M9 12h6"/></svg></span>'
    + '<span class="tx"><b>' + stock.toFixed(1) + ' pièces</b>'
    + '<span>' + (+P.par_jour || 0).toFixed(1) + ' par jour, à '
    + (+P.prix_piece || 0).toFixed(1) + ' € la pièce.</span></span>'
    + '<span class="px"><em>' + vaut + ' €</em></span></div>'
    + '<div class="jauge"><i class="' + (P.plein ? 'plein' : '') + '" style="width:'
    + Math.min(100, stock / cap * 100).toFixed(1) + '%"></i></div>'
    + '<div class="sous"><span>Ta réserve</span><span>'
    + stock.toFixed(1) + ' / ' + cap + '</span></div>'
    + '<button id="ram"' + (stock < 1 ? ' disabled' : '') + '>'
    + (P.plein ? 'Ta réserve déborde — ramasser ' + vaut + ' €'
       : stock < 1 ? 'Rien à prendre pour l\'instant'
       : 'Ramasser — ' + vaut + ' €') + '</button>';
  const b = document.getElementById('ram');
  if (b && stock >= 1) b.onclick = async () => {
    b.disabled = true; b.textContent = '…';
    const r = await BD.agir('ramasser');
    if (r.ok){ D = await BD.charger(); entete(); poserProd(); poserBatis(); }
    else b.textContent = "Ça n'a pas marché";
  };
}

const ICOB = {
  atelier:'<path d="M3 21V9l9-6 9 6v12M3 21h18M9 21v-7h6v7"/>',
  sechoir:'<path d="M4 20V8M20 20V8M2 8h20M4 13h16M8 8v5M12 8v5M16 8v5"/>',
  reserve:'<path d="M4 9h16v12H4zM4 9l2-5h12l2 5M9 14h6"/>',
  ponton:'<path d="M3 12h18M6 12v8M12 12v8M18 12v8M3 8h18"/>',
  ombriere:'<path d="M3 10h18l-3-5H6zM7 10v10M17 10v10M12 10v10"/>'
};
let ongB = 'atelier';

function poserBatis(){
  const A = D.affaire || {};
  document.getElementById('ongB').innerHTML = BATIS.map(B => {
    const n = +A[B.k] || 0;
    return '<button data-o="' + B.k + '" class="' + (B.k === ongB ? 'on' : '') + '">'
      + '<svg viewBox="0 0 24 24">' + ICOB[B.k] + '</svg>'
      + '<span class="pts">' + B.N.map((_, i) =>
          '<i class="' + (i <= n ? 'on' : '') + '"></i>').join('') + '</span></button>';
  }).join('');
  document.querySelectorAll('[data-o]').forEach(b =>
    b.onclick = () => { ongB = b.dataset.o; poserBatis(); });

  const B = BATIS.find(x => x.k === ongB);
  const n = +A[B.k] || 0, act = B.N[n], suiv = B.N[n + 1];
  const sous = Number(D.euros || 0);
  const peut = suiv && sous >= suiv.prix;

  let s = '<div class="h"><b>' + B.n + '</b><span>' + B.s + '</span></div>'
    + '<div class="etat"><span class="n">Aujourd\'hui</span><b>' + act.n + '</b></div>';

  if (!suiv){
    s += '<p class="fini">Tu es allé au bout. Il n\'y a rien de plus grand.</p>';
  } else {
    s += '<div class="suite">'
      + '<div class="fl"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>'
      + '<b>' + suiv.n + '</b><span class="px">'
      + suiv.prix.toLocaleString('fr-FR') + ' €</span></div>'
      + '<p class="d">' + suiv.d + '</p>';
    const g = [];
    ['prod','stock','bonus'].forEach(k => {
      if (suiv[k] === undefined) return;
      const dd = (suiv[k] || 0) - (act[k] || 0);
      if (dd) g.push('+' + dd + ' ' +
        { prod:'de production par jour', stock:'de réserve', bonus:'au chargement' }[k]);
    });
    if (g.length) s += '<div class="gains">'
      + g.map(t => '<span>' + t + '</span>').join('') + '</div>';
    s += '<button class="go" data-b="' + B.k + '"' + (peut ? '' : ' disabled') + '>'
      + (peut ? 'Bâtir — ' + suiv.prix.toLocaleString('fr-FR') + ' €'
         : 'Il te manque ' + (suiv.prix - sous).toLocaleString('fr-FR') + ' €')
      + '</button></div>';
  }
  document.getElementById('det').innerHTML = s;

  const bt = document.querySelector('[data-b]');
  if (bt) bt.onclick = () => {
    const B2 = BATIS.find(x => x.k === bt.dataset.b);
    const S2 = B2.N[(+((D.affaire||{})[B2.k]) || 0) + 1];
    demander('Bâtir ' + S2.n.toLowerCase() + ' ?', S2.prix,
      "Une fois monté, c'est monté.", () => vraimentBatir(bt));
  };
}

async function vraimentBatir(bt){
  {
    bt.disabled = true; bt.textContent = 'On monte…';
    const r = await BD.agir('batir', { p_quoi: bt.dataset.b });
    if (r.ok){ D = await BD.charger(); decor(); entete(); poserProd(); poserBatis(); }
    else bt.textContent = r.pourquoi === 'trop_cher' ? 'Pas assez' : "Ça n'a pas marché";
  }
}

/* ---------- la confirmation ---------- */
let siOui = null;
function reglages(){
  try { return Object.assign({confirmer:true},
    JSON.parse(localStorage.getItem('bd-reglages') || '{}')); }
  catch(e){ return { confirmer:true }; }
}
function demander(titre, somme, mot, alors){
  if (!reglages().confirmer || somme < 500){ alors(); return; }
  document.getElementById('c-t').textContent = titre;
  document.getElementById('c-px').textContent = somme.toLocaleString('fr-FR') + ' €';
  document.getElementById('c-d').textContent = mot || '';
  siOui = alors;
  document.getElementById('cf').classList.add('on');
  document.getElementById('cfv').classList.add('on');
}
function fermerDemande(){
  document.getElementById('cf').classList.remove('on');
  document.getElementById('cfv').classList.remove('on');
  siOui = null;
}
document.getElementById('c-non').onclick = fermerDemande;
document.getElementById('cfv').onclick = fermerDemande;
document.getElementById('c-oui').onclick = () => { const f = siOui; fermerDemande(); if (f) f(); };

/* ---------- ton enseigne : le nom et la couleur, rien d'autre ---------- */
let MQ = null;
function poserEnseigne(){
  const el = document.getElementById('ens');
  const A = D.affaire || {};
  if (!el) return;
  if (!MQ) MQ = { nom:A.nom, couleur:A.couleur };
  const c = COULEURS.find(x => x.k === MQ.couleur) || COULEURS[0];
  const f = (ECUSSONS.find(x => x.k === A.ecusson) || ECUSSONS[0]).r;
  const change = MQ.nom !== A.nom || MQ.couleur !== A.couleur;
  const bon = (MQ.nom || '').trim().length >= 2;

  el.innerHTML = '<p class="lab">Le nom</p>'
    + '<input id="e-n" maxlength="22" value="' + (MQ.nom || '') + '">'
    + '<p class="lab b">La couleur</p><div class="gr">' + COULEURS.map(S =>
        '<button data-c="' + S.k + '" class="' + (S.k === MQ.couleur ? 'on' : '') + '">'
        + '<span class="p" style="background:' + S.c + '"></span>'
        + '<span>' + S.n + '</span></button>').join('') + '</div>'
    + '<div class="fixe"><span class="em" style="background:' + c.c
    + ';border-radius:' + f + '">' + signe(A.signe, '#fff') + '</span>'
    + '<span class="tx"><b style="color:' + c.c2 + '">' + (MQ.nom || 'Sans nom') + '</b>'
    + '<span>Ton signe et sa forme ne changent plus.</span></span></div>'
    + '<button class="go" id="e-go"' + (change && bon ? '' : ' disabled') + '>'
    + (change ? (bon ? 'Enregistrer' : 'Il faut au moins deux lettres') : 'Rien à changer')
    + '</button>';

  const i = document.getElementById('e-n');
  i.oninput = () => { MQ.nom = i.value; majEnseigne(); };
  el.querySelectorAll('[data-c]').forEach(b =>
    b.onclick = () => { MQ.couleur = b.dataset.c; poserEnseigne(); });
  document.getElementById('e-go').onclick = async () => {
    const b = document.getElementById('e-go');
    b.disabled = true; b.textContent = 'On repeint…';
    const r = await BD.agir('renommer', { p_nom:MQ.nom.trim(), p_couleur:MQ.couleur });
    if (r.ok){
      D = await BD.charger(); MQ = null;
      decor(); entete(); poserEnseigne();
    } else b.textContent = "Ça n'a pas marché";
  };
}
function majEnseigne(){
  const A = D.affaire || {}, b = document.getElementById('e-go');
  if (!b) return;
  const change = MQ.nom !== A.nom || MQ.couleur !== A.couleur;
  const bon = (MQ.nom || '').trim().length >= 2;
  b.disabled = !(change && bon);
  b.textContent = change ? (bon ? 'Enregistrer' : 'Il faut au moins deux lettres')
    : 'Rien à changer';
  /* l'aperçu suit ce qu'on tape */
  const ap = document.querySelector('.ens .fixe .tx b');
  if (ap) ap.textContent = MQ.nom || 'Sans nom';
}

document.getElementById('ret').onclick = () => location.href = 'jeu.html';

(async () => {
  try {
    D = await BD.charger();
    if (!D){ location.href = 'index.html'; return; }
  } catch(e){ return; }
  if (!D.affaire){ location.href = 'registre.html'; return; }
  if (D.parti_le || D.port !== 'anse'){ location.href = 'jeu.html'; return; }
  decor(); entete(); poserProd(); poserBatis(); poserEnseigne();
})();

let t = null;
addEventListener('resize', () => { clearTimeout(t); t = setTimeout(() => D && decor(), 200); });
</script>
</body>
</html>
