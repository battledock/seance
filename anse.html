<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#16304a">
<title>Battle Dock — Ton anse</title>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none}
html,body{height:100%;overflow:hidden;background:#0e1c2e;
  font-family:'Courier Prime',monospace;color:#fff}

#anse{position:fixed;left:0;right:0;top:0;height:46%;overflow:hidden}
#anse svg{display:block;width:100%;height:100%}
#anse::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(14,28,46,.28) 0,rgba(14,28,46,0) 34%,
    rgba(14,28,46,.7) 80%,rgba(14,28,46,.99) 100%)}

.tete{position:fixed;left:0;right:0;top:0;z-index:6;
  padding:calc(env(safe-area-inset-top) + 13px) 14px 0;
  display:flex;align-items:center;gap:10px}
.tete .ret{flex:0 0 40px;height:40px;border-radius:8px;
  border:1.5px solid rgba(255,255,255,.3);background:rgba(10,20,34,.44);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  display:flex;align-items:center;justify-content:center;cursor:pointer}
.tete .ret svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}
.tete .id{flex:1;min-width:0;display:flex;align-items:center;gap:10px;
  background:rgba(10,20,34,.44);border:1.5px solid rgba(255,255,255,.24);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-radius:8px;padding:6px 12px 6px 7px}
.tete .id .em{flex:0 0 30px;height:30px;display:flex;align-items:center;justify-content:center}
.tete .id .em svg{width:19px;height:19px}
.tete .id b{display:block;font-size:13px;font-weight:700;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.tete .id span{display:block;font-size:8px;letter-spacing:.14em;text-transform:uppercase;
  color:rgba(255,255,255,.5);margin-top:2px}
.tete .eu{flex:0 0 auto;background:rgba(10,20,34,.44);border:1.5px solid rgba(255,255,255,.24);
  border-radius:8px;padding:9px 12px;backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);font-size:12.5px;font-weight:700;color:#ffd894}

.w{position:fixed;left:0;right:0;top:41%;bottom:0;z-index:5;overflow-y:auto;
  padding:0 14px calc(env(safe-area-inset-bottom) + 18px)}
.w::-webkit-scrollbar{display:none}

.tt{font-size:7.5px;letter-spacing:.22em;text-transform:uppercase;
  color:rgba(255,255,255,.4);margin:16px 3px 10px}
.tt:first-child{margin-top:6px}

/* la production */
.prod{background:rgba(18,32,50,.82);border:1.5px solid rgba(255,255,255,.16);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-radius:11px;padding:16px;margin-bottom:4px}
.prod .l1{display:flex;align-items:flex-start;gap:13px}
.prod .l1 .ic{flex:0 0 42px;height:42px;border-radius:10px;
  background:rgba(240,196,106,.16);display:flex;align-items:center;justify-content:center}
.prod .l1 .ic svg{width:21px;height:21px;stroke:#f0c46a;fill:none;stroke-width:1.7;
  stroke-linejoin:round}
.prod .l1 .tx{flex:1;min-width:0}
.prod .l1 .tx b{display:block;font-size:15px;color:#fff;font-weight:700}
.prod .l1 .tx span{display:block;font-size:11px;color:rgba(255,255,255,.52);margin-top:4px;
  font-family:system-ui,sans-serif;line-height:1.5}
.prod .l1 .px{flex:0 0 auto;text-align:right}
.prod .l1 .px em{display:block;font-style:normal;font-size:20px;font-weight:700;color:#ffd894}
.prod .jauge{height:6px;background:rgba(255,255,255,.13);border-radius:4px;overflow:hidden;
  margin-top:14px}
.prod .jauge i{display:block;height:100%;border-radius:4px;
  background:linear-gradient(90deg,#b8934a,#ffd894);transition:width .7s}
.prod .jauge i.plein{background:linear-gradient(90deg,#b8483a,#e08a6a)}
.prod .sous{display:flex;justify-content:space-between;margin-top:8px;font-size:10px;
  color:rgba(255,255,255,.44);font-family:system-ui,sans-serif}
.prod button{width:100%;margin-top:14px;padding:14px;border:0;border-radius:9px;cursor:pointer;
  background:linear-gradient(180deg,#f6cd76,#dca94a);color:#1c1a16;
  font-family:'Courier Prime',monospace;font-size:13.5px;font-weight:700;letter-spacing:.06em;
  transition:transform .12s}
.prod button:active{transform:scale(.986)}
.prod button:disabled{background:rgba(255,255,255,.08);color:rgba(255,255,255,.36);
  cursor:default}

/* les constructions */
.bat{background:rgba(18,32,50,.72);border:1.5px solid rgba(255,255,255,.13);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-radius:11px;padding:15px;margin-bottom:9px}
.bat .l1{display:flex;align-items:center;gap:10px}
.bat .l1 b{flex:1;font-size:15px;color:#fff;font-weight:700}
.bat .l1 .px{flex:0 0 auto;font-size:13.5px;font-weight:700;color:#ffd894}
.bat .l1 .px.fait{color:#8ce0a8;font-size:11px}
.bat .a{display:block;font-size:11.5px;color:rgba(255,255,255,.56);margin-top:6px;
  font-family:system-ui,sans-serif;line-height:1.5}
.bat .niv{display:flex;gap:4px;margin-top:11px}
.bat .niv i{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.12)}
.bat .niv i.on{background:#f0c46a}
.bat .n{display:block;font-size:11px;color:rgba(255,255,255,.42);margin-top:10px;
  font-family:system-ui,sans-serif;font-style:italic;line-height:1.5}
.bat .ef{display:inline-block;font-size:10px;margin-top:9px;padding:4px 10px;
  border-radius:12px;background:rgba(140,224,168,.14);color:#8ce0a8}
.bat button{width:100%;margin-top:12px;padding:12px;border:1.5px solid rgba(240,196,106,.5);
  border-radius:8px;cursor:pointer;background:rgba(52,44,26,.5);color:#f0c46a;
  font-family:'Courier Prime',monospace;font-size:12.5px;font-weight:700;letter-spacing:.05em}
.bat button:disabled{border-color:rgba(255,255,255,.12);background:rgba(255,255,255,.05);
  color:rgba(255,255,255,.36);cursor:default}
.mot{font-size:10.5px;color:rgba(255,255,255,.38);line-height:1.65;text-align:center;
  margin:16px 6px 4px;font-family:system-ui,sans-serif}

.onde{will-change:transform}
.o0{animation:v0 30s linear infinite}.o1{animation:v1 40s linear infinite}
.o2{animation:v0 52s linear infinite}.o3{animation:v1 64s linear infinite}
@keyframes v0{to{transform:translateX(50px)}}
@keyframes v1{to{transform:translateX(-50px)}}
.pin{animation:brise 15s ease-in-out infinite;transform-origin:50% 100%}
@keyframes brise{0%,100%{transform:rotate(-.4deg)}50%{transform:rotate(.4deg)}}
.barque{animation:tangue 9s ease-in-out infinite;transform-box:fill-box;
  transform-origin:50% 90%}
@keyframes tangue{0%,100%{transform:rotate(-.8deg)}50%{transform:rotate(.8deg)}}
.fumee{animation:monte 9s ease-in-out infinite}
@keyframes monte{0%{opacity:.28;transform:translate(0,0) scale(1)}
  100%{opacity:0;transform:translate(4px,-14px) scale(1.9)}}
.lampe{animation:veilleuse 6s ease-in-out infinite}
@keyframes veilleuse{0%,100%{opacity:.84}48%{opacity:1}}
.etoile{animation:scint 4.4s ease-in-out infinite}
@keyframes scint{0%,100%{opacity:.2}50%{opacity:.7}}
@media (prefers-reduced-motion:reduce){*{animation:none !important}}
</style>
</head>
<body>

<div id="anse"></div>

<div class="tete">
  <button class="ret" id="ret"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
  <span class="id"><span class="em" id="t-em"></span>
    <span><b id="t-nom">—</b><span id="t-met">—</span></span></span>
  <span class="eu" id="t-eu">—</span>
</div>

<div class="w">
  <p class="tt">Ce qui a séché</p>
  <div class="prod" id="prod"></div>
  <p class="tt">Ce que tu peux bâtir</p>
  <div id="batis"></div>
  <p class="mot">Ton anse produit même quand tu es en mer.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="bd.js"></script>
<script>
/* ============================================================
   TON ANSE — une calanque des Goudes, vue depuis l'eau
   ============================================================ */

const W = 480;
const FOCALE = 727;
const OEIL = 1.4;              /* on est dans la barque, assis bas */
const HORIZON = 236;

const px  = (m, d) => m * FOCALE / d;
const sol = d => HORIZON + OEIL * FOCALE / d;
const projX = (X, d) => 240 + X * FOCALE / d;
const rnd = s => { const x = Math.sin(s * 127.1) * 43758.5; return x - Math.floor(x); };
const rnd2 = (a, b) => { const x = Math.sin(a * 127.1 + b * 311.7) * 43758.5; return x - Math.floor(x); };

function hx(c){ return [parseInt(c.slice(1,3),16), parseInt(c.slice(3,5),16), parseInt(c.slice(5,7),16)]; }
function ch(a){ return '#' + a.map(v => Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join(''); }
function mel(a, b, k){ const A = hx(a), B = hx(b); return ch([0,1,2].map(i => A[i] + (B[i]-A[i]) * k)); }

/* ---------- le temps qu'il fait ---------- */
const TEMPS = {
  matin: {
    nom: 'Au petit matin',
    ciel: ['#2a5a8c','#4d84b0','#82aecb','#b8cfd8','#e0d0b4','#f4dcb0'],
    eau:  ['#c4b090','#8fa8ac','#4a8296','#2e6b82','#215a70','#194c60'],
    roche:'#d8c8a8', rocheO:'#9a8a72', pin:'#4a6b52',
    soleil:{ x:196, y:150, r:13 }, or:'#ffd8a0', ombre:'#2a3a54', voile:.2 },
  midi: {
    nom: 'En plein midi',
    ciel: ['#1f6ea8','#3d8ec2','#6aa8cf','#9ec6da','#c4dae4','#e2eef0'],
    eau:  ['#b8dce0','#7fc8d4','#3fa0bc','#2b83a4','#1f6c8e','#175a7c'],
    roche:'#f0e4c8', rocheO:'#b8a888', pin:'#3f6b48',
    soleil:{ x:250, y:36, r:15 }, or:'#fff0c8', ombre:'#1c3a56', voile:.08 },
  mistral: {
    nom: 'Le mistral se lève',
    ciel: ['#1a5a92','#3878ac','#6098c0','#8fb8d0','#b4cdd8','#d0dde0'],
    eau:  ['#a8c8cc','#6faabc','#3a7f9c','#2a6784','#1e5570','#164560'],
    roche:'#e4d8bc', rocheO:'#a89880', pin:'#44684c',
    soleil:{ x:300, y:74, r:14 }, or:'#ffe8bc', ombre:'#20364e', voile:.1 },
  soir: {
    nom: 'À la tombée du jour',
    ciel: ['#14284a','#28466c','#4a6484','#7a7a86','#c08a6c','#e8a870'],
    eau:  ['#c08058','#7a6a62','#3f5468','#2a3f52','#1f3044','#17253a'],
    roche:'#c4a884', rocheO:'#7a6a58', pin:'#33503c',
    soleil:{ x:120, y:212, r:16 }, or:'#ffb870', ombre:'#141e30', voile:.24 },
  nuit: {
    nom: 'La nuit est tombée',
    ciel: ['#080f22','#0e1a34','#182a48','#26405e','#3a5470','#4e6480'],
    eau:  ['#3a4a5e','#2a3a4e','#1e2c40','#182438','#121c2e','#0e1626'],
    roche:'#6a6270', rocheO:'#3a3848', pin:'#1f3038',
    soleil:{ x:330, y:60, r:9 }, or:'#a8c0e0', ombre:'#060a14', voile:.34 }
};
let T = TEMPS.matin;
/* on choisit le temps qu'il fait */
function regler(t){ T = TEMPS[t] || TEMPS.matin; return T; }

const clair  = (c, k) => mel(c, T.or, k === undefined ? .3 : k);
const sombre = (c, k) => mel(c, T.ombre, k === undefined ? .3 : k);
const voiler = (c, d) => mel(c, mel(T.ciel[4], T.or, .3), Math.min(.62, Math.pow(d / 260, .8)));

let HAUT = -120, BAS = 900;
function cadrer(l, h){
  const total = W * h / l;
  HAUT = HORIZON - total * .56;
  BAS  = HAUT + total;
  return { y: HAUT, h: total };
}

/* ---------- le ciel et la mer ---------- */
function ciel(){
  let s = `<defs>
    <linearGradient id="a-ciel" x1="0" y1="0" x2="0" y2="1">`
    + T.ciel.map((c,i) => `<stop offset="${[0,22,44,64,84,100][i]}%" stop-color="${c}"/>`).join('')
    + `</linearGradient>
    <linearGradient id="a-eau" x1="0" y1="0" x2="0" y2="1">`
    + T.eau.map((c,i) => `<stop offset="${[0,6,20,44,72,100][i]}%" stop-color="${c}"/>`).join('')
    + `</linearGradient>
    <radialGradient id="a-halo" cx="0.5" cy="0.5">
      <stop offset="0%" stop-color="${T.or}" stop-opacity=".5"/>
      <stop offset="45%" stop-color="${T.or}" stop-opacity=".16"/>
      <stop offset="100%" stop-color="${T.or}" stop-opacity="0"/></radialGradient>
  </defs>`;
  s += `<rect x="0" y="${HAUT}" width="${W}" height="${(sol(600)-HAUT).toFixed(1)}"
    fill="url(#a-ciel)"/>`;
  /* le soleil et son halo */
  s += `<ellipse cx="${T.soleil.x}" cy="${T.soleil.y}" rx="190" ry="140" fill="url(#a-halo)"/>`;
  s += `<circle cx="${T.soleil.x}" cy="${T.soleil.y}" r="${T.soleil.r}"
    fill="${mel('#fffdf4', T.or, .3)}" opacity="${T === TEMPS.nuit ? .9 : 1}"/>`;
  /* les étoiles, la nuit */
  if (T === TEMPS.nuit)
    for (let i = 0; i < 34; i++)
      s += `<circle class="etoile e${i%4}" cx="${(rnd(i*19+2)*W).toFixed(0)}"
        cy="${(HAUT + rnd(i*13+7) * (HORIZON-HAUT) * .9).toFixed(0)}"
        r="${(.5+rnd(i*23+2)*.8).toFixed(2)}" fill="#fff" opacity=".6"/>`;
  return s;
}

/* ---------- les falaises qui referment l'anse ---------- */
/* Deux parois de calcaire, l'une à gauche l'autre à droite, qui
   se rapprochent en s'éloignant : c'est ça, une calanque. */
function falaise(cote, g){
  const P = [[92, 11], [72, 12.5], [56, 11], [43, 13.5], [33, 11.5], [25, 15],
             [18.5, 12.5], [13.6, 17], [10, 14], [7.2, 20], [5, 16], [3.4, 24]];
  let d = '';
  /* la ligne de crête, du fond vers nous */
  P.forEach(([dd, X], i) => {
    const h = 13 + Math.sin(i * 1.7 + g) * 6 + Math.sin(i * .6) * 4.5;
    const x = projX(cote * X, dd), y = sol(dd) - px(h, dd);
    d += (i ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1) + ' ';
  });
  /* puis la ligne d'eau, de nous vers le fond */
  for (let i = P.length - 1; i >= 0; i--){
    const [dd, X] = P[i];
    d += 'L' + projX(cote * X, dd).toFixed(1) + ' ' + sol(dd).toFixed(1) + ' ';
  }
  d += 'Z';

  let s = `<g>`;
  s += `<path d="${d}" fill="${cote < 0 ? clair(T.roche, .18) : sombre(T.roche, .3)}"/>`;
  s += `<defs><clipPath id="a-f${g}"><path d="${d}"/></clipPath></defs>`;
  s += `<g clip-path="url(#a-f${g})">`;
  /* les strates du calcaire, presque horizontales */
  s += `<g stroke="${sombre(T.rocheO, .12)}" stroke-width=".9" fill="none" opacity=".3">`;
  for (let k = 0; k < 12; k++){
    let p = '';
    P.forEach(([dd, X], i) => {
      const y = sol(dd) - px(1.2 + k * 1.9, dd);
      p += (i ? 'L' : 'M') + projX(cote * X, dd).toFixed(1) + ' ' + y.toFixed(1) + ' ';
    });
    s += `<path d="${p}"/>`;
  }
  s += `</g>`;
  /* les creux et les vires */
  for (let k = 0; k < 22; k++){
    const dd = 4 + rnd(g * 7 + k) * 80;
    const X = cote * (10 + rnd(g * 11 + k) * 10);
    const h = rnd(g * 3 + k) * 17;
    s += `<ellipse cx="${projX(X, dd).toFixed(1)}" cy="${(sol(dd) - px(h, dd)).toFixed(1)}"
      rx="${px(1.6 + rnd(k) * 2.4, dd).toFixed(1)}" ry="${px(.9 + rnd(k+3) * 1.4, dd).toFixed(1)}"
      fill="${sombre(T.rocheO, .2)}" opacity="${(.1 + rnd(k+5) * .2).toFixed(2)}"/>`;
  }
  /* la ligne d'eau, plus sombre : la roche est mouillée */
  P.forEach(([dd, X], i) => {
    if (i >= P.length - 1) return;
    const [d2, X2] = P[i + 1];
    s += `<path d="M${projX(cote*X, dd).toFixed(1)} ${(sol(dd) - px(.7, dd)).toFixed(1)}
      L${projX(cote*X2, d2).toFixed(1)} ${(sol(d2) - px(.7, d2)).toFixed(1)}
      L${projX(cote*X2, d2).toFixed(1)} ${sol(d2).toFixed(1)}
      L${projX(cote*X, dd).toFixed(1)} ${sol(dd).toFixed(1)} Z"
      fill="${sombre(T.rocheO, .42)}" opacity=".55"/>`;
  });
  s += `</g>`;

  /* les pins d'Alep, accrochés en haut */
  for (let k = 0; k < 16; k++){
    const dd = 6 + rnd(g * 5 + k + 40) * 86;
    const X = cote * (9.6 + rnd(g * 13 + k) * 9);
    const h = 14 + Math.sin(k * 1.7 + g) * 5 + rnd(k) * 5;
    const x = projX(X, dd), y = sol(dd) - px(h, dd), t = px(2.6, dd);
    if (t < .8) continue;
    s += `<g class="pin">`;
    s += `<path d="M${x.toFixed(1)} ${y.toFixed(1)} l${(t*.06).toFixed(1)} ${(-t*.5).toFixed(1)}"
      stroke="${sombre('#5a4a38', .3)}" stroke-width="${Math.max(.4, t*.09).toFixed(2)}"/>`;
    /* le parasol du pin d'Alep : plat et irrégulier */
    [[0,-.6,1],[-.5,-.5,.66],[.5,-.52,.7],[-.24,-.72,.5],[.28,-.7,.46]].forEach(([dx,dy,r],q)=>
      s += `<ellipse cx="${(x + dx*t*.8).toFixed(1)}" cy="${(y + dy*t).toFixed(1)}"
        rx="${(t*.62*r).toFixed(1)}" ry="${(t*.3*r).toFixed(1)}"
        fill="${q%2 ? voiler(T.pin, dd) : voiler(clair(T.pin,.24), dd)}"/>`);
    s += `</g>`;
  }
  return s + `</g>`;
}

/* ---------- le fond de l'anse : la plage de galets ---------- */
function fond(){
  const d = 24, y = sol(d);
  let s = '';
  /* la bande de galets entre les deux falaises */
  s += `<path d="M${projX(-11, d).toFixed(1)} ${y.toFixed(1)}
    Q${projX(-5, d*1.14).toFixed(1)} ${(sol(d*1.14) - px(.6, d)).toFixed(1)}
     ${projX(0, d*1.2).toFixed(1)} ${(sol(d*1.2) - px(.5, d)).toFixed(1)}
    Q${projX(5, d*1.14).toFixed(1)} ${(sol(d*1.14) - px(.6, d)).toFixed(1)}
     ${projX(11, d).toFixed(1)} ${y.toFixed(1)} Z"
    fill="${voiler(clair(T.roche, .2), d)}"/>`;
  /* les galets */
  for (let k = 0; k < 90; k++){
    const dd = d * (1 + rnd(k*3) * .2);
    const X = (rnd(k*7+1) - .5) * 21;
    const x = projX(X, dd), yy = sol(dd) - px(rnd(k*5)*.5, dd);
    s += `<ellipse cx="${x.toFixed(1)}" cy="${yy.toFixed(1)}" rx="${px(.28,dd).toFixed(2)}"
      ry="${px(.14,dd).toFixed(2)}" fill="${rnd(k) > .5 ? voiler(T.roche, dd) : voiler(T.rocheO, dd)}"
      opacity="${(.3+rnd(k+2)*.4).toFixed(2)}"/>`;
  }
  /* la garrigue derrière, qui monte */
  for (let k = 0; k < 40; k++){
    const dd = d * (1.18 + rnd(k*11) * .3);
    const X = (rnd(k*13+3) - .5) * 23;
    const h = 1 + rnd(k*3+7) * 2.2;
    s += `<ellipse cx="${projX(X, dd).toFixed(1)}" cy="${(sol(dd) - px(h*.5, dd)).toFixed(1)}"
      rx="${px(.9 + rnd(k)*.8, dd).toFixed(1)}" ry="${px(h*.5, dd).toFixed(1)}"
      fill="${voiler(rnd(k+1) > .4 ? T.pin : mel(T.pin,'#8a9a5c',.5), dd)}"
      opacity="${(.5+rnd(k+4)*.4).toFixed(2)}"/>`;
  }
  return s;
}

/* ---------- l'eau ---------- */
function eau(){
  const yh = sol(600);
  let s = `<rect x="0" y="${yh.toFixed(1)}" width="${W}"
    height="${(BAS - yh + 6).toFixed(1)}" fill="url(#a-eau)"/>`;
  /* le fond clair de la calanque, ce turquoise qu'on ne voit qu'ici */
  s += `<path d="M${projX(-11, 24).toFixed(1)} ${sol(24).toFixed(1)}
    Q${projX(0, 15).toFixed(1)} ${(sol(15)+px(.5,15)).toFixed(1)}
     ${projX(11, 24).toFixed(1)} ${sol(24).toFixed(1)} Z"
    fill="${mel(T.eau[1], '#8fe0d8', .34)}" opacity=".4"/>`;
  /* le chemin du soleil */
  const bas = 1 - Math.min(1, Math.abs(T.soleil.y - HORIZON) / 190);
  if (bas > .05){
    s += `<defs><linearGradient id="a-ch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${mel('#fff2d0', T.or, .3)}" stop-opacity=".8"/>
      <stop offset="100%" stop-color="${T.or}" stop-opacity="0"/></linearGradient>
      <filter id="a-flou"><feGaussianBlur stdDeviation="6"/></filter></defs>`;
    s += `<path d="M${(T.soleil.x-12)} ${yh.toFixed(1)} L${(T.soleil.x+12)} ${yh.toFixed(1)}
      L${(T.soleil.x+110)} ${(BAS+16).toFixed(1)} L${(T.soleil.x-110)} ${(BAS+16).toFixed(1)} Z"
      fill="url(#a-ch)" filter="url(#a-flou)" opacity="${bas.toFixed(2)}"/>`;
  }
  /* la houle */
  for (let n = 0; n < 9; n++){
    const d = 400 / Math.pow(n + 1, 1.3);
    const y = sol(d), amp = px(.22, d), esp = px(6, d);
    if (y > BAS - 2 || y < yh) continue;
    s += `<g class="onde o${n%4}">`;
    let p = 'M-140 ' + y.toFixed(1) + ' ';
    for (let k = 0; k < 22; k++) p += `q${(esp*.5).toFixed(1)} ${(-amp).toFixed(1)} ${esp.toFixed(1)} 0 `;
    s += `<path d="${p}" stroke="${clair('#ffffff', .2)}" stroke-width="${Math.max(.4, amp*.34).toFixed(2)}"
      fill="none" opacity="${(.16 - n*.014).toFixed(3)}"/>`;
    s += `</g>`;
  }
  return s;
}

/* ============================================================
   CE QUE TU BÂTIS — chaque chose apparaît quand tu l'as construite
   ============================================================ */

/* le cabanon, contre la falaise de gauche */
function cabanon(niveau){
  if (!niveau) return '';
  const d = 21, X = -6.4;
  const x = projX(X, d), y = sol(d);
  const m = u => px(u, d);
  const mur  = voiler(clair('#e8d8b8', .2), d);
  const murO = voiler(sombre('#c4b494', .24), d);
  const toit = voiler(sombre('#a85c3a', .16), d);
  const toitC= voiler(clair('#c9764a', .26), d);
  const bois = voiler(sombre('#7a5c3a', .2), d);

  let s = `<g class="cabanon">`;
  /* le socle de pierre sèche */
  s += `<path d="M${(x-m(2.4)).toFixed(1)} ${y.toFixed(1)} h${m(4.8).toFixed(1)}
    v${(-m(.5)).toFixed(1)} h${(-m(4.8)).toFixed(1)} z" fill="${voiler(T.rocheO, d)}"/>`;
  /* le corps */
  const h = niveau >= 2 ? 2.6 : 2.1;
  s += `<path d="M${(x-m(2.2)).toFixed(1)} ${(y-m(.5)).toFixed(1)}
    h${m(4.4).toFixed(1)} v${(-m(h)).toFixed(1)} h${(-m(4.4)).toFixed(1)} z" fill="${mur}"/>`;
  s += `<path d="M${(x+m(.9)).toFixed(1)} ${(y-m(.5)).toFixed(1)}
    h${m(1.3).toFixed(1)} v${(-m(h)).toFixed(1)} h${(-m(1.3)).toFixed(1)} z" fill="${murO}"/>`;
  /* le toit à une pente, en tuiles */
  s += `<path d="M${(x-m(2.5)).toFixed(1)} ${(y-m(.5+h)).toFixed(1)}
    h${m(5).toFixed(1)} l${(-m(.5)).toFixed(1)} ${(-m(.8)).toFixed(1)}
    h${(-m(4)).toFixed(1)} z" fill="${toit}"/>`;
  s += `<path d="M${(x-m(2.5)).toFixed(1)} ${(y-m(.5+h)).toFixed(1)}
    h${m(1.6).toFixed(1)} l${(-m(.2)).toFixed(1)} ${(-m(.8)).toFixed(1)}
    h${(-m(1.2)).toFixed(1)} z" fill="${toitC}"/>`;
  /* la porte, toujours bleue */
  s += `<path d="M${(x-m(.4)).toFixed(1)} ${(y-m(.5)).toFixed(1)}
    v${(-m(1.3)).toFixed(1)} h${m(.8).toFixed(1)} v${m(1.3).toFixed(1)} z"
    fill="${voiler(sombre('#2f6a92', .2), d)}"/>`;
  /* une fenêtre, dès le second niveau */
  if (niveau >= 2){
    s += `<rect x="${(x-m(1.7)).toFixed(1)}" y="${(y-m(1.9)).toFixed(1)}"
      width="${m(.7).toFixed(1)}" height="${m(.6).toFixed(1)}"
      fill="${T === TEMPS.nuit || T === TEMPS.soir ? '#ffcf82' : voiler(sombre('#2a3a4a',.2), d)}"/>`;
    s += `<path d="M${(x-m(1.75)).toFixed(1)} ${(y-m(1.95)).toFixed(1)} h${m(.8).toFixed(1)}"
      stroke="${bois}" stroke-width="${Math.max(.4, m(.08)).toFixed(2)}"/>`;
  }
  /* la treille et la terrasse, au troisième */
  if (niveau >= 3){
    s += `<g class="treille">`;
    [0,1,2].forEach(k =>
      s += `<path d="M${(x+m(2.2+k*1.1)).toFixed(1)} ${y.toFixed(1)} v${(-m(2.2)).toFixed(1)}"
        stroke="${bois}" stroke-width="${Math.max(.4, m(.1)).toFixed(2)}"/>`);
    s += `<path d="M${(x+m(2.2)).toFixed(1)} ${(y-m(2.2)).toFixed(1)} h${m(2.2).toFixed(1)}"
      stroke="${bois}" stroke-width="${Math.max(.4, m(.09)).toFixed(2)}"/>`;
    for (let k = 0; k < 9; k++)
      s += `<ellipse cx="${(x+m(2.2+rnd(k)*2.2)).toFixed(1)}"
        cy="${(y-m(2.1+rnd(k+3)*.3)).toFixed(1)}" rx="${m(.42).toFixed(1)}" ry="${m(.26).toFixed(1)}"
        fill="${voiler(mel(T.pin,'#8aa858',.5), d)}"/>`;
    s += `</g>`;
  }
  /* la fumée, quand il fait frais */
  if (niveau >= 2 && (T === TEMPS.nuit || T === TEMPS.soir || T === TEMPS.mistral)){
    s += `<g class="fumee" opacity=".26">`;
    [0,1,2,3].forEach(k =>
      s += `<ellipse cx="${(x-m(1.9-k*.14)).toFixed(1)}" cy="${(y-m(3.6+k*.7)).toFixed(1)}"
        rx="${m(.3+k*.14).toFixed(1)}" ry="${m(.2+k*.1).toFixed(1)}" fill="#e8e0d4"/>`);
    s += `</g>`;
  }
  return s + `</g>`;
}

/* le ponton, qui avance dans l'eau */
function ponton(niveau){
  if (!niveau) return '';
  const dA = 18.5, dB = 11.5, X = -3.6;
  const bois = voiler(sombre('#8a6a44', .2), dB);
  const boisC= voiler(clair('#c9a374', .3), dB);
  let s = `<g class="ponton">`;
  /* les pilotis */
  const n = niveau >= 2 ? 6 : 4;
  for (let k = 0; k < n; k++){
    const d = dA - (dA - dB) * k / (n - 1);
    const x = projX(X + k * .5, d), y = sol(d);
    s += `<path d="M${x.toFixed(1)} ${(y+px(.5,d)).toFixed(1)} v${(-px(1.3,d)).toFixed(1)}"
      stroke="${bois}" stroke-width="${Math.max(.6, px(.18,d)).toFixed(1)}"/>`;
  }
  /* le tablier */
  const xa = projX(X, dA), ya = sol(dA) - px(1.1, dA);
  const xb = projX(X + (n-1)*.5, dB), yb = sol(dB) - px(1.1, dB);
  s += `<path d="M${xa.toFixed(1)} ${ya.toFixed(1)} L${xb.toFixed(1)} ${yb.toFixed(1)}
    L${xb.toFixed(1)} ${(yb+px(.24,dB)).toFixed(1)} L${xa.toFixed(1)} ${(ya+px(.24,dA)).toFixed(1)} Z"
    fill="${bois}"/>`;
  s += `<path d="M${xa.toFixed(1)} ${ya.toFixed(1)} L${xb.toFixed(1)} ${yb.toFixed(1)}"
    stroke="${boisC}" stroke-width="${Math.max(.5, px(.1,dB)).toFixed(1)}"/>`;
  /* une lanterne au bout, au second niveau — allumée seulement le soir */
  if (niveau >= 2){
    const nuit = (T === TEMPS.nuit || T === TEMPS.soir);
    s += `<path d="M${xb.toFixed(1)} ${yb.toFixed(1)} v${(-px(1.4,dB)).toFixed(1)}"
      stroke="${bois}" stroke-width="${Math.max(.5, px(.1,dB)).toFixed(1)}"/>`;
    /* la lanterne elle-même, éteinte ou allumée */
    s += `<path d="M${(xb-px(.18,dB)).toFixed(1)} ${(yb-px(1.34,dB)).toFixed(1)}
      h${px(.36,dB).toFixed(1)} v${px(.34,dB).toFixed(1)} h${(-px(.36,dB)).toFixed(1)} z"
      fill="${voiler(sombre('#3a3f4a',.2), dB)}"/>`;
    s += `<rect x="${(xb-px(.12,dB)).toFixed(1)}" y="${(yb-px(1.3,dB)).toFixed(1)}"
      width="${px(.24,dB).toFixed(1)}" height="${px(.26,dB).toFixed(1)}"
      fill="${nuit ? '#ffe0a8' : voiler('#8a94a0', dB)}"/>`;
    if (nuit){
      /* le halo, en pixels : il ne doit pas grossir avec la proximité */
      s += `<circle class="lampe" cx="${xb.toFixed(1)}" cy="${(yb-px(1.18,dB)).toFixed(1)}"
        r="9" fill="#ffe4b0" opacity=".3"/>`;
      s += `<circle class="lampe" cx="${xb.toFixed(1)}" cy="${(yb-px(1.18,dB)).toFixed(1)}"
        r="20" fill="#ffcf82" opacity=".1"/>`;
      /* le reflet sur l'eau, juste en dessous */
      s += `<ellipse class="lampe" cx="${xb.toFixed(1)}" cy="${(sol(dB)+8).toFixed(1)}"
        rx="4" ry="22" fill="#ffcf82" opacity=".13"/>`;
    }
  }
  return s + `</g>`;
}

/* le séchoir : des claies où sèche ce que tu produis */
function sechoir(niveau, produit){
  if (!niveau) return '';
  const d = 19, X = 5.2;
  const x = projX(X, d), y = sol(d), m = u => px(u, d);
  const bois = voiler(sombre('#8a6a44', .22), d);
  let s = `<g class="sechoir">`;
  const n = niveau >= 3 ? 4 : niveau >= 2 ? 3 : 2;
  for (let k = 0; k < n; k++){
    const cx = x + m(k * 1.5);
    /* les montants */
    s += `<path d="M${(cx-m(.6)).toFixed(1)} ${y.toFixed(1)} v${(-m(1.7)).toFixed(1)}
      M${(cx+m(.6)).toFixed(1)} ${y.toFixed(1)} v${(-m(1.7)).toFixed(1)}"
      stroke="${bois}" stroke-width="${Math.max(.4, m(.11)).toFixed(2)}"/>`;
    /* les claies */
    [0, .55, 1.1].forEach(u =>
      s += `<path d="M${(cx-m(.7)).toFixed(1)} ${(y-m(.6+u)).toFixed(1)} h${m(1.4).toFixed(1)}"
        stroke="${bois}" stroke-width="${Math.max(.4, m(.09)).toFixed(2)}"/>`);
    /* ce qui sèche dessus, selon ton métier */
    const C = { poisson:'#c9bda0', savon:'#e8d888', huile:'#a8c46a',
                cordage:'#b8a078', tuiles:'#c26a44', pastis:'#d8c86a' }[produit] || '#c9bda0';
    for (let q = 0; q < 5; q++){
      const u = [0, .55, 1.1][q % 3];
      s += `<rect x="${(cx - m(.6) + m(q * .26)).toFixed(1)}" y="${(y - m(.62+u)).toFixed(1)}"
        width="${m(.2).toFixed(2)}" height="${m(.34).toFixed(2)}" rx="${m(.05).toFixed(2)}"
        fill="${voiler(C, d)}" opacity=".9"/>`;
    }
  }
  return s + `</g>`;
}

/* ta barque, au mouillage */
function barqueAuMouillage(){
  const d = 12, X = -1.4;
  const x = projX(X, d), y = sol(d), m = u => px(u, d);
  const coque = voiler(sombre('#a87c4c', .2), d);
  const coqueC= voiler(clair('#e0b878', .3), d);
  let s = `<g class="barque">`;
  s += `<ellipse cx="${x.toFixed(1)}" cy="${(y+m(.1)).toFixed(1)}" rx="${m(1.9).toFixed(1)}"
    ry="${m(.2).toFixed(1)}" fill="${T.ombre}" opacity=".22"/>`;
  s += `<path d="M${(x-m(1.8)).toFixed(1)} ${(y-m(.5)).toFixed(1)}
    q${m(.3).toFixed(1)} ${m(.6).toFixed(1)} ${m(1.5).toFixed(1)} ${m(.6).toFixed(1)}
    h${m(.6).toFixed(1)} q${m(1.2).toFixed(1)} 0 ${m(1.5).toFixed(1)} ${(-m(.6)).toFixed(1)}
    q${(-m(1.8)).toFixed(1)} ${(-m(.34)).toFixed(1)} ${(-m(3.6)).toFixed(1)} 0 z"
    fill="${coque}"/>`;
  s += `<path d="M${(x-m(1.8)).toFixed(1)} ${(y-m(.5)).toFixed(1)}
    q${m(1.8).toFixed(1)} ${(-m(.34)).toFixed(1)} ${m(3.6).toFixed(1)} 0"
    stroke="${coqueC}" stroke-width="${Math.max(.5, m(.14)).toFixed(2)}" fill="none"/>`;
  return s + `</g>`;
}

/* ---------- la scène complète ---------- */
function anse(etat){
  const E = etat || {};
  let s = ciel() + eau();
  s += falaise(-1, 0);
  s += falaise(1, 7);
  s += fond();
  s += cabanon(E.cabanon || 0);
  s += sechoir(E.sechoir || 0, E.produit);
  s += ponton(E.ponton || 0);
  s += barqueAuMouillage();
  /* le voile de l'heure */
  s += `<defs><radialGradient id="a-vig" cx="0.5" cy="0.42" r="0.82">
    <stop offset="48%" stop-color="${T.ombre}" stop-opacity="0"/>
    <stop offset="100%" stop-color="${T.ombre}" stop-opacity="${T.voile}"/></radialGradient></defs>`;
  s += `<rect x="0" y="${HAUT}" width="${W}" height="${(BAS-HAUT).toFixed(1)}" fill="url(#a-vig)"/>`;
  return s;
}

  { k:'soleil',  n:'Soleil' },   { k:'barque',  n:'Barque' },
  { k:'phare',   n:'Phare' },    { k:'cle',     n:'Clé' },
  { k:'balance', n:'Balance' },  { k:'compas',  n:'Compas' },
  { k:'gouvernail', n:'Barre' }, { k:'cigale',  n:'Cigale' },
  { k:'croix',   n:'Croix' },    { k:'main',    n:'Main' },
  { k:'roue',    n:'Roue' },     { k:'mistral', n:'Mistral' },
  { k:'jarre',   n:'Jarre' },    { k:'pin',     n:'Pin' }
];

/* le dessin d'un signe, dans un carré de 24 */
function signe(k, c){
  const S = {
    ancre:   '<path d="M12 6v13M7 11h10M12 19c-4 0-6-3-6-5M12 19c4 0 6-3 6-5" stroke="'+c+'" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="12" cy="5" r="2.4" fill="none" stroke="'+c+'" stroke-width="2"/>',
    poisson: '<path d="M4 12c3-4 8-5 11-3 2 1 3 2 4 3-1 1-2 2-4 3-3 2-8 1-11-3z" fill="'+c+'"/><path d="M19 12l3-3v6z" fill="'+c+'"/><circle cx="8" cy="11" r="1" fill="#fff"/>',
    vague:   '<path d="M3 10q3-3 6 0t6 0 6 0M3 15q3-3 6 0t6 0 6 0" stroke="'+c+'" stroke-width="2.2" fill="none" stroke-linecap="round"/>',
    olive:   '<path d="M12 20V8M12 8c0-3 3-5 6-4 0 3-3 5-6 4zM12 12c0-3-3-5-6-4 0 3 3 5 6 4z" stroke="'+c+'" stroke-width="2" fill="none" stroke-linecap="round"/>',
    noeud:   '<path d="M8 8a4 4 0 1 0 8 8M16 8a4 4 0 1 1-8 8" stroke="'+c+'" stroke-width="2.2" fill="none" stroke-linecap="round"/>',
    etoile:  '<path d="M12 3l2.6 6.5L21 10l-5 4.2 1.6 6.8L12 17.4 6.4 21 8 14.2 3 10l6.4-.5z" fill="'+c+'"/>',
    soleil:  '<circle cx="12" cy="12" r="4.6" fill="'+c+'"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2" stroke="'+c+'" stroke-width="2" stroke-linecap="round"/>',
    barque:  '<path d="M3 15q3 2 6 0t6 0 6 0M5 12h14l-2-4H7z" stroke="'+c+'" stroke-width="2" fill="none" stroke-linejoin="round"/><path d="M12 8V3" stroke="'+c+'" stroke-width="2" stroke-linecap="round"/>',
    phare:   '<path d="M9 21h6l-1-11h-4zM10 10V6h4v4M12 6V3" stroke="'+c+'" stroke-width="2" fill="none" stroke-linejoin="round"/><path d="M5 6l3 1M19 6l-3 1" stroke="'+c+'" stroke-width="1.8" stroke-linecap="round"/>',
    cle:     '<circle cx="8" cy="8" r="4" fill="none" stroke="'+c+'" stroke-width="2"/><path d="M11 11l8 8M16 16l2 2M14 18l2 2" stroke="'+c+'" stroke-width="2" stroke-linecap="round"/>',
    balance: '<path d="M12 4v16M6 20h12M4 8h16M4 8l-2 5a3 3 0 0 0 4 0zM20 8l2 5a3 3 0 0 1-4 0z" stroke="'+c+'" stroke-width="1.8" fill="none" stroke-linejoin="round"/>',
    compas:  '<path d="M12 4v5M9 21l3-12 3 12" stroke="'+c+'" stroke-width="2" fill="none" stroke-linejoin="round"/><circle cx="12" cy="4" r="1.8" fill="'+c+'"/>',
    gouvernail:'<circle cx="12" cy="12" r="6" fill="none" stroke="'+c+'" stroke-width="2"/><circle cx="12" cy="12" r="2" fill="'+c+'"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4M5 5l3 3M16 16l3 3M19 5l-3 3M8 16l-3 3" stroke="'+c+'" stroke-width="1.8" stroke-linecap="round"/>',
    cigale:  '<ellipse cx="12" cy="14" rx="3" ry="6" fill="'+c+'"/><path d="M11 9C7 6 3 8 4 12c1 3 5 3 7 1M13 9c4-3 8-1 7 3-1 3-5 3-7 1" fill="'+c+'" opacity=".55"/><circle cx="12" cy="7" r="2" fill="'+c+'"/>',
    croix:   '<path d="M12 3v18M3 12h18" stroke="'+c+'" stroke-width="2.6" stroke-linecap="round"/><circle cx="12" cy="12" r="3" fill="none" stroke="'+c+'" stroke-width="1.6"/>',
    main:    '<path d="M9 20v-7M9 13V6a1.5 1.5 0 0 1 3 0v6M12 12V5a1.5 1.5 0 0 1 3 0v7M15 12V7a1.5 1.5 0 0 1 3 0v8c0 3-2 5-5 5H9l-3-4 2-1" stroke="'+c+'" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>',
    roue:    '<circle cx="12" cy="12" r="8" fill="none" stroke="'+c+'" stroke-width="2"/><circle cx="12" cy="12" r="2.4" fill="'+c+'"/><path d="M12 4v4M12 16v4M4 12h4M16 12h4" stroke="'+c+'" stroke-width="1.8"/>',
    mistral: '<path d="M3 8h11a3 3 0 1 0-3-3M3 13h15a3 3 0 1 1-3 3M3 18h9" stroke="'+c+'" stroke-width="2" fill="none" stroke-linecap="round"/>',
    jarre:   '<path d="M9 4h6M10 4c0 2-4 3-4 8 0 5 2 8 6 8s6-3 6-8c0-5-4-6-4-8" stroke="'+c+'" stroke-width="1.9" fill="none" stroke-linejoin="round"/><path d="M6 13h12" stroke="'+c+'" stroke-width="1.5"/>',
    pin:     '<path d="M12 21v-4M12 3l5 7h-3l4 6H6l4-6H7z" stroke="'+c+'" stroke-width="1.9" fill="none" stroke-linejoin="round"/>'
  }[k] || '';
  return '<svg viewBox="0 0 24 24">' + S + '</svg>';
}


const MET = { savon:'Savonnier', poisson:'Sécheur', cordage:'Cordier', huile:'Huilier' };
let D = null;

function decor(){
  const A = D.affaire || {};
  const h = new Date().getHours();
  regler(h < 7 ? 'nuit' : h < 11 ? 'matin' : h < 16 ? 'midi' : h < 20 ? 'soir' : 'nuit');
  const el = document.getElementById('anse');
  const v = cadrer(el.clientWidth || innerWidth, el.clientHeight || innerHeight * .46);
  el.innerHTML = '<svg viewBox="0 ' + v.y.toFixed(1) + ' ' + W + ' ' + v.h.toFixed(1) + '" '
    + 'preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">'
    + anse({ cabanon:A.atelier || 1, sechoir:A.sechoir || 0, ponton:A.ponton || 0,
             produit:A.metier }) + '</svg>';
}

function entete(){
  const A = D.affaire || {};
  const c = COULEURS.find(x => x.k === A.couleur) || COULEURS[0];
  const f = (ECUSSONS.find(x => x.k === A.ecusson) || ECUSSONS[0]).r;
  const em = document.getElementById('t-em');
  em.style.background = c.c; em.style.borderRadius = f;
  em.innerHTML = signe(A.signe || 'ancre', '#fff');
  document.getElementById('t-nom').textContent = A.nom || 'Ton anse';
  document.getElementById('t-met').textContent = MET[A.metier] || '—';
  document.getElementById('t-eu').textContent =
    Number(D.euros || 0).toLocaleString('fr-FR', {minimumFractionDigits:2}) + ' €';
}

function poserProd(){
  const A = D.affaire || {}, P = A.prod || {};
  const stock = +P.stock || 0, cap = +P.capacite || 1;
  const vaut = +P.vaut || 0;
  const el = document.getElementById('prod');
  el.innerHTML = '<div class="l1">'
    + '<span class="ic"><svg viewBox="0 0 24 24">'
    + '<path d="M4 8h16v12H4zM4 8l2-4h12l2 4M9 12h6"/></svg></span>'
    + '<span class="tx"><b>' + stock.toFixed(1) + ' pièces</b>'
    + '<span>' + (+P.par_jour || 0).toFixed(1) + ' par jour, à '
    + (+P.prix_piece || 0).toFixed(1) + ' € la pièce.</span></span>'
    + '<span class="px"><em>' + vaut + ' €</em></span></div>'
    + '<div class="jauge"><i class="' + (P.plein ? 'plein' : '') + '" style="width:'
    + Math.min(100, stock / cap * 100).toFixed(1) + '%"></i></div>'
    + '<div class="sous"><span>Ta réserve</span><span>'
    + stock.toFixed(1) + ' / ' + cap + '</span></div>'
    + '<button id="ram"' + (stock < 1 ? ' disabled' : '') + '>'
    + (P.plein ? 'Ta réserve déborde — ramasser ' + vaut + ' €'
       : stock < 1 ? 'Rien à prendre pour l\'instant'
       : 'Ramasser — ' + vaut + ' €') + '</button>';
  const b = document.getElementById('ram');
  if (b && stock >= 1) b.onclick = async () => {
    b.disabled = true; b.textContent = '…';
    const r = await BD.agir('ramasser');
    if (r.ok){ D = await BD.charger(); entete(); poserProd(); poserBatis(); }
    else b.textContent = "Ça n'a pas marché";
  };
}

function poserBatis(){
  const A = D.affaire || {};
  document.getElementById('batis').innerHTML = BATIS.map(B => {
    const n = +A[B.k] || 0;
    const act = B.N[n], suiv = B.N[n + 1];
    const peut = suiv && Number(D.euros || 0) >= suiv.prix;
    let s = '<div class="bat"><div class="l1"><b>' + B.n + '</b>'
      + (suiv ? '<span class="px">' + suiv.prix.toLocaleString('fr-FR') + ' €</span>'
              : '<span class="px fait">Au bout ✓</span>') + '</div>'
      + '<span class="a">' + act.n + ' — ' + act.d + '</span>'
      + '<div class="niv">' + B.N.map((_, i) =>
          '<i class="' + (i <= n ? 'on' : '') + '"></i>').join('') + '</div>';
    if (suiv){
      s += '<span class="n">Ensuite : ' + suiv.n + ' — ' + suiv.d + '</span>';
      const g = [];
      ['prod','stock','bonus'].forEach(k => {
        if (suiv[k] === undefined) return;
        const dd = (suiv[k] || 0) - (act[k] || 0);
        if (dd) g.push('+' + dd + ' ' +
          { prod:'de production', stock:'de réserve', bonus:'au chargement' }[k]);
      });
      if (g.length) s += '<span class="ef">' + g.join(' · ') + '</span>';
      s += '<button data-b="' + B.k + '"' + (peut ? '' : ' disabled') + '>'
        + (peut ? 'Bâtir' : 'Il te manque '
            + (suiv.prix - Number(D.euros || 0)).toLocaleString('fr-FR') + ' €')
        + '</button>';
    }
    return s + '</div>';
  }).join('');

  document.querySelectorAll('[data-b]').forEach(b =>
    b.onclick = async () => {
      b.disabled = true; b.textContent = 'On monte…';
      const r = await BD.agir('batir', { p_quoi: b.dataset.b });
      if (r.ok){ D = await BD.charger(); decor(); entete(); poserProd(); poserBatis(); }
      else b.textContent = r.pourquoi === 'trop_cher' ? 'Pas assez' : "Ça n'a pas marché";
    });
}

document.getElementById('ret').onclick = () => location.href = 'jeu.html';

(async () => {
  try {
    D = await BD.charger();
    if (!D){ location.href = 'index.html'; return; }
  } catch(e){ return; }
  if (!D.affaire){ location.href = 'registre.html'; return; }
  if (D.parti_le || D.port !== 'anse'){ location.href = 'jeu.html'; return; }
  decor(); entete(); poserProd(); poserBatis();
})();

let t = null;
addEventListener('resize', () => { clearTimeout(t); t = setTimeout(() => D && decor(), 200); });
</script>
</body>
