<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#f5a53a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Ton carnet — Battle Dock</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="chaud.css?v=2">
<script>
/* ---------- le ciel du port où l'on se trouve ----------
   Posé avant la première image, pour ne pas ouvrir sur l'ocre de
   Marseille puis basculer. Le port est retenu par le hub. */
(function(){
  const C = { anse:['#f5a53a','#eeb455','#c9b978','#3f87a6','#2b6f92'],
    barcelone:['#e8873f','#c9686a','#8a5f84','#3f5f82','#1c3350'],
    palma:['#f6d97a','#e8b45c','#88b8a8','#2f92a4','#14566a'],
    ajaccio:['#e8a8a0','#c98fa0','#8f8fa8','#3f7f92','#17475c'] };
  let p = 'anse';
  try { p = localStorage.getItem('bd-port') || 'anse'; } catch(e){}
  const ci = C[p] || C.anse;
  const R = document.documentElement.style;
  ci.forEach((v, i) => R.setProperty('--h' + (i + 1), v));
  const m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', ci[0]);
})();

  /* le pied dit le port où l'on est, pas Marseille en toutes lettres */
  (function(){
    const N = { anse:'Marseille', barcelone:'Barcelone',
                palma:'Palma', ajaccio:'Ajaccio' };
    let p = 'anse';
    try { p = localStorage.getItem('bd-port') || 'anse'; } catch(e){}
    const el = document.querySelector('.pied');
    if (el) el.textContent = 'Battle Dock — ' + (N[p] || 'Marseille');
  })();
</script>
<style>
/* on recouvre le dégradé commun de chaud.css */
html{background:var(--h5,#2b6f92)}
body::before{background:linear-gradient(180deg,
  var(--h1,#f5a53a) 0%, var(--h2,#eeb455) 16%, var(--h3,#c9b978) 38%,
  var(--h4,#3f87a6) 70%, var(--h5,#2b6f92) 100%)}
</style>
<style>
.hi{position:relative;padding:17px 18px;margin-bottom:13px;border-radius:18px;
  background:var(--creme);border:3px solid var(--encre);}
.hi.ici{background:#fff8e4}
.hi .ban{position:absolute;top:-3px;right:-3px;padding:6px 13px;
  border-radius:0 15px 0 14px;font-size:10px;font-weight:800;letter-spacing:.08em;
  text-transform:uppercase;background:var(--or);border:3px solid var(--encre)}
.hi .l1{display:flex;align-items:flex-start;gap:13px;margin-bottom:12px}
.hi.ici .l1{padding-right:96px}
.hi .qui{flex:0 0 46px;height:46px;border-radius:14px;display:flex;
  align-items:center;justify-content:center;
  font-family:'DM Serif Display',Georgia,serif;font-size:22px;
  background:var(--or);border:2.5px solid var(--encre)}
.hi .co{flex:1;min-width:0}
.hi .co b{display:block;font-family:'DM Serif Display',Georgia,serif;
  font-size:21px;line-height:1.15}
.hi .co .par{display:block;font-size:12px;font-weight:700;margin-top:5px;
  color:rgba(18,48,63,.56)}
.hi .co .par em{font-style:normal;color:var(--vert);font-weight:800}
.hi .res{font-size:13.5px;font-weight:600;color:rgba(18,48,63,.72);line-height:1.55;
  margin-bottom:14px}
.hi .l2{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hi .et{display:flex;align-items:center;gap:7px;padding:6px 12px;border-radius:11px;
  font-size:11.5px;font-weight:800;background:rgba(18,48,63,.08);
  border:2px solid rgba(18,48,63,.16)}
.pas{display:flex;gap:5px;margin-left:auto}
.pas i{width:10px;height:10px;border-radius:50%;background:rgba(18,48,63,.14);
  border:2px solid rgba(18,48,63,.2)}
.pas i.fait{background:var(--or);border-color:var(--encre)}
.hi.finie{background:#eaf6ee;opacity:.82}
.hi.finie .qui{background:var(--vert);color:#fff}
.hi.finie .fin{font-size:12.5px;font-weight:800;color:var(--vert)}

/* ---------- ce que tu as décidé ----------
   La base gardait le choix de chaque joueur sans jamais le montrer.
   C'est pourtant la seule chose qu'un carnet devrait retenir. */
/* ---------- ce qu'il te reste à faire ----------
   Le résumé dit où en est l'histoire ; cette ligne dit quoi faire. */
.hi .faire{display:flex;align-items:flex-start;gap:9px;margin:-4px 0 14px;
  font-size:13px;font-weight:700;line-height:1.5;color:var(--encre)}
.hi .faire .pl{flex:0 0 auto;color:var(--or);font-weight:800}

.hi .choix{display:flex;align-items:flex-start;gap:11px;padding:12px 13px;
  border-radius:14px;margin:0 0 13px;
  background:rgba(47,138,92,.09);border:2.5px solid rgba(47,138,92,.3)}
.hi .choix .pl{flex:0 0 auto;font-size:16px;line-height:1.2}
.hi .choix .tx b{display:block;font-family:'DM Serif Display',Georgia,serif;
  font-size:16px;line-height:1.15;color:#1f6b45}
.hi .choix .tx span{display:block;font-size:12px;font-weight:600;line-height:1.5;
  color:rgba(18,48,63,.6);margin-top:4px}
/* quand l'histoire court encore, le choix est en attente */
.hi:not(.finie) .choix{background:rgba(240,169,46,.12);
  border-color:rgba(240,169,46,.42)}
.hi:not(.finie) .choix .tx b{color:#a8741a}

/* ---------- y aller ---------- */
.hi .aller{display:flex;align-items:center;justify-content:center;gap:9px;
  width:100%;padding:14px;margin-top:13px;border-radius:14px;cursor:pointer;
  background:var(--or);border:3px solid var(--encre);color:var(--encre);
  font-family:'DM Serif Display',Georgia,serif;font-size:17px;
  transition:background .12s}
.hi .aller:active{background:#d9962a}
/* pas au bon port : on dit où il faut être */
.hi .loin{font-size:12px;font-weight:700;color:rgba(18,48,63,.5);
  margin-top:13px;padding-top:12px;border-top:2.5px solid rgba(18,48,63,.1)}
.hi .loin em{font-style:normal;font-weight:800;color:var(--encre)}

/* ---------- quand ça s'est joué ---------- */
.hi .quand{font-size:11px;font-weight:700;color:rgba(18,48,63,.42);margin-top:9px}
</style>
</head>
<body>

<div class="pont">
  <div class="tete">
    <span class="q"><b>Ton carnet</b><span id="c-sous">—</span></span>
    <button class="retour" id="retour">‹ Retour</button>
  </div>
  <div id="liste" class="attend"></div>
  <p class="pied">Battle Dock — Marseille</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="bd.js?v=3"></script>
<script>
/* le contenu paraît d'un trait, une fois complet */
function paraitre(){
  const e = document.getElementById('liste');
  if (e){ e.classList.remove('attend'); e.classList.add('venu'); }
}

/* Combien d'étapes compte chaque histoire. Le serveur le sait dès que
   la table des étapes est remplie ; en attendant, on garde ce repli. */
const LONGUEUR = { ardit:3, miquel_2:2, pere:2, titou:2 };

/* ---------- où se joue chaque histoire ----------
   Le carnet ne se contente plus de dire « ça t'attend ici » :
   il t'y emmène. Chaque personnage a sa page. */
/* Chaque histoire a son lieu qui dure. Les scènes ne se jouent
   qu'une fois : on renvoie donc vers l'endroit où le personnage
   se tient tous les jours, pas vers la scène déjà passée.
   Titou n'a pas encore de lieu à lui : on redescend au port. */
const CHEZ = { nuria:'taverne.html', miquel:'miquel.html',
               pere:'pere.html', titou:'jeu.html', ardit:'ardit.html',
               don:'cirque.html', ghjuvanni:'cirque.html' };
const PORT_DE = { Marseille:'anse', Barcelone:'barcelone',
                  Palma:'palma', Ajaccio:'ajaccio' };

/* la date, à la façon du carnet : courte et sans heure */
function leJour(iso){
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('fr-FR', { day:'numeric', month:'long' });
}

function carte(q, ici){
  const total = q.total || LONGUEUR[q.k] || Math.max(2, q.etape);
  const finie = q.etat === 'finie';
  let pas = '';
  for (let i = 1; i <= total; i++)
    pas += '<i class="' + (i <= q.etape ? 'fait' : '') + '"></i>';

  return '<div class="hi' + (finie ? ' finie' : '') + (ici ? ' ici' : '') + '">'
    + (ici ? '<span class="ban">Ça t\'attend ici</span>' : '')
    + '<div class="in">'
    + '<div class="l1">'
    +   '<span class="qui">' + (q.qui || '?')[0].toUpperCase() + '</span>'
    +   '<span class="co"><b>' + q.nom + '</b>'
    +   '<span class="par">' + (finie ? 'Avec ' : 'Chez ')
    +     '<em>' + q.qui + '</em> — ' + q.ou + '</span></span>'
    + '</div>'
    + '<p class="res">' + q.resume + '</p>'

    /* ce qu'il te reste à faire, si l'étape le précise */
    + (!finie && q.faire
        ? '<p class="faire"><span class="pl">→</span>' + q.faire + '</p>'
        : '')

    /* ce que tu as décidé — la mémoire du carnet */
    + (q.issue_mot
        ? '<div class="choix"><span class="pl">' + (finie ? '✦' : '⌖') + '</span>'
          + '<span class="tx"><b>' + q.issue_mot + '</b>'
          + (q.issue_note ? '<span>' + q.issue_note + '</span>' : '')
          + '</span></div>'
        : '')

    + '<div class="l2">'
    +   (finie ? '<span class="fin">✓ Cette histoire est close</span>'
         : '<span class="et"><span class="pt"></span>Étape ' + q.etape
           + ' sur ' + total + '</span>')
    +   (finie ? '' : '<span class="pas">' + pas + '</span>')
    + '</div>'

    /* et de quoi y retourner */
    + (finie
        ? (q.finie_le ? '<p class="quand">Close le ' + leJour(q.finie_le) + '</p>' : '')
        : ici && CHEZ[q.qui_k]
          ? '<button class="aller" data-va="' + CHEZ[q.qui_k] + '">Y aller</button>'
          : '<p class="loin">Il faut être à <em>' + q.ou + '</em> pour la suite.</p>')

    + '</div></div>';
}

(async () => {
  const L = document.getElementById('liste');
  try {
    const d = await BD.charger();
    if (!d){ location.href = 'index.html'; return; }

    let Q;
    try { Q = await BD.agir('mes_quetes'); } catch(e){ Q = null; }
    if (!Array.isArray(Q)) Q = [];

    /* où es-tu ? une histoire qui s'y passe attend peut-être */
    const PORTS = { anse:'Marseille', marseille:'Marseille',
                    barcelone:'Barcelone', palma:'Palma', ajaccio:'Ajaccio' };
    const ici = PORTS[d.port];

    const cours = Q.filter(q => q.etat !== 'finie');
    const fini  = Q.filter(q => q.etat === 'finie');

    document.getElementById('c-sous').textContent = cours.length
      ? cours.length + (cours.length > 1 ? ' histoires en cours' : ' histoire en cours')
      : 'Rien en cours';

    let h = '';
    if (cours.length){
      /* celles qui se passent là où tu es viennent en premier */
      cours.sort((a, b) => (b.ou === ici ? 1 : 0) - (a.ou === ici ? 1 : 0));
      h += cours.map(q => carte(q, q.ou === ici)).join('');
    } else {
      h += '<p class="rien">Tu n\'as rien en cours.<br>'
        + 'Descends à terre, parle aux gens — ils ont tous quelque chose à te demander.</p>';
    }

    if (fini.length){
      h += '<p class="sec plus">Ce qui est derrière toi</p>'
        + fini.map(q => carte(q, false)).join('');
    }

    L.innerHTML = h; paraitre();

    /* le carnet t'emmène là où l'histoire attend */
    L.querySelectorAll('[data-va]').forEach(b =>
      b.onclick = () => location.href = b.dataset.va);

  } catch(e){
    console.warn(e);
    L.innerHTML = '<p class="rien">Le carnet n\'a pas répondu.</p>'; paraitre();
  }
})();

document.getElementById('retour').onclick = () => location.href = 'hub.html?v=3';
</script>
</body>
</html>
