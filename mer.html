<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0b1a2a">
<title>Battle Dock — En mer</title>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none}
html,body{height:100%;overflow:hidden;background:#0b1a2a;
  font-family:'Courier Prime',monospace;color:#fff}

#mer{position:fixed;inset:0}
#mer svg{display:block;width:100%;height:100%}
#voile{position:fixed;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(8,18,30,.44) 0%,rgba(8,18,30,0) 26%,
    rgba(8,18,30,0) 46%,rgba(8,18,30,.6) 82%,rgba(8,18,30,.94) 100%)}

/* ---------- l'heure et le cap, en haut ---------- */
.haut{position:fixed;left:0;right:0;top:0;z-index:3;
  padding:calc(env(safe-area-inset-top) + 18px) 22px 0;text-align:center}
.haut .cap{font-size:9px;letter-spacing:.34em;text-transform:uppercase;
  color:rgba(255,255,255,.5)}
.haut .heure{font-size:34px;font-weight:700;margin-top:6px;letter-spacing:.02em;
  text-shadow:0 2px 16px rgba(4,12,22,.6)}
.haut .moment{font-size:10.5px;color:#f0c46a;margin-top:4px;letter-spacing:.1em}

/* ---------- le journal de bord ---------- */
.journal{position:fixed;left:22px;right:22px;
  bottom:calc(env(safe-area-inset-bottom) + 148px);z-index:3;
  display:flex;flex-direction:column;gap:8px;justify-content:flex-end}
.journal p{font-size:12.5px;line-height:1.6;color:rgba(255,255,255,.82);
  font-family:system-ui,sans-serif;
  background:rgba(10,22,36,.62);border-left:2px solid rgba(240,196,106,.6);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border-radius:0 7px 7px 0;padding:10px 13px;
  opacity:0;transform:translateX(-10px);
  animation:entre .6s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes entre{to{opacity:1;transform:none}}
.journal p.fort{color:#ffd894;border-left-color:#ffd894}

/* ---------- la progression ---------- */
.bas{position:fixed;left:0;right:0;bottom:0;z-index:4;
  padding:0 22px calc(env(safe-area-inset-bottom) + 26px)}
.jauge{height:5px;background:rgba(255,255,255,.14);border-radius:3px;overflow:hidden}
.jauge i{display:block;height:100%;border-radius:3px;width:0;
  background:linear-gradient(90deg,#b8934a,#ffd894);
  transition:width .9s linear}
.reste{display:flex;justify-content:space-between;margin-top:9px;
  font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  color:rgba(255,255,255,.42)}

.arriver{width:100%;margin-top:20px;padding:18px;border:0;border-radius:9px;cursor:pointer;
  background:linear-gradient(180deg,#f6cd76,#dca94a);color:#1c1a16;
  font-family:'Courier Prime',monospace;font-size:15px;font-weight:700;letter-spacing:.08em;
  box-shadow:0 6px 26px rgba(240,196,106,.34);
  opacity:0;transform:translateY(12px);pointer-events:none;
  transition:opacity .6s,transform .6s cubic-bezier(.2,.8,.3,1)}
.arriver.on{opacity:1;transform:none;pointer-events:auto}
.arriver:active{transform:scale(.984)}

/* ---------- la mer ---------- */
.o0{animation:v0 18s linear infinite}.o1{animation:v1 24s linear infinite}
.o2{animation:v0 31s linear infinite}.o3{animation:v1 39s linear infinite}
@keyframes v0{to{transform:translateX(58px)}}
@keyframes v1{to{transform:translateX(-58px)}}
.nuages g{animation:derive 150s linear infinite}
@keyframes derive{to{transform:translateX(660px)}}
.paill{animation:brille 3s ease-in-out infinite}
.p1{animation-duration:1.9s;animation-delay:-.5s}
.p2{animation-duration:4.2s;animation-delay:-1.6s}
.p3{animation-duration:1.5s;animation-delay:-.8s}
.p4{animation-duration:5s;animation-delay:-2.5s}
.p5{animation-duration:2.6s;animation-delay:-1.1s}
@keyframes brille{0%,100%{opacity:.1}45%{opacity:1}}
.barque{animation:roulis 5.4s ease-in-out infinite;transform-origin:150px 122px}
@keyframes roulis{
  0%{transform:translate(-150px,-122px) rotate(-2deg)}
  27%{transform:translate(-150px,-124px) rotate(.8deg)}
  53%{transform:translate(-150px,-120.6px) rotate(2deg)}
  78%{transform:translate(-150px,-123.4px) rotate(-.6deg)}
  100%{transform:translate(-150px,-122px) rotate(-2deg)}}
.etoile{animation:scint 4s ease-in-out infinite}
.e1{animation-duration:5.6s;animation-delay:-1.4s}
.e2{animation-duration:3.2s;animation-delay:-2.6s}
.e3{animation-duration:6.8s;animation-delay:-.7s}
@keyframes scint{0%,100%{opacity:.2}50%{opacity:.9}}
@media (prefers-reduced-motion:reduce){.barque,.paill{animation:none}}
</style>
</head>
<body>

<div id="mer"></div>
<div id="voile"></div>

<div class="haut">
  <p class="cap" id="cap">Cap sur Barcelone</p>
  <p class="heure" id="heure">—</p>
  <p class="moment" id="moment">—</p>
</div>

<div class="journal" id="journal"></div>

<div class="bas">
  <div class="jauge"><i id="jg"></i></div>
  <div class="reste"><span id="parti">Parti</span><span id="reste">—</span></div>
  <button class="arriver" id="arriver">Débarquer à Barcelone</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="bd.js"></script>
<script>
/* ============================================================
   LE PORT À L'AUBE — le socle : charte, lumière, matière
   ============================================================ */

const W = 480;
const OEIL = 11;
const FOCALE = 727;
const HORIZON = 214;

const px  = (m, d) => m * FOCALE / d;
const sol = d => HORIZON + OEIL * FOCALE / d;
const rnd = s => { const x = Math.sin(s * 127.1) * 43758.5; return x - Math.floor(x); };
const rnd2 = (a, b) => { const x = Math.sin(a * 127.1 + b * 311.7) * 43758.5; return x - Math.floor(x); };

/* ---------- le soleil ---------- */
/* bas sur l'horizon, un peu à gauche du milieu : c'est lui qui décide de tout */
const SOLEIL = { x: 196, y: 200, r: 15 };

/* ---------- les couleurs ---------- */
function hx(c){ return [parseInt(c.slice(1,3),16), parseInt(c.slice(3,5),16), parseInt(c.slice(5,7),16)]; }
function ch(a){ return '#' + a.map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2,'0')).join(''); }
function mel(a, b, k){ const A = hx(a), B = hx(b); return ch([0,1,2].map(i => A[i] + (B[i]-A[i]) * k)); }

/* la lumière du matin : dorée et rasante */
const OR   = '#ffcf8a';
const OMBRE= '#2a3f5c';   /* les ombres tirent vers le bleu */
const BRUME_C = '#e8c9a0';

/* une face éclairée */
const clair  = (c, k) => mel(c, OR, k === undefined ? .34 : k);
/* une face à l'ombre */
const sombre = (c, k) => mel(c, OMBRE, k === undefined ? .34 : k);
/* la brume selon la distance */
const brume = d => Math.min(.78, 1 - Math.exp(-d / 2100));
const voiler = (c, d) => mel(c, BRUME_C, brume(d) * .82);

/* ---------- le cadre ---------- */
let HAUT = -180, BAS = 900;
const D_BORD = 21;
function cadrer(l, h){
  const total = W * h / l;
  const yb = sol(D_BORD);
  HAUT = yb - total * .78;
  BAS  = yb + total * .22;
  return { y: HAUT, h: total };
}

/* ---------- les ombres portées ---------- */
/* le soleil est bas et à gauche : les ombres partent vers la droite et vers nous */
function ombreDe(x, ySol, larg, haut, d){
  /* plus l'objet est haut, plus l'ombre est longue */
  const lg = haut * 2.6, dec = haut * 1.5;
  return `<path d="M${(x).toFixed(1)} ${ySol.toFixed(1)}
    h${larg.toFixed(1)} l${dec.toFixed(1)} ${(lg*.34).toFixed(1)}
    h${(-larg*.9).toFixed(1)} z" fill="${OMBRE}" opacity=".2"/>`;
}

/* ---------- le grain : une texture discrète sur tout ---------- */
function grain(){
  return `<filter id="b-grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" seed="7"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope=".055"/></feComponentTransfer>
    <feComposite operator="in" in2="SourceGraphic"/></filter>`;
}

/* ============================================================
   La barque — 20 niveaux d'amélioration
   ============================================================ */
const rndB = s => { const x = Math.sin(s * 127.1) * 43758.5; return x - Math.floor(x); };

/* ---- ce que chaque niveau ajoute ---- */
const PALIERS_B = [
  { n:1,  nom:"La coque nue",        prix:0,      places:1, kg:40,  vit:1.0,
    d:"Trois bordages et rien d'autre. Elle flotte, c'est déjà ça." },
  { n:2,  nom:"Le calfatage",        prix:900,    places:1, kg:45,  vit:1.0,
    d:"Étoupe et goudron dans les coutures. Elle ne prend plus l'eau." },
  { n:3,  nom:"Le banc de nage",     prix:1400,   places:1, kg:50,  vit:1.1,
    d:"On peut ramer assis. Ça change tout." },
  { n:4,  nom:"Les avirons",         prix:2200,   places:2, kg:60,  vit:1.3,
    d:"Deux avirons de frêne et leurs tolets." },
  { n:5,  nom:"Le plat-bord",        prix:3400,   places:2, kg:70,  vit:1.3,
    d:"Un liston tout autour. La coque ne travaille plus." },
  { n:6,  nom:"Le pontage avant",    prix:5000,   places:3, kg:85,  vit:1.4,
    d:"Un demi-pont à l'avant. Les caisses restent au sec." },
  { n:7,  nom:"Le mât de fortune",   prix:7200,   places:3, kg:95,  vit:1.7,
    d:"Une perche et un bout de toile. Ça tire quand le vent veut bien." },
  { n:8,  nom:"La voile latine",     prix:10000,  places:4, kg:110, vit:2.2,
    d:"Antenne et voile triangulaire. La vraie voile d'ici." },
  { n:9,  nom:"Le safran",           prix:13500,  places:4, kg:120, vit:2.3,
    d:"Un gouvernail et sa barre. Tu choisis où tu vas." },
  { n:10, nom:"La quille lestée",    prix:18000,  places:5, kg:140, vit:2.5,
    d:"Du plomb sous la quille. Elle ne se couche plus." },
  { n:11, nom:"Le tillac",           prix:23000,  places:6, kg:170, vit:2.6,
    d:"Un pont continu. On marche dessus sans regarder ses pieds." },
  { n:12, nom:"La cale fermée",      prix:29000,  places:8, kg:220, vit:2.6,
    d:"Un panneau, une cale étanche. Le double de marchandise." },
  { n:13, nom:"Le foc",              prix:36000,  places:8, kg:240, vit:3.1,
    d:"Un beaupré et un foc. Elle remonte enfin au vent." },
  { n:14, nom:"Le rouf",             prix:44000,  places:9, kg:270, vit:3.1,
    d:"Un abri sur le pont. On peut dormir à bord." },
  { n:15, nom:"Le second mât",       prix:54000,  places:10, kg:310, vit:3.6,
    d:"Un tapecul à l'arrière. Deux voiles valent mieux qu'une." },
  { n:16, nom:"Le bordé doublé",     prix:66000,  places:12, kg:380, vit:3.6,
    d:"Une seconde peau de bois. Elle encaisse le mauvais temps." },
  { n:17, nom:"Le treuil",           prix:80000,  places:14, kg:450, vit:3.7,
    d:"Un cabestan pour hisser seul. Plus besoin d'être trois." },
  { n:18, nom:"La chaloupe",         prix:96000,  places:15, kg:500, vit:3.7,
    d:"Une annexe sur le pont. On accoste où il n'y a pas de quai." },
  { n:19, nom:"Le pavillon",         prix:115000, places:16, kg:560, vit:3.8,
    d:"Tes couleurs en tête de mât. On te reconnaît de loin." },
  { n:20, nom:"Le grand caboteur",   prix:140000, places:20, kg:700, vit:4.2,
    d:"Coque doublée, trois voiles, un nom peint sur l'étrave. Ce n'est plus une barque." }
];

/* ---- palettes ---- */
const BOIS  = ['#b58f60','#c9a374','#a5825c','#96754a','#8a6a42'];
const CLAIR = '#e4c79c', SOMBRE = '#7a5c38', FOND = '#5c4930';

/* ============================================================
   Le dessin. Tout est paramétré par le niveau.
   Repère : la barque est dessinée dans un cadre 300 x 170,
   la ligne de flottaison est à y = 118.
   ============================================================ */
let uidB = 0;

function barqueQ(n, route){
  const P = PALIERS_B[n-1];
  const L = 76 + n * 5.6;            /* longueur */
  const H = 15 + n * 0.62;           /* creux du bordé au-dessus de l'eau */
  const T = 6 + n * 0.34;            /* tirant d'eau */
  const cx = 150, flot = 122;
  const x0 = cx - L / 2;
  const g = v => (x0 + v).toFixed(1);
  const u = 'b' + (++uidB);
  let s = '';

  /* ---------- la ligne de sheer : le haut du bordé ---------- */
  /* étrave relevée à gauche, creux au milieu, poupe relevée à droite */
  const yEtrave = flot - H * 1.28;
  const yCreux  = flot - H * 0.92;
  const yPoupe  = flot - H * 1.12;
  const sheer = `M${g(0)} ${yEtrave.toFixed(1)}
    C${g(L*.2)} ${(yEtrave + (yCreux-yEtrave)*.9).toFixed(1)} ${g(L*.36)} ${yCreux.toFixed(1)} ${g(L*.54)} ${yCreux.toFixed(1)}
    C${g(L*.74)} ${yCreux.toFixed(1)} ${g(L*.9)} ${(yCreux + (yPoupe-yCreux)*.5).toFixed(1)} ${g(L)} ${yPoupe.toFixed(1)}`;

  /* ---------- la coque complète ---------- */
  const coque = sheer
    + ` L${g(L*.965)} ${(flot + T*.42).toFixed(1)}`
    + ` C${g(L*.78)} ${(flot + T).toFixed(1)} ${g(L*.24)} ${(flot + T).toFixed(1)} ${g(L*.055)} ${(flot + T*.3).toFixed(1)}`
    + ` Z`;

  s += `<defs><clipPath id="${u}"><path d="${coque}"/></clipPath></defs>`;

  /* reflet dans l'eau */
  s += `<ellipse cx="${cx}" cy="${(flot + T*.7).toFixed(1)}" rx="${(L*.5).toFixed(0)}" ry="4"
    fill="#0e4a68" opacity=".2"/>`;

  /* la chaloupe (18+), posée en travers du pont */
  if (n >= 18){
    s += `<g transform="translate(${g(L*.58)},${(yCreux - 3).toFixed(1)})">
      <path d="M0 0 q3 8 10 9 h20 q7 -1 10 -9 q-6 3 -13 3 H13 q-7 0 -13 -3 z" fill="#96754a"/>
      <path d="M-1 -2 q5 4 12 4 h18 q7 0 12 -4 v3 q-5 3 -12 3 H11 q-7 0 -12 -3 z" fill="#c9a374"/></g>`;
  }

  /* ---------- le corps de la coque ---------- */
  s += `<path d="${coque}" fill="${BOIS[2]}"/>`;

  /* les bordages : des courbes parallèles au sheer, découpées par la coque */
  const nb = Math.min(7, 3 + Math.floor(n / 3.4));
  s += `<g clip-path="url(#${u})">`;
  for (let i = 0; i < nb; i++){
    const dy = (H + T) * (i / nb);
    const c = BOIS[i % BOIS.length];
    s += `<path d="${sheer}" transform="translate(0,${dy.toFixed(1)})" fill="none"
      stroke="${c}" stroke-width="${((H + T) / nb * 1.5).toFixed(1)}"/>`;
  }
  /* les coutures calfatées (2+) */
  if (n >= 2){
    for (let i = 1; i < nb; i++){
      const dy = (H + T) * (i / nb);
      s += `<path d="${sheer}" transform="translate(0,${dy.toFixed(1)})" fill="none"
        stroke="#3a2c1e" stroke-width=".9" opacity=".45"/>`;
    }
  }
  /* les œuvres vives, sous la flottaison */
  s += `<rect x="0" y="${flot}" width="300" height="60"
    fill="${n >= 10 ? '#33454f' : '#6d5334'}" opacity="${n >= 10 ? '.9' : '.55'}"/>`;
  /* le bordé doublé (16+) */
  if (n >= 16)
    s += `<path d="${sheer}" transform="translate(0,${(H*.9).toFixed(1)})" fill="none"
      stroke="#6d5334" stroke-width="2.4" opacity=".7"/>`;
  s += `</g>`;

  /* ---------- le liston (5+) ---------- */
  if (n >= 5){
    s += `<path d="${sheer}" fill="none" stroke="${CLAIR}" stroke-width="${(2.4 + n*.06).toFixed(1)}"
      stroke-linecap="round"/>`;
  } else {
    s += `<path d="${sheer}" fill="none" stroke="${BOIS[0]}" stroke-width="2" stroke-linecap="round"/>`;
  }
  /* l'ourlet clair du dessus */
  s += `<path d="${sheer}" transform="translate(0,-1)" fill="none" stroke="#f0dcb4"
    stroke-width="1" opacity=".6"/>`;

  /* ---------- l'étrave et l'étambot ---------- */
  s += `<path d="M${g(0)} ${yEtrave.toFixed(1)} C${g(-2)} ${(yEtrave + H*.7).toFixed(1)}
    ${g(1)} ${(flot).toFixed(1)} ${g(L*.055)} ${(flot + T*.3).toFixed(1)}"
    fill="none" stroke="${SOMBRE}" stroke-width="2.6" stroke-linecap="round"/>`;
  s += `<path d="M${g(L)} ${yPoupe.toFixed(1)} L${g(L*.965)} ${(flot + T*.42).toFixed(1)}"
    stroke="${SOMBRE}" stroke-width="2.6" stroke-linecap="round" fill="none"/>`;

  /* ---------- l'intérieur, vu par-dessus le bordé ---------- */
  s += `<path d="${sheer}" transform="translate(0,2.2)" fill="none" stroke="${FOND}"
    stroke-width="${Math.max(2.2, H*.22).toFixed(1)}"/>`;

  /* ---------- le pont ---------- */
  const pont = (a, b, coul, clair) => {
    s += `<path d="${sheer}" transform="translate(0,2)" fill="none" stroke="${coul}"
      stroke-width="${Math.max(2.4, H*.2).toFixed(1)}"
      stroke-dasharray="${(L*(b-a)).toFixed(0)} ${L.toFixed(0)}"
      stroke-dashoffset="${(-L*a).toFixed(0)}"/>`;
    s += `<path d="${sheer}" transform="translate(0,.6)" fill="none" stroke="${clair}"
      stroke-width="1.2" stroke-dasharray="${(L*(b-a)).toFixed(0)} ${L.toFixed(0)}"
      stroke-dashoffset="${(-L*a).toFixed(0)}"/>`;
  };
  if (n >= 11)      pont(.03, .95, '#b8946a', '#dfc094');   /* tillac : pont continu */
  else if (n >= 6)  pont(.04, .34, '#b8946a', '#dfc094');   /* demi-pont avant */

  /* ---------- le banc de nage (3+) ---------- */
  if (n >= 3 && n < 11)
    s += `<rect x="${g(L*.4)}" y="${(yCreux + 1.6).toFixed(1)}" width="${(L*.22).toFixed(0)}"
      height="${Math.max(2, H*.14).toFixed(1)}" rx="1" fill="#8a6a42"/>`;

  /* ---------- les avirons (4+ jusqu'au pont) ---------- */
  if (n >= 4 && n < 11){
    [[L*.34, 'av-1'], [L*.62, 'av-2']].forEach(([dx, cl]) => {
      const ax = +g(dx), ay = yCreux + 1;
      const dep = (flot + 7) - ay;      /* la pelle plonge sous la flottaison */
      /* le tolet, point de pivot */
      s += `<rect x="${(ax-1.4).toFixed(1)}" y="${(ay-3.6).toFixed(1)}" width="2.8" height="4.4"
        rx="1" fill="#6d5334"/>`;
      s += `<g class="aviron ${cl}" style="transform-origin:${ax}px ${ay.toFixed(1)}px">`;
      /* le manche, vers l'intérieur et vers le haut */
      s += `<path d="M${ax} ${ay.toFixed(1)} l-13 -6" stroke="#96754a"
        stroke-width="2.2" stroke-linecap="round"/>`;
      s += `<circle cx="${(ax-13).toFixed(1)}" cy="${(ay-6).toFixed(1)}" r="1.6" fill="#8a6a42"/>`;
      /* le fût, vers l'extérieur et vers l'eau */
      s += `<path d="M${ax} ${ay.toFixed(1)} l21 ${dep.toFixed(1)}" stroke="#a5825c"
        stroke-width="2.4" stroke-linecap="round"/>`;
      /* la pelle */
      s += `<path d="M${(ax+19).toFixed(1)} ${(ay+dep-2).toFixed(1)}
        q5.4 1 7 6 q1.6 5.4 -2 7.4 q-3.8 2 -6.8 -1.6 q-3 -3.6 -1.6 -8.6 z" fill="#c9a374"/>`;
      s += `<path d="M${(ax+19.6).toFixed(1)} ${(ay+dep-1).toFixed(1)}
        q4.4 1.4 5.6 5.4" stroke="#dfc094" stroke-width="1.2" fill="none"/>`;
      s += `</g>`;
    });
  }

  /* ---------- le panneau de cale (12+) ---------- */
  if (n >= 12){
    s += `<rect x="${g(L*.46)}" y="${(yCreux - 1.4).toFixed(1)}" width="${(L*.15).toFixed(0)}"
      height="${Math.max(2.6, H*.12).toFixed(1)}" rx="1" fill="#8a6a42" stroke="#6d5334" stroke-width=".8"/>`;
  }

  /* ---------- le rouf (14+) ---------- */
  if (n >= 14){
    const rx = +g(L*.62), ry = yCreux - 1, rh = H*.5, rw = L*.2;
    s += `<path d="M${rx} ${ry.toFixed(1)} h${rw.toFixed(0)} v-${rh.toFixed(1)} h-${rw.toFixed(0)} z" fill="#c9a374"/>`;
    s += `<path d="M${(rx-2).toFixed(1)} ${(ry-rh).toFixed(1)} h${(rw+4).toFixed(0)} l-2.4 -3.4 h-${(rw-.8).toFixed(0)} z" fill="#8a4a3a"/>`;
    s += `<rect x="${(rx+2.6).toFixed(1)}" y="${(ry-rh+2.4).toFixed(1)}" width="${(rw*.26).toFixed(1)}"
      height="${(rh*.42).toFixed(1)}" fill="#6d8fa4" opacity=".85"/>`;
    s += `<rect x="${(rx+rw*.56).toFixed(1)}" y="${(ry-rh+2.4).toFixed(1)}" width="${(rw*.26).toFixed(1)}"
      height="${(rh*.42).toFixed(1)}" fill="#6d8fa4" opacity=".85"/>`;
  }

  /* ---------- le grand mât (7+) ---------- */
  const mxP = n >= 13 ? .34 : .46;
  if (n >= 7){
    const mx = +g(L * mxP);
    const pied = yCreux + 1;
    const mh = n >= 8 ? 46 + n * 2.3 : 32;
    s += `<path d="M${mx} ${pied.toFixed(1)} v-${mh.toFixed(0)}" stroke="#8a6a42"
      stroke-width="${(2 + n*.07).toFixed(1)}" stroke-linecap="round"/>`;
    s += `<path d="M${(mx-.7).toFixed(1)} ${pied.toFixed(1)} v-${mh.toFixed(0)}" stroke="#c9a374"
      stroke-width=".9" opacity=".7"/>`;
    const ay = pied - mh;

    if (n === 7){
      s += `<path class="voile" d="M${mx} ${(ay+5).toFixed(1)} q15 7 20 21 q-13 5 -20 4 z" fill="#ddd2b6"/>`;
      s += `<path d="M${mx} ${(ay+5).toFixed(1)} q15 7 20 21 q-8 3 -12 3 z" fill="#f0e8d2"/>`;
    } else {
      /* la voile latine : antenne inclinée sur toute la hauteur */
      s += `<path d="M${(mx-20).toFixed(1)} ${(ay + mh*.5).toFixed(1)} L${(mx+34).toFixed(1)} ${(ay-4).toFixed(1)}"
        stroke="#a5825c" stroke-width="2.2" stroke-linecap="round"/>`;
      s += `<path class="voile" d="M${(mx-18).toFixed(1)} ${(ay + mh*.48).toFixed(1)}
        L${(mx+32).toFixed(1)} ${(ay-3).toFixed(1)}
        Q${(mx+14).toFixed(1)} ${(ay + mh*.56).toFixed(1)} ${(mx+2).toFixed(1)} ${pied.toFixed(1)} Z" fill="#e4dbc0"/>`;
      s += `<path d="M${(mx-18).toFixed(1)} ${(ay + mh*.48).toFixed(1)}
        L${(mx+32).toFixed(1)} ${(ay-3).toFixed(1)}
        Q${(mx+20).toFixed(1)} ${(ay + mh*.38).toFixed(1)} ${(mx+8).toFixed(1)} ${(ay + mh*.62).toFixed(1)} Z" fill="#f6f0dc"/>`;
      s += `<g stroke="#c9bfa2" stroke-width=".7" opacity=".65">
        <path d="M${(mx-6).toFixed(1)} ${(ay+mh*.5).toFixed(1)} L${(mx+9).toFixed(1)} ${(pied-5).toFixed(1)}"/>
        <path d="M${(mx+9).toFixed(1)} ${(ay+mh*.26).toFixed(1)} L${(mx+15).toFixed(1)} ${(pied-11).toFixed(1)}"/></g>`;
      s += `<g stroke="#c9b58c" stroke-width=".8" opacity=".75">
        <path d="M${mx} ${(ay+5).toFixed(1)} L${g(L*.1)} ${(yCreux-1).toFixed(1)}"/>
        <path d="M${mx} ${(ay+5).toFixed(1)} L${g(L*.86)} ${(yCreux-1).toFixed(1)}"/></g>`;
    }
  }

  /* ---------- le foc et son beaupré (13+) ---------- */
  if (n >= 13){
    const bx = +g(-8), by = yEtrave - 3;
    const mx = +g(L*mxP), mh = 46 + n*2.3, ay = yCreux + 1 - mh;
    s += `<path d="M${g(L*.02)} ${(yEtrave+2).toFixed(1)} L${bx} ${by.toFixed(1)}"
      stroke="#a5825c" stroke-width="2.2" stroke-linecap="round"/>`;
    s += `<path class="voile" d="M${bx} ${by.toFixed(1)} L${mx} ${(ay + mh*.2).toFixed(1)}
      Q${(bx+17).toFixed(1)} ${(ay + mh*.66).toFixed(1)} ${(bx+12).toFixed(1)} ${(yEtrave+4).toFixed(1)} Z"
      fill="#eee6cc"/>`;
    s += `<path d="M${bx} ${by.toFixed(1)} L${mx} ${(ay + mh*.2).toFixed(1)}
      Q${(bx+24).toFixed(1)} ${(ay + mh*.5).toFixed(1)} ${(bx+20).toFixed(1)} ${(ay + mh*.8).toFixed(1)} Z"
      fill="#f8f2de"/>`;
  }

  /* ---------- le tapecul (15+) ---------- */
  if (n >= 15){
    const mx2 = +g(L*.86), mh2 = 30 + n, pied2 = yCreux + 1;
    s += `<path d="M${mx2} ${pied2.toFixed(1)} v-${mh2.toFixed(0)}" stroke="#8a6a42"
      stroke-width="2.2" stroke-linecap="round"/>`;
    s += `<path d="M${(mx2-12).toFixed(1)} ${(pied2 - mh2*.44).toFixed(1)} L${(mx2+18).toFixed(1)} ${(pied2 - mh2 + 2).toFixed(1)}"
      stroke="#a5825c" stroke-width="1.9" stroke-linecap="round"/>`;
    s += `<path class="voile" d="M${(mx2-10).toFixed(1)} ${(pied2 - mh2*.42).toFixed(1)}
      L${(mx2+16).toFixed(1)} ${(pied2 - mh2 + 3).toFixed(1)}
      Q${(mx2+5).toFixed(1)} ${(pied2 - mh2*.4).toFixed(1)} ${(mx2+2).toFixed(1)} ${pied2.toFixed(1)} Z"
      fill="#e4dbc0"/>`;
  }

  /* ---------- le safran (9+) ---------- */
  if (n >= 9){
    s += `<path d="M${g(L*.97)} ${(flot - H*.5).toFixed(1)} q6 4 6 ${(T*1.1).toFixed(1)}
      q0 ${(T*.5).toFixed(1)} -6 ${(T*.5).toFixed(1)} z" fill="#7a5c38"/>`;
    s += `<path d="M${g(L*.94)} ${(yPoupe + 2).toFixed(1)} l13 -6" stroke="#a5825c"
      stroke-width="2" stroke-linecap="round"/>`;
  }

  /* ---------- le treuil (17+) ---------- */
  if (n >= 17){
    const tx = +g(L*.44);
    s += `<rect x="${(tx-4.4).toFixed(1)}" y="${(yCreux - 6).toFixed(1)}" width="9" height="6" rx="2" fill="#5c6a74"/>`;
    s += `<circle cx="${tx}" cy="${(yCreux - 3).toFixed(1)}" r="2.2" fill="#8a9299"/>`;
  }

  /* ---------- le pavillon (19+) ---------- */
  if (n >= 19){
    const mx = +g(L * mxP), mh = 46 + n * 2.3, tete = yCreux + 1 - mh;
    /* la drisse et le petit mât de pavillon */
    s += `<path d="M${mx} ${tete.toFixed(1)} v-9" stroke="#8a6a42" stroke-width="1.6" stroke-linecap="round"/>`;
    /* le pavillon, qui claque */
    s += `<g class="pavillon" style="transform-origin:${mx}px ${(tete-8).toFixed(1)}px">`;
    s += `<path d="M${mx} ${(tete-9).toFixed(1)} q9 1.6 17 -1.4 q-2 4 0 7.4 q-8 3 -17 1.4 z" fill="#c74a33"/>`;
    s += `<path d="M${mx} ${(tete-9).toFixed(1)} q9 1.6 17 -1.4 q-1 2 -.6 3.6 q-8 2.4 -16.4 1 z" fill="#e0684a"/>`;
    s += `</g>`;
  }

  /* ---------- le nom peint (20) ---------- */
  if (n >= 20)
    s += `<text x="${g(L*.1)}" y="${(flot - H*.34).toFixed(1)}" font-family="Bebas Neue,sans-serif"
      font-size="8.4" letter-spacing="1.2" fill="#f2e6c8" opacity=".85">LA ZIZOUIN</text>`;

  /* ---------- l'eau, selon l'allure ---------- */
  /* la proue est à gauche : le sillage traîne derrière, donc à droite */
  if (route){
    const nv = Math.max(2, Math.round(P.vit * 1.6));
    for (let i = 0; i < nv; i++)
      s += `<path class="sillage sl${i % 3}" d="M${g(L + 4 + i*4)} ${(flot + 1 + i*2.6).toFixed(1)}
        q${(16+i*7).toFixed(0)} 2 ${(30+i*13).toFixed(0)} 0"
        stroke="#fff" stroke-width="${(1.6 - i*.16).toFixed(2)}" fill="none"
        opacity="${(.44 - i*.05).toFixed(2)}"/>`;
    /* la moustache d'étrave, elle, est bien à l'avant */
    s += `<path class="etrave" d="M${g(-3)} ${(flot - 1).toFixed(1)} q-9 4 -19 3"
      stroke="#fff" stroke-width="2" fill="none" opacity=".55"/>`;
    s += `<path class="etrave e2" d="M${g(1)} ${(flot + 2.4).toFixed(1)} q-8 4 -17 3"
      stroke="#fff" stroke-width="1.4" fill="none" opacity=".36"/>`;
    /* le remous sous la poupe */
    s += `<ellipse class="remous" cx="${g(L + 2)}" cy="${(flot + 3).toFixed(1)}" rx="9" ry="2.4"
      fill="#fff" opacity=".24"/>`;
  } else {
    /* au mouillage : la chaîne d'ancre à l'étrave */
    s += `<path d="M${g(L*.03)} ${(yEtrave + 4).toFixed(1)} q-4 8 -3 16"
      stroke="#6d6a62" stroke-width="1.4" fill="none" stroke-dasharray="2 1.6"/>`;
    s += `<path d="M${g(-4)} ${(flot + 2).toFixed(1)} q22 3 40 0"
      stroke="#fff" stroke-width="1.2" fill="none" opacity=".26"/>`;
  }

  return s;
}

/* ================= le décor =================
   On construit la scène UNE SEULE FOIS, puis on ne touche
   plus qu'aux couleurs et à la position du soleil.
   Rien n'est recréé : la barque roule sans jamais repartir de zéro. */
let avance = 0, NIVEAU = 1;
let REF = null;                       /* les éléments qu'on fera bouger */

function melange(a, b, k){
  const hx = c => [parseInt(c.slice(1,3),16), parseInt(c.slice(3,5),16), parseInt(c.slice(5,7),16)];
  const A = hx(a), B = hx(b);
  return '#' + [0,1,2].map(i =>
    Math.round(A[i] + (B[i]-A[i]) * k).toString(16).padStart(2,'0')).join('');
}

function palette(){
  const t = avance / 100 * (HEURES.length - 1);
  const i = Math.min(HEURES.length - 2, Math.floor(t)), k = t - i;
  const A = HEURES[i], B = HEURES[i + 1];
  return {
    ciel: A.ciel.map((c, n) => melange(c, B.ciel[n], k)),
    eau:  A.eau.map((c, n) => melange(c, B.eau[n], k)),
    sol:  { x: A.sol.x + (B.sol.x - A.sol.x) * k,
            y: A.sol.y + (B.sol.y - A.sol.y) * k,
            r: A.sol.r + (B.sol.r - A.sol.r) * k },
    etoiles: A.etoiles + (B.etoiles - A.etoiles) * k,
    h: k < .5 ? A.h : B.h, m: k < .5 ? A.m : B.m
  };
}

/* ---------- on bâtit la scène, une fois pour toutes ---------- */
function batir(){
  const total = W * innerHeight / innerWidth;
  HAUT = HORIZON - total * .5;
  BAS  = HAUT + total;
  const yh = sol(4000), P = palette();

  const OFF = [0,14,32,52,68,80,90,100];
  const OFE = [0,4,14,34,66,100];

  let s = '<svg id="sc" viewBox="0 ' + HAUT.toFixed(1) + ' ' + W + ' ' + total.toFixed(1) + '" '
    + 'preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">';
  s += '<defs>';
  s += '<linearGradient id="t-ciel" x1="0" y1="0" x2="0" y2="1">'
    + P.ciel.map((c,i) => '<stop class="sc" offset="'+OFF[i]+'%" stop-color="'+c+'"/>').join('')
    + '</linearGradient>';
  s += '<linearGradient id="t-eau" x1="0" y1="0" x2="0" y2="1">'
    + P.eau.map((c,i) => '<stop class="se" offset="'+OFE[i]+'%" stop-color="'+c+'"/>').join('')
    + '</linearGradient>';
  s += '<radialGradient id="t-halo" cx="0.5" cy="0.5">'
    + '<stop offset="0%" stop-color="#fff8e0" stop-opacity=".9"/>'
    + '<stop offset="20%" stop-color="#ffe0a4" stop-opacity=".54"/>'
    + '<stop offset="100%" stop-color="#ffb870" stop-opacity="0"/></radialGradient>';
  s += '<radialGradient id="t-disque" cx="0.5" cy="0.5">'
    + '<stop offset="0%" stop-color="#fffdf4"/><stop offset="100%" stop-color="#ffdf9a"/>'
    + '</radialGradient>';
  s += '<linearGradient id="t-chemin" x1="0" y1="0" x2="0" y2="1">'
    + '<stop offset="0%" stop-color="#fff2d0" stop-opacity=".82"/>'
    + '<stop offset="20%" stop-color="#ffe0a8" stop-opacity=".46"/>'
    + '<stop offset="100%" stop-color="#ffc070" stop-opacity="0"/></linearGradient>';
  s += '<filter id="t-flou"><feGaussianBlur stdDeviation="7"/></filter></defs>';

  s += '<rect x="0" y="' + HAUT + '" width="' + W + '" height="' + (yh-HAUT).toFixed(1)
    + '" fill="url(#t-ciel)"/>';

  /* les étoiles : elles existent toujours, on ne change que leur opacité */
  s += '<g id="etoiles">';
  for (let i = 0; i < 30; i++)
    s += '<circle class="etoile e' + (i%4) + '" cx="' + (rnd(i*19+2)*W).toFixed(0)
      + '" cy="' + (HAUT + rnd(i*17+9) * 190).toFixed(0) + '" r="'
      + (.5+rnd(i*23+7)*.7).toFixed(2) + '" fill="#fff"/>';
  s += '</g>';

  /* les nuages */
  s += '<g class="nuages">';
  for (let i = 0; i < 14; i++){
    const t2 = i / 14;
    const cy = HAUT + 30 + Math.pow(t2, .6) * (170 - HAUT - 30);
    const cx = -110 + rnd(i*3+1) * 700, w = (28 + rnd(i*5+2) * 82) * (1 - t2 * .4);
    s += '<g opacity="' + (.13 + rnd(i*11+4) * .2).toFixed(2) + '" fill="#fff">'
      + '<ellipse cx="' + cx.toFixed(0) + '" cy="' + cy.toFixed(1) + '" rx="' + w.toFixed(0)
      + '" ry="' + (2.6 + rnd(i*7+3)*3).toFixed(1) + '"/></g>';
  }
  s += '</g>';

  /* le soleil : deux formes qu'on déplacera */
  s += '<ellipse id="halo" cx="' + P.sol.x.toFixed(0) + '" cy="' + P.sol.y.toFixed(0)
    + '" rx="250" ry="150" fill="url(#t-halo)"/>';
  s += '<circle id="disque" cx="' + P.sol.x.toFixed(0) + '" cy="' + P.sol.y.toFixed(0)
    + '" r="' + P.sol.r.toFixed(1) + '" fill="url(#t-disque)"/>';

  /* l'eau */
  s += '<rect x="0" y="' + yh.toFixed(1) + '" width="' + W + '" height="'
    + (BAS - yh + 4).toFixed(1) + '" fill="url(#t-eau)"/>';

  /* le chemin du soleil : un groupe qu'on translate et qu'on estompe */
  s += '<g id="chemin"><path d="M-14 ' + yh.toFixed(1) + ' L14 ' + yh.toFixed(1)
    + ' L120 ' + (BAS+16).toFixed(1) + ' L-120 ' + (BAS+16).toFixed(1) + ' Z" '
    + 'fill="url(#t-chemin)" filter="url(#t-flou)"/></g>';

  /* les paillettes, dans le même groupe mouvant */
  s += '<g id="paillettes">';
  for (let i = 0; i < 130; i++){
    const t2 = Math.pow(rnd(i*3+1), .7);
    const y = yh + 2 + t2 * (BAS - yh - 4);
    const etal = 16 + t2 * 130;
    const dx = (rnd(i*7+2) - .5) * 2 * etal;
    const w = (1.2 + t2 * 14) * (.35 + rnd(i*11+3));
    const hh = Math.max(.5, (.4 + t2 * 1.8) * (.5 + rnd(i*13+4)));
    const op = (.22 + rnd(i*17+5) * .55)
      * Math.pow(Math.max(0, 1 - Math.abs(dx) / (etal * 1.1)), 1.5);
    if (op <= .04) continue;
    s += '<rect class="paill p' + (i%6) + '" x="' + (dx-w/2).toFixed(1) + '" y="' + y.toFixed(1)
      + '" width="' + w.toFixed(1) + '" height="' + hh.toFixed(1) + '" rx="' + (hh/2).toFixed(1)
      + '" fill="' + (i % 5 ? '#ffe9b4' : '#fffdf0') + '" data-op="' + op.toFixed(3) + '"/>';
  }
  s += '</g>';

  /* la houle */
  for (let n = 0; n < 8; n++){
    const d = 1200 / Math.pow(n + 1, 1.2);
    const y = sol(d), amp = px(.3, d), esp = px(8, d);
    if (y > BAS - 2 || y < yh) continue;
    s += '<g class="onde o' + (n%4) + '">';
    for (let i = 0; i < 2; i++){
      const yy = y + i * esp * .4;
      if (yy > BAS - 2) break;
      let p = 'M-120 ' + yy.toFixed(1) + ' ';
      for (let k = 0; k < 18; k++) p += 'q' + (esp*.5).toFixed(1) + ' ' + (-amp).toFixed(1)
        + ' ' + esp.toFixed(1) + ' 0 ';
      s += '<path d="' + p + '" stroke="#fff" stroke-width="' + Math.max(.4, amp*.3).toFixed(2)
        + '" fill="none" opacity="' + (.14 - n*.013).toFixed(3) + '"/>';
    }
    s += '</g>';
  }

  /* ta barque : posée une fois, elle roule sans interruption */
  const d2 = 44, y2 = sol(d2);
  const k2 = px(4.4 + NIVEAU * .18, d2) / (76 + NIVEAU * 5.6);
  s += '<ellipse cx="240" cy="' + (y2+2).toFixed(1) + '" rx="' + px(4,d2).toFixed(1)
    + '" ry="' + px(.5,d2).toFixed(1) + '" fill="#0e2a44" opacity=".22"/>';
  s += '<g transform="translate(240,' + y2.toFixed(1) + ') scale(' + k2.toFixed(4) + ')">'
    + '<g class="barque" transform="translate(-150,-122)">' + barqueQ(NIVEAU, true) + '</g></g>';

  document.getElementById('mer').innerHTML = s + '</svg>';

  /* on garde la main sur ce qui bougera */
  REF = {
    ciel: [...document.querySelectorAll('#sc .sc')],
    eau:  [...document.querySelectorAll('#sc .se')],
    halo: document.getElementById('halo'),
    disque: document.getElementById('disque'),
    chemin: document.getElementById('chemin'),
    paill: document.getElementById('paillettes'),
    etoiles: document.getElementById('etoiles'),
    grains: [...document.querySelectorAll('#paillettes rect')]
  };
  peindre();
}

/* ---------- on ne fait que repeindre : aucune forme n'est recréée ---------- */
function peindre(){
  if (!REF) return;
  const P = palette();
  REF.ciel.forEach((s, i) => s.setAttribute('stop-color', P.ciel[i]));
  REF.eau.forEach((s, i) => s.setAttribute('stop-color', P.eau[i]));
  REF.halo.setAttribute('cx', P.sol.x.toFixed(1));
  REF.halo.setAttribute('cy', P.sol.y.toFixed(1));
  REF.disque.setAttribute('cx', P.sol.x.toFixed(1));
  REF.disque.setAttribute('cy', P.sol.y.toFixed(1));
  REF.disque.setAttribute('r', P.sol.r.toFixed(1));
  REF.etoiles.setAttribute('opacity', (P.etoiles * .7).toFixed(2));

  /* le chemin et les paillettes suivent le soleil */
  const bas2 = 1 - Math.min(1, Math.abs(P.sol.y - HORIZON) / 150);
  const t = 'translate(' + P.sol.x.toFixed(1) + ',0)';
  REF.chemin.setAttribute('transform', t);
  REF.chemin.setAttribute('opacity', bas2.toFixed(2));
  REF.paill.setAttribute('transform', t);
  REF.paill.setAttribute('opacity', bas2.toFixed(2));
  REF.grains.forEach(g => g.setAttribute('opacity', g.dataset.op));
}

function journal(txt, fort){
  const el = document.getElementById('journal');
  const p = document.createElement('p');
  if (fort) p.className = 'fort';
  p.textContent = txt;
  el.appendChild(p);
  /* on ne garde que les trois dernières lignes */
  while (el.children.length > 2) el.removeChild(el.firstChild);
}

  batir();

  const P = PALIERS_B[NIVEAU - 1];
  /* le serveur exige 20 secondes : on en montre 24 pour être sûr */
  const duree = 24000;
  const debut = Date.now() - Math.min(duree, ecoule * 1000);

  const boucle = setInterval(() => {
    avance = Math.min(100, (Date.now() - debut) / duree * 100);
    const p = palette();
    document.getElementById('jg').style.width = avance + '%';
    document.getElementById('heure').textContent = p.h;
    document.getElementById('moment').textContent = p.m;
    document.getElementById('reste').textContent =
      avance >= 100 ? 'Arrivé' : Math.max(1, Math.round((100 - avance) / 100 * 24)) + ' h de mer';
    peindre();

    while (dit < CARNET.length && avance >= CARNET[dit][0]){
      journal(CARNET[dit][1], CARNET[dit][2]); dit++;
    }

    if (avance >= 100){
      clearInterval(boucle);
      arriver();
    }
  }, 250);
})();

async function arriver(){
  document.getElementById('cap').textContent = 'Barcelone';
  const bt = document.getElementById('arriver');
  const r = await BD.agir('accoster');
  if (r.ok){
    bt.classList.add('on');
    bt.onclick = () => location.href = 'barcelone.html';
  } else if (r.pourquoi === 'trop_tot'){
    /* le serveur trouve que c'est trop tôt : on attend le temps qu'il dit */
    setTimeout(arriver, ((r.reste || 2) + 1) * 1000);
  } else {
    bt.textContent = 'Retour au port';
    bt.classList.add('on');
    bt.onclick = () => location.href = 'jeu.html';
  }
}
