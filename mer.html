<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#f5a53a" id="tc">
<title>Battle Dock — En mer</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="couleurs.css?v=2">
<style>
/* ============================================================
   EN MER — l'affiche
   Deux aplats francs séparés d'une ligne d'horizon nette. Le
   disque traverse le ciel : sa course EST la traversée. Pas de
   jauge, pas de carte posée par-dessus — le décor dit tout.
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none}
:root{
  --encre:#12303f; --creme:#fdf6e6; --or:#f0a92e;
  --ciel:#f0a94e; --eau:#2b6f92; --disque:#fff0c4;
}
html,body{height:100%;overflow:hidden;font-family:'Nunito',system-ui,sans-serif;
  background:var(--eau);color:var(--creme)}

/* ---------- le ciel ---------- */
#ciel{position:fixed;left:0;right:0;top:0;height:62%;z-index:-3;
  background:var(--ciel)}
/* ---------- l'eau, et la ligne d'horizon qui les sépare ---------- */
#eau{position:fixed;left:0;right:0;bottom:0;height:38%;z-index:-3;
  background:var(--eau);border-top:4px solid var(--encre)}

/* ---------- les étoiles ---------- */
#etoiles{position:fixed;left:0;right:0;top:0;height:62%;z-index:-2;opacity:0;
  pointer-events:none;transition:opacity .5s linear;
  background-image:
    radial-gradient(1.7px 1.7px at 11% 20%,#fff6e0 50%,transparent 51%),
    radial-gradient(1.4px 1.4px at 29% 8%, #fff6e0 50%,transparent 51%),
    radial-gradient(2.1px 2.1px at 47% 28%,#fff6e0 50%,transparent 51%),
    radial-gradient(1.4px 1.4px at 63% 12%,#fff6e0 50%,transparent 51%),
    radial-gradient(1.8px 1.8px at 81% 24%,#fff6e0 50%,transparent 51%),
    radial-gradient(1.4px 1.4px at 19% 38%,#fff6e0 50%,transparent 51%),
    radial-gradient(1.7px 1.7px at 55% 44%,#fff6e0 50%,transparent 51%),
    radial-gradient(1.4px 1.4px at 91% 7%, #fff6e0 50%,transparent 51%),
    radial-gradient(1.9px 1.9px at 73% 36%,#fff6e0 50%,transparent 51%),
    radial-gradient(1.4px 1.4px at 36% 52%,#fff6e0 50%,transparent 51%),
    radial-gradient(1.5px 1.5px at 6% 48%, #fff6e0 50%,transparent 51%),
    radial-gradient(1.6px 1.6px at 96% 42%,#fff6e0 50%,transparent 51%)}

/* ---------- le disque : sa course dit où tu en es ---------- */
#disque{position:fixed;z-index:-2;width:26vw;max-width:132px;aspect-ratio:1;
  border-radius:50%;margin:-13vw 0 0 -13vw;pointer-events:none;
  background:var(--disque);border:4px solid var(--encre)}

/* ---------- la houle : trois rangs de tirets ---------- */
.houle{position:fixed;left:-60%;right:-60%;z-index:-1;height:5px;border-radius:3px;
  background:repeating-linear-gradient(90deg,#fdf6e6 0 26px,transparent 26px 62px);
  will-change:transform}
.h1{bottom:29%;opacity:.16;animation:file 14s linear infinite}
.h2{bottom:22%;opacity:.2;height:6px;animation:file 10s linear infinite reverse}
.h3{bottom:12%;opacity:.26;height:8px;animation:file 7s linear infinite}
@keyframes file{to{transform:translateX(62px)}}

/* ---------- la barque, posée sur l'horizon ---------- */
/* ---------- le convoi ----------
   Trois barques plus petites et plus loin, donc plus haut sur
   l'écran et plus lentes. Elles arrivent l'une après l'autre. */
#convoi{position:fixed;left:0;right:0;bottom:34%;height:200px;z-index:-1;
  pointer-events:none}
#convoi i{position:absolute;display:block;opacity:0}
#convoi i svg{display:block;width:100%;height:auto}
#convoi .v1{left:14%;bottom:64px;width:62px;animation:venir1 2.2s .4s forwards,
  tangue 5.6s .4s ease-in-out infinite}
#convoi .v2{right:12%;bottom:88px;width:50px;animation:venir1 2.2s 1.5s forwards,
  tangue 6.4s 1.5s ease-in-out infinite}
#convoi .v3{left:34%;bottom:116px;width:38px;animation:venir1 2.2s 2.7s forwards,
  tangue 7.2s 2.7s ease-in-out infinite}
@keyframes venir1{from{opacity:0;transform:translateY(14px)}
  to{opacity:1;transform:none}}
@keyframes tangue{0%,100%{transform:translateY(0) rotate(-1.6deg)}
  50%{transform:translateY(-5px) rotate(1.6deg)}}

#barque{position:fixed;left:50%;bottom:34%;z-index:0;width:126px;margin-left:-63px;
  animation:souleve 4.8s ease-in-out infinite;will-change:transform}
#barque svg{display:block;width:100%;height:auto;
  animation:penche 4.8s ease-in-out infinite;transform-origin:50% 88%}
@keyframes souleve{0%,50%,100%{transform:translateY(0)}
  25%{transform:translateY(-8px)}75%{transform:translateY(6px)}}
@keyframes penche{0%{transform:rotate(2.4deg)}25%{transform:rotate(0)}
  50%{transform:rotate(-2.4deg)}75%{transform:rotate(0)}100%{transform:rotate(2.4deg)}}

/* ---------- le cap, écrit à même le ciel ---------- */
.haut{position:fixed;left:24px;right:24px;z-index:3;
  top:calc(env(safe-area-inset-top) + 26px)}
.haut .de{font-size:10px;font-weight:800;letter-spacing:.28em;text-transform:uppercase;
  color:rgba(253,246,230,.68)}
.haut .nom{font-family:'DM Serif Display',Georgia,serif;
  font-size:clamp(40px,13vw,64px);line-height:.94;margin-top:9px;
  color:var(--creme);text-shadow:0 3px 0 rgba(18,48,63,.24)}
/* le filet, coupé par l'heure du bord */
.haut .fil{display:flex;align-items:center;gap:12px;margin-top:16px}
.haut .fil i{flex:1;height:3px;border-radius:2px;background:rgba(253,246,230,.36)}
.haut .fil span{font-size:11px;font-weight:800;letter-spacing:.2em;
  color:rgba(253,246,230,.9);white-space:nowrap}

/* ---------- le mot du moment, à même l'eau ---------- */
.bas{position:fixed;left:24px;right:24px;z-index:4;
  bottom:calc(env(safe-area-inset-bottom) + 24px);text-align:center}
.bas .mot{font-family:'DM Serif Display',Georgia,serif;font-size:20px;line-height:1.25;
  color:var(--creme);text-shadow:0 2px 12px rgba(8,24,38,.4)}
.bas .reste{font-size:10.5px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;
  color:rgba(253,246,230,.6);margin-top:11px}

.arriver{width:100%;margin-top:22px;padding:20px;border-radius:18px;cursor:pointer;
  font-family:'DM Serif Display',Georgia,serif;font-size:22px;color:var(--encre);
  background:var(--or);border:4px solid var(--encre);
  opacity:0;transform:translateY(14px);pointer-events:none;
  transition:opacity .7s,transform .7s cubic-bezier(.2,.8,.3,1),background .12s}
.arriver.on{opacity:1;transform:none;pointer-events:auto}
.arriver:active{background:#d9962a}

/* la chèvre sur le pont : elle broute, elle remue la queue,
   et sa clochette sonne quand la barque pique du nez */
.qq{animation:queue2 2.1s ease-in-out infinite;transform-box:fill-box;
  transform-origin:0 50%}
@keyframes queue2{0%,100%{transform:rotate(0)}50%{transform:rotate(-18deg)}}
.tetee{animation:broute 6.5s ease-in-out infinite;transform-box:fill-box;
  transform-origin:80% 30%}
@keyframes broute{0%,58%,100%{transform:rotate(0)}
  68%{transform:rotate(16deg)}78%{transform:rotate(14deg)}88%{transform:rotate(0)}}
.cloche{animation:sonne 4.8s ease-in-out infinite;transform-box:fill-box;
  transform-origin:50% 0}
@keyframes sonne{0%,100%{transform:rotate(0)}
  46%{transform:rotate(11deg)}54%{transform:rotate(-9deg)}62%{transform:rotate(0)}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
:focus-visible{outline:3px solid #fffaf0;outline-offset:2px}

/* ---------- l'aube, le temps que la page se pose ---------- */
#charge{position:fixed;inset:0;z-index:90;background:#f0a94e;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
  transition:opacity .45s ease}
#charge.parti{opacity:0;pointer-events:none}
#charge .ti{font-family:'DM Serif Display',Georgia,serif;font-size:27px;color:#fffaf0}
#charge .fl{width:118px;height:3px;border-radius:2px;
  background:rgba(255,250,240,.28);overflow:hidden}
#charge .fl i{display:block;width:38%;height:100%;border-radius:2px;background:#fffaf0;
  animation:vague 1.15s ease-in-out infinite}
@keyframes vague{0%{transform:translateX(-115%)}100%{transform:translateX(275%)}}
</style>
</head>
<body>

<div id="charge"><div class="ti">Battle Dock</div><div class="fl"><i></i></div></div>

<div id="ciel"></div>
<div id="etoiles"></div>
<div id="disque"></div>
<div id="eau"></div>
<i class="houle h1"></i><i class="houle h2"></i><i class="houle h3"></i>

<div id="convoi"></div>

<div id="barque">
  <svg viewBox="0 0 126 76" xmlns="http://www.w3.org/2000/svg">
    <path d="M63 6 L100 54 L65 54 Z" fill="#fdf6e6" stroke="#12303f"
      stroke-width="4" stroke-linejoin="round"/>
    <path d="M59 18 L28 54 L59 54 Z" fill="#f0a92e" stroke="#12303f"
      stroke-width="4" stroke-linejoin="round"/>
    <rect x="59" y="4" width="5" height="52" rx="2.5" fill="#12303f"/>
    <path d="M10 54 q53 22 106 0 l-12 16 q-42 12 -82 0 Z" fill="#12303f"/>
    <g id="passagere" style="display:none"></g>
  </svg>
</div>

<div class="haut">
  <p class="de" id="de">—</p>
  <p class="nom" id="nom">—</p>
  <p class="fil"><i></i><span id="heure">—</span><i></i></p>
</div>

<div class="bas">
  <p class="mot" id="mot">—</p>
  <p class="reste" id="reste">—</p>
  <button class="arriver" id="arriver">Débarquer</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="bd.js?v=4"></script>
<script src="son.js?v=1"></script>
<script>
/* ---------- mélanger deux couleurs ---------- */
const hx = c => [parseInt(c.slice(1,3),16), parseInt(c.slice(3,5),16), parseInt(c.slice(5,7),16)];
const ch = a => '#' + a.map(v => Math.round(v).toString(16).padStart(2,'0')).join('');
const mel = (a, b, k) => { const A = hx(a), B = hx(b);
  return ch([0,1,2].map(i => A[i] + (B[i]-A[i]) * k)); };

/* la lumière de chaque port : un ciel, une eau, un disque */
const CIELS = {
  anse:      { ciel:'#f0a94e', eau:'#2b6f92', sol:'#fff0c4' },
  barcelone: { ciel:'#e88a44', eau:'#1f5a80', sol:'#fff0c4' },
  ajaccio:   { ciel:'#dd9aa4', eau:'#2a5f74', sol:'#fff0dc' },
  palma:     { ciel:'#f2c866', eau:'#188498', sol:'#fff8dc' }
};
/* le large, au milieu : la nuit */
const LARGE = { ciel:'#1c2c4a', eau:'#122536', sol:'#e8eef8' };

const GRAND= { anse:'Marseille', barcelone:'Barcelone', palma:'Palma', ajaccio:'Ajaccio' };
const MOT  = { barcelone:'Débarquer à Barcelone', palma:'Débarquer à Palma',
               ajaccio:'Débarquer à Ajaccio', anse:'Rentrer chez toi' };

let DE = 'anse', VERS = 'barcelone', JOURS = 1;

/* quand on voyage avec la chèvre, la traversée n'est plus la même :
   elle s'occupe, et elle s'occupe de ta cargaison */
const AVEC_ROSINE = [
  "Le port s'efface. Elle regarde derrière, elle.",
  "Elle a trouvé le sac de cordages. Elle mange le sac.",
  "La lumière baisse. Elle s'est couchée contre la voile.",
  "Elle bêle une fois dans la nuit, sans raison. Puis plus rien.",
  "Le ciel pâlit. Elle t'a pris ta place à l'abri du vent.",
  "Une côte, là-bas. Elle la voit avant toi.",
  "On entre dans le port. Elle descend la première."
];

function moment(p){
  const i = p < 8 ? 0 : p < 24 ? 1 : p < 42 ? 2 : p < 58 ? 3
          : p < 76 ? 4 : p < 92 ? 5 : 6;
  /* le convoi raconte les deux premiers moments, puis s'efface */
  if (CONVOI && i < 2) return CONVOI[i];
  if (ROSINE) return AVEC_ROSINE[i];
  if (i === 3) return JOURS > 1 ? 'Deux nuits à tenir' : 'La nuit, seul à la barre';
  return ["Le port s'efface derrière toi", "Plus rien que de l'eau",
    'La lumière baisse', '', "Le ciel pâlit à l'avant", 'Une côte, là-bas',
    'On entre dans le port'][i];
}

function heureDe(p){
  const h = (8 + JOURS * 24 * p / 100) % 24;
  return String(Math.floor(h)).padStart(2, '0')
    + ':' + String(Math.floor((h % 1) * 12) * 5).padStart(2, '0');
}

/* ---------- peindre : trois couleurs et une position ---------- */
const R = document.documentElement.style;
let dernierTc = '';
function peindre(p){
  const A = CIELS[DE] || CIELS.anse, B = CIELS[VERS] || CIELS.barcelone;
  const t = Math.min(1, Math.max(0, p / 100));
  const k = Math.sin(Math.PI * t) * .94;      /* à quel point on est au large */
  const c = mel(mel(A.ciel, B.ciel, t), LARGE.ciel, k);

  R.setProperty('--ciel', c);
  R.setProperty('--eau',  mel(mel(A.eau, B.eau, t), LARGE.eau, k));
  R.setProperty('--disque', mel(mel(A.sol, B.sol, t), LARGE.sol, k));

  /* le disque décrit son arc : c'est lui, la jauge */
  const d = document.getElementById('disque');
  d.style.left = (8 + t * 84) + '%';
  d.style.top  = (60 - Math.sin(Math.PI * t) * 44) + '%';

  document.getElementById('etoiles').style.opacity = (k * .95).toFixed(2);

  if (c !== dernierTc){
    document.getElementById('tc').setAttribute('content', c);
    dernierTc = c;
  }
}

let ROSINE = false, CONVOI = null;

/* ============================================================
   LA PASSAGÈRE
   Quand on porte la chèvre du cirque, elle est sur le pont.
   Elle broute la cargaison, elle regarde la mer, elle bêle
   quand la barque tangue. Elle ne sert à rien : c'est le but.
   ============================================================ */
function rosineAbord(){
  var c = '#d8cfc0', f = '#3a2a22';
  var s = '<g transform="translate(40,40) scale(0.30)">';
  /* les pattes, plantées sur le pont */
  s += '<path d="M-20 -26 v26 M-9 -26 v27 M9 -26 v27 M20 -26 v26" stroke="' + f
    + '" stroke-width="6" stroke-linecap="round"/>';
  /* le corps */
  s += '<ellipse cx="0" cy="-38" rx="30" ry="18" fill="' + c + '"/>';
  s += '<ellipse cx="-6" cy="-42" rx="21" ry="10" fill="#ffffff" opacity=".22"/>';
  /* la queue, qui remue avec la houle */
  s += '<path class="qq" d="M28 -44 l10 -8 l-2 9 z" fill="' + c + '"/>';
  /* le cou et la tête, tournés vers l'avant du bateau */
  s += '<g class="tetee">';
  s += '<path d="M-24 -44 q-14 -6 -20 -20 l12 -6 q8 12 16 16 z" fill="' + c + '"/>';
  s += '<ellipse cx="-46" cy="-70" rx="14" ry="10" fill="' + c + '"/>';
  s += '<ellipse cx="-58" cy="-64" rx="7" ry="6" fill="#efe6da"/>';
  s += '<circle cx="-61" cy="-65" r="1.8" fill="' + f + '"/>';
  s += '<path d="M-40 -78 q-10 -8 -18 -4 q8 6 16 8 z" fill="' + c + '"/>';
  s += '<path d="M-44 -80 q-6 -18 6 -24 q-4 10 0 22 M-36 -80 q-4 -16 8 -20'
    + ' q-6 8 -2 18" stroke="' + f + '" stroke-width="4.4" fill="none"'
    + ' stroke-linecap="round"/>';
  s += '<ellipse cx="-50" cy="-73" rx="4.6" ry="4.2" fill="#efe6da"/>';
  s += '<circle cx="-50" cy="-73" r="2.6" fill="' + f + '"/>';
  s += '<path d="M-56 -56 q-2 10 2 14 q4 -6 3 -14 z" fill="' + c + '"/>';
  s += '</g>';
  /* la clochette, qui sonne à chaque creux */
  s += '<path d="M-34 -56 q10 6 20 2" stroke="#8a2420" stroke-width="3.4" fill="none"/>';
  s += '<g class="cloche"><path d="M-26 -50 q-4 8 4 10 q8 -2 4 -10 z" fill="#d4a03a"'
    + ' stroke="#8a6a20" stroke-width="1.8"/>'
    + '<circle cx="-22" cy="-39" r="2.2" fill="#8a6a20"/></g>';
  return s + '</g>';
}

/* ============================================================
   LE CONVOI DU CIRQUE
   Trois barques, une par personnage. On les reconnaît à ce
   qu'elles portent : un nez rouge, un registre, un fichu noir.
   ============================================================ */
function barqueDeLoin(qui){
  var s = '<svg viewBox="0 0 100 74" xmlns="http://www.w3.org/2000/svg">';
  /* la coque, sombre à contre-jour */
  s += '<path d="M8 52 q42 18 84 0 l-10 14 q-33 10 -64 0 z" fill="#12303f"/>';
  s += '<path d="M8 52 q42 18 84 0" stroke="#3a5c70" stroke-width="2.4" fill="none"/>';
  /* le mât et la voile, en crème */
  s += '<rect x="47" y="10" width="4" height="42" rx="2" fill="#12303f"/>';
  s += '<path d="M51 14 L74 50 L51 50 Z" fill="#fdf6e6" opacity=".92"/>';

  if (qui === 'don'){
    /* lui est debout à l'avant, bras ouverts, le nez rouge visible */
    s += '<path d="M26 52 v-16 q0 -7 6 -7 q6 0 6 7 v16 z" fill="#241820"/>';
    s += '<path d="M26 38 q-8 4 -10 12 M38 38 q8 4 10 12" stroke="#241820"'
      + ' stroke-width="3.4" fill="none" stroke-linecap="round"/>';
    s += '<circle cx="32" cy="27" r="6" fill="#c9925e"/>';
    s += '<circle cx="32" cy="28" r="2.4" fill="#e0352c"/>';
  }
  if (qui === 'pasquale'){
    /* lui rame, et il a son registre coincé sous le bras */
    s += '<path d="M28 52 v-14 q0 -6 5 -6 q5 0 5 6 v14 z" fill="#4a5a44"/>';
    s += '<circle cx="33" cy="29" r="5.4" fill="#c9925e"/>';
    s += '<path d="M20 44 l-12 8" stroke="#8a6a48" stroke-width="2.6"'
      + ' stroke-linecap="round"/>';
    s += '<rect x="38" y="36" width="8" height="10" rx="1.4" fill="#e8dcc8"/>';
  }
  if (qui === 'mamma'){
    /* elle est assise, immobile, et elle regarde droit devant */
    s += '<path d="M30 52 q-2 -18 8 -18 q10 0 8 18 z" fill="#1a1218"/>';
    s += '<circle cx="38" cy="30" r="6" fill="#1a1218"/>';
    s += '<path d="M32 30 q6 -8 12 0 q-2 -8 -6 -8 q-4 0 -6 8 z" fill="#141018"/>';
  }
  /* son sillage */
  s += '<path d="M6 66 q44 8 88 0" stroke="#fdf6e6" stroke-width="2"'
    + ' opacity=".22" fill="none"/>';
  return s + '</svg>';
}

/* on ne le voit qu'une fois : c'est le serveur qui le dit */
async function peutEtreLeConvoi(){
  var x;
  try { x = await BD.agir('cirque_convoi'); } catch(e){ return; }
  if (!x || !x.ok) return;

  var z = document.getElementById('convoi');
  z.innerHTML = '<i class="v1">' + barqueDeLoin('don') + '</i>'
    + '<i class="v2">' + barqueDeLoin('pasquale') + '</i>'
    + '<i class="v3">' + barqueDeLoin('mamma') + '</i>';
  CONVOI = [x.mot, x.suite];
  BD.vibrer([14, 90, 14]); BD.sonner('depart');
}

/* ============================================================
   LA TRAVERSÉE
   ============================================================ */
let AUBE = false;
function leverAube(){
  if (AUBE) return;
  AUBE = true;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    const ch = document.getElementById('charge');
    if (!ch) return;
    ch.classList.add('parti');
    setTimeout(() => ch.remove(), 500);
  }));
}
setTimeout(leverAube, 6000);

function poser(p){
  peindre(p);
  document.getElementById('heure').textContent = heureDe(p);
  document.getElementById('mot').textContent = moment(p);
  document.getElementById('reste').textContent = p >= 100 ? 'Tu es arrivé'
    : 'Encore ' + Math.max(1, Math.round((100 - p) / 100 * JOURS * 24)) + ' h de mer';
}

(async () => {
  let d;
  try {
    d = await BD.charger();
    if (!d){ location.href = 'index.html'; return; }
  } catch(e){ leverAube(); return; }

  /* on n'est en mer que si le serveur l'a noté */
  if (!d.parti_le){ location.href = 'jeu.html'; return; }

  /* la chèvre du cirque monte sur le pont, si elle est du voyage */
  if ((d.cale || []).some(function(e){ return e && e.k === 'rosine'; })){
    var g = document.getElementById('passagere');
    if (g){ g.innerHTML = rosineAbord(); g.style.display = ''; }
    ROSINE = true;
    /* et la première fois qu'on quitte la Corse avec elle,
       tout le cirque sort en mer derrière nous */
    if (d.port === 'ajaccio' && d.cap === 'anse') peutEtreLeConvoi();
  }

  VERS = d.cap || 'barcelone';
  DE = (d.port && d.port !== VERS) ? d.port : 'anse';
  JOURS = ['palma','ajaccio'].includes(VERS) || ['palma','ajaccio'].includes(DE) ? 2 : 1;

  document.getElementById('de').textContent = 'Cap sur';
  document.getElementById('nom').textContent = GRAND[VERS] || VERS;

  /* le temps déjà écoulé compte : on reprend la traversée où elle en est */
  const ecoule = (Date.now() - new Date(d.parti_le).getTime()) / 1000;
  /* le serveur laisse accoster au bout de 6 s : on en montre 8,
     pour garder une marge et ne jamais tomber sur un « trop tôt ». */
  const duree = 8000;
  const debut = Date.now() - Math.min(duree, ecoule * 1000);

  let fait = false, avance = 0;

  function image(){
    avance = Math.min(100, (Date.now() - debut) / duree * 100);
    poser(avance);
    if (avance >= 100 && !fait){ fait = true; arriver(); }
  }

  /* requestAnimationFrame s'arrête quand l'écran s'éteint et ne repart pas
     toujours : on le relance au retour, et un minuteur veille par-dessus. */
  let enCours = false;
  function relancer(){
    if (fait || enCours) return;
    enCours = true;
    requestAnimationFrame(function boucle(){
      enCours = true;
      image();
      if (!fait) requestAnimationFrame(boucle); else enCours = false;
    });
  }
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden){ enCours = false; image(); relancer(); }
  });
  addEventListener('pageshow', () => { enCours = false; image(); relancer(); });
  addEventListener('focus', () => { enCours = false; relancer(); });
  const secours = setInterval(() => {
    if (fait){ clearInterval(secours); return; }
    if (document.hidden) return;
    image();
    if (!enCours) relancer();
  }, 900);

  image();
  relancer();
  leverAube();
})();

async function arriver(){
  const bt = document.getElementById('arriver');
  const r = await BD.agir('accoster');
  if (r && r.ok){
    /* le premier drap à Barcelone : la planche se joue avant tout le reste */
    if (r.livraison && r.livraison.enchere){ location.href = 'drap.html'; return; }
    const PAGE = { barcelone:'barcelone.html', palma:'palma.html',
                   ajaccio:'ajaccio.html', anse:'jeu.html' };
    let suite = PAGE[r.port] || 'jeu.html';
    let m = MOT[r.port] || 'Débarquer';
    if (r.niveau && r.niveau.monte){ suite = 'niveau.html'; m = 'Tu as changé de niveau'; }
    else if (r.port === 'anse'){
      try {
        const f = await BD.charger();
        const aCaisse = (f.cale || []).some(o => o && o.quoi === 'caisse');
        const vecue = (f.rencontres || []).includes('caisse_toussaint');
        if (aCaisse && !vecue){ suite = 'retour.html'; m = 'Débarquer'; }
      } catch(e){}
    }
    bt.textContent = m;
    bt.classList.add('on');
    bt.onclick = () => location.href = suite;
  } else if (r && r.pourquoi === 'trop_tot'){
    /* le serveur trouve que c'est trop tôt : on attend le temps qu'il dit */
    setTimeout(arriver, ((r.reste || 2) + 1) * 1000);
  } else {
    bt.textContent = 'Retour au port';
    bt.classList.add('on');
    bt.onclick = () => location.href = 'jeu.html';
  }
}
</script>
