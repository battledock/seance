<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#f5a53a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Le classement — Battle Dock</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="couleurs.css?v=2">
<link rel="stylesheet" href="chaud.css?v=3">
<script>
/* ---------- le ciel du port où l'on se trouve ----------
   Posé avant la première image, pour ne pas ouvrir sur l'ocre de
   Marseille puis basculer. Le port est retenu par le hub. */
(function(){
  const C = { anse:['#f5a53a','#eeb455','#c9b978','#3f87a6','#2b6f92'],
    barcelone:['#e8873f','#c9686a','#8a5f84','#3f5f82','#1c3350'],
    palma:['#f6d97a','#e8b45c','#88b8a8','#2f92a4','#14566a'],
    ajaccio:['#e8a8a0','#c98fa0','#8f8fa8','#3f7f92','#17475c'] };
  let p = 'anse';
  try { p = localStorage.getItem('bd-port') || 'anse'; } catch(e){}
  const ci = C[p] || C.anse;
  const R = document.documentElement.style;
  ci.forEach((v, i) => R.setProperty('--h' + (i + 1), v));
  const m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', ci[0]);
})();

  /* le pied dit le port où l'on est, pas Marseille en toutes lettres */
  (function(){
    const N = { anse:'Marseille', barcelone:'Barcelone',
                palma:'Palma', ajaccio:'Ajaccio' };
    let p = 'anse';
    try { p = localStorage.getItem('bd-port') || 'anse'; } catch(e){}
    const el = document.querySelector('.pied');
    if (el) el.textContent = 'Battle Dock — ' + (N[p] || 'Marseille');
  })();
</script>
<style>
/* on recouvre le dégradé commun de chaud.css */
html{background:var(--h5,#2b6f92)}
body::before{background:linear-gradient(180deg,
  var(--h1,#f5a53a) 0%, var(--h2,#eeb455) 16%, var(--h3,#c9b978) 38%,
  var(--h4,#3f87a6) 70%, var(--h5,#2b6f92) 100%)}
</style>
<style>
.pod{display:flex;align-items:flex-end;gap:10px;margin-bottom:20px}
.mar{flex:1;display:flex;flex-direction:column;align-items:center;gap:9px;
  padding:15px 8px 13px;border-radius:16px;position:relative;
  background:var(--creme);border:3px solid var(--encre);}
.mar .av{width:48px;height:48px;border-radius:14px;overflow:hidden;
  background:var(--creme2);border:2.5px solid var(--encre)}
.mar .av svg{width:100%;height:100%;display:block}
.mar .nm{font-size:13px;font-weight:800;max-width:100%;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.mar .eu{font-family:'DM Serif Display',Georgia,serif;font-size:17px}
.mar .rg{position:absolute;top:-11px;left:50%;margin-left:-15px;width:30px;height:30px;
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:'DM Serif Display',Georgia,serif;font-size:16px;
  background:var(--creme2);border:3px solid var(--encre)}
.mar.un{padding-top:22px;padding-bottom:17px;background:var(--or)}
.mar.un .av{width:58px;height:58px;border-radius:16px}
.mar.un .nm{font-size:15px}
.mar.un .eu{font-size:20px}
.mar.un .rg{background:var(--creme);width:34px;height:34px;margin-left:-17px;
  font-size:18px;top:-13px}
.mar.un .cr{position:absolute;top:6px;right:9px;font-size:19px}
/* ---------- capitaines et joueurs ----------
   Le plus lisible, c'est la couleur : un joueur est en bleu d'encre,
   un capitaine en gris-vert et sur fond rayé. On les distingue d'un
   coup d'œil, sans avoir à lire l'étiquette. */
.lg.cap{background:
  repeating-linear-gradient(135deg,
    rgba(122,140,132,.1) 0 6px, rgba(122,140,132,0) 6px 12px)}
.lg.cap .co b{color:#5c7068}
.lg.cap .co span{color:rgba(92,112,104,.7)}
.lg.cap .eu{color:#5c7068}
.lg.cap .rg{color:rgba(92,112,104,.6)}
/* et son portrait porte un cadre de la même couleur */
.av.cap{box-shadow:0 0 0 3px #7a8c84 inset;border-color:#7a8c84}

/* un joueur, lui, reste en encre pleine */
.lg .co b{color:#12303f}

.co b em{display:inline-block;font-style:normal;font-size:8px;letter-spacing:.14em;
  text-transform:uppercase;font-weight:900;color:#fdf6e6;background:#7a8c84;
  border-radius:8px;padding:2px 7px;margin-left:8px;vertical-align:2px}

/* sur le podium, la carte entière prend la teinte */
.mar.cap{background:#e4e8e2;border-color:#7a8c84}
.mar.cap .nm{color:#5c7068}
.mar.cap .eu{color:#5c7068}
.mar .cape{display:block;font-size:7.5px;letter-spacing:.16em;text-transform:uppercase;
  font-weight:900;color:#fdf6e6;background:#7a8c84;border-radius:8px;
  padding:2px 0;margin:4px 12px 0}

.lg{display:flex;align-items:center;gap:13px;padding:14px 16px;
  border-bottom:2px solid rgba(18,48,63,.1)}
.lg:last-child{border-bottom:0}
.lg .rg{flex:0 0 26px;text-align:center;
  font-family:'DM Serif Display',Georgia,serif;font-size:17px;
  color:rgba(18,48,63,.42)}
.lg .av{width:40px;height:40px;border-radius:12px;flex:0 0 40px;overflow:hidden;
  background:var(--creme2);border:2px solid var(--encre)}
.lg .av svg{width:100%;height:100%;display:block}
.lg .co{flex:1;min-width:0}
.lg .co b{display:block;font-size:15px;font-weight:800}
.lg .co span{display:block;font-size:11.5px;font-weight:600;
  color:rgba(18,48,63,.5);margin-top:2px}
.lg .eu{flex:0 0 auto;font-family:'DM Serif Display',Georgia,serif;font-size:18px}
.lg.moi{background:var(--or)}

/* ---------- les trois façons d'être premier ----------
   L'argent en caisse baisse quand on joue bien : il fallait
   d'autres mesures pour que construire ne fasse plus reculer. */
.onglets{display:flex;gap:8px;margin-bottom:18px}
.onglets button{flex:1;padding:11px 5px 12px;border-radius:15px;cursor:pointer;
  background:rgba(253,246,230,.4);border:3px solid rgba(18,48,63,.3);
  font-family:'Nunito',sans-serif;transition:background .14s,border-color .14s}
.onglets button b{display:block;font-family:'DM Serif Display',Georgia,serif;
  font-size:15px;line-height:1.1;color:rgba(18,48,63,.6)}
.onglets button small{display:block;font-size:9px;font-weight:800;letter-spacing:.1em;
  text-transform:uppercase;color:rgba(18,48,63,.4);margin-top:4px}
.onglets button.on{background:var(--creme);border-color:var(--encre)}
.onglets button.on b{color:var(--encre)}
.onglets button.on small{color:#c07f14}

/* le palier de barque tient sur deux lignes */
.lg .eu small,.mar .eu small{display:block;font-family:'Nunito',sans-serif;
  font-size:9.5px;font-weight:700;color:rgba(18,48,63,.45);margin-top:2px}
.mar .eu small{color:rgba(255,250,240,.6)}

/* ---------- où tu en es ----------
   Trois rangs d'un coup, et ce qui te sépare de celui qui te
   précède. Un objectif vaut mieux qu'un constat. */
.toi{padding:17px 18px;border-radius:20px;margin-bottom:18px;
  background:var(--creme);border:3px solid var(--encre)}
.toi .tt2{font-size:9.5px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;
  color:rgba(18,48,63,.46);margin-bottom:12px}
.toi .trois{display:flex;gap:9px}
.toi .trois div{flex:1;padding:11px 6px;border-radius:14px;text-align:center;
  background:rgba(18,48,63,.05);border:2.5px solid rgba(18,48,63,.14);
  cursor:pointer;transition:background .12s,border-color .12s}
.toi .trois div.on{background:var(--or);border-color:var(--encre)}
.toi .trois b{display:block;font-family:'DM Serif Display',Georgia,serif;font-size:22px;
  line-height:1}
.toi .trois span{display:block;font-size:8.5px;font-weight:800;letter-spacing:.12em;
  text-transform:uppercase;color:rgba(18,48,63,.5);margin-top:5px}
/* le premier n'a personne devant : on le dit autrement */
.toi .ec{font-size:12.5px;font-weight:700;line-height:1.5;margin-top:13px;
  padding-top:12px;border-top:2.5px solid rgba(18,48,63,.1);
  color:rgba(18,48,63,.62)}
.toi .ec em{font-style:normal;font-family:'DM Serif Display',Georgia,serif;
  font-size:16px;color:var(--encre)}
.toi .ec.tete{color:#1f6b45}

/* ---------- les records du port ---------- */
.rec{margin-top:22px}
.rec .li3{display:flex;align-items:center;gap:12px;padding:12px 16px;
  border-bottom:2px solid rgba(18,48,63,.1)}
.rec .li3:last-child{border-bottom:0}
.rec .li3.moi{background:rgba(240,169,46,.14)}
.rec .li3 .co{flex:1;min-width:0}
.rec .li3 .co b{display:block;font-family:'DM Serif Display',Georgia,serif;
  font-size:16px;line-height:1.15}
.rec .li3 .co span{display:block;font-size:11px;font-weight:700;
  color:rgba(18,48,63,.5);margin-top:2px}
.rec .li3 .pa{flex:0 0 auto;font-family:'DM Serif Display',Georgia,serif;
  font-size:18px;color:var(--encre)}
.rec .mot2{font-size:11.5px;font-weight:600;color:rgba(255,250,240,.72);
  margin:10px 4px 0;line-height:1.5;text-shadow:0 1px 0 rgba(18,48,63,.2)}
</style>
</head>
<body>

<div class="pont">
  <div class="tete">
    <span class="q"><b>Le classement</b><span id="c-sous">—</span></span>
    <button class="retour" id="retour">‹ Retour</button>
  </div>
  <div class="toi" id="toi"></div>

  <div class="onglets" id="onglets">
    <button data-c="fortune" class="on"><b>La fortune</b><small>En caisse</small></button>
    <button data-c="barque"><b>La barque</b><small>Le palier</small></button>
    <button data-c="courses"><b>Les courses</b><small>Livrées</small></button>
  </div>
  <div id="podium"></div>
  <div id="suite"></div>
  <div class="rec" id="records"></div>
  <p class="pied">Battle Dock — Marseille</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="bd.js?v=5"></script>
<script src="son.js?v=2"></script>
<script>
const PORTS = { anse:'à son anse', marseille:'à Marseille', barcelone:'à Barcelone',
                palma:'à Palma', ajaccio:'à Ajaccio' };
const COURONNE = '👑';

function euro(v){
  return Math.round(Number(v || 0)).toLocaleString('fr-FR') + ' €';
}

/* ---------- les trois classements ---------- */
let TOUT = null, MOI = null, VUE = 'fortune';

/* la valeur d'une ligne, dite selon le classement qu'on regarde */
function valeurDe(x){
  if (VUE === 'fortune')
    return Math.round(Number(x.valeur || 0)).toLocaleString('fr-FR') + ' €';
  if (VUE === 'barque')
    return 'Palier ' + x.valeur + (x.nom ? '<small>' + x.nom + '</small>' : '');
  return x.valeur + '<small>' + (x.valeur > 1 ? 'courses' : 'course') + '</small>';
}

/* ---------- où tu en es ---------- */
const NOM_VUE = { fortune:'La fortune', barque:'La barque', courses:'Les courses' };
const ORDINAL = n => n + (n === 1 ? 'er' : 'e');

function blocToi(){
  const el = document.getElementById('toi');
  const M = TOUT && TOUT.moi_rangs;
  if (!M){ el.style.display = 'none'; return; }
  el.style.display = '';

  const total = (TOUT.combien || 0);
  const ec = (M.ecarts || []).filter(Boolean).find(x => x.quoi === VUE);

  el.innerHTML = '<p class="tt2">Où tu en es</p>'
    + '<div class="trois">'
    + ['fortune','barque','courses'].map(k =>
        '<div data-v="' + k + '"' + (k === VUE ? ' class="on"' : '') + '>'
        + '<b>' + ORDINAL(M[k]) + '</b><span>' + NOM_VUE[k].replace('La ','')
          .replace('Les ','') + '</span></div>').join('')
    + '</div>'
    /* ce qui te sépare du suivant, dans le classement affiché */
    + (ec && ec.manque > 0
        ? '<p class="ec">Il te manque <em>'
          + Number(ec.manque).toLocaleString('fr-FR') + ' ' + ec.unite
          + (ec.unite === 'course' && ec.manque > 1 ? 's' : '')
          + '</em> pour passer ' + ec.qui + '.</p>'
        : '<p class="ec tete">Personne devant toi sur ' + total
          + ' dockers. Tiens la tête.</p>');

  el.querySelectorAll('[data-v]').forEach(b =>
    b.onclick = () => choisir(b.dataset.v));
}

/* ---------- les records du port ---------- */
function blocRecords(){
  const el = document.getElementById('records');
  const R = (TOUT && TOUT.records) || [];
  if (!R.length){ el.innerHTML = ''; return; }
  const miens = R.filter(x => x.moi).length;
  el.innerHTML = '<p class="sec">Les records du port</p>'
    + '<div class="bloc">' + R.slice(0, 8).map(x =>
        '<div class="li3' + (x.moi ? ' moi' : '') + '">'
        + '<span class="co"><b>' + x.nom + '</b>'
        + '<span>' + (x.moi ? 'Tu le tiens' : x.qui) + ' · ' + x.port + '</span></span>'
        + '<span class="pa">' + Number(x.paie).toLocaleString('fr-FR') + ' €</span>'
        + '</div>').join('') + '</div>'
    + '<p class="mot2">Le plus gros chargement jamais livré pour chaque marchandise. '
    + (miens ? 'Tu en tiens ' + miens + '.' : 'Tu n\'en tiens aucun.') + '</p>';
}

/* changer de classement, d'où qu'on le demande */
function choisir(v){
  VUE = v;
  document.querySelectorAll('#onglets [data-c]').forEach(x =>
    x.classList.toggle('on', x.dataset.c === v));
  rendre();
}

/* un avatar illisible ne doit jamais emporter le classement entier */
function tete(x){
  try { return BD.avatarSVG(x); }
  catch(e){ return '<svg viewBox="0 0 16 16"><rect width="16" height="16"'
    + ' fill="#dfe8ee"/></svg>'; }
}

function rendre(){
  const L = (TOUT && TOUT[VUE]) || [];
  const pod = document.getElementById('podium');
  const suite = document.getElementById('suite');

  if (!L.length){
    pod.innerHTML = '';
    suite.innerHTML = '<p class="rien">Le classement n\'a pas répondu.</p>';
    return;
  }

  const rangMoi = (L.find(x => x.id === MOI) || {}).rang;
  var vrais = TOUT.joueurs || L.length;
  document.getElementById('c-sous').textContent = rangMoi
    ? 'Tu es ' + rangMoi + (rangMoi === 1 ? 'er' : 'e') + ' sur ' + L.length
      + ' — dont ' + vrais + ' joueur' + (vrais > 1 ? 's' : '')
    : L.length + ' dockers, dont ' + vrais + ' joueur' + (vrais > 1 ? 's' : '');

  /* le podium : le premier au milieu */
  const T = L.slice(0, 3);
  pod.innerHTML = T.length >= 3
    ? '<div class="pod">' + [T[1], T[0], T[2]].map((x, i) => {
        const cl = ['deux', 'un', 'trois'][i];
        return '<div class="mar ' + cl + (x.capitaine ? ' cap' : '') + '">'
          + '<span class="rg">' + x.rang + '</span>'
          + (cl === 'un' ? '<span class="cr">' + COURONNE + '</span>' : '')
          + '<span class="av' + (x.capitaine ? ' cap' : '') + '">'
          +   tete(x) + '</span>'
          + '<span class="nm">' + x.pseudo + '</span>'
          + (x.capitaine ? '<span class="cape">capitaine</span>' : '')
          + '<span class="eu">' + valeurDe(x) + '</span></div>';
      }).join('') + '</div>'
    : '';

  const R = T.length >= 3 ? L.slice(3) : L;
  suite.innerHTML = R.length
    ? '<p class="sec">' + (T.length >= 3 ? 'Et les autres' : 'Le classement') + '</p>'
      + '<div class="bloc">' + R.map(x =>
        '<div class="lg' + (x.id === MOI ? ' moi' : '')
        + (x.capitaine ? ' cap' : '') + '">'
        + '<span class="rg">' + x.rang + '</span>'
        + '<span class="av' + (x.capitaine ? ' cap' : '') + '">'
        +   tete(x) + '</span>'
        + '<span class="co"><b>' + x.pseudo
        +   (x.capitaine ? '<em>capitaine</em>' : '') + '</b>'
        + '<span>Niveau ' + x.niveau + ' · ' + (PORTS[x.port] || 'en mer') + '</span></span>'
        + '<span class="eu">' + valeurDe(x) + '</span></div>').join('') + '</div>'
    : '';

  document.querySelectorAll('.av svg').forEach(s2 =>
    s2.setAttribute('preserveAspectRatio', 'xMidYMid slice'));

  blocToi();
  blocRecords();
}

document.getElementById('onglets').onclick = e => {
  const b = e.target.closest('[data-c]');
  if (b) choisir(b.dataset.c);
};

(async () => {
  try {
    const moi = await BD.charger();
    if (!moi){ location.href = 'index.html'; return; }
    MOI = moi.id;
    TOUT = await BD.agir('classements');
    rendre();
  } catch(e){
    console.warn(e);
    document.getElementById('suite').innerHTML =
      '<p class="rien">Le classement n\'a pas répondu.</p>';
  }
})();

document.getElementById('retour').onclick = () => location.href = 'hub.html?v=7';
</script>
</body>
</html>
