<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#f5a53a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Le classement — Battle Dock</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="chaud.css?v=2">
<style>
.pod{display:flex;align-items:flex-end;gap:10px;margin-bottom:20px}
.mar{flex:1;display:flex;flex-direction:column;align-items:center;gap:9px;
  padding:15px 8px 13px;border-radius:16px;position:relative;
  background:var(--creme);border:3px solid var(--encre);}
.mar .av{width:48px;height:48px;border-radius:14px;overflow:hidden;
  background:var(--creme2);border:2.5px solid var(--encre)}
.mar .av svg{width:100%;height:100%;display:block}
.mar .nm{font-size:13px;font-weight:800;max-width:100%;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.mar .eu{font-family:'DM Serif Display',Georgia,serif;font-size:17px}
.mar .rg{position:absolute;top:-11px;left:50%;margin-left:-15px;width:30px;height:30px;
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:'DM Serif Display',Georgia,serif;font-size:16px;
  background:var(--creme2);border:3px solid var(--encre)}
.mar.un{padding-top:22px;padding-bottom:17px;background:var(--or)}
.mar.un .av{width:58px;height:58px;border-radius:16px}
.mar.un .nm{font-size:15px}
.mar.un .eu{font-size:20px}
.mar.un .rg{background:var(--creme);width:34px;height:34px;margin-left:-17px;
  font-size:18px;top:-13px}
.mar.un .cr{position:absolute;top:6px;right:9px;font-size:19px}
.lg{display:flex;align-items:center;gap:13px;padding:14px 16px;
  border-bottom:2px solid rgba(18,48,63,.1)}
.lg:last-child{border-bottom:0}
.lg .rg{flex:0 0 26px;text-align:center;
  font-family:'DM Serif Display',Georgia,serif;font-size:17px;
  color:rgba(18,48,63,.42)}
.lg .av{width:40px;height:40px;border-radius:12px;flex:0 0 40px;overflow:hidden;
  background:var(--creme2);border:2px solid var(--encre)}
.lg .av svg{width:100%;height:100%;display:block}
.lg .co{flex:1;min-width:0}
.lg .co b{display:block;font-size:15px;font-weight:800}
.lg .co span{display:block;font-size:11.5px;font-weight:600;
  color:rgba(18,48,63,.5);margin-top:2px}
.lg .eu{flex:0 0 auto;font-family:'DM Serif Display',Georgia,serif;font-size:18px}
.lg.moi{background:var(--or)}

/* ---------- les trois façons d'être premier ----------
   L'argent en caisse baisse quand on joue bien : il fallait
   d'autres mesures pour que construire ne fasse plus reculer. */
.onglets{display:flex;gap:8px;margin-bottom:18px}
.onglets button{flex:1;padding:11px 5px 12px;border-radius:15px;cursor:pointer;
  background:rgba(253,246,230,.4);border:3px solid rgba(18,48,63,.3);
  font-family:'Nunito',sans-serif;transition:background .14s,border-color .14s}
.onglets button b{display:block;font-family:'DM Serif Display',Georgia,serif;
  font-size:15px;line-height:1.1;color:rgba(18,48,63,.6)}
.onglets button small{display:block;font-size:9px;font-weight:800;letter-spacing:.1em;
  text-transform:uppercase;color:rgba(18,48,63,.4);margin-top:4px}
.onglets button.on{background:var(--creme);border-color:var(--encre)}
.onglets button.on b{color:var(--encre)}
.onglets button.on small{color:#c07f14}

/* le palier de barque tient sur deux lignes */
.lg .eu small,.mar .eu small{display:block;font-family:'Nunito',sans-serif;
  font-size:9.5px;font-weight:700;color:rgba(18,48,63,.45);margin-top:2px}
.mar .eu small{color:rgba(255,250,240,.6)}
</style>
</head>
<body>

<div class="pont">
  <div class="tete">
    <span class="q"><b>Le classement</b><span id="c-sous">—</span></span>
    <button class="retour" id="retour">‹ Retour</button>
  </div>
  <div class="onglets" id="onglets">
    <button data-c="fortune" class="on"><b>La fortune</b><small>En caisse</small></button>
    <button data-c="barque"><b>La barque</b><small>Le palier</small></button>
    <button data-c="courses"><b>Les courses</b><small>Livrées</small></button>
  </div>
  <div id="podium"></div>
  <div id="suite"></div>
  <p class="pied">Battle Dock — Marseille</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="bd.js?v=3"></script>
<script>
const PORTS = { anse:'à son anse', marseille:'à Marseille', barcelone:'à Barcelone',
                palma:'à Palma', ajaccio:'à Ajaccio' };
const COURONNE = '👑';

function euro(v){
  return Math.round(Number(v || 0)).toLocaleString('fr-FR') + ' €';
}

/* ---------- les trois classements ---------- */
let TOUT = null, MOI = null, VUE = 'fortune';

/* la valeur d'une ligne, dite selon le classement qu'on regarde */
function valeurDe(x){
  if (VUE === 'fortune')
    return Math.round(Number(x.valeur || 0)).toLocaleString('fr-FR') + ' €';
  if (VUE === 'barque')
    return 'Palier ' + x.valeur + (x.nom ? '<small>' + x.nom + '</small>' : '');
  return x.valeur + '<small>' + (x.valeur > 1 ? 'courses' : 'course') + '</small>';
}

function rendre(){
  const L = (TOUT && TOUT[VUE]) || [];
  const pod = document.getElementById('podium');
  const suite = document.getElementById('suite');

  if (!L.length){
    pod.innerHTML = '';
    suite.innerHTML = '<p class="rien">Le classement n\'a pas répondu.</p>';
    return;
  }

  const rangMoi = (L.find(x => x.id === MOI) || {}).rang;
  document.getElementById('c-sous').textContent = rangMoi
    ? 'Tu es ' + rangMoi + (rangMoi === 1 ? 'er' : 'e') + ' sur ' + L.length
    : L.length + ' dockers';

  /* le podium : le premier au milieu */
  const T = L.slice(0, 3);
  pod.innerHTML = T.length >= 3
    ? '<div class="pod">' + [T[1], T[0], T[2]].map((x, i) => {
        const cl = ['deux', 'un', 'trois'][i];
        return '<div class="mar ' + cl + '">'
          + '<span class="rg">' + x.rang + '</span>'
          + (cl === 'un' ? '<span class="cr">' + COURONNE + '</span>' : '')
          + '<span class="av">' + BD.avatarSVG(x) + '</span>'
          + '<span class="nm">' + x.pseudo + '</span>'
          + '<span class="eu">' + valeurDe(x) + '</span></div>';
      }).join('') + '</div>'
    : '';

  const R = T.length >= 3 ? L.slice(3) : L;
  suite.innerHTML = R.length
    ? '<p class="sec">' + (T.length >= 3 ? 'Et les autres' : 'Le classement') + '</p>'
      + '<div class="bloc">' + R.map(x =>
        '<div class="lg' + (x.id === MOI ? ' moi' : '') + '">'
        + '<span class="rg">' + x.rang + '</span>'
        + '<span class="av">' + BD.avatarSVG(x) + '</span>'
        + '<span class="co"><b>' + x.pseudo + '</b>'
        + '<span>Niveau ' + x.niveau + ' · ' + (PORTS[x.port] || 'en mer') + '</span></span>'
        + '<span class="eu">' + valeurDe(x) + '</span></div>').join('') + '</div>'
    : '';

  document.querySelectorAll('.av svg').forEach(s2 =>
    s2.setAttribute('preserveAspectRatio', 'xMidYMid slice'));
}

document.getElementById('onglets').onclick = e => {
  const b = e.target.closest('[data-c]');
  if (!b) return;
  document.querySelectorAll('[data-c]').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  VUE = b.dataset.c;
  rendre();
};

(async () => {
  try {
    const moi = await BD.charger();
    if (!moi){ location.href = 'index.html'; return; }
    MOI = moi.id;
    TOUT = await BD.agir('classements');
    rendre();
  } catch(e){
    console.warn(e);
    document.getElementById('suite').innerHTML =
      '<p class="rien">Le classement n\'a pas répondu.</p>';
  }
})();

document.getElementById('retour').onclick = () => location.href = 'hub.html?v=3';
</script>
</body>
</html>
