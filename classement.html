<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#f5a53a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Le classement — Battle Dock</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="chaud.css?v=1">
<style>
.pod{display:flex;align-items:flex-end;gap:10px;margin-bottom:20px}
.mar{flex:1;display:flex;flex-direction:column;align-items:center;gap:9px;
  padding:15px 8px 13px;border-radius:16px;position:relative;
  background:var(--creme);border:3px solid var(--encre);}
.mar .av{width:48px;height:48px;border-radius:14px;overflow:hidden;
  background:var(--creme2);border:2.5px solid var(--encre)}
.mar .av svg{width:100%;height:100%;display:block}
.mar .nm{font-size:13px;font-weight:800;max-width:100%;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.mar .eu{font-family:'DM Serif Display',Georgia,serif;font-size:17px}
.mar .rg{position:absolute;top:-11px;left:50%;margin-left:-15px;width:30px;height:30px;
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:'DM Serif Display',Georgia,serif;font-size:16px;
  background:var(--creme2);border:3px solid var(--encre)}
.mar.un{padding-top:22px;padding-bottom:17px;background:var(--or)}
.mar.un .av{width:58px;height:58px;border-radius:16px}
.mar.un .nm{font-size:15px}
.mar.un .eu{font-size:20px}
.mar.un .rg{background:var(--creme);width:34px;height:34px;margin-left:-17px;
  font-size:18px;top:-13px}
.mar.un .cr{position:absolute;top:6px;right:9px;font-size:19px}
.lg{display:flex;align-items:center;gap:13px;padding:14px 16px;
  border-bottom:2px solid rgba(18,48,63,.1)}
.lg:last-child{border-bottom:0}
.lg .rg{flex:0 0 26px;text-align:center;
  font-family:'DM Serif Display',Georgia,serif;font-size:17px;
  color:rgba(18,48,63,.42)}
.lg .av{width:40px;height:40px;border-radius:12px;flex:0 0 40px;overflow:hidden;
  background:var(--creme2);border:2px solid var(--encre)}
.lg .av svg{width:100%;height:100%;display:block}
.lg .co{flex:1;min-width:0}
.lg .co b{display:block;font-size:15px;font-weight:800}
.lg .co span{display:block;font-size:11.5px;font-weight:600;
  color:rgba(18,48,63,.5);margin-top:2px}
.lg .eu{flex:0 0 auto;font-family:'DM Serif Display',Georgia,serif;font-size:18px}
.lg.moi{background:var(--or)}
</style>
</head>
<body>

<div class="pont">
  <div class="tete">
    <span class="q"><b>Le classement</b><span id="c-sous">—</span></span>
    <button class="retour" id="retour">‹ Retour</button>
  </div>
  <div id="podium"></div>
  <div id="suite"></div>
  <p class="pied">Battle Dock — Marseille</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="bd.js?v=2"></script>
<script>
const PORTS = { anse:'à son anse', marseille:'à Marseille', barcelone:'à Barcelone',
                palma:'à Palma', ajaccio:'à Ajaccio' };
const COURONNE = '👑';

function euro(v){
  return Math.round(Number(v || 0)).toLocaleString('fr-FR') + ' €';
}

(async () => {
  try {
    const moi = await BD.charger();
    if (!moi){ location.href = 'index.html'; return; }

    const c = await BD.client();
    const { data } = await c.from('classement').select('*').order('rang').limit(50);
    const L = data || [];

    if (!L.length){
      document.getElementById('suite').innerHTML =
        '<p class="rien">Le classement n\'a pas répondu.</p>';
      return;
    }

    /* où en es-tu ? */
    const rangMoi = (L.find(x => x.id === moi.id) || {}).rang;
    document.getElementById('c-sous').textContent = rangMoi
      ? 'Tu es ' + rangMoi + (rangMoi === 1 ? 'er' : 'e') + ' sur ' + L.length
      : L.length + ' dockers';

    /* le podium : les trois premiers, le premier au milieu */
    const T = L.slice(0, 3);
    if (T.length >= 3){
      const ordre = [T[1], T[0], T[2]];
      const cl = ['deux', 'un', 'trois'];
      document.getElementById('podium').innerHTML = '<div class="pod">'
        + ordre.map((x, i) =>
          '<div class="mar ' + cl[i] + '">'
          + '<span class="rg">' + x.rang + '</span>'
          + (cl[i] === 'un' ? '<span class="cr">' + COURONNE + '</span>' : '')
          + '<span class="av">' + BD.avatarSVG(x) + '</span>'
          + '<span class="nm">' + x.pseudo + '</span>'
          + '<span class="eu">' + euro(x.euros) + '</span>'
          + '</div>').join('') + '</div>';
    }

    /* le reste */
    const R = T.length >= 3 ? L.slice(3) : L;
    if (R.length){
      document.getElementById('suite').innerHTML =
        '<p class="sec">' + (T.length >= 3 ? 'Et les autres' : 'Le classement') + '</p>'
        + '<div class="bloc">' + R.map(x =>
          '<div class="lg' + (x.id === moi.id ? ' moi' : '') + '">'
          + '<span class="rg">' + x.rang + '</span>'
          + '<span class="av">' + BD.avatarSVG(x) + '</span>'
          + '<span class="co"><b>' + x.pseudo + '</b>'
          + '<span>Niveau ' + x.niveau + ' · ' + (PORTS[x.port] || 'en mer') + '</span></span>'
          + '<span class="eu">' + euro(x.euros) + '</span>'
          + '</div>').join('') + '</div>';
    }

    /* les avatars du podium doivent remplir leur cadre */
    document.querySelectorAll('.av svg').forEach(s =>
      s.setAttribute('preserveAspectRatio', 'xMidYMid slice'));

  } catch(e){
    console.warn(e);
    document.getElementById('suite').innerHTML =
      '<p class="rien">Le classement n\'a pas répondu.</p>';
  }
})();

document.getElementById('retour').onclick = () => location.href = 'hub.html?v=3';
</script>
</body>
</html>
