<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#050d16">
<title>Battledock — Le trajet</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="couleurs.css?v=1">
<style>
:root{--nuit:#050d16;--brume:#7fa3c0;--sable:#e8e2d4;--ocre:#e0913a;--ocre-f:#a3611f;--encre:#2b2a26}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:var(--nuit);color:var(--sable);font-family:'Barlow',system-ui,sans-serif;
     display:flex;flex-direction:column}

/* ---------- la fenêtre du panorama ---------- */
.vue{position:relative;flex:1;min-height:0;overflow:hidden;background:#050f1c}
.couche{position:absolute;top:0;left:0;height:100%;will-change:transform}
.couche svg{display:block;height:100%;width:auto}

.heros{
  position:absolute;left:50%;bottom:11%;
  transform:translateX(-50%);
  width:14%;max-width:96px;min-width:56px;
  z-index:5;pointer-events:none;
}
.heros svg{display:block;width:100%;height:auto;image-rendering:pixelated}
.heros.marche{animation:pas .5s steps(2) infinite}
@keyframes pas{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-2.5%)}}
.ombreHeros{
  position:absolute;left:50%;bottom:10%;transform:translateX(-50%);
  width:11%;max-width:74px;height:8px;border-radius:50%;
  background:radial-gradient(closest-side, rgba(4,12,20,.55), transparent);z-index:4;
}

/* ---------- rail de défilement ---------- */
.rail{position:absolute;inset:0;overflow-x:auto;overflow-y:hidden;z-index:6;
  -webkit-overflow-scrolling:touch;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail .long{height:1px}

/* ---------- interface ---------- */
.haut{
  position:absolute;top:0;left:0;right:0;z-index:8;pointer-events:none;
  padding:calc(env(safe-area-inset-top) + 12px) 16px 26px;
  background:linear-gradient(180deg, rgba(5,13,22,.75), transparent);
  display:flex;justify-content:space-between;align-items:center;
}
.haut .heure{font-size:10px;letter-spacing:.28em;color:rgba(127,163,192,.75)}
.jauge{flex:0 0 42%;height:3px;background:rgba(127,163,192,.2);border-radius:2px;overflow:hidden}
.jauge i{display:block;height:100%;width:0;background:var(--ocre);transition:width .1s linear}

.bas{
  position:absolute;left:0;right:0;bottom:0;z-index:8;
  padding:34px 16px calc(env(safe-area-inset-bottom) + 16px);
  background:linear-gradient(180deg, transparent, rgba(5,13,22,.9) 42%, var(--nuit));
  pointer-events:none;
}
.bas .dedans{max-width:460px;margin:0 auto}
.replique{
  background:rgba(233,228,214,.94);color:var(--encre);border-radius:14px;
  padding:12px 15px;font-size:14.5px;line-height:1.5;
  opacity:0;transform:translateY(8px);transition:opacity .4s, transform .4s;
}
.replique.on{opacity:1;transform:none}
.replique em{font-style:normal;color:#7a756a;font-size:12.5px;display:block;margin-top:5px}

.indice{
  position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 96px);
  transform:translateX(-50%);z-index:9;pointer-events:none;
  display:flex;align-items:center;gap:8px;
  font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:rgba(232,226,212,.85);
  background:rgba(5,13,22,.5);padding:8px 14px;border-radius:20px;
  animation:respireIndice 2.2s ease-in-out infinite;
}
.indice.off{opacity:0;transition:opacity .5s}
.indice svg{width:16px;height:16px;animation:glisse 2.2s ease-in-out infinite}
@keyframes glisse{0%,100%{transform:translateX(-3px)}50%{transform:translateX(3px)}}
@keyframes respireIndice{0%,100%{opacity:.75}50%{opacity:1}}

.reveil{position:absolute;inset:0;z-index:9;display:none;pointer-events:none}
.reveil.on{display:block}
.reveil svg{position:absolute;inset:0;width:100%;height:100%}
.r-jour{opacity:0;transition:opacity 3.4s ease-in}
.reveil.jour .r-jour{opacity:1}
.r-proj g{opacity:0}
.reveil.proj .p1{animation:allumeProj .5s .0s forwards}
.reveil.proj .p2{animation:allumeProj .5s .45s forwards}
.reveil.proj .p3{animation:allumeProj .5s .9s forwards}
@keyframes allumeProj{0%{opacity:0}45%{opacity:1}60%{opacity:.35}100%{opacity:1}}
.r-etincelles{opacity:0;transition:opacity 1.6s}
.reveil.jour .r-etincelles{opacity:.55;animation:flotteEt 9s linear infinite}
@keyframes flotteEt{0%{transform:translateY(6px)}100%{transform:translateY(-38px)}}
.r-texte{
  position:absolute;left:0;right:0;top:38%;text-align:center;
  font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:.14em;
  color:#fff3dd;text-shadow:0 3px 18px rgba(0,0,0,.75);
  opacity:0;transition:opacity .6s;padding:0 20px;
}
.r-texte.on{opacity:1}
.r-titre{
  position:absolute;inset:0;display:none;flex-direction:column;
  align-items:center;justify-content:center;gap:12px;text-align:center;
  background:linear-gradient(180deg, rgba(5,13,22,.1), rgba(5,13,22,.72));
  pointer-events:auto;padding:24px;
}
.r-titre.on{display:flex;animation:apparait .8s ease-out}
.r-titre h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(40px,13vw,64px);
  letter-spacing:.06em;color:#fff3dd;text-shadow:0 4px 24px rgba(0,0,0,.6)}
.r-titre p{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:#e2c9a8}
.r-titre button{margin-top:10px;background:var(--ocre);border:0;border-radius:10px;
  padding:16px 28px;font-family:'Barlow',sans-serif;font-size:13px;font-weight:600;
  letter-spacing:.16em;text-transform:uppercase;color:#1a0f02;cursor:pointer}
.vue.secousse{animation:secousse .8s ease-out}
@keyframes secousse{0%,100%{transform:translate(0,0)}
  20%{transform:translate(-2px,1px)}40%{transform:translate(2px,-1px)}
  60%{transform:translate(-1px,-1px)}80%{transform:translate(1px,1px)}}

.barrage{
  position:absolute;inset:0;z-index:11;display:none;
  background:rgba(5,13,22,.93);padding:calc(env(safe-area-inset-top) + 16px) 16px;
  overflow-y:auto;
}
.barrage.on{display:block;animation:apparait .45s ease-out}
.barrage .boite{max-width:460px;margin:0 auto;padding-bottom:24px}
.portrait{border-radius:14px;overflow:hidden;border:1px solid rgba(127,163,192,.2);margin-bottom:14px}
.portrait svg{display:block;width:100%;height:auto}
.barrage .replique{opacity:1;transform:none;margin-bottom:12px}
.choix{display:flex;flex-direction:column;gap:9px}
.choix button{
  width:100%;text-align:left;background:rgba(10,28,46,.85);
  border:1px solid rgba(127,163,192,.22);border-radius:10px;padding:14px 16px;
  font-family:'Barlow',sans-serif;font-size:15px;color:var(--sable);cursor:pointer;
}
.choix button:active{transform:scale(.985)}
/* --- le gardien s'anime --- */
.g-buste{animation:respireG 4.2s ease-in-out infinite}
@keyframes respireG{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.015)}}
.g-tete{animation:dodelineG 6.8s ease-in-out infinite}
@keyframes dodelineG{0%,100%{transform:rotate(0) translateY(0)}
  34%{transform:rotate(-1.4deg) translateY(.5px)}68%{transform:rotate(1.1deg) translateY(-.4px)}}
.g-tete.penche{animation:pencheG 5.4s ease-in-out infinite}
@keyframes pencheG{0%,100%{transform:rotate(0) translateY(0)}50%{transform:rotate(2deg) translateY(2px)}}
.g-paup{transform:scaleY(0);transform-origin:148px 53px;animation:cligneG 5.6s infinite}
@keyframes cligneG{0%,95.5%{transform:scaleY(0)}96.5%,98.5%{transform:scaleY(1)}100%{transform:scaleY(0)}}
.pupilles{animation:scrute 7.2s ease-in-out infinite}
@keyframes scrute{0%,44%{transform:translate(0,0)}
  52%,72%{transform:translate(-1.6px,.4px)}80%,100%{transform:translate(.8px,-.3px)}}
.main-gardien{animation:tendMain 2.6s ease-in-out infinite}
@keyframes tendMain{0%,100%{transform:translateX(0)}50%{transform:translateX(-2.5px)}}
.bras-lit{animation:lecture 4.6s ease-in-out infinite}
@keyframes lecture{0%,100%{transform:translateY(0) rotate(0)}
  30%{transform:translateY(-1.6px) rotate(-1.2deg)}65%{transform:translateY(.8px) rotate(1deg)}}
.papier-lu{animation:retourne 6.5s ease-in-out infinite}
@keyframes retourne{0%,42%,100%{transform:scaleX(1)}50%,58%{transform:scaleX(-1)}}
.ventilo{animation:tourne 1.6s linear infinite}
@keyframes tourne{to{transform:rotate(360deg)}}
.cctv{animation:neige 4.2s steps(1) infinite}
@keyframes neige{0%,88%{opacity:.5}90%{opacity:.18}92%{opacity:.5}94%{opacity:.28}96%{opacity:.5}}
.vapeur-th{animation:vapeurTh 4s ease-out infinite}
@keyframes vapeurTh{0%{opacity:0;transform:translateY(3px)}35%{opacity:.55}100%{opacity:0;transform:translateY(-7px)}}
.feu{animation:clignote 3.4s infinite}
.feu2{animation:clignote 5.1s infinite .8s}
@keyframes clignote{0%,44%{opacity:1}52%,94%{opacity:.12}100%{opacity:1}}
.houle path{animation:houleG 9s ease-in-out infinite}
@keyframes houleG{0%,100%{transform:translateX(0)}50%{transform:translateX(-10px)}}
.crochet{animation:penduleG 7s ease-in-out infinite}
@keyframes penduleG{0%,100%{transform:rotate(-1.4deg)}50%{transform:rotate(1.4deg)}}

.stop{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:10;
  display:none;font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:.1em;
  color:#e05c4a;text-shadow:0 2px 12px rgba(0,0,0,.7);pointer-events:none;
}
.fin{
  position:absolute;inset:0;z-index:12;display:none;
  align-items:center;justify-content:center;flex-direction:column;gap:18px;
  background:rgba(5,13,22,.92);padding:24px;text-align:center;
}
.fin.on{display:flex;animation:apparait .5s ease-out}
@keyframes apparait{from{opacity:0}to{opacity:1}}
.fin h2{font-family:'Bebas Neue',sans-serif;font-size:30px;letter-spacing:.03em}
.fin p{font-size:14px;color:#9dbcd4;max-width:320px;line-height:1.55}
.fin button{
  background:var(--ocre);border:0;border-radius:10px;padding:16px 26px;
  font-family:'Barlow',sans-serif;font-size:13px;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;color:#1a0f02;cursor:pointer;
}
@media (prefers-reduced-motion:reduce){
  .heros.marche,.indice,.indice svg,.g-buste,.g-tete,.pupilles,.main-gardien,
  .bras-lit,.papier-lu,.ventilo,.cctv,.vapeur-th,.feu,.feu2,.houle path,.crochet{animation:none}
  .g-paup{animation:none;transform:scaleY(0)}
}
</style>
</head>
<body>

<div class="vue" id="vue">
  <div class="couche" id="c1" data-p="0.10"></div>
  <div class="couche" id="c2" data-p="0.34"></div>
  <div class="couche" id="c3" data-p="0.66"></div>
  <div class="couche" id="c4" data-p="1"></div>

  <div class="ombreHeros"></div>
  <div class="heros marche" id="heros"></div>

  <div class="rail" id="rail"><div class="long" id="long"></div></div>

  <div class="haut">
    <span class="heure" id="heure">6 H 02</span>
    <span class="jauge"><i id="jauge"></i></span>
    <span class="heure" id="lieu">RUE</span>
  </div>

  <div class="indice" id="indice">
    <svg viewBox="0 0 24 24" fill="none" stroke="#e8e2d4" stroke-width="2" stroke-linecap="round">
      <path d="M5 12h14M13 6l6 6-6 6"/>
    </svg>
    Fais glisser
  </div>

  <div class="bas"><div class="dedans">
    <div class="replique" id="replique"></div>
  </div></div>

  <div class="reveil" id="reveil">
    <svg viewBox="0 0 400 200" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="rjour" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#0d2b45" stop-opacity=".0"/>
          <stop offset="55%" stop-color="#c98a52" stop-opacity=".26"/>
          <stop offset="100%" stop-color="#f2b06a" stop-opacity=".42"/>
        </linearGradient>
        <linearGradient id="rfaisceau" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#fff4dc" stop-opacity=".55"/>
          <stop offset="100%" stop-color="#fff4dc" stop-opacity="0"/>
        </linearGradient>
        <radialGradient id="rhalo">
          <stop offset="0%" stop-color="#fff6e2" stop-opacity=".95"/>
          <stop offset="100%" stop-color="#fff6e2" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <rect class="r-jour" width="400" height="200" fill="url(#rjour)"/>
      <g class="r-proj">
        <g class="p1"><path d="M44 8 L4 200 h96 L84 8 Z" fill="url(#rfaisceau)"/>
          <circle cx="64" cy="10" r="7" fill="url(#rhalo)"/><circle cx="64" cy="10" r="2.6" fill="#fff6e2"/></g>
        <g class="p2"><path d="M170 4 L134 200 h88 L206 4 Z" fill="url(#rfaisceau)"/>
          <circle cx="188" cy="6" r="8" fill="url(#rhalo)"/><circle cx="188" cy="6" r="3" fill="#fff6e2"/></g>
        <g class="p3"><path d="M300 10 L266 200 h84 L336 10 Z" fill="url(#rfaisceau)"/>
          <circle cx="318" cy="12" r="7" fill="url(#rhalo)"/><circle cx="318" cy="12" r="2.6" fill="#fff6e2"/></g>
      </g>
      <g class="r-etincelles"><circle cx="20" cy="40" r="1.0" fill="#ffe8c4" opacity=".7"/><circle cx="43" cy="97" r="1.5" fill="#ffe8c4" opacity=".7"/><circle cx="66" cy="154" r="2.0" fill="#ffe8c4" opacity=".7"/><circle cx="89" cy="91" r="1.0" fill="#ffe8c4" opacity=".7"/><circle cx="112" cy="148" r="1.5" fill="#ffe8c4" opacity=".7"/><circle cx="135" cy="85" r="2.0" fill="#ffe8c4" opacity=".7"/><circle cx="158" cy="142" r="1.0" fill="#ffe8c4" opacity=".7"/><circle cx="181" cy="79" r="1.5" fill="#ffe8c4" opacity=".7"/><circle cx="204" cy="136" r="2.0" fill="#ffe8c4" opacity=".7"/><circle cx="227" cy="73" r="1.0" fill="#ffe8c4" opacity=".7"/><circle cx="250" cy="130" r="1.5" fill="#ffe8c4" opacity=".7"/><circle cx="273" cy="67" r="2.0" fill="#ffe8c4" opacity=".7"/><circle cx="296" cy="124" r="1.0" fill="#ffe8c4" opacity=".7"/><circle cx="319" cy="61" r="1.5" fill="#ffe8c4" opacity=".7"/><circle cx="342" cy="118" r="2.0" fill="#ffe8c4" opacity=".7"/><circle cx="365" cy="55" r="1.0" fill="#ffe8c4" opacity=".7"/><circle cx="388" cy="112" r="1.5" fill="#ffe8c4" opacity=".7"/></g>
    </svg>
    <div class="r-texte" id="r-texte"></div>
    <div class="r-titre" id="r-titre">
      <h1>BATTLEDOCK</h1>
      <p>Port de Marseille — 6 h 30</p>
      <button id="commencer">Prendre son poste</button>
    </div>
  </div>

  <div class="barrage" id="barrage">
    <div class="boite">
      <div class="portrait" id="portrait"></div>
      <div class="replique" id="rep-g"></div>
      <div class="choix" id="choix-g"></div>
    </div>
  </div>

  <div class="fin" id="fin">
    <h2>Un coup de sifflet, derrière toi.</h2>
    <p>Des claquettes sur le béton. Le bruit se rapproche sans se presser.</p>
    <button id="retourner">Se retourner</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="bd.js"></script>
<script>
const $ = id => document.getElementById(id);
const PEAUX = [
  { id:'p1', c:'#f2d3b6', o:'#d9ab86' },
  { id:'p2', c:'#e5bc96', o:'#c4936b' },
  { id:'p3', c:'#cf9b6f', o:'#a97449' },
  { id:'p4', c:'#a97048', o:'#83502e' },
  { id:'p5', c:'#7d4c2c', o:'#5c341a' },
  { id:'p6', c:'#4f2f1c', o:'#39200f' }
];
const CHEVEUX = [
  { id:'c1', c:'#171310', o:'#000000' },
  { id:'c2', c:'#3d2b1e', o:'#241a12' },
  { id:'c3', c:'#6b4526', o:'#472c16' },
  { id:'c4', c:'#a8763c', o:'#7c5426' },
  { id:'c5', c:'#c9a86a', o:'#9c8049' },
  { id:'c6', c:'#8f2f1e', o:'#661d10' },
  { id:'c7', c:'#9aa3a8', o:'#727b80' }
];
const VESTES = [
  { id:'v1', c:'#c8641f', o:'#8f4310', n:'Orange' },
  { id:'v2', c:'#1f5f8f', o:'#123f61', n:'Bleu' },
  { id:'v3', c:'#3d6b4a', o:'#264730', n:'Vert' },
  { id:'v4', c:'#8f2f2a', o:'#5f1c19', n:'Rouge' },
  { id:'v5', c:'#4a4f57', o:'#2f333a', n:'Gris' },
  { id:'v6', c:'#c9b47a', o:'#9a8654', n:'Sable' }
];
const COIFFURES = ['Rasé','Court','Ondulé','Épais','Queue','Dégarni'];
const BARBES    = ['Glabre','Bouc','Courte','Pleine','Moustache','Rouflaquettes'];
const TETES     = ['Rien','Bonnet','Casquette','Casque','Bandana'];
const YEUX = [
  { id:'y1', c:'#3b2415', n:'Marron' }, { id:'y2', c:'#6b4a1e', n:'Noisette' },
  { id:'y3', c:'#3f6b45', n:'Vert' },   { id:'y4', c:'#2f6b8f', n:'Bleu' },
  { id:'y5', c:'#6b7378', n:'Gris' },   { id:'y6', c:'#1a1208', n:'Noir' }
];
const FOULARDS = [
  null,
  { id:'f1', c:'#b5342b', o:'#7d2119' }, { id:'f2', c:'#2f6b8f', o:'#1d4460' },
  { id:'f3', c:'#d8b24a', o:'#a2842e' }, { id:'f4', c:'#e8e2d4', o:'#b2ab9c' }
];
const OR = '#e0b23a', ARGENT = '#c3cad0';
const BOUCHES  = ['Neutre','Sourire','Serrée','Dents','Dent en or'];
const LUNETTES = ['Sans','De vue','Soleil','Sécurité','Bandeau'];
const BOUCLES  = ['Sans','Une','Deux or','Deux argent'];
const MOTIFS   = ['Uni','Marinière','Gilet fluo','Bretelles'];
const NOMS_FOULARD = ['Sans','Rouge','Bleu','Jaune','Blanc'];


const GW = 16, GH = 18;
const BLANC = '#f6f1e6', NOIR = '#1a1208', BOUCHE = '#7a3a2e', COL = '#161d24';
const CASQUE = '#e8a51e', CASQUE_O = '#b8790c';

function zone(g, x0, y0, x1, y1, c){
  for (let y = Math.max(0, y0); y <= Math.min(GH - 1, y1); y++)
    for (let x = Math.max(0, x0); x <= Math.min(GW - 1, x1); x++) g[y][x] = c;
}
function pt(g, cases, c){
  for (const [x, y] of cases) if (x >= 0 && x < GW && y >= 0 && y < GH) g[y][x] = c;
}

function grille(){
  const P = PEAUX[etat.peau], C = CHEVEUX[etat.cheveux], V = VESTES[etat.veste];
  const co = etat.coiffure, ba = etat.barbe, te = etat.tete;
  const chauve = co === 0, casque = te === 3, poil = !chauve && !casque;
  const bc = chauve ? '#3d2b1e' : C.c;
  const bo = chauve ? '#241a12' : C.o;
  const g = Array.from({ length: GH }, () => new Array(GW).fill(null));

  zone(g, 1, 14, 14, 17, V.c);
  zone(g, 2, 13, 13, 13, V.c);
  zone(g, 1, 14, 3, 17, V.o);
  zone(g, 12, 14, 14, 17, V.o);
  zone(g, 2, 13, 3, 13, V.o);
  zone(g, 12, 13, 13, 13, V.o);

  const mo = etat.motif;
  if (mo === 1){
    zone(g, 1, 15, 14, 15, '#e8e2d4'); zone(g, 1, 17, 14, 17, '#e8e2d4');
    zone(g, 1, 15, 3, 15, '#b2ab9c'); zone(g, 12, 15, 14, 15, '#b2ab9c');
    zone(g, 1, 17, 3, 17, '#b2ab9c'); zone(g, 12, 17, 14, 17, '#b2ab9c');
  }
  if (mo === 2){
    zone(g, 1, 14, 14, 14, '#d7e84a'); zone(g, 1, 16, 14, 16, '#d7e84a');
    zone(g, 1, 14, 3, 14, '#a8b82e'); zone(g, 12, 14, 14, 14, '#a8b82e');
    zone(g, 1, 16, 3, 16, '#a8b82e'); zone(g, 12, 16, 14, 16, '#a8b82e');
  }
  if (mo === 3){
    zone(g, 4, 14, 4, 17, '#3a2c1d'); zone(g, 11, 14, 11, 17, '#3a2c1d');
    pt(g, [[4,15],[11,15]], OR);
  }

  if (etat.tshirt){
    const TC = '#8d8a7e', TO = '#6e6c62';
    zone(g, 1, 14, 14, 17, TC);
    zone(g, 2, 13, 13, 13, TC);
    zone(g, 1, 14, 3, 17, TO);
    zone(g, 12, 14, 14, 17, TO);

    pt(g, [[6,5],[9,5]], oeil);

  if (lu === 2){
    zone(g, 4, 5, 11, 5, '#1e1a16');
    pt(g, [[5,5],[9,5]], '#4a4038');
    pt(g, [[3,5],[12,5],[7,5],[8,5]], '#2b2119');

    pt(g, [[7,5],[8,5]], '#8fa36a');

    pt(g, [[9,5],[10,5],[11,5],[12,5]], '#1e1a16');

  if (te === 2){

    zone(g, 2, 3, 13, 3, V.o);

    pt(g, [[4,0],[5,0]], V.c);
  }
  if (te === 3){
    zone(g, 4, 0, 11, 1, CASQUE);

    zone(g, 2, 3, 13, 3, CASQUE_O);

    pt(g, [[5,1],[8,1],[10,2]], V.o);
    pt(g, [[13,3],[13,4],[12,4]], V.c);
    pt(g, [[11,1],[11,2],[12,2],[13,4]], V.o);
  }
  return g;
}

function dessinerAvatar(){
  const g = grille(), out = [];
  for (let y = 0; y < GH; y++){
    let x = 0;
    while (x < GW){
      const c = g[y][x];
      if (c === null){ x++; continue; }
      let n = 1;
      while (x + n < GW && g[y][x + n] === c) n++;
      out.push(`<rect x="${x}" y="${y}" width="${n}" height="1" fill="${c}"/>`);
      x += n;
    }
  }
  return out.join('');
}

const GH_PIED = 27;

  const buste = grille();

  return g;
}

DECORS.gardien = gueriteScene(false);
DECORS.gardienLit = gueriteScene(true);

/* ---------- défilement ---------- */
const rail = $('rail'), vue = $('vue');
const largeurVue = () => vue.clientWidth;
const hauteurVue = () => vue.clientHeight;
function poserLongueur(){
  const echelle = hauteurVue() / H;
  $('long').style.width = (L * echelle) + 'px';
}
poserLongueur();
addEventListener('resize', poserLongueur);

const ETAPES = [
  { p:0,    lieu:'RUE',      h:'6 H 02',
    t:"Tu sors de la coopérative.",
    e:"Un euro en poche, un tee-shirt qui n'est pas à ta taille, un casque qui l'est encore moins." },
  { p:0.13, lieu:'RUE',      h:'6 H 03',
    t:"La ville n'est pas encore réveillée.",
    e:"Un volet claque quelque part. Un scooter démarre, plus bas." },
  { p:0.30, lieu:'PORTAIL',  h:'6 H 05',
    t:"Portail du port. La guérite est allumée.",
    e:"Quelqu'un est dedans. On ne voit qu'une silhouette derrière la vitre." },
  { p:0.40, lieu:'PORTAIL',  h:'6 H 06',
    t:"La barrière est levée.",
    e:"Personne ne t'a demandé qui tu étais." },
  { p:0.52, lieu:'HANGARS',  h:'6 H 07',
    t:"Ça sent le gasoil et le poisson.",
    e:"Hangar 7. Une lampe grésille. Le bruit de tes pas revient en écho." },
  { p:0.70, lieu:'HANGARS',  h:'6 H 08',
    t:"Personne. Pas un bruit de machine.",
    e:"À cette heure-là, le port appartient encore à ceux qui n'ont pas dormi." },
  { p:0.84, lieu:'QUAI',     h:'6 H 09',
    t:"Le quai.",
    e:"La mer, les portiques, et le soleil qui monte derrière." },
  { p:0.95, lieu:'QUAI',     h:'6 H 10',
    t:"Tu t'arrêtes au bord.",
    e:"C'est là que tu vas travailler. Tu ne sais pas encore à quoi." }
];

let etape = -1, fini = false;
const ARRET = 0.345;
let barre = false, passe = false;
const couches = [...document.querySelectorAll('.couche')];

function auDefilement(){
  const max = rail.scrollWidth - rail.clientWidth;
  const t = max > 0 ? rail.scrollLeft / max : 0;
  const echelle = hauteurVue() / H;
  const course = L * echelle - largeurVue();

  couches.forEach(c => {
    const p = parseFloat(c.dataset.p);
    c.style.transform = `translate3d(${-t * course * p}px,0,0)`;
  });

  $('jauge').style.width = (t * 100) + '%';

  let n = 0;
  for (let i = 0; i < ETAPES.length; i++) if (t >= ETAPES[i].p) n = i;
  if (n !== etape){
    etape = n;
    const s = ETAPES[n];
    $('lieu').textContent = s.lieu;
    $('heure').textContent = s.h;
    const r = $('replique');
    r.classList.remove('on');
    setTimeout(() => {
      r.innerHTML = s.t + '<em>' + s.e + '</em>';
      r.classList.add('on');
    }, 180);
  }

  if (!passe && t >= ARRET){
    rail.scrollLeft = ARRET * (rail.scrollWidth - rail.clientWidth);
    if (!barre){ barre = true; setTimeout(ouvrirBarrage, 260); }
  }

  $('heros').classList.toggle('marche', t < 0.985 && !barre);
  if (t > 0.02) $('indice').classList.add('off');
  if (t >= 0.995 && !fini){ fini = true; setTimeout(reveilDuPort, 500); }
}
rail.addEventListener('scroll', auDefilement, { passive:true });
auDefilement();
setTimeout(() => { const r = $('replique'); r.innerHTML = ETAPES[0].t + '<em>' + ETAPES[0].e + '</em>'; r.classList.add('on'); }, 400);

/* ---------- séquence du gardien ---------- */
function poserPortrait(lit){
  $('portrait').innerHTML =
    `<svg viewBox="0 0 240 170" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Le gardien">`
    + (lit ? DECORS.gardienLit : DECORS.gardien) + `</svg>`;
}
function dire(t, e){ $('rep-g').innerHTML = t + '<em>' + e + '</em>'; }
function options(liste){
  $('choix-g').innerHTML = liste.map((o,i) => `<button data-i="${i}">${o.t}</button>`).join('');
  $('choix-g').querySelectorAll('button').forEach(b =>
    b.addEventListener('click', () => liste[+b.dataset.i].f()));
}

function ouvrirBarrage(){
  $('barrage').classList.add('on');
  poserPortrait(false);
  dire("Papiers.", "Il ne dit rien d'autre. Sa main est tendue. Il te regarde droit dans les yeux.");
  options([
    { t:"Montrer la fiche médicale", f:() => examine('fiche') },
    { t:"Montrer le ticket du tee-shirt", f:() => examine('ticket') },
    { t:"Je n'ai rien", f:rien }
  ]);
}
function examine(quoi){
  poserPortrait(true);
  dire("…", "Il prend le papier. Il le lit. Il le retourne. Il le relit.");
  options([{ t:"Attendre", f:() => verdict(quoi) }]);
}
function verdict(quoi){
  poserPortrait(true);
  if (quoi === 'fiche'){
    dire("Trente-deux kilos.", "Il lève les yeux vers toi. Il te compare à la fiche. Longuement.");
    options([{ t:"Oui", f:photo }, { t:"Je sais", f:photo }]);
  } else {
    dire("C'est un ticket de caisse.", "Il le repose sur le guichet. Il ne le rend pas.");
    options([{ t:"Oui", f:photo }]);
  }
}
function rien(){
  poserPortrait(false);
  dire("Personne n'a rien, le matin.", "Il n'a pas l'air surpris. Il n'a pas l'air content non plus.");
  options([{ t:"Attendre", f:photo }]);
}
function photo(){
  poserPortrait(true);
  dire("Enlevez le casque, je vois pas votre tête.", "Tu l'enlèves. Il te regarde. Il regarde la photo. Il te regarde encore.");
  options([{ t:"Alors ?", f:laisserPasser }, { t:"…", f:laisserPasser }]);
}
function laisserPasser(){
  poserPortrait(false);
  dire("C'est bon. Remettez-le.", "Il tamponne quelque chose que tu ne verras jamais. La barrière était déjà levée.");
  options([{ t:"Passer", f:() => {
    passe = true;
    $('barrage').classList.remove('on');
    $('heure').textContent = '6 H 07';
  }}]);
}

/* ---------- le port se réveille ---------- */
function reveilDuPort(){
  const R = $('reveil'), T = $('r-texte');
  R.classList.add('on');
  $('replique').classList.remove('on');
  $('indice').classList.add('off');

  const dire = (txt) => { T.classList.remove('on'); setTimeout(() => { T.textContent = txt; T.classList.add('on'); }, 250); };

  setTimeout(() => { vue.classList.add('secousse'); dire('Une corne de brume.'); }, 200);
  setTimeout(() => vue.classList.remove('secousse'), 1100);
  setTimeout(() => { R.classList.add('proj'); dire('Les projecteurs s\u2019allument.'); }, 2100);
  setTimeout(() => { $('heure').textContent = '6 H 28'; dire('Les moteurs démarrent.'); }, 4200);
  setTimeout(() => { R.classList.add('jour'); $('heure').textContent = '6 H 30'; dire('Le port se réveille.'); }, 5800);
  setTimeout(() => { T.classList.remove('on'); }, 8400);
  setTimeout(() => { $('r-titre').classList.add('on'); $('lieu').textContent = 'QUAI 3'; }, 9000);
}

$('commencer').addEventListener('click', async () => {
  $('commencer').disabled = true;
  $('commencer').textContent = 'Un instant…';
  await BD.avancer('trajet');
});

$('retourner').addEventListener('click', () => {
  $('fin').innerHTML = "<h2>À suivre</h2><p>Bouboulette Chéri entre dans le cadre.</p>";
});
</script>
