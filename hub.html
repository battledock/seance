<title>Battle Dock</title>

<style>
/* ---------- le ciel du hub, port par port ----------
   Chaque port a sa lumière. Marseille garde le matin chaud de
   chaud.css ; Barcelone prend le soir, puisque c'est le soir
   qu'on y vit. On recouvre le dégradé commun. */
html{background:var(--h5,#2b6f92)}
body::before{background:linear-gradient(180deg,
  var(--h1,#f5a53a) 0%, var(--h2,#eeb455) 16%, var(--h3,#c9b978) 38%,
  var(--h4,#3f87a6) 70%, var(--h5,#2b6f92) 100%);
  transition:background 1s ease}

/* ---------- l'aube ----------
   Le temps que la page se pose. Elle prend le ciel du port, comme
   partout ailleurs : plus de blanc ni de bascule de couleur. */
#charge{position:fixed;inset:0;z-index:90;background:var(--h1,#f5a53a);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
  transition:opacity .45s ease}
#charge.parti{opacity:0;pointer-events:none}
#charge .ti{font-family:'DM Serif Display',Georgia,serif;
  font-size:27px;color:#fffaf0;letter-spacing:.02em}
#charge .fl{width:118px;height:3px;border-radius:2px;
  background:rgba(255,250,240,.26);overflow:hidden}
#charge .fl i{display:block;width:38%;height:100%;border-radius:2px;background:#fffaf0;
  animation:houle 1.15s ease-in-out infinite}
@keyframes houle{0%{transform:translateX(-115%)}100%{transform:translateX(275%)}}

/* la carte des premiers pas, en tête : une seule chose à la fois */
.carte-pas{border-radius:16px;border:3px solid var(--encre);background:var(--creme);
  overflow:hidden;margin-bottom:22px}
.carte-pas .h{display:flex;align-items:flex-start;gap:13px;padding:16px 16px 0}
.carte-pas .rd{flex:0 0 36px;height:36px;border-radius:50%;background:var(--or);
  border:3px solid var(--encre);display:flex;align-items:center;justify-content:center;
  font-family:'DM Serif Display',Georgia,serif;font-size:18px;color:var(--encre)}
.carte-pas .rd.fait{background:#2f8a5c;color:var(--creme);border-color:#1e6b44}
.carte-pas .t{flex:1;min-width:0}
.carte-pas .t b{display:block;font-family:'DM Serif Display',Georgia,serif;
  font-size:20px;line-height:1.2}
.carte-pas .t span{display:block;font-size:13px;line-height:1.6;
  color:rgba(18,48,63,.6);margin-top:7px}
.carte-pas .b{display:flex;gap:8px;padding:14px 16px 16px}
.carte-pas .b button{flex:1;padding:13px;border-radius:12px;cursor:pointer;
  font-family:inherit;font-size:14.5px;font-weight:900;
  border:3px solid var(--encre);background:var(--creme)}
.carte-pas .b button.vif{background:var(--or)}
.carte-pas .paie{padding:0 16px 14px;font-size:12px;font-weight:800;
  color:rgba(18,48,63,.45)}

/* ---------- les trois du jour ----------
   Ce qu'il y a à faire aujourd'hui, avant même les lieux. */
#defis{margin:0 0 22px}
.dt{display:flex;justify-content:space-between;align-items:baseline;
  font-size:9px;letter-spacing:.2em;text-transform:uppercase;font-weight:900;
  color:rgba(18,48,63,.45);margin:0 2px 10px}
.dt em{font-style:normal;color:#a8763a;letter-spacing:.1em}
.df{display:flex;align-items:center;gap:12px;padding:13px 15px;margin-bottom:8px;
  border-radius:14px;background:var(--creme);border:3px solid var(--encre)}
.df.fini{border-color:#2f8a5c}
.df.pris{opacity:.5;border-color:rgba(18,48,63,.3)}
.df .rd{flex:0 0 34px;height:34px;border-radius:50%;position:relative;
  border:3px solid rgba(18,48,63,.2);display:flex;align-items:center;
  justify-content:center;font-size:11px;font-weight:900}
.df.fini .rd{border-color:#2f8a5c;background:#2f8a5c;color:var(--creme)}
.df.pris .rd{border-color:#2f8a5c;color:#2f8a5c;background:transparent}
.df .tx{flex:1;min-width:0}
.df .tx b{display:block;font-size:15px;line-height:1.3}
.df .tx span{display:block;font-size:12px;color:rgba(18,48,63,.55);margin-top:3px;
  line-height:1.45}
.df .tx i{font-style:normal;color:#a8763a;font-weight:800}
.df .gg{flex:0 0 auto;padding:11px 14px;border-radius:11px;cursor:pointer;
  font-family:inherit;font-size:13.5px;font-weight:900;
  border:3px solid var(--encre);background:var(--or);color:var(--encre)}
.df .paie{flex:0 0 auto;text-align:right;font-size:12.5px;font-weight:800;
  color:rgba(18,48,63,.5)}
</style>
<script>
/* On se souvient du dernier port pour peindre le bon ciel dès la
   première image. Sans ça le hub s'ouvrait en orange marseillais
   et basculait au violet une fois le serveur revenu. */
(function(){
  const C = { anse:['#f5a53a','#eeb455','#c9b978','#3f87a6','#2b6f92'],
    barcelone:['#e8873f','#c9686a','#8a5f84','#3f5f82','#1c3350'],
    palma:['#f6d97a','#e8b45c','#88b8a8','#2f92a4','#14566a'],
    ajaccio:['#e8a8a0','#c98fa0','#8f8fa8','#3f7f92','#17475c'] };
  let p = 'anse';
  try { p = localStorage.getItem('bd-port') || 'anse'; } catch(e){}
  const ci = C[p] || C.anse;
  const R = document.documentElement.style;
  ci.forEach((v, i) => R.setProperty('--h' + (i + 1), v));
  const m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', ci[0]);
})();
</script>

   Une seule carte au lieu de trois : le portrait, ton nom, puis les
   trois chiffres en pied séparés de filets. L'énergie court en trait

/* ---------- le rabat : la dernière page du livret ----------

.rab > i:nth-child(1){left:18%;background:#ffd68c}
.rab > i:nth-child(2){left:42%;background:#a8e8c0;animation-delay:.7s}
.rab > i:nth-child(3){left:64%;background:#fff6e4;animation-delay:1.4s}
.rab > i:nth-child(4){left:84%;background:#9cc8f0;animation-delay:.4s}
@keyframes tombe{0%{transform:translateY(0) rotate(0);opacity:0}

  100%{transform:translateY(76px) rotate(400deg);opacity:0}}
.rab .em{position:relative;z-index:2;font-size:24px;flex:0 0 auto}

/* une fois pris, le rabat s'éteint et le livret se referme */
.rab.pris{background:rgba(18,48,63,.07);cursor:default}
.rab.pris .tx b{color:rgba(18,48,63,.6)}
.rab.pris .tx span{color:rgba(18,48,63,.44)}
.rab.pris .em{opacity:.36}
.rab.pris > i{display:none}

.pri{position:relative;display:flex;align-items:center;gap:15px;width:100%;

/* ---------- le chantier ----------
   Le minium : le rouge antirouille qu'on passe sous les coques.

.li.chantier .co b{color:#fff6ea}
.li.chantier .co span{color:rgba(255,246,234,.72)}

/* une tuile close se voit : plus terne, et elle ne répond pas */

@keyframes saut{from{transform:scale(.3) rotate(-20deg);opacity:0}

.ouv .mot{font-size:13px;font-weight:600;color:rgba(18,48,63,.62);margin-top:10px}

/* ---------- retour au port ----------
   Un bouton, rien de plus. Le crème et l'encre des cartes, le nom

/* la tranche : un bandeau de mer sur le bord droit */

<script>
/* rien ne se montre tant que tout n'est pas là */
function paraitre(){
  ['liv', 'rade', 'atouts', 'pas', 'defis', 'tuiles', 'pied'].forEach(k => {
    const e = document.getElementById(k);
    if (e){ e.classList.remove('attend'); e.classList.add('venu'); }
  });
}

const PORTS_N = { anse:'Marseille', marseille:'Marseille', barcelone:'Barcelone',
                  palma:'Palma', ajaccio:'Ajaccio' };
const PALIERS_B = [
  { n:1,  nom:"La coque nue",        prix:0,      places:1, kg:40,  vit:1.0,

async function poserPas(){
  const sec = document.getElementById('pas');
  try { PAS = await BD.agir('mes_premiers_pas'); } catch(e){ PAS = null; }
  if (!PAS || !PAS.ok || PAS.fini){
    sec.style.display = 'none';
    return;
  }

  document.getElementById('p-num').textContent = PAS.numero + ' sur ' + PAS.combien;

    + '<span class="rd' + (PAS.fait ? ' fait' : '') + '">'
    +   (PAS.fait ? '✓' : PAS.numero) + '</span>'
    + '<span class="t"><b>' + PAS.titre + '</b>'
    + '<span>' + PAS.note + '</span></span></div>';

  h += '<p class="paie">' + PAS.ecus.toLocaleString('fr-FR') + ' € et '
    + PAS.xp + ' XP à la clé</p>';

  h += '<div class="b">';
  if (PAS.fait){
    h += '<button class="vif" id="p-prendre">C\'est fait — encaisser</button>';
  } else if (PAS.ou_aller){
    h += '<button class="vif" id="p-aller">' + (PAS.bouton || 'Y aller') + '</button>';
  } else {
    h += '<button id="p-attend" disabled>Quand ce sera fait</button>';
  }
  h += '</div>';

  document.getElementById('p-carte').innerHTML = h;
  sec.style.display = '';
  sec.classList.remove('attend');
  sec.classList.add('venu');

  const a = document.getElementById('p-aller');
  if (a) a.onclick = () => location.href = PAS.ou_aller;
  const pr = document.getElementById('p-prendre');
  if (pr) pr.onclick = encaisserPas;
}

async function encaisserPas(){
  const b = document.getElementById('p-prendre');
  b.disabled = true; b.textContent = '…';
  let r = null;
  try { r = await BD.agir('prendre_pas', { p_k: PAS.k }); } catch(e){}
  if (!r || !r.ok){ b.disabled = false; b.textContent = 'C\'est fait — encaisser'; return; }
  BD.vibrer([12, 40, 22]);
  BD.sonner('piece');
  await poserPas();
}

async function poserDefis(){
  const sec = document.getElementById('defis');
  try { DEFIS = await BD.agir('mes_defis'); } catch(e){ DEFIS = null; }
  if (!DEFIS || !DEFIS.ok || !(DEFIS.defis || []).length){
    /* rien à montrer : la section ne doit pas laisser un trou */
    sec.style.display = 'none';

  }

  const L = DEFIS.defis;

  document.getElementById('d-liste').innerHTML = L.map(d => {
    const fini = d.fait >= d.cible;
    return '<div class="df' + (d.pris ? ' pris' : fini ? ' fini' : '') + '">'
      + '<span class="rd">' + (d.pris || fini ? '✓'
          : (d.cible > 1 ? d.fait + '/' + d.cible : '')) + '</span>'
      + '<span class="tx"><b>' + d.titre + '</b><span>' + d.note
      +   (d.ou ? ' <i>' + (OU_NOM[d.ou] || d.ou) + '</i>' : '') + '</span></span>'
      + (d.gagnable
          ? '<button class="gg" data-d="' + d.k + '">Encaisser</button>'
          : '<span class="paie">' + (d.pris ? 'pris'
              : d.ecus.toLocaleString('fr-FR') + ' €') + '</span>')
      + '</div>';
  }).join('');

  sec.classList.add('venu');

    b.onclick = () => encaisserDefi(b.dataset.d, b);

  let r = null;
  try { r = await BD.agir('prendre_defi', { p_k: k }); } catch(e){}
  if (!r || !r.ok){ b.disabled = false; b.textContent = 'Encaisser'; return; }
  BD.vibrer([12, 40, 22]); BD.sonner('piece');

  await poserDefis();
}

/* une tuile est close si le lieu n'existe pas encore,
   ou si l'histoire ne t'y a pas encore mené */
function close(t){
  return !!t.ferme || (t.si && !VECU.includes(t.si));
}
function sousTitre(t){
  if (t.ferme) return t.s;
  if (t.si && !VECU.includes(t.si)) return t.sinon || t.s;
  return t.sv || t.s;
}

function dessinerTuiles(){
  const E = hubEtat;
  /* certaines tuiles ne s'affichent pas du tout : celles qui ne
     valent que le temps d'une histoire, et qui n'ont plus lieu
     d'être une fois celle-ci passée. */
  const DISPO = TUILES.filter(t =>
    (!t.ici || t.ici === PORT) && !(t.cache && t.cache()));
  let h = '';

  FAMILLES.forEach(F => {
    const lot = DISPO.filter(t => t.ou === F.k);
    if (!lot.length) return;
    h += '<p class="sec">' + F.t + '</p>';

    if (F.gd){
      /* la première famille est en grandes cartes : ce sont les gestes
         du jour, ils méritent d'être vus sans qu'on les cherche */
      h += lot.map(t =>
        '<button class="pri" data-k="' + t.k + '"' + (close(t) ? ' disabled' : '') + '>'
        + '<span class="em">' + t.em + '</span>'
        + '<span class="co"><b>' + t.t + '</b><span>' + sousTitre(t) + '</span></span>'
        + (!close(t) && E[t.k] ? '<span class="nb">' + E[t.k] + '</span>' : '')
        + '</button>').join('');
    } else {
      /* les autres en lignes serrées : on les consulte, on n'y court pas */
      h += '<div class="bloc">' + lot.map(t =>
        '<button class="li' + (t.teinte ? ' ' + t.teinte : '') + '" data-k="'
        + t.k + '"' + (close(t) ? ' disabled' : '') + '>'
        + '<span class="em">' + t.em + '</span>'
        + '<span class="co"><b>' + t.t + '</b><span>' + sousTitre(t) + '</span></span>'
        + (!close(t) && E[t.k]
            ? '<span class="nb2">' + E[t.k] + '</span>'
            : '<span class="fl">' + (close(t) ? '' : '›') + '</span>')
        + '</button>').join('') + '</div>';
    }
  });

  document.getElementById('tuiles').innerHTML = h;
  document.querySelectorAll('#tuiles [data-k]').forEach(el => {
    const t = TUILES.find(x => x.k === el.dataset.k);
    if (t && t.f && !close(t)) el.onclick = t.f;
  });
}

  location.href = PAGE_PORT[PORT] || 'jeu.html';

document.getElementById('ouv-ok').onclick = () => {
  document.getElementById('ouv').classList.remove('on');
  location.reload();
};

(async () => {
  try {
    const d = await BD.charger();
    if (!d){ location.href = 'index.html'; return; }
    D = d;

    const av = document.getElementById('hub-av');
    av.innerHTML = BD.avatarSVG(d);
    /* on demande au dessin de couvrir le cadre plutôt que de s'y contenir */
    const sv = av.querySelector('svg');
    if (sv) sv.setAttribute('preserveAspectRatio', 'xMidYMid slice');
    /* le hub prend la couleur du port où l'on se trouve */
    PORT = d.port || 'anse';
    /* le hub prend la lumière du port où l'on se trouve */
    const ci = CIELS[PORT] || CIELS.anse;
    const R = document.documentElement.style;
    ci.forEach((v, i) => R.setProperty('--h' + (i + 1), v));
    const tc = document.querySelector('meta[name="theme-color"]');
    if (tc) tc.setAttribute('content', ci[0]);
    try { localStorage.setItem('bd-port', PORT); } catch(e){}
    /* le monde continue de tourner entre deux connexions : les
       capitaines naviguent et livrent. Le serveur ne les réveille
       qu'une fois toutes les six minutes, quoi qu'on demande. */
    BD.agir('faire_vivre_les_ports').catch(function(){});
    poserAtouts();
    poserPas();
    poserDefis();

    VECU = (d.rencontres || []).slice();
    /* ouvrir une affaire chez Félix débloque la fabrique */
    if (d.affaire) VECU.push('affaire');
    /* Palma ne se lit pas dans les rencontres mais dans l'histoire :
       la lettre dans la sacoche, ou l'étape d'Ardit, ou Pere lui-même */
    {
      const Q = d.quetes || [];
      const ardit = Q.find(q => q.k === 'ardit');
      const pere  = Q.find(q => q.k === 'pere');
      const aLettre = (d.sacoche || []).some(o => o && o.k === 'lettre');
      const attendu = ardit && ardit.etape >= 2 && !pere && (d.niveau || 1) >= 4;
      if (aLettre || pere || attendu) VECU.push('palma_pere');
      if (pere) VECU.push('pere');
      /* une chèvre dans la cale ouvre la porte du vétérinaire ;
         son verdict rendu, la porte se referme pour de bon */
      if ((d.cale || []).some(e => e && e.k === 'rosine'))
        VECU.push('chevre_a_bord');
      BD.agir('mon_cirque').then(c => {
        if (c && c.vet && !VECU.includes('vet_fait')){
          VECU.push('vet_fait');
          dessinerTuiles();
        }
      }).catch(() => {});
      PALMA = { aLettre: aLettre, pere: !!pere };
    }
    document.getElementById('rade-t').textContent = RADE[PORT] || RADE.anse;
    document.getElementById('pied').textContent =
      'Battle Dock — ' + (PORTS_N[PORT] || 'Marseille');

    document.getElementById('hub-nom').textContent = d.pseudo || '';
    document.getElementById('hub-ou').textContent =
      (PORTS_N[d.port] || 'En mer') + ' · niveau ' + (d.niveau || 1);
    document.getElementById('hub-eu').textContent =
      Math.round(Number(d.euros || 0)).toLocaleString('fr-FR') + ' €';
    document.getElementById('hub-xp').textContent =
      Number(d.xp || 0).toLocaleString('fr-FR');

    const nrj = Number(d.energie ?? 100), nmax = Number(d.energie_max || 100);
    const jn = document.getElementById('hub-nrj');
    jn.style.width = Math.min(100, nrj / nmax * 100).toFixed(0) + '%';
    jn.classList.toggle('plein', nrj > nmax);
    /* dans le pied, le chiffre seul : la barre en dessous dit le reste */
    document.getElementById('hub-nrjn').textContent = Math.round(nrj);


    dessinerTuiles();
    poserCadeau();
    paraitre();
    leverAube();

    /* les compteurs */
    const r = await BD.agir('ce_qui_attend');
    if (r && r.ok){
      const P = r.pastilles || {};
      hubEtat = { contrats: P.contrats ? (r.contrats || 1) : 0,
                  quetes: P.quetes ? 1 : 0 };
      /* ce que ta fabrique a fait pendant que tu n'étais pas là */
      const st = Math.floor(Number((((D || {}).affaire || {}).prod || {}).stock || 0));
      if (st >= 1) hubEtat.fabrique = st;
      dessinerTuiles();
    }

    /* le courrier : la pastille dit combien de mots attendent */
    try {
      const co = await BD.agir('mon_courrier', { p_combien: 1 });
      if (co && co.ok && co.non_lus){
        hubEtat.courrier = co.non_lus;
        const t = TUILES.find(x => x.k === 'courrier');
        if (t) t.sv = co.non_lus + (co.non_lus > 1 ? ' mots t\'attendent'
                                                  : ' mot t\'attend');
        dessinerTuiles();
      }
    } catch(e){}

    /* ce que tu n'as pas encore lu, et le numéro de la dernière mise à jour */
    try {
      let vu = 0;
      try { vu = Number(localStorage.getItem('bd-journal-vu') || 0); } catch(e){}
      const c = await BD.client();
      const { count } = await c.from('nouvelles')
        .select('id', { count:'exact', head:true }).gt('id', vu);
      const { data: der } = await c.from('nouvelles')
        .select('maj').order('id', { ascending:false }).limit(1);
      const t = TUILES.find(x => x.k === 'journal');
      const n = der && der[0] && der[0].maj;
      if (t && n) t.sv = count ? 'Maj ' + n + ' — ' + count + ' à lire' : 'Maj ' + n;
      if (count) hubEtat.journal = count;
      dessinerTuiles();
    } catch(e){}
  } catch(e){
    console.warn(e);
    dessinerTuiles();
    leverAube();
  }
})();
</script>
</body>
</html>
