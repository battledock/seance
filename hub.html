<style>
/* ---------- ce qui est propre au hub ---------- */
/* ---------- ton livret de docker ----------
   Une seule carte au lieu de trois : le portrait, ton nom, puis les
   trois chiffres en pied séparés de filets. L'énergie court en trait
   plein tout en bas, sur la tranche du livret. */
.liv{margin:calc(env(safe-area-inset-top) + 20px) 0 20px;
  border-radius:20px;overflow:hidden;
  background:var(--creme);border:3px solid var(--encre)}
.liv .h{display:flex;align-items:center;gap:14px;padding:16px 17px 15px}
.liv .av{flex:0 0 56px;width:56px;height:56px;border-radius:12px;overflow:hidden;
  background:#dfe8ee;border:2.5px solid var(--encre)}
.liv .av svg{display:block;width:100%;height:100%}
.liv .q{flex:1;min-width:0}
.liv .q .su{font-size:9px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;
  color:rgba(18,48,63,.44)}
.liv .q b{display:block;font-family:'DM Serif Display',Georgia,serif;font-size:24px;
  line-height:1.05;margin-top:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.liv .q .ou{display:block;font-size:11px;font-weight:700;
  color:rgba(18,48,63,.56);margin-top:3px}
/* le pied : les trois chiffres, à égalité */
.liv .pied3{display:flex;border-top:2.5px solid rgba(18,48,63,.14)}
.liv .pied3 div{flex:1;min-width:0;padding:12px 8px;text-align:center}
.liv .pied3 div + div{border-left:2.5px solid rgba(18,48,63,.14)}
.liv .pied3 b{display:block;font-family:'DM Serif Display',Georgia,serif;font-size:20px;
  line-height:1;white-space:nowrap}
.liv .pied3 span{display:block;font-size:9px;font-weight:800;letter-spacing:.14em;
  text-transform:uppercase;color:rgba(18,48,63,.46);margin-top:5px}
/* la tranche : l'énergie, en trait plein */
.liv .fil{height:7px;background:rgba(18,48,63,.12);
  border-top:2.5px solid var(--encre)}
.liv .fil i{display:block;height:100%;background:var(--vert);
  transition:width .6s cubic-bezier(.3,.9,.3,1)}
.liv .fil i.plein{background:var(--or)}

/* ---------- le rabat : la dernière page du livret ----------
   Le cadeau n'a plus sa carte à lui. Il est cousu sous le livret,
   en rouge franc pour rester le seul point urgent de l'écran. */
.rab{position:relative;display:flex;align-items:center;gap:12px;width:100%;
  padding:13px 16px;cursor:pointer;overflow:hidden;text-align:left;
  background:var(--rouge);border:0;border-top:3px solid var(--encre);
  font-family:'Nunito',sans-serif;transition:background .12s}
.rab:active{background:#c9432e}
/* les confettis tombent dedans */
.rab > i{position:absolute;width:7px;height:11px;border-radius:2px;top:-14px;
  animation:tombe 3.4s linear infinite}
.rab > i:nth-child(1){left:18%;background:#ffd68c}
.rab > i:nth-child(2){left:42%;background:#a8e8c0;animation-delay:.7s}
.rab > i:nth-child(3){left:64%;background:#fff6e4;animation-delay:1.4s}
.rab > i:nth-child(4){left:84%;background:#9cc8f0;animation-delay:.4s}
@keyframes tombe{0%{transform:translateY(0) rotate(0);opacity:0}
  15%{opacity:1}85%{opacity:1}
  100%{transform:translateY(76px) rotate(400deg);opacity:0}}
.rab .em{position:relative;z-index:2;font-size:24px;flex:0 0 auto}
.rab .tx{position:relative;z-index:2;flex:1;min-width:0}
.rab .tx b{display:block;font-family:'DM Serif Display',Georgia,serif;
  font-size:17px;color:#fffaf0;line-height:1.15}
.rab .tx span{display:block;font-size:10.5px;font-weight:700;
  color:rgba(255,250,240,.8);margin-top:2px}
.rab .sr{position:relative;z-index:2;flex:0 0 auto;padding:4px 9px;
  border-radius:20px;font-size:10px;font-weight:800;color:var(--encre);
  background:var(--creme);border:2px solid var(--encre);white-space:nowrap}
/* une fois pris, le rabat s'éteint et le livret se referme */
.rab.pris{background:rgba(18,48,63,.07);cursor:default}
.rab.pris .tx b{color:rgba(18,48,63,.6)}
.rab.pris .tx span{color:rgba(18,48,63,.44)}
.rab.pris .em{opacity:.36}
.rab.pris > i{display:none}

.pri{position:relative;display:flex;align-items:center;gap:15px;width:100%;
  padding:17px 18px;margin-bottom:12px;border-radius:18px;cursor:pointer;
  text-align:left;background:var(--creme);border:3px solid var(--encre);
  font-family:'Nunito',sans-serif;
  transition:background .12s}
.pri:active{background:var(--creme2)}
.pri .em{font-size:29px;flex:0 0 auto}
.pri .co{flex:1;min-width:0}
.pri .co b{display:block;font-family:'DM Serif Display',Georgia,serif;
  font-size:20px;line-height:1.1}
.pri .co span{display:block;font-size:12px;font-weight:600;
  color:rgba(18,48,63,.56);margin-top:4px}
.pri .nb{flex:0 0 auto;min-width:34px;height:34px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;padding:0 9px;
  font-family:'DM Serif Display',Georgia,serif;font-size:18px;
  background:var(--or);border:2.5px solid var(--encre)}
/* la même pastille, en plus petit, pour les lignes serrées */
.nb2{flex:0 0 auto;min-width:26px;height:26px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;padding:0 7px;
  font-family:'DM Serif Display',Georgia,serif;font-size:14px;color:var(--encre);
  background:var(--or);border:2.5px solid var(--encre)}
/* une tuile close se voit : plus terne, et elle ne répond pas */
.pri:disabled,.li:disabled{opacity:.44;cursor:default}

.ouv{position:fixed;inset:0;z-index:70;display:flex;align-items:center;
  justify-content:center;padding:26px;background:rgba(18,48,63,.72);
  opacity:0;pointer-events:none;transition:opacity .35s}
.ouv.on{opacity:1;pointer-events:auto}
.ouv .ca{width:100%;max-width:310px;border-radius:20px;overflow:hidden;
  text-align:center;padding:32px 24px 0;background:var(--creme);
  border:3px solid var(--encre);
  transform:scale(.88) rotate(-2deg);
  transition:transform .45s cubic-bezier(.3,1.5,.5,1)}
.ouv.on .ca{transform:none}
.ouv .em{font-size:52px;line-height:1;margin-bottom:14px;
  animation:saut .7s cubic-bezier(.3,1.6,.5,1) both}
@keyframes saut{from{transform:scale(.3) rotate(-20deg);opacity:0}
  to{transform:none;opacity:1}}
.ouv .gain{font-family:'DM Serif Display',Georgia,serif;font-size:34px;
  color:var(--encre);line-height:1}
.ouv .mot{font-size:13px;font-weight:600;color:rgba(18,48,63,.62);margin-top:10px}
.ouv .sr2{display:inline-block;margin-top:16px;padding:6px 14px;border-radius:20px;
  font-size:12px;font-weight:800;background:var(--or);
  border:2.5px solid var(--encre)}
.ouv button{width:calc(100% + 48px);margin:24px -24px 0;padding:17px;
  border:0;border-top:3px solid var(--encre);cursor:pointer;
  background:var(--or);color:var(--encre);
  font-family:'DM Serif Display',Georgia,serif;font-size:18px}

/* ---------- retour au port ----------
   Un bouton, rien de plus. Le crème et l'encre des cartes, le nom

.rade{position:relative;display:flex;align-items:center;width:100%;

<body>

<div class="pont">

  <div class="liv attend" id="liv">
    <div class="h">
      <span class="av" id="hub-av"></span>
      <span class="q">
        <span class="su">Docker inscrit</span>
        <b id="hub-nom">—</b>
        <span class="ou" id="hub-ou">—</span>
      </span>
    </div>
    <div class="pied3">
      <div><b id="hub-eu">—</b><span>En caisse</span></div>
      <div><b id="hub-xp">—</b><span>Expérience</span></div>
      <div><b id="hub-nrjn">—</b><span>Énergie</span></div>
    </div>
    <div class="fil"><i id="hub-nrj" style="width:0%"></i></div>
    <button class="rab" id="cadeau">
      <i></i><i></i><i></i><i></i>
      <span class="em">🎁</span>
      <span class="tx"><b id="cad-t">Le cadeau du jour</b>
        <span id="cad-s">Ouvre-le, on ne sait jamais</span></span>
      <span class="sr" id="cad-sr" style="display:none"></span>
    </button>
  </div>

  <button class="rade attend" id="rade">
    <b id="rade-t">Retour à Marseille</b>
    <span class="tr"></span>
  </button>

  <div id="tuiles" class="attend"></div>
  <p class="pied attend" id="pied">Battle Dock — Marseille</p>
</div>

<div class="ouv" id="ouv">
  <div class="ca">
    <p class="em" id="ouv-em">🎁</p>
    <p class="gain" id="ouv-g">—</p>
    <p class="mot" id="ouv-m">—</p>
    <span class="sr2" id="ouv-sr"></span>
    <button id="ouv-ok">Bien</button>
  </div>
</div>

<script src="bd.js?v=3"></script>
<script>
/* rien ne se montre tant que tout n'est pas là */
function paraitre(){
  ['liv', 'rade', 'tuiles', 'pied'].forEach(k => {
    const e = document.getElementById(k);
    if (e){ e.classList.remove('attend'); e.classList.add('venu'); }
  });
}

const PORTS_N = { anse:'Marseille', marseille:'Marseille', barcelone:'Barcelone',
                  palma:'Palma', ajaccio:'Ajaccio' };
const PALIERS_B = [
  { n:1,  nom:"La coque nue",        prix:0,      places:1, kg:40,  vit:1.0,
    d:"Trois bordages et rien d'autre. Elle flotte, c'est déjà ça." },

    d:"Étoupe et goudron dans les coutures. Elle ne prend plus l'eau." },

    d:"On peut ramer assis. Ça change tout." },

    d:"Deux avirons de frêne et leurs tolets." },

    d:"Un liston tout autour. La coque ne travaille plus." },

    d:"Un gouvernail et sa barre. Tu choisis où tu vas." },

    d:"Du plomb sous la quille. Elle ne se couche plus." },
  { n:11, nom:"Le tillac",           prix:23000,  places:6, kg:170, vit:2.6,

  { n:15, nom:"Le second mât",       prix:54000,  places:10, kg:310, vit:3.6,
    d:"Un tapecul à l'arrière. Deux voiles valent mieux qu'une." },
  { n:16, nom:"Le bordé doublé",     prix:66000,  places:12, kg:380, vit:3.6,
    d:"Une seconde peau de bois. Elle encaisse le mauvais temps." },
  { n:17, nom:"Le treuil",           prix:80000,  places:14, kg:450, vit:3.7,
    d:"Un cabestan pour hisser seul. Plus besoin d'être trois." },
  { n:18, nom:"La chaloupe",         prix:96000,  places:15, kg:500, vit:3.7,
    d:"Une annexe sur le pont. On accoste où il n'y a pas de quai." },
  { n:19, nom:"Le pavillon",         prix:115000, places:16, kg:560, vit:3.8,
    d:"Tes couleurs en tête de mât. On te reconnaît de loin." },
  { n:20, nom:"Le grand caboteur",   prix:140000, places:20, kg:700, vit:4.2,
    d:"Coque doublée, trois voiles, un nom peint sur l'étrave. Ce n'est plus une barque." }
];

function euro(v){
  return Number(v || 0).toLocaleString('fr-FR', { minimumFractionDigits: 2 }) + ' €';
}

/* Le hub est le même partout : c'est ton menu, pas celui d'un lieu.
   Seuls le bouton du haut, le chantier et le pied changent selon le port. */
const PAGE_PORT = { anse:'jeu.html', barcelone:'barcelone.html',
                    palma:'palma.html', ajaccio:'ajaccio.html' };
/* le bouton dit où il ramène : c'est plus court et plus juste
   que « retour au port », qui ne nommait rien. */
const RADE = {
  anse:      'Retour à Marseille',
  barcelone: 'Retour à Barcelone',
  palma:     'Retour à Palma',
  ajaccio:   'Retour à Ajaccio'
};
let PORT = 'anse';

/* chaque tuile renvoie vers le port où l'on est, en demandant d'y ouvrir un panneau */
function aller(quoi){
  try { sessionStorage.setItem('bd-ouvrir', quoi); } catch(e){}
  location.href = PAGE_PORT[PORT] || 'jeu.html';
}

/* ---------- ce que le hub propose, port par port ----------
   La mise en page ne bouge pas : ce sont les tuiles qui changent.
   `ici` dit où la tuile existe ; sans `ici`, elle te suit partout.
   `ferme` la montre en sourdine, `si` la conditionne à ton avancement. */
/* ---------- ce que le hub propose, port par port ----------
   `ou` range la tuile dans une famille, `ici` la limite à un port.
   Les familles sont dans l'ordre où on les traverse : d'abord ce qui
   demande quelque chose, puis les lieux, puis toi, puis les autres. */
const FAMILLES = [
  { k:'attend', t:'Ce qui t\'attend', gd:1 },
  { k:'lieu',   t:'Le port' },
  { k:'toi',    t:'Toi' },
  { k:'autres', t:'Les autres' }
];

const TUILES = [

/* ce que tu as déjà vécu, pour savoir quelles portes sont ouvertes */
let VECU = [];


let hubEtat = {}, D = null;

/* une tuile est close si le lieu n'existe pas encore,
   ou si l'histoire ne t'y a pas encore mené */
function close(t){
  return !!t.ferme || (t.si && !VECU.includes(t.si));
}
function sousTitre(t){
  if (t.ferme) return t.s;
  if (t.si && !VECU.includes(t.si)) return t.sinon || t.s;
  return t.sv || t.s;
}

function dessinerTuiles(){
  const E = hubEtat;
  const DISPO = TUILES.filter(t => !t.ici || t.ici === PORT);
  let h = '';

  FAMILLES.forEach(F => {
    const lot = DISPO.filter(t => t.ou === F.k);
    if (!lot.length) return;
    h += '<p class="sec">' + F.t + '</p>';

    if (F.gd){
      /* la première famille est en grandes cartes : ce sont les gestes
         du jour, ils méritent d'être vus sans qu'on les cherche */
      h += lot.map(t =>
        '<button class="pri" data-k="' + t.k + '"' + (close(t) ? ' disabled' : '') + '>'
        + '<span class="em">' + t.em + '</span>'
        + '<span class="co"><b>' + t.t + '</b><span>' + sousTitre(t) + '</span></span>'
        + (!close(t) && E[t.k] ? '<span class="nb">' + E[t.k] + '</span>' : '')
        + '</button>').join('');
    } else {
      /* les autres en lignes serrées : on les consulte, on n'y court pas */
      h += '<div class="bloc">' + lot.map(t =>
        '<button class="li" data-k="' + t.k + '"' + (close(t) ? ' disabled' : '') + '>'
        + '<span class="em">' + t.em + '</span>'
        + '<span class="co"><b>' + t.t + '</b><span>' + sousTitre(t) + '</span></span>'
        + (!close(t) && E[t.k]
            ? '<span class="nb2">' + E[t.k] + '</span>'
            : '<span class="fl">' + (close(t) ? '' : '›') + '</span>')
        + '</button>').join('') + '</div>';
    }
  });

  document.getElementById('tuiles').innerHTML = h;
  document.querySelectorAll('#tuiles [data-k]').forEach(el => {
    const t = TUILES.find(x => x.k === el.dataset.k);
    if (t && t.f && !close(t)) el.onclick = t.f;
  });
}

/* ---------- le cadeau du jour ---------- */
const EMOJI = { euros:'💰', energie:'⚡', xp:'📖' };
let cadPris = true;

async function poserCadeau(){
  let r;
  try { r = await BD.agir('mon_cadeau'); } catch(e){ return; }
  if (!r || !r.ok) return;
  const b = document.getElementById('cadeau');
  cadPris = !r.a_prendre;
  b.classList.toggle('pris', cadPris);
  if (cadPris){
    document.getElementById('cad-t').textContent = 'Cadeau pris aujourd\'hui';
    document.getElementById('cad-s').textContent = 'Reviens demain';
  } else {
    document.getElementById('cad-t').textContent = 'Le cadeau du jour';
    document.getElementById('cad-s').textContent = 'Ouvre-le, on ne sait jamais';
  }
  const sr = document.getElementById('cad-sr');
  if (r.serie > 1){
    sr.textContent = r.serie + ' jours d\'affilée';
    sr.style.display = '';
  } else sr.style.display = 'none';
}

document.getElementById('cadeau').onclick = async () => {
  if (cadPris) return;
  const b = document.getElementById('cadeau');
  b.classList.add('pris');
  cadPris = true;
  let r;
  try { r = await BD.agir('ouvrir_cadeau'); } catch(e){ return; }
  if (!r || !r.ok){ poserCadeau(); return; }

  document.getElementById('ouv-em').textContent = EMOJI[r.quoi] || '🎁';
  document.getElementById('ouv-g').textContent = r.nom;
  document.getElementById('ouv-m').textContent = r.mot;
  const sr = document.getElementById('ouv-sr');
  if (r.serie > 1){ sr.textContent = r.serie + ' jours d\'affilée'; sr.style.display = ''; }
  else sr.style.display = 'none';
  document.getElementById('ouv').classList.add('on');
  poserCadeau();
};
document.getElementById('rade').onclick = () =>
  location.href = PAGE_PORT[PORT] || 'jeu.html';

document.getElementById('ouv-ok').onclick = () => {
  document.getElementById('ouv').classList.remove('on');
  location.reload();
};

(async () => {
  try {
    const d = await BD.charger();
    if (!d){ location.href = 'index.html'; return; }
    D = d;

    const av = document.getElementById('hub-av');
    av.innerHTML = BD.avatarSVG(d);
    /* on demande au dessin de couvrir le cadre plutôt que de s'y contenir */
    const sv = av.querySelector('svg');
    if (sv) sv.setAttribute('preserveAspectRatio', 'xMidYMid slice');
    /* le hub prend la couleur du port où l'on se trouve */
    PORT = d.port || 'anse';
    VECU = (d.rencontres || []).slice();
    /* ouvrir une affaire chez Félix débloque la fabrique */
    if (d.affaire) VECU.push('affaire');
    document.getElementById('rade-t').textContent = RADE[PORT] || RADE.anse;
    document.getElementById('pied').textContent =
      'Battle Dock — ' + (PORTS_N[PORT] || 'Marseille');

    document.getElementById('hub-nom').textContent = d.pseudo || '';
    document.getElementById('hub-ou').textContent =
      (PORTS_N[d.port] || 'En mer') + ' · niveau ' + (d.niveau || 1);
    document.getElementById('hub-eu').textContent =
      Math.round(Number(d.euros || 0)).toLocaleString('fr-FR') + ' €';
    document.getElementById('hub-xp').textContent =
      Number(d.xp || 0).toLocaleString('fr-FR');

    const nrj = Number(d.energie ?? 100), nmax = Number(d.energie_max || 100);
    const jn = document.getElementById('hub-nrj');
    jn.style.width = Math.min(100, nrj / nmax * 100).toFixed(0) + '%';
    jn.classList.toggle('plein', nrj > nmax);
    /* dans le pied, le chiffre seul : la barre en dessous dit le reste */
    document.getElementById('hub-nrjn').textContent = Math.round(nrj);


    dessinerTuiles();
    poserCadeau();
    paraitre();

    /* les compteurs */
    const r = await BD.agir('ce_qui_attend');
    if (r && r.ok){
      const P = r.pastilles || {};
      hubEtat = { contrats: P.contrats ? (r.contrats || 1) : 0,
                  quetes: P.quetes ? 1 : 0 };
      /* ce que ta fabrique a fait pendant que tu n'étais pas là */
      const st = Math.floor(Number((((D || {}).affaire || {}).prod || {}).stock || 0));
      if (st >= 1) hubEtat.fabrique = st;
      dessinerTuiles();
    }
  } catch(e){
    console.warn(e);
    dessinerTuiles();
  }
})();
