<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#f5a53a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Battle Dock</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="chaud.css?v=2">
<style>
/* ---------- ce qui est propre au hub ---------- */
.moi{padding:calc(env(safe-area-inset-top) + 20px) 4px 18px;
  display:flex;align-items:center;gap:14px}
.moi .av{width:58px;height:58px;border-radius:16px;flex:0 0 58px;overflow:hidden;
  background:var(--creme);border:3px solid var(--encre);
  }
.moi .av svg{width:100%;height:100%;display:block}
.moi .q{flex:1;min-width:0}
.moi .q b{display:block;font-family:'DM Serif Display',Georgia,serif;
  font-size:26px;line-height:1.05;color:#fffaf0;
  text-shadow:0 2px 0 rgba(18,48,63,.34)}
.moi .q span{display:block;font-size:11px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:rgba(255,250,240,.76);margin-top:4px}

.duo{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:13px}
.ct{position:relative;padding:15px 16px;border-radius:16px;
  background:var(--creme);border:3px solid var(--encre);}
.ct b{display:block;font-family:'DM Serif Display',Georgia,serif;font-size:28px;
  line-height:1;color:var(--encre)}
.ct span{display:block;font-size:10px;font-weight:800;letter-spacing:.16em;
  text-transform:uppercase;color:rgba(18,48,63,.5);margin-top:6px}
.ct .em{position:absolute;top:12px;right:13px;font-size:21px}

.nrj{padding:14px 16px;border-radius:16px;margin-bottom:18px;
  background:var(--creme);border:3px solid var(--encre);}
.nrj .l1{display:flex;justify-content:space-between;align-items:baseline;
  margin-bottom:9px}
.nrj .l1 span{font-size:10px;font-weight:800;letter-spacing:.16em;
  text-transform:uppercase;color:rgba(18,48,63,.5)}
.nrj .l1 b{font-family:'DM Serif Display',Georgia,serif;font-size:21px;line-height:1}
.nrj .ba{height:12px;border-radius:8px;background:rgba(18,48,63,.1);
  border:2px solid var(--encre);overflow:hidden}
.nrj .ba i{display:block;height:100%;background:var(--vert);
  transition:width .6s cubic-bezier(.3,.9,.3,1)}
.nrj .ba i.plein{background:var(--or)}

.cad{position:relative;display:flex;align-items:center;gap:14px;width:100%;
  padding:17px 18px;margin-bottom:20px;border-radius:18px;cursor:pointer;
  overflow:hidden;text-align:left;
  background:var(--rouge);border:3px solid var(--encre);
  font-family:'Nunito',sans-serif;transition:background .12s}
.cad:active{background:var(--creme2)}
.cad > i{position:absolute;width:8px;height:12px;border-radius:2px;top:-14px;
  animation:tombe 3.4s linear infinite}
.cad > i:nth-child(1){left:18%;background:#ffd68c}
.cad > i:nth-child(2){left:38%;background:#a8e8c0;animation-delay:.7s}
.cad > i:nth-child(3){left:62%;background:#fff6e4;animation-delay:1.4s}
.cad > i:nth-child(4){left:82%;background:#9cc8f0;animation-delay:.4s}
@keyframes tombe{0%{transform:translateY(0) rotate(0);opacity:0}
  15%{opacity:1}85%{opacity:1}
  100%{transform:translateY(104px) rotate(400deg);opacity:0}}
.cad .em{position:relative;z-index:2;font-size:31px;flex:0 0 auto}
.cad .tx{position:relative;z-index:2;flex:1;min-width:0}
.cad .tx b{display:block;font-family:'DM Serif Display',Georgia,serif;
  font-size:20px;color:#fffaf0;line-height:1.1}
.cad .tx span{display:block;font-size:12px;font-weight:600;
  color:rgba(255,250,240,.8);margin-top:4px}
.cad .sr{position:relative;z-index:2;flex:0 0 auto;padding:5px 10px;
  border-radius:20px;font-size:11px;font-weight:800;color:var(--encre);
  background:var(--creme);border:2px solid var(--encre);white-space:nowrap}
.cad.pris{background:rgba(253,246,230,.55);cursor:default}
.cad.pris .tx b{color:rgba(18,48,63,.6)}
.cad.pris .tx span{color:rgba(18,48,63,.44)}
.cad.pris .em{opacity:.4}
.cad.pris > i{display:none}
.cad.pris:active{transform:none;}

.pri{position:relative;display:flex;align-items:center;gap:15px;width:100%;
  padding:17px 18px;margin-bottom:12px;border-radius:18px;cursor:pointer;
  text-align:left;background:var(--creme);border:3px solid var(--encre);
  font-family:'Nunito',sans-serif;
  transition:background .12s}
.pri:active{background:var(--creme2)}
.pri .em{font-size:29px;flex:0 0 auto}
.pri .co{flex:1;min-width:0}
.pri .co b{display:block;font-family:'DM Serif Display',Georgia,serif;
  font-size:20px;line-height:1.1}
.pri .co span{display:block;font-size:12px;font-weight:600;
  color:rgba(18,48,63,.56);margin-top:4px}
.pri .nb{flex:0 0 auto;min-width:34px;height:34px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;padding:0 9px;
  font-family:'DM Serif Display',Georgia,serif;font-size:18px;
  background:var(--or);border:2.5px solid var(--encre)}
/* une tuile close se voit : plus terne, et elle ne répond pas */
.pri:disabled,.li:disabled{opacity:.44;cursor:default}

.ouv{position:fixed;inset:0;z-index:70;display:flex;align-items:center;
  justify-content:center;padding:26px;background:rgba(18,48,63,.72);
  opacity:0;pointer-events:none;transition:opacity .35s}
.ouv.on{opacity:1;pointer-events:auto}
.ouv .ca{width:100%;max-width:310px;border-radius:20px;overflow:hidden;
  text-align:center;padding:32px 24px 0;background:var(--creme);
  border:3px solid var(--encre);
  transform:scale(.88) rotate(-2deg);
  transition:transform .45s cubic-bezier(.3,1.5,.5,1)}
.ouv.on .ca{transform:none}
.ouv .em{font-size:52px;line-height:1;margin-bottom:14px;
  animation:saut .7s cubic-bezier(.3,1.6,.5,1) both}
@keyframes saut{from{transform:scale(.3) rotate(-20deg);opacity:0}
  to{transform:none;opacity:1}}
.ouv .gain{font-family:'DM Serif Display',Georgia,serif;font-size:34px;
  color:var(--encre);line-height:1}
.ouv .mot{font-size:13px;font-weight:600;color:rgba(18,48,63,.62);margin-top:10px}
.ouv .sr2{display:inline-block;margin-top:16px;padding:6px 14px;border-radius:20px;
  font-size:12px;font-weight:800;background:var(--or);
  border:2.5px solid var(--encre)}
.ouv button{width:calc(100% + 48px);margin:24px -24px 0;padding:17px;
  border:0;border-top:3px solid var(--encre);cursor:pointer;
  background:var(--or);color:var(--encre);
  font-family:'DM Serif Display',Georgia,serif;font-size:18px}

/* ---------- le retour à la rade ---------- */
.rade{position:relative;display:flex;align-items:center;gap:15px;width:100%;
  padding:16px 18px 22px;margin-bottom:20px;border-radius:18px;cursor:pointer;
  overflow:hidden;text-align:left;
  background:linear-gradient(180deg,#4aa3cc 0%,#2d7ba8 58%,#1f5a80 100%);
  border:3px solid var(--encre);font-family:'Nunito',sans-serif;
  transition:background .12s}
.rade:active{background:linear-gradient(180deg,#3d8fb8 0%,#256b94 58%,#1a4d6e 100%)}
/* trois vagues au fond, qui glissent doucement */
.rade .flots{position:absolute;left:0;right:0;bottom:0;height:14px;opacity:.3}
.rade .flots i{position:absolute;left:-50%;right:-50%;height:2.5px;border-radius:2px;
  background:repeating-linear-gradient(90deg,#fdf6e6 0 14px,transparent 14px 30px);
  animation:flot 7s linear infinite}
.rade .flots i:nth-child(1){bottom:10px;animation-duration:9s}
.rade .flots i:nth-child(2){bottom:6px;animation-duration:6.4s;animation-delay:-2s}
.rade .flots i:nth-child(3){bottom:2px;animation-duration:4.8s;animation-delay:-1s}
@keyframes flot{to{transform:translateX(30px)}}
.rade .em{position:relative;z-index:2;font-size:30px;flex:0 0 auto;
  animation:tangue 3.4s ease-in-out infinite;transform-origin:50% 80%}
@keyframes tangue{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
.rade .tx{position:relative;z-index:2;flex:1;min-width:0}
.rade .tx b{display:block;font-family:'DM Serif Display',Georgia,serif;
  font-size:20px;color:#fffaf0;line-height:1.1}
.rade .tx span{display:block;font-size:12px;font-weight:600;
  color:rgba(255,250,240,.8);margin-top:4px}
.rade .fl{position:relative;z-index:2;font-size:22px;color:rgba(255,250,240,.7);
  font-weight:800}
</style>
</head>
<body>

<div class="pont">

  <div class="moi">
    <span class="av" id="hub-av"></span>
    <span class="q attend" id="q"><b id="hub-nom"></b><span id="hub-ou"></span></span>
  </div>

  <div class="duo attend" id="duo">
    <div class="ct"><span class="em">💰</span>
      <b id="hub-eu">—</b><span>en caisse</span></div>
    <div class="ct"><span class="em">🧭</span>
      <b id="hub-xp">—</b><span>xp</span></div>
  </div>

  <div class="nrj attend" id="nrj">
    <div class="l1"><span>Ton énergie</span><b id="hub-nrjn">—</b></div>
    <div class="ba"><i id="hub-nrj" style="width:0%"></i></div>
  </div>

  <button class="rade attend" id="rade">
    <span class="flots"><i></i><i></i><i></i></span>
    <span class="em">⚓</span>
    <span class="tx"><b>Retour au port</b>
      <span>Le quai, la barque, la mer devant</span></span>

  </button>

  <button class="cad attend" id="cadeau">
    <i></i><i></i><i></i><i></i>
    <span class="em">🎁</span>
    <span class="tx"><b id="cad-t">Le cadeau du jour</b>
      <span id="cad-s">Ouvre-le, on ne sait jamais</span></span>
    <span class="sr" id="cad-sr" style="display:none"></span>
  </button>

  <div id="tuiles" class="attend"></div>
  <p class="pied attend" id="pied">Battle Dock — Marseille</p>
</div>

<div class="ouv" id="ouv">
  <div class="ca">
    <p class="em" id="ouv-em">🎁</p>
    <p class="gain" id="ouv-g">—</p>
    <p class="mot" id="ouv-m">—</p>
    <span class="sr2" id="ouv-sr"></span>
    <button id="ouv-ok">Bien</button>
  </div>
</div>

}

function euro(v){
  return Number(v || 0).toLocaleString('fr-FR', { minimumFractionDigits: 2 }) + ' €';
}

/* Le hub est le même partout : c'est ton menu, pas celui d'un lieu.
   Seuls le bouton du haut, le chantier et le pied changent selon le port. */
const PAGE_PORT = { anse:'jeu.html', barcelone:'barcelone.html',
                    palma:'palma.html', ajaccio:'ajaccio.html' };
const RADE = {
  anse:      { t:'Retour au port',     s:'Le quai, la barque, la mer devant' },
  barcelone: { t:'Retour au bassin',   s:'Le môle, les grues, ta barque à quai' },
  palma:     { t:'Retour au port',     s:'Palma, et ta barque au mouillage' },
  ajaccio:   { t:'Retour au golfe',    s:'Ajaccio, la montagne dans le dos' }
};
let PORT = 'anse';

/* chaque tuile renvoie vers le port où l'on est, en demandant d'y ouvrir un panneau */
function aller(quoi){
  try { sessionStorage.setItem('bd-ouvrir', quoi); } catch(e){}
  location.href = PAGE_PORT[PORT] || 'jeu.html';
}

/* ---------- ce que le hub propose, port par port ----------
   La mise en page ne bouge pas : ce sont les tuiles qui changent.
   `ici` dit où la tuile existe ; sans `ici`, elle te suit partout.
   `ferme` la montre en sourdine, `si` la conditionne à ton avancement. */
const TUILES = [
  /* ---- ton anse ---- */
  { k:'contrats', ici:'anse', gd:1, em:'🏷️', t:'Les contrats', s:'Ce qu\'on te propose',
    f:() => location.href = 'contrats.html' },
  { k:'chantier', ici:'anse', em:'🔨', t:'Le chantier', s:'Toussaint et ta barque',
    f:() => location.href = 'chantier.html' },
  { k:'fabrique', ici:'anse', em:'🏭', t:'Ta fabrique', s:'Elle produit même en ton absence',
    si:'affaire', sinon:'Il faut ouvrir une affaire chez Félix',
    f:() => location.href = 'anse.html' },

  /* ---- Barcelone ---- */
  { k:'chargement', ici:'barcelone', gd:1, em:'🏷️', t:'Le chargement',
    s:'Ce que Miquel te confie', si:'miquel',
    sinon:'Il faut d\'abord rencontrer quelqu\'un',
    f:() => location.href = 'contrats.html' },
  { k:'taverne', ici:'barcelone', em:'🍷', t:'La taverne', s:'On y parle beaucoup',
    f:() => location.href = 'taverne.html' },
  { k:'marche', ici:'barcelone', em:'🧺', t:'Le marché', s:'Pas encore ouvert',
    ferme:1 },
  { k:'entrepot', ici:'barcelone', em:'🏚️', t:"L'entrepôt", s:'Pas encore ouvert',
    ferme:1 },

  /* ---- partout ---- */
  { k:'quetes', gd:1, em:'📓', t:'Ton carnet', s:'Les histoires en cours',
    f:() => location.href = 'carnet.html' },
  { k:'barque', em:'⛵', t:'Ta barque', s:'Les avirons',
    f:() => location.href = 'barque.html' },
  { k:'sacoche', em:'🎒', t:'Ta sacoche', s:'Ce que tu portes',
    f:() => location.href = 'sacoche.html' },
  { k:'fiche', em:'📋', t:'Ta fiche', s:'Ce que tu sais faire',
    f:() => location.href = 'fiche.html' },
  { k:'gens', em:'🧑‍🤝‍🧑', t:'Les gens', s:'Ce qu\'ils pensent de toi',
    f:() => location.href = 'gens.html' },
  { k:'classement', em:'🏆', t:'Le classement', s:'Qui mène la danse',
    f:() => location.href = 'classement.html' }
];

/* ce que tu as déjà vécu, pour savoir quelles portes sont ouvertes */
let VECU = [];


let hubEtat = {};

/* une tuile est close si le lieu n'existe pas encore,
   ou si l'histoire ne t'y a pas encore mené */
function close(t){
  return !!t.ferme || (t.si && !VECU.includes(t.si));
}
function sousTitre(t){
  if (t.ferme) return t.s;
  if (t.si && !VECU.includes(t.si)) return t.sinon || t.s;
  return t.sv || t.s;
}

function dessinerTuiles(){
  const E = hubEtat;
  const DISPO = TUILES.filter(t => !t.ici || t.ici === PORT);
  const GD = DISPO.filter(t => t.gd), RE = DISPO.filter(t => !t.gd);

  let h = GD.map(t =>
    '<button class="pri" data-k="' + t.k + '"' + (close(t) ? ' disabled' : '') + '>'
    + '<span class="em">' + t.em + '</span>'
    + '<span class="co"><b>' + t.t + '</b><span>' + sousTitre(t) + '</span></span>'
    + (!close(t) && E[t.k] > 0 ? '<span class="nb">' + E[t.k] + '</span>' : '')
    + '</button>').join('');

  h += '<p class="sec">Le reste</p><div class="bloc">'
    + RE.map(t =>
      '<button class="li" data-k="' + t.k + '"' + (close(t) ? ' disabled' : '') + '>'
      + '<span class="em">' + t.em + '</span>'
      + '<span class="co"><b>' + t.t + '</b><span>' + sousTitre(t) + '</span></span>'
      + '<span class="fl">' + (close(t) ? '' : '›') + '</span></button>').join('')
    + '</div>';

  document.getElementById('tuiles').innerHTML = h;
  document.querySelectorAll('#tuiles [data-k]').forEach(el => {
    const t = TUILES.find(x => x.k === el.dataset.k);
    if (t && t.f && !close(t)) el.onclick = t.f;
  });
}

/* ---------- les contrats ---------- */
const OU_NOM = { anse:'Marseille', marseille:'Marseille', barcelone:'Barcelone',
                 palma:'Palma', ajaccio:'Ajaccio' };


/* ---------- l'entrepôt ---------- */

/* ---------- le cadeau du jour ---------- */
const EMOJI = { euros:'💰', energie:'⚡', xp:'📖' };
let cadPris = true;

async function poserCadeau(){
  let r;
  try { r = await BD.agir('mon_cadeau'); } catch(e){ return; }
  if (!r || !r.ok) return;
  const b = document.getElementById('cadeau');
  cadPris = !r.a_prendre;
  b.classList.toggle('pris', cadPris);
  if (cadPris){
    document.getElementById('cad-t').textContent = 'Cadeau pris aujourd\'hui';
    document.getElementById('cad-s').textContent = 'Reviens demain';
  } else {
    document.getElementById('cad-t').textContent = 'Le cadeau du jour';
    document.getElementById('cad-s').textContent = 'Ouvre-le, on ne sait jamais';
  }
  const sr = document.getElementById('cad-sr');
  if (r.serie > 1){
    sr.textContent = r.serie + ' jours d\'affilée';
    sr.style.display = '';
  } else sr.style.display = 'none';
}

document.getElementById('cadeau').onclick = async () => {
  if (cadPris) return;
  const b = document.getElementById('cadeau');
  b.classList.add('pris');
  cadPris = true;
  let r;
  try { r = await BD.agir('ouvrir_cadeau'); } catch(e){ return; }
  if (!r || !r.ok){ poserCadeau(); return; }

  document.getElementById('ouv-em').textContent = EMOJI[r.quoi] || '🎁';
  document.getElementById('ouv-g').textContent = r.nom;
  document.getElementById('ouv-m').textContent = r.mot;
  const sr = document.getElementById('ouv-sr');
  if (r.serie > 1){ sr.textContent = r.serie + ' jours d\'affilée'; sr.style.display = ''; }
  else sr.style.display = 'none';
  document.getElementById('ouv').classList.add('on');
  poserCadeau();
};
document.getElementById('rade').onclick = () =>
  location.href = PAGE_PORT[PORT] || 'jeu.html';

document.getElementById('ouv-ok').onclick = () => {
  document.getElementById('ouv').classList.remove('on');
  location.reload();
};

(async () => {
  try {
    const d = await BD.charger();
    if (!d){ location.href = 'index.html'; return; }

    const av = document.getElementById('hub-av');
    av.innerHTML = BD.avatarSVG(d);
    /* on demande au dessin de couvrir le cadre plutôt que de s'y contenir */
    const sv = av.querySelector('svg');
    if (sv) sv.setAttribute('preserveAspectRatio', 'xMidYMid slice');
    /* le hub prend la couleur du port où l'on se trouve */
    PORT = d.port || 'anse';
    VECU = (d.rencontres || []).slice();
    /* ouvrir une affaire chez Félix débloque la fabrique */
    if (d.affaire) VECU.push('affaire');
    const R = RADE[PORT] || RADE.anse;
    document.querySelector('.rade .tx b').textContent = R.t;
    document.querySelector('.rade .tx span').textContent = R.s;
    document.getElementById('pied').textContent =
      'Battle Dock — ' + (PORTS_N[PORT] || 'Marseille');

    document.getElementById('hub-nom').textContent = d.pseudo || '';
    document.getElementById('hub-ou').textContent =
      (PORTS_N[d.port] || 'En mer') + ' · niveau ' + (d.niveau || 1);
    document.getElementById('hub-eu').textContent =
      Math.round(Number(d.euros || 0)).toLocaleString('fr-FR');
    document.getElementById('hub-xp').textContent =
      Number(d.xp || 0).toLocaleString('fr-FR');

    const nrj = Number(d.energie ?? 100), nmax = Number(d.energie_max || 100);
    const jn = document.getElementById('hub-nrj');
    jn.style.width = Math.min(100, nrj / nmax * 100).toFixed(0) + '%';
    jn.classList.toggle('plein', nrj > nmax);
    document.getElementById('hub-nrjn').textContent =
      Math.round(nrj) + ' / ' + nmax;


    dessinerTuiles();
    poserCadeau();
    paraitre();

    /* les compteurs */
    const r = await BD.agir('ce_qui_attend');
    if (r && r.ok){
      const P = r.pastilles || {};
      hubEtat = { contrats: P.contrats ? (r.contrats || 1) : 0,
                  quetes: P.quetes ? 1 : 0 };
      dessinerTuiles();
    }
  } catch(e){
    console.warn(e);
    dessinerTuiles();
  }
})();
</script>
</body>
