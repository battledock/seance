<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Battle Dock Fight — boutons simples</title>
<style>
:root{--trait:#2a1710;--creme:#fdf3e0;--ocre:#f2b134;--ocre-b:#b87a13;
  --terre:#d4472c;--terre-b:#96280f;--eau:#1d8a92;--eau-b:#0f4a50;
  --bois:#8a5a2e;--bois-b:#4a2916;--vert:#4f9c5a;--vert-b:#2c6234}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100%;background:linear-gradient(180deg,#f0a05a,#d97b46 48%,#1d6b72 48%,#0e3f47);
  font-family:"Arial Rounded MT Bold","Trebuchet MS",Verdana,sans-serif;font-weight:700;
  color:var(--trait);padding:22px 16px 60px;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;font-weight:700;border:0;cursor:pointer;width:100%}
h1{color:var(--creme);font-size:18px;font-style:italic;text-transform:uppercase;text-align:center;
  -webkit-text-stroke:4px var(--trait);paint-order:stroke fill}
.note{color:#fff2d8;font-family:"Trebuchet MS",sans-serif;font-weight:400;font-size:13px;
  text-align:center;margin:8px 0 22px;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.eti{color:#fff2d8;font-size:11px;text-transform:uppercase;letter-spacing:.14em;margin:24px 0 10px;
  text-shadow:0 1px 3px rgba(0,0,0,.5)}

/* ---------- A : plat ---------- */
.a{background:var(--ocre);color:var(--trait);border-radius:14px;padding:17px;font-size:18px;
  text-transform:uppercase;margin-bottom:10px}
.a.t{background:var(--terre);color:var(--creme)}
.a.e{background:var(--eau);color:var(--creme)}
.a:active{opacity:.85}

/* ---------- B : léger relief ---------- */
.b{background:var(--ocre);color:var(--trait);border:3px solid var(--trait);border-radius:16px;
  padding:16px;font-size:18px;text-transform:uppercase;box-shadow:0 5px 0 var(--ocre-b);margin-bottom:10px}
.b.t{background:var(--terre);color:var(--creme);box-shadow:0 5px 0 var(--terre-b)}
.b.e{background:var(--eau);color:var(--creme);box-shadow:0 5px 0 var(--eau-b)}
.b.v{background:var(--vert);color:var(--creme);box-shadow:0 5px 0 var(--vert-b)}
.b:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.4)}

/* ---------- C : relief + icône ---------- */
.c{display:flex;align-items:center;gap:11px;background:var(--ocre);color:var(--trait);
  border:3px solid var(--trait);border-radius:16px;padding:14px 16px;font-size:17px;
  text-transform:uppercase;box-shadow:0 5px 0 var(--ocre-b);margin-bottom:10px;text-align:left}
.c canvas{width:26px;height:26px;image-rendering:pixelated;flex:0 0 auto}
.c span{flex:1}
.c em{font-style:normal;opacity:.6;font-size:15px}
.c.t{background:var(--terre);color:var(--creme);box-shadow:0 5px 0 var(--terre-b)}
.c.b{background:var(--bois);color:var(--creme);box-shadow:0 5px 0 var(--bois-b)}
.c.v{background:var(--vert);color:var(--creme);box-shadow:0 5px 0 var(--vert-b)}
.c:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.4)}

/* ---------- tuiles ---------- */
.g{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.tu{background:var(--bois);color:var(--creme);border:3px solid var(--trait);border-radius:16px;
  padding:11px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:6px;
  font-size:10.5px;text-transform:uppercase;box-shadow:0 5px 0 var(--bois-b)}
.tu canvas{width:28px;height:28px;image-rendering:pixelated}
.tu.v{background:var(--vert);box-shadow:0 5px 0 var(--vert-b)}
.tu.e{background:var(--eau);box-shadow:0 5px 0 var(--eau-b)}
.tu.o{background:var(--ocre);color:var(--trait);box-shadow:0 5px 0 var(--ocre-b)}
.tu:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.4)}
</style>
</head>
<body>
<h1>Trois niveaux, du plus sobre au plus habillé</h1>
<p class="note">Dis-moi juste A, B ou C.</p>

<div class="eti">A · plat</div>
<button class="a t">Combattre</button>
<button class="a">Tirer un billet</button>
<button class="a e">Vestiaire</button>

<div class="eti">B · léger relief</div>
<button class="b t">Combattre</button>
<button class="b">Tirer un billet</button>
<button class="b e">Vestiaire</button>
<button class="b v">Caisses</button>

<div class="eti">C · relief + icône</div>
<button class="c t"><canvas class="ic" data-ic="gants"></canvas><span>Combattre</span><em>▸</em></button>
<button class="c"><canvas class="ic" data-ic="billet"></canvas><span>Tirer un billet</span><em>▸</em></button>
<button class="c v"><canvas class="ic" data-ic="casque"></canvas><span>Vestiaire</span><em>▸</em></button>
<button class="c b"><canvas class="ic" data-ic="caisse"></canvas><span>Caisses</span><em>▸</em></button>

<div class="eti">Tuiles assorties</div>
<div class="g">
  <button class="tu o"><canvas class="ic" data-ic="billet"></canvas>Billet</button>
  <button class="tu v"><canvas class="ic" data-ic="casque"></canvas>Vestiaire</button>
  <button class="tu"><canvas class="ic" data-ic="caisse"></canvas>Caisses</button>
  <button class="tu e"><canvas class="ic" data-ic="coupe"></canvas>Palmarès</button>
</div>

<script src="bdf.js"></script>
<script>
const px=BDF.px;
function icone(cv,t){
  cv.width=32;cv.height=32;
  const g=cv.getContext('2d');g.imageSmoothingEnabled=false;g.clearRect(0,0,32,32);
  if(t==='billet'){px(g,3,9,26,15,'#fff8e8');px(g,3,9,26,4,'#d4472c');
    px(g,6,17,13,2,'#8d8073');px(g,6,21,10,2,'#8d8073');px(g,21,17,5,5,'#f2b134');}
  if(t==='casque'){px(g,7,11,18,9,'#f2b134');px(g,4,19,24,4,'#b87a13');px(g,13,7,6,4,'#f2b134');}
  if(t==='caisse'){px(g,4,10,24,17,'#c08a52');px(g,4,17,24,2,'#4a2916');
    px(g,13,19,6,6,'#f2b134');px(g,4,25,24,2,'#4a2916');}
  if(t==='coupe'){px(g,10,6,12,11,'#ffe08a');px(g,6,8,4,6,'#f2b134');px(g,22,8,4,6,'#f2b134');
    px(g,14,17,4,5,'#b87a13');px(g,9,22,14,5,'#9a6238');}
  if(t==='gants'){px(g,4,12,11,11,'#f0e2c8');px(g,3,15,3,5,'#d8c8a8');
    px(g,17,12,11,11,'#f0e2c8');px(g,26,15,3,5,'#d8c8a8');}
}
document.querySelectorAll('canvas.ic').forEach(c=>icone(c,c.dataset.ic));
</script>
</body>
</html>
