<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Battle Dock Fight — couleurs des tuiles</title>
<style>
:root{--trait:#2a1710;--creme:#fdf3e0}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100%;background:linear-gradient(180deg,#f0a05a,#d97b46 46%,#1d6b72 46%,#0e3f47);
  font-family:"Arial Rounded MT Bold","Trebuchet MS",Verdana,sans-serif;font-weight:700;
  color:var(--trait);padding:20px 15px 60px;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;font-weight:700;border:0;cursor:pointer}
h1{color:var(--creme);font-size:18px;font-style:italic;text-transform:uppercase;text-align:center;
  -webkit-text-stroke:4px var(--trait);paint-order:stroke fill}
.note{color:#fff2d8;font-family:"Trebuchet MS",sans-serif;font-weight:400;font-size:13px;
  text-align:center;margin:8px 0 20px;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.eti{color:#fff2d8;font-size:11.5px;text-transform:uppercase;letter-spacing:.13em;margin:22px 0 9px;
  text-shadow:0 1px 3px rgba(0,0,0,.5);display:flex;align-items:center;gap:8px}
.eti::after{content:"";flex:1;height:2px;background:rgba(255,242,216,.28);border-radius:2px}
.g{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.tu{border:3px solid var(--trait);border-radius:16px;padding:11px 4px 9px;
  display:flex;flex-direction:column;align-items:center;gap:6px;
  font-size:10.5px;text-transform:uppercase}
.tu canvas{width:28px;height:28px;image-rendering:pixelated}
.tu:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.45)!important}
</style>
</head>
<body>
<h1>Six palettes pour les tuiles</h1>
<p class="note">Même forme partout, seules les couleurs changent. Dis-moi le numéro.</p>

<div class="eti">1 · Coucher de soleil</div>
<div class="g" id="p1"></div>

<div class="eti">2 · Pierre et rouille</div>
<div class="g" id="p2"></div>

<div class="eti">3 · Nuit portuaire</div>
<div class="g" id="p3"></div>

<div class="eti">4 · Agrumes du Sud</div>
<div class="g" id="p4"></div>

<div class="eti">5 · Crème et bois</div>
<div class="g" id="p5"></div>

<div class="eti">6 · Franc et vif</div>
<div class="g" id="p6"></div>

<script src="bdf.js"></script>
<script>
const px=BDF.px;
const PAL={
  p1:[['#f2765a','#a83b28'],['#f7a24c','#b06414'],['#e8607f','#9c2f46'],['#7d5a9c','#4a3161']],
  p2:[['#9aa0a6','#5d6469'],['#b5623a','#71341a'],['#d9b98a','#9c8054'],['#5a6b74','#33424a']],
  p3:[['#2a4a7a','#152a4a'],['#1d7a80','#0d4348'],['#4a3f7a','#271f47'],['#e0a52c','#96690f']],
  p4:[['#f2cf3c','#b09410'],['#e8642c','#9c360f'],['#7a9c3a','#47601c'],['#2ec4c9','#146d70']],
  p5:[['#f0e0bd','#b8a componente'],['#e8d6ae','#b0a077'],['#c96a4a','#8a3f26'],['#8a8a5c','#565636']],
  p6:[['#e8452c','#96250f'],['#2ec4c9','#136c70'],['#ffd029','#b08c0c'],['#c14fd6','#7a2b8a']]
};
PAL.p5=[['#efdfbc','#b0a077'],['#d8bd8a','#9c8054'],['#c96a4a','#8a3f26'],['#8a8a5c','#565636']];
const ITEMS=[['billet','Billet'],['casque','Vestiaire'],['caisse','Caisses'],['coupe','Palmarès']];
function icone(cv,t,sombre){
  cv.width=32;cv.height=32;
  const g=cv.getContext('2d');g.imageSmoothingEnabled=false;g.clearRect(0,0,32,32);
  if(t==='billet'){px(g,3,9,26,15,'#fff8e8');px(g,3,9,26,4,'#d4472c');
    px(g,6,17,13,2,'#8d8073');px(g,6,21,10,2,'#8d8073');px(g,21,17,5,5,'#f2b134');}
  if(t==='casque'){px(g,7,11,18,9,'#f2b134');px(g,4,19,24,4,'#b87a13');px(g,13,7,6,4,'#f2b134');}
  if(t==='caisse'){px(g,4,10,24,17,'#c08a52');px(g,4,17,24,2,'#4a2916');
    px(g,13,19,6,6,'#f2b134');px(g,4,25,24,2,'#4a2916');}
  if(t==='coupe'){px(g,10,6,12,11,'#ffe08a');px(g,6,8,4,6,'#f2b134');px(g,22,8,4,6,'#f2b134');
    px(g,14,17,4,5,'#b87a13');px(g,9,22,14,5,'#9a6238');}
}
function clair(hex){
  const n=parseInt(hex.slice(1),16);
  return (((n>>16)*299+((n>>8)&255)*587+(n&255)*114)/1000)>150;
}
Object.entries(PAL).forEach(([id,cs])=>{
  const z=document.getElementById(id);
  ITEMS.forEach(([ic,nom],i)=>{
    const [c,o]=cs[i];
    const b=document.createElement('button');
    b.className='tu';b.style.background=c;b.style.boxShadow='0 5px 0 '+o;
    b.style.color=clair(c)?'#2a1710':'#fdf3e0';
    const cv=document.createElement('canvas');
    const s=document.createElement('span');s.textContent=nom;
    b.append(cv,s);z.appendChild(b);icone(cv,ic);
  });
});
</script>
</body>
</html>
