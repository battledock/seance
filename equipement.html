<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#101f2e">
<title>Battle Dock — L'équipement</title>
<link rel="stylesheet" href="couleurs.css?v=2">
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=DM+Serif+Display&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ============================================================
   L'ÉQUIPEMENT
   Deux lieux dans une seule page, et ils ne se ressemblent pas :
   la garde-robe est froide comme une cabine, l'étal est chaud
   comme une échoppe de bois. C'est le changement de matière qui
   fait qu'on sait où l'on est sans lire le titre.
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none}
html,body{min-height:100%;background:var(--nuit-mer);color:var(--clair);
  font-family:'Nunito',system-ui,sans-serif}
body{padding:calc(env(safe-area-inset-top) + 14px) 14px
  calc(env(safe-area-inset-bottom) + 30px);transition:background .4s}
body.etal{background:#1a120a}

.tete{display:flex;align-items:center;gap:11px;margin-bottom:14px}
.tete .ret{flex:0 0 40px;height:40px;border-radius:11px;cursor:pointer;
  border:3px solid var(--clair);background:transparent;display:flex;
  align-items:center;justify-content:center}
.tete .ret svg{width:17px;height:17px;stroke:var(--clair);fill:none;
  stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.tete .q{flex:1;min-width:0}
.tete .q b{display:block;font-family:'DM Serif Display',Georgia,serif;font-size:23px}
.tete .q span{display:block;font-size:9px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--clair-faible);font-weight:800;margin-top:3px}
.tete .eu{flex:0 0 auto;padding:9px 13px;border-radius:12px;background:rgba(8,16,24,.5);
  border:2.5px solid var(--bord-nuit);font-size:14px;font-weight:900;
  font-variant-numeric:tabular-nums}

.onglets{display:flex;gap:7px;margin-bottom:18px}
.onglets button{flex:1;padding:13px 6px;border-radius:13px;cursor:pointer;
  font-family:inherit;font-size:14px;font-weight:800;
  border:3px solid rgba(242,230,207,.2);background:transparent;color:var(--clair)}
.onglets button.on{background:rgba(242,230,207,.08);border-color:var(--or)}

/* ---------- la silhouette et ses six emplacements ---------- */
.corps{position:relative;display:grid;grid-template-columns:1fr 108px 1fr;
  gap:7px;align-items:center;margin-bottom:18px;padding:14px 0;
  border-radius:18px;background:
    radial-gradient(ellipse at 50% 42%, rgba(240,169,46,.09), transparent 62%),
    rgba(8,16,24,.4);
  border:2.5px solid var(--bord-nuit)}
.corps .fig{grid-column:2}
.corps .fig svg{display:block;width:100%;height:auto}
.emp{display:flex;flex-direction:column;gap:7px}
.emp .e{padding:8px 10px;border-radius:11px;background:rgba(26,51,72,.7);
  border:2px solid var(--bord-nuit);cursor:pointer;min-height:52px;
  display:flex;flex-direction:column;justify-content:center;
  transition:border-color .16s,background .16s}
.emp .e.vide{border-style:dashed;opacity:.5}
.emp .e.r1{border-color:#5d8fa8} .emp .e.r2{border-color:#3f9e6b}
.emp .e.r3{border-color:#b07acb} .emp .e.r4{border-color:var(--or)}
.emp .e i{display:block;font-style:normal;font-size:7.5px;letter-spacing:.15em;
  text-transform:uppercase;font-weight:900;color:var(--clair-faible)}
.emp .e b{display:block;font-size:12px;line-height:1.3;margin-top:3px}
.emp.d{text-align:right}

/* le total de ce que tu portes */
.total{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.total span{padding:7px 11px;border-radius:11px;background:rgba(47,138,92,.12);
  border:2px solid rgba(140,224,168,.3);font-size:11.5px;font-weight:800}
.total span b{color:#8ce0a8}
.total .rien{background:rgba(242,230,207,.05);border-color:var(--bord-nuit);
  color:var(--clair-faible)}

/* ============================================================
   L'ÉTAL — une étagère de bois, pas une liste
   ============================================================ */
.rayon{margin-bottom:22px}
.rayon .titre{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.rayon .titre b{font-family:'DM Serif Display',Georgia,serif;font-size:19px;
  color:#f0d9a8}
.rayon .titre .tr{flex:1;height:2px;background:linear-gradient(90deg,
  rgba(240,169,46,.4), transparent)}
.planche{border-radius:14px;padding:11px;background:
  repeating-linear-gradient(90deg, #33210f 0 38px, #392612 38px 76px);
  border:3px solid #1c1208;box-shadow:0 5px 0 #14100a, 0 10px 22px rgba(0,0,0,.4)}

/* ---------- une pièce ---------- */
.piece{display:flex;gap:12px;padding:12px;border-radius:13px;margin-bottom:8px;
  background:rgba(10,20,28,.72);border:2.5px solid rgba(242,230,207,.14);
  position:relative;overflow:hidden}
.piece:last-child{margin-bottom:0}
.piece.r1{border-color:#5d8fa8}
.piece.r2{border-color:#3f9e6b}
.piece.r3{border-color:#b07acb;box-shadow:inset 0 0 24px rgba(176,122,203,.14)}
.piece.r4{border-color:var(--or);
  box-shadow:inset 0 0 30px rgba(240,169,46,.16), 0 0 0 1px rgba(240,169,46,.3)}
.piece.portee{background:rgba(240,169,46,.1)}
.piece.portee::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;
  background:var(--or)}

.piece .ic{flex:0 0 56px;height:56px;border-radius:12px;
  background:rgba(4,10,16,.6);border:2px solid rgba(242,230,207,.1);
  overflow:hidden;position:relative}
.piece .ic svg{display:block;width:100%;height:100%}
.piece.r3 .ic,.piece.r4 .ic{border-color:rgba(240,169,46,.3)}

.piece .co{flex:1;min-width:0}
.piece .co b{display:block;font-size:14.5px;line-height:1.25}
.piece .co .no{display:block;font-size:11px;line-height:1.5;
  color:var(--clair-faible);margin-top:3px;font-family:'Courier Prime',monospace}
.piece .bn{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.piece .bn span{padding:3px 7px;border-radius:8px;background:rgba(140,224,168,.14);
  border:1.5px solid rgba(140,224,168,.32);font-size:10px;font-weight:800;
  color:#8ce0a8;white-space:nowrap}

.piece .ac{flex:0 0 auto;display:flex;flex-direction:column;gap:6px;
  justify-content:center;align-items:flex-end}
.piece .ac button{padding:10px 13px;border-radius:11px;cursor:pointer;
  font-family:inherit;font-size:12.5px;font-weight:900;
  border:3px solid var(--nuit-mer);background:var(--or);color:#14202a;
  white-space:nowrap}
.piece .ac button.sobre{background:transparent;border-color:rgba(242,230,207,.28);
  color:var(--clair)}
.piece .ac button:disabled{background:rgba(242,230,207,.09);color:var(--clair-faible);
  border-color:transparent;cursor:default}
.piece .ac .pr{font-size:14px;font-weight:900;font-variant-numeric:tabular-nums;
  white-space:nowrap}
.piece .ac .pr.non{color:#e0765c}
.piece .ac .jours{font-size:9.5px;color:var(--clair-faible);font-weight:700}

.rar{display:inline-block;font-size:7.5px;letter-spacing:.14em;
  text-transform:uppercase;font-weight:900;padding:2px 6px;border-radius:7px;
  margin-left:7px;vertical-align:2px;background:rgba(242,230,207,.1);
  color:var(--clair-faible)}
.r1 .rar{background:rgba(93,143,168,.22);color:#9ccbdf}
.r2 .rar{background:rgba(63,158,107,.22);color:#8ce0a8}
.r3 .rar{background:rgba(176,122,203,.24);color:#d8b0ea}
.r4 .rar{background:var(--or);color:#14202a}

h2{font-size:9px;letter-spacing:.2em;text-transform:uppercase;font-weight:900;
  color:var(--clair-faible);margin:22px 2px 10px}
.rien{padding:26px 16px;text-align:center;font-size:13.5px;line-height:1.7;
  color:var(--clair-faible);border:3px dashed rgba(242,230,207,.16);
  border-radius:15px}
.msg{position:fixed;left:14px;right:14px;
  bottom:calc(env(safe-area-inset-bottom) + 14px);z-index:40;
  padding:13px 15px;border-radius:13px;font-size:13.5px;line-height:1.55;
  opacity:0;transform:translateY(10px);pointer-events:none;
  transition:opacity .2s,transform .2s}
.msg.on{opacity:1;transform:none}
.msg.mal{background:rgba(201,48,44,.9);border:2.5px solid #8a1f1c;color:#fff}
.msg.ok{background:rgba(47,138,92,.92);border:2.5px solid #1e6b44;color:#fff}
@media (prefers-reduced-motion:reduce){*{animation:none !important}}
</style>
</head>
<body>

<div class="tete">
  <button class="ret" id="ret" aria-label="Retour">
    <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <span class="q"><b>L'équipement</b><span id="sous">—</span></span>
  <span class="eu" id="eu">—</span>
</div>

<div class="onglets" id="onglets">
  <button data-v="porte" class="on">Ce que tu portes</button>
  <button data-v="etal">L'étal</button>
</div>

<div id="w"></div>
<p class="msg" id="msg"></p>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="bd.js?v=6"></script>
<script src="son.js?v=2"></script>
<script>
var $ = function(id){ return document.getElementById(id); };
var VUE = 'porte', B = null, G = null;

var RARETE = ['Commun','Bonne prise','Rare','Très rare','Introuvable'];
var NOMS = { force:'Force', endurance:'Endurance', precision_:'Précision',
             negociation:'Négociation', discussion:'Discussion', chance:'Chance',
             sang_froid:'Sang-froid', instinct:'Instinct' };
var OU = { anse:'Marseille', barcelone:'Barcelone', palma:'Palma',
           ajaccio:'Ajaccio' };

function eur(n){ return Math.round(Number(n) || 0).toLocaleString('fr-FR'); }

/* Un bon jour de quai rapporte environ 3 000 €. Dire le prix en
   journées de travail est plus parlant qu'un nombre à cinq chiffres. */
function jours(prix){
  var j = Math.round((Number(prix) || 0) / 3000);
  return j <= 1 ? 'un jour de quai' : j + ' jours de quai';
}

function dire(t, bon){
  var m = $('msg');
  m.textContent = t;
  m.className = 'msg on ' + (bon ? 'ok' : 'mal');
  setTimeout(function(){ m.className = 'msg'; }, 4200);
}

/* ============================================================
   LE DESSIN DES PIÈCES
   Chacune est dessinée, pas illustrée par un émoji : c'est ce
   qui fait qu'un étal ressemble à un étal.
   ============================================================ */
var TEINTE = ['#8a8f96','#5d8fa8','#3f9e6b','#b07acb','#f0a92e'];

function ic(inner, r){
  return '<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">'
    + '<rect width="40" height="40" fill="' + TEINTE[r] + '" opacity=".1"/>'
    + inner + '</svg>';
}

var DESSINS = {
  bonnet: function(c){ return '<path d="M9 26 q0 -15 11 -15 q11 0 11 15 z" fill="'
    + c + '"/><rect x="7" y="25" width="26" height="6" rx="3" fill="#e8dcc4"/>'; },
  chapeau_cire: function(c){ return '<ellipse cx="20" cy="27" rx="16" ry="5" fill="'
    + c + '"/><path d="M11 27 q1 -14 9 -14 q8 0 9 14 z" fill="' + c
    + '"/><rect x="11" y="22" width="18" height="4" fill="#1c2a34"/>'; },
  casquette_maitre: function(c){ return '<path d="M9 24 q0 -13 11 -13 q11 0 11 13 z"'
    + ' fill="' + c + '"/><path d="M8 24 h26 q6 0 6 5 h-32 z" fill="#1c2a34"/>'
    + '<circle cx="20" cy="14" r="3" fill="#f0a92e"/>'; },
  tricorne: function(c){ return '<path d="M4 28 q16 -22 32 0 q-16 7 -32 0 z" fill="'
    + c + '"/><path d="M20 8 q10 8 12 18" stroke="#e8dcc4" stroke-width="2"'
    + ' fill="none"/>'; },
  couronne_corail: function(c){ return '<path d="M8 30 l3 -14 l5 8 l4 -12 l4 12'
    + ' l5 -8 l3 14 z" fill="' + c + '"/><circle cx="20" cy="14" r="2.5"'
    + ' fill="#fff"/>'; },
  vareuse: function(c){ return '<path d="M12 10 h16 l5 5 l-3 4 l-2 -2 v15 h-16 v-15'
    + ' l-2 2 l-3 -4 z" fill="' + c + '"/>'; },
  caban: function(c){ return '<path d="M12 10 h16 l5 5 v17 h-21 z" fill="' + c
    + '"/><path d="M20 10 v22" stroke="#1c2a34" stroke-width="2"/>'
    + '<circle cx="24" cy="18" r="1.6" fill="#e8dcc4"/>'
    + '<circle cx="24" cy="25" r="1.6" fill="#e8dcc4"/>'; },
  manteau_pere: function(c){ return '<path d="M11 9 h18 v24 h-18 z" fill="' + c
    + '"/><path d="M11 15 h18 M11 21 h18 M11 27 h18" stroke="#e8dcc4"'
    + ' stroke-width="1" opacity=".5"/>'; },
  cape_huilee: function(c){ return '<path d="M20 8 q14 4 14 24 h-28 q0 -20 14 -24 z"'
    + ' fill="' + c + '"/><circle cx="20" cy="11" r="3" fill="#e8dcc4"/>'; },
  manteau_gouverneur: function(c){ return '<path d="M11 9 h18 v24 h-18 z" fill="' + c
    + '"/><path d="M14 9 v24 M26 9 v24" stroke="#f0a92e" stroke-width="2"/>'
    + '<circle cx="20" cy="16" r="3" fill="#f0a92e"/>'; },
  croc: function(c){ return '<rect x="18" y="8" width="4" height="18" rx="2" fill="'
    + '#6d4a30"/><path d="M20 26 q10 4 8 -8" stroke="' + c + '" stroke-width="4"'
    + ' fill="none" stroke-linecap="round"/>'; },
  gaffe: function(c){ return '<rect x="18" y="6" width="3.5" height="26" fill="#6d4a30"/>'
    + '<path d="M20 8 q8 2 6 9 M20 8 q-8 2 -6 9" stroke="' + c + '" stroke-width="3"'
    + ' fill="none" stroke-linecap="round"/>'; },
  sabre_ferrandi: function(c){ return '<path d="M10 30 q14 -6 22 -22" stroke="' + c
    + '" stroke-width="4" fill="none" stroke-linecap="round"/>'
    + '<rect x="7" y="27" width="8" height="4" rx="2" fill="#6d4a30"/>'; },
  massue_ghjuvanni: function(c){ return '<rect x="18" y="16" width="4" height="16"'
    + ' rx="2" fill="#6d4a30"/><ellipse cx="20" cy="12" rx="7" ry="9" fill="' + c
    + '"/><path d="M15 12 h10" stroke="#e8dcc4" stroke-width="1.6"/>'; },
  lanterne_sourde: function(c){ return '<rect x="12" y="10" width="16" height="18"'
    + ' rx="3" fill="#1c2a34" stroke="' + c + '" stroke-width="2"/>'
    + '<circle cx="20" cy="19" r="5" fill="#ffe08a"/>'
    + '<path d="M20 6 v4" stroke="' + c + '" stroke-width="2"/>'; },
  bourse: function(c){ return '<path d="M12 18 q8 -6 16 0 q3 12 -8 14 q-11 -2 -8 -14 z"'
    + ' fill="' + c + '"/><path d="M14 16 q6 -4 12 0" stroke="#e8dcc4"'
    + ' stroke-width="2" fill="none"/>'; },
  couteau_marin: function(c){ return '<path d="M8 26 l16 -14 l4 3 l-16 14 z" fill="'
    + c + '"/><rect x="24" y="10" width="8" height="5" rx="2" fill="#6d4a30"'
    + ' transform="rotate(-40 28 12)"/>'; },
  trousseau: function(c){ return '<circle cx="14" cy="14" r="5" fill="none"'
    + ' stroke="' + c + '" stroke-width="2.5"/>'
    + '<path d="M18 17 l8 9 M22 21 l-3 3 M25 24 l-3 3" stroke="' + c
    + '" stroke-width="2.5" stroke-linecap="round"/>'; },
  cachet_gouverneur: function(c){ return '<rect x="16" y="8" width="8" height="12"'
    + ' rx="2" fill="#6d4a30"/><ellipse cx="20" cy="25" rx="10" ry="7" fill="' + c
    + '"/><path d="M16 25 h8" stroke="#1c2a34" stroke-width="2"/>'; },
  ceinture_pesee: function(c){ return '<rect x="5" y="17" width="30" height="6"'
    + ' rx="2" fill="' + c + '"/><rect x="16" y="14" width="9" height="12" rx="2"'
    + ' fill="#e8dcc4"/><path d="M20 14 v12" stroke="#1c2a34" stroke-width="1.6"/>'; },
  sabots: function(c){ return '<path d="M8 26 q0 -8 8 -8 h4 v6 h10 q4 0 4 5 h-26 z"'
    + ' fill="' + c + '"/>'; },
  bottes_mer: function(c){ return '<path d="M13 6 h9 v16 h8 q4 0 4 6 h-21 z" fill="'
    + c + '"/><rect x="12" y="26" width="22" height="4" rx="2" fill="#1c2a34"/>'; },
  espadrilles: function(c){ return '<path d="M7 24 q6 -6 14 -4 q10 2 12 6 q0 4 -6 4'
    + ' h-14 q-6 0 -6 -6 z" fill="' + c + '"/><path d="M9 27 h22" stroke="#e8dcc4"'
    + ' stroke-width="1.6" stroke-dasharray="2 2"/>'; },
  bottes_mineur: function(c){ return '<path d="M13 5 h9 v18 h9 q4 0 4 7 h-22 z"'
    + ' fill="' + c + '"/><path d="M12 30 h23" stroke="#f0a92e" stroke-width="2.5"/>'; },
  medaille_saint: function(c){ return '<path d="M20 6 v6" stroke="#e8dcc4"'
    + ' stroke-width="2"/><circle cx="20" cy="22" r="9" fill="' + c + '"/>'
    + '<path d="M20 16 v12 M15 21 h10" stroke="#1c2a34" stroke-width="2"/>'; },
  dent_requin: function(c){ return '<path d="M20 8 l9 20 q-9 5 -18 0 z" fill="' + c
    + '"/><circle cx="20" cy="11" r="1.8" fill="#1c2a34"/>'; },
  anneau_citadelle: function(c){ return '<circle cx="20" cy="21" r="9" fill="none"'
    + ' stroke="' + c + '" stroke-width="4"/><circle cx="20" cy="12" r="3.5"'
    + ' fill="#e8dcc4"/>'; },
  perle_noire: function(c){ return '<circle cx="20" cy="21" r="10" fill="#1a1420"/>'
    + '<circle cx="17" cy="18" r="3.5" fill="' + c + '" opacity=".7"/>'
    + '<path d="M10 12 q10 -6 20 0" stroke="#e8dcc4" stroke-width="1.4"'
    + ' fill="none"/>'; },
  cloche_rosine: function(c){ return '<path d="M13 26 q0 -14 7 -14 q7 0 7 14 z"'
    + ' fill="' + c + '"/><rect x="10" y="26" width="20" height="3" rx="1.5"'
    + ' fill="#e8dcc4"/><circle cx="20" cy="31" r="2.5" fill="' + c + '"/>'; },
  etoile_fond: function(c){ return '<path d="M20 5 l4 11 l12 1 l-9 8 l3 11 l-10 -6'
    + ' l-10 6 l3 -11 l-9 -8 l12 -1 z" fill="' + c + '"/>'
    + '<circle cx="20" cy="20" r="3" fill="#fff" opacity=".8"/>'; }
};

function dessin(k, r){
  var f = DESSINS[k];
  return ic(f ? f(TEINTE[r]) : '<circle cx="20" cy="20" r="9" fill="'
    + TEINTE[r] + '"/>', r);
}

/* la silhouette au centre de la garde-robe */
function silhouette(P){
  var pris = {};
  (P || []).forEach(function(p){ if (p.porte) pris[p.k] = p.porte.rarete; });
  var c = function(k){ return pris[k] !== undefined ? TEINTE[pris[k]] : '#22343c'; };
  return '<svg viewBox="0 0 116 210" xmlns="http://www.w3.org/2000/svg">'
    + '<ellipse cx="58" cy="203" rx="34" ry="6" fill="#0a141c" opacity=".6"/>'
    /* pieds */
    + '<path d="M44 196 h-12 q-4 0 -4 -5 h16 z" fill="' + c('pieds') + '"/>'
    + '<path d="M72 196 h12 q4 0 4 -5 h-16 z" fill="' + c('pieds') + '"/>'
    + '<rect x="42" y="130" width="12" height="64" rx="5" fill="#1a2830"/>'
    + '<rect x="62" y="130" width="12" height="64" rx="5" fill="#1a2830"/>'
    /* dos */
    + '<path d="M34 74 h48 v62 h-48 z" fill="' + c('dos') + '"/>'
    /* ceinture */
    + '<rect x="32" y="128" width="52" height="9" rx="3" fill="' + c('ceinture') + '"/>'
    /* mains */
    + '<rect x="22" y="80" width="10" height="48" rx="5" fill="#1a2830"/>'
    + '<rect x="84" y="80" width="10" height="48" rx="5" fill="#1a2830"/>'
    + '<circle cx="27" cy="132" r="7" fill="' + c('mains') + '"/>'
    /* talisman */
    + '<path d="M58 74 v14" stroke="#e8dcc4" stroke-width="1.6"/>'
    + '<circle cx="58" cy="92" r="6" fill="' + c('talisman') + '"/>'
    /* tête */
    + '<circle cx="58" cy="50" r="19" fill="#c9925e"/>'
    + '<path d="M39 44 q4 -22 19 -22 q15 0 19 22 z" fill="' + c('tete') + '"/>'
    + '</svg>';
}

/* ============================================================
   CE QUE TU PORTES
   ============================================================ */
function poserGarde(){
  if (!G || !G.ok) return;
  var P = G.places || [], A = G.a_moi || [];
  var T = G.total || {};

  var gauche = P.slice(0, 3), droite = P.slice(3);
  var caseVide = function(p){
    return '<div class="e' + (p.porte ? ' r' + p.porte.rarete : ' vide')
      + '" data-place="' + p.k + '">'
      + '<i>' + p.nom + '</i>'
      + '<b>' + (p.porte ? p.porte.nom : 'Rien') + '</b></div>';
  };

  var h = '<div class="corps">'
    + '<div class="emp">' + gauche.map(caseVide).join('') + '</div>'
    + '<div class="fig">' + silhouette(P) + '</div>'
    + '<div class="emp d">' + droite.map(caseVide).join('') + '</div>'
    + '</div>';

  /* le total, en clair */
  var lignes = Object.keys(T).filter(function(k){ return T[k] > 0; });
  h += '<div class="total">' + (lignes.length
    ? lignes.map(function(k){
        return '<span>' + NOMS[k] + ' <b>+' + T[k] + '</b></span>'; }).join('')
    : '<span class="rien">Tu ne portes rien. Aucun bonus.</span>') + '</div>';

  h += '<h2>Ton coffre</h2>';
  h += A.length ? A.map(ligne).join('')
    : '<p class="rien">Tu n\u2019as encore rien.<br>L\u2019étal du port a de quoi '
      + 'commencer.</p>';

  $('w').innerHTML = h;
  brancher();
}

/* ============================================================
   L'ÉTAL
   ============================================================ */
function poserEtal(){
  if (!B || !B.ok){
    $('w').innerHTML = '<p class="rien">'
      + (B && B.pourquoi === 'en_mer'
          ? 'On n\u2019achète rien en pleine mer.'
          : 'L\u2019étal n\u2019a pas répondu.') + '</p>';
    return;
  }
  var E = B.etal || [];
  if (!E.length){
    $('w').innerHTML = '<p class="rien">Rien à vendre dans ce port.<br>'
      + 'Chaque port a ses propres pièces.</p>';
    return;
  }
  /* on range par emplacement, comme un vrai étal */
  var parPlace = {};
  E.forEach(function(p){ (parPlace[p.place] = parPlace[p.place] || []).push(p); });
  var h = '';
  (B.places || []).forEach(function(pl){
    var L = parPlace[pl.k];
    if (!L) return;
    /* chaque emplacement est un rayon de l'échoppe, posé sur sa planche */
    h += '<div class="rayon"><div class="titre"><b>' + pl.nom + '</b>'
      + '<span class="tr"></span></div>'
      + '<div class="planche">' + L.map(ligne).join('') + '</div></div>';
  });
  $('w').innerHTML = h;
  brancher();
}

/* une ligne, dans les deux vues */
function ligne(p){
  var b = p.bonus || {};
  var listes = Object.keys(b).map(function(k){
    return '<span>' + NOMS[k] + ' +' + b[k] + '</span>';
  }).join('');

  var act;
  if (VUE === 'etal'){
    act = p.a_moi
      ? '<button class="sobre" disabled>Déjà à toi</button>'
      : (!p.assez_grand
          ? '<button disabled>Niveau ' + p.niveau_min + '</button>'
          : '<span class="pr' + (p.assez ? '' : ' non') + '">' + eur(p.prix)
            + ' €</span><span class="jours">' + jours(p.prix) + '</span>'
            + '<button data-acheter="' + p.k + '"'
            + (p.assez ? '' : ' disabled') + '>Acheter</button>');
  } else {
    act = p.porte
      ? '<button class="sobre" data-retirer="' + p.k + '">Retirer</button>'
      : (!p.assez_grand
          ? '<button disabled>Niveau ' + p.niveau_min + '</button>'
          : '<button data-porter="' + p.k + '">Porter</button>');
  }

  return '<div class="piece r' + p.rarete + (p.porte ? ' portee' : '') + '">'
    + '<span class="ic">' + dessin(p.k, p.rarete) + '</span>'
    + '<span class="co"><b>' + p.nom
    +   '<span class="rar">' + RARETE[p.rarete] + '</span></b>'
    + '<span class="no">' + p.note + '</span>'
    + '<span class="bn">' + listes + '</span></span>'
    + '<span class="ac">' + act + '</span></div>';
}

function brancher(){
  document.querySelectorAll('[data-acheter]').forEach(function(b){
    b.onclick = function(){ acheter(b.dataset.acheter, b); };
  });
  document.querySelectorAll('[data-porter]').forEach(function(b){
    b.onclick = function(){ porter(b.dataset.porter, b); };
  });
  document.querySelectorAll('[data-retirer]').forEach(function(b){
    b.onclick = function(){ retirer(b.dataset.retirer, b); };
  });
}

async function acheter(k, b){
  b.disabled = true; b.textContent = '…';
  var r = null;
  try { r = await BD.agir('acheter_piece', { p_k: k }); } catch(e){}
  if (!r || !r.ok){
    var q = r && r.pourquoi;
    dire(q === 'trop_cher' ? 'Il te manque ' + eur(r.manque) + ' €.'
       : q === 'trop_tot' ? 'Il faut être niveau ' + r.faut + '.'
       : q === 'deja' ? 'Tu l\u2019as déjà.'
       : q === 'pas_ici' ? 'Ça ne se vend pas dans ce port.'
       : 'L\u2019achat n\u2019a pas abouti.', false);
    b.disabled = false; b.textContent = 'Acheter';
    return;
  }
  BD.sonner('piece'); BD.vibrer([12, 40, 22]);
  dire(r.nom + ' est à toi. ' + eur(r.paye) + ' € payés — va la porter.', true);
  await charger();
}

async function porter(k, b){
  b.disabled = true; b.textContent = '…';
  var r = null;
  try { r = await BD.agir('porter_piece', { p_k: k }); } catch(e){}
  if (!r || !r.ok){
    dire(r && r.pourquoi === 'trop_tot'
      ? 'Il faut être niveau ' + r.faut + '.' : 'Impossible.', false);
    b.disabled = false; b.textContent = 'Porter';
    return;
  }
  BD.sonner('charge');
  dire(r.remplace ? 'Tu portes ' + r.nom + '. ' + r.remplace + ' retourne au coffre.'
                  : 'Tu portes ' + r.nom + '.', true);
  await charger();
}

async function retirer(k, b){
  b.disabled = true;
  try { await BD.agir('retirer_piece', { p_k: k }); } catch(e){}
  BD.sonner('clic');
  await charger();
}

/* ---------- les deux volets ---------- */
$('onglets').addEventListener('click', function(e){
  var b = e.target.closest('[data-v]');
  if (!b) return;
  VUE = b.dataset.v;
  document.querySelectorAll('#onglets button').forEach(function(z){
    z.className = (z.dataset.v === VUE) ? 'on' : '';
  });
  document.body.className = (VUE === 'etal') ? 'etal' : '';
  VUE === 'etal' ? poserEtal() : poserGarde();
});

async function charger(){
  try { G = await BD.agir('ma_garde_robe'); } catch(e){ G = null; }
  try { B = await BD.agir('la_boutique'); } catch(e){ B = null; }
  if (G && G.ok){
    $('eu').textContent = eur(G.euros) + ' €';
    var n = (G.a_moi || []).filter(function(p){ return p.porte; }).length;
    $('sous').textContent = n + ' pièce' + (n > 1 ? 's' : '') + ' sur toi';
  }
  VUE === 'etal' ? poserEtal() : poserGarde();
}

$('ret').onclick = function(){ location.href = 'hub.html?v=7'; };
charger();
</script>
