<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#101f2e">
<title>Battle Dock — La Barceloneta</title>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=DM+Serif+Display&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="couleurs.css?v=2">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none}
html,body{height:100%;overflow:hidden;background:var(--nuit-mer);
  font-family:'Nunito',system-ui,sans-serif;color:#fff}
#rue{position:fixed;inset:0;
  /* la ruelle est dessinée une fois pour toutes : on ne fait que
     l'éclairer autrement selon l'heure qu'il est chez le joueur */
  filter:var(--filtre,none);transition:filter 1.6s linear}
#rue svg{display:block;width:100%;height:100%}
/* la teinte du moment, posée par-dessus */
#teinte{position:fixed;inset:0;z-index:1;pointer-events:none;
  mix-blend-mode:multiply;
  background:var(--teinte,#ffffff);opacity:var(--force,0);
  transition:background 1.6s linear,opacity 1.6s linear}

/* ---------- l'entête ---------- */
/* ---------- l'entête ----------
   La même qu'à Marseille : le portrait carré à gauche, puis une
   carte crème bordée d'encre. La rue était restée au verre sombre. */
.av{position:fixed;z-index:10;
  top:calc(env(safe-area-inset-top) + 14px);left:14px;
  width:56px;height:56px;border-radius:6px;overflow:hidden;
  background:#dfe8ee;border:2px solid rgba(255,255,255,.82);
  box-shadow:0 3px 14px rgba(8,20,32,.42),inset 0 0 0 1px rgba(20,40,60,.14);
  cursor:pointer;transition:transform .13s}
.av:active{transform:scale(.96)}
.av svg{display:block;width:100%;height:100%}
.av .nm{position:absolute;left:0;right:0;bottom:0;background:#12303f;
  color:#fdf6e6;font-size:7.5px;letter-spacing:.1em;text-transform:uppercase;
  text-align:center;padding:3px 2px;font-weight:800}

.barre{position:fixed;z-index:10;
  top:calc(env(safe-area-inset-top) + 14px);left:82px;right:14px;
  height:58px;border-radius:16px;overflow:hidden;
  background:#fdf6e6;border:3px solid #12303f;
  display:flex;align-items:stretch}
.barre .sous{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;
  justify-content:center;padding:0 12px;border-right:2px solid rgba(18,48,63,.14)}
.barre .sous .lb{font-size:7.5px;letter-spacing:.2em;text-transform:uppercase;
  font-weight:800;color:rgba(18,48,63,.5);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.barre .sous .vl{font-family:'DM Serif Display',Georgia,serif;font-size:19px;
  color:#12303f;line-height:1.1;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.barre .jauges{flex:0 0 auto;display:flex;flex-direction:column;
  justify-content:center;gap:5px;padding:0 11px;min-width:104px}
.jg{display:flex;align-items:center;gap:6px}
.jg .ic{flex:0 0 11px;height:11px}
.jg .ba{flex:1;height:7px;background:rgba(18,48,63,.12);border-radius:4px;
  border:1.5px solid rgba(18,48,63,.5);overflow:hidden}
.jg .ba i{display:block;height:100%;border-radius:3px;transition:width .6s}
.jg .nb{flex:0 0 auto;font-size:9.5px;font-weight:800;color:rgba(18,48,63,.66);
  min-width:24px;text-align:right}

/* ---------- la barre des lieux ---------- */
.bas{position:fixed;left:0;right:0;bottom:0;z-index:5;
  padding:44px 12px calc(env(safe-area-inset-bottom) + 14px);
  background:linear-gradient(180deg,transparent,rgba(26,24,20,.5) 44%,rgba(20,18,15,.82))}
.lieux{display:flex;gap:7px}
.lieux button{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:11px 3px;border:1.5px solid rgba(255,255,255,.24);border-radius:9px;
  background:rgba(24,30,44,.56);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);cursor:pointer;
  font-family:'Nunito',system-ui,sans-serif;transition:transform .11s}
.lieux button:active{transform:scale(.95)}
.lieux button:disabled{opacity:.42;cursor:default}
.lieux button.vif{border-color:rgba(240,196,106,.72);background:rgba(52,44,26,.62)}
.lieux svg{width:21px;height:21px;stroke:rgba(255,255,255,.7);fill:none;
  stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.lieux button.vif svg{stroke:#f0c46a}
.lieux span{font-size:9px;color:rgba(255,255,255,.7);letter-spacing:.03em;
  text-align:center;line-height:1.2}
.lieux button.vif span{color:#f0c46a;font-weight:700}

/* ---------- les contrats ---------- */
.ct{position:fixed;z-index:22;left:14px;right:14px;
  top:calc(env(safe-area-inset-top) + 78px);max-width:340px;margin:0 auto;
  max-height:calc(100vh - env(safe-area-inset-top) - 120px);overflow-y:auto;
  background:rgba(20,34,50,.94);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:2px solid rgba(255,255,255,.3);border-radius:8px;
  box-shadow:0 12px 40px rgba(6,16,28,.6);
  opacity:0;transform:scale(.94) translateY(10px);pointer-events:none;
  transition:opacity .22s,transform .26s cubic-bezier(.2,.9,.3,1)}
.ct.on{opacity:1;transform:none;pointer-events:auto}
.ct::-webkit-scrollbar{display:none}

.ct .haut{display:flex;align-items:center;padding:14px 15px;
  border-bottom:1px solid rgba(255,255,255,.14);
  background:linear-gradient(180deg,rgba(255,255,255,.07),transparent)}
.ct .haut .ti{flex:1}
.ct .haut b{display:block;font-size:15px;color:#fff;font-weight:700;letter-spacing:.04em}
.ct .haut span{display:block;font-size:8px;letter-spacing:.16em;text-transform:uppercase;
  color:rgba(255,255,255,.5);margin-top:3px}
.ct .haut .fer{background:none;border:0;cursor:pointer;color:rgba(255,255,255,.5);
  font-size:22px;line-height:1;padding:3px 2px}

.ct .cale{display:flex;align-items:center;gap:9px;padding:11px 15px;
  border-bottom:1px solid rgba(255,255,255,.14);font-size:10.5px;
  color:rgba(255,255,255,.6);font-family:system-ui,sans-serif}
.ct .cale b{color:#f0c46a;font-family:'Nunito',system-ui,sans-serif;font-size:13px}

.ct ul{list-style:none;padding:8px}
.ct li{border-radius:8px;padding:13px;margin-bottom:8px;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12)}
.ct li:last-child{margin-bottom:0}
.ct li.pris{background:rgba(140,224,168,.1);border-color:rgba(140,224,168,.3)}
.ct li .l1{display:flex;align-items:flex-start;gap:10px}
.ct li .l1 .tx{flex:1;min-width:0}
.ct li .l1 b{display:block;font-size:14px;color:#fff;font-weight:700}
.ct li .l1 .no{display:block;font-size:10.5px;color:rgba(255,255,255,.48);margin-top:3px;
  font-family:system-ui,sans-serif;line-height:1.45}
.ct li .l1 .px{flex:0 0 auto;text-align:right}
.ct li .l1 .px em{display:block;font-style:normal;font-size:17px;font-weight:700;color:#ffd894}
.ct li .l1 .px i{display:block;font-style:normal;font-size:8px;letter-spacing:.1em;
  text-transform:uppercase;margin-top:3px}
.ct li .l2{display:flex;align-items:center;gap:8px;margin-top:11px}
.ct li .l2 .d{flex:1;font-size:9.5px;color:rgba(255,255,255,.44);
  font-family:system-ui,sans-serif}
.ct li button{flex:0 0 auto;padding:9px 18px;border:0;border-radius:7px;cursor:pointer;
  background:linear-gradient(180deg,#f6cd76,#dca94a);color:#1c1a16;
  font-family:'Nunito',system-ui,sans-serif;font-size:11.5px;font-weight:700;letter-spacing:.05em}
.ct li button:disabled{background:rgba(255,255,255,.09);color:rgba(255,255,255,.4);
  cursor:default}
.ct li .fait{font-size:11px;color:#8ce0a8;font-weight:700;letter-spacing:.05em}
.ct .rien{padding:26px 16px;text-align:center;font-size:12px;
  color:rgba(255,255,255,.5);line-height:1.7}
.ct .mot{padding:0 15px 15px;font-size:10.5px;color:rgba(255,255,255,.42);
  line-height:1.6;text-align:center;font-family:system-ui,sans-serif}


/* ---------- le panneau de la barque ---------- */
.voile{position:fixed;inset:0;z-index:8;background:rgba(6,12,22,.6);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  opacity:0;pointer-events:none;transition:opacity .26s}
.voile.on{opacity:1;pointer-events:auto}

.bq{position:fixed;z-index:9;left:14px;right:14px;
  top:calc(env(safe-area-inset-top) + 74px);max-width:340px;margin:0 auto;
  max-height:calc(100vh - env(safe-area-inset-top) - 200px);overflow-y:auto;
  background:rgba(18,28,44,.95);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:2px solid rgba(255,255,255,.28);border-radius:9px;
  box-shadow:0 14px 44px rgba(4,10,20,.66);
  opacity:0;transform:scale(.94) translateY(10px);pointer-events:none;
  transition:opacity .22s,transform .26s cubic-bezier(.2,.9,.3,1)}
.bq.on{opacity:1;transform:none;pointer-events:auto}
.bq::-webkit-scrollbar{display:none}

.bq .vue{position:relative;height:112px;overflow:hidden;
  background:linear-gradient(180deg,#1e3a54 0%,#16304a 46%,#0f2338 100%);
  border-bottom:1px solid rgba(255,255,255,.14)}
.bq .vue svg{display:block;width:100%;height:100%}
.bq .vue .pal{position:absolute;top:9px;left:11px;
  background:rgba(8,16,28,.66);border-radius:20px;padding:4px 10px;
  font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:#f0c46a;font-weight:700}
.bq .vue .fer{position:absolute;top:6px;right:8px;background:none;border:0;cursor:pointer;
  color:rgba(255,255,255,.7);font-size:22px;line-height:1;padding:3px 6px}

.bq .nom{padding:13px 15px 11px;border-bottom:1px solid rgba(255,255,255,.14)}
.bq .nom b{display:block;font-size:17px;color:#fff;font-weight:700;letter-spacing:.03em}
.bq .nom span{display:block;font-size:11.5px;color:rgba(255,255,255,.58);
  line-height:1.5;margin-top:5px;font-family:system-ui,sans-serif}

.bq .trois{display:flex;border-bottom:1px solid rgba(255,255,255,.14)}
.bq .trois > div{flex:1;padding:12px 6px;text-align:center;
  border-right:1px solid rgba(255,255,255,.1)}
.bq .trois > div:last-child{border-right:0}
.bq .trois .k{font-size:7px;letter-spacing:.16em;text-transform:uppercase;
  color:rgba(255,255,255,.44)}
.bq .trois .v{font-size:16px;font-weight:700;margin-top:4px;color:#fff}
.bq .trois .v small{font-size:9px;color:rgba(255,255,255,.5);font-weight:400}

.bq .cale{padding:14px 15px 16px}
.bq .cale .tt{font-size:7.5px;letter-spacing:.2em;text-transform:uppercase;
  color:rgba(255,255,255,.42);margin-bottom:10px}
.bq .cale .vide{display:flex;align-items:center;gap:11px;
  background:rgba(255,255,255,.05);border:1px dashed rgba(255,255,255,.18);
  border-radius:7px;padding:14px}
.bq .cale .vide .ic{flex:0 0 34px;height:34px;border-radius:8px;
  background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center}
.bq .cale .vide .ic svg{width:17px;height:17px;stroke:rgba(255,255,255,.4);fill:none;
  stroke-width:1.7;stroke-linejoin:round}
.bq .cale .vide .tx b{display:block;font-size:13px;color:rgba(255,255,255,.8)}
.bq .cale .vide .tx span{display:block;font-size:10.5px;color:rgba(255,255,255,.44);
  margin-top:3px;font-family:system-ui,sans-serif;line-height:1.45}

/* ---------- ce qui vit ---------- */
/* le linge qui pend dans l'air du soir */
.linge{animation:flotte 9s ease-in-out infinite}
.linge:nth-of-type(2n){animation-duration:12s;animation-delay:-3s}
.linge:nth-of-type(3n){animation-duration:7.4s;animation-delay:-5s}
@keyframes flotte{0%,100%{transform:skewX(-2.4deg)}50%{transform:skewX(2.4deg)}}

/* les arbres */
.platane{animation:souffle 15s ease-in-out infinite;transform-origin:50% 100%}
.platane:nth-of-type(2n){animation-duration:18s;animation-delay:-6s}
.platane:nth-of-type(3n){animation-duration:12s;animation-delay:-9s}
@keyframes souffle{0%,100%{transform:rotate(-.26deg)}50%{transform:rotate(.26deg)}}

/* les lampadaires qui palpitent à peine */
.lampe{animation:veilleuse 6s ease-in-out infinite}
.lampe:nth-of-type(2n){animation-duration:7.8s;animation-delay:-2.6s}
@keyframes veilleuse{0%,100%{opacity:.86}48%{opacity:1}}

/* les étoiles */
.etoile{animation:scint 4.4s ease-in-out infinite}
.e1{animation-duration:6s;animation-delay:-1.4s}
.e2{animation-duration:3.4s;animation-delay:-2.6s}
.e3{animation-duration:7.2s;animation-delay:-.8s}
@keyframes scint{0%,100%{opacity:.18}50%{opacity:.62}}

.pnj{animation:attend 6.4s ease-in-out infinite}
@keyframes attend{0%,100%{transform:translateY(0)}50%{transform:translateY(-.7px)}}
.fumee{animation:monte 7s ease-in-out infinite}
@keyframes monte{0%{opacity:.22;transform:translate(0,0) scale(1)}
  100%{opacity:0;transform:translate(3px,-9px) scale(1.7)}}
.clope{animation:braise 4.2s ease-in-out infinite}
@keyframes braise{0%,100%{opacity:.5}18%{opacity:1}30%{opacity:.6}}
.signe{animation:appelle 2.4s ease-in-out infinite;transform-box:fill-box;
  transform-origin:50% 100%}
@keyframes appelle{0%,100%{transform:translateY(0) scale(1)}
  50%{transform:translateY(-2.4px) scale(1.06)}}

@media (prefers-reduced-motion:reduce){*{animation:none !important}}

/* ---------- reprendre la mer ----------
   Le même geste qu'à Marseille : le grand bouton en bas, toujours là. */
.partir{position:fixed;z-index:12;
  left:14px;right:14px;
  bottom:calc(env(safe-area-inset-bottom) + 16px);
  height:62px;border-radius:16px;
  background:#fdf6e6;border:3px solid #12303f;
  box-shadow:0 6px 22px rgba(6,16,28,.44);
  display:flex;align-items:center;justify-content:center;gap:10px;
  cursor:pointer;font-family:inherit;-webkit-tap-highlight-color:transparent;
  opacity:0;transform:translateY(10px);pointer-events:none;
  transition:opacity .5s,transform .5s,background .15s}
.partir.pret{opacity:1;transform:none;pointer-events:auto}
.partir:active{background:#f2e7cf;transform:translateY(2px)}
.partir svg{width:24px;height:24px;flex:0 0 24px;
  fill:none;stroke:#12303f;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
.partir b{font-family:'DM Serif Display',Georgia,serif;font-weight:400;
  font-size:19px;color:#12303f;letter-spacing:.01em}

/* ---------- l'aube ----------
   Le temps que la page se pose. Elle prend le ciel du port, comme
   partout ailleurs : plus de blanc ni de bascule de couleur. */
#charge{position:fixed;inset:0;z-index:90;background:var(--h1,#f5a53a);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
  transition:opacity .45s ease}
#charge.parti{opacity:0;pointer-events:none}
#charge .ti{font-family:'DM Serif Display',Georgia,serif;
  font-size:27px;color:#fffaf0;letter-spacing:.02em}
#charge .fl{width:118px;height:3px;border-radius:2px;
  background:rgba(255,250,240,.26);overflow:hidden}
#charge .fl i{display:block;width:38%;height:100%;border-radius:2px;background:#fffaf0;
  animation:houle 1.15s ease-in-out infinite}
@keyframes houle{0%{transform:translateX(-115%)}100%{transform:translateX(275%)}}

/* ---------- la voix des gens ----------
   Courier Prime ne sert plus qu'à ça : ce qu'un personnage dit.
   Le reste de la page est en Nunito, comme dans tout le jeu. */
.parle, .dit p.parle, .voix{
  font-family:'Courier Prime',monospace;letter-spacing:-.01em}
</style>
</head>
<body>

<div id="charge"><div class="ti">Battle Dock</div><div class="fl"><i></i></div></div>


<div id="rue"></div>
<div id="teinte"></div>

<div class="av" id="por"></div>

<div class="barre">
  <span class="sous">
    <span class="lb" id="ou-h">Barcelone</span>
    <span class="vl" id="eu">—</span>
  </span>
  <span class="jauges">
    <span class="jg">
      <svg class="ic" viewBox="0 0 12 12"><path d="M6.6 1L2.4 6.8h2.6L4.6 11l4.4-6h-2.8z"
        fill="#4faa72"/></svg>
      <span class="ba"><i id="b-nrj"
        style="background:linear-gradient(90deg,#4faa72,#8ce0a8)"></i></span>
      <span class="nb" id="b-nrjn">—</span>
    </span>
    <span class="jg">
      <svg class="ic" viewBox="0 0 12 12"><path d="M6 1l1.5 3.2L11 4.7 8.5 7.1 9.1 10.6
        6 9 2.9 10.6l.6-3.5L1 4.7l3.5-.5z" fill="#c8a24a"/></svg>
      <span class="ba"><i id="b-xp"
        style="background:linear-gradient(90deg,#c8a24a,#f0c46a)"></i></span>
      <span class="nb" id="b-niv">—</span>
    </span>
  </span>
</div>

<button class="partir" id="partir">
  <svg viewBox="0 0 24 24"><path d="M3 18q2.4 1.6 4.8 0t4.8 0 4.8 0T21 18M5 14h14l-2-4H7z
    M12 10V4M12 4l6 3-6 2"/></svg>
  <b>Reprendre la mer</b>
</button>

<div class="voile" id="voile"></div>

<section class="ct" id="ct">
  <div class="haut">
    <span class="ti"><b>Les contrats</b><span id="k-ou">Ce qu'on charge ici</span></span>
    <button class="fer" id="k-fer">×</button>
  </div>
  <p class="cale">Ta cale : <b id="k-cale">—</b></p>
  <ul id="k-liste"><li class="rien">On regarde ce qu'il y a…</li></ul>
  <p class="mot" id="k-mot"></p>
</section>

<section class="bq" id="bq">
  <div class="vue" id="q-vue">
    <span class="pal" id="q-pal">—</span>
    <button class="fer" id="q-fer">×</button>
  </div>
  <div class="nom"><b id="q-nom">—</b><span id="q-d">—</span></div>
  <div class="trois">
    <div><p class="k">Cale</p><p class="v" id="q-cale">—</p></div>
    <div><p class="k">Charge</p><p class="v" id="q-kg">—</p></div>
    <div><p class="k">Allure</p><p class="v" id="q-vit">—</p></div>
  </div>
  <div class="cale">
    <p class="tt">Ce que tu transportes</p>
    <div class="vide">
      <span class="ic"><svg viewBox="0 0 24 24">
        <path d="M4 9h16l-2 11H6zM8 9V6a4 4 0 0 1 8 0v3"/></svg></span>
      <span class="tx"><b>Ta cale est vide</b>
        <span>Le marché n'a pas encore ouvert. Reviens quand il y aura de quoi charger.</span></span>
    </div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="bd.js?v=4"></script>
<script src="heure.js?v=1"></script>
<script>
/* ============================================================
   UNE RUE DE LA BARCELONETA — vue du sol, en fin d'après-midi
   ============================================================ */

const W = 480;
const FOCALE = 727;
const OEIL = 1.7;            /* on marche : l'œil est à hauteur d'homme */
const HORIZON = 262;

const px  = (m, d) => m * FOCALE / d;
const sol = d => HORIZON + OEIL * FOCALE / d;
const rnd = s => { const x = Math.sin(s * 127.1) * 43758.5; return x - Math.floor(x); };
const rnd2 = (a, b) => { const x = Math.sin(a * 127.1 + b * 311.7) * 43758.5; return x - Math.floor(x); };

/* la rue fait huit mètres de large */
const RUE = 4.2;
const projX = (X, d) => 240 + X * FOCALE / d;

/* ---------- la lumière : le soleil entre par le fond, à gauche ---------- */
const SOLEIL = { x: 202, d: 90 };
function hx(c){ return [parseInt(c.slice(1,3),16), parseInt(c.slice(3,5),16), parseInt(c.slice(5,7),16)]; }
function ch(a){ return '#' + a.map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2,'0')).join(''); }
function mel(a, b, k){ const A = hx(a), B = hx(b); return ch([0,1,2].map(i => A[i] + (B[i]-A[i]) * k)); }

const OR = '#ffc878', OMBRE = '#0e1626';
/* la nuit : tout est bleui, sauf ce que touche une lampe */
const NUIT = '#1a2740';
const clair  = (c, k) => mel(mel(c, NUIT, .52), OR, (k === undefined ? .34 : k) * .5);
const sombre = (c, k) => mel(mel(c, NUIT, .62), OMBRE, k === undefined ? .34 : k);
/* l'air de la rue : plus on va loin, plus ça se voile de lumière */
const voiler = (c, d) => mel(c, '#2a3a58', Math.min(.68, Math.pow(d / 110, .8)));

let HAUT = -120, BAS = 900;
function cadrer(l, h){
  const total = W * h / l;
  /* l'horizon se pose au tiers : on voit surtout les façades et le sol */
  HAUT = HORIZON - total * .3;
  BAS  = HAUT + total;
  return { y: HAUT, h: total };
}

/* ---------- les façades ---------- */
const MURS = ['#e8c49a','#c98a5c','#dcd0b0','#a8886a','#e0b088','#8aa0a8','#d4a878','#b8946c','#e4cca4','#9a8a7a','#cf9a70','#c4b494'];
const VOLETS = ['#4a6b7c','#5c7a5c','#7a5c4a','#3f5a6b','#6d5c7a','#5a6b4a'];

/* une tranche de façade, d'une profondeur à la suivante */
function tranche(cote, d1, d2, g){
  const X = cote * RUE;
  const x1 = projX(X, d1), x2 = projX(X, d2);
  const y1 = sol(d1),      y2 = sol(d2);
  const hauteur = 4 + Math.round(rnd(g * 3) * 2);        /* de 4 à 6 étages */
  const he = 3.2;                                         /* un étage = 3,2 m */
  const t1 = y1 - px(hauteur * he, d1), t2 = y2 - px(hauteur * he, d2);
  const mur = voiler(MURS[g % 12], (d1 + d2) / 2);
  /* le côté gauche prend le soleil, le droit est à l'ombre */
  const face = cote < 0 ? clair(mur, .28) : sombre(mur, .6);

  let s = `<g>`;
  s += `<path d="M${x1.toFixed(1)} ${t1.toFixed(1)} L${x2.toFixed(1)} ${t2.toFixed(1)}
    L${x2.toFixed(1)} ${y2.toFixed(1)} L${x1.toFixed(1)} ${y1.toFixed(1)} Z" fill="${face}"/>`;

  /* les étages */
  for (let e = 0; e < hauteur; e++){
    const a1 = y1 - px((e + 1) * he, d1), a2 = y2 - px((e + 1) * he, d2);
    const b1 = y1 - px(e * he, d1),       b2 = y2 - px(e * he, d2);
    /* le bandeau qui sépare les étages */
    s += `<path d="M${x1.toFixed(1)} ${a1.toFixed(1)} L${x2.toFixed(1)} ${a2.toFixed(1)}
      L${x2.toFixed(1)} ${(a2 + (b2-a2)*.1).toFixed(1)} L${x1.toFixed(1)} ${(a1 + (b1-a1)*.1).toFixed(1)} Z"
      fill="${cote < 0 ? clair(mur,.4) : sombre(mur,.16)}" opacity=".6"/>`;

    /* deux fenêtres par tranche */
    for (let f = 0; f < 2; f++){
      const dd1 = d1 + (d2 - d1) * (.18 + f * .44);
      const dd2 = d1 + (d2 - d1) * (.42 + f * .44);
      const fx1 = projX(X, dd1), fx2 = projX(X, dd2);
      const fy1h = sol(dd1) - px((e + .82) * he, dd1), fy2h = sol(dd2) - px((e + .82) * he, dd2);
      const fy1b = sol(dd1) - px((e + .16) * he, dd1), fy2b = sol(dd2) - px((e + .16) * he, dd2);
      const t = rnd2(g * 11 + e, f);
      /* l'embrasure */
      s += `<path d="M${fx1.toFixed(1)} ${fy1h.toFixed(1)} L${fx2.toFixed(1)} ${fy2h.toFixed(1)}
        L${fx2.toFixed(1)} ${fy2b.toFixed(1)} L${fx1.toFixed(1)} ${fy1b.toFixed(1)} Z"
        fill="${sombre('#2a2f3a', .1)}"/>`;
      /* le volet, ouvert ou fermé */
      if (t > .66){
        const v = voiler(VOLETS[(g + e + f) % 6], (d1 + d2) / 2);
        const mi1 = fx1 + (fx2 - fx1) * (t > .68 ? 1 : .46);
        s += `<path d="M${fx1.toFixed(1)} ${fy1h.toFixed(1)} L${mi1.toFixed(1)} ${(fy1h + (fy2h-fy1h)*.5).toFixed(1)}
          L${mi1.toFixed(1)} ${(fy1b + (fy2b-fy1b)*.5).toFixed(1)} L${fx1.toFixed(1)} ${fy1b.toFixed(1)} Z"
          fill="${cote < 0 ? clair(v,.24) : sombre(v,.42)}"/>`;
      } else {
        /* une fenêtre allumée de temps en temps */
        if (t > .1)
          s += `<path d="M${fx1.toFixed(1)} ${fy1h.toFixed(1)} L${fx2.toFixed(1)} ${fy2h.toFixed(1)}
            L${fx2.toFixed(1)} ${fy2b.toFixed(1)} L${fx1.toFixed(1)} ${fy1b.toFixed(1)} Z"
            fill="${['#ffcf82','#ffdda0','#f0b868','#ffe0b0'][Math.floor(t*4)%4]}"
            opacity="${(.5 + t * .5).toFixed(2)}"/>`;
          /* la lueur qui déborde sur le mur */
          s += `<path d="M${(fx1 - px(.2, dd1) * cote).toFixed(1)} ${(fy1h - px(.2, dd1)).toFixed(1)}
            L${(fx2 - px(.2, dd2) * cote).toFixed(1)} ${(fy2h - px(.2, dd2)).toFixed(1)}
            L${(fx2 - px(.2, dd2) * cote).toFixed(1)} ${(fy2b + px(.2, dd2)).toFixed(1)}
            L${(fx1 - px(.2, dd1) * cote).toFixed(1)} ${(fy1b + px(.2, dd1)).toFixed(1)} Z"
            fill="#ffcf82" opacity=".1"/>`;
      }
      /* le petit balcon en fer */
      if (e > 0 && t > .5){
        const by1 = sol(dd1) - px(e * he + .1, dd1), by2 = sol(dd2) - px(e * he + .1, dd2);
        const av = px(.5, (dd1 + dd2) / 2) * -cote;
        s += `<path d="M${fx1.toFixed(1)} ${by1.toFixed(1)} L${fx2.toFixed(1)} ${by2.toFixed(1)}
          L${(fx2 + av).toFixed(1)} ${by2.toFixed(1)} L${(fx1 + av).toFixed(1)} ${by1.toFixed(1)} Z"
          fill="${sombre('#3a3f4a', .2)}" opacity=".8"/>`;
        s += `<g stroke="${sombre('#4a5058', .18)}" stroke-width="${Math.max(.4, px(.05, dd1)).toFixed(2)}">`;
        for (let q = 0; q < 4; q++){
          const qx = fx1 + (fx2 - fx1) * q / 4;
          const qy = by1 + (by2 - by1) * q / 4;
          s += `<path d="M${(qx + av * .5).toFixed(1)} ${qy.toFixed(1)} v${(-px(.55, dd1)).toFixed(1)}"/>`;
        }
        s += `</g>`;
      }
    }
  }

  /* le rez-de-chaussée : une porte, ou une devanture */
  const r1 = y1 - px(2.6, d1), r2 = y2 - px(2.6, d2);
  const quoi = rnd(g * 7 + 3);
  if (quoi > .62){
    /* une devanture avec son store */
    const c = voiler(['#b8483a','#3f7a6a','#c9843a','#5a4a7a'][g % 4], (d1+d2)/2);
    s += `<path d="M${x1.toFixed(1)} ${r1.toFixed(1)} L${x2.toFixed(1)} ${r2.toFixed(1)}
      L${x2.toFixed(1)} ${y2.toFixed(1)} L${x1.toFixed(1)} ${y1.toFixed(1)} Z"
      fill="${sombre('#2a2f38', .18)}"/>`;
    s += `<path d="M${x1.toFixed(1)} ${r1.toFixed(1)} L${x2.toFixed(1)} ${r2.toFixed(1)}
      L${(x2 + px(.9, d2) * -cote).toFixed(1)} ${(r2 + px(.35, d2)).toFixed(1)}
      L${(x1 + px(.9, d1) * -cote).toFixed(1)} ${(r1 + px(.35, d1)).toFixed(1)} Z"
      fill="${cote < 0 ? clair(c, .2) : sombre(c, .22)}"/>`;
    /* la lumière qui sort de la boutique */
    s += `<path d="M${x1.toFixed(1)} ${(r1 + (y1-r1)*.22).toFixed(1)} L${x2.toFixed(1)} ${(r2 + (y2-r2)*.22).toFixed(1)}
      L${x2.toFixed(1)} ${(y2 - (y2-r2)*.1).toFixed(1)} L${x1.toFixed(1)} ${(y1 - (y1-r1)*.1).toFixed(1)} Z"
      fill="#ffd894" opacity=".3"/>`;
  } else {
    /* une porte étroite */
    const px1 = x1 + (x2 - x1) * .3, px2 = x1 + (x2 - x1) * .62;
    const py1 = r1 + (r2 - r1) * .3, py2 = r1 + (r2 - r1) * .62;
    const gy1 = y1 + (y2 - y1) * .3, gy2 = y1 + (y2 - y1) * .62;
    s += `<path d="M${px1.toFixed(1)} ${(py1 + (gy1-py1)*.28).toFixed(1)} L${px2.toFixed(1)} ${(py2 + (gy2-py2)*.28).toFixed(1)}
      L${px2.toFixed(1)} ${gy2.toFixed(1)} L${px1.toFixed(1)} ${gy1.toFixed(1)} Z"
      fill="${sombre('#4a3628', .22)}"/>`;
  }
  return s + `</g>`;
}

/* ---------- le ciel, entre les toits ---------- */
function ciel(){
  let s = `<defs>
    <linearGradient id="r-ciel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0c1830"/>
      <stop offset="30%"  stop-color="#152442"/>
      <stop offset="58%"  stop-color="#243a5c"/>
      <stop offset="82%"  stop-color="#3d5273"/>
      <stop offset="100%" stop-color="#6a6a78"/></linearGradient>
    <linearGradient id="r-sol" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#3a4258"/>
      <stop offset="18%"  stop-color="#2f3648"/>
      <stop offset="100%" stop-color="#1a2032"/></linearGradient>
    <radialGradient id="r-halo" cx="0.5" cy="0.5">
      <stop offset="0%"   stop-color="#ffd8a0" stop-opacity=".44"/>
      <stop offset="40%"  stop-color="#e0a870" stop-opacity=".2"/>
      <stop offset="100%" stop-color="#c08850" stop-opacity="0"/></radialGradient>
  </defs>`;
  s += `<rect x="0" y="${HAUT}" width="${W}" height="${(sol(400)-HAUT).toFixed(1)}"
    fill="url(#r-ciel)"/>`;
  /* le fond de la rue, qui brûle de lumière */
  const ys = sol(SOLEIL.d) - px(7, SOLEIL.d);
  s += `<ellipse cx="${SOLEIL.x}" cy="${ys.toFixed(1)}" rx="210" ry="150" fill="url(#r-halo)"/>`;
  s += `<ellipse cx="${SOLEIL.x}" cy="${ys.toFixed(1)}" rx="86" ry="58"
    fill="#e8b878" opacity=".2"/>`;
  /* des étoiles, entre les toits */
  for (let i = 0; i < 26; i++){
    const ex = 130 + rnd(i*17+3) * 220, ey = HAUT + rnd(i*13+7) * 150;
    s += `<circle class="etoile e${i%4}" cx="${ex.toFixed(0)}" cy="${ey.toFixed(0)}"
      r="${(.5 + rnd(i*23+2)*.7).toFixed(2)}" fill="#fff" opacity=".5"/>`;
  }
  return s;
}

/* ---------- le sol : des dalles qui s'ouvrent vers nous ---------- */
function pave(){
  let s = `<rect x="0" y="${(sol(400)).toFixed(1)}" width="${W}"
    height="${(BAS - sol(400) + 6).toFixed(1)}" fill="url(#r-sol)"/>`;

  /* les dalles : le pas suit la profondeur, sinon on n'atteint jamais
     le premier plan. On avance en proportion, pas en mètres fixes. */
  let d = 90, i = 0;
  while (d > 3.2 && i < 200){
    const d2 = d / 1.038;
    const y1 = sol(d), y2 = sol(d2);
    if (y1 > BAS) break;
    if (y2 - y1 > .45){
      /* la dalle grandit avec la proximité pour rester carrée */
      const DALLE = Math.max(.5, (d2 - d) * -1.9);
      const n = Math.ceil(RUE * 2.4 / DALLE) + 2;
      const dec = (i % 2) * DALLE * .5;
      for (let c = -n; c <= n; c++){
        const Xa = c * DALLE + dec, Xb = Xa + DALLE * .93;
        const xa1 = projX(Xa, d),  xb1 = projX(Xb, d);
        const xa2 = projX(Xa, d2), xb2 = projX(Xb, d2);
        if (xb1 < -60 && xb2 < -60) continue;
        if (xa1 > W + 60 && xa2 > W + 60) continue;
        const t = rnd2(i, c + 70);
        s += `<path d="M${xa1.toFixed(1)} ${y1.toFixed(1)} L${xb1.toFixed(1)} ${y1.toFixed(1)}
          L${xb2.toFixed(1)} ${y2.toFixed(1)} L${xa2.toFixed(1)} ${y2.toFixed(1)} Z"
          fill="${t > .72 ? '#3a4358' : t > .48 ? '#333b4e' : t > .24 ? '#2c3444' : '#262d3c'}"
          opacity="${(.62 + t * .3).toFixed(2)}"/>`;
        /* l'arête qui prend le jour */
        if (y2 - y1 > 3)
          s += `<path d="M${xa1.toFixed(1)} ${y1.toFixed(1)} L${xb1.toFixed(1)} ${y1.toFixed(1)}
            L${(xb1 + (xb2-xb1)*.2).toFixed(1)} ${(y1 + (y2-y1)*.2).toFixed(1)}
            L${(xa1 + (xa2-xa1)*.2).toFixed(1)} ${(y1 + (y2-y1)*.2).toFixed(1)} Z"
            fill="#5a6a88" opacity="${(.06 + t * .08).toFixed(2)}"/>`;
      }
    }
    d = d2; i++;
  }

  /* la rigole au milieu, comme dans les vieilles rues */
  s += `<path d="M${projX(-.2, 90).toFixed(1)} ${sol(90).toFixed(1)}
    L${projX(.2, 90).toFixed(1)} ${sol(90).toFixed(1)}
    L${projX(.2, 3.4).toFixed(1)} ${(BAS + 20).toFixed(1)}
    L${projX(-.2, 3.4).toFixed(1)} ${(BAS + 20).toFixed(1)} Z"
    fill="#8a7a62" opacity=".28"/>`;



  return s;
}

/* ---------- le linge tendu en travers ---------- */
function linge(){
  let s = '';
  const COULEURS = ['#f2ede0','#c9a8b0','#a8c0d0','#e8d4a0','#b8c9a8','#d4b8c8','#f0e4d0'];
  [[10, 2.4], [15, 3.1], [22, 2.2], [31, 2.8], [44, 2.4], [60, 2.9]].forEach(([d, h], j) => {
    const y = sol(d) - px(h * 3.2, d);
    const xg = projX(-RUE, d), xd = projX(RUE, d);
    const creux = px(.5, d);
    /* la corde */
    s += `<path d="M${xg.toFixed(1)} ${y.toFixed(1)}
      Q${((xg+xd)/2).toFixed(1)} ${(y + creux).toFixed(1)} ${xd.toFixed(1)} ${y.toFixed(1)}"
      stroke="${voiler('#8a7a62', d)}" stroke-width="${Math.max(.4, px(.03, d)).toFixed(2)}"
      fill="none"/>`;
    /* les pièces qui pendent */
    const n = 3 + Math.round(rnd(j * 5) * 3);
    for (let k = 0; k < n; k++){
      const t = (k + .8) / (n + .6);
      const lx = xg + (xd - xg) * t;
      const ly = y + creux * 4 * t * (1 - t);
      const lw = px(.42 + rnd(j * 9 + k) * .3, d), lh = px(.62 + rnd(j * 3 + k) * .5, d);
      s += `<g class="linge" style="transform-origin:${lx.toFixed(1)}px ${ly.toFixed(1)}px">`;
      s += `<path d="M${(lx - lw/2).toFixed(1)} ${ly.toFixed(1)} h${lw.toFixed(1)}
        v${lh.toFixed(1)} q${(-lw/2).toFixed(1)} ${(lh*.16).toFixed(1)} ${(-lw).toFixed(1)} 0 z"
        fill="${voiler(COULEURS[(j * 3 + k) % 7], d)}" opacity=".92"/>`;
      s += `</g>`;
    }
  });
  return s;
}

/* la rue est vide à cette heure-ci */
function coursesCSS(){ return ''; }

/* ---------- un platane ---------- *//* ---------- un platane ---------- */
function platane(d, X, j){
  const x = projX(X, d), y = sol(d);
  const H = px(6.4, d);                    /* huit mètres et demi */
  const tronc = voiler('#a89a86', d);
  const ecorce = voiler('#8a7c68', d);
  const feuille = voiler('#5a7a48', d);
  const feuilleC = voiler('#7d9c5c', d);

  let s = `<g class="platane">`;
  /* la grille au pied */
  s += `<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="${px(.62, d).toFixed(1)}"
    ry="${px(.16, d).toFixed(1)}" fill="${sombre('#4a4438', .2)}" opacity=".7"/>`;
  /* le tronc, qui s'affine */
  s += `<path d="M${(x - px(.19, d)).toFixed(1)} ${y.toFixed(1)}
    q${(px(.03, d)).toFixed(1)} ${(-H*.34).toFixed(1)} ${(px(.05, d)).toFixed(1)} ${(-H*.46).toFixed(1)}
    h${(px(.24, d)).toFixed(1)}
    q${(px(.02, d)).toFixed(1)} ${(H*.12).toFixed(1)} ${(px(.09, d)).toFixed(1)} ${(H*.46).toFixed(1)} z"
    fill="${tronc}"/>`;
  /* les taches de l'écorce, la signature du platane */
  for (let k = 0; k < 5; k++){
    const ty = y - H * (.06 + k * .085);
    s += `<ellipse cx="${(x + (rnd2(j, k) - .5) * px(.22, d)).toFixed(1)}" cy="${ty.toFixed(1)}"
      rx="${px(.07, d).toFixed(1)}" ry="${px(.1, d).toFixed(1)}" fill="${ecorce}" opacity=".6"/>`;
  }
  /* les branches maîtresses */
  const yb = y - H * .46;
  [[-1, .5], [1, .46], [-1, .2], [1, .24]].forEach(([sg, k], q) => {
    s += `<path d="M${x.toFixed(1)} ${(yb + px(.2, d)).toFixed(1)}
      q${(sg * px(.34, d)).toFixed(1)} ${(-H * .1).toFixed(1)}
       ${(sg * px(.58, d)).toFixed(1)} ${(-H * k * .3).toFixed(1)}"
      stroke="${tronc}" stroke-width="${Math.max(.5, px(.09 - q * .012, d)).toFixed(2)}"
      fill="none" stroke-linecap="round"/>`;
  });
  /* le feuillage : des masses qui se recouvrent */
  const F = [[0, -.8, 1], [-.5, -.7, .68], [.5, -.68, .7],
             [-.26, -.9, .54], [.3, -.88, .5]];
  F.forEach(([dx, dy, r], q) => {
    s += `<ellipse cx="${(x + dx * px(.72, d)).toFixed(1)}" cy="${(y + dy * H).toFixed(1)}"
      rx="${(px(.78, d) * r).toFixed(1)}" ry="${(px(.6, d) * r).toFixed(1)}"
      fill="${q % 2 ? feuille : feuilleC}" opacity="${(.9 + (q % 2) * .08).toFixed(2)}"/>`;
  });
  /* la lumière du couchant sur le dessus des feuilles */
  s += `<ellipse cx="${(x - px(.28, d)).toFixed(1)}" cy="${(y - H * .88).toFixed(1)}"
    rx="${px(.46, d).toFixed(1)}" ry="${px(.28, d).toFixed(1)}"
    fill="${clair('#a8c470', .4)}" opacity=".5"/>`;
  return s + `</g>`;
}

/* ---------- un lampadaire ---------- */
function lampadaire(d, X){
  const x = projX(X, d), y = sol(d), H = px(4.2, d);
  const fer = sombre('#2a3040', .3);
  const cote = X < 0 ? -1 : 1;
  let s = `<g>`;
  /* la flaque de lumière au sol, sous la lampe */
  s += `<ellipse cx="${(x - cote * px(.5, d)).toFixed(1)}" cy="${y.toFixed(1)}"
    rx="${px(1.9, d).toFixed(1)}" ry="${px(.44, d).toFixed(1)}"
    fill="#ffcf82" opacity=".09"/>`;
  s += `<ellipse cx="${(x - cote * px(.5, d)).toFixed(1)}" cy="${y.toFixed(1)}"
    rx="${px(1, d).toFixed(1)}" ry="${px(.24, d).toFixed(1)}"
    fill="#ffdc9a" opacity=".1"/>`;
  /* le mât */
  s += `<path d="M${x.toFixed(1)} ${y.toFixed(1)} v${(-H).toFixed(1)}"
    stroke="${fer}" stroke-width="${Math.max(.6, px(.09, d)).toFixed(2)}"/>`;
  /* la potence recourbée */
  s += `<path d="M${x.toFixed(1)} ${(y - H).toFixed(1)}
    q0 ${(-px(.5, d)).toFixed(1)} ${(-cote * px(.5, d)).toFixed(1)} ${(-px(.5, d)).toFixed(1)}"
    stroke="${fer}" stroke-width="${Math.max(.5, px(.07, d)).toFixed(2)}" fill="none"/>`;
  /* la lanterne */
  const lx = x - cote * px(.5, d), ly = y - H - px(.5, d);
  s += `<path d="M${(lx - px(.2, d)).toFixed(1)} ${(ly + px(.26, d)).toFixed(1)}
    l${px(.09, d).toFixed(1)} ${(-px(.26, d)).toFixed(1)} h${px(.22, d).toFixed(1)}
    l${px(.09, d).toFixed(1)} ${px(.26, d).toFixed(1)} z" fill="${fer}"/>`;
  s += `<ellipse class="lampe" cx="${lx.toFixed(1)}" cy="${(ly + px(.16, d)).toFixed(1)}"
    rx="${px(.16, d).toFixed(1)}" ry="${px(.13, d).toFixed(1)}" fill="#ffe4ae"/>`;
  /* le halo autour de l'ampoule */
  s += `<ellipse class="lampe" cx="${lx.toFixed(1)}" cy="${(ly + px(.16, d)).toFixed(1)}"
    rx="${px(.36, d).toFixed(1)}" ry="${px(.32, d).toFixed(1)}" fill="#ffcf82" opacity=".3"/>`;
  s += `<ellipse class="lampe" cx="${lx.toFixed(1)}" cy="${(ly + px(.16, d)).toFixed(1)}"
    rx="${px(.8, d).toFixed(1)}" ry="${px(.7, d).toFixed(1)}" fill="#ffcf82" opacity=".1"/>`;
  return s + `</g>`;
}

/* ---------- le long de la rue, et les gens ---------- */
function centre(){
  const O = [];
  /* les platanes, le long des deux trottoirs */
  [[64, -3.3], [50, 3.35], [39, -3.3], [30, 3.35], [23, -3.3], [17, 3.35]]
    .forEach(([d, X], j) => O.push([d, () => platane(d, X, j)]));
  /* les lampadaires, en alternance */
  [[56, 3.4], [42, -3.35], [33, 3.4], [25, -3.35], [19, 3.4], [13.5, -3.35]]
    .forEach(([d, X]) => O.push([d + .1, () => lampadaire(d, X)]));

  O.sort((a, b) => b[0] - a[0]);
  return O.map(o => o[1]()).join('');
}

/* ---------- quelqu'un attend sous le réverbère ----------
   Il est là tous les soirs. C'est lui qui donnera du travail.
   La lampe est au-dessus à sa droite : elle lui fait un liseré
   sur une joue et laisse l'autre dans le noir. */
function typeQuiAttend(){
  const d = 11.5, X = 2.6;
  const x = projX(X, d), y = sol(d), H = px(1.76, d);

function ruelle(){
  let s = ciel() + pave();
  /* les façades, du fond vers nous */
  const P = [90, 74, 60, 48, 38, 30, 24, 19, 15, 11.6, 8.8, 6.4, 4.4, 3.4];
  for (let i = 0; i < P.length - 1; i++){
    s += tranche(-1, P[i], P[i + 1], i * 2);
    s += tranche( 1, P[i], P[i + 1], i * 2 + 1);
  }
  s += linge();
  s += centre();
  s += typeQuiAttend();
  /* le voile chaud du fond de rue */
  s += `<ellipse cx="${SOLEIL.x}" cy="${sol(SOLEIL.d).toFixed(1)}" rx="220" ry="170"
    fill="#e0a868" opacity=".1"/>`;
  /* et les bords s'assombrissent : on est dans une ruelle */
  s += `<defs><radialGradient id="r-vig" cx="0.46" cy="0.4" r="0.8">
    <stop offset="40%" stop-color="#080e1a" stop-opacity="0"/>
    <stop offset="100%" stop-color="#060b14" stop-opacity=".62"/></radialGradient></defs>`;
  s += `<rect x="0" y="${HAUT}" width="${W}" height="${(BAS-HAUT).toFixed(1)}"
    fill="url(#r-vig)"/>`;
  return s;
}

    d:"Un tapecul à l'arrière. Deux voiles valent mieux qu'une." },
  { n:16, nom:"Le bordé doublé",     prix:66000,  places:12, kg:380, vit:3.6,
    d:"Une seconde peau de bois. Elle encaisse le mauvais temps." },
  { n:17, nom:"Le treuil",           prix:80000,  places:14, kg:450, vit:3.7,
    d:"Un cabestan pour hisser seul. Plus besoin d'être trois." },
  { n:18, nom:"La chaloupe",         prix:96000,  places:15, kg:500, vit:3.7,
    d:"Une annexe sur le pont. On accoste où il n'y a pas de quai." },
  { n:19, nom:"Le pavillon",         prix:115000, places:16, kg:560, vit:3.8,
    d:"Tes couleurs en tête de mât. On te reconnaît de loin." },
  { n:20, nom:"Le grand caboteur",   prix:140000, places:20, kg:700, vit:4.2,
    d:"Coque doublée, trois voiles, un nom peint sur l'étrave. Ce n'est plus une barque." }
];

/* ---- palettes ---- */
const BOIS  = ['#b58f60','#c9a374','#a5825c','#96754a','#8a6a42'];
const CLAIR = '#e4c79c', SOMBRE = '#7a5c38', FOND = '#5c4930';

/* ============================================================
   Le dessin. Tout est paramétré par le niveau.
   Repère : la barque est dessinée dans un cadre 300 x 170,
   la ligne de flottaison est à y = 118.
   ============================================================ */
let uidB = 0;

function barqueQ(n, route){
  const P = PALIERS_B[n-1];
  const L = 76 + n * 5.6;            /* longueur */
  const H = 15 + n * 0.62;           /* creux du bordé au-dessus de l'eau */
  const T = 6 + n * 0.34;            /* tirant d'eau */
  const cx = 150, flot = 122;
  const x0 = cx - L / 2;
  const g = v => (x0 + v).toFixed(1);
  const u = 'b' + (++uidB);
  let s = '';

  /* ---------- la ligne de sheer : le haut du bordé ---------- */
  /* étrave relevée à gauche, creux au milieu, poupe relevée à droite */
  const yEtrave = flot - H * 1.28;
  const yCreux  = flot - H * 0.92;
  const yPoupe  = flot - H * 1.12;
  const sheer = `M${g(0)} ${yEtrave.toFixed(1)}
    C${g(L*.2)} ${(yEtrave + (yCreux-yEtrave)*.9).toFixed(1)} ${g(L*.36)} ${yCreux.toFixed(1)} ${g(L*.54)} ${yCreux.toFixed(1)}
    C${g(L*.74)} ${yCreux.toFixed(1)} ${g(L*.9)} ${(yCreux + (yPoupe-yCreux)*.5).toFixed(1)} ${g(L)} ${yPoupe.toFixed(1)}`;

  /* ---------- la coque complète ---------- */
  const coque = sheer
    + ` L${g(L*.965)} ${(flot + T*.42).toFixed(1)}`
    + ` C${g(L*.78)} ${(flot + T).toFixed(1)} ${g(L*.24)} ${(flot + T).toFixed(1)} ${g(L*.055)} ${(flot + T*.3).toFixed(1)}`
    + ` Z`;

  s += `<defs><clipPath id="${u}"><path d="${coque}"/></clipPath></defs>`;

  /* reflet dans l'eau */
  s += `<ellipse cx="${cx}" cy="${(flot + T*.7).toFixed(1)}" rx="${(L*.5).toFixed(0)}" ry="4"
    fill="#0e4a68" opacity=".2"/>`;

  /* la chaloupe (18+), posée en travers du pont */
  if (n >= 18){
    s += `<g transform="translate(${g(L*.58)},${(yCreux - 3).toFixed(1)})">
      <path d="M0 0 q3 8 10 9 h20 q7 -1 10 -9 q-6 3 -13 3 H13 q-7 0 -13 -3 z" fill="#96754a"/>
      <path d="M-1 -2 q5 4 12 4 h18 q7 0 12 -4 v3 q-5 3 -12 3 H11 q-7 0 -12 -3 z" fill="#c9a374"/></g>`;
  }

  /* ---------- le corps de la coque ---------- */
  s += `<path d="${coque}" fill="${BOIS[2]}"/>`;

  /* les bordages : des courbes parallèles au sheer, découpées par la coque */
  const nb = Math.min(7, 3 + Math.floor(n / 3.4));
  s += `<g clip-path="url(#${u})">`;
  for (let i = 0; i < nb; i++){
    const dy = (H + T) * (i / nb);
    const c = BOIS[i % BOIS.length];
    s += `<path d="${sheer}" transform="translate(0,${dy.toFixed(1)})" fill="none"
      stroke="${c}" stroke-width="${((H + T) / nb * 1.5).toFixed(1)}"/>`;
  }
  /* les coutures calfatées (2+) */
  if (n >= 2){
    for (let i = 1; i < nb; i++){
      const dy = (H + T) * (i / nb);
      s += `<path d="${sheer}" transform="translate(0,${dy.toFixed(1)})" fill="none"
        stroke="#3a2c1e" stroke-width=".9" opacity=".45"/>`;
    }
  }
  /* les œuvres vives, sous la flottaison */
  s += `<rect x="0" y="${flot}" width="300" height="60"
    fill="${n >= 10 ? '#33454f' : '#6d5334'}" opacity="${n >= 10 ? '.9' : '.55'}"/>`;
  /* le bordé doublé (16+) */
  if (n >= 16)
    s += `<path d="${sheer}" transform="translate(0,${(H*.9).toFixed(1)})" fill="none"
      stroke="#6d5334" stroke-width="2.4" opacity=".7"/>`;
  s += `</g>`;

  /* ---------- le liston (5+) ---------- */
  if (n >= 5){
    s += `<path d="${sheer}" fill="none" stroke="${CLAIR}" stroke-width="${(2.4 + n*.06).toFixed(1)}"
      stroke-linecap="round"/>`;
  } else {
    s += `<path d="${sheer}" fill="none" stroke="${BOIS[0]}" stroke-width="2" stroke-linecap="round"/>`;
  }
  /* l'ourlet clair du dessus */
  s += `<path d="${sheer}" transform="translate(0,-1)" fill="none" stroke="#f0dcb4"
    stroke-width="1" opacity=".6"/>`;

  /* ---------- l'étrave et l'étambot ---------- */
  s += `<path d="M${g(0)} ${yEtrave.toFixed(1)} C${g(-2)} ${(yEtrave + H*.7).toFixed(1)}
    ${g(1)} ${(flot).toFixed(1)} ${g(L*.055)} ${(flot + T*.3).toFixed(1)}"
    fill="none" stroke="${SOMBRE}" stroke-width="2.6" stroke-linecap="round"/>`;
  s += `<path d="M${g(L)} ${yPoupe.toFixed(1)} L${g(L*.965)} ${(flot + T*.42).toFixed(1)}"
    stroke="${SOMBRE}" stroke-width="2.6" stroke-linecap="round" fill="none"/>`;

  /* ---------- l'intérieur, vu par-dessus le bordé ---------- */
  s += `<path d="${sheer}" transform="translate(0,2.2)" fill="none" stroke="${FOND}"
    stroke-width="${Math.max(2.2, H*.22).toFixed(1)}"/>`;

  /* ---------- le pont ---------- */
  const pont = (a, b, coul, clair) => {
    s += `<path d="${sheer}" transform="translate(0,2)" fill="none" stroke="${coul}"
      stroke-width="${Math.max(2.4, H*.2).toFixed(1)}"
      stroke-dasharray="${(L*(b-a)).toFixed(0)} ${L.toFixed(0)}"
      stroke-dashoffset="${(-L*a).toFixed(0)}"/>`;
    s += `<path d="${sheer}" transform="translate(0,.6)" fill="none" stroke="${clair}"
      stroke-width="1.2" stroke-dasharray="${(L*(b-a)).toFixed(0)} ${L.toFixed(0)}"
      stroke-dashoffset="${(-L*a).toFixed(0)}"/>`;
  };
  if (n >= 11)      pont(.03, .95, '#b8946a', '#dfc094');   /* tillac : pont continu */
  else if (n >= 6)  pont(.04, .34, '#b8946a', '#dfc094');   /* demi-pont avant */

  /* ---------- le banc de nage (3+) ---------- */
  if (n >= 3 && n < 11)
    s += `<rect x="${g(L*.4)}" y="${(yCreux + 1.6).toFixed(1)}" width="${(L*.22).toFixed(0)}"
      height="${Math.max(2, H*.14).toFixed(1)}" rx="1" fill="#8a6a42"/>`;

  /* ---------- les avirons (4+ jusqu'au pont) ---------- */
  if (n >= 4 && n < 11){
    [[L*.34, 'av-1'], [L*.62, 'av-2']].forEach(([dx, cl]) => {
      const ax = +g(dx), ay = yCreux + 1;
      const dep = (flot + 7) - ay;      /* la pelle plonge sous la flottaison */
      /* le tolet, point de pivot */
      s += `<rect x="${(ax-1.4).toFixed(1)}" y="${(ay-3.6).toFixed(1)}" width="2.8" height="4.4"
        rx="1" fill="#6d5334"/>`;
      s += `<g class="aviron ${cl}" style="transform-origin:${ax}px ${ay.toFixed(1)}px">`;
      /* le manche, vers l'intérieur et vers le haut */
      s += `<path d="M${ax} ${ay.toFixed(1)} l-13 -6" stroke="#96754a"
        stroke-width="2.2" stroke-linecap="round"/>`;
      s += `<circle cx="${(ax-13).toFixed(1)}" cy="${(ay-6).toFixed(1)}" r="1.6" fill="#8a6a42"/>`;
      /* le fût, vers l'extérieur et vers l'eau */
      s += `<path d="M${ax} ${ay.toFixed(1)} l21 ${dep.toFixed(1)}" stroke="#a5825c"
        stroke-width="2.4" stroke-linecap="round"/>`;
      /* la pelle */
      s += `<path d="M${(ax+19).toFixed(1)} ${(ay+dep-2).toFixed(1)}
        q5.4 1 7 6 q1.6 5.4 -2 7.4 q-3.8 2 -6.8 -1.6 q-3 -3.6 -1.6 -8.6 z" fill="#c9a374"/>`;
      s += `<path d="M${(ax+19.6).toFixed(1)} ${(ay+dep-1).toFixed(1)}
        q4.4 1.4 5.6 5.4" stroke="#dfc094" stroke-width="1.2" fill="none"/>`;
      s += `</g>`;
    });
  }

  /* ---------- le panneau de cale (12+) ---------- */
  if (n >= 12){
    s += `<rect x="${g(L*.46)}" y="${(yCreux - 1.4).toFixed(1)}" width="${(L*.15).toFixed(0)}"
      height="${Math.max(2.6, H*.12).toFixed(1)}" rx="1" fill="#8a6a42" stroke="#6d5334" stroke-width=".8"/>`;
  }

  /* ---------- le rouf (14+) ---------- */
  if (n >= 14){
    const rx = +g(L*.62), ry = yCreux - 1, rh = H*.5, rw = L*.2;
    s += `<path d="M${rx} ${ry.toFixed(1)} h${rw.toFixed(0)} v-${rh.toFixed(1)} h-${rw.toFixed(0)} z" fill="#c9a374"/>`;
    s += `<path d="M${(rx-2).toFixed(1)} ${(ry-rh).toFixed(1)} h${(rw+4).toFixed(0)} l-2.4 -3.4 h-${(rw-.8).toFixed(0)} z" fill="#8a4a3a"/>`;
    s += `<rect x="${(rx+2.6).toFixed(1)}" y="${(ry-rh+2.4).toFixed(1)}" width="${(rw*.26).toFixed(1)}"
      height="${(rh*.42).toFixed(1)}" fill="#6d8fa4" opacity=".85"/>`;
    s += `<rect x="${(rx+rw*.56).toFixed(1)}" y="${(ry-rh+2.4).toFixed(1)}" width="${(rw*.26).toFixed(1)}"
      height="${(rh*.42).toFixed(1)}" fill="#6d8fa4" opacity=".85"/>`;
  }

  /* ---------- le grand mât (7+) ---------- */
  const mxP = n >= 13 ? .34 : .46;
  if (n >= 7){
    const mx = +g(L * mxP);
    const pied = yCreux + 1;
    const mh = n >= 8 ? 46 + n * 2.3 : 32;
    s += `<path d="M${mx} ${pied.toFixed(1)} v-${mh.toFixed(0)}" stroke="#8a6a42"
      stroke-width="${(2 + n*.07).toFixed(1)}" stroke-linecap="round"/>`;
    s += `<path d="M${(mx-.7).toFixed(1)} ${pied.toFixed(1)} v-${mh.toFixed(0)}" stroke="#c9a374"
      stroke-width=".9" opacity=".7"/>`;
    const ay = pied - mh;

    if (n === 7){
      s += `<path class="voile" d="M${mx} ${(ay+5).toFixed(1)} q15 7 20 21 q-13 5 -20 4 z" fill="#ddd2b6"/>`;
      s += `<path d="M${mx} ${(ay+5).toFixed(1)} q15 7 20 21 q-8 3 -12 3 z" fill="#f0e8d2"/>`;
    } else {
      /* la voile latine : antenne inclinée sur toute la hauteur */
      s += `<path d="M${(mx-20).toFixed(1)} ${(ay + mh*.5).toFixed(1)} L${(mx+34).toFixed(1)} ${(ay-4).toFixed(1)}"
        stroke="#a5825c" stroke-width="2.2" stroke-linecap="round"/>`;
      s += `<path class="voile" d="M${(mx-18).toFixed(1)} ${(ay + mh*.48).toFixed(1)}
        L${(mx+32).toFixed(1)} ${(ay-3).toFixed(1)}
        Q${(mx+14).toFixed(1)} ${(ay + mh*.56).toFixed(1)} ${(mx+2).toFixed(1)} ${pied.toFixed(1)} Z" fill="#e4dbc0"/>`;
      s += `<path d="M${(mx-18).toFixed(1)} ${(ay + mh*.48).toFixed(1)}
        L${(mx+32).toFixed(1)} ${(ay-3).toFixed(1)}
        Q${(mx+20).toFixed(1)} ${(ay + mh*.38).toFixed(1)} ${(mx+8).toFixed(1)} ${(ay + mh*.62).toFixed(1)} Z" fill="#f6f0dc"/>`;
      s += `<g stroke="#c9bfa2" stroke-width=".7" opacity=".65">
        <path d="M${(mx-6).toFixed(1)} ${(ay+mh*.5).toFixed(1)} L${(mx+9).toFixed(1)} ${(pied-5).toFixed(1)}"/>
        <path d="M${(mx+9).toFixed(1)} ${(ay+mh*.26).toFixed(1)} L${(mx+15).toFixed(1)} ${(pied-11).toFixed(1)}"/></g>`;
      s += `<g stroke="#c9b58c" stroke-width=".8" opacity=".75">
        <path d="M${mx} ${(ay+5).toFixed(1)} L${g(L*.1)} ${(yCreux-1).toFixed(1)}"/>
        <path d="M${mx} ${(ay+5).toFixed(1)} L${g(L*.86)} ${(yCreux-1).toFixed(1)}"/></g>`;
    }
  }

  /* ---------- le foc et son beaupré (13+) ---------- */
  if (n >= 13){
    const bx = +g(-8), by = yEtrave - 3;
    const mx = +g(L*mxP), mh = 46 + n*2.3, ay = yCreux + 1 - mh;
    s += `<path d="M${g(L*.02)} ${(yEtrave+2).toFixed(1)} L${bx} ${by.toFixed(1)}"
      stroke="#a5825c" stroke-width="2.2" stroke-linecap="round"/>`;
    s += `<path class="voile" d="M${bx} ${by.toFixed(1)} L${mx} ${(ay + mh*.2).toFixed(1)}
      Q${(bx+17).toFixed(1)} ${(ay + mh*.66).toFixed(1)} ${(bx+12).toFixed(1)} ${(yEtrave+4).toFixed(1)} Z"
      fill="#eee6cc"/>`;
    s += `<path d="M${bx} ${by.toFixed(1)} L${mx} ${(ay + mh*.2).toFixed(1)}
      Q${(bx+24).toFixed(1)} ${(ay + mh*.5).toFixed(1)} ${(bx+20).toFixed(1)} ${(ay + mh*.8).toFixed(1)} Z"
      fill="#f8f2de"/>`;
  }

  /* ---------- le tapecul (15+) ---------- */
  if (n >= 15){
    const mx2 = +g(L*.86), mh2 = 30 + n, pied2 = yCreux + 1;
    s += `<path d="M${mx2} ${pied2.toFixed(1)} v-${mh2.toFixed(0)}" stroke="#8a6a42"
      stroke-width="2.2" stroke-linecap="round"/>`;
    s += `<path d="M${(mx2-12).toFixed(1)} ${(pied2 - mh2*.44).toFixed(1)} L${(mx2+18).toFixed(1)} ${(pied2 - mh2 + 2).toFixed(1)}"
      stroke="#a5825c" stroke-width="1.9" stroke-linecap="round"/>`;
    s += `<path class="voile" d="M${(mx2-10).toFixed(1)} ${(pied2 - mh2*.42).toFixed(1)}
      L${(mx2+16).toFixed(1)} ${(pied2 - mh2 + 3).toFixed(1)}
      Q${(mx2+5).toFixed(1)} ${(pied2 - mh2*.4).toFixed(1)} ${(mx2+2).toFixed(1)} ${pied2.toFixed(1)} Z"
      fill="#e4dbc0"/>`;
  }

  /* ---------- le safran (9+) ---------- */
  if (n >= 9){
    s += `<path d="M${g(L*.97)} ${(flot - H*.5).toFixed(1)} q6 4 6 ${(T*1.1).toFixed(1)}
      q0 ${(T*.5).toFixed(1)} -6 ${(T*.5).toFixed(1)} z" fill="#7a5c38"/>`;
    s += `<path d="M${g(L*.94)} ${(yPoupe + 2).toFixed(1)} l13 -6" stroke="#a5825c"
      stroke-width="2" stroke-linecap="round"/>`;
  }

  /* ---------- le treuil (17+) ---------- */
  if (n >= 17){
    const tx = +g(L*.44);
    s += `<rect x="${(tx-4.4).toFixed(1)}" y="${(yCreux - 6).toFixed(1)}" width="9" height="6" rx="2" fill="#5c6a74"/>`;
    s += `<circle cx="${tx}" cy="${(yCreux - 3).toFixed(1)}" r="2.2" fill="#8a9299"/>`;
  }

  /* ---------- le pavillon (19+) ---------- */
  if (n >= 19){
    const mx = +g(L * mxP), mh = 46 + n * 2.3, tete = yCreux + 1 - mh;
    /* la drisse et le petit mât de pavillon */
    s += `<path d="M${mx} ${tete.toFixed(1)} v-9" stroke="#8a6a42" stroke-width="1.6" stroke-linecap="round"/>`;
    /* le pavillon, qui claque */
    s += `<g class="pavillon" style="transform-origin:${mx}px ${(tete-8).toFixed(1)}px">`;
    s += `<path d="M${mx} ${(tete-9).toFixed(1)} q9 1.6 17 -1.4 q-2 4 0 7.4 q-8 3 -17 1.4 z" fill="#c74a33"/>`;
    s += `<path d="M${mx} ${(tete-9).toFixed(1)} q9 1.6 17 -1.4 q-1 2 -.6 3.6 q-8 2.4 -16.4 1 z" fill="#e0684a"/>`;
    s += `</g>`;
  }

  /* ---------- le nom peint (20) ---------- */
  if (n >= 20)
    s += `<text x="${g(L*.1)}" y="${(flot - H*.34).toFixed(1)}" font-family="Georgia,serif"
      font-size="8.4" letter-spacing="1.2" fill="#f2e6c8" opacity=".85">LA ZIZOUIN</text>`;

  /* ---------- l'eau, selon l'allure ---------- */
  /* la proue est à gauche : le sillage traîne derrière, donc à droite */
  if (route){
    const nv = Math.max(2, Math.round(P.vit * 1.6));
    for (let i = 0; i < nv; i++)
      s += `<path class="sillage sl${i % 3}" d="M${g(L + 4 + i*4)} ${(flot + 1 + i*2.6).toFixed(1)}
        q${(16+i*7).toFixed(0)} 2 ${(30+i*13).toFixed(0)} 0"
        stroke="#fff" stroke-width="${(1.6 - i*.16).toFixed(2)}" fill="none"
        opacity="${(.44 - i*.05).toFixed(2)}"/>`;
    /* la moustache d'étrave, elle, est bien à l'avant */
    s += `<path class="etrave" d="M${g(-3)} ${(flot - 1).toFixed(1)} q-9 4 -19 3"
      stroke="#fff" stroke-width="2" fill="none" opacity=".55"/>`;
    s += `<path class="etrave e2" d="M${g(1)} ${(flot + 2.4).toFixed(1)} q-8 4 -17 3"
      stroke="#fff" stroke-width="1.4" fill="none" opacity=".36"/>`;
    /* le remous sous la poupe */
    s += `<ellipse class="remous" cx="${g(L + 2)}" cy="${(flot + 3).toFixed(1)}" rx="9" ry="2.4"
      fill="#fff" opacity=".24"/>`;
  } else {
    /* au mouillage : la chaîne d'ancre à l'étrave */
    s += `<path d="M${g(L*.03)} ${(yEtrave + 4).toFixed(1)} q-4 8 -3 16"
      stroke="#6d6a62" stroke-width="1.4" fill="none" stroke-dasharray="2 1.6"/>`;
    s += `<path d="M${g(-4)} ${(flot + 2).toFixed(1)} q22 3 40 0"
      stroke="#fff" stroke-width="1.2" fill="none" opacity=".26"/>`;
  }

  return s;
}

let MOI = null;
let chargesCt = false;

async function poserContrats(d, forcer){
  const el = document.getElementById('k-liste');
  if (!el) return;
  if (chargesCt && !forcer) return;
  chargesCt = true;

  const r = await BD.agir('contrats_du_jour');
  if (!r.ok){
    el.innerHTML = '<li class="rien">' + (r.pourquoi === 'sans_bateau'
      ? "Il te faut un bateau avant qu'on te confie quoi que ce soit."
      : "Rien pour l'instant. Reviens plus tard.") + '</li>';
    document.getElementById('k-cale').textContent = '—';
    return;
  }

  const occupe = (d.cale || []).reduce((n, o) => n + (+o.places || 1), 0);
  const libre = r.places - occupe;
  document.getElementById('k-cale').innerHTML =
    '<b>' + libre + ' / ' + r.places + '</b> ' + (r.places > 1 ? 'places libres' : 'place libre');

  const L = r.contrats || [];
  if (!L.length){
    el.innerHTML = '<li class="rien">Personne ne cherche de bras aujourd\'hui.</li>';
    return;
  }

  el.innerHTML = L.map(c => {
    const pris = c.etat === 'pris';
    const tient = libre >= c.places;
    const d2 = +c.demande, pr = +c.pression || 0;
    /* ce qu'on en dit dépend surtout de ce qui arrive au port là-bas */
    const mot = pr >= 18 ? ['Le port en déborde', '#e08a6a']
      : pr >= 9 ? ['Il en arrive beaucoup', '#e0a878']
      : d2 >= 1.2 ? ['On en manque là-bas', '#8ce0a8']
      : d2 >= 1.02 ? ['La demande est bonne', '#c4d88a']
      : d2 >= 0.85 ? ['Le cours est normal', 'rgba(255,255,255,.5)']
      : ['Ils en ont déjà beaucoup', '#e0a878'];
    return '<li class="' + (pris ? 'pris' : '') + '">'
      + '<div class="l1"><span class="tx"><b>' + c.nom + '</b>'
      + '<span class="no">' + c.note + '</span></span>'
      + '<span class="px"><em>' + c.paie + ' €</em>'
      + '<i style="color:' + mot[1] + '">' + mot[0] + '</i></span></div>'
      + '<div class="l2"><span class="d">' + c.kg + ' kg — '
      + c.places + (c.places > 1 ? ' places' : ' place') + ' en cale'
      + (pr >= 3 ? '<br><span style="color:' + mot[1] + '">'
          + Math.round(pr) + ' livrées ces jours-ci</span>' : '') + '</span>'
      + (pris ? '<span class="fait">À bord ✓</span>'
         : '<button data-c="' + c.id + '"' + (tient ? '' : ' disabled') + '>'
           + (tient ? 'Charger' : 'Cale pleine') + '</button>')
      + '</div></li>';
  }).join('');

  const OU = { anse:'chez toi', barcelone:'à Barcelone', palma:'à Palma' };
  const ou2 = document.getElementById('k-ou');
  if (ou2) ou2.textContent = r.depuis === 'barcelone'
    ? 'Ce que Miquel te confie' : "Ce qu'on te propose aujourd'hui";
  document.getElementById('k-mot').innerHTML =
    'Les contrats changent chaque jour. Tu es payé en arrivant '
    + (OU[r.vers] || 'à destination') + '.<br>'
    + '<span style="color:rgba(255,255,255,.34)">Plus une marchandise arrive là-bas, '
    + 'moins elle vaut — pour tout le monde.</span>';

  el.querySelectorAll('[data-c]').forEach(b =>
    b.onclick = async () => {
      b.disabled = true; b.textContent = '…';
      const p = await BD.agir('prendre_contrat', { p_id: b.dataset.c });
      if (p.ok){
        secousse('bien');
        const f = await BD.charger();
        Object.assign(d, f);
        poserBarre(d); poserMenu(d); poserBarque(d); poserBas(d);
        poserContrats(d, true);
      } else {
        b.textContent = p.pourquoi === 'cale_pleine' ? 'Cale pleine' : 'Impossible';
      }
    });
}


let ctOuvert = false;
function basculerContrats(o, d){
  ctOuvert = o === undefined ? !ctOuvert : o;
  document.getElementById('ct').classList.toggle('on', ctOuvert);
  document.getElementById('voile').classList.toggle('on', ctOuvert || ouvert);
  if (ctOuvert && d) poserContrats(d);
}

/* ---------- le panneau de la barque ---------- */
let ouvert = false;
function ouvrirBarque(o){
  ouvert = o;
  document.getElementById('bq').classList.toggle('on', o);
  document.getElementById('voile').classList.toggle('on', o);
}
document.getElementById('voile').onclick = () => ouvrirBarque(false);
document.getElementById('q-fer').onclick = () => ouvrirBarque(false);
addEventListener('keydown', e => { if (e.key === 'Escape') ouvrirBarque(false); });

/* ---------- il traverse la rue et vient te parler ---------- */
function aborder(){
  const svg = document.querySelector('#rue svg');
  const g = svg && svg.querySelector('.pnj');
  if (!g){ location.href = 'miquel.html'; return; }

  /* on l'enveloppe : l'animation « il attend » reste sur lui,
     et c'est l'enveloppe qui le déplace */
  const env = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  g.parentNode.insertBefore(env, g);
  env.appendChild(g);
  svg.appendChild(env);          /* devant tout le reste */
  g.classList.remove('pnj');     /* il ne trépigne plus, il marche */
  const sg = g.querySelector('.signe');
  if (sg) sg.remove();           /* plus besoin du point d'exclamation */

  env.style.transition = 'transform 2.4s cubic-bezier(.34,.5,.5,1)';
  requestAnimationFrame(() => {
    /* il va vers le centre, il descend, il grandit : il vient sur nous */
    env.setAttribute('transform',
      'translate(404 400) scale(3.4) translate(-404 -400) translate(-46 34)');
  });

  /* la rue s'assombrit derrière lui, sans le flouter */
  const nuit = document.createElement('div');
  nuit.style.cssText = 'position:fixed;inset:0;z-index:2;background:#060c16;'
    + 'opacity:0;transition:opacity 1.8s .5s;pointer-events:none';
  document.body.appendChild(nuit);
  requestAnimationFrame(() => nuit.style.opacity = '.5');

  /* la barre du bas s'efface : ce n'est plus le moment */
  const bas = document.querySelector('.bas');
  if (bas){ bas.style.transition = 'opacity .7s'; bas.style.opacity = '0'; }

  /* la ligne qui dit ce qui se passe */
  const m = document.createElement('p');
  m.textContent = "Il te voit. Il s'écarte du mur et vient vers toi.";
  m.style.cssText = 'position:fixed;left:24px;right:24px;bottom:16%;z-index:12;'
    + 'text-align:center;font-size:15.5px;line-height:1.6;color:#fff;'
    + 'font-family:system-ui,sans-serif;text-shadow:0 2px 18px rgba(4,10,20,.95);'
    + 'opacity:0;transition:opacity 1s .9s';
  document.body.appendChild(m);
  requestAnimationFrame(() => m.style.opacity = '1');

  setTimeout(() => location.href = 'miquel.html', 2900);
}

/* le grand bouton du bas mène au choix du cap, comme à Marseille */
document.getElementById('partir').onclick = () => location.href = 'voyager.html';
requestAnimationFrame(() =>
  document.getElementById('partir').classList.add('pret'));
document.getElementById('k-fer').onclick = () => basculerContrats(false);

/* on peut toucher le type qui attend */
document.getElementById('rue').style.cursor = 'default';
let MIQUEL_VU = null;   /* null tant qu'on ne sait pas encore */
function poserMiquel(vecue){
  if (vecue !== undefined) MIQUEL_VU = vecue;
  else if (MIQUEL_VU === null) return;
  vecue = MIQUEL_VU;
  const svg = document.querySelector('#rue svg');
  const g = svg && svg.querySelector('.pnj');
  if (!g) return;
  if (vecue){ g.querySelector('.signe')?.remove(); return; }
  g.style.cursor = 'pointer';
  g.onclick = () => location.href = 'miquel.html';
  /* une zone plus large, pour ne pas avoir à viser */
  const b = g.getBBox();
  const z = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  z.setAttribute('x', b.x - 14); z.setAttribute('y', b.y - 6);
  z.setAttribute('width', b.width + 28); z.setAttribute('height', b.height + 12);
  z.setAttribute('fill', 'transparent');
  z.style.cursor = 'pointer';
  z.onclick = () => location.href = 'miquel.html';
  svg.appendChild(z);
}

/* ---------- la fiche du joueur ---------- */
/* ---------- l'aube ---------- */
let AUBE = false;
function leverAube(){
  if (AUBE) return;
  AUBE = true;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    const c = document.getElementById('charge');
    if (!c) return;
    c.classList.add('parti');
    setTimeout(() => c.remove(), 500);
  }));
}
/* filet de sécurité : on n'enferme jamais le joueur derrière le voile */
setTimeout(leverAube, 6000);

(async () => {
  let d;
  try {
    d = await BD.charger();
    if (!d){ location.href = 'index.html'; return; }
  } catch(e){ leverAube(); return; }

  /* on n'est ici que si on a débarqué à Barcelone */
  if (d.parti_le){ location.href = 'mer.html'; return; }
  if (d.port !== 'barcelone'){ location.href = 'jeu.html'; return; }

  document.getElementById('eu').textContent =
    Number(d.euros || 0).toLocaleString('fr-FR', {minimumFractionDigits:2}) + ' €';

  /* les deux jauges, comme sur la rade */
  const nrj = Number(d.energie ?? 0), nmax = Number(d.energie_max ?? 100) || 100;
  document.getElementById('b-nrj').style.width =
    Math.min(100, nrj / nmax * 100) + '%';
  document.getElementById('b-nrjn').textContent = Math.round(nrj);
  const xp = Number(d.xp || 0), seuil = Number(d.seuil_xp || 1) || 1;
  document.getElementById('b-xp').style.width =
    Math.min(100, xp / seuil * 100) + '%';
  document.getElementById('b-niv').textContent = 'nv ' + (d.niveau || 1);

  /* le portrait ouvre le hub, comme à l'anse */
  const por = document.getElementById('por');
  por.innerHTML = BD.avatarSVG(d)
    + '<span class="nm">' + (d.pseudo || '') + '</span>';
  const sv = por.querySelector('svg');
  if (sv) sv.setAttribute('preserveAspectRatio', 'xMidYMid slice');
  por.onclick = () => location.href = 'hub.html?v=3';

  const n = Math.max(1, Number(d.barque || 1));
  const P = PALIERS_B[n - 1];
  document.getElementById('q-pal').textContent = 'Palier ' + n + ' sur 20';
  document.getElementById('q-nom').textContent = P.nom;
  document.getElementById('q-d').textContent = P.d;
  document.getElementById('q-cale').innerHTML = P.places
    + ' <small>' + (P.places > 1 ? 'places' : 'place') + '</small>';
  document.getElementById('q-kg').innerHTML = P.kg + ' <small>kg</small>';
  document.getElementById('q-vit').innerHTML = P.vit.toFixed(1) + ' <small>nœuds</small>';

  /* le vrai dessin, au bon palier */
  const vue = document.getElementById('q-vue');
  vue.querySelector('svg')?.remove();
  vue.insertAdjacentHTML('afterbegin',
    '<svg viewBox="30 44 240 104" xmlns="http://www.w3.org/2000/svg">'
    + barqueQ(n, false) + '</svg>');

  /* le signe au-dessus de sa tête disparaît une fois la scène vécue */
  MOI = d;
  leverAube();
  /* on retient le port : le hub s ouvrira du bon ciel */
  try { localStorage.setItem("bd-port", d.port || "anse"); } catch(e){}
  const vu = (d.rencontres || []).includes('miquel');
  const connu = (d.quetes || []).some(q => q.k === 'miquel_2');

  /* il te connaît et il a du travail : il vient vers toi */
  if (vu && !connu){ aborder(); return; }

  poserMiquel(vu);

  /* le hub peut demander qu'on ouvre un panneau en arrivant ici */
  try {
    const q = sessionStorage.getItem('bd-ouvrir');
    if (q){
      sessionStorage.removeItem('bd-ouvrir');
      if (q === 'bateau') ouvrirBarque(true);
      if (q === 'docks' && connu) basculerContrats(true, d);
    }
  } catch(e){}
})();

/* ---------- ne redessiner que si le cadre a vraiment changé ----------
   La barre d'adresse qui se cache envoie un resize et fait varier la
   hauteur d'une soixantaine de pixels : redessiner à ce moment-là ne
   sert à rien et fait clignoter tout l'écran. */
let __L = innerWidth, __H = innerHeight, __t = null;
addEventListener('resize', () => {
  const dl = Math.abs(innerWidth - __L), dh = Math.abs(innerHeight - __H);
  if (dl < 2 && dh < 120) return;
  __L = innerWidth; __H = innerHeight;
  clearTimeout(__t);
  __t = setTimeout(() => { dessiner(); poserMiquel(); }, 220);
});
</script>
