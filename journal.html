<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#f5a53a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Nouveautés — Battle Dock</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="chaud.css?v=2">
<script>
/* ---------- le ciel du port où l'on se trouve ---------- */
(function(){
  const C = { anse:['#f5a53a','#eeb455','#c9b978','#3f87a6','#2b6f92'],
    barcelone:['#e8873f','#c9686a','#8a5f84','#3f5f82','#1c3350'],
    palma:['#f6d97a','#e8b45c','#88b8a8','#2f92a4','#14566a'],
    ajaccio:['#e8a8a0','#c98fa0','#8f8fa8','#3f7f92','#17475c'] };
  let p = 'anse';
  try { p = localStorage.getItem('bd-port') || 'anse'; } catch(e){}
  const ci = C[p] || C.anse;
  const R = document.documentElement.style;
  ci.forEach((v, i) => R.setProperty('--h' + (i + 1), v));
  const m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', ci[0]);
})();

/* le pied dit le port où l'on est */
(function(){
  const N = { anse:'Marseille', barcelone:'Barcelone',
              palma:'Palma', ajaccio:'Ajaccio' };
  let p = 'anse';
  try { p = localStorage.getItem('bd-port') || 'anse'; } catch(e){}
  const el = document.querySelector('.pied');
  if (el) el.textContent = 'Battle Dock — ' + (N[p] || 'Marseille');
})();
</script>
<style>
html{background:var(--h5,#2b6f92)}
body::before{background:linear-gradient(180deg,
  var(--h1,#f5a53a) 0%, var(--h2,#eeb455) 16%, var(--h3,#c9b978) 38%,
  var(--h4,#3f87a6) 70%, var(--h5,#2b6f92) 100%)}
</style>
<style>
/* ============================================================
   Une page de nouvelles se parcourt, elle ne se lit pas.
   D'abord une ligne par changement — un point de couleur et un
   titre. Le détail ne vient que si on le demande.
   ============================================================ */

/* ---------- le numéro de la mise à jour ---------- */
.maj{display:flex;align-items:center;gap:15px;padding:17px 18px;margin-bottom:16px;
  border-radius:18px;background:var(--creme);border:3px solid var(--encre)}
.maj .n{flex:0 0 auto;min-width:60px;padding:8px 12px;border-radius:14px;
  text-align:center;background:var(--or);border:2.5px solid var(--encre)}
.maj .n small{display:block;font-size:9.5px;font-weight:800;letter-spacing:.12em;
  text-transform:uppercase;opacity:.62}
.maj .n b{display:block;font-family:'DM Serif Display',Georgia,serif;font-size:26px;
  line-height:1.05}
.maj .co b{display:block;font-family:'DM Serif Display',Georgia,serif;font-size:20px;
  line-height:1.15}
.maj .co span{display:block;font-size:12.5px;font-weight:700;margin-top:3px;
  color:rgba(18,48,63,.55)}

/* ---------- une ligne par changement ---------- */
.ch{display:block;width:100%;padding:0;border:0;background:none;text-align:left;
  border-bottom:2px solid rgba(18,48,63,.1);font-family:'Nunito',sans-serif;
  cursor:pointer}
.ch:last-child{border-bottom:0}
.ch .haut{display:flex;align-items:center;gap:13px;padding:14px 16px}
.ch:active .haut{background:var(--creme2)}
.ch .pt{flex:0 0 11px;height:11px;border-radius:50%;
  background:var(--or);border:2.5px solid var(--encre)}
.ch .ti{flex:1;min-width:0;font-size:15.5px;font-weight:800;line-height:1.25}
.ch .fl{flex:0 0 auto;font-size:17px;font-weight:800;color:rgba(18,48,63,.3);
  transition:transform .15s}
.ch.ouvert .fl{transform:rotate(90deg)}

/* le détail, replié */
.ch .bas{max-height:0;overflow:hidden;transition:max-height .2s ease-out}
.ch.ouvert .bas{max-height:220px}
.ch .bas p{padding:0 16px 15px 40px;font-size:13.5px;font-weight:600;
  line-height:1.55;color:rgba(18,48,63,.68)}
.ch .bas .ou{display:inline-block;margin:0 0 15px 40px;padding:4px 10px;
  border-radius:9px;font-size:11px;font-weight:800;
  background:rgba(18,48,63,.07);border:2px solid rgba(18,48,63,.14)}

/* réglage et réparation se distinguent par la seule pastille */
.ch.reglage .pt{background:#cdd3c0}
.ch.correction .pt{background:var(--vert)}

/* ce que tu n'as pas encore lu */
.ch.neuf .ti::after{content:'';display:inline-block;width:7px;height:7px;
  margin-left:8px;border-radius:50%;background:var(--or);
  border:2px solid var(--encre);vertical-align:middle}

/* ---------- les mises à jour d'avant ---------- */
.vieille{display:flex;align-items:center;gap:12px;width:100%;padding:15px 16px;
  border:0;background:none;cursor:pointer;text-align:left;
  font-family:'Nunito',sans-serif;
  border-bottom:2px solid rgba(18,48,63,.1)}
.vieille:last-child{border-bottom:0}
.vieille:active{background:var(--creme2)}
.vieille b{flex:1;font-size:15px;font-weight:800}
.vieille span{font-size:12px;font-weight:700;color:rgba(18,48,63,.45)}
.vieille .fl{font-size:19px;color:rgba(18,48,63,.3);font-weight:800;
  transition:transform .15s}
/* une fournée dépliée : légèrement en retrait, pour qu'on voie qu'elle
   appartient à la ligne du dessus */
.bloc-m{background:rgba(18,48,63,.04);
  border-bottom:2px solid rgba(18,48,63,.1)}
.bloc-m:last-child{border-bottom:0}
.bloc-m .ch .haut{padding-left:22px}
</style>
</head>
<body>

<div class="pont">
  <div class="tete">
    <span class="q"><b>Nouveautés</b><span id="j-sous">—</span></span>
    <button class="retour" id="retour">‹ Retour</button>
  </div>
  <div id="liste" class="attend"></div>
  <p class="pied">Battle Dock — Marseille</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="bd.js?v=3"></script>
<script>
function paraitre(){
  const e = document.getElementById('liste');
  if (e){ e.classList.remove('attend'); e.classList.add('venu'); }
}

const VU = 'bd-journal-vu';
function dejaVu(){
  try { return Number(localStorage.getItem(VU) || 0); } catch(e){ return 0; }
}

function leJour(iso){
  const h = new Date(), j = a => a.toISOString().slice(0, 10);
  if (iso === j(h)) return "aujourd'hui";
  if (iso === j(new Date(h.getTime() - 864e5))) return 'hier';
  return 'le ' + new Date(iso + 'T12:00:00')
    .toLocaleDateString('fr-FR', { day:'numeric', month:'long' });
}

/* une ligne : un point, un titre, et le reste replié dessous */
function ligne(n, neuf){
  return '<div class="ch ' + n.genre + (neuf ? ' neuf' : '') + '">'
    + '<div class="haut"><span class="pt"></span>'
    +   '<span class="ti">' + n.titre + '</span>'
    +   '<span class="fl">›</span></div>'
    + '<div class="bas">'
    +   (n.texte ? '<p>' + n.texte + '</p>' : '')
    +   (n.ou ? '<span class="ou">⚓ ' + n.ou + '</span>' : '')
    + '</div></div>';
}

/* le titre d'une fournée : combien de neuf, combien de réparé */
function compte(lot){
  const a = lot.filter(x => x.genre === 'ajout').length;
  const c = lot.filter(x => x.genre === 'correction').length;
  const r = lot.length - a - c;
  const m = [];
  if (a) m.push(a + ' nouveauté' + (a > 1 ? 's' : ''));
  if (r) m.push(r + ' réglage' + (r > 1 ? 's' : ''));
  if (c) m.push(c + ' réparation' + (c > 1 ? 's' : ''));
  return m.join(', ');
}

(async () => {
  const L = document.getElementById('liste');
  try {
    const c = await BD.client();
    const { data, error } = await c.from('nouvelles')
      .select('id, le_jour, genre, titre, texte, ou, maj')
      .order('id', { ascending:false }).limit(120);
    if (error) throw error;
    const N = data || [];

    if (!N.length){
      document.getElementById('j-sous').textContent = 'Rien à signaler';
      L.innerHTML = '<p class="vide">Rien de neuf pour le moment.</p>';
      paraitre(); return;
    }

    const vu = dejaVu();
    const neufs = N.filter(n => n.id > vu).length;
    document.getElementById('j-sous').textContent = neufs
      ? neufs + ' à découvrir' : 'Tu es à jour';

    /* les fournées, de la plus récente à la plus ancienne */
    const majs = [];
    N.forEach(n => {
      const k = n.maj || n.le_jour;
      let m = majs.find(x => x.k === k);
      if (!m){ majs.push(m = { k, jour:n.le_jour, lot:[] }); }
      m.lot.push(n);
    });

    const der = majs[0];
    let h = '<div class="maj">'
      + '<span class="n"><small>Maj</small><b>' + der.k + '</b></span>'
      + '<span class="co"><b>' + compte(der.lot) + '</b>'
      + '<span>Arrivé ' + leJour(der.jour) + '</span></span></div>'
      + '<div class="bloc">' + der.lot.map(n => ligne(n, n.id > vu)).join('') + '</div>';

    /* les précédentes restent pliées : on ne les cherche que si on veut */
    if (majs.length > 1){
      h += '<p class="sec">Avant ça</p><div class="bloc" id="avant">'
        + majs.slice(1).map(m =>
            '<button class="vieille" data-m="' + m.k + '">'
            + '<b>Maj ' + m.k + '</b><span>' + m.lot.length + '</span>'
            + '<span class="fl">›</span></button>'
            + '<div class="bloc-m" data-lot="' + m.k + '" hidden>'
            + m.lot.map(n => ligne(n, false)).join('') + '</div>').join('')
        + '</div>';
    }

    L.innerHTML = h; paraitre();

    /* on ouvre une ligne d'une tape, une seule à la fois */
    L.querySelectorAll('.ch').forEach(el =>
      el.onclick = () => {
        const o = el.classList.contains('ouvert');
        L.querySelectorAll('.ch.ouvert').forEach(x => x.classList.remove('ouvert'));
        if (!o) el.classList.add('ouvert');
      });

    /* déplier une ancienne fournée */
    L.querySelectorAll('.vieille').forEach(b =>
      b.onclick = () => {
        const d = L.querySelector('[data-lot="' + b.dataset.m + '"]');
        if (!d) return;
        d.hidden = !d.hidden;
        b.querySelector('.fl').style.transform = d.hidden ? '' : 'rotate(90deg)';
      });

    try { localStorage.setItem(VU, String(Math.max(...N.map(n => n.id)))); } catch(e){}

  } catch(e){
    console.warn(e);
    L.innerHTML = '<p class="vide">Les nouvelles ne sont pas arrivées.</p>'; paraitre();
  }
})();

document.getElementById('retour').onclick = () => location.href = 'hub.html?v=3';
</script>
</body>
</html>
