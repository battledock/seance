<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <title>La communauté</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css?v=2ab9afab">
  <style>
    /* Style minimal du voile : il doit couvrir l'écran avant même
       que base.css soit arrivé, sinon on aperçoit la page nue. */
    body{margin:0;background:#0a0406}
    .contenu,.entete,.navBas{opacity:0}
    #voileChargement{position:fixed;inset:0;z-index:500;display:flex;flex-direction:column;
      align-items:center;justify-content:center;gap:20px;
      background:radial-gradient(ellipse at 50% 42%,#2a1018,#0a0406 72%)}
  </style>
</head>
<body>

<div class="voileChargement" id="voileChargement" role="status" aria-live="polite">
  <svg class="vcBobine" viewBox="0 0 74 74" aria-hidden="true">
    <g class="roue">
      <circle cx="37" cy="37" r="32" fill="none" stroke="#caa24a" stroke-width="3"/>
      <circle cx="37" cy="37" r="7" fill="#caa24a"/>
      <g fill="#caa24a" opacity=".85">
        <circle cx="37" cy="16" r="5.4"/><circle cx="55" cy="47" r="5.4"/><circle cx="19" cy="47" r="5.4"/>
      </g>
    </g>
    <circle class="pellicule" cx="37" cy="37" r="32" fill="none"
      stroke="#f7dd9a" stroke-width="1.6" opacity=".6"/>
  </svg>
  <div class="vcNom">Séance</div>
  <div class="vcTexte">On allume le projecteur…</div>
  <div class="vcPiste"><i></i></div>
</div>

<main class="contenu">
  <div class="titrePage">
    <h1>La communauté</h1>
    <p>Découvre les cinémas des autres gérants.</p>
  </div>
  <div id="zoneBob"></div>

  <nav class="ongletsSection" id="ongletsSection" role="tablist">
    <button class="ongletSection actif" role="tab" onclick="changeSection('decouvrir')">Découvrir</button>
    <button class="ongletSection" role="tab" onclick="changeSection('classements')">Classements</button>
    <button class="ongletSection" role="tab" onclick="changeSection('abonnements')">Suivis</button>
    <button class="ongletSection" role="tab" onclick="changeSection('amis')">Amis</button>
    <button class="ongletSection" role="tab" onclick="changeSection('defis')">Défis</button>
    <button class="ongletSection" role="tab" onclick="changeSection('notifications')">
      Nouvelles<span class="badgeNotif"></span></button>
  </nav>

  <section id="sectionDecouvrir">
    <div class="barreRecherche">
      <span class="brIco"></span>
      <input id="champRecherche" type="text" maxlength="40" placeholder="Nom du cinéma ou pseudo"
        autocomplete="off" autocapitalize="off">
    </div>
    <div id="resultatsRecherche"></div>
    <div id="zoneSuggestions"></div>
  </section>

  <section id="sectionClassements" hidden><div id="zoneClassement"></div></section>
  <section id="sectionAbonnements" hidden><div id="zoneAbonnements"></div></section>
  <section id="sectionAmis" hidden><div id="zoneAmis"></div></section>
  <section id="sectionDefis" hidden><div id="zoneDefis"></div></section>
  <section id="sectionNotifications" hidden><div id="zoneNotifications"></div></section>
</main>

<script type="module" src="js/pages/communaute.js?v=2ab9afab"></script>
</body>
</html>
