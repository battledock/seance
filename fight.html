<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#141414">
<title>Battle Dock Fight — le quai</title>
<style>
:root{--encre:#141414;--papier:#f2ece0;--rouge:#e8452c;--jaune:#ffd029;--cyan:#2ec4c9}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0d0d0d;color:var(--papier);overflow:hidden;
  font-family:"Arial Black","Arial Narrow",Helvetica,sans-serif;
  -webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none}
button{font-family:inherit;color:inherit;cursor:pointer}
#scene{position:fixed;inset:0;display:flex;align-items:flex-start;justify-content:center}
canvas#c{display:block;width:100%;image-rendering:pixelated;background:#000}
.cmd{position:fixed;bottom:0;z-index:6;display:none;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
.cmd.on{display:grid}
#cmd1{left:0;right:0;padding-left:14px;padding-right:14px}
#cmd2{right:10px;bottom:36%}
.manette{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
#joy{width:132px;height:132px;touch-action:none;flex:0 0 auto}
.b.ab{width:66px;height:66px;border-radius:50%;font:900 20px/1 "Arial Black",sans-serif}
.b.a{border-color:#ffd029;color:#ffd029}
.b.bb{border-color:#2ec4c9;color:#2ec4c9}
.b.a.on{background:#ffd029;color:#141414}
.b.bb.on{background:#2ec4c9;color:#141414}
.b.garde{width:66px;height:44px;font-size:10px}
.grappe{display:grid;gap:7px}
.duo{display:grid;grid-template-columns:repeat(2,56px);gap:7px}
.b{display:flex;align-items:center;justify-content:center;width:56px;height:56px;
  border:3px solid rgba(242,236,224,.45);background:rgba(20,20,20,.55);color:var(--papier);
  font:900 11px/1 "Arial Black",sans-serif;text-transform:uppercase;backdrop-filter:blur(3px)}
.b.large{width:auto;grid-column:span 2;height:46px}
.b.on{background:var(--jaune);color:#141414;border-color:var(--jaune)}
.b.rage{border-color:var(--rouge);color:#ffb9c0}
.b.rage.pret{background:rgba(232,69,44,.55);color:#fff;animation:p 1s infinite}
@keyframes p{50%{background:rgba(232,69,44,.9)}}
.pan{position:fixed;inset:0;z-index:10;background:#141414;display:none;flex-direction:column;
  padding:calc(18px + env(safe-area-inset-top)) 20px calc(18px + env(safe-area-inset-bottom));overflow-y:auto}
.pan.on{display:flex}
.pan h1{font-size:clamp(28px,9.5vw,50px);text-transform:uppercase;font-style:italic;line-height:.9;letter-spacing:-.03em}
.pan h1 b{color:var(--rouge);font-weight:inherit}
.pan p{font-family:Georgia,serif;font-size:14px;line-height:1.7;color:#c9c4b8;max-width:34ch;margin-top:12px}
.bt{border:3px solid var(--papier);background:transparent;padding:14px;margin-top:9px;
  font:900 14px/1 "Arial Black",sans-serif;text-transform:uppercase;letter-spacing:.04em;
  display:flex;justify-content:space-between;align-items:center;box-shadow:5px 5px 0 var(--rouge)}
.bt.jaune{background:var(--jaune);color:#141414;border-color:var(--jaune);box-shadow:5px 5px 0 #141414}
.bt.cyan{background:var(--cyan);color:#141414;border-color:var(--cyan);box-shadow:5px 5px 0 #141414}
.bt:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--rouge)}
.bt[disabled]{opacity:.4}
.champ{border:3px solid var(--papier);background:transparent;color:var(--papier);padding:13px;
  font:900 17px/1 "Arial Black",sans-serif;text-transform:uppercase;letter-spacing:.2em;
  text-align:center;margin-top:9px;width:100%}
.mini{font:900 11px/1.5 "Arial Black",sans-serif;letter-spacing:.14em;text-transform:uppercase;
  color:#8a857a;margin-top:16px}
.listec{margin-top:10px;border:3px solid var(--papier)}
.listec div{padding:11px 12px;border-bottom:3px solid var(--papier);
  font:900 12px/1.3 "Arial Black",sans-serif;text-transform:uppercase;
  display:flex;justify-content:space-between;gap:10px;align-items:center}
.listec div:last-child{border-bottom:0}
.listec small{font:400 12px/1.4 Georgia,serif;color:#a8a296;text-transform:none;display:block;margin-top:3px}
.listec .v{color:var(--jaune);flex:0 0 auto}
.listec button{border:3px solid var(--jaune);background:transparent;color:var(--jaune);
  padding:8px 11px;font:900 11px/1 "Arial Black",sans-serif;text-transform:uppercase}
</style>
</head>

<div id="scene"><canvas id="c"></canvas></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const SB_URL='https://zpfkekiavlfphialvphi.supabase.co';
const SB_KEY='sb_publishable__dfR2lEOwKjhhtavvJEvGw_KVACZnHP';

const $=id=>document.getElementById(id);
const {ADVERSAIRES,ARENES,item,lookDefaut,statsDe,dessinerDocker,dessinerArene}=BDF;

/* ---------------- sauvegarde ---------------- */
let sauv=null;
try{const b=localStorage.getItem('bdf.v3')||localStorage.getItem('bdf.v2');if(b)sauv=JSON.parse(b);}catch(e){}
const monLook=Object.assign(lookDefaut(),sauv||{});
if(!monLook.nom)monLook.nom='DOCKER';
function enregistrer(){if(!sauv)return;try{localStorage.setItem('bdf.v3',JSON.stringify(sauv));}catch(e){}}

/* ---------------- constantes ---------------- */
const W=480,H=270,SOL=214,GRAV=.62,SAUT=-10.4,FRIC=.82,MUR_G=24,MUR_D=W-24;
const MANCHES=2,DUREE=75;
const COUPS={
  sec:   {dep:4,act:3,fin:7, deg:6, por:30,haut:0,rec:2.2,stun:14,bst:9, pou:1.4,rage:7},
  lourd: {dep:10,act:4,fin:16,deg:15,por:36,haut:0,rec:5.5,stun:26,bst:16,pou:3,  rage:12,casse:1},
  aerien:{dep:5,act:7,fin:8, deg:11,por:30,haut:1,rec:3.5,stun:20,bst:11,pou:2,  rage:9},
  super: {dep:8,act:18,fin:22,deg:8, por:44,haut:0,rec:1.5,stun:12,bst:8, pou:1,  rage:0,multi:1,perce:1}
};
const COMBOS=[
  {seq:['sec','sec','lourd'],nom:'TROIS TEMPS',b:1.35},
  {seq:['sec','sec','sec','sec'],nom:'LA MITRAILLE',b:1.3},
  {seq:['lourd','lourd'],nom:'DEUX MARTEAUX',b:1.4},
  {seq:['aerien','lourd'],nom:'DESCENTE DE GRUE',b:1.5},
  {seq:['aerien','sec','lourd'],nom:'LE DÉBARDAGE',b:1.6},
  {seq:['sec','lourd','sec'],nom:'PORTIQUE',b:1.35},
  {seq:['sec','sec','sec','lourd'],nom:'QUATRE TEMPS',b:1.45},
  {seq:['lourd','sec','lourd'],nom:'MARTEAU-PIQUEUR',b:1.5},
  {seq:['aerien','aerien'],nom:'DOUBLE VOLÉE',b:1.3},
  {seq:['sec','sec','super'],nom:'LA NOTE FINALE',b:1.2},
  {seq:['lourd','super'],nom:'ADDITION SALÉE',b:1.25},
  {seq:['aerien','sec','sec','lourd'],nom:'LE GRAND QUART',b:1.7},
  {seq:['super'],nom:'COUP DE SANG',b:1}
];
const CRIS={
  sec:['TAC','PAF','TCHIK','VLAN'],
  lourd:['BOUM','CLANG','TCHAK','BAOUM'],
  aerien:['WOUCH','SCHTONK','VRAOUM'],
  super:['FAAAAH !','RAAAAH !','AAAAARGH !'],
  bloque:['TCHINK','TOC','CLINK'],
  ko:['AAAAH…','KO !','NUIT FINIE']
};

const cv=$('c'),ctx=cv.getContext('2d');cv.width=W;cv.height=H;ctx.imageSmoothingEnabled=false;
function redim(){const l=Math.min(window.innerWidth,window.innerHeight*.6);
  cv.style.width=Math.floor(l)+'px';cv.style.height=Math.floor(l*H/W)+'px';}
addEventListener('resize',redim);redim();

const vide=()=>({gauche:0,droite:0,haut:0,garde:0,jab:0,lourd:0,rage:0});
const T={1:vide(),2:vide()};
const K1={ArrowLeft:'gauche',ArrowRight:'droite',ArrowUp:'haut',ArrowDown:'garde',j:'jab',k:'lourd',l:'rage'};
const K2={q:'gauche',d:'droite',z:'haut',s:'garde',f:'jab',g:'lourd',h:'rage'};
addEventListener('keydown',e=>{const k=e.key,a=K1[k],b=K2[(k||'').toLowerCase()];
  if(a){T[1][a]=1;e.preventDefault();}if(b){T[2][b]=1;e.preventDefault();}});
addEventListener('keyup',e=>{const k=e.key,a=K1[k],b=K2[(k||'').toLowerCase()];if(a)T[1][a]=0;if(b)T[2][b]=0;});
document.querySelectorAll('.b').forEach(b=>{
  const j=b.dataset.j,k=b.dataset.k;
  const on=e=>{e.preventDefault();T[j][k]=1;b.classList.add('on');};
  const off=e=>{e.preventDefault();T[j][k]=0;b.classList.remove('on');};
  b.addEventListener('touchstart',on,{passive:false});b.addEventListener('touchend',off,{passive:false});
  b.addEventListener('touchcancel',off,{passive:false});b.addEventListener('mousedown',on);addEventListener('mouseup',off);
});

/* ---------------- effets ---------------- */
let parts=[],ecl=[],tremble=0,gel=0,flash=0,ralenti=0,zoom=1,zx=W/2,zy=H/2,banniere=null;
const pouss=(x,y,n,c)=>{for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*4.4,vy:-Math.random()*3.2,g:.24,vie:14+Math.random()*14,c});};
const etoile=(x,y,t,c)=>ecl.push({x,y,r:2,max:t,vie:9,mv:9,c,rot:Math.random()*6});
const anneau=(x,y,c)=>ecl.push({x,y,r:3,max:36,vie:14,mv:14,c,an:1});
let mots=[];
function crier(x,y,liste,taille,couleur){
  mots.push({x,y,txt:liste[Math.random()*liste.length|0],vie:46,mv:46,
    r:(Math.random()-.5)*.5,taille:taille||18,c:couleur||'#ffd029'});
}

/* ---------------- combattant ---------------- */
class F{
  constructor(look,ia){
    this.look=Object.assign(lookDefaut(),look);this.ia=ia||null;
    const s=statsDe(this.look);this.s=s;
    this.larg=item('carrure',this.look.carrure).larg;
    this.pvMax=Math.round(80+s.endurance*12);
    this.nom=this.look.nom||'DOCKER';this.manches=0;
  }
  get allure(){return 1.5+this.s.vitesse*.28;}
  get mult(){return (.7+this.s.force*.13)*(this.ia?this.ia.mult:1);}
  placer(x,sens){
    this.x=x;this.y=SOL;this.vx=0;this.vy=0;this.sens=sens;this.pv=this.pvMax;this.rage=0;
    this.etat='debout';this.coup=null;this.aT=0;this.stun=0;this.garde=0;this.sol=1;
    this.combo=0;this.comboT=0;this.chaine=[];this.gardeT=0;this.cer={t:20,plan:'approche'};
  }
  get corps(){return{x:this.x-this.larg/2,y:this.y-52,w:this.larg,h:52};}
  lancer(n){
    if(this.stun>0||this.coup)return;
    if(n==='super'){if(this.rage<100)return;this.rage=0;flash=14;ralenti=30;
      crier(this.x,this.y-62,CRIS.super,26,'#e8452c');anneau(this.x,this.y-30,'rgba(232,69,44,.6)');}
    const b=COUPS[n];
    this.coup=Object.assign({},b,{nom:n,t:0,por:b.por+this.s.portee*2});
    this.aT=0;this.etat='coup';
  }
  rageUp(v){this.rage=Math.min(100,this.rage+v*(1+this.s.rage*.15));}
  encaisser(k,sa,att){
    const bl=this.garde&&this.sol&&this.sens!==sa&&this.etat!=='coup'&&!k.perce;
    const casse=bl&&k.casse&&this.gardeT>85;
    if(bl&&!casse){
      this.pv-=Math.max(1,Math.round(k.deg*.18));this.stun=k.bst;this.vx=sa*k.pou*.6;this.etat='garde';
      etoile(this.x-this.sens*13,this.y-30,14,'#9fd4d8');pouss(this.x-this.sens*13,this.y-26,3,'#9fd4d8');
      crier(this.x,this.y-52,CRIS.bloque,13,'#9fd4d8');
      this.rageUp(3);att.rageUp(k.rage*.4);tremble=1.6;gel=2;return 'bloque';
    }
    att.chaine.push(k.nom);if(att.chaine.length>4)att.chaine.shift();
    let bonus=1,nom=null;
    for(const c of COMBOS){const q=att.chaine.slice(-c.seq.length);
      if(q.length===c.seq.length&&q.every((v,i)=>v===c.seq[i])){bonus=c.b;nom=c.nom;}}
    const sc=Math.max(.55,1-att.combo*.09);
    const deg=Math.max(1,Math.round(k.deg*att.mult*bonus*sc));
    this.pv-=deg;this.stun=k.stun;this.coup=null;this.vx=sa*k.rec;
    if(k.rec>4)this.vy=-3.2;
    this.etat='touche';
    const bx=this.x-this.sens*10,by=this.y-(k.haut?44:32);
    etoile(bx,by,casse?30:20,'#f2b134');anneau(bx,by,'rgba(242,177,52,.5)');
    pouss(bx,by,casse?12:7,'#e8452c');
    parts.push({x:bx,y:by-6,vx:0,vy:-.7,g:0,vie:44,c:'#fff',txt:'-'+deg});
    this.rageUp(deg*.55);att.rageUp(k.rage);
    tremble=Math.max(tremble,k.rec*1.2);gel=k.multi?2:(casse?7:4);
    if(k.rec>4){zoom=1.1;zx=bx;zy=by;}
    crier(bx,by-14,CRIS[k.nom]||CRIS.sec,k.nom==='lourd'?24:k.nom==='super'?30:18,
      k.nom==='super'?'#e8452c':'#ffd029');
    if(nom&&att.combo>=1)banniere={t:70,txt:nom};
    if(this.pv<=0){this.pv=0;this.etat='ko';ralenti=70;flash=8;
      crier(this.x,this.y-58,CRIS.ko,22,'#f2ece0');}
    return 'touche';
  }
  maj(adv,cmd){
    if(this.sol&&this.etat!=='coup'&&this.stun<=0)this.sens=adv.x>this.x?1:-1;
    if(this.stun>0){this.stun--;cmd=null;}
    if(this.etat==='ko')cmd=null;
    this.garde=0;
    if(cmd){
      if(cmd.garde&&this.sol&&!this.coup){this.garde=1;this.gardeT++;}else this.gardeT=0;
      if(!this.garde&&!this.coup){
        if(cmd.gauche)this.vx=-this.allure;
        if(cmd.droite)this.vx=this.allure;
        if(cmd.haut&&this.sol){this.vy=SAUT;this.sol=0;pouss(this.x,SOL,5,'#4a3a2c');}
      }
      if(!this.coup&&this.stun<=0){
        if(cmd.rage&&this.rage>=100)this.lancer('super');
        else if(cmd.jab)this.lancer(this.sol?'sec':'aerien');
        else if(cmd.lourd)this.lancer(this.sol?'lourd':'aerien');
      }
    }else this.gardeT=0;
    this.vy+=GRAV;this.x+=this.vx;this.y+=this.vy;
    this.vx*=this.sol?FRIC:.985;if(Math.abs(this.vx)<.05)this.vx=0;
    if(this.ecrase>0)this.ecrase--;
    if(this.y>=SOL){
      if(!this.sol){pouss(this.x,SOL,6,'#4a3a2c');this.ecrase=10;}
      this.y=SOL;this.vy=0;
      if(this.coup&&this.coup.nom==='aerien')this.coup=null;
      this.sol=1;
    }else this.sol=0;
    this.x=Math.max(MUR_G,Math.min(MUR_D,this.x));
    if(this.coup){this.coup.t++;
      if(this.coup.multi&&this.coup.t>=this.coup.dep&&this.coup.t%5===0)this.aT=0;
      if(this.coup.t>this.coup.dep+this.coup.act+this.coup.fin){this.coup=null;this.etat='debout';}}
    if(this.etat!=='ko'){
      if(this.stun>0&&!this.garde)this.etat='touche';
      else if(this.coup)this.etat='coup';
      else if(!this.sol)this.etat='saut';
      else if(this.garde)this.etat='garde';
      else if(Math.abs(this.vx)>.4)this.etat='marche';
      else this.etat='debout';}
    if(this.comboT>0&&!--this.comboT){this.combo=0;this.chaine=[];}
    if(phase==='fin'&&this.pv>0&&adv.pv<=0)this.etat='gagne';
  }
  boite(){
    const k=this.coup;if(!k||this.aT)return null;
    if(k.t<k.dep||k.t>=k.dep+k.act)return null;
    return{x:this.sens>0?this.x+8:this.x-8-k.por,y:this.y-(k.haut?48:36),w:k.por,h:16,k};
  }
  penser(adv){
    const c=vide();if(this.etat==='ko')return c;
    const dd=Math.abs(adv.x-this.x),vers=adv.x>this.x?'droite':'gauche',loin=adv.x>this.x?'gauche':'droite',A=this.ia;
    if(this.rage>=100&&dd<54&&Math.random()<.05){c.rage=1;return c;}
    if(adv.coup&&dd<52&&Math.random()<A.ref){c.garde=1;return c;}
    if(--this.cer.t<=0){const r=Math.random();
      this.cer.plan=r<A.agro*.62?'approche':r<A.agro*.86?'presse':r<.93?'recule':'attend';
      this.cer.t=18+Math.random()*34;}
    const port=26+this.s.portee*2;
    if(dd<port+10){const r=Math.random();
      if(r<.055*A.agro+.02)c.jab=1;else if(r<.095*A.agro+.03)c.lourd=1;
      else if(r<.2)c.garde=1;else if(r<.24)c[loin]=1;return c;}
    if(dd<80&&Math.random()<A.saut){c.haut=1;c[vers]=1;return c;}
    if(this.cer.plan==='approche'||this.cer.plan==='presse')c[vers]=1;
    else if(this.cer.plan==='recule')c[loin]=1;else c.garde=Math.random()<.4?1:0;
    return c;
  }
}

/* ---------------- ATH ---------------- */
function jauge(x,y,w,f,dr){
  ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(x-2,y-2,w+4,13);
  ctx.fillStyle='#3a2f2a';ctx.fillRect(x,y,w,9);
  const p=Math.max(0,f.pv/f.pvMax)*w;
  ctx.fillStyle=f.pv/f.pvMax>.35?'#8fb08a':'#e8452c';ctx.fillRect(dr?x+w-p:x,y,p,9);

  const ry=y+26,rw=w*.72,rx=dr?x+w-rw:x;
  ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(rx-1,ry-1,rw+2,7);
  ctx.fillStyle='rgba(242,236,224,.12)';ctx.fillRect(rx,ry,rw,5);
  const rp=f.rage/100*rw;
  ctx.fillStyle=f.rage>=100?'#ffd029':'#e8452c';ctx.fillRect(dr?rx+rw-rp:rx,ry,rp,5);
}

let J1=null,J2=null,phase='menu',temps=DUREE*60,msg='',msgT=0,round=1,mode='solo',
    niveau=(sauv&&sauv.niveau)?Math.min(sauv.niveau,5):0,arene=0;

function nouveauRound(){
  J1.placer(140,1);J2.placer(340,-1);
  temps=DUREE*60;parts=[];ecl=[];mots=[];banniere=null;
  msg='MANCHE '+round;msgT=80;phase='annonce';zoom=1;ralenti=0;
}
function demarrer(m,look,ia,ar,inverse){
  mode=m;arene=ar??Math.floor(Math.random()*ARENES.length);
  if(inverse){J1=new F(look,null);J2=new F(monLook,null);}

function lancerSolo(){

    Math.min(niveau,ARENES.length-1));
}
function finRound(g){if(g)g.manches++;phase='fin';msgT=140;
  msg=g?(g===J1?'MANCHE PRISE':'MANCHE PERDUE'):'TEMPS ÉCOULÉ';}
function finCombat(vic){
  phase='termine';$('cmd1').classList.remove('on');$('cmd2').classList.remove('on');
  $('p-fin').classList.add('on');
  if(mode==='solo'){

      $('suite').onclick=()=>{if(niveau>=ADVERSAIRES.length)niveau=0;lancerSolo();};
    }else{

      $('suite-l').textContent='Remettre ça';$('suite').onclick=()=>lancerSolo();
    }
  }else{
    const mien = (mode==='enligne'&&role==='invite') ? !vic : vic;

    if(mode==='enligne'){
      $('fin-t').innerHTML=mien?'Tu <b>gagnes</b>':'Tu <b>perds</b>';
      $('fin-p').textContent=gagnant.nom+' remporte le combat '+
        J1.manches+' manches à '+J2.manches+'.';
    }else{

    if(mode==='enligne'){
      if(role==='hote'&&canal)canal.send({type:'broadcast',event:'termine',payload:{vic}});
      if(pseudo)majScore(vic);
    }
  }
}
const chev=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function separer(a,b){const dd=b.x-a.x,mn=(a.larg+b.larg)/2-4;
  if(Math.abs(dd)<mn&&Math.abs(a.y-b.y)<40){const p=(mn-Math.abs(dd))/2*Math.sign(dd||1);a.x-=p*.5;b.x+=p*.5;}}
function resoudre(a,b){const z=a.boite();if(!z)return;
  if(chev(z,b.corps)){a.aT=1;if(b.encaisser(z.k,a.sens,a)==='touche'){a.combo++;a.comboT=75;a.vx-=a.sens*.7;}}}

function pas(){
  if(gel>0){gel--;return;}
  if(ralenti>0){ralenti--;if(ralenti%2)return;}
  if(phase==='annonce'){if(--msgT<=0){phase='combat';msg='ALLEZ !';msgT=34;}return;}
  if(phase==='fin'){J1.maj(J2,null);J2.maj(J1,null);effets();
    if(mode==='enligne'&&role==='invite')return;
    if(--msgT<=0){if(J1.manches>=MANCHES)finCombat(true);else if(J2.manches>=MANCHES)finCombat(false);
      else{round++;nouveauRound();}}return;}
  if(phase!=='combat')return;
  if(msgT>0)msgT--;if(temps>0)temps--;
  if(mode==='enligne'&&role==='invite'){effets();return;}
  const c1={...T[1]};
  const c2=mode==='local'?{...T[2]}:mode==='enligne'?{...distant}:J2.penser(J1);
  J1.maj(J2,c1);J2.maj(J1,c2);separer(J1,J2);resoudre(J1,J2);resoudre(J2,J1);
  if(J1.pv<=0||J2.pv<=0)finRound(J1.pv<=0?J2:J1);
  else if(temps<=0)finRound(J1.pv===J2.pv?null:(J1.pv>J2.pv?J1:J2));
  effets();
}
function effets(){
  parts=parts.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.vie--;return p.vie>0;});
  ecl=ecl.filter(e=>{e.r+=(e.max-e.r)*.35;e.vie--;return e.vie>0;});
  if(tremble>0){tremble*=.8;if(tremble<.1)tremble=0;}
  if(flash>0)flash--;
  if(zoom>1){zoom+=(1-zoom)*.12;if(zoom<1.005)zoom=1;}
}
function rendre(t){
  if(!J1){ctx.fillStyle='#0d0d0d';ctx.fillRect(0,0,W,H);return;}
  ctx.save();
  if(zoom>1){ctx.translate(zx,zy);ctx.scale(zoom,zoom);ctx.translate(-zx,-zy);}
  if(tremble)ctx.translate((Math.random()-.5)*tremble*2,(Math.random()-.5)*tremble*2);
  dessinerArene(ctx,arene,W,H,SOL,t);
  [J1,J2].sort((a,b)=>a.y-b.y).forEach(f=>{
    ctx.fillStyle='rgba(0,0,0,.32)';
    ctx.beginPath();ctx.ellipse(f.x,SOL+2,Math.max(5,f.larg/2-Math.min(10,(SOL-f.y)/7)),3,0,0,7);ctx.fill();
    if(Math.abs(f.vx)>2.5||(f.coup&&f.coup.multi)){
      ctx.globalAlpha=.2;ctx.save();ctx.translate(f.x-f.vx*2.4,f.y);ctx.scale(f.sens,1);
      dessinerDocker(ctx,f,t);ctx.restore();ctx.globalAlpha=1;}
    const kk=f.coup;
    if(kk&&kk.t>=kk.dep&&kk.t<kk.dep+kk.act){
      ctx.save();ctx.globalAlpha=.3;ctx.strokeStyle=kk.multi?'#e8452c':'#ffd029';ctx.lineWidth=3;
      ctx.beginPath();ctx.arc(f.x,f.y-(kk.haut?44:34),kk.por*.8,
        f.sens>0?-1.1:2.05,f.sens>0?1.1:4.25);ctx.stroke();ctx.restore();ctx.globalAlpha=1;
    }
    ctx.save();ctx.translate(f.x,f.y);ctx.scale(f.sens,1);dessinerDocker(ctx,f,t);ctx.restore();
  });
  parts.forEach(p=>{ctx.globalAlpha=Math.min(1,p.vie/16);
    if(p.txt){ctx.fillStyle=p.c;ctx.font='italic 900 12px "Arial Black",sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);}
    else{ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,2,2);}ctx.globalAlpha=1;});
  mots=mots.filter(m=>{m.vie--;m.y-=.55;return m.vie>0;});
  mots.forEach(m=>{
    const gr=1+(1-m.vie/m.mv)*.35;
    ctx.save();ctx.globalAlpha=Math.min(1,m.vie/16);
    ctx.translate(m.x,m.y);ctx.rotate(m.r);ctx.scale(gr,gr);ctx.textAlign='center';
    ctx.font='italic 900 '+m.taille+'px "Arial Black",sans-serif';
    ctx.lineWidth=4;ctx.strokeStyle='#141414';ctx.strokeText(m.txt,0,0);
    ctx.fillStyle=m.c;ctx.fillText(m.txt,0,0);ctx.restore();ctx.globalAlpha=1;
  });
  ecl.forEach(e=>{ctx.globalAlpha=e.vie/e.mv;
    if(e.an){ctx.strokeStyle=e.c;ctx.lineWidth=2;ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,7);ctx.stroke();}
    else{ctx.fillStyle=e.c;ctx.save();ctx.translate(e.x,e.y);ctx.rotate(e.rot);ctx.beginPath();
      for(let i=0;i<8;i++){const r=i%2?e.r*.36:e.r,a=i/8*6.283;ctx[i?'lineTo':'moveTo'](Math.cos(a)*r,Math.sin(a)*r);}
      ctx.closePath();ctx.fill();ctx.restore();}ctx.globalAlpha=1;});
  ctx.restore();ath();
  if(flash>0){ctx.fillStyle='rgba(255,245,220,'+(flash/16)+')';ctx.fillRect(0,0,W,H);}
}
let der=0,acc=0;const PAS=1000/60;
function boucle(t){
  requestAnimationFrame(boucle);
  if(!der)der=t;acc+=Math.min(120,t-der);der=t;
  while(acc>=PAS){pas();acc-=PAS;}
  rendre(t);
  const moi=(mode==='enligne'&&role==='invite')?J2:J1;
  $('rg1').classList.toggle('pret',!!moi&&moi.rage>=100);
  $('rg2').classList.toggle('pret',!!J2&&mode==='local'&&J2.rage>=100);
  if(mode==='enligne'&&canal){
    if(role==='hote'&&phase!=='menu'&&t-dernier>50){dernier=t;envoyerEtat();}
    if(role==='invite'&&t-dernier>40){dernier=t;canal.send({type:'broadcast',event:'entree',payload:T[1]});}
  }
}
requestAnimationFrame(boucle);

let gardeBouton=false;
document.querySelectorAll('.b.garde').forEach(b=>{
  ['touchstart','mousedown'].forEach(ev=>b.addEventListener(ev,()=>{if(b.dataset.j==='1')gardeBouton=true;}));
  ['touchend','touchcancel','mouseup'].forEach(ev=>b.addEventListener(ev,()=>{if(b.dataset.j==='1')gardeBouton=false;}));
});
(()=>{
  const jc=$('joy');if(!jc)return;
  const g=jc.getContext('2d'),R=54,cx=60,cy=60;
  let actif=false,dx=0,dy=0,id=null;
  const pos=t=>{const r=jc.getBoundingClientRect();
    return[(t.clientX-r.left)*jc.width/r.width,(t.clientY-r.top)*jc.height/r.height];};
  function poser(x,y){
    const ax=x-cx,ay=y-cy,d=Math.hypot(ax,ay),m=Math.min(d,R),a=Math.atan2(ay,ax);
    dx=Math.cos(a)*m;dy=Math.sin(a)*m;
    const mort=R*.28;
    T[1].gauche=dx<-mort?1:0;T[1].droite=dx>mort?1:0;T[1].haut=dy<-mort*1.15?1:0;
    T[1].garde=(dy>mort*1.2||gardeBouton)?1:0;
  }
  function relacher(){actif=false;dx=dy=0;id=null;
    T[1].gauche=T[1].droite=T[1].haut=0;T[1].garde=gardeBouton?1:0;}
  jc.addEventListener('touchstart',e=>{e.preventDefault();const t=e.changedTouches[0];
    id=t.identifier;actif=true;poser(...pos(t));},{passive:false});
  jc.addEventListener('touchmove',e=>{e.preventDefault();
    for(const t of e.changedTouches)if(t.identifier===id)poser(...pos(t));},{passive:false});
  ['touchend','touchcancel'].forEach(ev=>jc.addEventListener(ev,e=>{e.preventDefault();
    for(const t of e.changedTouches)if(t.identifier===id)relacher();},{passive:false}));
  jc.addEventListener('mousedown',e=>{actif=true;poser(...pos(e));});
  jc.addEventListener('mousemove',e=>{if(actif)poser(...pos(e));});
  addEventListener('mouseup',()=>{if(actif)relacher();});
  (function d2(){
    requestAnimationFrame(d2);
    g.clearRect(0,0,120,120);
    g.fillStyle='rgba(20,20,20,.45)';g.beginPath();g.arc(cx,cy,R,0,7);g.fill();
    g.strokeStyle='rgba(242,236,224,.35)';g.lineWidth=3;
    g.beginPath();g.arc(cx,cy,R,0,7);g.stroke();
    g.strokeStyle='rgba(242,236,224,.15)';g.lineWidth=2;
    g.beginPath();g.moveTo(cx-R+9,cy);g.lineTo(cx+R-9,cy);
    g.moveTo(cx,cy-R+9);g.lineTo(cx,cy+R-9);g.stroke();
    g.fillStyle=actif?'#ffd029':'rgba(242,236,224,.75)';
    g.beginPath();g.arc(cx+dx,cy+dy,21,0,7);g.fill();
    g.strokeStyle='#141414';g.lineWidth=3;g.beginPath();g.arc(cx+dx,cy+dy,21,0,7);g.stroke();
    g.fillStyle='rgba(242,236,224,.5)';g.font='900 8px "Arial Black",sans-serif';g.textAlign='center';
    g.fillText('SAUT',cx,12);g.fillText('GARDE',cx,117);
  })();
})();

let sb=null,canal=null,role=null,distant=vide(),dernier=0,pseudo=null,codeTable=null;
const client=()=>sb||(sb=createClient(SB_URL,SB_KEY,{realtime:{params:{eventsPerSecond:30}}}));
const codeAlea=()=>{const L='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  return Array.from({length:4},()=>L[Math.random()*L.length|0]).join('');};

function envoyerEtat(){
  const p=f=>({x:f.x,y:f.y,sens:f.sens,etat:f.etat,pv:f.pv,pvMax:f.pvMax,rage:f.rage,combo:f.combo,
    manches:f.manches,sol:f.sol,vx:f.vx,coup:f.coup?{nom:f.coup.nom,t:f.coup.t,dep:f.coup.dep,
    act:f.coup.act,por:f.coup.por,haut:f.coup.haut,multi:f.coup.multi}:null});
  canal.send({type:'broadcast',event:'etat',payload:{a:p(J1),b:p(J2),temps,phase,msg,msgT,arene}});
}
async function inscrire(){
  const p=($('pseudo').value||'').toUpperCase().trim();
  if(p.length<3){$('net-txt').textContent='Il faut au moins 3 caractères.';return;}
  pseudo=p;monLook.nom=p;
  const c=client();
  const {error}=await c.from('bdf_joueurs').upsert({pseudo:p,look:monLook,vu_le:new Date().toISOString()},{onConflict:'pseudo'});
  $('net-txt').textContent=error?('Inscription impossible : '+error.message):('Connecté en tant que '+p+'.');
  $('ouvrir-table').disabled=!!error;

}
async function listerJoueurs(){
  const {data}=await client().from('bdf_joueurs').select('pseudo,victoires,defaites').order('victoires',{ascending:false}).limit(10);
  $('joueurs').innerHTML=(data&&data.length?data:[]).map(j=>
    '<div><span>'+j.pseudo+'<small>'+(j.victoires||0)+' victoire(s) · '+(j.defaites||0)+' défaite(s)</small></span></div>'
  ).join('')||'<div><span>Personne encore<small>Sois le premier inscrit.</small></span></div>';
}
async function listerSalons(){
  const {data}=await client().from('bdf_salons').select('*').eq('statut','ouvert').order('cree_le',{ascending:false}).limit(12);
  const z=$('salons');
  if(!data||!data.length){z.innerHTML='<div><span>Aucune table ouverte<small>Ouvre la tienne, les autres la verront.</small></span></div>';return;}

async function ouvrirTable(){
  if(!pseudo)return;
  const code=codeAlea();codeTable=code;
  await client().from('bdf_salons').insert({code,hote:pseudo,hote_look:monLook,statut:'ouvert'});
  $('net-txt').textContent='Table '+code+' ouverte. En attente d’un adversaire…';
  brancher(code,true);listerSalons();
}
async function rejoindre(s){
  if(!pseudo){$('net-txt').textContent='Inscris-toi d’abord.';return;}
  codeTable=s.code;
  await client().from('bdf_salons').update({statut:'plein',invite:pseudo}).eq('code',s.code);
  brancher(s.code,false);
  $('net-txt').textContent='Connexion à la table de '+s.hote+'…';
}
function brancher(code,hote){
  const c=client();
  canal=c.channel('bdf-'+code,{config:{broadcast:{self:false}}});
  role=hote?'hote':'invite';
  canal.on('broadcast',{event:'salut'},({payload})=>{
    if(!hote)return;
    demarrer('enligne',payload.look,null);
    canal.send({type:'broadcast',event:'demarre',payload:{look:monLook,arene}});
  });
  canal.on('broadcast',{event:'demarre'},({payload})=>{
    if(hote)return;demarrer('enligne',payload.look,null,payload.arene,true);
  });
  canal.on('broadcast',{event:'entree'},({payload})=>{if(hote)distant=payload;});
  canal.on('broadcast',{event:'termine'},({payload})=>{
    if(hote||phase==='termine')return;
    J1.manches=payload.vic?MANCHES:J1.manches;
    J2.manches=payload.vic?J2.manches:MANCHES;
    finCombat(payload.vic);
  });
  canal.on('broadcast',{event:'etat'},({payload})=>{
    if(hote||!J1)return;
    Object.assign(J1,payload.a);Object.assign(J2,payload.b);
    temps=payload.temps;phase=payload.phase==='menu'?phase:payload.phase;
    msg=payload.msg;msgT=payload.msgT;arene=payload.arene;
  });
  canal.subscribe(st=>{
    if(st==='SUBSCRIBED'&&!hote)canal.send({type:'broadcast',event:'salut',payload:{look:monLook}});
    if(st==='CHANNEL_ERROR')$('net-txt').textContent='Connexion temps réel impossible.';
  });
}
async function majScore(vic){
  const c=client();
  const {data}=await c.from('bdf_joueurs').select('victoires,defaites').eq('pseudo',pseudo).single();
  if(!data)return;
  const p=role==='hote'?vic:!vic; // l'hôte voit J1 = lui
  await c.from('bdf_joueurs').update({victoires:(data.victoires||0)+(p?1:0),
    defaites:(data.defaites||0)+(p?0:1),vu_le:new Date().toISOString()}).eq('pseudo',pseudo);
  if(codeTable)await c.from('bdf_salons').delete().eq('code',codeTable);
}

  c.seq.map(s=>({sec:'Sec',lourd:'Lourd',aerien:'En l’air',super:'Rage'})[s]).join(' → ')+
  '</small></span><span class="v">'+(c.b>1?'×'+c.b:'—')+'</span></div>').join('');
$('menu-txt').textContent=monLook.nom+' · '+item('arme',monLook.arme).nom+
  '. Prochaine arène : '+ARENES[Math.min(niveau,ARENES.length-1)].nom+'.';
$('pseudo').value=monLook.nom!=='DOCKER'?monLook.nom:'';

document.addEventListener('click',e=>{
  const m=e.target.closest('[data-mode]');
  if(m){
    if(m.dataset.mode==='solo')lancerSolo();
    else demarrer('local',{nom:'JOUEUR 2',carrure:'massif',teint:4,cheveux:'crete',cheveuxC:8,
      barbe:'bouc',haut:'cloute',hautC:2,bas:'treillis',basC:1,ceinture:'sangle',pieds:'rangers',
      tete:'casquette',visage:'lunettes',boucle:'anneau',mains:'boxe',dos:'rien',arme:'poele',
      expression:'serre',yeux:2,tatouage:'etoiles'},null);
  }
  const p=e.target.closest('[data-pan]');
  if(p){document.querySelectorAll('.pan').forEach(x=>x.classList.remove('on'));
    $('p-'+p.dataset.pan).classList.add('on');
    $('cmd1').classList.remove('on');$('cmd2').classList.remove('on');
    if(p.dataset.pan==='net'){listerSalons();listerJoueurs();}}
});
if(location.hash==='#enligne'){
  document.querySelectorAll('.pan').forEach(x=>x.classList.remove('on'));
  $('p-net').classList.add('on');listerSalons();listerJoueurs();
}
</script>
</body>
</html>
