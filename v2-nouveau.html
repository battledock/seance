<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f9f6f0">
<title>Séance — ouvrir votre cinéma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:#fff;font-family:'Outfit',system-ui,sans-serif;color:#1a1410;
  -webkit-font-smoothing:antialiased}
body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.ecran{flex:1;display:flex;flex-direction:column;max-width:440px;width:100%;margin:0 auto;
  background:linear-gradient(180deg,#f9f6f0,#f1ece3)}

/* ── le chargement, blanc franc ── */
#chg{position:fixed;inset:0;background:#fff;z-index:200;display:flex;
  align-items:center;justify-content:center}
#chg .m{font-family:'Marcellus',Georgia,serif;font-size:18px;letter-spacing:.24em;
  text-indent:.24em;color:#3a3230}
#chg i{font-style:normal;opacity:0;animation:pt 1.4s infinite}
#chg i:nth-child(2){animation-delay:.22s}
#chg i:nth-child(3){animation-delay:.44s}
@keyframes pt{0%,66%,100%{opacity:0}22%,60%{opacity:1}}
#chg.sorti{opacity:0;pointer-events:none;transition:opacity .28s}

/* ── étape 1 : le nom et le quartier ── */
.tete{background:#fff;border-bottom:1px solid #ebe5db;padding:calc(18px + env(safe-area-inset-top)) 16px 16px;flex:none}
.kick{font-size:8.5px;letter-spacing:.22em;text-transform:uppercase;color:#b0a08a}
.tete h1{font-family:'Marcellus',serif;font-size:21px;margin-top:6px;line-height:1.16}
.tete p{font-size:11.5px;color:#8a8078;margin-top:7px;line-height:1.5}

.corps{flex:1;overflow-y:auto;padding:16px 14px 108px}
.corps::-webkit-scrollbar{display:none}

.champ{background:#fff;border:1.5px solid #ece5db;border-radius:14px;padding:13px 14px;
  margin-bottom:10px}
.champ label{display:block;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;
  color:#b0a08a;margin-bottom:7px}
.champ input{width:100%;border:none;outline:none;font-family:'Marcellus',serif;
  font-size:19px;color:#1a1410;background:none}
.champ input::placeholder{color:#d0c6b8}

.quartiers{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:4px}
.qt{background:#fff;border:1.5px solid #ece5db;border-radius:13px;padding:12px;
  cursor:pointer;text-align:left;font-family:inherit;transition:.15s}
.qt.sel{border-color:#8a1c2c;background:#fffaf9;box-shadow:0 2px 10px rgba(138,28,44,.08)}
.qt b{display:block;font-family:'Marcellus',serif;font-size:13.5px;color:#1a1410}
.qt span{display:block;font-size:10px;color:#8a8078;line-height:1.4;margin-top:4px}
.qt .parts{display:flex;gap:3px;margin-top:8px;height:5px;border-radius:3px;overflow:hidden}
.qt .parts i{display:block;height:100%}

/* ── étape 2 : le budget ── */
.budget{display:flex;align-items:center;gap:12px;margin-top:14px;
  background:#faf6ee;border:1px solid #eee4d2;border-radius:13px;padding:12px 13px}
.budget .g{flex:1}
.budget .lb{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:#b0a08a}
.budget .val{font-family:'Marcellus',serif;font-size:24px;line-height:1.1;margin-top:2px}
.budget .val.bas{color:#b04a2a}
.budget .jauge{height:7px;border-radius:5px;background:#ece2d2;margin-top:8px;overflow:hidden}
.budget .jauge i{display:block;height:100%;border-radius:5px;transition:width .28s;
  background:linear-gradient(90deg,#caa24a,#8a6c2a)}
.budget .cpt{text-align:right;flex:none}
.budget .cpt b{display:block;font-size:17px;color:#8a1c2c;font-weight:600}
.budget .cpt span{font-size:9px;color:#b0a08a;letter-spacing:.06em;text-transform:uppercase}

.poste{background:#fff;border:1.5px solid #ece5db;border-radius:14px;padding:13px;
  margin-bottom:9px;display:flex;gap:12px;align-items:flex-start;cursor:pointer;
  transition:.16s;width:100%;text-align:left;font-family:inherit}
.poste.pris{border-color:#8a1c2c;background:#fffaf9;box-shadow:0 2px 10px rgba(138,28,44,.09)}
.poste.trop{opacity:.42}
.poste .ic{width:42px;height:42px;border-radius:11px;flex:none;display:flex;
  align-items:center;justify-content:center;background:#f4efe4}
.poste.pris .ic{background:#8a1c2c}
.poste .ic svg{width:21px;height:21px;color:#8a6a2a}
.poste.pris .ic svg{color:#f0c96a}
.poste .txt{flex:1;min-width:0}
.poste .txt b{display:block;font-family:'Marcellus',serif;font-size:14px}
.poste .txt p{font-size:11px;color:#8a8078;line-height:1.45;margin-top:3px}
.poste .px{text-align:right;flex:none}
.poste .px b{display:block;font-size:14px;font-weight:600;white-space:nowrap}
.poste .coche{width:20px;height:20px;border-radius:50%;border:1.5px solid #ddd4c6;
  margin:7px 0 0 auto;display:flex;align-items:center;justify-content:center}
.poste.pris .coche{background:#8a1c2c;border-color:#8a1c2c}
.poste .coche svg{width:11px;height:11px;color:#fff;opacity:0}
.poste.pris .coche svg{opacity:1}

.pied{position:fixed;left:0;right:0;bottom:0;padding:13px 14px calc(15px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(249,246,240,0),#f6f2ea 26%);z-index:20;
  max-width:440px;margin:0 auto}
.pied button{width:100%;border:none;border-radius:14px;padding:16px;
  font-family:'Marcellus',serif;font-size:15px;letter-spacing:.1em;cursor:pointer;
  background:linear-gradient(180deg,#7a1a28,#5a1018);color:#ffeec4;
  box-shadow:0 4px 14px rgba(90,16,24,.26)}
.pied button:disabled{background:#e2dbd0;color:#a89a88;box-shadow:none}
.pied .hint{text-align:center;font-size:10px;color:#a89a88;margin-top:8px}

.erreur{background:#fbeae4;border:1px solid #eecabb;border-radius:12px;padding:12px 13px;
  font-size:12px;color:#a8442a;line-height:1.45;margin-bottom:10px}
.masque{display:none}
</style>
</head>
<body>

<div id="chg"><span class="m">Chargement<i>.</i><i>.</i><i>.</i></span></div>

<div class="ecran">
  <div class="tete">
    <div class="kick" id="kick">Vous reprenez le cinéma</div>
    <h1 id="titre">Comment s'appelle<br>votre cinéma ?</h1>
    <p id="sous">Choisissez aussi le quartier : sa population décide de qui
      poussera la porte.</p>
  </div>

  <div class="corps">
    <div id="erreur" class="erreur masque"></div>

    <!-- ── étape 1 ── -->
    <section id="etape1">
      <div class="champ">
        <label>Le nom</label>
        <input id="nom" type="text" maxlength="26" placeholder="Le Rex" autocomplete="off">
      </div>
      <div class="quartiers" id="quartiers"></div>
    </section>

    <!-- ── étape 2 ── -->
    <section id="etape2" class="masque">
      <div class="budget">
        <div class="g">
          <div class="lb">Il vous reste</div>
          <div class="val" id="reste">15 000 €</div>
          <div class="jauge"><i id="jauge" style="width:0%"></i></div>
        </div>
        <div class="cpt"><b id="nbPris">0</b><span>postes</span></div>
      </div>
      <div id="postes" style="margin-top:14px"></div>
    </section>
  </div>

  <div class="pied">
    <button id="valider">Continuer</button>
    <div class="hint" id="hint">Vous pourrez tout changer ensuite, sauf le quartier</div>
  </div>
</div>

<script type="module">
import { creerCinema, chargePostesInstallation, monCinema, messageErreurV2 }
  from "./js/v2/api.js?v=becf21cb";

/* ============================================================
   LE PREMIER JOUR

   Deux étapes : le nom et le quartier, puis la répartition des
   quinze mille euros. Aucun poste n'est obligatoire — c'est le
   renoncement qui fait la décision.
   ============================================================ */

const QUARTIERS = [
  {c:'quartier_populaire', n:'Quartier populaire',
   d:"Familles et jeunes, très sensibles au prix. Il faudra remplir plutôt que facturer.",
   parts:[['#8a1c2c',34],['#caa24a',22],['#6a8a7a',18],['#c07a4a',26]]},
  {c:'quartier_etudiant', n:'Quartier étudiant',
   d:"Presque la moitié d'étudiants. Séances tardives, tarifs cassés, gros volume.",
   parts:[['#8a1c2c',26],['#caa24a',48],['#6a8a7a',10],['#c07a4a',16]]},
  {c:'quartier_bourgeois', n:'Quartier bourgeois',
   d:"On y paie sans broncher. Peu de monde, mais un tarif plein assumé.",
   parts:[['#8a1c2c',52],['#caa24a',14],['#6a8a7a',24],['#c07a4a',10]]},
  {c:'quartier_familial', n:'Quartier familial',
   d:"Beaucoup d'enfants. Les mercredis et les vacances feront vos meilleures journées.",
   parts:[['#8a1c2c',38],['#caa24a',12],['#6a8a7a',16],['#c07a4a',34]]}
];

const ICONES = {
  fauteuils:'<path d="M4 18v-6a2 2 0 012-2h12a2 2 0 012 2v6M4 18h16M6 10V7a2 2 0 012-2h8a2 2 0 012 2v3M7 18v3M17 18v3"/>',
  projecteur:'<rect x="2" y="8" width="13" height="10" rx="2"/><path d="M15 12l7-4v12l-7-4"/><circle cx="7" cy="13" r="2"/>',
  son:'<path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 010 7M19 5a9 9 0 010 14"/>',
  hall:'<path d="M3 21h18M5 21V8l7-4 7 4v13"/><path d="M9 21v-6h6v6"/>',
  comptoir:'<path d="M4 10h16l-1 11H5L4 10z"/><path d="M8 10V7a4 4 0 018 0v3"/><path d="M9 14h6"/>',
  stock:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M3 11h18M8 7V4h8v3"/>',
  enseigne:'<rect x="3" y="6" width="18" height="9" rx="1.5"/><path d="M7 20v-5M17 20v-5M12 3v3"/>',
  equipe:'<circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0112 0M16 6a3 3 0 010 6M18 20a6 6 0 00-3-5"/>'
};

const BUDGET = 15000;
let etape = 1, quartier = null, postes = [], pris = new Set();
const $ = id => document.getElementById(id);
const eur = n => Math.round(n).toLocaleString('fr') + ' €';

function erreur(txt){
  const e = $('erreur');
  if(!txt){ e.classList.add('masque'); return; }
  e.textContent = txt; e.classList.remove('masque');
  e.scrollIntoView({block:'nearest', behavior:'smooth'});
}

/* ---------- étape 1 ---------- */
function rendQuartiers(){
  $('quartiers').innerHTML = QUARTIERS.map(q => `
    <button class="qt ${quartier === q.c ? 'sel' : ''}" data-q="${q.c}">
      <b>${q.n}</b><span>${q.d}</span>
      <span class="parts">${q.parts.map(p =>
        `<i style="background:${p[0]};width:${p[1]}%"></i>`).join('')}</span>
    </button>`).join('');
  $('quartiers').querySelectorAll('.qt').forEach(b =>
    b.onclick = () => { quartier = b.dataset.q; rendQuartiers(); majBouton(); });
}

/* ---------- étape 2 ---------- */
function rendPostes(){
  const total = [...pris].reduce((t,c) => t + Number(postes.find(p => p.cle === c).cout), 0);
  const reste = BUDGET - total;
  $('reste').textContent = eur(reste);
  $('reste').className = 'val' + (reste < 1200 ? ' bas' : '');
  $('jauge').style.width = (total / BUDGET * 100) + '%';
  $('nbPris').textContent = pris.size;

  $('postes').innerHTML = postes.map(p => {
    const sel = pris.has(p.cle), trop = !sel && Number(p.cout) > reste;
    return `<button class="poste ${sel ? 'pris' : ''} ${trop ? 'trop' : ''}"
              data-p="${p.cle}" ${trop ? 'disabled' : ''}>
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${ICONES[p.cle] || ''}</svg></span>
      <span class="txt"><b>${p.nom}</b><p>${p.detail}</p></span>
      <span class="px"><b>${eur(p.cout)}</b>
        <span class="coche"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="3.2" stroke-linecap="round"><path d="M4 12l6 6L20 6"/></svg></span></span>
    </button>`;
  }).join('');

  $('postes').querySelectorAll('.poste').forEach(b =>
    b.onclick = () => {
      const c = b.dataset.p;
      if(pris.has(c)) pris.delete(c); else pris.add(c);
      rendPostes();
    });
}

function majBouton(){
  const b = $('valider');
  if(etape === 1){
    b.disabled = !($('nom').value.trim() && quartier);
    b.textContent = 'Continuer';
  }else{
    b.disabled = false;
    b.textContent = 'Ouvrir le cinéma';
  }
}

async function versEtape2(){
  etape = 2;
  $('kick').textContent = 'Le budget d\u2019installation';
  $('titre').innerHTML = 'Que faites-vous<br>de vos quinze mille euros ?';
  $('sous').textContent = "Vingt-deux mille de dépenses possibles. Vous ne pouvez pas "
    + "tout prendre : ce que vous gardez devient votre trésorerie.";
  $('etape1').classList.add('masque');
  $('etape2').classList.remove('masque');
  $('hint').textContent = 'Aucun poste n\u2019est obligatoire';
  document.querySelector('.corps').scrollTop = 0;
  majBouton();
}

async function ouvrir(){
  const b = $('valider');
  b.disabled = true; b.textContent = 'Un instant…';
  erreur(null);
  const r = await creerCinema($('nom').value.trim(), quartier, [...pris]);
  if(r.erreur){
    erreur(messageErreurV2(r));
    b.disabled = false; b.textContent = 'Ouvrir le cinéma';
    return;
  }
  location.replace('v2.html');
}

/* ---------- démarrage ---------- */
(async function(){
  try{
    /* un joueur qui a déjà un cinéma n'a rien à faire ici */
    const c = await monCinema();
    if(c){ location.replace('v2.html'); return; }

    postes = await chargePostesInstallation();
    rendQuartiers();
    rendPostes();
    $('nom').addEventListener('input', majBouton);
    $('valider').addEventListener('click', () => {
      if(etape === 1) versEtape2(); else ouvrir();
    });
    majBouton();
  }catch(e){
    console.error('[Séance v2] création', e);
    erreur("Impossible de joindre le serveur. Réessayez dans un instant.");
  }finally{
    /* on retire le voile du document plutôt que de le rendre
       transparent : un calque fixe invisible continue d'exister,
       et finit toujours par intercepter un geste. */
    const v = $('chg');
    v.classList.add('sorti');
    setTimeout(() => v.remove(), 300);
    document.body.classList.add('pret');
  }
})();
</script>
</body>
</html>
