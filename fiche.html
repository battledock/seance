<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#f5a53a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Ta fiche — Battle Dock</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="chaud.css?v=2">
<style>
.perso{display:flex;align-items:center;gap:15px;padding:16px;margin-bottom:14px;
  border-radius:18px;background:var(--creme);border:3px solid var(--encre);
  }
.perso .av{flex:0 0 66px;height:66px;border-radius:16px;overflow:hidden;
  background:var(--creme2);border:2.5px solid var(--encre)}
.perso .av svg{width:100%;height:100%;display:block}
.perso .co b{display:block;font-family:'DM Serif Display',Georgia,serif;font-size:24px}
.perso .co .t{display:block;font-size:12.5px;font-weight:800;color:var(--or);
  margin-top:3px}
.perso .co .ou{display:block;font-size:11.5px;font-weight:600;
  color:rgba(18,48,63,.52);margin-top:4px}
.niv{padding:15px 16px;margin-bottom:14px;border-radius:16px;
  background:var(--creme);border:3px solid var(--encre);}
.niv .tt{display:flex;justify-content:space-between;align-items:baseline;
  margin-bottom:9px}
.niv .tt span{font-size:10px;font-weight:800;letter-spacing:.14em;
  text-transform:uppercase;color:rgba(18,48,63,.5)}
.niv .tt b{font-family:'DM Serif Display',Georgia,serif;font-size:20px}
.niv .ba{height:12px;border-radius:8px;background:rgba(18,48,63,.1);
  border:2px solid var(--encre);overflow:hidden}
.niv .ba i{display:block;height:100%;background:var(--or)}
.pts{display:flex;align-items:center;gap:14px;padding:15px 16px;margin-bottom:16px;
  border-radius:16px;background:var(--or);border:3px solid var(--encre);
  }
.pts b{font-family:'DM Serif Display',Georgia,serif;font-size:34px;line-height:1}
.pts span{flex:1;font-size:12.5px;font-weight:700;color:rgba(18,48,63,.8);
  line-height:1.45}
.cmp{display:flex;align-items:center;gap:12px;padding:14px 16px;
  border-bottom:2px solid rgba(18,48,63,.1)}
.cmp:last-child{border-bottom:0}
.cmp .nm{flex:0 0 92px;font-size:14px;font-weight:800}
.cmp .ba{flex:1;display:flex;gap:4px}
.cmp .ba i{flex:1;height:14px;border-radius:4px;background:rgba(18,48,63,.1);
  border:2px solid rgba(18,48,63,.16)}
.cmp .ba i.on{background:var(--c);border-color:var(--encre)}
.cmp .vl{flex:0 0 18px;text-align:right;
  font-family:'DM Serif Display',Georgia,serif;font-size:18px}
.cmp .plus{flex:0 0 auto;width:32px;height:32px;border-radius:11px;cursor:pointer;
  background:var(--or);border:2.5px solid var(--encre);
  
  font-family:'DM Serif Display',Georgia,serif;font-size:19px;color:var(--encre);
  line-height:1;padding:0}
.cmp .plus:active{box-shadow:none}
.cmp .plus:disabled{opacity:.35;box-shadow:none;transform:none}
.cmp .rien{flex:0 0 32px}
</style>
</head>
<body>

<div class="pont">
  <div class="tete">
    <span class="q"><b>Ta fiche</b><span id="f-sous">—</span></span>
    <button class="retour" id="retour">‹ Retour</button>
  </div>
  <div id="corps" class="attend"></div>
  <p class="pied">Battle Dock — Marseille</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="bd.js?v=3"></script>
<script>
/* le contenu paraît d'un trait, une fois complet */
function paraitre(){
  const e = document.getElementById('corps');
  if (e){ e.classList.remove('attend'); e.classList.add('venu'); }
}

const CMP = [
  ['force',      'Force',       '#e08a6a'],
  ['endurance',  'Endurance',   '#8ce0a8'],
  ['precision_', 'Précision',   '#f0c46a'],
  ['discussion', 'Discussion',  '#8ab8e0'],
  ['negociation','Négociation', '#c9a8e0'],
  ['sang_froid', 'Sang-froid',  '#7fc4d4'],
  ['instinct',   'Instinct',    '#d4a8c0'],
  ['chance',     'Chance',      '#f0d078']
];
const PORTS = { anse:'Marseille', marseille:'Marseille', barcelone:'Barcelone',
                palma:'Palma', ajaccio:'Ajaccio' };

let D = null, occupe = false;

function dessiner(){
  const d = D;
  const V = Object.assign({}, d.competences || {},
    { sang_froid: d.sang_froid, instinct: d.instinct, chance: d.chance });
  const reste = Number(d.points || 0);
  const xp = Number(d.xp || 0), seuil = Number(d.seuil_xp || 100);

  document.getElementById('f-sous').textContent =
    'Niveau ' + (d.niveau || 1) + (d.titre ? ' · ' + d.titre : '');

  let h = '<div class="perso"><span class="av">' + BD.avatarSVG(d) + '</span>'
    + '<span class="co"><b>' + (d.pseudo || '') + '</b>'
    + (d.titre ? '<span class="t">' + d.titre + '</span>' : '')
    + '<span class="ou">' + (d.parti_le ? 'En mer' : (PORTS[d.port] || ''))
    +   ' · réputation ' + (d.reputation || 0) + '</span></span></div>';

  h += '<div class="niv"><div class="tt"><span>Vers le niveau '
    + ((d.niveau || 1) + 1) + '</span><b>' + xp + ' / ' + seuil + '</b></div>'
    + '<div class="ba"><i style="width:'
    + Math.min(100, xp / seuil * 100).toFixed(0) + '%"></i></div></div>';

  if (reste > 0)
    h += '<div class="pts"><b>' + reste + '</b><span>'
      + (reste > 1 ? 'points à placer' : 'point à placer')
      + ' — touche le plus, à côté de ce que tu veux améliorer.</span></div>';

  h += '<p class="sec">Ce que tu sais faire</p><div class="bloc">'
    + CMP.map(([k, n, c]) => {
      const v = Math.max(0, Math.min(8, Number(V[k] ?? 0)));
      return '<div class="cmp"><span class="nm">' + n + '</span>'
        + '<span class="ba" style="--c:' + c + '">'
        + Array.from({length:8}, (_, i) =>
            '<i class="' + (i < v ? 'on' : '') + '"></i>').join('')
        + '</span><span class="vl">' + v + '</span>'
        + (reste > 0 && v < 8
            ? '<button class="plus" data-k="' + k + '">+</button>'
            : '<span class="rien"></span>')
        + '</div>';
    }).join('') + '</div>';

  document.getElementById('corps').innerHTML = h; paraitre();

  document.querySelectorAll('.plus').forEach(b =>
    b.onclick = async () => {
      if (occupe) return;
      occupe = true;
      document.querySelectorAll('.plus').forEach(x => x.disabled = true);
      try {
        const r = await BD.agir('placer_point', { p_quoi: b.dataset.k });
        if (r && r.ok) Object.assign(D, await BD.charger());
      } catch(e){}
      occupe = false;
      dessiner();
    });
}

(async () => {
  try {
    D = await BD.charger();
    if (!D){ location.href = 'index.html'; return; }
    dessiner();
  } catch(e){
    console.warn(e);
    document.getElementById('corps').innerHTML =
      '<p class="vide">Le livret n\'a pas répondu.</p>';
  }
})();
document.getElementById('retour').onclick = () => location.href = 'hub.html?v=3';
</script>
</body>
</html>
