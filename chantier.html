<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#f5a53a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Le chantier — Battle Dock</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="couleurs.css?v=2">
<link rel="stylesheet" href="chaud.css?v=3">
<style>
.tous{display:flex;gap:15px;padding:16px;margin-bottom:14px;border-radius:18px;
  background:var(--creme);border:3px solid var(--encre);}
.tous .por{flex:0 0 62px;height:62px;border-radius:16px;overflow:hidden;
  background:var(--creme2);border:2.5px solid var(--encre)}
.tous .por svg{width:100%;height:100%;display:block}
.tous .co b{display:block;font-family:'DM Serif Display',Georgia,serif;font-size:23px}
.tous .co span{display:block;font-size:11px;font-weight:800;letter-spacing:.13em;
  text-transform:uppercase;color:rgba(18,48,63,.5);margin-top:5px}
.dit{padding:16px 18px;margin-bottom:18px;border-radius:16px;
  background:var(--creme2);border:3px solid var(--encre);
  font-size:15px;font-weight:700;font-style:italic;line-height:1.55}
.moi2{padding:16px 17px;margin-bottom:18px;border-radius:18px;
  background:var(--creme);border:3px solid var(--encre);}
.moi2 .tt{font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;
  color:rgba(18,48,63,.5);margin-bottom:8px}
.moi2 b{display:block;font-family:'DM Serif Display',Georgia,serif;font-size:23px;
  margin-bottom:5px}
.moi2 .d{font-size:13px;font-weight:600;color:rgba(18,48,63,.6);line-height:1.5;
  margin-bottom:15px}
.trois{display:flex;gap:9px}
.trois > div{flex:1;text-align:center;padding:11px 6px;border-radius:12px;
  background:rgba(18,48,63,.06);border:2px solid rgba(18,48,63,.16)}
.trois .k{font-size:9.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
  color:rgba(18,48,63,.48)}
.trois .v{font-family:'DM Serif Display',Georgia,serif;font-size:22px;margin-top:5px}
.trois .v em{font-style:normal;font-size:12px;color:var(--vert);margin-left:3px;
  font-family:'Nunito',sans-serif;font-weight:800}
.suite{padding:17px;border-radius:18px;margin-bottom:16px;
  background:#fff8e4;border:3px solid var(--encre);}
.suite .l1{display:flex;align-items:baseline;gap:12px;margin-bottom:6px}
.suite .l1 b{flex:1;font-family:'DM Serif Display',Georgia,serif;font-size:22px}
.suite .px{font-family:'DM Serif Display',Georgia,serif;font-size:21px;
  white-space:nowrap}
.suite .px.non{color:rgba(18,48,63,.4)}
.suite .px.gratuit{color:var(--vert)}
.suite .d{font-size:13px;font-weight:600;color:rgba(18,48,63,.6);line-height:1.5;
  margin-bottom:15px}
.suite .man{text-align:center;font-size:12.5px;font-weight:800;color:var(--rouge);
  margin-top:11px}
.chemin{border-radius:18px;overflow:hidden;background:var(--creme);
  border:3px solid var(--encre);}
.pal{display:flex;align-items:center;gap:13px;padding:13px 15px;
  border-bottom:2px solid rgba(18,48,63,.09)}
.pal:last-child{border-bottom:0}
.pal .n{flex:0 0 28px;height:28px;border-radius:9px;display:flex;
  align-items:center;justify-content:center;font-size:12px;font-weight:800;
  background:rgba(18,48,63,.08);border:2px solid rgba(18,48,63,.18)}
.pal.fait{background:#eaf6ee}
.pal.fait .n{background:var(--vert);color:#fff;border-color:var(--encre)}
.pal .co{flex:1;min-width:0}
.pal .co b{display:block;font-size:14px;font-weight:800}
.pal .co span{display:block;font-size:11px;font-weight:600;
  color:rgba(18,48,63,.46);margin-top:2px}
.pal .px{font-size:12px;font-weight:800;color:rgba(18,48,63,.5);white-space:nowrap}
.pal.fait .px{color:var(--vert)}

/* ---------- ce qu'il faut apporter ----------
   Un bateau ne se bâtit pas qu'avec de l'argent. Le bois vient
   d'Ajaccio, le fer de Barcelone : il faut aller les chercher. */
.mat{margin:0 0 15px;padding:13px 14px;border-radius:14px;
  background:rgba(18,48,63,.05);border:2.5px solid rgba(18,48,63,.16)}
.mat .tt2{font-size:9px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;
  color:rgba(18,48,63,.46);margin-bottom:10px}
.mat .li{display:flex;align-items:center;gap:11px;padding:7px 0}
.mat .li + .li{border-top:2px solid rgba(18,48,63,.08)}
.mat .li .co{flex:1;min-width:0}
.mat .li .co b{display:block;font-family:'DM Serif Display',Georgia,serif;
  font-size:15px;line-height:1.15}
.mat .li .co span{display:block;font-size:10.5px;font-weight:700;
  color:rgba(18,48,63,.5);margin-top:2px}
.mat .li .cb{flex:0 0 auto;padding:4px 10px;border-radius:20px;
  font-family:'DM Serif Display',Georgia,serif;font-size:14px;
  background:rgba(18,48,63,.08);border:2px solid rgba(18,48,63,.2)}
/* tu l'as : le compte est bon */
.mat .li.assez .cb{background:var(--vert);border-color:var(--encre);color:#fff}
/* il t'en manque : on dit où le trouver */
.mat .li.court .cb{background:rgba(224,83,60,.16);border-color:var(--rouge);
  color:#a8351f}
.mat .li.court .co span{color:#a8351f}

/* ---------- Toussaint est dessus ----------
   Les travaux prennent du temps, et il travaille pendant que tu
   navigues. Rien ne t'oblige à rester le regarder. */
.trav{padding:18px 19px;border-radius:18px;margin-bottom:15px;
  background:var(--creme);border:3px solid var(--encre)}
.trav .tt2{font-size:9.5px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;
  color:rgba(18,48,63,.46)}
.trav b{display:block;font-family:'DM Serif Display',Georgia,serif;font-size:23px;
  line-height:1.1;margin-top:6px}
.trav .ba{height:12px;border-radius:8px;margin-top:14px;overflow:hidden;
  background:rgba(18,48,63,.1);border:2px solid var(--encre)}
.trav .ba i{display:block;height:100%;background:var(--or);transition:width 1s linear}
.trav .rs{font-size:12.5px;font-weight:700;color:rgba(18,48,63,.6);margin-top:10px}
.trav .rs em{font-style:normal;font-family:'DM Serif Display',Georgia,serif;
  font-size:16px;color:var(--encre)}
.trav .part{font-size:11.5px;font-weight:600;color:rgba(18,48,63,.5);
  margin-top:9px;line-height:1.5}
/* il vient de finir */
.fini{padding:18px 19px;border-radius:18px;margin-bottom:15px;
  background:rgba(47,138,92,.12);border:3px solid var(--vert)}
.fini .tt2{font-size:9.5px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;
  color:rgba(31,107,69,.7)}
.fini b{display:block;font-family:'DM Serif Display',Georgia,serif;font-size:23px;
  line-height:1.1;margin-top:6px;color:#1f6b45}
/* le temps que ça prendra, annoncé d'avance */
.combien{font-size:11.5px;font-weight:700;color:rgba(18,48,63,.5);
  margin:-6px 0 14px;text-align:center}
</style>
</head>
<body>

<div class="pont">
  <div class="tete">
    <span class="q"><b>Le chantier</b><span id="c-sous">—</span></span>
    <button class="retour" id="retour">‹ Retour</button>
  </div>
  <div id="corps" class="attend"></div>
  <p class="pied">Battle Dock — Marseille</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="bd.js?v=5"></script>
<script src="son.js?v=2"></script>
<script>
/* le contenu paraît d'un trait, une fois complet */
function paraitre(){
  const e = document.getElementById('corps');
  if (e){ e.classList.remove('attend'); e.classList.add('venu'); }
}

const PALIERS_B = [
  { n:1,  nom:"La coque nue",        prix:0,      places:1, kg:40,  vit:1.0,
    d:"Trois bordages et rien d'autre. Elle flotte, c'est déjà ça." },
  { n:2,  nom:"Le calfatage",        prix:900,    places:1, kg:45,  vit:1.0,
    d:"Étoupe et goudron dans les coutures. Elle ne prend plus l'eau." },
  { n:3,  nom:"Le banc de nage",     prix:1400,   places:1, kg:50,  vit:1.1,
    d:"On peut ramer assis. Ça change tout." },
  { n:4,  nom:"Les avirons",         prix:2200,   places:2, kg:60,  vit:1.3,
    d:"Deux avirons de frêne et leurs tolets." },
  { n:5,  nom:"Le plat-bord",        prix:3400,   places:2, kg:70,  vit:1.3,
    d:"Un liston tout autour. La coque ne travaille plus." },
  { n:6,  nom:"Le pontage avant",    prix:5000,   places:3, kg:85,  vit:1.4,
    d:"Un demi-pont à l'avant. Les caisses restent au sec." },
  { n:7,  nom:"Le mât de fortune",   prix:7200,   places:3, kg:95,  vit:1.7,
    d:"Une perche et un bout de toile. Ça tire quand le vent veut bien." },
  { n:8,  nom:"La voile latine",     prix:10000,  places:4, kg:110, vit:2.2,
    d:"Antenne et voile triangulaire. La vraie voile d'ici." },
  { n:9,  nom:"Le safran",           prix:13500,  places:4, kg:120, vit:2.3,
    d:"Un gouvernail et sa barre. Tu choisis où tu vas." },
  { n:10, nom:"La quille lestée",    prix:18000,  places:5, kg:140, vit:2.5,
    d:"Du plomb sous la quille. Elle ne se couche plus." },
  { n:11, nom:"Le tillac",           prix:23000,  places:6, kg:170, vit:2.6,
    d:"Un pont continu. On marche dessus sans regarder ses pieds." },
  { n:12, nom:"La cale fermée",      prix:29000,  places:8, kg:220, vit:2.6,
    d:"Un panneau, une cale étanche. Le double de marchandise." },
  { n:13, nom:"Le foc",              prix:36000,  places:8, kg:240, vit:3.1,
    d:"Un beaupré et un foc. Elle remonte enfin au vent." },
  { n:14, nom:"Le rouf",             prix:44000,  places:9, kg:270, vit:3.1,
    d:"Un abri sur le pont. On peut dormir à bord." },
  { n:15, nom:"Le second mât",       prix:54000,  places:10, kg:310, vit:3.6,
    d:"Un tapecul à l'arrière. Deux voiles valent mieux qu'une." },
  { n:16, nom:"Le bordé doublé",     prix:66000,  places:12, kg:380, vit:3.6,
    d:"Une seconde peau de bois. Elle encaisse le mauvais temps." },
  { n:17, nom:"Le treuil",           prix:80000,  places:14, kg:450, vit:3.7,
    d:"Un cabestan pour hisser seul. Plus besoin d'être trois." },
  { n:18, nom:"La chaloupe",         prix:96000,  places:15, kg:500, vit:3.7,
    d:"Une annexe sur le pont. On accoste où il n'y a pas de quai." },
  { n:19, nom:"Le pavillon",         prix:115000, places:16, kg:560, vit:3.8,
    d:"Tes couleurs en tête de mât. On te reconnaît de loin." },
  { n:20, nom:"Le grand caboteur",   prix:140000, places:20, kg:700, vit:4.2,
    d:"Coque doublée, trois voiles, un nom peint sur l'étrave. Ce n'est plus une barque." }
];

function toussaint(){
  const P = [];
  const r = (x, y, w, h, c) => P.push([x, y, w, h, c]);

  const FOND = '#c9b89a', FOND2 = '#b6a486';
  const PEAU = '#d8a06a', PEAU_O = '#bb8350', PEAU_C = '#e8b57c';
  const POIL = '#eae4d6', POIL_O = '#c8c1b2';
  const GRIS = '#b8b1a4';
  const CAP = '#33404f', CAP_C = '#48576a', CAP_V = '#222c38';
  const TOILE = '#5f6c52', TOILE_C = '#718061', TOILE_O = '#4c5742';
  const CUIR = '#7d5636', CUIR_C = '#996b42';
  const OEIL = '#3a2a1c';

  /* --- le fond --- */
  r(0, 0, 16, 18, FOND);
  r(0, 13, 16, 5, FOND2);

  /* --- le buste : des épaules larges et tombantes --- */
  r(1, 15, 14, 3, TOILE);
  r(2, 14, 12, 1, TOILE);
  r(3, 13, 10, 1, TOILE);
  r(1, 15, 5, 3, TOILE_C);             /* le jour vient de la gauche */
  r(2, 14, 4, 1, TOILE_C);
  r(11, 15, 4, 3, TOILE_O);            /* et l'ombre à droite */
  /* le col ouvert sur la peau */
  r(7, 13, 3, 2, PEAU_O);
  r(6, 14, 1, 1, TOILE_C);
  r(10, 14, 1, 1, TOILE_O);
  /* le tablier de cuir, étroit, avec ses bretelles */
  r(6, 16, 5, 2, CUIR);
  r(6, 16, 2, 2, CUIR_C);
  r(6, 15, 1, 1, CUIR);
  r(10, 15, 1, 1, CUIR);

  /* --- le cou --- */
  r(7, 12, 3, 2, PEAU_O);
  r(7, 12, 1, 2, PEAU);

  /* --- le visage, large et carré --- */
  r(4, 5, 9, 8, PEAU);
  r(9, 5, 4, 8, PEAU_O);
  r(5, 6, 3, 2, PEAU_C);               /* le front au jour */

  /* les oreilles */
  r(3, 8, 1, 2, PEAU_O);
  r(13, 8, 1, 2, PEAU_O);

  /* les sourcils, blancs et broussailleux */
  r(5, 7, 3, 1, POIL);
  r(9, 7, 3, 1, POIL_O);

  /* les yeux */
  r(5, 8, 3, 1, '#f2ebe0');
  r(9, 8, 3, 1, '#e2dacc');
  r(6, 8, 1, 1, OEIL);
  r(10, 8, 1, 1, OEIL);
  /* les cernes du dessous */
  r(5, 9, 3, 1, PEAU_O);
  r(9, 9, 3, 1, PEAU_O);

  /* le nez */
  r(8, 9, 1, 2, PEAU_C);
  r(8, 10, 1, 1, PEAU_O);

  /* la moustache, deux brins tombants */
  r(5, 11, 3, 1, POIL);
  r(9, 11, 3, 1, POIL_O);
  r(5, 12, 1, 1, POIL_O);
  r(11, 12, 1, 1, POIL_O);
  /* la bouche entre les deux */
  r(8, 11, 1, 1, '#9a5c44');

  /* la barbe, courte, sur le menton */
  r(6, 12, 5, 1, POIL);
  r(9, 12, 2, 1, POIL_O);

  /* les cheveux gris qui dépassent */
  r(3, 6, 1, 3, GRIS);
  r(13, 6, 1, 3, GRIS);

  /* --- la casquette de marin : plate et large --- */
  r(4, 3, 9, 2, CAP);                  /* la calotte, basse */
  r(4, 3, 4, 2, CAP_C);
  r(5, 2, 7, 1, CAP);
  r(5, 2, 3, 1, CAP_C);
  r(3, 4, 1, 1, CAP);
  r(13, 4, 1, 1, CAP);
  /* le bandeau */
  r(3, 5, 11, 1, CAP_V);
  r(3, 5, 4, 1, '#3a4757');
  /* la visière, large, qui ombre le front */
  r(2, 6, 13, 1, CAP_V);
  r(2, 6, 5, 1, '#3a4757');

  let s = '<svg viewBox="0 0 16 18" xmlns="http://www.w3.org/2000/svg" '
    + 'shape-rendering="crispEdges">';
  P.forEach(([x, y, w, h, c]) =>
    s += '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h
      + '" fill="' + c + '"/>');
  return s + '</svg>';
}

function eur(v){ return Number(v || 0).toLocaleString('fr-FR') + ' €'; }

let D = null, enTravaux = false;

/* ce que le chantier réclame, et ce que tu as déjà déposé */
let CH = null;
const OU_MAT = { ajaccio:'Ajaccio', barcelone:'Barcelone',
                 anse:'Marseille', palma:'Palma' };

function bloqueMateriaux(){
  if (!CH || !CH.ok || CH.au_bout || !(CH.faut || []).length) return '';
  return '<div class="mat"><p class="tt2">Ce qu\'il faut apporter</p>'
    + CH.faut.map(m => {
        const ok = m.as >= m.faut;
        return '<div class="li ' + (ok ? 'assez' : 'court') + '">'
          + '<span class="co"><b>' + (m.nom || m.k) + '</b>'
          + '<span>' + (ok ? 'Déposé au chantier'
              : 'Rapporte-en de ' + (OU_MAT[m.ou] || m.ou)) + '</span></span>'
          + '<span class="cb">' + m.as + ' / ' + m.faut + '</span></div>';
      }).join('')
    + '</div>';
}

/* le temps qu'il reste, dit comme on le dirait */
function duree(s){
  if (s <= 0) return "c'est prêt";
  const m = Math.floor(s / 60), r = s % 60;
  if (m >= 1) return m + ' min' + (r ? ' ' + String(r).padStart(2,'0') : '');
  return s + ' secondes';
}

/* le décompte, tant que Toussaint est dessus */
let bat = null;
function minuter(total){
  clearInterval(bat);
  bat = setInterval(async () => {
    if (!CH || !CH.en_travaux){ clearInterval(bat); return; }
    CH.reste_s = Math.max(0, (CH.reste_s || 0) - 1);
    const r = document.getElementById('tv-rs'), b = document.getElementById('tv-ba');
    if (!r){ clearInterval(bat); return; }
    r.textContent = duree(CH.reste_s);
    if (b) b.style.width = Math.min(100, (1 - CH.reste_s / total) * 100).toFixed(1) + '%';
    if (CH.reste_s <= 0){
      clearInterval(bat);
      try { CH = await BD.agir('mon_chantier'); } catch(e){}
      try { Object.assign(D, await BD.charger()); } catch(e){}
      dessiner();
    }
  }, 1000);
}

function dessiner(){
  const d = D;
  const n = Number(d.barque || 0);
  const sous = Number(d.euros || 0);
  const C = document.getElementById('corps');

  /* Toussaint ne travaille que chez toi */
  const chezToi = !d.port || d.port === 'anse' || d.port === 'marseille';

  let h = '<div class="tous"><span class="por">' + toussaint() + '</span>'
    + '<span class="co"><b>Toussaint</b><span>Charpentier de marine</span></span></div>';

  if (!chezToi){
    h += '<p class="dit">« Je ne travaille pas ici. Mon chantier est chez toi, '
      + 'à Marseille, et nulle part ailleurs. »</p>'
      + '<p class="rien">Reviens à Marseille pour toucher à ta barque.</p>';
    C.innerHTML = h; paraitre();
    document.getElementById('c-sous').textContent = 'Fermé — il est à Marseille';
    return;
  }

  /* ta barque telle qu'elle est */
  const A = n ? PALIERS_B[n - 1] : null;
  if (A){
    h += '<div class="moi2"><p class="tt">Ta barque</p>'
      + '<b>' + A.nom + '</b><p class="d">' + A.d + '</p>'
      + '<div class="trois">'
      +   '<div><p class="k">Cale</p><p class="v">' + A.places + '</p></div>'
      +   '<div><p class="k">Charge</p><p class="v">' + A.kg + '</p></div>'
      +   '<div><p class="k">Allure</p><p class="v">' + A.vit.toFixed(1) + '</p></div>'
      + '</div></div>';
  }

  /* ---------- Toussaint vient de poser ses outils ---------- */
  if (CH && CH.fini_a_l_instant && CH.fini_a_l_instant.fini){
    h += '<div class="fini"><p class="tt2">C\'est fait</p>'
      + '<b>' + CH.fini_a_l_instant.nom + '</b></div>';
  }

  /* ---------- Toussaint est encore dessus ---------- */
  if (CH && CH.en_travaux){
    const total = 120 + CH.palier * 60;
    const reste = Math.max(0, CH.reste_s || 0);
    const fait = Math.min(100, (1 - reste / total) * 100);
    h += '<div class="trav"><p class="tt2">Sur le chantier</p>'
      + '<b>' + CH.nom + '</b>'
      + '<div class="ba"><i id="tv-ba" style="width:' + fait.toFixed(1) + '%"></i></div>'
      + '<p class="rs">Prêt dans <em id="tv-rs">' + duree(reste) + '</em></p>'
      + '<p class="part">Il travaille même quand tu n\'es pas là. '
      + 'Tu peux reprendre la mer.</p></div>';
    C.innerHTML = h; paraitre();
    document.getElementById('c-sous').textContent = 'Travaux en cours';
    minuter(total);
    return;
  }

  /* le bout du chemin */
  if (n >= PALIERS_B.length){
    h += '<p class="dit">« Je ne peux plus rien faire pour toi. '
      + 'Tu as le plus beau bateau du bassin. »</p>'
      + '<p class="rien">Le chantier est fermé.<br>Va naviguer.</p>';
    C.innerHTML = h; paraitre();
    document.getElementById('c-sous').textContent = 'Rien à ajouter';
    return;
  }

  const S = PALIERS_B[n];
  const gratuit = S.prix === 0;
  const peut = gratuit || sous >= S.prix;

  const manqueMat = CH && CH.ok && !CH.au_bout && CH.assez_de_materiaux === false;
  /* si tu lui as écrit une phrase pour ce moment, c'est la sienne
     qui parle ; sinon on garde celles de la page */
  h += CH && CH.mot ? '<p class="dit">« ' + CH.mot + ' »</p>' :
    '<p class="dit">' + (!n
    ? '« Tu veux un bateau ? Je sors le bois, tu tiens la scie. '
      + 'La quille je te la fais, le reste tu paieras. »'
    : manqueMat
      ? '« L\'argent ne fait pas une coque. Rapporte-moi la matière, '
        + 'et on en reparle. »'
    : peut
      ? "« Fais voir ta caisse… bon. On peut s'y mettre. »"
      : '« Reviens quand tu auras de quoi. Le bois ne se coupe pas tout seul. »')
    + '</p>';

  document.getElementById('c-sous').textContent = n
    ? 'Palier ' + n + ' sur ' + PALIERS_B.length : 'Tu n\'as pas encore de barque';

  /* ce qu'il peut faire ensuite */
  h += '<p class="sec">' + (n ? 'La prochaine étape' : 'Ce qu\'il peut faire') + '</p>'
    + '<div class="suite"><div class="in">'
    + '<div class="l1"><b>' + S.nom + '</b>'
    +   '<span class="px ' + (gratuit ? 'gratuit' : peut ? 'ok' : 'non') + '">'
    +   (gratuit ? 'gratuite' : eur(S.prix)) + '</span></div>'
    + '<p class="d">' + S.d + '</p>'
    + '<div class="trois" style="margin-bottom:15px">'
    +   '<div><p class="k">Cale</p><p class="v">' + S.places
    +     (A && S.places > A.places ? ' <em>+' + (S.places - A.places) + '</em>' : '')
    +     '</p></div>'
    +   '<div><p class="k">Charge</p><p class="v">' + S.kg
    +     (A && S.kg > A.kg ? ' <em>+' + (S.kg - A.kg) + '</em>' : '') + '</p></div>'
    +   '<div><p class="k">Allure</p><p class="v">' + S.vit.toFixed(1)
    +     (A && S.vit > A.vit ? ' <em>+' + (S.vit - A.vit).toFixed(1) + '</em>' : '')
    +     '</p></div>'
    + '</div>'
    + bloqueMateriaux()
    + (CH && CH.combien_de_temps
        ? '<p class="combien">Toussaint y passera ' + duree(CH.combien_de_temps) + '.</p>'
        : '')
    + '<button class="gros" id="go"'
    +   ((peut && (!CH || CH.assez_de_materiaux !== false)) ? '' : ' disabled') + '>'
    +   (peut ? (n ? 'Faire les travaux' : 'Construire la coque') : 'Pas assez') + '</button>'
    + (peut ? '' : '<p class="man">Il te manque ' + eur(S.prix - sous) + '</p>')
    + '</div></div>';

  /* le chemin, en entier */
  h += '<p class="sec">Le chemin</p><div class="chemin">'
    + PALIERS_B.map((p, i) =>
      '<div class="pal' + (i < n ? ' fait' : '') + '">'
      + '<span class="n">' + (i < n ? '✓' : (i + 1)) + '</span>'
      + '<span class="co"><b>' + p.nom + '</b>'
      + '<span>' + p.places + ' place' + (p.places > 1 ? 's' : '')
      +   ' · ' + p.kg + ' kg · allure ' + p.vit.toFixed(1) + '</span></span>'
      + '<span class="px">' + (i < n ? 'faite'
          : p.prix === 0 ? 'gratuite' : eur(p.prix)) + '</span></div>').join('')
    + '</div>';

  C.innerHTML = h; paraitre();

  const go = document.getElementById('go');
  if (go && peut) go.onclick = construire;
}

async function construire(){
  if (enTravaux) return;
  enTravaux = true;
  const go = document.getElementById('go');
  go.disabled = true; go.textContent = 'Toussaint travaille…';

  let r;
  try { r = await BD.agir('construire_barque'); } catch(e){ r = null; }

  if (r && r.ok){
    try { Object.assign(D, await BD.charger()); } catch(e){}
    try { CH = await BD.agir('mon_chantier'); } catch(e){}
    dessiner();
  } else {
    const M = { pas_ici:"Toussaint n'est pas ici.",
                deja_au_bout:"Il n'y a rien au-dessus.",
                sans_materiaux:'Il te manque de la matière.',
                deja_en_travaux:'Il est déjà sur ta barque.',
                trop_cher:'Il te manque ' + eur((r && r.manque) || 0) + '.' };
    if (r && r.pourquoi === 'sans_materiaux'){
      try { CH = await BD.agir('mon_chantier'); } catch(e){}
      dessiner(); enTravaux = false; return;
    }
    go.textContent = 'Pas possible';
    const man = document.createElement('p');
    man.className = 'man';
    man.textContent = (r && M[r.pourquoi]) || 'Réessaie dans un moment.';
    go.parentElement.appendChild(man);
  }
  enTravaux = false;
}

(async () => {
  try {
    D = await BD.charger();
    if (!D){ location.href = 'index.html'; return; }
    try { CH = await BD.agir('mon_chantier'); } catch(e){ CH = null; }
    dessiner();
  } catch(e){
    console.warn(e);
    document.getElementById('corps').innerHTML =
      '<p class="rien">Le chantier n\'a pas répondu.</p>';
  }
})();

document.getElementById('retour').onclick = () => location.href = 'hub.html?v=7';
</script>
