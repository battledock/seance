<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0b1a2a">
<title>Battle Dock — Prendre la mer</title>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none}
html,body{height:100%;overflow:hidden;background:#0b1a2a;
  font-family:'Courier Prime',monospace;color:#fff}

/* ---------- le large ---------- */
#mer{position:fixed;left:0;right:0;top:0;height:70%;overflow:hidden}
#mer svg{display:block;width:100%;height:100%}
#mer::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,
    rgba(11,26,42,.16) 0%,
    rgba(11,26,42,0) 24%,
    rgba(11,26,42,0) 50%,
    rgba(11,26,42,.5) 80%,
    rgba(11,26,42,1) 100%)}
#mer::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse 86% 76% at 50% 44%,
    transparent 54%, rgba(8,18,30,.28) 100%)}

/* ---------- le bas ---------- */
.bas{position:fixed;left:0;right:0;bottom:0;z-index:3;
  padding:0 22px calc(env(safe-area-inset-bottom) + 26px)}
.lieu{font-size:9px;letter-spacing:.34em;text-transform:uppercase;
  color:#f0c46a;margin-bottom:9px;padding-left:2px}
.nom{font-size:44px;font-weight:700;letter-spacing:-.01em;line-height:.92;
  text-shadow:0 3px 24px rgba(4,12,22,.7)}
.dit{font-size:12.5px;line-height:1.72;color:rgba(255,255,255,.7);
  margin-top:14px;font-family:system-ui,sans-serif;max-width:340px}

.chif{display:flex;gap:28px;margin-top:20px;padding-top:17px;
  border-top:1px solid rgba(255,255,255,.14)}
.chif .k{font-size:7px;letter-spacing:.2em;text-transform:uppercase;
  color:rgba(255,255,255,.4)}
.chif .v{font-size:19px;font-weight:700;margin-top:5px;white-space:nowrap}
.chif .v small{font-size:10px;color:rgba(255,255,255,.46);font-weight:400;letter-spacing:0}

.partir{width:100%;margin-top:24px;padding:18px;border:0;border-radius:9px;cursor:pointer;
  background:linear-gradient(180deg,#f6cd76,#dca94a);color:#1c1a16;
  box-shadow:0 6px 26px rgba(240,196,106,.34);
  font-family:'Courier Prime',monospace;font-size:15px;font-weight:700;letter-spacing:.08em;
  transition:transform .12s,box-shadow .2s}
.partir:active{transform:scale(.984);box-shadow:0 3px 14px rgba(240,196,106,.28)}
.partir:disabled{background:rgba(255,255,255,.08);color:rgba(255,255,255,.36);
  box-shadow:none;cursor:default}
.sous{font-size:10.5px;color:rgba(255,255,255,.46);text-align:center;margin-top:11px;
  font-family:system-ui,sans-serif}

/* ---------- l'entête ---------- */
.tete{position:fixed;left:0;right:0;top:0;z-index:4;
  padding:calc(env(safe-area-inset-top) + 14px) 16px 0;
  display:flex;align-items:center;gap:12px}
.ret{flex:0 0 42px;height:42px;border-radius:8px;
  border:1.5px solid rgba(255,255,255,.26);background:rgba(10,22,36,.4);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:transform .12s}
.ret:active{transform:scale(.94)}
.ret svg{width:19px;height:19px;stroke:#fff;fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}
.mien{margin-left:auto;display:flex;align-items:center;gap:10px;
  background:rgba(10,22,36,.4);border:1.5px solid rgba(255,255,255,.2);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-radius:8px;padding:7px 12px 7px 8px}
.mien .vg{flex:0 0 44px;height:28px;border-radius:4px;overflow:hidden;
  background:linear-gradient(180deg,#3d7fa8,#245a80)}
.mien .vg svg{display:block;width:100%;height:100%}
.mien .tx b{display:block;font-size:10.5px;font-weight:700;white-space:nowrap}
.mien .tx span{display:block;font-size:8px;letter-spacing:.12em;text-transform:uppercase;
  color:rgba(255,255,255,.44);margin-top:2px}

.fondu{opacity:0;transform:translateY(14px);
  transition:opacity .7s cubic-bezier(.2,.8,.3,1),transform .8s cubic-bezier(.2,.8,.3,1)}
.fondu.on{opacity:1;transform:none}
.d1{transition-delay:.1s}.d2{transition-delay:.24s}.d3{transition-delay:.38s}
.d4{transition-delay:.52s}

/* ---------- la mer qui vit ---------- */
.nuages g{animation:derive 240s linear infinite}
@keyframes derive{to{transform:translateX(660px)}}
.etoile{animation:scint 4s ease-in-out infinite}
.e1{animation-duration:5.6s;animation-delay:-1.4s}
.e2{animation-duration:3.2s;animation-delay:-2.6s}
.e3{animation-duration:6.8s;animation-delay:-.7s}
@keyframes scint{0%,100%{opacity:.12}50%{opacity:.5}}
.o0{animation:v0 24s linear infinite}.o1{animation:v1 31s linear infinite}
.o2{animation:v0 40s linear infinite}.o3{animation:v1 50s linear infinite}
@keyframes v0{to{transform:translateX(58px)}}
@keyframes v1{to{transform:translateX(-58px)}}
.paill{animation:brille 3.2s ease-in-out infinite}
.p1{animation-duration:2s;animation-delay:-.5s}
.p2{animation-duration:4.4s;animation-delay:-1.7s}
.p3{animation-duration:1.6s;animation-delay:-.8s}
.p4{animation-duration:5.2s;animation-delay:-2.6s}
.p5{animation-duration:2.7s;animation-delay:-1.1s}
@keyframes brille{0%,100%{opacity:.12}45%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none !important}}
</style>
</head>
<body>

<div id="mer"></div>

<div class="tete">
  <button class="ret fondu d1" id="ret">
    <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <span class="mien fondu d1">
    <span class="vg" id="m-vg"></span>
    <span class="tx"><b id="m-nom">—</b><span id="m-cale">—</span></span>
  </span>
</div>

<div class="bas">
  <p class="lieu fondu d1" id="lieu">—</p>
  <h1 class="nom fondu d2" id="nom">—</h1>
  <p class="dit fondu d2" id="dit">—</p>
  <div class="chif fondu d3">
    <div><p class="k">Traversée</p><p class="v" id="c-j">—</p></div>
    <div><p class="k">Énergie</p><p class="v" id="c-e">—</p></div>
    <div><p class="k">Ta cale</p><p class="v" id="c-c">—</p></div>
  </div>
  <div class="fondu d4">
    <button class="partir" id="partir">Larguer les amarres</button>
    <p class="sous" id="sous"></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="bd.js"></script>
<script>
/* ============================================================
   LE PORT À L'AUBE — le socle : charte, lumière, matière
   ============================================================ */

const W = 480;
const OEIL = 11;
const FOCALE = 727;
const HORIZON = 214;

const px  = (m, d) => m * FOCALE / d;
const sol = d => HORIZON + OEIL * FOCALE / d;
const rnd = s => { const x = Math.sin(s * 127.1) * 43758.5; return x - Math.floor(x); };
const rnd2 = (a, b) => { const x = Math.sin(a * 127.1 + b * 311.7) * 43758.5; return x - Math.floor(x); };

/* ---------- le soleil ---------- */
/* bas sur l'horizon, un peu à gauche du milieu : c'est lui qui décide de tout */
const SOLEIL = { x: 196, y: 200, r: 15 };

/* ---------- les couleurs ---------- */
function hx(c){ return [parseInt(c.slice(1,3),16), parseInt(c.slice(3,5),16), parseInt(c.slice(5,7),16)]; }
function ch(a){ return '#' + a.map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2,'0')).join(''); }
function mel(a, b, k){ const A = hx(a), B = hx(b); return ch([0,1,2].map(i => A[i] + (B[i]-A[i]) * k)); }

/* la lumière du matin : dorée et rasante */
const OR   = '#ffcf8a';
const OMBRE= '#2a3f5c';   /* les ombres tirent vers le bleu */
const BRUME_C = '#e8c9a0';

/* une face éclairée */
const clair  = (c, k) => mel(c, OR, k === undefined ? .34 : k);
/* une face à l'ombre */
const sombre = (c, k) => mel(c, OMBRE, k === undefined ? .34 : k);
/* la brume selon la distance */
const brume = d => Math.min(.78, 1 - Math.exp(-d / 2100));
const voiler = (c, d) => mel(c, BRUME_C, brume(d) * .82);

/* ---------- le cadre ---------- */
let HAUT = -180, BAS = 900;
const D_BORD = 21;
function cadrer(l, h){
  const total = W * h / l;
  const yb = sol(D_BORD);
  HAUT = yb - total * .78;
  BAS  = yb + total * .22;
  return { y: HAUT, h: total };
}

/* ---------- les ombres portées ---------- */
/* le soleil est bas et à gauche : les ombres partent vers la droite et vers nous */
function ombreDe(x, ySol, larg, haut, d){
  /* plus l'objet est haut, plus l'ombre est longue */
  const lg = haut * 2.6, dec = haut * 1.5;
  return `<path d="M${(x).toFixed(1)} ${ySol.toFixed(1)}
    h${larg.toFixed(1)} l${dec.toFixed(1)} ${(lg*.34).toFixed(1)}
    h${(-larg*.9).toFixed(1)} z" fill="${OMBRE}" opacity=".2"/>`;
}

/* ---------- le grain : une texture discrète sur tout ---------- */
function grain(){
  return `<filter id="b-grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" seed="7"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope=".055"/></feComponentTransfer>
    <feComposite operator="in" in2="SourceGraphic"/></filter>`;
}


/* ============================================================
   LE CIEL ET L'EAU — l'aube
   ============================================================ */

function defs(){
  return `<defs>
  ${grain()}
  <linearGradient id="b-ciel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#1c3a68"/>
    <stop offset="14%"  stop-color="#2f5a8c"/>
    <stop offset="32%"  stop-color="#4d7ba8"/>
    <stop offset="52%"  stop-color="#7a9cbc"/>
    <stop offset="68%"  stop-color="#b0b4b8"/>
    <stop offset="80%"  stop-color="#dcb99a"/>
    <stop offset="90%"  stop-color="#f2c98e"/>
    <stop offset="97%"  stop-color="#ffd89a"/>
    <stop offset="100%" stop-color="#ffe4ae"/></linearGradient>

  <radialGradient id="b-halo" cx="0.5" cy="0.5">
    <stop offset="0%"   stop-color="#fff8e0" stop-opacity=".95"/>
    <stop offset="18%"  stop-color="#ffe0a4" stop-opacity=".62"/>
    <stop offset="46%"  stop-color="#ffc880" stop-opacity=".26"/>
    <stop offset="100%" stop-color="#ffb870" stop-opacity="0"/></radialGradient>

  <radialGradient id="b-disque" cx="0.5" cy="0.5">
    <stop offset="0%"   stop-color="#fffdf4"/>
    <stop offset="62%"  stop-color="#fff2c8"/>
    <stop offset="100%" stop-color="#ffdf9a"/></radialGradient>

  <linearGradient id="b-eau" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#c9a878"/>
    <stop offset="4%"   stop-color="#9a8f86"/>
    <stop offset="14%"  stop-color="#4a6480"/>
    <stop offset="34%"  stop-color="#2e4d70"/>
    <stop offset="66%"  stop-color="#22405f"/>
    <stop offset="100%" stop-color="#1a3350"/></linearGradient>

  <linearGradient id="b-quai" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#a09480"/>
    <stop offset="6%"   stop-color="#c4b092"/>
    <stop offset="26%"  stop-color="#d8c19c"/>
    <stop offset="62%"  stop-color="#cdb693"/>
    <stop offset="100%" stop-color="#b8a184"/></linearGradient>

  <linearGradient id="b-chemin" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#fff2d0" stop-opacity=".85"/>
    <stop offset="18%"  stop-color="#ffe0a8" stop-opacity=".5"/>
    <stop offset="52%"  stop-color="#ffcf88" stop-opacity=".2"/>
    <stop offset="100%" stop-color="#ffc070" stop-opacity="0"/></linearGradient>
  <linearGradient id="b-lat" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"   stop-color="#fff" stop-opacity="0"/>
    <stop offset="20%"  stop-color="#fff" stop-opacity=".45"/>
    <stop offset="50%"  stop-color="#fff" stop-opacity="1"/>
    <stop offset="80%"  stop-color="#fff" stop-opacity=".45"/>
    <stop offset="100%" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <mask id="b-mask-lat">
    <rect x="0" y="0" width="480" height="900" fill="url(#b-lat)"/></mask>
  <filter id="b-flou"><feGaussianBlur stdDeviation="3.4"/></filter>
  <filter id="b-flou2"><feGaussianBlur stdDeviation="9"/></filter>
  <linearGradient id="b-horizon" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#ffe0aa" stop-opacity="0"/>
    <stop offset="50%"  stop-color="#ffd9a0" stop-opacity=".55"/>
    <stop offset="100%" stop-color="#e8c090" stop-opacity="0"/></linearGradient>
  </defs>`;
}

/* ---------- le ciel ---------- */
function ciel(){
  let s = `<rect x="0" y="${HAUT}" width="${W}" height="${(sol(4000)-HAUT).toFixed(1)}"
    fill="url(#b-ciel)"/>`;

  /* le halo, très large */
  s += `<ellipse cx="${SOLEIL.x}" cy="${SOLEIL.y}" rx="260" ry="150"
    fill="url(#b-halo)"/>`;

  /* les nuages : des bandes fines, plus denses près de l'horizon,
     avec le dessous éclairé par le soleil rasant */
  s += `<g class="nuages">`;
  for (let i = 0; i < 26; i++){
    const t = i / 26;
    /* on tasse vers l'horizon */
    const cy = HAUT + 24 + Math.pow(t, .55) * (SOLEIL.y - HAUT - 40);
    const cx = -120 + rnd(i*3+1) * 720;
    const w  = (26 + rnd(i*5+2) * 96) * (1 - t * .48);
    const h  = (2.4 + rnd(i*7+3) * 4) * (1 - t * .5);
    /* plus on est près du soleil, plus le nuage est chaud */
    const dSol = Math.hypot(cx - SOLEIL.x, (cy - SOLEIL.y) * 1.7) / 300;
    const k = Math.max(0, 1 - dSol);
    const haut2 = mel('#5d7492', '#f0d0a8', k * .9);
    const bas2  = mel('#8fa0b4', '#ffdca4', Math.min(1, k * 1.25));
    const op = (.16 + rnd(i*11+4) * .3) * (1 - t * .3);
    s += `<g opacity="${op.toFixed(2)}">`;
    s += `<ellipse cx="${cx.toFixed(0)}" cy="${cy.toFixed(1)}" rx="${w.toFixed(0)}"
      ry="${h.toFixed(1)}" fill="${haut2}"/>`;
    s += `<ellipse cx="${(cx + w*.22).toFixed(0)}" cy="${(cy + h*.5).toFixed(1)}"
      rx="${(w*.72).toFixed(0)}" ry="${(h*.6).toFixed(1)}" fill="${bas2}"/>`;
    if (rnd(i*13+5) > .55)
      s += `<ellipse cx="${(cx - w*.4).toFixed(0)}" cy="${(cy - h*.4).toFixed(1)}"
        rx="${(w*.36).toFixed(0)}" ry="${(h*.5).toFixed(1)}" fill="${haut2}"/>`;
    s += `</g>`;
  }
  s += `</g>`;

  /* quelques étoiles qui s'éteignent, tout en haut */
  for (let i = 0; i < 22; i++){
    const y = HAUT + rnd(i*17+9) * 160;
    s += `<circle class="etoile e${i%4}" cx="${(rnd(i*19+2)*W).toFixed(0)}" cy="${y.toFixed(0)}"
      r="${(.5 + rnd(i*23+7)*.7).toFixed(2)}" fill="#fff"
      opacity="${(.5 * (1 - (y - HAUT) / 200)).toFixed(2)}"/>`;
  }

  /* le disque, posé juste au-dessus de l'horizon */
  s += `<circle cx="${SOLEIL.x}" cy="${SOLEIL.y}" r="${SOLEIL.r * 2.1}"
    fill="#ffd894" opacity=".3"/>`;
  s += `<circle class="disque" cx="${SOLEIL.x}" cy="${SOLEIL.y}" r="${SOLEIL.r}"
    fill="url(#b-disque)"/>`;
  return s;
}

/* ---------- l'eau ---------- */
function eau(){
  const yh = sol(4000), yb = sol(D_BORD);
  let s = `<rect x="0" y="${yh.toFixed(1)}" width="${W}" height="${(yb-yh+3).toFixed(1)}"
    fill="url(#b-eau)"/>`;
  /* la bande de brume qui fond ciel et eau */
  s += `<rect x="0" y="${(yh-7).toFixed(1)}" width="${W}" height="14" fill="url(#b-horizon)"/>`;
  /* le ciel se reflète dans l'eau : une frange claire sous l'horizon */
  s += `<rect x="0" y="${yh.toFixed(1)}" width="${W}" height="${(sol(700)-yh).toFixed(1)}"
    fill="#c9a878" opacity=".2"/>`;
  s += `<rect x="0" y="${sol(700).toFixed(1)}" width="${W}" height="${(sol(220)-sol(700)).toFixed(1)}"
    fill="#6d7f92" opacity=".12"/>`;

  /* le chemin du soleil : trois cônes superposés, flous, de plus en plus larges */
  s += `<g mask="url(#b-mask-lat)">`;
  [[16, 152, .9, 'b-flou2'], [11, 96, .7, 'b-flou'], [6, 52, .55, 'b-flou']]
    .forEach(([a, b2, op, f]) => {
      s += `<path d="M${(SOLEIL.x-a).toFixed(0)} ${yh.toFixed(1)}
        L${(SOLEIL.x+a).toFixed(0)} ${yh.toFixed(1)}
        C${(SOLEIL.x+b2*.5).toFixed(0)} ${(yh+(yb-yh)*.5).toFixed(1)}
         ${(SOLEIL.x+b2*.8).toFixed(0)} ${(yh+(yb-yh)*.8).toFixed(1)}
         ${(SOLEIL.x+b2).toFixed(0)} ${(yb+16).toFixed(1)}
        L${(SOLEIL.x-b2).toFixed(0)} ${(yb+16).toFixed(1)}
        C${(SOLEIL.x-b2*.8).toFixed(0)} ${(yh+(yb-yh)*.8).toFixed(1)}
         ${(SOLEIL.x-b2*.5).toFixed(0)} ${(yh+(yb-yh)*.5).toFixed(1)}
         ${(SOLEIL.x-a).toFixed(0)} ${yh.toFixed(1)} Z"
        fill="url(#b-chemin)" opacity="${op}" filter="url(#${f})"/>`;
    });
  s += `</g>`;

  /* les paillettes : de plus en plus grandes en approchant */
  for (let i = 0; i < 240; i++){
    const t = Math.pow(rnd(i*3+1), .7);
    const y = yh + 2 + t * (yb - yh - 4);
    const etal = 16 + t * 138;
    const x = SOLEIL.x + (rnd(i*7+2) - .5) * 2 * etal;
    const w = (1.2 + t * 15) * (.35 + rnd(i*11+3) * 1.05);
    const h = Math.max(.5, (.4 + t * 1.9) * (.5 + rnd(i*13+4)));
    const op = (.24 + rnd(i*17+5) * .58) * Math.pow(Math.max(0, 1 - Math.abs(x - SOLEIL.x) / (etal * 1.1)), 1.5);
    if (op <= .04) continue;
    s += `<rect class="paill p${i%6}" x="${(x-w/2).toFixed(1)}" y="${y.toFixed(1)}"
      width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="${(h/2).toFixed(1)}"
      fill="${i % 5 ? '#ffe9b4' : '#fffdf0'}" opacity="${op.toFixed(2)}"/>`;
  }

  /* la houle : des traits qui s'espacent en approchant */
  for (let n = 0; n < 9; n++){
    const d = 1400 / Math.pow(n + 1, 1.22);
    const y = sol(d), amp = px(.26, d), esp = px(8, d);
    if (y > yb - 2 || y < yh) continue;
    s += `<g class="onde o${n % 4}">`;
    for (let i = 0; i < 2; i++){
      const yy = y + i * esp * .42;
      if (yy > yb - 2) break;
      let p = `M-120 ${yy.toFixed(1)} `;
      for (let k = 0; k < 18; k++) p += `q${(esp*.5).toFixed(1)} ${(-amp).toFixed(1)} ${esp.toFixed(1)} 0 `;
      /* les vagues près du chemin lumineux sont dorées */
      s += `<path d="${p}" stroke="#c9dcea" stroke-width="${Math.max(.4, amp*.3).toFixed(2)}"
        fill="none" opacity="${(.13 - n*.011).toFixed(3)}"/>`;
    }
    s += `</g>`;
  }
  return s;
}

/* ---------- un reflet vertical, brisé par l'eau ---------- */
/* on répète des tranches horizontales décalées : c'est ce qui fait « eau » */
function reflet(x, larg, yBase, haut, couleur, force){
  let s = `<g opacity="${(force || .3)}">`;
  const n = Math.min(26, Math.max(6, Math.round(haut * .5)));
  for (let i = 0; i < n; i++){
    const t = i / n;
    const y = yBase + t * haut * .62;
    const dec = Math.sin(i * 1.7 + x) * (1.2 + t * 4.5);
    const w = larg * (1 + t * .12);
    const op = (1 - t) * (1 - t) * .9;
    s += `<rect x="${(x + dec - (w-larg)/2).toFixed(1)}" y="${y.toFixed(1)}"
      width="${w.toFixed(1)}" height="${(haut * .62 / n + .6).toFixed(1)}"
      fill="${couleur}" opacity="${op.toFixed(3)}"/>`;
  }
  return s + `</g>`;
}
/* ============================================================
   La barque — 20 niveaux d'amélioration
   ============================================================ */
const rndB = s => { const x = Math.sin(s * 127.1) * 43758.5; return x - Math.floor(x); };

/* ---- ce que chaque niveau ajoute ---- */
const PALIERS_B = [
  { n:1,  nom:"La coque nue",        prix:0,      places:1, kg:40,  vit:1.0,

  { n:11, nom:"Le tillac",           prix:23000,  places:6, kg:170, vit:2.6,

  { n:12, nom:"La cale fermée",      prix:29000,  places:8, kg:220, vit:2.6,

  { n:13, nom:"Le foc",              prix:36000,  places:8, kg:240, vit:3.1,

  { n:16, nom:"Le bordé doublé",     prix:66000,  places:12, kg:380, vit:3.6,
    d:"Une seconde peau de bois. Elle encaisse le mauvais temps." },
  { n:17, nom:"Le treuil",           prix:80000,  places:14, kg:450, vit:3.7,
    d:"Un cabestan pour hisser seul. Plus besoin d'être trois." },
  { n:18, nom:"La chaloupe",         prix:96000,  places:15, kg:500, vit:3.7,
    d:"Une annexe sur le pont. On accoste où il n'y a pas de quai." },
  { n:19, nom:"Le pavillon",         prix:115000, places:16, kg:560, vit:3.8,
    d:"Tes couleurs en tête de mât. On te reconnaît de loin." },
  { n:20, nom:"Le grand caboteur",   prix:140000, places:20, kg:700, vit:4.2,

/* ---- palettes ---- */
const BOIS  = ['#b58f60','#c9a374','#a5825c','#96754a','#8a6a42'];
const CLAIR = '#e4c79c', SOMBRE = '#7a5c38', FOND = '#5c4930';

/* ============================================================
   Le dessin. Tout est paramétré par le niveau.
   Repère : la barque est dessinée dans un cadre 300 x 170,
   la ligne de flottaison est à y = 118.
   ============================================================ */
let uidB = 0;

function barqueQ(n, route){
  const P = PALIERS_B[n-1];
  const L = 76 + n * 5.6;            /* longueur */
  const H = 15 + n * 0.62;           /* creux du bordé au-dessus de l'eau */
  const T = 6 + n * 0.34;            /* tirant d'eau */
  const cx = 150, flot = 122;
  const x0 = cx - L / 2;
  const g = v => (x0 + v).toFixed(1);
  const u = 'b' + (++uidB);
  let s = '';

  /* ---------- la ligne de sheer : le haut du bordé ---------- */
  /* étrave relevée à gauche, creux au milieu, poupe relevée à droite */
  const yEtrave = flot - H * 1.28;
  const yCreux  = flot - H * 0.92;
  const yPoupe  = flot - H * 1.12;
  const sheer = `M${g(0)} ${yEtrave.toFixed(1)}
    C${g(L*.2)} ${(yEtrave + (yCreux-yEtrave)*.9).toFixed(1)} ${g(L*.36)} ${yCreux.toFixed(1)} ${g(L*.54)} ${yCreux.toFixed(1)}
    C${g(L*.74)} ${yCreux.toFixed(1)} ${g(L*.9)} ${(yCreux + (yPoupe-yCreux)*.5).toFixed(1)} ${g(L)} ${yPoupe.toFixed(1)}`;

  /* ---------- la coque complète ---------- */
  const coque = sheer
    + ` L${g(L*.965)} ${(flot + T*.42).toFixed(1)}`
    + ` C${g(L*.78)} ${(flot + T).toFixed(1)} ${g(L*.24)} ${(flot + T).toFixed(1)} ${g(L*.055)} ${(flot + T*.3).toFixed(1)}`
    + ` Z`;

  s += `<defs><clipPath id="${u}"><path d="${coque}"/></clipPath></defs>`;

  /* reflet dans l'eau */
  s += `<ellipse cx="${cx}" cy="${(flot + T*.7).toFixed(1)}" rx="${(L*.5).toFixed(0)}" ry="4"
    fill="#0e4a68" opacity=".2"/>`;

  /* la chaloupe (18+), posée en travers du pont */
  if (n >= 18){
    s += `<g transform="translate(${g(L*.58)},${(yCreux - 3).toFixed(1)})">
      <path d="M0 0 q3 8 10 9 h20 q7 -1 10 -9 q-6 3 -13 3 H13 q-7 0 -13 -3 z" fill="#96754a"/>
      <path d="M-1 -2 q5 4 12 4 h18 q7 0 12 -4 v3 q-5 3 -12 3 H11 q-7 0 -12 -3 z" fill="#c9a374"/></g>`;
  }

  /* ---------- le corps de la coque ---------- */
  s += `<path d="${coque}" fill="${BOIS[2]}"/>`;

  /* les bordages : des courbes parallèles au sheer, découpées par la coque */
  const nb = Math.min(7, 3 + Math.floor(n / 3.4));
  s += `<g clip-path="url(#${u})">`;
  for (let i = 0; i < nb; i++){
    const dy = (H + T) * (i / nb);
    const c = BOIS[i % BOIS.length];
    s += `<path d="${sheer}" transform="translate(0,${dy.toFixed(1)})" fill="none"
      stroke="${c}" stroke-width="${((H + T) / nb * 1.5).toFixed(1)}"/>`;
  }
  /* les coutures calfatées (2+) */
  if (n >= 2){
    for (let i = 1; i < nb; i++){
      const dy = (H + T) * (i / nb);
      s += `<path d="${sheer}" transform="translate(0,${dy.toFixed(1)})" fill="none"
        stroke="#3a2c1e" stroke-width=".9" opacity=".45"/>`;
    }
  }
  /* les œuvres vives, sous la flottaison */
  s += `<rect x="0" y="${flot}" width="300" height="60"
    fill="${n >= 10 ? '#33454f' : '#6d5334'}" opacity="${n >= 10 ? '.9' : '.55'}"/>`;
  /* le bordé doublé (16+) */
  if (n >= 16)
    s += `<path d="${sheer}" transform="translate(0,${(H*.9).toFixed(1)})" fill="none"
      stroke="#6d5334" stroke-width="2.4" opacity=".7"/>`;
  s += `</g>`;

  /* ---------- le liston (5+) ---------- */
  if (n >= 5){
    s += `<path d="${sheer}" fill="none" stroke="${CLAIR}" stroke-width="${(2.4 + n*.06).toFixed(1)}"
      stroke-linecap="round"/>`;
  } else {
    s += `<path d="${sheer}" fill="none" stroke="${BOIS[0]}" stroke-width="2" stroke-linecap="round"/>`;
  }
  /* l'ourlet clair du dessus */
  s += `<path d="${sheer}" transform="translate(0,-1)" fill="none" stroke="#f0dcb4"
    stroke-width="1" opacity=".6"/>`;

  /* ---------- l'étrave et l'étambot ---------- */
  s += `<path d="M${g(0)} ${yEtrave.toFixed(1)} C${g(-2)} ${(yEtrave + H*.7).toFixed(1)}
    ${g(1)} ${(flot).toFixed(1)} ${g(L*.055)} ${(flot + T*.3).toFixed(1)}"
    fill="none" stroke="${SOMBRE}" stroke-width="2.6" stroke-linecap="round"/>`;
  s += `<path d="M${g(L)} ${yPoupe.toFixed(1)} L${g(L*.965)} ${(flot + T*.42).toFixed(1)}"
    stroke="${SOMBRE}" stroke-width="2.6" stroke-linecap="round" fill="none"/>`;

  /* ---------- l'intérieur, vu par-dessus le bordé ---------- */
  s += `<path d="${sheer}" transform="translate(0,2.2)" fill="none" stroke="${FOND}"
    stroke-width="${Math.max(2.2, H*.22).toFixed(1)}"/>`;

  /* ---------- le pont ---------- */
  const pont = (a, b, coul, clair) => {
    s += `<path d="${sheer}" transform="translate(0,2)" fill="none" stroke="${coul}"
      stroke-width="${Math.max(2.4, H*.2).toFixed(1)}"
      stroke-dasharray="${(L*(b-a)).toFixed(0)} ${L.toFixed(0)}"
      stroke-dashoffset="${(-L*a).toFixed(0)}"/>`;
    s += `<path d="${sheer}" transform="translate(0,.6)" fill="none" stroke="${clair}"
      stroke-width="1.2" stroke-dasharray="${(L*(b-a)).toFixed(0)} ${L.toFixed(0)}"
      stroke-dashoffset="${(-L*a).toFixed(0)}"/>`;
  };
  if (n >= 11)      pont(.03, .95, '#b8946a', '#dfc094');   /* tillac : pont continu */
  else if (n >= 6)  pont(.04, .34, '#b8946a', '#dfc094');   /* demi-pont avant */

  /* ---------- le banc de nage (3+) ---------- */
  if (n >= 3 && n < 11)
    s += `<rect x="${g(L*.4)}" y="${(yCreux + 1.6).toFixed(1)}" width="${(L*.22).toFixed(0)}"
      height="${Math.max(2, H*.14).toFixed(1)}" rx="1" fill="#8a6a42"/>`;

  /* ---------- les avirons (4+ jusqu'au pont) ---------- */
  if (n >= 4 && n < 11){
    [[L*.34, 'av-1'], [L*.62, 'av-2']].forEach(([dx, cl]) => {
      const ax = +g(dx), ay = yCreux + 1;
      const dep = (flot + 7) - ay;      /* la pelle plonge sous la flottaison */
      /* le tolet, point de pivot */
      s += `<rect x="${(ax-1.4).toFixed(1)}" y="${(ay-3.6).toFixed(1)}" width="2.8" height="4.4"
        rx="1" fill="#6d5334"/>`;
      s += `<g class="aviron ${cl}" style="transform-origin:${ax}px ${ay.toFixed(1)}px">`;
      /* le manche, vers l'intérieur et vers le haut */
      s += `<path d="M${ax} ${ay.toFixed(1)} l-13 -6" stroke="#96754a"
        stroke-width="2.2" stroke-linecap="round"/>`;
      s += `<circle cx="${(ax-13).toFixed(1)}" cy="${(ay-6).toFixed(1)}" r="1.6" fill="#8a6a42"/>`;
      /* le fût, vers l'extérieur et vers l'eau */
      s += `<path d="M${ax} ${ay.toFixed(1)} l21 ${dep.toFixed(1)}" stroke="#a5825c"
        stroke-width="2.4" stroke-linecap="round"/>`;
      /* la pelle */
      s += `<path d="M${(ax+19).toFixed(1)} ${(ay+dep-2).toFixed(1)}
        q5.4 1 7 6 q1.6 5.4 -2 7.4 q-3.8 2 -6.8 -1.6 q-3 -3.6 -1.6 -8.6 z" fill="#c9a374"/>`;
      s += `<path d="M${(ax+19.6).toFixed(1)} ${(ay+dep-1).toFixed(1)}
        q4.4 1.4 5.6 5.4" stroke="#dfc094" stroke-width="1.2" fill="none"/>`;
      s += `</g>`;
    });
  }

  /* ---------- le panneau de cale (12+) ---------- */
  if (n >= 12){
    s += `<rect x="${g(L*.46)}" y="${(yCreux - 1.4).toFixed(1)}" width="${(L*.15).toFixed(0)}"
      height="${Math.max(2.6, H*.12).toFixed(1)}" rx="1" fill="#8a6a42" stroke="#6d5334" stroke-width=".8"/>`;
  }

  /* ---------- le rouf (14+) ---------- */
  if (n >= 14){
    const rx = +g(L*.62), ry = yCreux - 1, rh = H*.5, rw = L*.2;
    s += `<path d="M${rx} ${ry.toFixed(1)} h${rw.toFixed(0)} v-${rh.toFixed(1)} h-${rw.toFixed(0)} z" fill="#c9a374"/>`;
    s += `<path d="M${(rx-2).toFixed(1)} ${(ry-rh).toFixed(1)} h${(rw+4).toFixed(0)} l-2.4 -3.4 h-${(rw-.8).toFixed(0)} z" fill="#8a4a3a"/>`;
    s += `<rect x="${(rx+2.6).toFixed(1)}" y="${(ry-rh+2.4).toFixed(1)}" width="${(rw*.26).toFixed(1)}"
      height="${(rh*.42).toFixed(1)}" fill="#6d8fa4" opacity=".85"/>`;
    s += `<rect x="${(rx+rw*.56).toFixed(1)}" y="${(ry-rh+2.4).toFixed(1)}" width="${(rw*.26).toFixed(1)}"
      height="${(rh*.42).toFixed(1)}" fill="#6d8fa4" opacity=".85"/>`;
  }

  /* ---------- le grand mât (7+) ---------- */
  const mxP = n >= 13 ? .34 : .46;
  if (n >= 7){
    const mx = +g(L * mxP);
    const pied = yCreux + 1;
    const mh = n >= 8 ? 46 + n * 2.3 : 32;
    s += `<path d="M${mx} ${pied.toFixed(1)} v-${mh.toFixed(0)}" stroke="#8a6a42"
      stroke-width="${(2 + n*.07).toFixed(1)}" stroke-linecap="round"/>`;
    s += `<path d="M${(mx-.7).toFixed(1)} ${pied.toFixed(1)} v-${mh.toFixed(0)}" stroke="#c9a374"
      stroke-width=".9" opacity=".7"/>`;
    const ay = pied - mh;

    if (n === 7){
      s += `<path class="voile" d="M${mx} ${(ay+5).toFixed(1)} q15 7 20 21 q-13 5 -20 4 z" fill="#ddd2b6"/>`;
      s += `<path d="M${mx} ${(ay+5).toFixed(1)} q15 7 20 21 q-8 3 -12 3 z" fill="#f0e8d2"/>`;
    } else {
      /* la voile latine : antenne inclinée sur toute la hauteur */
      s += `<path d="M${(mx-20).toFixed(1)} ${(ay + mh*.5).toFixed(1)} L${(mx+34).toFixed(1)} ${(ay-4).toFixed(1)}"
        stroke="#a5825c" stroke-width="2.2" stroke-linecap="round"/>`;
      s += `<path class="voile" d="M${(mx-18).toFixed(1)} ${(ay + mh*.48).toFixed(1)}
        L${(mx+32).toFixed(1)} ${(ay-3).toFixed(1)}
        Q${(mx+14).toFixed(1)} ${(ay + mh*.56).toFixed(1)} ${(mx+2).toFixed(1)} ${pied.toFixed(1)} Z" fill="#e4dbc0"/>`;
      s += `<path d="M${(mx-18).toFixed(1)} ${(ay + mh*.48).toFixed(1)}
        L${(mx+32).toFixed(1)} ${(ay-3).toFixed(1)}
        Q${(mx+20).toFixed(1)} ${(ay + mh*.38).toFixed(1)} ${(mx+8).toFixed(1)} ${(ay + mh*.62).toFixed(1)} Z" fill="#f6f0dc"/>`;
      s += `<g stroke="#c9bfa2" stroke-width=".7" opacity=".65">
        <path d="M${(mx-6).toFixed(1)} ${(ay+mh*.5).toFixed(1)} L${(mx+9).toFixed(1)} ${(pied-5).toFixed(1)}"/>
        <path d="M${(mx+9).toFixed(1)} ${(ay+mh*.26).toFixed(1)} L${(mx+15).toFixed(1)} ${(pied-11).toFixed(1)}"/></g>`;
      s += `<g stroke="#c9b58c" stroke-width=".8" opacity=".75">
        <path d="M${mx} ${(ay+5).toFixed(1)} L${g(L*.1)} ${(yCreux-1).toFixed(1)}"/>
        <path d="M${mx} ${(ay+5).toFixed(1)} L${g(L*.86)} ${(yCreux-1).toFixed(1)}"/></g>`;
    }
  }

  /* ---------- le foc et son beaupré (13+) ---------- */
  if (n >= 13){
    const bx = +g(-8), by = yEtrave - 3;
    const mx = +g(L*mxP), mh = 46 + n*2.3, ay = yCreux + 1 - mh;
    s += `<path d="M${g(L*.02)} ${(yEtrave+2).toFixed(1)} L${bx} ${by.toFixed(1)}"
      stroke="#a5825c" stroke-width="2.2" stroke-linecap="round"/>`;
    s += `<path class="voile" d="M${bx} ${by.toFixed(1)} L${mx} ${(ay + mh*.2).toFixed(1)}
      Q${(bx+17).toFixed(1)} ${(ay + mh*.66).toFixed(1)} ${(bx+12).toFixed(1)} ${(yEtrave+4).toFixed(1)} Z"
      fill="#eee6cc"/>`;
    s += `<path d="M${bx} ${by.toFixed(1)} L${mx} ${(ay + mh*.2).toFixed(1)}
      Q${(bx+24).toFixed(1)} ${(ay + mh*.5).toFixed(1)} ${(bx+20).toFixed(1)} ${(ay + mh*.8).toFixed(1)} Z"
      fill="#f8f2de"/>`;
  }

  /* ---------- le tapecul (15+) ---------- */
  if (n >= 15){
    const mx2 = +g(L*.86), mh2 = 30 + n, pied2 = yCreux + 1;
    s += `<path d="M${mx2} ${pied2.toFixed(1)} v-${mh2.toFixed(0)}" stroke="#8a6a42"
      stroke-width="2.2" stroke-linecap="round"/>`;
    s += `<path d="M${(mx2-12).toFixed(1)} ${(pied2 - mh2*.44).toFixed(1)} L${(mx2+18).toFixed(1)} ${(pied2 - mh2 + 2).toFixed(1)}"
      stroke="#a5825c" stroke-width="1.9" stroke-linecap="round"/>`;
    s += `<path class="voile" d="M${(mx2-10).toFixed(1)} ${(pied2 - mh2*.42).toFixed(1)}
      L${(mx2+16).toFixed(1)} ${(pied2 - mh2 + 3).toFixed(1)}
      Q${(mx2+5).toFixed(1)} ${(pied2 - mh2*.4).toFixed(1)} ${(mx2+2).toFixed(1)} ${pied2.toFixed(1)} Z"
      fill="#e4dbc0"/>`;
  }

  /* ---------- le safran (9+) ---------- */
  if (n >= 9){
    s += `<path d="M${g(L*.97)} ${(flot - H*.5).toFixed(1)} q6 4 6 ${(T*1.1).toFixed(1)}
      q0 ${(T*.5).toFixed(1)} -6 ${(T*.5).toFixed(1)} z" fill="#7a5c38"/>`;
    s += `<path d="M${g(L*.94)} ${(yPoupe + 2).toFixed(1)} l13 -6" stroke="#a5825c"
      stroke-width="2" stroke-linecap="round"/>`;
  }

  /* ---------- le treuil (17+) ---------- */
  if (n >= 17){
    const tx = +g(L*.44);
    s += `<rect x="${(tx-4.4).toFixed(1)}" y="${(yCreux - 6).toFixed(1)}" width="9" height="6" rx="2" fill="#5c6a74"/>`;
    s += `<circle cx="${tx}" cy="${(yCreux - 3).toFixed(1)}" r="2.2" fill="#8a9299"/>`;
  }

  /* ---------- le pavillon (19+) ---------- */
  if (n >= 19){
    const mx = +g(L * mxP), mh = 46 + n * 2.3, tete = yCreux + 1 - mh;
    /* la drisse et le petit mât de pavillon */
    s += `<path d="M${mx} ${tete.toFixed(1)} v-9" stroke="#8a6a42" stroke-width="1.6" stroke-linecap="round"/>`;
    /* le pavillon, qui claque */
    s += `<g class="pavillon" style="transform-origin:${mx}px ${(tete-8).toFixed(1)}px">`;
    s += `<path d="M${mx} ${(tete-9).toFixed(1)} q9 1.6 17 -1.4 q-2 4 0 7.4 q-8 3 -17 1.4 z" fill="#c74a33"/>`;
    s += `<path d="M${mx} ${(tete-9).toFixed(1)} q9 1.6 17 -1.4 q-1 2 -.6 3.6 q-8 2.4 -16.4 1 z" fill="#e0684a"/>`;
    s += `</g>`;
  }

  /* ---------- le nom peint (20) ---------- */
  if (n >= 20)
    s += `<text x="${g(L*.1)}" y="${(flot - H*.34).toFixed(1)}" font-family="Bebas Neue,sans-serif"
      font-size="8.4" letter-spacing="1.2" fill="#f2e6c8" opacity=".85">LA ZIZOUIN</text>`;

  /* ---------- l'eau, selon l'allure ---------- */
  /* la proue est à gauche : le sillage traîne derrière, donc à droite */
  if (route){
    const nv = Math.max(2, Math.round(P.vit * 1.6));
    for (let i = 0; i < nv; i++)
      s += `<path class="sillage sl${i % 3}" d="M${g(L + 4 + i*4)} ${(flot + 1 + i*2.6).toFixed(1)}
        q${(16+i*7).toFixed(0)} 2 ${(30+i*13).toFixed(0)} 0"
        stroke="#fff" stroke-width="${(1.6 - i*.16).toFixed(2)}" fill="none"
        opacity="${(.44 - i*.05).toFixed(2)}"/>`;
    /* la moustache d'étrave, elle, est bien à l'avant */
    s += `<path class="etrave" d="M${g(-3)} ${(flot - 1).toFixed(1)} q-9 4 -19 3"
      stroke="#fff" stroke-width="2" fill="none" opacity=".55"/>`;
    s += `<path class="etrave e2" d="M${g(1)} ${(flot + 2.4).toFixed(1)} q-8 4 -17 3"
      stroke="#fff" stroke-width="1.4" fill="none" opacity=".36"/>`;
    /* le remous sous la poupe */
    s += `<ellipse class="remous" cx="${g(L + 2)}" cy="${(flot + 3).toFixed(1)}" rx="9" ry="2.4"
      fill="#fff" opacity=".24"/>`;
  } else {
    /* au mouillage : la chaîne d'ancre à l'étrave */
    s += `<path d="M${g(L*.03)} ${(yEtrave + 4).toFixed(1)} q-4 8 -3 16"
      stroke="#6d6a62" stroke-width="1.4" fill="none" stroke-dasharray="2 1.6"/>`;
    s += `<path d="M${g(-4)} ${(flot + 2).toFixed(1)} q22 3 40 0"
      stroke="#fff" stroke-width="1.2" fill="none" opacity=".26"/>`;
  }

  return s;
}



/* ================= la destination ================= */
const CAP = {
  k:'barcelone', n:'Barcelone', lieu:'Un jour de mer, plein ouest',
  s:"Tu n'y es jamais allé. On dit que là-bas tout se vend, tout se rachète, et que tout se sait.",
  jours:1, nrj:30
};

/* ================= le large, rien d'autre ================= */
/* On ne montre pas Barcelone : le joueur la découvrira en arrivant. */
function largeVide(){
  let s = defs() + ciel();
  /* une brume à l'horizon, qui cache ce qu'il y a derrière */
  const yh = sol(4000);
  s += `<rect x="0" y="${(yh-10).toFixed(1)}" width="${W}" height="22"
    fill="#e8c9a0" opacity=".26"/>`;
  s += eau();
  /* et un voile chaud, comme une promesse */
  s += `<defs><radialGradient id="v-voile" cx="0.5" cy="0.5">
    <stop offset="0%" stop-color="#ffd79a" stop-opacity=".2"/>
    <stop offset="44%" stop-color="#ffc888" stop-opacity=".09"/>
    <stop offset="100%" stop-color="#ffc070" stop-opacity="0"/></radialGradient></defs>`;
  s += `<ellipse cx="${SOLEIL.x}" cy="${SOLEIL.y}" rx="340" ry="250" fill="url(#v-voile)"/>`;
  return s;
}

function dessinerMer(){
  const el = document.getElementById('mer');
  const l = el.clientWidth || innerWidth, h = el.clientHeight || innerHeight * .7;
  const total = W * h / l;
  /* l'horizon se pose au tiers haut : on regarde surtout l'eau */
  HAUT = HORIZON - total * .34;
  BAS  = HAUT + total;
  el.innerHTML = '<svg viewBox="0 ' + HAUT.toFixed(1) + ' ' + W + ' ' + total.toFixed(1) + '" '
    + 'preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">'
    + largeVide() + '</svg>';
}

document.getElementById('ret').onclick = () => location.href = 'jeu.html';

(async () => {
  dessinerMer();
  let d;
  try {
    d = await BD.charger();
    if (!d){ location.href = 'index.html'; return; }
  } catch(e){ return; }

  const n = Number(d.barque || 0);
  if (!n){ location.href = 'jeu.html'; return; }
  const P = PALIERS_B[n - 1];
  const nrj = Number(d.energie ?? 100);

  document.getElementById('m-vg').innerHTML =
    '<svg viewBox="40 62 220 80" xmlns="http://www.w3.org/2000/svg">' + barqueQ(n, false) + '</svg>';
  document.getElementById('m-nom').textContent = P.nom;
  document.getElementById('m-cale').textContent = P.places + (P.places > 1 ? ' places' : ' place');

  document.getElementById('lieu').textContent = CAP.lieu;
  document.getElementById('nom').textContent = CAP.n;
  document.getElementById('dit').textContent = CAP.s;
  document.getElementById('c-j').innerHTML = CAP.jours + ' <small>jour</small>';
  document.getElementById('c-e').innerHTML = CAP.nrj + ' <small>points</small>';
  document.getElementById('c-c').innerHTML = P.places
    + ' <small>' + (P.places > 1 ? 'places' : 'place') + '</small>';

  const assez = nrj >= CAP.nrj;
  const bt = document.getElementById('partir');
  bt.disabled = !assez;
  bt.textContent = assez ? 'Larguer les amarres' : 'Tu es trop fatigué';
  document.getElementById('sous').textContent = assez
    ? 'Il te restera ' + Math.round(nrj - CAP.nrj) + " d'énergie en arrivant."
    : 'Il te manque ' + Math.round(CAP.nrj - nrj) + " d'énergie. Repose-toi d'abord.";
  if (assez) bt.onclick = async () => {
    bt.disabled = true; bt.textContent = 'On largue…';
    const r = await BD.agir('partir_en_mer', { destination: CAP.k });
    if (r.ok) location.href = 'mer.html';
    else {
      const M = { deja_la:'Tu y es déjà.', sans_bateau:'Il te faut un bateau.',
                  deja_en_mer:'Tu es déjà en mer.',
                  trop_fatigue:'Il te manque ' + (r.manque || 0) + " d'énergie." };
      bt.textContent = M[r.pourquoi] || 'Impossible pour l\'instant';
    }
  };

  requestAnimationFrame(() =>
    document.querySelectorAll('.fondu').forEach(e => e.classList.add('on')));
})();

let t = null;
addEventListener('resize', () => { clearTimeout(t); t = setTimeout(dessinerMer, 200); });
</script>
