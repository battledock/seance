<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#e8873f" id="tc">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Battle Dock — Prendre la mer</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="chaud.css?v=2">
<style>
/* ---------- ce qui est propre à la page du départ ---------- */

/* le ciel de la page prend la lumière du cap visé */
body::before{transition:background 1.1s ease}

/* ---------- l'entête ---------- */
.tete2{padding:calc(env(safe-area-inset-top) + 20px) 2px 18px;
  display:flex;align-items:center;gap:13px}
/* ici le retour est une flèche seule : on carre le bouton commun */
.tete2 .retour{flex:0 0 46px;width:46px;height:46px;padding:0;border-radius:15px;
  border-width:3px;display:flex;align-items:center;justify-content:center}
.tete2 .retour svg{width:20px;height:20px;stroke:var(--encre);fill:none;
  stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.tete2 .q{flex:1;min-width:0}
.tete2 .q b{display:block;font-family:'DM Serif Display',Georgia,serif;
  font-size:26px;line-height:1.05;color:#fffaf0;text-shadow:0 2px 0 rgba(18,48,63,.34)}
.tete2 .q span{display:block;font-size:11px;font-weight:800;letter-spacing:.14em;
  text-transform:uppercase;color:rgba(255,250,240,.76);margin-top:4px}

/* ---------- le choix du cap ---------- */
.caps{display:flex;gap:10px;margin-bottom:16px}
.caps button{flex:1;padding:11px 5px 12px;border-radius:15px;cursor:pointer;
  background:rgba(253,246,230,.4);border:3px solid rgba(18,48,63,.3);
  font-family:'Nunito',sans-serif;transition:background .14s,border-color .14s}
.caps button b{display:block;font-family:'DM Serif Display',Georgia,serif;
  font-size:16px;line-height:1.1;color:rgba(18,48,63,.6)}
.caps button small{display:block;font-size:9.5px;font-weight:800;letter-spacing:.1em;
  text-transform:uppercase;color:rgba(18,48,63,.4);margin-top:4px}
.caps button.on{background:var(--creme);border-color:var(--encre)}
.caps button.on b{color:var(--encre)}
.caps button.on small{color:#c07f14}
.caps button:disabled{opacity:.4;cursor:default}

/* ---------- la carte ---------- */
.plan{border-radius:20px;overflow:hidden;margin-bottom:16px;
  border:3px solid var(--encre);background:#dce8ec}
.plan svg{display:block;width:100%;height:auto}

/* ---------- ce qu'on en dit ---------- */
.dit{padding:17px 19px;border-radius:18px;margin-bottom:16px;
  background:var(--creme);border:3px solid var(--encre)}
.dit p{font-size:14px;line-height:1.6;font-weight:600;color:rgba(18,48,63,.78)}

/* ---------- l'énergie ---------- */
.nrj2{padding:15px 17px;border-radius:18px;margin-bottom:20px;
  background:var(--creme);border:3px solid var(--encre)}
.nrj2 .l1{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.nrj2 .l1 span{font-size:10px;font-weight:800;letter-spacing:.16em;
  text-transform:uppercase;color:rgba(18,48,63,.5)}
.nrj2 .l1 b{font-family:'DM Serif Display',Georgia,serif;font-size:21px;line-height:1}
.nrj2 .ba{position:relative;height:14px;border-radius:8px;background:rgba(18,48,63,.1);
  border:2px solid var(--encre);overflow:hidden}
.nrj2 .ba i{position:absolute;top:0;bottom:0;transition:width .5s,left .5s}
/* le vert : ce qui te reste en arrivant. Le hachuré : ce que la mer te prend. */
.nrj2 .ba .reste{left:0;background:var(--vert)}
.nrj2 .ba .cout{background:repeating-linear-gradient(-45deg,
  rgba(224,83,60,.9) 0 5px,rgba(224,83,60,.48) 5px 10px)}
.nrj2 .sous{font-size:12px;font-weight:600;color:rgba(18,48,63,.56);margin-top:10px}

/* ---------- larguer ---------- */
.largue{width:100%;padding:20px;border-radius:18px;cursor:pointer;
  font-family:'DM Serif Display',Georgia,serif;font-size:22px;color:var(--encre);
  background:var(--or);border:3px solid var(--encre);transition:background .12s}
.largue:active{background:#d9962a}
.largue:disabled{cursor:default;background:rgba(253,246,230,.5);
  color:rgba(18,48,63,.42);border-color:rgba(18,48,63,.4)}

/* les blocs arrivent l'un après l'autre */
.att{opacity:0;transform:translateY(12px);
  transition:opacity .5s cubic-bezier(.2,.8,.3,1),transform .55s cubic-bezier(.2,.8,.3,1)}
.att.on{opacity:1;transform:none}
.d1{transition-delay:.04s}.d2{transition-delay:.13s}.d3{transition-delay:.22s}
.d4{transition-delay:.31s}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

/* ---------- l'aube, le temps que la page se pose ---------- */
#charge{position:fixed;inset:0;z-index:90;background:#e8873f;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
  transition:opacity .45s ease}
#charge.parti{opacity:0;pointer-events:none}
#charge .ti{font-family:'DM Serif Display',Georgia,serif;
  font-size:27px;color:#fffaf0;letter-spacing:.02em}
#charge .fl{width:118px;height:3px;border-radius:2px;
  background:rgba(255,250,240,.24);overflow:hidden}
#charge .fl i{display:block;width:38%;height:100%;border-radius:2px;background:#fffaf0;
  animation:houle 1.15s ease-in-out infinite}
@keyframes houle{0%{transform:translateX(-115%)}100%{transform:translateX(275%)}}
</style>
</head>
<body>

<div id="charge"><div class="ti">Battle Dock</div><div class="fl"><i></i></div></div>

<div class="pont">

  <div class="tete2 att d1">
    <button class="retour" id="ret">
      <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <span class="q"><b>Prendre la mer</b><span id="depuis">—</span></span>
  </div>

  <div class="caps att d1" id="caps"></div>

  <div class="plan att d2" id="plan"></div>

  <div class="dit att d3"><p id="v-dit">—</p></div>

  <div class="nrj2 att d3">
    <div class="l1"><span>Ton énergie</span><b id="n-val">—</b></div>
    <div class="ba"><i class="reste"></i><i class="cout"></i></div>
    <p class="sous" id="n-sous">—</p>
  </div>

  <div class="att d4"><button class="largue" id="partir">Larguer les amarres</button></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="bd.js?v=2"></script>
<script>
/* ============================================================
   LA CARTE
   Deux aplats — la mer, la terre — le trait rouge de la route,
   et le rond doré sur le port visé. Rien d'autre. Les traits
   font la même épaisseur que les bordures des cartes du hub.
   ============================================================ */
const W = 480, H = 210;
const MER = '#dce8ec', TERRE = '#fdf6e6', ENC = '#12303f';
const OR = '#f0a92e', ROUGE = '#c1432f';

function carte(cote, d, dep, arr){
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`
    + `<rect x="0" y="0" width="${W}" height="${H}" fill="${MER}"/>`
    + `<path d="${cote}" fill="${TERRE}" stroke="${ENC}" stroke-width="3.5"
        stroke-linejoin="round"/>`
    /* la route, en gros pointillé de crayon rouge */
    + `<path d="${d}" fill="none" stroke="${ROUGE}" stroke-width="4"
        stroke-linecap="round" stroke-dasharray="2 14"/>`
    /* d'où l'on part */
    + `<circle cx="${dep[0]}" cy="${dep[1]}" r="8" fill="${TERRE}"
        stroke="${ENC}" stroke-width="3.5"/>`
    /* où l'on va */
    + `<circle cx="${arr[0]}" cy="${arr[1]}" r="13" fill="${OR}"
        stroke="${ENC}" stroke-width="3.5"/>`
    /* ta barque remonte le trait : la seule chose qui bouge ici */
    + `<g><path d="M-9 0 q9 5 18 0 l-2.2 3.8 q-6.8 2.6 -13.6 0 Z" fill="${ENC}"/>
        <rect x="-1" y="-13" width="2" height="13" fill="${ENC}"/>
        <path d="M1.2 -12 L8 -2 L1.2 -2 Z" fill="${TERRE}" stroke="${ENC}" stroke-width="1.4"/>
        <animateMotion dur="12s" repeatCount="indefinite" rotate="auto" path="${d}"/></g>`
    + '</svg>';
}

/* ---------- la côte de chaque port, et l'endroit du quai ---------- */
const COTES = {
  /* Barcelone : la côte file au nord-est, la mer est au sud */
  barcelone: {
    cote:`M0 0 H${W} V70 C 400 82 336 66 272 84 C 208 102 150 90 88 110
          C 52 122 28 120 0 134 Z`,
    quai:[236, 100]
  },
  /* Ajaccio : un golfe ouvert plein ouest, la ville au fond */
  ajaccio: {
    cote:`M${W} 0 H0 V42 C 80 50 168 62 244 78 C 310 92 372 96 ${W} 90 Z
          M${W} ${H} H0 V172 C 84 164 168 168 246 158 C 316 150 380 150 ${W} 156 Z
          M${W} 90 L 402 104 C 388 120 388 134 402 148 L${W} 156 Z`,
    quai:[398, 126]
  },
  /* Ton anse : une entaille dans la côte, à l'abri */
  anse: {
    cote:`M0 0 H${W} V72 C 424 84 372 70 318 86 C 300 92 292 92 286 100
          C 278 114 258 122 240 114 C 226 108 220 96 210 92
          C 164 78 104 92 44 112 C 28 118 12 120 0 126 Z`,
    quai:[240, 104]
  },
  /* Palma : l'île, plus bas que tout le reste */
  palma: {
    cote:`M0 ${H} H${W} V148 C 420 136 362 150 302 134 C 262 124 222 130 182 122
          C 132 112 68 126 0 136 Z`,
    quai:[252, 132]
  }
};

/* ---------- la route, pour chaque paire de ports ---------- */
const ROUTES = {
  'anse>barcelone':   { d:'M432 188 C 382 170 336 148 292 128 C 268 118 252 116 238 102', dep:[432,188] },
  'anse>ajaccio':     { d:'M38 26 C 96 58 150 82 212 104 C 268 124 326 128 386 126',      dep:[38,26]   },
  'barcelone>anse':   { d:'M42 184 C 96 170 150 152 194 132 C 218 120 230 112 240 106',   dep:[42,184]  },
  'barcelone>palma':  { d:'M430 26 C 380 50 330 76 296 98 C 274 112 262 122 252 132',     dep:[430,26]  },
  'palma>barcelone':  { d:'M296 200 C 292 172 274 148 262 126 C 252 112 246 106 238 102', dep:[296,200] },
  'ajaccio>anse':     { d:'M444 180 C 394 166 340 148 296 130 C 268 118 252 112 240 106', dep:[444,180] }
};

/* ---------- ce qu'on dit de chaque port, et sa lumière ---------- */
const MOTS = {
  barcelone: {
    dit:"Le port le plus proche, et le plus occupé. Tout se vend, tout s'achète, "
      + "et personne ne te demande d'où tu sors.",
    ciel:['#f2b04a','#e8873f','#c98a6e','#3f87a6','#1f5a80'], tc:'#e8873f'
  },
  ajaccio: {
    dit:"L'île. Des montagnes qui tombent droit dans l'eau, et un port au fond "
      + "du golfe où le temps ne presse personne.",
    ciel:['#e8a8a0','#c98fa0','#8f8fa8','#3f7f92','#17475c'], tc:'#c98fa0'
  },
  palma: {
    dit:"Majorque. Loin, et il faut passer par Barcelone pour y aller. "
      + "On y tisse un drap qu'on ne trouve nulle part ailleurs.",
    ciel:['#f4c06a','#e0a45c','#b09080','#3d8098','#1a5470'], tc:'#e0a45c'
  },
  anse: {
    dit:"Chez toi. Le quai, la barque, et ce que tu as rapporté. "
      + "On te connaît, ici.",
    ciel:['#f2b04a','#eeb455','#c9b978','#3f87a6','#2b6f92'], tc:'#f5a53a'
  }
};

/* ============================================================
   LA PAGE
   ============================================================ */
let AUBE = false;
function leverAube(){
  if (AUBE) return;
  AUBE = true;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    const ch = document.getElementById('charge');
    if (!ch) return;
    ch.classList.add('parti');
    setTimeout(() => ch.remove(), 500);
  }));
}
setTimeout(leverAube, 6000);

let MOI = null, PORTS = [], CAP = null, DEPART = 'anse', RETOUR = 'jeu.html';

document.getElementById('ret').onclick = () => location.href = RETOUR;

function poserCaps(){
  document.getElementById('caps').innerHTML = PORTS.map(p =>
    `<button data-c="${p.k}"${p.ouvert ? '' : ' disabled'}
      class="${CAP && p.k === CAP.k ? 'on' : ''}"><b>${p.nom}</b>
      <small>${p.ouvert ? p.jours + (p.jours > 1 ? ' jours' : ' jour') : 'fermé'}</small>
    </button>`).join('');
}

function poserCap(){
  if (!CAP) return;
  const m = MOTS[CAP.k] || MOTS.anse;

  /* le ciel de la page suit le cap */
  const r = document.documentElement.style;
  (m.ciel || []).forEach((v, i) => r.setProperty('--h' + (i + 1), v));
  document.getElementById('tc').setAttribute('content', m.tc);

  /* la carte : la côte du port visé, la route depuis là où tu es */
  const c = COTES[CAP.k], rt = ROUTES[DEPART + '>' + CAP.k];
  document.getElementById('plan').innerHTML = (c && rt)
    ? carte(c.cote, rt.d, rt.dep, c.quai) : '';

  document.getElementById('v-dit').textContent = m.dit;

  /* l'énergie : ce qui reste, et ce que la traversée prend */
  const nrj = Number(MOI.energie ?? 100);
  const max = Number(MOI.energie_max ?? 100) || 100;
  const cout = Number(CAP.energie || 0);
  const assez = nrj >= cout;
  const reste = Math.max(nrj - cout, 0);

  document.getElementById('n-val').textContent = Math.round(nrj);
  document.querySelector('.nrj2 .reste').style.width = (reste / max * 100) + '%';
  const co = document.querySelector('.nrj2 .cout');
  co.style.left = (reste / max * 100) + '%';
  co.style.width = (Math.min(cout, nrj) / max * 100) + '%';
  document.getElementById('n-sous').textContent = assez
    ? 'La traversée te prend ' + cout + " points. Il t'en restera "
      + Math.round(reste) + ' en arrivant.'
    : 'Il te manque ' + Math.round(cout - nrj) + ' points — '
      + Math.round(cout - nrj) + ' minutes de repos.';

  const bt = document.getElementById('partir');
  bt.disabled = !assez;
  bt.textContent = assez ? 'Larguer les amarres' : 'Tu es trop fatigué';
  bt.onclick = !assez ? null : async () => {
    bt.disabled = true;
    bt.textContent = 'On largue…';
    const rep = await BD.agir('partir_en_mer', { destination: CAP.k });
    if (rep && rep.ok){ location.href = 'mer.html'; return; }
    const M = { deja_la:'Tu y es déjà.', sans_bateau:'Il te faut un bateau.',
      deja_en_mer:'Tu es déjà en mer.', ferme:"Ce port ne t'est pas ouvert.",
      pas_de_route:"On ne va pas là-bas d'ici.",
      trop_fatigue:'Il te manque ' + (((rep||{}).faut || 0) - ((rep||{}).tu_as || 0)) + ' points.' };
    bt.textContent = M[(rep||{}).pourquoi] || "Impossible pour l'instant";
    setTimeout(poserCap, 2200);
  };
}

document.getElementById('caps').onclick = e => {
  const b = e.target.closest('[data-c]');
  if (!b || b.disabled) return;
  CAP = PORTS.find(p => p.k === b.dataset.c) || CAP;
  poserCaps();
  poserCap();
};

(async () => {
  try {
    const d = await BD.charger();
    if (!d){ location.href = 'index.html'; return; }
    if (d.etape && d.etape !== 'jeu' && BD.PAGES[d.etape]){
      location.href = BD.PAGES[d.etape]; return;
    }
    /* sans barque on ne va nulle part, et en mer on ne choisit plus */
    if (!Number(d.barque || 0)){ location.href = 'jeu.html'; return; }
    if (d.parti_le){ location.href = 'mer.html'; return; }

    MOI = d;
    DEPART = d.port || 'anse';
    const RET = { barcelone:'barcelone.html', palma:'palma.html',
                  ajaccio:'ajaccio.html', anse:'jeu.html' };
    RETOUR = RET[DEPART] || 'jeu.html';
    document.getElementById('depuis').textContent =
      'Depuis ' + ((MOTS[DEPART] && DEPART === 'anse') ? 'ton anse'
        : (COTES[DEPART] ? DEPART.charAt(0).toUpperCase() + DEPART.slice(1) : 'ici'));

    /* mes_ports ne renvoie que ce qu'on peut atteindre d'ici */
    PORTS = await BD.agir('mes_ports');
    if (!Array.isArray(PORTS)) PORTS = [];
    CAP = PORTS.find(p => p.ouvert) || PORTS[0] || null;

    poserCaps();
    poserCap();
    leverAube();
  } catch(e){
    console.warn('départ indisponible', e);
    leverAube();
  }
  requestAnimationFrame(() =>
    document.querySelectorAll('.att').forEach(e => e.classList.add('on')));
})();
</script>
</body>
</html>
