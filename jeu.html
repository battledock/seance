<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <title>Mon cinéma</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css?v=93089721">
  <style>
    body{margin:0;background:#0a0406}
    .sceneJeu,.navBas{opacity:0;transition:opacity .38s ease}
    body.pret .sceneJeu,body.pret .navBas{opacity:1}
    /* ------------------------------------------------------------
       LE VOILE S'ACCORDE AU CIEL

       Le voile de chargement était bordeaux comme sur les autres
       pages. Mais jeu.html est la seule page qui s'ouvre sur un
       ciel : passer du bordeaux au bleu franc produisait un éclair
       rouge à chaque chargement.

       On teinte donc le voile avec le ciel de l'heure courante,
       posé en variable avant même que le JavaScript du jeu ne
       démarre. Le voile s'efface alors dans la continuité du décor.
       ------------------------------------------------------------ */
    #voileChargement{position:fixed;inset:0;z-index:500;display:flex;flex-direction:column;
      align-items:center;justify-content:center;gap:20px;
      background:radial-gradient(ellipse at 50% 42%,
        var(--voileHaut,#2a1018), var(--voileBas,#0a0406) 72%)}
  </style>
  <script>
    /* la teinte du voile suit l'heure, comme le ciel de la façade */
    (function(){
      var h = new Date().getHours(), haut, bas;
      if(h >= 6 && h < 11)       { haut = "#7ba4c8"; bas = "#3f6f9c"; }  /* matin */
      else if(h >= 11 && h < 18) { haut = "#6fa8d8"; bas = "#35719e"; }  /* après-midi */
      else if(h >= 18 && h < 21) { haut = "#8a5484"; bas = "#2a1c3e"; }  /* aube du soir */
      else                       { haut = "#141a38"; bas = "#05070f"; }  /* nuit */
      var r = document.documentElement.style;
      r.setProperty("--voileHaut", haut);
      r.setProperty("--voileBas",  bas);
    })();
  </script>
</head>
<body>

<div class="voileChargement" id="voileChargement" role="status" aria-live="polite">
  <svg class="vcBobine" viewBox="0 0 74 74" aria-hidden="true">
    <g class="roue">
      <circle cx="37" cy="37" r="32" fill="none" stroke="#caa24a" stroke-width="3"/>
      <circle cx="37" cy="37" r="7" fill="#caa24a"/>
      <g fill="#caa24a" opacity=".85">
        <circle cx="37" cy="16" r="5.4"/><circle cx="55" cy="47" r="5.4"/><circle cx="19" cy="47" r="5.4"/>
      </g>
    </g>
    <circle class="pellicule" cx="37" cy="37" r="32" fill="none"
      stroke="#f7dd9a" stroke-width="1.6" opacity=".6"/>
  </svg>
  <div class="vcNom">Séance</div>
  <div class="vcTexte">On allume le projecteur…</div>
  <div class="vcPiste"><i></i></div>
</div>

<main class="sceneJeu">
  <div class="hudJeu" id="hudJeu">
    <div class="hudGauche">
      <span class="hudNom" id="hudNom"></span>
      <span class="hudNiv" id="hudNiv"></span>
    </div>
    <div class="hudDroite">
      <span class="hudArgent" id="hudArgent"></span>
      <span class="hudXp"><span class="hudXpBarre" id="hudXpBarre"></span></span>
    </div>
  </div>
  <div class="sceneFacade" id="sceneFacade"></div>
  <div class="sceneFade" aria-hidden="true"></div>
</main>

<script type="module" src="js/pages/jeu.js?v=93089721"></script>
</body>
</html>
