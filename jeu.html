<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <style>
    body{margin:0}

    /* ------------------------------------------------------------
       LE FOND PENDANT QUE LA FAÇADE ARRIVE

       Il y avait un voile avec une bobine, puis deux fondus qui se
       croisaient : c'est ce croisement qui faisait battre le ciel.
       Tout cela a disparu, la page porte directement une couleur
       d'attente.

       Cette couleur était le ciel de l'heure. Mauvaise idée : la
       scène ne descend pas tout à fait jusqu'à la barre du bas, et
       le bleu débordait en une bande sous la route. On prend donc
       la teinte sombre du bitume — invisible quand la façade est
       posée, discrète quand elle tarde.
       ------------------------------------------------------------ */
    html,body{background:#14100f}
    .sceneJeu{opacity:1;background:#14100f}
    .navBas{opacity:0;transition:opacity .38s ease}
    body.pret .navBas{opacity:1}
  </style>
</head>
<body>

<main class="sceneJeu">
  <div class="hudJeu" id="hudJeu">
    <div class="hudGauche">
      <span class="hudNom" id="hudNom"></span>
      <span class="hudNiv" id="hudNiv"></span>
    </div>
    <div class="hudDroite">
      <span class="hudArgent" id="hudArgent"></span>
      <span class="hudXp"><span class="hudXpBarre" id="hudXpBarre"></span></span>
    </div>
  </div>
  <div class="sceneFacade" id="sceneFacade"></div>
  <div class="sceneFade" aria-hidden="true"></div>
</main>

<script type="module" src="js/pages/jeu.js?v=becf21cb"></script>
</body>
