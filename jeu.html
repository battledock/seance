<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1c3a68">
<title>Battle Dock</title>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none}
html,body{height:100%;overflow:hidden;background:#1c3a68;
  font-family:'Courier Prime',monospace}
#sc{position:fixed;inset:0}
#sc svg{display:block;width:100%;height:100%}

/* ---------- l'avatar, en haut à gauche ---------- */
.av{position:fixed;z-index:10;
  top:calc(env(safe-area-inset-top) + 14px);left:14px;
  width:56px;height:56px;border-radius:6px;overflow:hidden;
  background:#dfe8ee;border:2px solid rgba(255,255,255,.82);
  box-shadow:0 3px 14px rgba(8,20,32,.42),inset 0 0 0 1px rgba(20,40,60,.14);
  cursor:pointer;transition:transform .13s}
.av:active{transform:scale(.96)}
.av{opacity:0;transition:opacity .5s}
.av.pret{opacity:1}
.av svg{display:block;width:100%;height:100%}
.av .nm{position:absolute;left:0;right:0;bottom:0;
  background:linear-gradient(180deg,transparent,rgba(10,22,34,.82));
  color:#fff;font-size:7.5px;letter-spacing:.1em;text-transform:uppercase;
  text-align:center;padding:5px 2px 2.4px;font-weight:700}

/* ---------- le ciel ---------- */
.nuages g{animation:derive 260s linear infinite}
@keyframes derive{to{transform:translateX(680px)}}
.etoile{animation:scint 4s ease-in-out infinite}
.e1{animation-duration:5.6s;animation-delay:-1.4s}
.e2{animation-duration:3.2s;animation-delay:-2.6s}
.e3{animation-duration:6.8s;animation-delay:-.7s}
@keyframes scint{0%,100%{opacity:.12}50%{opacity:.5}}
.disque{animation:lever 9s ease-in-out infinite}
@keyframes lever{0%,100%{opacity:.94}50%{opacity:1}}

/* ---------- la mer ---------- */
.onde{will-change:transform}
.o0{animation:v0 22s linear infinite}
.o1{animation:v1 29s linear infinite}
.o2{animation:v0 37s linear infinite}
.o3{animation:v1 46s linear infinite}
@keyframes v0{to{transform:translateX(58px)}}
@keyframes v1{to{transform:translateX(-58px)}}
.paill{animation:brille 3.2s ease-in-out infinite}
.p1{animation-duration:2s;animation-delay:-.5s}
.p2{animation-duration:4.4s;animation-delay:-1.7s}
.p3{animation-duration:1.6s;animation-delay:-.8s}
.p4{animation-duration:5.2s;animation-delay:-2.6s}
.p5{animation-duration:2.7s;animation-delay:-1.1s}
@keyframes brille{0%,100%{opacity:.12}45%{opacity:1}}

/* ---------- la barque ---------- */
.barque{animation:roulis 7.4s ease-in-out infinite;transform-origin:150px 122px}
@keyframes roulis{
  0%   {transform:translate(-150px,-122px) rotate(-1.1deg)}
  28%  {transform:translate(-150px,-123.4px) rotate(.4deg)}
  52%  {transform:translate(-150px,-121.2px) rotate(1.1deg)}
  76%  {transform:translate(-150px,-122.8px) rotate(-.3deg)}
  100% {transform:translate(-150px,-122px) rotate(-1.1deg)}}
.ride{transform-box:fill-box;transform-origin:50% 50%}
.r0{animation:onde 4.6s ease-out infinite}
.r1{animation:onde 4.6s ease-out infinite -1.5s}
.r2{animation:onde 4.6s ease-out infinite -3s}
@keyframes onde{0%{transform:scale(.5);opacity:.44}70%{opacity:.14}
  100%{transform:scale(1.5);opacity:0}}
.clapot{animation:suit 7.4s ease-in-out infinite}
@keyframes suit{0%,100%{transform:translateY(0)}52%{transform:translateY(.8px)}}

@media (prefers-reduced-motion:reduce){*{animation:none !important}}
</style>
</head>
<body>

<div id="sc"></div>

<div class="av" id="av"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="bd.js"></script>
<script>
/* ============================================================
   LE PORT À L'AUBE — le socle : charte, lumière, matière
   ============================================================ */

const W = 480;
const OEIL = 11;
const FOCALE = 727;
const HORIZON = 214;

const px  = (m, d) => m * FOCALE / d;
const sol = d => HORIZON + OEIL * FOCALE / d;
const rnd = s => { const x = Math.sin(s * 127.1) * 43758.5; return x - Math.floor(x); };
const rnd2 = (a, b) => { const x = Math.sin(a * 127.1 + b * 311.7) * 43758.5; return x - Math.floor(x); };

/* ---------- le soleil ---------- */
/* bas sur l'horizon, un peu à gauche du milieu : c'est lui qui décide de tout */
const SOLEIL = { x: 196, y: 200, r: 15 };

/* ---------- les couleurs ---------- */
function hx(c){ return [parseInt(c.slice(1,3),16), parseInt(c.slice(3,5),16), parseInt(c.slice(5,7),16)]; }
function ch(a){ return '#' + a.map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2,'0')).join(''); }
function mel(a, b, k){ const A = hx(a), B = hx(b); return ch([0,1,2].map(i => A[i] + (B[i]-A[i]) * k)); }

/* la lumière du matin : dorée et rasante */
const OR   = '#ffcf8a';
const OMBRE= '#2a3f5c';   /* les ombres tirent vers le bleu */
const BRUME_C = '#e8c9a0';

/* une face éclairée */
const clair  = (c, k) => mel(c, OR, k === undefined ? .34 : k);
/* une face à l'ombre */
const sombre = (c, k) => mel(c, OMBRE, k === undefined ? .34 : k);
/* la brume selon la distance */
const brume = d => Math.min(.78, 1 - Math.exp(-d / 2100));
const voiler = (c, d) => mel(c, BRUME_C, brume(d) * .82);

/* ---------- le cadre ---------- */
let HAUT = -180, BAS = 900;
const D_BORD = 21;
function cadrer(l, h){
  const total = W * h / l;
  const yb = sol(D_BORD);
  HAUT = yb - total * .78;
  BAS  = yb + total * .22;
  return { y: HAUT, h: total };
}

/* ---------- les ombres portées ---------- */
/* le soleil est bas et à gauche : les ombres partent vers la droite et vers nous */
function ombreDe(x, ySol, larg, haut, d){
  /* plus l'objet est haut, plus l'ombre est longue */
  const lg = haut * 2.6, dec = haut * 1.5;
  return `<path d="M${(x).toFixed(1)} ${ySol.toFixed(1)}
    h${larg.toFixed(1)} l${dec.toFixed(1)} ${(lg*.34).toFixed(1)}
    h${(-larg*.9).toFixed(1)} z" fill="${OMBRE}" opacity=".2"/>`;
}

/* ---------- le grain : une texture discrète sur tout ---------- */
function grain(){
  return `<filter id="b-grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" seed="7"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope=".055"/></feComponentTransfer>
    <feComposite operator="in" in2="SourceGraphic"/></filter>`;
}


/* ============================================================
   LE CIEL ET L'EAU — l'aube
   ============================================================ */

function defs(){
  return `<defs>
  ${grain()}
  <linearGradient id="b-ciel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#1c3a68"/>
    <stop offset="14%"  stop-color="#2f5a8c"/>
    <stop offset="32%"  stop-color="#4d7ba8"/>
    <stop offset="52%"  stop-color="#7a9cbc"/>
    <stop offset="68%"  stop-color="#b0b4b8"/>
    <stop offset="80%"  stop-color="#dcb99a"/>
    <stop offset="90%"  stop-color="#f2c98e"/>
    <stop offset="97%"  stop-color="#ffd89a"/>
    <stop offset="100%" stop-color="#ffe4ae"/></linearGradient>

  <radialGradient id="b-halo" cx="0.5" cy="0.5">
    <stop offset="0%"   stop-color="#fff8e0" stop-opacity=".95"/>
    <stop offset="18%"  stop-color="#ffe0a4" stop-opacity=".62"/>
    <stop offset="46%"  stop-color="#ffc880" stop-opacity=".26"/>
    <stop offset="100%" stop-color="#ffb870" stop-opacity="0"/></radialGradient>

  <radialGradient id="b-disque" cx="0.5" cy="0.5">
    <stop offset="0%"   stop-color="#fffdf4"/>
    <stop offset="62%"  stop-color="#fff2c8"/>
    <stop offset="100%" stop-color="#ffdf9a"/></radialGradient>

  <linearGradient id="b-eau" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#c9a878"/>
    <stop offset="4%"   stop-color="#9a8f86"/>
    <stop offset="14%"  stop-color="#4a6480"/>
    <stop offset="34%"  stop-color="#2e4d70"/>
    <stop offset="66%"  stop-color="#22405f"/>
    <stop offset="100%" stop-color="#1a3350"/></linearGradient>

  <linearGradient id="b-quai" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#a09480"/>
    <stop offset="6%"   stop-color="#c4b092"/>
    <stop offset="26%"  stop-color="#d8c19c"/>
    <stop offset="62%"  stop-color="#cdb693"/>
    <stop offset="100%" stop-color="#b8a184"/></linearGradient>

  <linearGradient id="b-chemin" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#fff2d0" stop-opacity=".85"/>
    <stop offset="18%"  stop-color="#ffe0a8" stop-opacity=".5"/>
    <stop offset="52%"  stop-color="#ffcf88" stop-opacity=".2"/>
    <stop offset="100%" stop-color="#ffc070" stop-opacity="0"/></linearGradient>
  <linearGradient id="b-lat" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"   stop-color="#fff" stop-opacity="0"/>
    <stop offset="20%"  stop-color="#fff" stop-opacity=".45"/>
    <stop offset="50%"  stop-color="#fff" stop-opacity="1"/>
    <stop offset="80%"  stop-color="#fff" stop-opacity=".45"/>
    <stop offset="100%" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <mask id="b-mask-lat">
    <rect x="0" y="0" width="480" height="900" fill="url(#b-lat)"/></mask>
  <filter id="b-flou"><feGaussianBlur stdDeviation="3.4"/></filter>
  <filter id="b-flou2"><feGaussianBlur stdDeviation="9"/></filter>
  <linearGradient id="b-horizon" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#ffe0aa" stop-opacity="0"/>
    <stop offset="50%"  stop-color="#ffd9a0" stop-opacity=".55"/>
    <stop offset="100%" stop-color="#e8c090" stop-opacity="0"/></linearGradient>
  </defs>`;
}

/* ---------- le ciel ---------- */
function ciel(){
  let s = `<rect x="0" y="${HAUT}" width="${W}" height="${(sol(4000)-HAUT).toFixed(1)}"
    fill="url(#b-ciel)"/>`;

  /* le halo, très large */
  s += `<ellipse cx="${SOLEIL.x}" cy="${SOLEIL.y}" rx="260" ry="150"
    fill="url(#b-halo)"/>`;

  /* les nuages : des bandes fines, plus denses près de l'horizon,
     avec le dessous éclairé par le soleil rasant */
  s += `<g class="nuages">`;
  for (let i = 0; i < 26; i++){
    const t = i / 26;
    /* on tasse vers l'horizon */
    const cy = HAUT + 24 + Math.pow(t, .55) * (SOLEIL.y - HAUT - 40);
    const cx = -120 + rnd(i*3+1) * 720;
    const w  = (26 + rnd(i*5+2) * 96) * (1 - t * .48);
    const h  = (2.4 + rnd(i*7+3) * 4) * (1 - t * .5);
    /* plus on est près du soleil, plus le nuage est chaud */
    const dSol = Math.hypot(cx - SOLEIL.x, (cy - SOLEIL.y) * 1.7) / 300;
    const k = Math.max(0, 1 - dSol);
    const haut2 = mel('#5d7492', '#f0d0a8', k * .9);
    const bas2  = mel('#8fa0b4', '#ffdca4', Math.min(1, k * 1.25));
    const op = (.16 + rnd(i*11+4) * .3) * (1 - t * .3);
    s += `<g opacity="${op.toFixed(2)}">`;
    s += `<ellipse cx="${cx.toFixed(0)}" cy="${cy.toFixed(1)}" rx="${w.toFixed(0)}"
      ry="${h.toFixed(1)}" fill="${haut2}"/>`;
    s += `<ellipse cx="${(cx + w*.22).toFixed(0)}" cy="${(cy + h*.5).toFixed(1)}"
      rx="${(w*.72).toFixed(0)}" ry="${(h*.6).toFixed(1)}" fill="${bas2}"/>`;
    if (rnd(i*13+5) > .55)
      s += `<ellipse cx="${(cx - w*.4).toFixed(0)}" cy="${(cy - h*.4).toFixed(1)}"
        rx="${(w*.36).toFixed(0)}" ry="${(h*.5).toFixed(1)}" fill="${haut2}"/>`;
    s += `</g>`;
  }
  s += `</g>`;

  /* quelques étoiles qui s'éteignent, tout en haut */
  for (let i = 0; i < 22; i++){
    const y = HAUT + rnd(i*17+9) * 160;
    s += `<circle class="etoile e${i%4}" cx="${(rnd(i*19+2)*W).toFixed(0)}" cy="${y.toFixed(0)}"
      r="${(.5 + rnd(i*23+7)*.7).toFixed(2)}" fill="#fff"
      opacity="${(.5 * (1 - (y - HAUT) / 200)).toFixed(2)}"/>`;
  }

  /* le disque, posé juste au-dessus de l'horizon */
  s += `<circle cx="${SOLEIL.x}" cy="${SOLEIL.y}" r="${SOLEIL.r * 2.1}"
    fill="#ffd894" opacity=".3"/>`;
  s += `<circle class="disque" cx="${SOLEIL.x}" cy="${SOLEIL.y}" r="${SOLEIL.r}"
    fill="url(#b-disque)"/>`;
  return s;
}

/* ---------- l'eau ---------- */
function eau(){
  const yh = sol(4000), yb = sol(D_BORD);
  let s = `<rect x="0" y="${yh.toFixed(1)}" width="${W}" height="${(yb-yh+3).toFixed(1)}"
    fill="url(#b-eau)"/>`;
  /* la bande de brume qui fond ciel et eau */
  s += `<rect x="0" y="${(yh-7).toFixed(1)}" width="${W}" height="14" fill="url(#b-horizon)"/>`;
  /* le ciel se reflète dans l'eau : une frange claire sous l'horizon */
  s += `<rect x="0" y="${yh.toFixed(1)}" width="${W}" height="${(sol(700)-yh).toFixed(1)}"
    fill="#c9a878" opacity=".2"/>`;
  s += `<rect x="0" y="${sol(700).toFixed(1)}" width="${W}" height="${(sol(220)-sol(700)).toFixed(1)}"
    fill="#6d7f92" opacity=".12"/>`;

  /* le chemin du soleil : trois cônes superposés, flous, de plus en plus larges */
  s += `<g mask="url(#b-mask-lat)">`;
  [[16, 152, .9, 'b-flou2'], [11, 96, .7, 'b-flou'], [6, 52, .55, 'b-flou']]
    .forEach(([a, b2, op, f]) => {
      s += `<path d="M${(SOLEIL.x-a).toFixed(0)} ${yh.toFixed(1)}
        L${(SOLEIL.x+a).toFixed(0)} ${yh.toFixed(1)}
        C${(SOLEIL.x+b2*.5).toFixed(0)} ${(yh+(yb-yh)*.5).toFixed(1)}
         ${(SOLEIL.x+b2*.8).toFixed(0)} ${(yh+(yb-yh)*.8).toFixed(1)}
         ${(SOLEIL.x+b2).toFixed(0)} ${(yb+16).toFixed(1)}
        L${(SOLEIL.x-b2).toFixed(0)} ${(yb+16).toFixed(1)}
        C${(SOLEIL.x-b2*.8).toFixed(0)} ${(yh+(yb-yh)*.8).toFixed(1)}
         ${(SOLEIL.x-b2*.5).toFixed(0)} ${(yh+(yb-yh)*.5).toFixed(1)}
         ${(SOLEIL.x-a).toFixed(0)} ${yh.toFixed(1)} Z"
        fill="url(#b-chemin)" opacity="${op}" filter="url(#${f})"/>`;
    });
  s += `</g>`;

  /* les paillettes : de plus en plus grandes en approchant */
  for (let i = 0; i < 240; i++){
    const t = Math.pow(rnd(i*3+1), .7);
    const y = yh + 2 + t * (yb - yh - 4);
    const etal = 16 + t * 138;
    const x = SOLEIL.x + (rnd(i*7+2) - .5) * 2 * etal;
    const w = (1.2 + t * 15) * (.35 + rnd(i*11+3) * 1.05);
    const h = Math.max(.5, (.4 + t * 1.9) * (.5 + rnd(i*13+4)));
    const op = (.24 + rnd(i*17+5) * .58) * Math.pow(Math.max(0, 1 - Math.abs(x - SOLEIL.x) / (etal * 1.1)), 1.5);
    if (op <= .04) continue;
    s += `<rect class="paill p${i%6}" x="${(x-w/2).toFixed(1)}" y="${y.toFixed(1)}"
      width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="${(h/2).toFixed(1)}"
      fill="${i % 5 ? '#ffe9b4' : '#fffdf0'}" opacity="${op.toFixed(2)}"/>`;
  }

  /* la houle : des traits qui s'espacent en approchant */
  for (let n = 0; n < 9; n++){
    const d = 1400 / Math.pow(n + 1, 1.22);
    const y = sol(d), amp = px(.26, d), esp = px(8, d);
    if (y > yb - 2 || y < yh) continue;
    s += `<g class="onde o${n % 4}">`;
    for (let i = 0; i < 2; i++){
      const yy = y + i * esp * .42;
      if (yy > yb - 2) break;
      let p = `M-120 ${yy.toFixed(1)} `;
      for (let k = 0; k < 18; k++) p += `q${(esp*.5).toFixed(1)} ${(-amp).toFixed(1)} ${esp.toFixed(1)} 0 `;
      /* les vagues près du chemin lumineux sont dorées */
      s += `<path d="${p}" stroke="#c9dcea" stroke-width="${Math.max(.4, amp*.3).toFixed(2)}"
        fill="none" opacity="${(.13 - n*.011).toFixed(3)}"/>`;
    }
    s += `</g>`;
  }
  return s;
}

/* ---------- un reflet vertical, brisé par l'eau ---------- */
/* on répète des tranches horizontales décalées : c'est ce qui fait « eau » */
function reflet(x, larg, yBase, haut, couleur, force){
  let s = `<g opacity="${(force || .3)}">`;
  const n = Math.min(26, Math.max(6, Math.round(haut * .5)));
  for (let i = 0; i < n; i++){
    const t = i / n;
    const y = yBase + t * haut * .62;
    const dec = Math.sin(i * 1.7 + x) * (1.2 + t * 4.5);
    const w = larg * (1 + t * .12);
    const op = (1 - t) * (1 - t) * .9;
    s += `<rect x="${(x + dec - (w-larg)/2).toFixed(1)}" y="${y.toFixed(1)}"
      width="${w.toFixed(1)}" height="${(haut * .62 / n + .6).toFixed(1)}"
      fill="${couleur}" opacity="${op.toFixed(3)}"/>`;
  }
  return s + `</g>`;
}

/* ============================================================
   MARSEILLE — le fond, en silhouette contre le matin
   ============================================================ */

function marseilleFond(){
  let s = '';

  /* ---------- les collines qui ferment la rade ---------- */
  /* la chaîne de l'Étoile, très loin */
  {
    const d = 16000, y = sol(d), h = px(700, d);
    const c = mel('#6d7c92', '#e0c4a4', .5);
    let p = `M-10 ${y} `;
    [[-10,.24],[54,.56],[118,.38],[186,.72],[252,.5],[318,.8],[382,.56],[440,.74],[490,.44]]
      .forEach(([x, k], i) => p += (i ? `Q${(x-20)} ${(y-h*k*1.14).toFixed(1)} ` : '') + `${x} ${(y-h*k).toFixed(1)} `);
    s += `<path d="${p}L490 ${y} Z" fill="${c}" opacity=".4"/>`;
  }
  /* Marseilleveyre, à gauche */
  {
    const d = 9000, y = sol(d), h = px(420, d);
    const c = mel('#5c6d84', '#d0a888', .42);
    s += `<path d="M-10 ${y} L-10 ${(y-h*.4).toFixed(1)}
      Q34 ${(y-h*.78).toFixed(1)} 72 ${(y-h*.94).toFixed(1)}
      Q104 ${(y-h*1.02).toFixed(1)} 132 ${(y-h*.82).toFixed(1)}
      Q160 ${(y-h*.6).toFixed(1)} 178 ${y} Z" fill="${c}" opacity=".58"/>`;
    /* le liseré du matin sur la crête */
    s += `<path d="M-10 ${(y-h*.4).toFixed(1)}
      Q34 ${(y-h*.78).toFixed(1)} 72 ${(y-h*.94).toFixed(1)}
      Q104 ${(y-h*1.02).toFixed(1)} 132 ${(y-h*.82).toFixed(1)}"
      stroke="${mel('#ffd8a0','#ffb870',.2)}" stroke-width="1" fill="none" opacity=".5"/>`;
  }
  /* le Garlaban, à droite */
  {
    const d = 12000, y = sol(d), h = px(500, d);
    const c = mel('#66788e', '#d8b498', .46);
    s += `<path d="M360 ${y} Q396 ${(y-h*.5).toFixed(1)} 424 ${(y-h*.86).toFixed(1)}
      Q444 ${(y-h*1.02).toFixed(1)} 462 ${(y-h*.78).toFixed(1)}
      Q480 ${(y-h*.5).toFixed(1)} 490 ${y} Z" fill="${c}" opacity=".5"/>`;
  }

  /* ---------- la colline de Notre-Dame de la Garde ---------- */
  const dg = 1150, yg = sol(dg), hg = px(154, dg), xg = 300;
  {
    const roc  = mel('#3f4c64', '#a8805e', .34);
    const rocC = mel('#75849a', '#e8b88c', .5);
    const rocO = mel('#38425a', '#8a6650', .28);
    /* le profil : pente douce à gauche, escarpé à droite */
    /* le profil : deux versants qui montent vers un plateau sommital */
    const D = `M${xg-208} ${yg}
      C${xg-168} ${(yg-hg*.1).toFixed(1)} ${xg-146} ${(yg-hg*.2).toFixed(1)} ${xg-128} ${(yg-hg*.32).toFixed(1)}
      C${xg-108} ${(yg-hg*.45).toFixed(1)} ${xg-92} ${(yg-hg*.6).toFixed(1)} ${xg-74} ${(yg-hg*.72).toFixed(1)}
      C${xg-62} ${(yg-hg*.81).toFixed(1)} ${xg-54} ${(yg-hg*.9).toFixed(1)} ${xg-46} ${(yg-hg*.95).toFixed(1)}
      L${xg+46} ${(yg-hg*.95).toFixed(1)}
      C${xg+56} ${(yg-hg*.89).toFixed(1)} ${xg+66} ${(yg-hg*.79).toFixed(1)} ${xg+80} ${(yg-hg*.68).toFixed(1)}
      C${xg+102} ${(yg-hg*.52).toFixed(1)} ${xg+124} ${(yg-hg*.34).toFixed(1)} ${xg+152} ${(yg-hg*.2).toFixed(1)}

        height="${(h*.55).toFixed(1)}" fill="${c}"/>`;
      s += `<rect x="${(xp-h*.9).toFixed(1)}" y="${(y-h*1.1).toFixed(1)}" width="${(h*.4).toFixed(1)}"
        height="${(h*.55).toFixed(1)}" fill="${cl}" opacity=".55"/>`;
      /* les deux pavillons d'angle, plus hauts */
      [-.9, .62].forEach(dx =>
        s += `<rect x="${(xp+h*dx).toFixed(1)}" y="${(y-h*1.3).toFixed(1)}" width="${(h*.28).toFixed(1)}"
          height="${(h*.75).toFixed(1)}" fill="${c}"/>`);
      /* le toit */
      s += `<rect x="${(xp-h*.96).toFixed(1)}" y="${(y-h*1.16).toFixed(1)}"
        width="${(h*1.92).toFixed(1)}" height="${(h*.07).toFixed(1)}" fill="${cl}" opacity=".8"/>`;
    }

    /* la cathédrale de la Major : deux clochers et trois coupoles */
    {
      const h = px(48, d), xm = 216;
      const c  = mel('#4a566c', '#cfa080', .34);
      const cl = mel('#8a94a4', '#ffdca8', .48);
      const dome = mel('#3f5560', '#b08868', .34);
      /* la nef à bandes */
      s += `<rect x="${(xm-h*.34).toFixed(1)}" y="${(y-h*.46).toFixed(1)}"
        width="${(h*.68).toFixed(1)}" height="${(h*.46).toFixed(1)}" fill="${c}"/>`;
      s += `<rect x="${(xm-h*.34).toFixed(1)}" y="${(y-h*.46).toFixed(1)}"
        width="${(h*.16).toFixed(1)}" height="${(h*.46).toFixed(1)}" fill="${cl}" opacity=".55"/>`;
      s += `<g fill="${mel('#2f3a4c','#8a6448',.24)}" opacity=".38">`;
      for (let k = 0; k < 3; k++)
        s += `<rect x="${(xm-h*.34).toFixed(1)}" y="${(y-h*.42+k*h*.11).toFixed(1)}"
          width="${(h*.68).toFixed(1)}" height="${(h*.03).toFixed(1)}"/>`;
      s += `</g>`;
      /* la grande coupole */
      s += `<path d="M${(xm-h*.19).toFixed(1)} ${(y-h*.46).toFixed(1)}
        a${(h*.19).toFixed(1)} ${(h*.24).toFixed(1)} 0 0 1 ${(h*.38).toFixed(1)} 0 z" fill="${dome}"/>`;
      s += `<path d="M${xm} ${(y-h*.7).toFixed(1)} v${(-h*.07).toFixed(1)}"
        stroke="${cl}" stroke-width="1"/>`;
      /* les deux clochers */
      [[-.38, .74], [.38, .74]].forEach(([dx, k], i) => {
        const tx = xm + h * dx;
        s += `<rect x="${(tx-h*.085).toFixed(1)}" y="${(y-h*k).toFixed(1)}" width="${(h*.17).toFixed(1)}"
          height="${(h*(k-.06)).toFixed(1)}" fill="${i ? c : mel(c,'#ffdca8',.2)}"/>`;
        s += `<path d="M${(tx-h*.105).toFixed(1)} ${(y-h*k).toFixed(1)}
          a${(h*.105).toFixed(1)} ${(h*.115).toFixed(1)} 0 0 1 ${(h*.21).toFixed(1)} 0 z" fill="${dome}"/>`;
      });
      /* les deux coupoles latérales */
      [[-.2, .5], [.2, .5]].forEach(([dx, k]) =>
        s += `<path d="M${(xm+h*dx-h*.1).toFixed(1)} ${(y-h*k).toFixed(1)}
          a${(h*.1).toFixed(1)} ${(h*.11).toFixed(1)} 0 0 1 ${(h*.2).toFixed(1)} 0 z"
          fill="${dome}" opacity=".9"/>`);
    }

    /* le fort Saint-Jean et sa tour, à l'entrée du port */
    {
      const h = px(26, d), xf = 268;
      const c  = mel('#4a566c', '#d0a480', .42);
      const cl = mel('#8a94a4', '#ffdca8', .48);
      s += `<rect x="${(xf-h*.7).toFixed(1)}" y="${(y-h*.42).toFixed(1)}" width="${(h*1.4).toFixed(1)}"
        height="${(h*.42).toFixed(1)}" fill="${c}"/>`;
      s += `<rect x="${(xf-h*.7).toFixed(1)}" y="${(y-h*.42).toFixed(1)}" width="${(h*.3).toFixed(1)}"
        height="${(h*.42).toFixed(1)}" fill="${cl}" opacity=".5"/>`;
      for (let k = 0; k < 7; k++)
        s += `<rect x="${(xf-h*.66+k*h*.19).toFixed(1)}" y="${(y-h*.47).toFixed(1)}"
          width="${(h*.1).toFixed(1)}" height="${(h*.05).toFixed(1)}" fill="${c}"/>`;
      /* la tour du Roi René */
      s += `<rect x="${(xf+h*.42).toFixed(1)}" y="${(y-h*.98).toFixed(1)}" width="${(h*.26).toFixed(1)}"
        height="${(h*.98).toFixed(1)}" fill="${c}"/>`;
      s += `<rect x="${(xf+h*.42).toFixed(1)}" y="${(y-h*.98).toFixed(1)}" width="${(h*.08).toFixed(1)}"
        height="${(h*.98).toFixed(1)}" fill="${cl}" opacity=".6"/>`;
      for (let k = 0; k < 3; k++)
        s += `<rect x="${(xf+h*.44+k*h*.09).toFixed(1)}" y="${(y-h*1.04).toFixed(1)}"
          width="${(h*.06).toFixed(1)}" height="${(h*.06).toFixed(1)}" fill="${c}"/>`;
    }

    /* la tour de verre du port, moderne, tout à droite */
    {
      const h = px(140, d), xt = 424;
      const v  = mel('#5a6c84', '#c8a888', .3);
      const vl = mel('#94a8bc', '#ffdca8', .42);
      s += `<path d="M${(xt-h*.07).toFixed(1)} ${y.toFixed(1)}
        C${(xt-h*.07).toFixed(1)} ${(y-h*.5).toFixed(1)} ${(xt-h*.04).toFixed(1)} ${(y-h*.8).toFixed(1)} ${(xt-h*.015).toFixed(1)} ${(y-h).toFixed(1)}
        h${(h*.07).toFixed(1)}
        C${(xt+h*.055).toFixed(1)} ${(y-h*.8).toFixed(1)} ${(xt+h*.08).toFixed(1)} ${(y-h*.5).toFixed(1)} ${(xt+h*.08).toFixed(1)} ${y.toFixed(1)} z"
        fill="${v}"/>`;
      s += `<path d="M${(xt-h*.07).toFixed(1)} ${y.toFixed(1)}
        C${(xt-h*.07).toFixed(1)} ${(y-h*.5).toFixed(1)} ${(xt-h*.04).toFixed(1)} ${(y-h*.8).toFixed(1)} ${(xt-h*.015).toFixed(1)} ${(y-h).toFixed(1)}
        h${(h*.022).toFixed(1)} C${(xt-h*.018).toFixed(1)} ${(y-h*.7).toFixed(1)} ${(xt-h*.042).toFixed(1)} ${(y-h*.4).toFixed(1)} ${(xt-h*.042).toFixed(1)} ${y.toFixed(1)} z"
        fill="${vl}" opacity=".65"/>`;
      s += `<g stroke="${vl}" stroke-width=".45" opacity=".3">`;
      for (let k = 1; k < 14; k++)
        s += `<path d="M${(xt-h*.066).toFixed(1)} ${(y-h*k/14).toFixed(1)} h${(h*.145).toFixed(1)}"/>`;
      s += `</g>`;
    }
  }

  /* ---------- la brume qui pose la ville sur l'eau ---------- */
  s += `<rect x="0" y="${(sol(1500)-px(11,1500)).toFixed(1)}" width="${W}"
    height="${px(17,1500).toFixed(1)}" fill="#f0cba0" opacity=".32"/>`;

  /* ---------- le château d'If, posé sur l'eau devant la ville ---------- */
  {
    const d = 620, y = sol(d);
    const roc = mel('#3f4a5e', '#b08868', .38);
    const mur = mel('#8a94a8', '#ffe0ac', .56);
    const murO= mel('#3a4456', '#98704e', .3);
    const xi = 76, hr = px(19, d);
    /* le rocher */
    s += `<path d="M${(xi-hr*1.9).toFixed(1)} ${y.toFixed(1)}
      q${(hr*.7).toFixed(1)} ${(-hr*.66).toFixed(1)} ${(hr*1.9).toFixed(1)} ${(-hr*.74).toFixed(1)}
      q${(hr*1.2).toFixed(1)} ${(hr*.04).toFixed(1)} ${(hr*1.9).toFixed(1)} ${(hr*.7).toFixed(1)} z"
      fill="${roc}"/>`;
    s += `<path d="M${(xi-hr*1.9).toFixed(1)} ${y.toFixed(1)}
      q${(hr*.7).toFixed(1)} ${(-hr*.66).toFixed(1)} ${(hr*1.9).toFixed(1)} ${(-hr*.74).toFixed(1)}
      l${(-hr*.5).toFixed(1)} ${(hr*.74).toFixed(1)} z" fill="${mel(roc,'#ffd8a4',.3)}" opacity=".7"/>`;
    /* le corps du château */
    const yb2 = y - hr * .74, hc = px(16, d);
    s += `<rect x="${(xi-hc*.8).toFixed(1)}" y="${(yb2-hc*.66).toFixed(1)}"
      width="${(hc*1.6).toFixed(1)}" height="${(hc*.66).toFixed(1)}" fill="${murO}"/>`;
    s += `<rect x="${(xi-hc*.8).toFixed(1)}" y="${(yb2-hc*.66).toFixed(1)}"
      width="${(hc*.42).toFixed(1)}" height="${(hc*.66).toFixed(1)}" fill="${mur}" opacity=".85"/>`;
    /* les créneaux */
    for (let k = 0; k < 6; k++)
      s += `<rect x="${(xi-hc*.76+k*hc*.27).toFixed(1)}" y="${(yb2-hc*.74).toFixed(1)}"
        width="${(hc*.15).toFixed(1)}" height="${(hc*.09).toFixed(1)}" fill="${murO}"/>`;
    /* les trois tours rondes */
    [[-.78, .95], [0, 1.12], [.78, .95]].forEach(([dx, k], i) => {
      const tx = xi + hc * dx;
      s += `<rect x="${(tx-hc*.2).toFixed(1)}" y="${(yb2-hc*k).toFixed(1)}"
        width="${(hc*.4).toFixed(1)}" height="${(hc*k).toFixed(1)}" fill="${murO}"/>`;
      s += `<rect x="${(tx-hc*.2).toFixed(1)}" y="${(yb2-hc*k).toFixed(1)}"
        width="${(hc*.13).toFixed(1)}" height="${(hc*k).toFixed(1)}" fill="${mur}" opacity=".85"/>`;
      /* le couronnement */
      s += `<rect x="${(tx-hc*.26).toFixed(1)}" y="${(yb2-hc*(k+.1)).toFixed(1)}"
        width="${(hc*.52).toFixed(1)}" height="${(hc*.1).toFixed(1)}" fill="${murO}"/>`;
      s += `<rect x="${(tx-hc*.26).toFixed(1)}" y="${(yb2-hc*(k+.1)).toFixed(1)}"
        width="${(hc*.52).toFixed(1)}" height="${(hc*.03).toFixed(1)}" fill="${mur}"/>`;
    });
    /* son reflet dans l'eau */
    s += reflet(xi - hr * 1.4, hr * 2.8, y, 16, mel('#3a4454','#8a6c50',.4), .22);
  }

  return s;
}

/* ---- palettes ---- */
const BOIS  = ['#b58f60','#c9a374','#a5825c','#96754a','#8a6a42'];
const CLAIR = '#e4c79c', SOMBRE = '#7a5c38', FOND = '#5c4930';

/* ============================================================
   Le dessin. Tout est paramétré par le niveau.
   Repère : la barque est dessinée dans un cadre 300 x 170,
   la ligne de flottaison est à y = 118.
   ============================================================ */
let uidB = 0;

function barqueQ(n, route){
  const P = PALIERS_B[n-1];
  const L = 76 + n * 5.6;            /* longueur */
  const H = 15 + n * 0.62;           /* creux du bordé au-dessus de l'eau */
  const T = 6 + n * 0.34;            /* tirant d'eau */
  const cx = 150, flot = 122;
  const x0 = cx - L / 2;
  const g = v => (x0 + v).toFixed(1);
  const u = 'b' + (++uidB);
  let s = '';

  /* ---------- la ligne de sheer : le haut du bordé ---------- */
  /* étrave relevée à gauche, creux au milieu, poupe relevée à droite */
  const yEtrave = flot - H * 1.28;
  const yCreux  = flot - H * 0.92;
  const yPoupe  = flot - H * 1.12;
  const sheer = `M${g(0)} ${yEtrave.toFixed(1)}
    C${g(L*.2)} ${(yEtrave + (yCreux-yEtrave)*.9).toFixed(1)} ${g(L*.36)} ${yCreux.toFixed(1)} ${g(L*.54)} ${yCreux.toFixed(1)}
    C${g(L*.74)} ${yCreux.toFixed(1)} ${g(L*.9)} ${(yCreux + (yPoupe-yCreux)*.5).toFixed(1)} ${g(L)} ${yPoupe.toFixed(1)}`;

  /* ---------- la coque complète ---------- */
  const coque = sheer
    + ` L${g(L*.965)} ${(flot + T*.42).toFixed(1)}`
    + ` C${g(L*.78)} ${(flot + T).toFixed(1)} ${g(L*.24)} ${(flot + T).toFixed(1)} ${g(L*.055)} ${(flot + T*.3).toFixed(1)}`
    + ` Z`;

  s += `<defs><clipPath id="${u}"><path d="${coque}"/></clipPath></defs>`;

  /* reflet dans l'eau */
  s += `<ellipse cx="${cx}" cy="${(flot + T*.7).toFixed(1)}" rx="${(L*.5).toFixed(0)}" ry="4"
    fill="#0e4a68" opacity=".2"/>`;

  /* la chaloupe (18+), posée en travers du pont */
  if (n >= 18){
    s += `<g transform="translate(${g(L*.58)},${(yCreux - 3).toFixed(1)})">
      <path d="M0 0 q3 8 10 9 h20 q7 -1 10 -9 q-6 3 -13 3 H13 q-7 0 -13 -3 z" fill="#96754a"/>
      <path d="M-1 -2 q5 4 12 4 h18 q7 0 12 -4 v3 q-5 3 -12 3 H11 q-7 0 -12 -3 z" fill="#c9a374"/></g>`;
  }

  /* ---------- le corps de la coque ---------- */
  s += `<path d="${coque}" fill="${BOIS[2]}"/>`;

  /* les bordages : des courbes parallèles au sheer, découpées par la coque */
  const nb = Math.min(7, 3 + Math.floor(n / 3.4));
  s += `<g clip-path="url(#${u})">`;
  for (let i = 0; i < nb; i++){
    const dy = (H + T) * (i / nb);
    const c = BOIS[i % BOIS.length];
    s += `<path d="${sheer}" transform="translate(0,${dy.toFixed(1)})" fill="none"
      stroke="${c}" stroke-width="${((H + T) / nb * 1.5).toFixed(1)}"/>`;
  }
  /* les coutures calfatées (2+) */
  if (n >= 2){
    for (let i = 1; i < nb; i++){
      const dy = (H + T) * (i / nb);
      s += `<path d="${sheer}" transform="translate(0,${dy.toFixed(1)})" fill="none"
        stroke="#3a2c1e" stroke-width=".9" opacity=".45"/>`;
    }
  }
  /* les œuvres vives, sous la flottaison */
  s += `<rect x="0" y="${flot}" width="300" height="60"
    fill="${n >= 10 ? '#33454f' : '#6d5334'}" opacity="${n >= 10 ? '.9' : '.55'}"/>`;
  /* le bordé doublé (16+) */
  if (n >= 16)
    s += `<path d="${sheer}" transform="translate(0,${(H*.9).toFixed(1)})" fill="none"
      stroke="#6d5334" stroke-width="2.4" opacity=".7"/>`;
  s += `</g>`;

  /* ---------- le liston (5+) ---------- */
  if (n >= 5){
    s += `<path d="${sheer}" fill="none" stroke="${CLAIR}" stroke-width="${(2.4 + n*.06).toFixed(1)}"
      stroke-linecap="round"/>`;
  } else {
    s += `<path d="${sheer}" fill="none" stroke="${BOIS[0]}" stroke-width="2" stroke-linecap="round"/>`;
  }
  /* l'ourlet clair du dessus */
  s += `<path d="${sheer}" transform="translate(0,-1)" fill="none" stroke="#f0dcb4"
    stroke-width="1" opacity=".6"/>`;

  /* ---------- l'étrave et l'étambot ---------- */
  s += `<path d="M${g(0)} ${yEtrave.toFixed(1)} C${g(-2)} ${(yEtrave + H*.7).toFixed(1)}
    ${g(1)} ${(flot).toFixed(1)} ${g(L*.055)} ${(flot + T*.3).toFixed(1)}"
    fill="none" stroke="${SOMBRE}" stroke-width="2.6" stroke-linecap="round"/>`;
  s += `<path d="M${g(L)} ${yPoupe.toFixed(1)} L${g(L*.965)} ${(flot + T*.42).toFixed(1)}"
    stroke="${SOMBRE}" stroke-width="2.6" stroke-linecap="round" fill="none"/>`;

  /* ---------- l'intérieur, vu par-dessus le bordé ---------- */
  s += `<path d="${sheer}" transform="translate(0,2.2)" fill="none" stroke="${FOND}"
    stroke-width="${Math.max(2.2, H*.22).toFixed(1)}"/>`;

  /* ---------- le pont ---------- */
  const pont = (a, b, coul, clair) => {
    s += `<path d="${sheer}" transform="translate(0,2)" fill="none" stroke="${coul}"
      stroke-width="${Math.max(2.4, H*.2).toFixed(1)}"
      stroke-dasharray="${(L*(b-a)).toFixed(0)} ${L.toFixed(0)}"
      stroke-dashoffset="${(-L*a).toFixed(0)}"/>`;
    s += `<path d="${sheer}" transform="translate(0,.6)" fill="none" stroke="${clair}"
      stroke-width="1.2" stroke-dasharray="${(L*(b-a)).toFixed(0)} ${L.toFixed(0)}"
      stroke-dashoffset="${(-L*a).toFixed(0)}"/>`;
  };
  if (n >= 11)      pont(.03, .95, '#b8946a', '#dfc094');   /* tillac : pont continu */
  else if (n >= 6)  pont(.04, .34, '#b8946a', '#dfc094');   /* demi-pont avant */

  /* ---------- le banc de nage (3+) ---------- */
  if (n >= 3 && n < 11)
    s += `<rect x="${g(L*.4)}" y="${(yCreux + 1.6).toFixed(1)}" width="${(L*.22).toFixed(0)}"
      height="${Math.max(2, H*.14).toFixed(1)}" rx="1" fill="#8a6a42"/>`;

  /* ---------- les avirons (4+ jusqu'au pont) ---------- */
  if (n >= 4 && n < 11){
    [[L*.34, 'av-1'], [L*.62, 'av-2']].forEach(([dx, cl]) => {
      const ax = +g(dx), ay = yCreux + 1;
      const dep = (flot + 7) - ay;      /* la pelle plonge sous la flottaison */
      /* le tolet, point de pivot */
      s += `<rect x="${(ax-1.4).toFixed(1)}" y="${(ay-3.6).toFixed(1)}" width="2.8" height="4.4"
        rx="1" fill="#6d5334"/>`;
      s += `<g class="aviron ${cl}" style="transform-origin:${ax}px ${ay.toFixed(1)}px">`;
      /* le manche, vers l'intérieur et vers le haut */
      s += `<path d="M${ax} ${ay.toFixed(1)} l-13 -6" stroke="#96754a"
        stroke-width="2.2" stroke-linecap="round"/>`;
      s += `<circle cx="${(ax-13).toFixed(1)}" cy="${(ay-6).toFixed(1)}" r="1.6" fill="#8a6a42"/>`;
      /* le fût, vers l'extérieur et vers l'eau */
      s += `<path d="M${ax} ${ay.toFixed(1)} l21 ${dep.toFixed(1)}" stroke="#a5825c"
        stroke-width="2.4" stroke-linecap="round"/>`;
      /* la pelle */
      s += `<path d="M${(ax+19).toFixed(1)} ${(ay+dep-2).toFixed(1)}
        q5.4 1 7 6 q1.6 5.4 -2 7.4 q-3.8 2 -6.8 -1.6 q-3 -3.6 -1.6 -8.6 z" fill="#c9a374"/>`;
      s += `<path d="M${(ax+19.6).toFixed(1)} ${(ay+dep-1).toFixed(1)}
        q4.4 1.4 5.6 5.4" stroke="#dfc094" stroke-width="1.2" fill="none"/>`;
      s += `</g>`;
    });
  }

  /* ---------- le panneau de cale (12+) ---------- */
  if (n >= 12){
    s += `<rect x="${g(L*.46)}" y="${(yCreux - 1.4).toFixed(1)}" width="${(L*.15).toFixed(0)}"
      height="${Math.max(2.6, H*.12).toFixed(1)}" rx="1" fill="#8a6a42" stroke="#6d5334" stroke-width=".8"/>`;
  }

  /* ---------- le rouf (14+) ---------- */
  if (n >= 14){
    const rx = +g(L*.62), ry = yCreux - 1, rh = H*.5, rw = L*.2;
    s += `<path d="M${rx} ${ry.toFixed(1)} h${rw.toFixed(0)} v-${rh.toFixed(1)} h-${rw.toFixed(0)} z" fill="#c9a374"/>`;
    s += `<path d="M${(rx-2).toFixed(1)} ${(ry-rh).toFixed(1)} h${(rw+4).toFixed(0)} l-2.4 -3.4 h-${(rw-.8).toFixed(0)} z" fill="#8a4a3a"/>`;
    s += `<rect x="${(rx+2.6).toFixed(1)}" y="${(ry-rh+2.4).toFixed(1)}" width="${(rw*.26).toFixed(1)}"
      height="${(rh*.42).toFixed(1)}" fill="#6d8fa4" opacity=".85"/>`;
    s += `<rect x="${(rx+rw*.56).toFixed(1)}" y="${(ry-rh+2.4).toFixed(1)}" width="${(rw*.26).toFixed(1)}"
      height="${(rh*.42).toFixed(1)}" fill="#6d8fa4" opacity=".85"/>`;
  }

  /* ---------- le grand mât (7+) ---------- */
  const mxP = n >= 13 ? .34 : .46;
  if (n >= 7){
    const mx = +g(L * mxP);
    const pied = yCreux + 1;
    const mh = n >= 8 ? 46 + n * 2.3 : 32;
    s += `<path d="M${mx} ${pied.toFixed(1)} v-${mh.toFixed(0)}" stroke="#8a6a42"
      stroke-width="${(2 + n*.07).toFixed(1)}" stroke-linecap="round"/>`;
    s += `<path d="M${(mx-.7).toFixed(1)} ${pied.toFixed(1)} v-${mh.toFixed(0)}" stroke="#c9a374"
      stroke-width=".9" opacity=".7"/>`;
    const ay = pied - mh;

    if (n === 7){
      s += `<path class="voile" d="M${mx} ${(ay+5).toFixed(1)} q15 7 20 21 q-13 5 -20 4 z" fill="#ddd2b6"/>`;
      s += `<path d="M${mx} ${(ay+5).toFixed(1)} q15 7 20 21 q-8 3 -12 3 z" fill="#f0e8d2"/>`;
    } else {
      /* la voile latine : antenne inclinée sur toute la hauteur */
      s += `<path d="M${(mx-20).toFixed(1)} ${(ay + mh*.5).toFixed(1)} L${(mx+34).toFixed(1)} ${(ay-4).toFixed(1)}"
        stroke="#a5825c" stroke-width="2.2" stroke-linecap="round"/>`;
      s += `<path class="voile" d="M${(mx-18).toFixed(1)} ${(ay + mh*.48).toFixed(1)}
        L${(mx+32).toFixed(1)} ${(ay-3).toFixed(1)}
        Q${(mx+14).toFixed(1)} ${(ay + mh*.56).toFixed(1)} ${(mx+2).toFixed(1)} ${pied.toFixed(1)} Z" fill="#e4dbc0"/>`;
      s += `<path d="M${(mx-18).toFixed(1)} ${(ay + mh*.48).toFixed(1)}
        L${(mx+32).toFixed(1)} ${(ay-3).toFixed(1)}
        Q${(mx+20).toFixed(1)} ${(ay + mh*.38).toFixed(1)} ${(mx+8).toFixed(1)} ${(ay + mh*.62).toFixed(1)} Z" fill="#f6f0dc"/>`;
      s += `<g stroke="#c9bfa2" stroke-width=".7" opacity=".65">
        <path d="M${(mx-6).toFixed(1)} ${(ay+mh*.5).toFixed(1)} L${(mx+9).toFixed(1)} ${(pied-5).toFixed(1)}"/>
        <path d="M${(mx+9).toFixed(1)} ${(ay+mh*.26).toFixed(1)} L${(mx+15).toFixed(1)} ${(pied-11).toFixed(1)}"/></g>`;
      s += `<g stroke="#c9b58c" stroke-width=".8" opacity=".75">
        <path d="M${mx} ${(ay+5).toFixed(1)} L${g(L*.1)} ${(yCreux-1).toFixed(1)}"/>
        <path d="M${mx} ${(ay+5).toFixed(1)} L${g(L*.86)} ${(yCreux-1).toFixed(1)}"/></g>`;
    }
  }

  /* ---------- le foc et son beaupré (13+) ---------- */
  if (n >= 13){
    const bx = +g(-8), by = yEtrave - 3;
    const mx = +g(L*mxP), mh = 46 + n*2.3, ay = yCreux + 1 - mh;
    s += `<path d="M${g(L*.02)} ${(yEtrave+2).toFixed(1)} L${bx} ${by.toFixed(1)}"
      stroke="#a5825c" stroke-width="2.2" stroke-linecap="round"/>`;
    s += `<path class="voile" d="M${bx} ${by.toFixed(1)} L${mx} ${(ay + mh*.2).toFixed(1)}
      Q${(bx+17).toFixed(1)} ${(ay + mh*.66).toFixed(1)} ${(bx+12).toFixed(1)} ${(yEtrave+4).toFixed(1)} Z"
      fill="#eee6cc"/>`;
    s += `<path d="M${bx} ${by.toFixed(1)} L${mx} ${(ay + mh*.2).toFixed(1)}
      Q${(bx+24).toFixed(1)} ${(ay + mh*.5).toFixed(1)} ${(bx+20).toFixed(1)} ${(ay + mh*.8).toFixed(1)} Z"
      fill="#f8f2de"/>`;
  }

  /* ---------- le tapecul (15+) ---------- */
  if (n >= 15){
    const mx2 = +g(L*.86), mh2 = 30 + n, pied2 = yCreux + 1;
    s += `<path d="M${mx2} ${pied2.toFixed(1)} v-${mh2.toFixed(0)}" stroke="#8a6a42"
      stroke-width="2.2" stroke-linecap="round"/>`;
    s += `<path d="M${(mx2-12).toFixed(1)} ${(pied2 - mh2*.44).toFixed(1)} L${(mx2+18).toFixed(1)} ${(pied2 - mh2 + 2).toFixed(1)}"
      stroke="#a5825c" stroke-width="1.9" stroke-linecap="round"/>`;
    s += `<path class="voile" d="M${(mx2-10).toFixed(1)} ${(pied2 - mh2*.42).toFixed(1)}
      L${(mx2+16).toFixed(1)} ${(pied2 - mh2 + 3).toFixed(1)}
      Q${(mx2+5).toFixed(1)} ${(pied2 - mh2*.4).toFixed(1)} ${(mx2+2).toFixed(1)} ${pied2.toFixed(1)} Z"
      fill="#e4dbc0"/>`;
  }

  /* ---------- le safran (9+) ---------- */
  if (n >= 9){
    s += `<path d="M${g(L*.97)} ${(flot - H*.5).toFixed(1)} q6 4 6 ${(T*1.1).toFixed(1)}
      q0 ${(T*.5).toFixed(1)} -6 ${(T*.5).toFixed(1)} z" fill="#7a5c38"/>`;
    s += `<path d="M${g(L*.94)} ${(yPoupe + 2).toFixed(1)} l13 -6" stroke="#a5825c"
      stroke-width="2" stroke-linecap="round"/>`;
  }

  /* ---------- le treuil (17+) ---------- */
  if (n >= 17){
    const tx = +g(L*.44);
    s += `<rect x="${(tx-4.4).toFixed(1)}" y="${(yCreux - 6).toFixed(1)}" width="9" height="6" rx="2" fill="#5c6a74"/>`;
    s += `<circle cx="${tx}" cy="${(yCreux - 3).toFixed(1)}" r="2.2" fill="#8a9299"/>`;
  }

  /* ---------- le pavillon (19+) ---------- */
  if (n >= 19){
    const mx = +g(L * mxP), mh = 46 + n * 2.3, tete = yCreux + 1 - mh;
    /* la drisse et le petit mât de pavillon */
    s += `<path d="M${mx} ${tete.toFixed(1)} v-9" stroke="#8a6a42" stroke-width="1.6" stroke-linecap="round"/>`;
    /* le pavillon, qui claque */
    s += `<g class="pavillon" style="transform-origin:${mx}px ${(tete-8).toFixed(1)}px">`;
    s += `<path d="M${mx} ${(tete-9).toFixed(1)} q9 1.6 17 -1.4 q-2 4 0 7.4 q-8 3 -17 1.4 z" fill="#c74a33"/>`;
    s += `<path d="M${mx} ${(tete-9).toFixed(1)} q9 1.6 17 -1.4 q-1 2 -.6 3.6 q-8 2.4 -16.4 1 z" fill="#e0684a"/>`;
    s += `</g>`;
  }

  /* ---------- le nom peint (20) ---------- */
  if (n >= 20)
    s += `<text x="${g(L*.1)}" y="${(flot - H*.34).toFixed(1)}" font-family="Bebas Neue,sans-serif"
      font-size="8.4" letter-spacing="1.2" fill="#f2e6c8" opacity=".85">LA ZIZOUIN</text>`;

  /* ---------- l'eau, selon l'allure ---------- */
  /* la proue est à gauche : le sillage traîne derrière, donc à droite */
  if (route){
    const nv = Math.max(2, Math.round(P.vit * 1.6));
    for (let i = 0; i < nv; i++)
      s += `<path class="sillage sl${i % 3}" d="M${g(L + 4 + i*4)} ${(flot + 1 + i*2.6).toFixed(1)}
        q${(16+i*7).toFixed(0)} 2 ${(30+i*13).toFixed(0)} 0"
        stroke="#fff" stroke-width="${(1.6 - i*.16).toFixed(2)}" fill="none"
        opacity="${(.44 - i*.05).toFixed(2)}"/>`;
    /* la moustache d'étrave, elle, est bien à l'avant */
    s += `<path class="etrave" d="M${g(-3)} ${(flot - 1).toFixed(1)} q-9 4 -19 3"
      stroke="#fff" stroke-width="2" fill="none" opacity=".55"/>`;
    s += `<path class="etrave e2" d="M${g(1)} ${(flot + 2.4).toFixed(1)} q-8 4 -17 3"
      stroke="#fff" stroke-width="1.4" fill="none" opacity=".36"/>`;
    /* le remous sous la poupe */
    s += `<ellipse class="remous" cx="${g(L + 2)}" cy="${(flot + 3).toFixed(1)}" rx="9" ry="2.4"
      fill="#fff" opacity=".24"/>`;
  } else {
    /* au mouillage : la chaîne d'ancre à l'étrave */
    s += `<path d="M${g(L*.03)} ${(yEtrave + 4).toFixed(1)} q-4 8 -3 16"
      stroke="#6d6a62" stroke-width="1.4" fill="none" stroke-dasharray="2 1.6"/>`;
    s += `<path d="M${g(-4)} ${(flot + 2).toFixed(1)} q22 3 40 0"
      stroke="#fff" stroke-width="1.2" fill="none" opacity=".26"/>`;
  }

  return s;
}


/* ============================================================
   LE POINTU — la barque marseillaise
   Coque à deux pointes, capian relevé, voile latine
   ============================================================ */

function barque(){
  /* le moteur dessine dans un cadre 300 x 170, flottaison à y=122.
     On le pose à sa distance et on l'échelonne selon la charte.
     Deux groupes : l'extérieur porte la position, l'intérieur le tangage. */
  const d = 52, y = sol(d), niveau = 1;
  const longVoulue = px(5.2, d);
  const longDessin = 76 + niveau * 5.6;
  const k = longVoulue / longDessin;
  const x = 202;
  return `<g transform="translate(${x.toFixed(1)},${y.toFixed(1)}) scale(${k.toFixed(4)})">`
    + `<g class="barque" transform="translate(-150,-122)">`
    + barqueQ(niveau, false) + `</g></g>`;
}


/* ---------- l'eau que la barque déplace ---------- */
function clapot(){
  const d = 52, y = sol(d), L = px(5.2, d);
  const x = 202;
  let s = `<g class="clapot">`;
  /* l'ombre sous la coque */
  s += `<ellipse cx="${x}" cy="${(y+1.4).toFixed(1)}" rx="${(L*.54).toFixed(1)}"
    ry="${(L*.055).toFixed(1)}" fill="#0e2a44" opacity=".24"/>`;
  /* trois rides concentriques, décalées */
  [[0, .9, 1], [1, 1.25, .7], [2, 1.62, .45]].forEach(([i, k, op]) =>
    s += `<ellipse class="ride r${i}" cx="${x}" cy="${(y+2).toFixed(1)}"
      rx="${(L*.42*k).toFixed(1)}" ry="${(L*.05*k).toFixed(1)}" fill="none"
      stroke="#ffe6b8" stroke-width="${(1.1 - i*.24).toFixed(2)}" opacity="${(.34*op).toFixed(2)}"/>`);
  return s + `</g>`;
}

/* ============================================================
   LE QUAI — pierre de taille, pavés, ferrures
   ============================================================ */

/* ---------- la projection : un point du sol vers l'écran ----------
   X est la distance latérale en mètres, d la distance en avant.
   Les fuyantes convergent vers le milieu, à l'horizon. */
const FUITE = 240;
const projX = (X, d) => FUITE + X * FOCALE / d;
const projY = d => sol(d);

/* le soleil est bas à gauche : tout projette vers la droite et vers nous */
function ombre(x, y, larg, haut){
  const lg = haut * 1.9, dx = haut * 2.2;
  return `<path d="M${x.toFixed(1)} ${y.toFixed(1)} h${larg.toFixed(1)}
    l${dx.toFixed(1)} ${(lg*.3).toFixed(1)} h${(-larg).toFixed(1)} z"
    fill="${OMBRE}" opacity=".17"/>`;
}

/* ---------- le sol ---------- */
function pave(){
  const yb = sol(D_BORD);
  let s = '';

  /* --- l'ombre du quai sur l'eau, et l'algue à la ligne d'eau --- */
  s += `<path d="M0 ${(yb-4).toFixed(1)} h${W} v9 H0 Z" fill="#0e2a44" opacity=".2"/>`;
  s += `<path d="M0 ${(yb-1.6).toFixed(1)} q60 2.6 128 .8 q66 -1.8 132 1.4 q64 2.4 128 -.6
    L${W} ${(yb+2.4).toFixed(1)} H0 Z" fill="#3f5a44" opacity=".28"/>`;

  /* --- le corps du quai --- */
  s += `<rect x="0" y="${yb.toFixed(1)}" width="${W}" height="${(BAS-yb+8).toFixed(1)}"
    fill="#9a8c70"/>`;

  /* --- la margelle : de gros blocs de pierre de taille --- */
  const hm = px(.55, D_BORD);
  s += `<rect x="0" y="${yb.toFixed(1)}" width="${W}" height="${hm.toFixed(1)}"
    fill="${clair('#e0d0ac', .4)}"/>`;
  /* l'arête, brûlée par le soleil rasant */
  s += `<rect x="0" y="${yb.toFixed(1)}" width="${W}" height="${(hm*.18).toFixed(1)}"
    fill="#fff0c8" opacity=".8"/>`;
  /* les joints entre les blocs */
  for (let i = 0; i < 9; i++){
    const x = 6 + i * 54 + rnd(i) * 9;
    s += `<path d="M${x.toFixed(1)} ${yb.toFixed(1)} v${hm.toFixed(1)}"
      stroke="${sombre('#a89478', .2)}" stroke-width="1.4" opacity=".55"/>`;
  }
  /* l'usure : des éclats sur l'arête */
  for (let i = 0; i < 16; i++){
    const x = rnd(i*7+3) * W, w = 3 + rnd(i*11+5) * 9;
    s += `<rect x="${x.toFixed(1)}" y="${yb.toFixed(1)}" width="${w.toFixed(1)}"
      height="${(hm*.3).toFixed(1)}" fill="${sombre('#b8a488', .18)}"
      opacity="${(.2+rnd(i+2)*.3).toFixed(2)}"/>`;
  }
  /* la trace mouillée du ressac */
  s += `<rect x="0" y="${(yb+hm).toFixed(1)}" width="${W}" height="${(hm*.9).toFixed(1)}"
    fill="#8a7c60" opacity=".16"/>`;

  /* --- le pavage : chaque pavé est un vrai carré posé au sol --- */
  const PAVE = .26;                       /* un pavé fait 26 cm de côté */
  let dr = D_BORD, i = 0;
  while (dr > 11.4 && i < 40){
    const dr2 = dr - PAVE;
    const y1 = projY(dr) + (i === 0 ? hm * 1.9 : 0), y2 = projY(dr2);
    if (y1 > BAS) break;
    if (y2 - y1 < .6){ dr = dr2; i++; continue; }
    /* la largeur latérale qu'il faut couvrir à cette distance */
    const Xmax = (W * .62) * dr / FOCALE + PAVE * 2;
    const n = Math.ceil(Xmax / PAVE);
    /* les rangées se décalent d'un demi-pavé, une sur deux */
    const dec = (i % 2) * PAVE * .5;
    for (let c = -n; c <= n; c++){
      const Xa = c * PAVE + dec, Xb = Xa + PAVE * .94;
      /* les quatre coins du pavé, chacun projeté à sa distance */
      const xa1 = projX(Xa, dr),  xb1 = projX(Xb, dr);
      const xa2 = projX(Xa, dr2), xb2 = projX(Xb, dr2);
      if (xb1 < -30 && xb2 < -30) continue;
      if (xa1 > W + 30 && xa2 > W + 30) continue;
      const t = rnd2(i, c + 60);
      s += `<path d="M${xa1.toFixed(1)} ${y1.toFixed(1)} L${xb1.toFixed(1)} ${y1.toFixed(1)}
        L${xb2.toFixed(1)} ${y2.toFixed(1)} L${xa2.toFixed(1)} ${y2.toFixed(1)} Z"
        fill="${t > .72 ? '#e2d6b8' : t > .48 ? '#d0c4a4' : t > .24 ? '#bfb192' : '#b2a586'}"
        opacity="${(.7+t*.28).toFixed(2)}"/>`;
      /* l'arête du haut, qui prend le rasant */
      if (y2 - y1 > 3)
        s += `<path d="M${xa1.toFixed(1)} ${y1.toFixed(1)} L${xb1.toFixed(1)} ${y1.toFixed(1)}
          L${(xb1 + (xb2-xb1)*.24).toFixed(1)} ${(y1 + (y2-y1)*.24).toFixed(1)}
          L${(xa1 + (xa2-xa1)*.24).toFixed(1)} ${(y1 + (y2-y1)*.24).toFixed(1)} Z"
          fill="#ffeec8" opacity="${(.16+t*.16).toFixed(2)}"/>`;
    }
    dr = dr2; i++;
  }

  /* --- les rails de portique, enfoncés dans le pavage --- */
  /* deux rails écartés de 6 m, qui fuient vers l'horizon */
  [-3, 3].forEach(X => {
    const a = projX(X, D_BORD), b = projX(X, 11.2);
    const la = px(.14, D_BORD), lb = px(.14, 11.2);
    s += `<path d="M${(a-la/2).toFixed(1)} ${projY(D_BORD).toFixed(1)}
      L${(a+la/2).toFixed(1)} ${projY(D_BORD).toFixed(1)}
      L${(b+lb/2).toFixed(1)} ${(BAS+30).toFixed(1)} L${(b-lb/2).toFixed(1)} ${(BAS+30).toFixed(1)} Z"
      fill="${sombre('#8a7458',.24)}" opacity=".34"/>`;
    s += `<path d="M${(a-la/2).toFixed(1)} ${projY(D_BORD).toFixed(1)}
      L${(a-la/6).toFixed(1)} ${projY(D_BORD).toFixed(1)}
      L${(b-lb/6).toFixed(1)} ${(BAS+30).toFixed(1)} L${(b-lb/2).toFixed(1)} ${(BAS+30).toFixed(1)} Z"
      fill="#ffdca8" opacity=".32"/>`;
  });

  /* --- les flaques du petit matin --- */
  [[19, 2.4, 1, .7], [16, -3.6, 1.25, .9], [14, 2.8, 1.35, .6], [12.6, -.9, 1.7, .8]]
    .forEach(([dd, X, k, ap]) => {
      const y = projY(dd), x = projX(X, dd), rx = px(1.3, dd) * k, ry = px(.16, dd) * k;
      s += `<ellipse cx="${x}" cy="${y.toFixed(1)}" rx="${(rx*1.08).toFixed(1)}"
        ry="${(ry*1.3).toFixed(1)}" fill="#8a7454" opacity="${(.1*ap).toFixed(2)}"/>`;
      s += `<ellipse cx="${x}" cy="${y.toFixed(1)}" rx="${rx.toFixed(1)}" ry="${ry.toFixed(1)}"
        fill="#7d8fa4" opacity="${(.2*ap).toFixed(2)}"/>`;
      s += `<ellipse cx="${(x - rx*.22).toFixed(1)}" cy="${(y - ry*.12).toFixed(1)}"
        rx="${(rx*.46).toFixed(1)}" ry="${(ry*.5).toFixed(1)}"
        fill="#ffd8a0" opacity="${(.28*ap).toFixed(2)}"/>`;
    });

  /* --- l'herbe qui pousse entre les pavés --- */
  for (let j = 0; j < 34; j++){
    const dd = 12.4 + rnd(j*5+2) * 8.4;
    const y = projY(dd), x = projX((rnd(j*7+3) - .5) * 13, dd), h = px(.16, dd);
    if (y > BAS || x < -20 || x > W + 20) continue;
    s += `<g stroke="${sombre('#7d8a5c', .2)}" stroke-width="${(h*.14).toFixed(2)}"
      fill="none" stroke-linecap="round" opacity=".5">`;
    for (let k = 0; k < 4; k++)
      s += `<path d="M${x.toFixed(1)} ${y.toFixed(1)} q${((k-1.5)*h*.3).toFixed(1)} ${(-h*.6).toFixed(1)}
        ${((k-1.5)*h*.6).toFixed(1)} ${(-h*(.7+rnd(j+k)*.5)).toFixed(1)}"/>`;
    s += `</g>`;
  }

  /* --- les grandes ombres venues du hors-champ --- */
  /* les ombres des portiques hors-champ : des bandes au sol, projetées.
     Le soleil est bas à gauche : elles filent vers la droite en s'écartant. */
  s += `<g opacity=".12">`;
  [[-9.2, 1.5], [-3.4, 1.1], [2.6, 1.7], [8.2, 1.2]].forEach(([X0, larg]) => {
    const P = [];
    for (let dd = D_BORD; dd > 11.2; dd -= .9){
      /* l'ombre s'éloigne latéralement à mesure qu'elle vient vers nous */
      const glisse = (D_BORD - dd) * .58;
      P.push([projX(X0 + glisse, dd), projY(dd), projX(X0 + larg + glisse, dd)]);
    }
    if (!P.length) return;
    let p = `M${P[0][0].toFixed(1)} ${P[0][1].toFixed(1)} `;
    P.forEach(([xa, y]) => p += `L${xa.toFixed(1)} ${y.toFixed(1)} `);
    for (let k = P.length - 1; k >= 0; k--) p += `L${P[k][2].toFixed(1)} ${P[k][1].toFixed(1)} `;
    s += `<path d="${p}Z" fill="${OMBRE}"/>`;
  });
  s += `</g>`;
  return s;
}

/* ---------- une bitte de fonte ---------- */
function bitte(x, d){
  const y = sol(d), h = px(.66, d), l = px(.52, d);
  let s = ombre(x - l*.5, y, l, h);
  /* le socle carré, boulonné */
  s += `<path d="M${(x-l*.66).toFixed(1)} ${y.toFixed(1)} h${(l*1.32).toFixed(1)}
    v${(-h*.14).toFixed(1)} h${(-l*1.32).toFixed(1)} z" fill="${sombre('#3f3a32',.24)}"/>`;
  s += `<path d="M${(x-l*.66).toFixed(1)} ${(y-h*.14).toFixed(1)} h${(l*.4).toFixed(1)}
    v${(h*.14).toFixed(1)} h${(-l*.4).toFixed(1)} z" fill="${clair('#6d6558',.4)}"/>`;
  [-.5, .5].forEach(dx =>
    s += `<circle cx="${(x+l*dx).toFixed(1)}" cy="${(y-h*.07).toFixed(1)}"
      r="${(l*.055).toFixed(2)}" fill="${clair('#8a8074',.4)}"/>`);
  /* le fût, renflé */
  s += `<path d="M${(x-l*.42).toFixed(1)} ${(y-h*.14).toFixed(1)}
    C${(x-l*.5).toFixed(1)} ${(y-h*.5).toFixed(1)} ${(x-l*.34).toFixed(1)} ${(y-h*.82).toFixed(1)} ${(x-l*.3).toFixed(1)} ${(y-h).toFixed(1)}
    h${(l*.6).toFixed(1)}
    C${(x+l*.34).toFixed(1)} ${(y-h*.82).toFixed(1)} ${(x+l*.5).toFixed(1)} ${(y-h*.5).toFixed(1)} ${(x+l*.42).toFixed(1)} ${(y-h*.14).toFixed(1)} z"
    fill="${sombre('#4a4438',.28)}"/>`;
  /* la joue au soleil */
  s += `<path d="M${(x-l*.42).toFixed(1)} ${(y-h*.14).toFixed(1)}
    C${(x-l*.5).toFixed(1)} ${(y-h*.5).toFixed(1)} ${(x-l*.34).toFixed(1)} ${(y-h*.82).toFixed(1)} ${(x-l*.3).toFixed(1)} ${(y-h).toFixed(1)}
    h${(l*.16).toFixed(1)}
    C${(x-l*.2).toFixed(1)} ${(y-h*.78).toFixed(1)} ${(x-l*.32).toFixed(1)} ${(y-h*.48).toFixed(1)} ${(x-l*.26).toFixed(1)} ${(y-h*.14).toFixed(1)} z"
    fill="${clair('#7d7466',.5)}"/>`;
  /* le champignon */
  s += `<ellipse cx="${x}" cy="${(y-h).toFixed(1)}" rx="${(l*.62).toFixed(1)}"
    ry="${(l*.22).toFixed(1)}" fill="${sombre('#5c5548',.24)}"/>`;
  s += `<ellipse cx="${x}" cy="${(y-h-l*.16).toFixed(1)}" rx="${(l*.62).toFixed(1)}"
    ry="${(l*.22).toFixed(1)}" fill="${clair('#8a8074',.44)}"/>`;
  /* la rouille qui coule */
  s += `<path d="M${(x-l*.1).toFixed(1)} ${(y-h*.9).toFixed(1)} q${(-l*.06).toFixed(1)} ${(h*.4).toFixed(1)}
    ${(-l*.02).toFixed(1)} ${(h*.76).toFixed(1)}" stroke="#8a5030" stroke-width="${(l*.07).toFixed(2)}"
    fill="none" opacity=".3"/>`;
  return s;
}

/* ---------- un anneau scellé dans la pierre ---------- */
function anneau(x, d){
  const y = sol(d), r = px(.2, d);
  let s = `<ellipse cx="${x}" cy="${(y+r*.2).toFixed(1)}" rx="${(r*1.2).toFixed(1)}"
    ry="${(r*.34).toFixed(1)}" fill="${OMBRE}" opacity=".2"/>`;
  s += `<ellipse cx="${x}" cy="${y.toFixed(1)}" rx="${r.toFixed(1)}" ry="${(r*.44).toFixed(1)}"
    fill="none" stroke="${sombre('#4a4438',.24)}" stroke-width="${(r*.26).toFixed(2)}"/>`;
  s += `<ellipse cx="${(x-r*.1).toFixed(1)}" cy="${(y-r*.08).toFixed(1)}" rx="${(r*.86).toFixed(1)}"
    ry="${(r*.36).toFixed(1)}" fill="none" stroke="${clair('#8a8074',.42)}"
    stroke-width="${(r*.1).toFixed(2)}" opacity=".8"/>`;
  /* la platine scellée */
  s += `<rect x="${(x-r*.24).toFixed(1)}" y="${(y-r*.5).toFixed(1)}" width="${(r*.48).toFixed(1)}"
    height="${(r*.3).toFixed(1)}" rx="${(r*.08).toFixed(2)}" fill="${sombre('#5c5548',.2)}"/>`;
  return s;
}

/* ---------- l'échelle qui descend à l'eau ---------- */
function echelle(x, d){
  const y = sol(d), l = px(.42, d), h = px(2.6, d);
  let s = `<g>`;
  /* les deux montants, qui plongent */
  [-1, 1].forEach(sg =>
    s += `<path d="M${(x + sg*l*.5).toFixed(1)} ${(y-l*.5).toFixed(1)} v${h.toFixed(1)}"
      stroke="${sombre('#4a4438',.24)}" stroke-width="${(l*.16).toFixed(2)}" stroke-linecap="round"/>`);
  s += `<path d="M${(x - l*.5 - l*.06).toFixed(1)} ${(y-l*.5).toFixed(1)} v${h.toFixed(1)}"
    stroke="${clair('#8a8074',.42)}" stroke-width="${(l*.06).toFixed(2)}" opacity=".8"/>`;
  /* les barreaux */
  for (let k = 0; k < 6; k++)
    s += `<path d="M${(x-l*.5).toFixed(1)} ${(y - l*.4 + k*h*.17).toFixed(1)} h${l.toFixed(1)}"
      stroke="${sombre('#4a4438',.22)}" stroke-width="${(l*.13).toFixed(2)}" stroke-linecap="round"/>`;
  /* la crosse qui passe par-dessus la margelle */
  s += `<path d="M${(x - l*.5).toFixed(1)} ${(y-l*.5).toFixed(1)}
    q0 ${(-l*.6).toFixed(1)} ${(l*.5).toFixed(1)} ${(-l*.6).toFixed(1)}
    q${(l*.5).toFixed(1)} 0 ${(l*.5).toFixed(1)} ${(l*.6).toFixed(1)}"
    stroke="${sombre('#4a4438',.24)}" stroke-width="${(l*.16).toFixed(2)}" fill="none"/>`;
  return s + `</g>`;
}

/* ---------- une bouée de défense pendue au bord ---------- */
function defense(x, d, ton){
  const y = sol(d), r = px(.32, d);
  let s = `<path d="M${x} ${(y-r*.4).toFixed(1)} v${(-r*1.1).toFixed(1)}"
    stroke="${sombre('#8a7454',.2)}" stroke-width="${(r*.14).toFixed(2)}"/>`;
  s += `<ellipse cx="${x}" cy="${(y+r*.6).toFixed(1)}" rx="${(r*.62).toFixed(1)}"
    ry="${(r*.9).toFixed(1)}" fill="${sombre(ton, .26)}"/>`;
  s += `<ellipse cx="${(x-r*.2).toFixed(1)}" cy="${(y+r*.44).toFixed(1)}" rx="${(r*.28).toFixed(1)}"
    ry="${(r*.5).toFixed(1)}" fill="${clair(ton, .5)}" opacity=".85"/>`;
  return s;
}

/* ---------- un cordage lové ---------- */
function cordage(x, d){
  const y = sol(d), r = px(.62, d);
  let s = `<ellipse cx="${x}" cy="${y.toFixed(1)}" rx="${(r*1.24).toFixed(1)}"
    ry="${(r*.32).toFixed(1)}" fill="${OMBRE}" opacity=".15"/>`;
  for (let k = 4; k >= 0; k--)
    s += `<ellipse cx="${x}" cy="${(y - k*r*.14).toFixed(1)}" rx="${(r*(1-k*.08)).toFixed(1)}"
      ry="${(r*(.3-k*.022)).toFixed(1)}" fill="none"
      stroke="${k%2 ? clair('#d0bc94',.44) : sombre('#b0996e',.2)}"
      stroke-width="${(r*.15).toFixed(2)}"/>`;
  return s;
}

/* ---------- une caisse de pêche empilable ---------- */
function caisse(x, d, dy, ton){
  const y = sol(d) + (dy || 0), h = px(.32, d), l = px(.66, d);
  let s = `<g>`;
  if (!dy) s += ombre(x, y, l, h);
  s += `<path d="M${x.toFixed(1)} ${(y-h).toFixed(1)} h${l.toFixed(1)}
    l${(-h*.34).toFixed(1)} ${(-h*.3).toFixed(1)} h${(-l+h*.34).toFixed(1)} z"
    fill="${clair(ton, .5)}"/>`;
  s += `<rect x="${x.toFixed(1)}" y="${(y-h).toFixed(1)}" width="${l.toFixed(1)}"
    height="${h.toFixed(1)}" rx="${(h*.1).toFixed(2)}" fill="${sombre(ton, .3)}"/>`;
  s += `<rect x="${x.toFixed(1)}" y="${(y-h).toFixed(1)}" width="${(l*.16).toFixed(1)}"
    height="${h.toFixed(1)}" fill="${clair(ton, .42)}"/>`;
  /* les ajours */
  s += `<g fill="${sombre('#2f2a22',.2)}" opacity=".3">`;
  for (let k = 0; k < 5; k++)
    s += `<rect x="${(x + l*.12 + k*l*.16).toFixed(1)}" y="${(y-h*.66).toFixed(1)}"
      width="${(l*.07).toFixed(1)}" height="${(h*.4).toFixed(1)}" rx="${(l*.03).toFixed(2)}"/>`;
  s += `</g>`;
  return s + `</g>`;
}

/* ---------- la scène complète ---------- */
function scene(){
  let s = defs() + ciel() + marseilleFond();

  s += eau();

  /* ta barque, au milieu de l'eau, dans le chemin du soleil */
  s += barque();
  /* le clapot qu'elle fait, par-dessus */
  s += clapot();

  /* ---------- le quai, nu ---------- */
  s += pave();

  /* le voile doré : un dégradé centré sur le soleil, très léger */
  s += `<defs><radialGradient id="b-voile" cx="0.5" cy="0.5">
    <stop offset="0%"   stop-color="#ffd79a" stop-opacity=".2"/>
    <stop offset="42%"  stop-color="#ffc888" stop-opacity=".09"/>
    <stop offset="100%" stop-color="#ffc070" stop-opacity="0"/></radialGradient>
    <radialGradient id="b-vig" cx="0.5" cy="0.34" r="0.82">
    <stop offset="50%" stop-color="#101c30" stop-opacity="0"/>
    <stop offset="100%" stop-color="#0c1626" stop-opacity=".3"/></radialGradient></defs>`;
  s += `<ellipse cx="${SOLEIL.x}" cy="${SOLEIL.y}" rx="340" ry="250" fill="url(#b-voile)"/>`;
  s += `<rect x="0" y="${HAUT}" width="${W}" height="${(BAS-HAUT).toFixed(1)}"
    fill="url(#b-vig)"/>`;
  return s;
}


/* ---------- l'avatar du joueur ---------- */
/* on affiche d'abord un carré vide, puis on le remplit dès que la fiche arrive */
function poserAvatar(d){
  const el = document.getElementById('av');
  if (!el) return;
  const nom = (d && d.pseudo) || '';
  el.innerHTML = BD.avatarSVG(d)
    + (nom ? '<span class="nm">' + nom + '</span>' : '');
  el.classList.add('pret');
}

(async () => {
  try {
    const d = await BD.charger();
    if (!d){ location.href = 'index.html'; return; }
    /* si le joueur n'a pas fini son inscription, on le renvoie où il en est */
    if (d.etape && d.etape !== 'jeu' && BD.PAGES[d.etape]){
      location.href = BD.PAGES[d.etape];
      return;
    }
    poserAvatar(d);
  } catch (e){
    /* hors ligne ou pas connecté : on laisse le carré vide plutôt que de planter */
    console.warn('avatar indisponible', e);
  }
})();

/* ---------- la scène ---------- */
function dessiner(){
  const v = cadrer(innerWidth, innerHeight);
  document.getElementById('sc').innerHTML =
    '<svg viewBox="0 ' + v.y.toFixed(1) + ' ' + W + ' ' + v.h.toFixed(1) + '" '
    + 'preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">'
    + scene() + '</svg>';
}
dessiner();
let t = null;
addEventListener('resize', () => { clearTimeout(t); t = setTimeout(dessiner, 200); });
</script>
