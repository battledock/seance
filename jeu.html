<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#f2efe7">
<title>Battle Dock — Le port</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--fond:#f2efe7;--carte:#fff;--bord:#e2ddd2;--encre:#22201c;--doux:#75705f;
      --ocre:#c2711a;--vert:#2f8f66;--rouge:#c74a33;--violet:#6d4fa8}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none}
html,body{height:100%;overflow:hidden}
body{background:var(--fond);color:var(--encre);font-family:'Barlow',system-ui,sans-serif;
     display:flex;flex-direction:column}
@keyframes respireOs{0%,100%{opacity:.55}50%{opacity:.9}}
.charge .hn b,.charge .hn span,.charge .hk b,.charge .hk span,
.charge .jauges .t span:first-child,.charge .jauges .t span:last-child{
  background:#e6e1d6 !important;color:transparent !important;border-radius:6px;
  animation:respireOs 1.4s ease-in-out infinite;display:inline-block;min-width:40px}
.charge .hn b{display:block;width:58%;height:15px}
.charge .hn span{display:block;width:74%;height:11px;margin-top:5px}
.charge .hk b{display:block;width:76px;height:17px;margin-left:auto}
.charge .hk span{display:block;width:44px;height:9px;margin-top:4px;margin-left:auto}
.charge .face{background:#e6e1d6;color:transparent}
.charge .face .niv{background:#e6e1d6;color:transparent}
.charge .jauges .p i{width:0 !important}
.pret .hn b,.pret .hn span,.pret .hk b,.pret .hk span,
.pret .jauges .t span,.pret .face,.pret .face .niv{
  background:none !important;color:inherit !important;animation:none;width:auto;height:auto;min-width:0}
.pret .face .niv{background:var(--ocre) !important;color:#fff !important}

.hud{flex:0 0 auto;padding:calc(env(safe-area-inset-top) + 9px) 13px 10px;
  background:var(--carte);border-bottom:1px solid var(--bord)}
.hl{display:flex;align-items:center;gap:10px}
.face{flex:0 0 42px;width:42px;height:42px;border-radius:11px;background:#dfe8ee;
  border:1px solid var(--bord);position:relative;display:flex;align-items:center;justify-content:center;font-size:19px}
.face .niv{position:absolute;right:-1px;bottom:-1px;background:var(--ocre);color:#fff;
  font-family:'Bebas Neue',sans-serif;font-size:11px;padding:0 4px;border-radius:5px}
.hn{flex:1;min-width:0}
.hn b{display:block;font-size:14.5px;font-weight:600}
.hn span{font-size:10.5px;color:var(--doux)}
.hk{text-align:right}
.hk b{display:block;font-family:'Courier Prime',monospace;font-size:16px;color:var(--ocre)}
.hk span{font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--doux)}
.jauges{display:flex;gap:7px;margin-top:9px}
.jauges > div{flex:1}
.jauges .t{display:flex;justify-content:space-between;font-size:8.5px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--doux);margin-bottom:3px}
.jauges .p{height:5px;border-radius:3px;background:#e6e2d8;overflow:hidden}
.jauges .p i{display:block;height:100%}
.pied{flex:0 0 auto;padding:0 13px calc(env(safe-area-inset-bottom) + 12px)}
.principal{width:100%;background:var(--ocre);border:0;border-radius:14px;padding:16px;
  font-family:'Barlow',sans-serif;font-size:12.5px;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;color:#fff;cursor:pointer;display:flex;align-items:center;
  justify-content:center;gap:9px}
.principal:active{background:#9a570f}
.principal:disabled{opacity:.45}
.journal{margin-top:8px;font-size:11.5px;color:var(--doux);text-align:center;line-height:1.4;min-height:16px}
.journal b{color:var(--encre);font-weight:600}
.lg{position:absolute;left:0;right:0;bottom:0;padding:26px 11px 11px;
  background:linear-gradient(180deg,transparent,rgba(10,22,34,.85));color:#fff;pointer-events:none}
.lg b{display:block;font-family:'Bebas Neue',sans-serif;font-size:20px;line-height:1.05;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg .sous{display:block;font-size:10.5px;color:rgba(255,255,255,.82);margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg .lignes{margin-top:8px;display:flex;flex-direction:column;gap:4px}
.lg .li{display:flex;align-items:center;gap:7px;font-size:11.5px;color:rgba(255,255,255,.92)}
.lg .li i{width:6px;height:6px;border-radius:50%;flex:0 0 6px}
.lg .li em{font-style:normal;margin-left:auto;font-family:'Courier Prime',monospace;font-size:10.5px;
  color:rgba(255,255,255,.7)}
.puce{position:absolute;top:10px;left:10px;background:rgba(255,255,255,.94);
  border:1px solid rgba(34,32,28,.1);border-radius:9px;padding:4px 9px;font-size:10.5px;font-weight:600}
.pastille{position:absolute;top:10px;right:10px;min-width:20px;height:20px;border-radius:11px;
  background:var(--rouge);color:#fff;font-size:11.5px;font-weight:600;display:flex;
  align-items:center;justify-content:center;padding:0 6px;box-shadow:0 2px 8px rgba(199,74,51,.4)}
.pastille.calme{background:rgba(255,255,255,.94);color:var(--doux);
  border:1px solid rgba(34,32,28,.1);box-shadow:none}
.houle{animation:derive 13s linear infinite}
.houle:nth-of-type(2n){animation-duration:17s;animation-direction:reverse}
@keyframes derive{to{transform:translateX(56px)}}
.ecume{animation:scint 3.8s ease-in-out infinite}
@keyframes scint{0%,100%{opacity:.1}50%{opacity:.6}}
.feu{animation:clign 3.4s infinite}
.feu2{animation:clign 5.2s infinite .8s}
@keyframes clign{0%,44%{opacity:1}54%,94%{opacity:.14}100%{opacity:1}}
.crochet{animation:pend 7s ease-in-out infinite;transform-origin:top center}
@keyframes pend{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}
.navire,.remorqueur{animation:flotte 6s ease-in-out infinite}
@keyframes flotte{0%,100%{transform:translateY(0) rotate(-.5deg)}50%{transform:translateY(-2px) rotate(.5deg)}}
.camion{animation:roule 16s linear infinite}
.camion2{animation:roule 21s linear infinite 3s}
@keyframes roule{0%{transform:translateX(-70px)}100%{transform:translateX(400px)}}
.pedalo{animation:flotte 4.2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none !important}}



.scene{flex:1;min-height:0;position:relative;padding:12px 13px 6px;display:flex;flex-direction:column}
.grand{flex:1;min-height:0;border-radius:18px;overflow:hidden;border:1px solid var(--bord);
  box-shadow:0 6px 24px rgba(34,32,28,.12);position:relative;background:#dceaf2;touch-action:pan-y}
.rail{display:flex;height:100%;transition:transform .44s cubic-bezier(.3,.85,.3,1)}
.rail.suit{transition:none}
.page{flex:0 0 100%;position:relative;overflow:hidden}
.page > .toile{position:absolute;inset:0}
.page svg{position:absolute;inset:0;width:100%;height:100%}

/* les pastilles du bas, seule indication */
.chantier{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:7;
  display:flex;align-items:center;gap:7px;
  background:rgba(255,255,255,.93);border:1px dashed #b9b1a0;border-radius:22px;
  padding:6px 13px;font-size:11px;font-weight:600;color:var(--doux);white-space:nowrap;
  box-shadow:0 3px 12px rgba(34,32,28,.12)}
.chantier .pt{width:7px;height:7px;border-radius:50%;background:#e8a04a;
  animation:respireCh 1.9s ease-in-out infinite}
@keyframes respireCh{0%,100%{opacity:.35}50%{opacity:1}}
.indice{display:flex;justify-content:center;align-items:center;gap:13px;padding:15px 0 6px}
.indice button{width:22px;height:22px;border:0;background:none;padding:0;cursor:pointer;
  display:flex;align-items:center;justify-content:center}
.indice button::before{content:"";width:7px;height:7px;border-radius:50%;
  background:none;box-shadow:inset 0 0 0 1.4px #c4bdae;
  transition:box-shadow .34s cubic-bezier(.3,.9,.3,1), background .34s, transform .34s}
.indice button.on::before{background:var(--ocre);box-shadow:inset 0 0 0 1.4px var(--ocre),
  0 0 0 4px rgba(194,113,26,.14);transform:scale(1.16)}

/* le bateau */
.pontBateau{position:absolute;inset:0;display:flex;flex-direction:column;
  background:linear-gradient(170deg,#e8eef2,#f4efe4)}
.pontBateau .haut{flex:1;min-height:0;position:relative}
.pontBateau .haut svg{position:absolute;inset:0;width:100%;height:100%}
.calePont{position:absolute;left:11px;right:11px;bottom:11px;display:flex;gap:7px;z-index:3}
.emp{flex:1;aspect-ratio:1;max-height:64px;border-radius:12px;border:1.5px dashed rgba(255,255,255,.55);
  background:rgba(10,22,34,.28);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:1px;color:#fff}
.emp.plein{border-style:solid;border-color:transparent}
.emp .ic{font-size:17px}
.emp .n{font-size:9px;font-weight:600;text-align:center;padding:0 3px;line-height:1.1}
.emp.vide .ic{opacity:.45;font-size:15px}
</style>
</head>
<body class="charge">
<header class="hud">
  <div class="hl">
    <span class="face" id="face"><span class="niv" id="niv">1</span></span>
    <span class="hn"><b id="pseudo">Docker</b><span id="h-lieu">Marseille — à quai</span></span>
    <span class="hk"><b id="h-caisse">0,00 €</b><span>Caisse</span></span>
  </div>
  <div class="jauges">
    <div><div class="t"><span>Énergie</span><span id="v-en">— %</span></div>
      <div class="p"><i id="i-en" style="width:0%;background:linear-gradient(90deg,#2f8f66,#5cc194)"></i></div></div>
    <div><div class="t"><span id="l-niv">Niveau 1</span><span id="v-xp">— / —</span></div>
      <div class="p"><i id="i-xp" style="width:0%;background:linear-gradient(90deg,#c2711a,#e8a94e)"></i></div></div>
    <div><div class="t"><span>Réputation</span><span id="v-rep">—</span></div>
      <div class="p"><i id="i-rep" style="width:0%;background:linear-gradient(90deg,#6d4fa8,#a487d8)"></i></div></div>
  </div>
</header>

<div class="scene">
  <div class="grand" id="grand">
    <div class="rail" id="rail">
      <div class="page"><span class="chantier"><span class="pt"></span>Design en cours de création</span><div class="toile" id="tPort"></div>
        <span class="puce" id="pcPort"></span><span class="pastille" id="paPort"></span>
        <span class="lg"><b id="tiPort"></b><span class="sous" id="soPort"></span>
          <span class="lignes" id="liPort"></span></span></div>

      <div class="page"><span class="chantier"><span class="pt"></span>Design en cours de création</span><div class="toile" id="tMer"></div>
        <span class="puce" id="pcMer"></span><span class="pastille" id="paMer"></span>
        <span class="lg"><b id="tiMer"></b><span class="sous" id="soMer"></span>
          <span class="lignes" id="liMer"></span></span></div>

      <div class="page"><span class="chantier"><span class="pt"></span>Design en cours de création</span><div class="pontBateau">
        <div class="haut" id="tBat"></div>
        <div class="calePont" id="calePont"></div></div>
        <span class="puce" id="pcBat"></span><span class="pastille" id="paBat"></span>
        <span class="lg" style="padding-bottom:84px"><b id="tiBat"></b>
          <span class="sous" id="soBat"></span></span></div>

      <div class="page"><span class="chantier"><span class="pt"></span>Design en cours de création</span><div class="toile" id="tHangar"></div>
        <span class="puce" id="pcHan"></span><span class="pastille" id="paHan"></span>
        <span class="lg"><b id="tiHan"></b><span class="sous" id="soHan"></span>
          <span class="lignes" id="liHan"></span></span></div>
    </div>
  </div>
  <div class="indice" id="indice"></div>
</div>

<div class="pied">
  <button class="principal" id="agir"></button>
  <p class="journal" id="journal">Fais glisser pour changer d'écran.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="bd.js"></script>
<script>
const $ = id => document.getElementById(id);
/* =========================================================
   Le port : moteur de rendu par niveaux
   niveau 0 : côte nue → niveau 5 : port complet
   ========================================================= */
const rnd = s => { const x = Math.sin(s * 127.1) * 43758.5; return x - Math.floor(x); };

const DEFS = `<defs>
<linearGradient id="ciel" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0%" stop-color="#4f9bcc"/><stop offset="26%" stop-color="#83bdde"/>
  <stop offset="54%" stop-color="#bcd9ea"/><stop offset="78%" stop-color="#e6e2d8"/>
  <stop offset="100%" stop-color="#f7dcaf"/></linearGradient>
<linearGradient id="mer" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0%" stop-color="#93d8e0"/><stop offset="18%" stop-color="#5cb4cd"/>
  <stop offset="52%" stop-color="#2d81a6"/><stop offset="100%" stop-color="#0e4363"/></linearGradient>
<linearGradient id="bassin" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0%" stop-color="#6dbfd4"/><stop offset="100%" stop-color="#1c5f82"/></linearGradient>
<linearGradient id="quai" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0%" stop-color="#efe9db"/><stop offset="42%" stop-color="#ddd5c2"/>
  <stop offset="100%" stop-color="#c4bba6"/></linearGradient>
<linearGradient id="colline" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0%" stop-color="#e2ddcd"/><stop offset="100%" stop-color="#bcb7a4"/></linearGradient>
<radialGradient id="soleil"><stop offset="0%" stop-color="#fff9e6" stop-opacity="1"/>
  <stop offset="38%" stop-color="#ffe6b4" stop-opacity=".5"/>
  <stop offset="100%" stop-color="#ffd9a0" stop-opacity="0"/></radialGradient>
<linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#f2a83a"/><stop offset="45%" stop-color="#e0913a"/>
  <stop offset="100%" stop-color="#b06a1e"/></linearGradient>
<linearGradient id="metalG" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#8fa2ad"/><stop offset="50%" stop-color="#6d808c"/>
  <stop offset="100%" stop-color="#4e5f6a"/></linearGradient>
<linearGradient id="halo" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0%" stop-color="#fff3d0" stop-opacity=".5"/>
  <stop offset="100%" stop-color="#fff3d0" stop-opacity="0"/></linearGradient>
</defs>`;

/* ---------- ciel et fond, communs ---------- */
function fond(n){
  let s = `<rect width="480" height="240" fill="url(#ciel)"/>`;
  s += `<ellipse cx="392" cy="46" rx="120" ry="54" fill="url(#soleil)"/>`;
  s += `<circle cx="392" cy="42" r="16" fill="#fffdf2"/>`;
  for (let i = 0; i < 11; i++){
    const cx = rnd(i+2)*520, cy = 14 + rnd(i+9)*38, w = 26 + rnd(i)*46;
    s += `<g opacity="${(.18 + rnd(i+5)*.2).toFixed(2)}" fill="#fff">
      <ellipse cx="${cx.toFixed(0)}" cy="${cy.toFixed(0)}" rx="${w.toFixed(0)}" ry="5"/>
      <ellipse cx="${(cx+w*.34).toFixed(0)}" cy="${(cy-4).toFixed(0)}" rx="${(w*.5).toFixed(0)}" ry="4.4"/></g>`;
  }
  /* collines : deux plans */
  s += `<path d="M0 104 L44 84 L92 98 L142 76 L196 94 L248 72 L302 90 L356 76 L410 92 L480 82 L480 150 L0 150 Z"
    fill="#c6d2d8" opacity=".75"/>`;
  s += `<path d="M0 116 L52 98 L106 112 L162 92 L220 108 L276 88 L334 106 L392 92 L446 108 L480 100 L480 152 L0 152 Z"
    fill="url(#colline)"/>`;
  for (let i = 0; i < 52; i++)
    s += `<ellipse cx="${(rnd(i)*480).toFixed(0)}" cy="${(96 + rnd(i+30)*52).toFixed(0)}" rx="3" ry="2.4"
      fill="#93a583" opacity="${(.18+rnd(i+7)*.26).toFixed(2)}"/>`;
  /* la ville au loin, apparaît dès le niveau 1 */
  if (n >= 1){
    const murs = ['#f2e5cd','#ead9ba','#f5ecdb','#e4d2b2'];
    const toits = ['#c4714a','#b4643e','#cf7d52','#a95a36'];
    for (let i = 0; i < 22; i++){
      const x = i*22 - 6, h = 12 + rnd(i+40)*16, y = 132 - h;
      if (x > 150 && x < 340) continue;
      s += `<rect x="${x}" y="${y.toFixed(0)}" width="20" height="${h.toFixed(0)}" fill="${murs[i%4]}"/>`;
      s += `<path d="M${x-2} ${y.toFixed(0)} h24 l-3 -4 h-18 z" fill="${toits[i%4]}"/>`;
      for (let k = 0; k < 2; k++)
        s += `<rect x="${x+4+k*8}" y="${(y+5).toFixed(0)}" width="5" height="6" fill="#7c9cb0" opacity=".8"/>`;
    }
  }
  return s;
}

/* ---------- la mer et le bassin ---------- */
function eau(n){
  let s = `<rect x="0" y="152" width="480" height="88" fill="url(#mer)"/>`;
  s += `<path d="M0 158 q66 6 134 1 q68 -5 132 3 q60 5 116 -3 q52 -4 98 2 v-9 H0 Z" fill="#a8e4e8" opacity=".28"/>`;
  for (let i = 0; i < 5; i++)
    s += `<path class="houle" d="M-50 ${164+i*11} q28 -4 56 0 t56 0 t56 0 t56 0 t56 0 t56 0 t56 0 t56 0 t56 0 t56 0"
      stroke="#fff" stroke-width="${(1.5-i*.16).toFixed(2)}" fill="none" opacity="${(.34-i*.05).toFixed(2)}"/>`;
  for (let i = 0; i < 14; i++)
    s += `<ellipse class="ecume" cx="${(rnd(i+31)*480).toFixed(0)}" cy="${(166+rnd(i+41)*66).toFixed(0)}"
      rx="${(3+rnd(i)*7).toFixed(1)}" ry="1.2" fill="#fff" opacity="${(.2+rnd(i+4)*.3).toFixed(2)}"/>`;
  return s;
}

/* ---------- pièces du port ---------- */
function quai(x, y, w, h){
  let s = `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#quai)"/>`;
  s += `<rect x="${x}" y="${y}" width="${w}" height="3" fill="#f7f2e6"/>`;
  s += `<rect x="${x}" y="${y+h-3}" width="${w}" height="3" fill="#a89e88"/>`;
  for (let i = 0; i * 16 < w; i++)
    s += `<rect x="${x + i*16}" y="${y+3}" width="1.4" height="${h-6}" fill="#c0b6a0" opacity=".7"/>`;
  return s;
}
function bollard(x, y){
  return `<path d="M${x} ${y} q0 -7 5 -7 q5 0 5 7 z" fill="#4a5560"/>
    <ellipse cx="${x+5}" cy="${y-7}" rx="5" ry="2" fill="#5f6c78"/>`;
}
function conteneur(x, y, w, h, c, o){
  let s = `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="1" fill="${c}"/>`;
  s += `<rect x="${x}" y="${y}" width="${w}" height="${(h*.22).toFixed(1)}" fill="#fff" opacity=".16"/>`;
  s += `<rect x="${x}" y="${y+h-h*.2}" width="${w}" height="${(h*.2).toFixed(1)}" fill="${o}" opacity=".55"/>`;
  for (let i = 1; i * 7 < w; i++)
    s += `<rect x="${x + i*7}" y="${y+1}" width="1.2" height="${h-2}" fill="${o}" opacity=".5"/>`;
  return s;
}
function pileConteneurs(x, sol, cols, rangs, graine){
  const C = [['#2f7fb0','#1a527a'],['#4f8f68','#2f5f42'],['#b06a3a','#7c4522'],
             ['#8a5a9c','#5c3a6c'],['#c2711a','#8a4d0e'],['#5c7f8f','#3a5a68']];
  let s = '';
  for (let c = 0; c < cols; c++){
    const h = 1 + Math.floor(rnd(graine + c) * rangs);
    for (let r = 0; r < h; r++){
      const t = C[Math.floor(rnd(graine + c*7 + r*3) * C.length)];
      s += conteneur(x + c*22, sol - (r+1)*10, 20, 9, t[0], t[1]);
    }
  }
  return s;
}
function portique(x, sol, h, ouvert){
  const ecart = 30, fleche = 46;
  let s = `<g class="portique">`;
  s += `<rect x="${x-10}" y="${sol-2}" width="${ecart+fleche+22}" height="2.4" fill="#8c8272"/>`;
  /* deux jambes en A */
  s += `<path d="M${x-3} ${sol} L${x+1} ${sol-h} h4 L${x+7} ${sol} z" fill="url(#metalG)"/>`;
  s += `<path d="M${x+ecart-3} ${sol} L${x+ecart+1} ${sol-h} h4 L${x+ecart+7} ${sol} z" fill="url(#metalG)"/>`;
  s += `<path d="M${x+3} ${sol-h*.5} L${x+ecart+3} ${sol-h*.78} M${x+ecart+3} ${sol-h*.5} L${x+3} ${sol-h*.78}"
    stroke="#6d808c" stroke-width="1.6"/>`;
  s += `<rect x="${x-2}" y="${sol-h*.5}" width="${ecart+8}" height="2.4" fill="#6d808c"/>`;
  /* poutre horizontale */
  s += `<rect x="${x-14}" y="${sol-h-7}" width="${ecart+fleche+24}" height="6" rx="1" fill="url(#metal)"/>`;
  s += `<rect x="${x-14}" y="${sol-h-7}" width="${ecart+fleche+24}" height="1.8" fill="#ffc86a" opacity=".5"/>`;
  for (let i = 0; i < 7; i++){
    const px = x - 10 + i*(ecart+fleche+18)/7;
    s += `<path d="M${px.toFixed(1)} ${sol-h-7} l${((ecart+fleche+18)/14).toFixed(1)} 7"

  }
  /* contrepoids côté terre */
  s += `<rect x="${x-19}" y="${sol-h-13}" width="11" height="8" rx="1" fill="#5c6a74"/>`;

  s += `<rect x="${x+6}" y="${sol-h-16}" width="16" height="9" rx="1.5" fill="#2f3f4a"/>`;
  s += `<rect x="${x+8}" y="${sol-h-14}" width="12" height="4.4" fill="#8fd0ee" opacity=".7"/>`;
  /* chariot suspendu */
  const cx = x + (ouvert ? ecart + 34 : 14);
  s += `<rect x="${cx-5}" y="${sol-h-5}" width="10" height="4" fill="#4e5f6a"/>`;
  s += `<g class="crochet"><path d="M${cx} ${sol-h-1} V${sol-h+22}" stroke="#4e5f6a" stroke-width="1.2"/>`;
  s += `<rect x="${cx-8}" y="${sol-h+22}" width="16" height="8" rx="1" fill="#2f7fb0"/>`;
  s += `<rect x="${cx-8}" y="${sol-h+22}" width="16" height="1.8" fill="#fff" opacity=".22"/></g>`;
  s += `<circle class="feu" cx="${x+ecart+fleche+6}" cy="${sol-h-10}" r="2.2" fill="#e04a33"/>`;
  return s + `</g>`;
}

function hangar(x, sol, w, h, nom){

  for (let i = 1; i * 12 < w; i++)
    s += `<rect x="${x + i*12}" y="${sol-h}" width="1.6" height="${h}" fill="#b4bcb8" opacity=".8"/>`;
  s += `<rect x="${x+w*.3}" y="${sol-h*.62}" width="${w*.4}" height="${h*.62}" fill="#5a6a72"/>`;

function navire(x, y, taille, c){

  s += `<rect x="${x+6*taille}" y="${y-17*taille}" width="${8*taille}" height="${6*taille}" fill="#f2eee2"/>`;

  for (let i = 0; i < 6; i++)
    for (let r = 0; r < (i % 2 ? 2 : 1); r++){
      const t = C[(i+r) % C.length];
      s += conteneur(x + (26 + i*11)*taille, y - (5 + r*7)*taille, 10*taille, 6*taille, t[0], t[1]);
    }
  s += `<rect x="${x+w-6*taille}" y="${y-14*taille}" width="${5*taille}" height="${9*taille}" fill="${c}"/>`;

/* ============ le port, par niveau ============ */
function port(n){
  let s = fond(n);

  /* le bassin se creuse dès le niveau 2 */
  if (n >= 2){
    s += `<path d="M96 152 h268 v46 h-268 z" fill="url(#bassin)"/>`;
  }

  s += eau(n);

  /* --- niveau 0 : une côte nue --- */
  if (n === 0){
    s += `<path d="M0 152 h480 v14 H0 Z" fill="#cfc7b2"/>`;
    for (let i = 0; i < 26; i++)
      s += `<ellipse cx="${(rnd(i)*480).toFixed(0)}" cy="${(156+rnd(i+5)*8).toFixed(0)}"
        rx="${(3+rnd(i+2)*6).toFixed(1)}" ry="${(1.4+rnd(i+3)*1.6).toFixed(1)}" fill="#b4ab96"/>`;
    s += `<path d="M0 166 h480 v74 H0 Z" fill="#a89f88" opacity=".22"/>`;
    return s;
  }

  /* --- le quai principal --- */
  s += quai(0, 152, 480, 18);
  if (n >= 2){
    /* le bassin découpe le quai */
    s += `<rect x="96" y="152" width="268" height="46" fill="url(#bassin)"/>`;
    s += `<rect x="96" y="152" width="268" height="2.4" fill="#8fd0dc" opacity=".6"/>`;
    s += quai(0, 152, 96, 18);
    s += quai(364, 152, 116, 18);
    s += `<rect x="0" y="196" width="480" height="44" fill="url(#quai)"/>`;
    s += `<rect x="0" y="196" width="480" height="3" fill="#f7f2e6"/>`;
    for (let i = 0; i < 30; i++)
      s += `<rect x="${i*16}" y="199" width="1.4" height="41" fill="#c0b6a0" opacity=".55"/>`;
    /* margelles du bassin */
    s += `<rect x="92" y="150" width="6" height="48" fill="#c4bba6"/>`;
    s += `<rect x="362" y="150" width="6" height="48" fill="#c4bba6"/>`;
  } else {
    s += `<rect x="0" y="170" width="480" height="70" fill="url(#quai)"/>`;
    for (let i = 0; i < 30; i++)
      s += `<rect x="${i*16}" y="173" width="1.4" height="67" fill="#c0b6a0" opacity=".55"/>`;
  }

  /* marquages au sol */
  if (n >= 1){
    s += `<g fill="#d9b23a" opacity=".6">`;
    for (let i = 0; i < 12; i++) s += `<rect x="${8+i*40}" y="${n>=2?206:180}" width="24" height="3.4"/>`;
    s += `</g>`;
  }
  if (n >= 3){
    s += `<g stroke="#8c8272" stroke-width="1.6" opacity=".5" stroke-dasharray="7 6">
      <path d="M0 ${n>=2?222:196} H480"/></g>`;
  }

  /* bollards */
  const solQuai = n >= 2 ? 152 : 170;
  for (let i = 0; i < 9; i++){
    const x = 14 + i*54;
    if (n >= 2 && x > 88 && x < 366) continue;
    s += bollard(x, solQuai);
  }

  /* --- niveau 1 : un quai, une grue mobile, quelques caisses --- */
  if (n >= 1){
    s += pileConteneurs(28, 196, 2, 2, 3);
    s += grueMobile(150, 194, .9);
    s += `<g><rect x="316" y="180" width="30" height="14" rx="2" fill="#8a6a4a"/>
      <rect x="316" y="180" width="30" height="3" fill="#a5825c"/></g>`;
  }

  /* --- niveau 2 : le bassin, un premier portique, un hangar --- */
  if (n >= 2){
    s += portique(124, 152, 52, false);
    s += hangar(382, 196, 88, 40, 'HANGAR 1');
    s += pileConteneurs(6, 196, 3, 3, 11);
    s += remorqueur(300, 176);
  }

  /* --- niveau 3 : deux portiques, navire à quai, plus de stock --- */
  if (n >= 3){
    s += navire(140, 168, 1, '#c74a33');
    s += portique(232, 152, 56, true);
    s += hangar(276, 196, 96, 44, 'HANGAR 2');
    s += pileConteneurs(6, 240, 4, 4, 21);
    s += grueMobile(238, 236, 1);
  }

  /* --- niveau 4 : capitainerie, digue, phare, trafic --- */
  if (n >= 4){
    s += digue(0, 148, 92);
    s += phare(74, 148);
    s += capitainerie(392, 196);
    s += portique(300, 152, 60, false);
    s += navire(378, 172, .74, '#2f7fb0');
    s += pileConteneurs(112, 240, 5, 4, 31);
    s += `<g class="camion"><rect x="176" y="226" width="30" height="12" rx="2" fill="#4f8f68"/>
      <rect x="206" y="222" width="16" height="16" rx="2" fill="#3f7a56"/>
      <circle cx="186" cy="239" r="3.4" fill="#2b3038"/><circle cx="214" cy="239" r="3.4" fill="#2b3038"/></g>`;
  }

  /* --- niveau 5 : tout tourne --- */
  if (n >= 5){
    s += portique(52, 152, 58, true);
    s += navire(30, 166, .68, '#4f8f68');
    s += pileConteneurs(240, 240, 6, 5, 41);
    s += grueMobile(400, 236, 1.05);
    s += `<g class="camion2"><rect x="60" y="226" width="30" height="12" rx="2" fill="#c2711a"/>
      <rect x="90" y="222" width="16" height="16" rx="2" fill="#9a570f"/>
      <circle cx="70" cy="239" r="3.4" fill="#2b3038"/><circle cx="98" cy="239" r="3.4" fill="#2b3038"/></g>`;
    s += remorqueur(214, 178);
    /* halos des projecteurs */
    s += `<g opacity=".45"><path d="M138 96 L116 152 h44 z" fill="url(#halo)"/>
      <path d="M246 92 L224 152 h44 z" fill="url(#halo)"/>
      <path d="M314 88 L292 152 h44 z" fill="url(#halo)"/></g>`;
  }

  return s;
}

function svgHangar(){
  let s = DEFS + `<rect width="480" height="240" fill="#e6e2d6"/>`;
  /* charpente */
  s += `<path d="M0 30 L240 -4 L480 30 L480 44 L240 10 L0 44 Z" fill="#b8b0a0"/>`;
  s += `<g stroke="#c8c0ae" stroke-width="3">`;
  for (let i = 0; i < 7; i++) s += `<path d="M${20+i*74} 36 V196"/>`;
  s += `</g>`;
  s += `<g stroke="#cfc8b6" stroke-width="2" opacity=".7">
    <path d="M0 62 H480 M0 86 H480"/></g>`;
  /* verrières */
  for (let i = 0; i < 4; i++)
    s += `<rect x="${44+i*112}" y="44" width="64" height="26" rx="3" fill="#bfe0ea" opacity=".55"/>`;
  /* mur du fond */
  s += `<rect x="0" y="96" width="480" height="100" fill="#dcd6c6"/>`;
  s += `<g stroke="#cbc4b2" stroke-width="1.4">`;
  for (let i = 0; i < 16; i++) s += `<path d="M${i*30} 96 V196"/>`;
  s += `</g>`;
  /* sol */
  s += `<rect x="0" y="196" width="480" height="44" fill="#c8c0ac"/>`;
  s += `<rect x="0" y="196" width="480" height="2.6" fill="#e2dccc"/>`;
  s += `<g fill="#d9b23a" opacity=".5">`;
  for (let i = 0; i < 8; i++) s += `<rect x="${14+i*60}" y="204" width="28" height="3.4"/>`;
  s += `</g>`;
  /* trois postes de travail */
  const P = [[42,'#7fb8d0','🧼'],[196,'#c9a83a','🍶'],[350,'#8a9a72','🪢']];
  P.forEach(([x, c], i) => {
    /* établi */
    s += `<rect x="${x}" y="150" width="92" height="10" rx="2" fill="#a5825c"/>`;
    s += `<rect x="${x}" y="150" width="92" height="3" fill="#c49a6c"/>`;
    s += `<rect x="${x+6}" y="160" width="7" height="36" fill="#8a6a4a"/>`;
    s += `<rect x="${x+79}" y="160" width="7" height="36" fill="#8a6a4a"/>`;
    /* cuve ou machine */
    s += `<rect x="${x+14}" y="120" width="42" height="30" rx="3" fill="${c}"/>`;
    s += `<rect x="${x+14}" y="120" width="42" height="7" rx="3" fill="#fff" opacity=".22"/>`;
    s += `<rect x="${x+22}" y="106" width="9" height="14" fill="#8c8272"/>`;
    s += `<circle cx="${x+26.5}" cy="103" r="5" fill="#a5988a"/>`;
    /* caisses produites */
    for (let k = 0; k < 2 + i; k++)
      s += `<rect x="${x+62 + (k%2)*13}" y="${186 - Math.floor(k/2)*12}" width="12" height="11" rx="1"
        fill="#a5825c" stroke="#8a6a4a" stroke-width="1"/>`;
    /* vapeur */
    s += `<g class="ecume"><ellipse cx="${x+27}" cy="96" rx="8" ry="4" fill="#fff" opacity=".5"/></g>`;
  });
  /* suspensions */
  for (let i = 0; i < 4; i++){
    const x = 62 + i*118;
    s += `<path d="M${x} 36 V62" stroke="#8c8272" stroke-width="1.6"/>`;
    s += `<path d="M${x-11} 62 h22 l-4 7 h-14 z" fill="#5c6a74"/>`;
    s += `<circle class="feu2" cx="${x}" cy="70" r="4" fill="#ffe8b4"/>`;
    s += `<path d="M${x-16} 70 L${x-30} 196 h60 L${x+16} 70 Z" fill="#fff3d0" opacity=".16"/>`;
  }
  return s;
}

function aller(i){

    bateau: 'Ton bateau. La cale n\'est pas encore branchée.',

  };

}

/* glissement */
(() => {
  const g = $('grand'), rail = $('rail');
  let x0 = null, y0 = null, dx = 0, actif = false, large = 0;
  g.addEventListener('touchstart', e => {
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; dx = 0; actif = false;
    large = g.clientWidth || 360;
  }, { passive:true });
  g.addEventListener('touchmove', e => {
    if (x0 === null) return;
    dx = e.touches[0].clientX - x0;
    const dy = e.touches[0].clientY - y0;
    if (!actif){
      if (Math.abs(dx) < 12) return;
      if (Math.abs(dy) > Math.abs(dx)){ x0 = null; return; }
      actif = true;
      rail.classList.add('suit');
    }
    let d = dx;
    if ((page === 0 && d > 0) || (page === PAGES.length - 1 && d < 0)) d *= .3;
    rail.style.transform = 'translateX(' + (-page * large + d) + 'px)';
  }, { passive:true });
  g.addEventListener('touchend', () => {
    if (x0 === null) return;
    rail.classList.remove('suit');
    if (actif && Math.abs(dx) > large * .16) aller(page + (dx < 0 ? 1 : -1));
    else aller(page);
    x0 = null; actif = false;
  });
})();

];

];

const BOUCLES  = ['Sans','Une','Deux or','Deux argent'];

const NOMS_FOULARD = ['Sans','Rouge','Bleu','Jaune','Blanc'];


const GW = 16, GH = 18;
const BLANC = '#f6f1e6', NOIR = '#1a1208', BOUCHE = '#7a3a2e', COL = '#161d24';
const CASQUE = '#e8a51e', CASQUE_O = '#b8790c';

function zone(g, x0, y0, x1, y1, c){
  for (let y = Math.max(0, y0); y <= Math.min(GH - 1, y1); y++)
    for (let x = Math.max(0, x0); x <= Math.min(GW - 1, x1); x++) g[y][x] = c;
}
function pt(g, cases, c){
  for (const [x, y] of cases) if (x >= 0 && x < GW && y >= 0 && y < GH) g[y][x] = c;
}

function grille(){
  const P = PEAUX[etat.peau], C = CHEVEUX[etat.cheveux], V = VESTES[etat.veste];
  const co = etat.coiffure, ba = etat.barbe, te = etat.tete;
  const chauve = co === 0, casque = te === 3, poil = !chauve && !casque;
  const bc = chauve ? '#3d2b1e' : C.c;
  const bo = chauve ? '#241a12' : C.o;
  const g = Array.from({ length: GH }, () => new Array(GW).fill(null));

  zone(g, 1, 14, 14, 17, V.c);
  zone(g, 2, 13, 13, 13, V.c);
  zone(g, 1, 14, 3, 17, V.o);
  zone(g, 12, 14, 14, 17, V.o);
  zone(g, 2, 13, 3, 13, V.o);
  zone(g, 12, 13, 13, 13, V.o);

  const mo = etat.motif;
  if (mo === 1){
    zone(g, 1, 15, 14, 15, '#e8e2d4'); zone(g, 1, 17, 14, 17, '#e8e2d4');
    zone(g, 1, 15, 3, 15, '#b2ab9c'); zone(g, 12, 15, 14, 15, '#b2ab9c');
    zone(g, 1, 17, 3, 17, '#b2ab9c'); zone(g, 12, 17, 14, 17, '#b2ab9c');
  }
  if (mo === 2){
    zone(g, 1, 14, 14, 14, '#d7e84a'); zone(g, 1, 16, 14, 16, '#d7e84a');
    zone(g, 1, 14, 3, 14, '#a8b82e'); zone(g, 12, 14, 14, 14, '#a8b82e');
    zone(g, 1, 16, 3, 16, '#a8b82e'); zone(g, 12, 16, 14, 16, '#a8b82e');
  }
  if (mo === 3){
    zone(g, 4, 14, 4, 17, '#3a2c1d'); zone(g, 11, 14, 11, 17, '#3a2c1d');
    pt(g, [[4,15],[11,15]], OR);
  }

  if (etat.tshirt){
    const TC = '#8d8a7e', TO = '#6e6c62';
    zone(g, 1, 14, 14, 17, TC);
    zone(g, 2, 13, 13, 13, TC);
    zone(g, 1, 14, 3, 17, TO);
    zone(g, 12, 14, 14, 17, TO);
    zone(g, 2, 13, 3, 13, TO);
    zone(g, 12, 13, 13, 13, TO);
    pt(g, [[5,15],[9,16],[3,17],[12,15]], '#3c3a34');
    pt(g, [[6,14],[7,14],[8,14],[9,14]], '#5a584f');
  }

  zone(g, 6, 11, 9, 12, P.c);
  zone(g, 6, 11, 9, 11, P.o);
  zone(g, 9, 11, 9, 12, P.o);

  pt(g, [[6,13],[9,13],[7,14],[8,14]], COL);
  pt(g, [[5,13],[10,13],[6,14],[9,14]], V.o);

  const F = FOULARDS[etat.foulard];
  if (F){
    zone(g, 5, 12, 10, 13, F.c);
    zone(g, 4, 13, 11, 13, F.c);
    pt(g, [[9,12],[10,12],[10,13],[11,13]], F.o);
    pt(g, [[7,13],[8,14]], F.o);
  }

  pt(g, [[3,6],[3,7],[12,6],[12,7]], P.c);
  pt(g, [[3,7],[12,7]], P.o);

  zone(g, 4, 3, 11, 9, P.c);
  zone(g, 5, 10, 10, 10, P.c);
  zone(g, 11, 3, 11, 9, P.o);
  pt(g, [[10,10]], P.o);

  if (ba === 1){ zone(g, 6, 9, 9, 10, bc); pt(g, [[9,9],[9,10]], bo); }
  if (ba === 2){
    zone(g, 4, 8, 11, 9, bc); zone(g, 5, 10, 10, 10, bc);
    pt(g, [[4,7],[11,7],[11,8],[11,9],[10,10]], bo);
  }
  if (ba === 3){
    zone(g, 4, 7, 11, 10, bc); zone(g, 5, 11, 10, 11, bc);
    pt(g, [[4,6],[11,6]], bc);
    pt(g, [[11,6],[11,7],[11,8],[11,9],[11,10],[10,11]], bo);
  }
  if (ba === 5){
    zone(g, 4, 5, 4, 8, bc); zone(g, 11, 5, 11, 8, bc);
    pt(g, [[11,5],[11,6],[11,7],[11,8]], bo);
  }

  const oeil = YEUX[etat.yeux].c;
  pt(g, [[5,5],[6,5],[9,5],[10,5]], BLANC);
  pt(g, [[6,5],[9,5]], oeil);
  pt(g, [[7,7],[8,7]], P.o);

  const bo2 = etat.bouche;
  if (bo2 === 0){ zone(g, 6, 9, 9, 9, BOUCHE); pt(g, [[6,9],[9,9]], P.o); }
  if (bo2 === 1){ zone(g, 6, 9, 9, 9, BOUCHE); pt(g, [[5,8],[10,8]], P.o); }
  if (bo2 === 2){ zone(g, 6, 9, 9, 9, P.o); }
  if (bo2 === 3){ zone(g, 6, 9, 9, 9, BOUCHE); pt(g, [[7,9],[8,9]], BLANC); }
  if (bo2 === 4){ zone(g, 6, 9, 9, 9, BOUCHE); pt(g, [[7,9]], BLANC); pt(g, [[8,9]], OR); }

  if (ba === 1 || ba === 3 || ba === 4){ zone(g, 6, 8, 9, 8, bc); pt(g, [[9,8]], bo); }
  if (ba === 4) zone(g, 6, 9, 9, 9, BOUCHE);

  pt(g, [[5,4],[6,4],[9,4],[10,4]], poil ? bc : P.o);
  if (poil) pt(g, [[10,4]], bo);

  if (poil){
    if (co === 1){
      zone(g, 4, 2, 11, 2, C.c);
      pt(g, [[3,3],[3,4],[12,3],[12,4]], C.c);
      pt(g, [[11,2],[12,3],[12,4]], C.o);
    }
    if (co === 2){
      zone(g, 5, 1, 10, 1, C.c); zone(g, 4, 2, 11, 2, C.c);
      pt(g, [[3,3],[3,4],[12,3],[12,4]], C.c);
      pt(g, [[5,2],[7,2],[9,2],[6,1],[9,1]], C.o);
      pt(g, [[11,2],[12,3],[12,4]], C.o);
    }
    if (co === 3){
      zone(g, 4, 1, 11, 2, C.c); zone(g, 3, 2, 3, 5, C.c); zone(g, 12, 2, 12, 5, C.c);
      pt(g, [[5,0],[6,0],[7,0],[8,0],[9,0],[10,0]], C.c);
      pt(g, [[10,0],[11,1],[11,2],[12,2],[12,3],[12,4],[12,5]], C.o);
    }
    if (co === 4){
      zone(g, 4, 2, 11, 2, C.c);
      pt(g, [[3,3],[12,3]], C.c);
      pt(g, [[12,4],[13,4],[13,5],[13,6],[12,6]], C.c);
      pt(g, [[11,2],[13,5],[13,6]], C.o);
    }
    if (co === 5){
      zone(g, 6, 2, 9, 2, C.c);
      pt(g, [[4,3],[3,3],[3,4],[11,3],[12,3],[12,4]], C.c);
      pt(g, [[9,2],[11,3],[12,3],[12,4]], C.o);
    }
  }

  const lu = etat.lunettes;
  if (lu === 1){
    pt(g, [[4,5],[7,5],[8,5],[11,5]], '#2b2119');
    pt(g, [[5,5],[10,5]], BLANC);
    pt(g, [[6,5],[9,5]], oeil);
    pt(g, [[3,5],[12,5]], '#2b2119');
  }
  if (lu === 2){
    zone(g, 4, 5, 11, 5, '#1e1a16');
    pt(g, [[5,5],[9,5]], '#4a4038');
    pt(g, [[3,5],[12,5],[7,5],[8,5]], '#2b2119');
  }
  if (lu === 3){
    zone(g, 4, 5, 11, 5, '#cfe0a8');
    pt(g, [[6,5],[9,5]], oeil);
    pt(g, [[7,5],[8,5]], '#8fa36a');
    pt(g, [[3,5],[12,5]], '#8fa36a');
  }
  if (lu === 4){
    pt(g, [[9,5],[10,5],[11,5],[12,5]], '#1e1a16');
    pt(g, [[11,4],[12,4],[8,4]], '#1e1a16');
  }

  if (etat.boucle === 1) pt(g, [[12,8]], OR);
  if (etat.boucle === 2) pt(g, [[12,8],[3,8]], OR);
  if (etat.boucle === 3) pt(g, [[12,8],[3,8]], ARGENT);

  if (te === 1){
    pt(g, [[7,0],[8,0]], V.c);
    zone(g, 4, 1, 11, 1, V.o);
    zone(g, 3, 2, 12, 3, V.c);
    pt(g, [[11,1],[12,2],[12,3]], V.o);
    zone(g, 3, 3, 12, 3, V.o);
  }
  if (te === 2){
    zone(g, 4, 0, 11, 1, V.c);
    zone(g, 3, 2, 12, 2, V.o);
    zone(g, 2, 3, 13, 3, V.o);
    pt(g, [[11,0],[11,1],[12,2],[13,3]], V.o);
    pt(g, [[4,0],[5,0]], V.c);
  }
  if (te === 3){
    zone(g, 4, 0, 11, 1, CASQUE);
    zone(g, 3, 2, 12, 2, CASQUE);
    zone(g, 2, 3, 13, 3, CASQUE_O);
    pt(g, [[7,0],[8,0],[7,1],[8,1]], CASQUE_O);
    pt(g, [[11,0],[11,1],[12,2]], CASQUE_O);
  }
  if (te === 5){                       // casque de chantier trop grand
    zone(g, 3, 1, 12, 3, CASQUE);
    zone(g, 2, 4, 13, 4, CASQUE_O);
    zone(g, 4, 5, 11, 5, CASQUE_O);
    pt(g, [[7,1],[8,1],[7,2],[8,2],[7,3],[8,3]], CASQUE_O);
    pt(g, [[12,1],[12,2],[12,3],[13,4]], CASQUE_O);
    pt(g, [[3,5],[12,5]], CASQUE_O);
  }
  if (te === 4){
    zone(g, 4, 1, 11, 2, V.c);
    pt(g, [[3,2],[12,2],[3,3],[12,3]], V.c);
    pt(g, [[5,1],[8,1],[10,2]], V.o);
    pt(g, [[13,3],[13,4],[12,4]], V.c);
    pt(g, [[11,1],[11,2],[12,2],[13,4]], V.o);
  }
  return g;
}

function dessinerAvatar(){
  const g = grille(), out = [];
  for (let y = 0; y < GH; y++){
    let x = 0;
    while (x < GW){
      const c = g[y][x];
      if (c === null){ x++; continue; }
      let n = 1;
      while (x + n < GW && g[y][x + n] === c) n++;
      out.push(`<rect x="${x}" y="${y}" width="${n}" height="1" fill="${c}"/>`);
      x += n;
    }
  }
  return out.join('');
}

let etat = { peau:2, cheveux:1, coiffure:1, barbe:2, tete:1, veste:0,
             yeux:0, bouche:0, lunettes:0, boucle:0, motif:0, foulard:0 };
function svgPix(){
  const g = grille(), out = [];
  for (let y = 0; y < GH; y++){
    let x = 0;
    while (x < GW){
      const c = g[y][x];
      if (c === null){ x++; continue; }
      let n = 1;
      while (x + n < GW && g[y][x + n] === c) n++;
      out.push('<rect x="'+x+'" y="'+y+'" width="'+n+'" height="1" fill="'+c+'"/>');
      x += n;
    }
  }
  return '<svg viewBox="0 0 '+GW+' '+GH+'" shape-rendering="crispEdges" style="width:100%;image-rendering:pixelated" xmlns="http://www.w3.org/2000/svg">'+out.join('')+'</svg>';
}

setTimeout(() => {
  if (document.body.classList.contains('charge')){
    document.body.classList.remove('charge');
    document.body.classList.add('pret');
  }
}, 6000);

(async () => {
  const d = await BD.garder('jeu');
  if (!d) return;
  const EQ = await BD.lire('equipement');
  const MED = await BD.lire('dossier_medical');
  Object.assign(etat, BD.avatarDe(d, EQ));

  $('face').insertAdjacentHTML('afterbegin', svgPix());
  $('niv').textContent = d.niveau || 1;
  $('pseudo').textContent = d.pseudo || 'Docker sans nom';
  $('h-lieu').textContent = (MED && MED.poste ? MED.poste : 'Docker') + ' — Marseille';
  $('h-caisse').textContent = Number(d.euros || 0).toLocaleString('fr-FR',
    { minimumFractionDigits:2, maximumFractionDigits:2 }) + ' €';
  const en = d.energie ?? 100, xp = d.xp || 0, palier = 100 * Math.pow(1.6, (d.niveau || 1) - 1);
  $('v-en').textContent = Math.round(en) + ' %';
  $('i-en').style.width = en + '%';
  $('l-niv').textContent = 'Niveau ' + (d.niveau || 1);
  $('v-xp').textContent = xp + ' / ' + Math.round(palier);
  $('i-xp').style.width = Math.min(100, xp / palier * 100) + '%';
  const rep = d.reputation ?? 50;
  $('v-rep').textContent = rep >= 70 ? 'Bonne' : rep >= 40 ? 'Correcte' : 'Fragile';
  $('i-rep').style.width = rep + '%';

  await new Promise(r => requestAnimationFrame(r));
  document.body.classList.remove('charge');
  document.body.classList.add('pret');
})();

aller(0);
