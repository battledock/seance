<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <title>Mon cinéma</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css?v=93089721">
  <style>
    body{margin:0}

    /* ------------------------------------------------------------
       AUCUNE ÉTAPE AVANT LE CINÉMA

       Il y avait un voile avec une bobine qui tournait, puis deux
       fondus qui se croisaient — celui du voile qui partait et celui
       de la scène qui venait. C'est ce croisement qui faisait battre
       le ciel une fois avant de se stabiliser.

       Tout cela a disparu. La page porte la couleur du ciel de
       l'heure dès la première image, avant même que le JavaScript
       démarre. On attend devant un ciel, la façade s'y dessine, et
       rien ne clignote puisque plus rien ne se superpose.
       ------------------------------------------------------------ */
    .sceneJeu{opacity:1}
    .navBas{opacity:0;transition:opacity .38s ease}
    body.pret .navBas{opacity:1}
    html,body{background:linear-gradient(180deg,
      var(--cielHaut,#6fa8d8), var(--cielBas,#35719e))}
  </style>
  <script>
    /* le fond de page prend le ciel de l'heure, avant tout chargement */
    (function(){
      var h = new Date().getHours(), haut, bas;
      if(h >= 6 && h < 11)       { haut = "#7ba4c8"; bas = "#3f6f9c"; }  /* matin */
      else if(h >= 11 && h < 18) { haut = "#6fa8d8"; bas = "#35719e"; }  /* après-midi */
      else if(h >= 18 && h < 21) { haut = "#8a5484"; bas = "#2a1c3e"; }  /* aube du soir */
      else                       { haut = "#141a38"; bas = "#05070f"; }  /* nuit */
      var r = document.documentElement.style;
      r.setProperty("--cielHaut", haut);
      r.setProperty("--cielBas",  bas);
    })();
  </script>
</head>
<body>

<main class="sceneJeu">
  <div class="hudJeu" id="hudJeu">
    <div class="hudGauche">
      <span class="hudNom" id="hudNom"></span>
      <span class="hudNiv" id="hudNiv"></span>
    </div>
    <div class="hudDroite">
      <span class="hudArgent" id="hudArgent"></span>
      <span class="hudXp"><span class="hudXpBarre" id="hudXpBarre"></span></span>
    </div>
  </div>
  <div class="sceneFacade" id="sceneFacade"></div>
  <div class="sceneFade" aria-hidden="true"></div>
</main>

<script type="module" src="js/pages/jeu.js?v=93089721"></script>
</body>
</html>
