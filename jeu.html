<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#2f7fb8">
<title>Battle Dock</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none}
html,body{height:100%;overflow:hidden;background:#2f7fb8;
  font-family:'Barlow',system-ui,sans-serif}
#sc{position:fixed;inset:0}
#sc svg{display:block;width:100%;height:100%}

/* le bandeau du haut */
.haut{position:fixed;top:0;left:0;right:0;z-index:5;
  padding:calc(env(safe-area-inset-top) + 14px) 16px 26px;
  background:linear-gradient(180deg,rgba(8,22,36,.42),rgba(8,22,36,.14) 60%,transparent);
  display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.titre b{display:block;font-family:'Bebas Neue',sans-serif;font-size:26px;line-height:1;
  color:#fff;letter-spacing:.03em;text-shadow:0 2px 12px rgba(6,14,24,.5)}
.titre span{display:block;font-size:11px;letter-spacing:.2em;text-transform:uppercase;
  color:rgba(255,255,255,.78);margin-top:3px;text-shadow:0 1px 8px rgba(6,14,24,.6)}
.puce{flex:0 0 auto;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  border-radius:20px;padding:6px 12px;font-size:9.5px;letter-spacing:.16em;
  text-transform:uppercase;font-weight:600;color:#fff;white-space:nowrap;
  animation:resp 3.4s ease-in-out infinite}
@keyframes resp{0%,100%{opacity:.82}50%{opacity:1}}

/* le bandeau du bas */
.bas{position:fixed;bottom:0;left:0;right:0;z-index:5;
  padding:52px 16px calc(env(safe-area-inset-bottom) + 18px);
  background:linear-gradient(180deg,transparent,rgba(8,22,36,.5) 52%,rgba(8,22,36,.82));
  text-align:center}
.bas .mot{font-size:13px;line-height:1.5;color:rgba(255,255,255,.9);
  text-shadow:0 1px 10px rgba(6,14,24,.6);max-width:320px;margin:0 auto}
.bas .avis{display:inline-flex;align-items:center;gap:8px;margin-top:14px;
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.26);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  border-radius:14px;padding:9px 14px;font-size:12px;line-height:1.45;
  color:rgba(255,255,255,.94);text-shadow:0 1px 8px rgba(6,14,24,.5)}
.bas .avis .pt{flex:0 0 7px;height:7px;border-radius:50%;background:#f6c47e;
  box-shadow:0 0 0 3px rgba(246,196,126,.24);animation:cl 2.2s ease-in-out infinite}
@keyframes cl{0%,100%{opacity:.55}50%{opacity:1}}
.bas .avis b{font-family:'Courier Prime',monospace;font-weight:700;color:#f6c47e}
.bas .sig{font-family:'Courier Prime',monospace;font-size:9.5px;letter-spacing:.24em;
  text-transform:uppercase;color:rgba(255,255,255,.5);margin-top:13px}

/* animations de la scène */
.nuages g{animation:pa 190s linear infinite}
@keyframes pa{to{transform:translateX(620px)}}
.onde{will-change:transform}
.o0{animation:v0 26s linear infinite}.o1{animation:v1 34s linear infinite}
.o2{animation:v0 44s linear infinite}.o3{animation:v1 56s linear infinite}
@keyframes v0{to{transform:translateX(64px)}}
@keyframes v1{to{transform:translateX(-64px)}}
.portique{animation:po 90s ease-in-out infinite}
.portique.p1{animation-duration:120s;animation-delay:-30s}
.portique.p2{animation-duration:104s;animation-delay:-60s}
.portique.p3{animation-duration:136s;animation-delay:-20s}
@keyframes po{0%,100%{transform:translateX(0)}50%{transform:translateX(18px)}}
.mouettePosee{animation:sa 11s ease-in-out infinite}
@keyframes sa{0%,90%,100%{transform:translate(0,0)}94%{transform:translate(3px,-2px)}}
.volee{animation:vol 46s ease-in-out infinite}
.volee.v1{animation-duration:60s;animation-delay:-16s}
@keyframes vol{0%,100%{transform:translate(0,0)}50%{transform:translate(-200px,-18px)}}
.gens{animation:ge 9s ease-in-out infinite}
.gens:nth-of-type(2n){animation-duration:11s;animation-delay:-3s}
.gens:nth-of-type(3n){animation-duration:7.4s;animation-delay:-5s}
@keyframes ge{0%,100%{transform:translateY(0)}50%{transform:translateY(-.8px)}}
@media (prefers-reduced-motion:reduce){*{animation:none !important}}
</style>
</head>
<body>

<div id="sc"></div>

<header class="haut">
  <span class="titre"><b>Battle Dock</b><span>La Joliette — Marseille</span></span>
  <span class="puce">Jeu en création</span>
</header>

<footer class="bas">
  <p class="mot">Un jeu de docker. Le port, les bateaux, les gens.</p>
  <p><span class="avis"><span class="pt"></span>
    Mise à jour cette nuit vers <b>23 h 45</b></span></p>
  <p class="sig">battledock.fr</p>
</footer>

<script>
/* ============================================================
   LE QUAI — composition verticale, pensée pour un téléphone
   ============================================================ */

/* ---------- la charte, refaite pour le portrait ---------- */
const W = 480;
const OEIL = 12;            /* on regarde le quai d'un peu haut */
const FOCALE = 727;
const HORIZON = 208;

const px  = (m, d) => m * FOCALE / d;
const sol = d => HORIZON + OEIL * FOCALE / d;
const brume = d => Math.min(.7, 1 - Math.exp(-d / 3000));

const rnd = s => { const x = Math.sin(s * 127.1) * 43758.5; return x - Math.floor(x); };
const CIEL = [188, 206, 212];
function voiler(hex, d){
  const b = brume(d);
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), bl = parseInt(hex.slice(5,7),16);
  const f = v => Math.round(v).toString(16).padStart(2,'0');
  return '#' + f(r + (CIEL[0]-r)*b) + f(g + (CIEL[1]-g)*b) + f(bl + (CIEL[2]-bl)*b);
}

/* les distances qui structurent la scène */
const D_VILLE = 420;        /* la ville d'en face */
const D_BORD  = 62;         /* le bord de ton quai */
const D_PRES  = 13;         /* le plus près qu'on montre */

let HAUT = -120, BAS = 900;
function cadrer(l, h){
  const total = W * h / l;
  /* le bord du quai tombe aux deux cinquièmes : le reste est ta scène */
  const yb = sol(D_BORD);
  HAUT = yb - total * .42;
  BAS  = yb + total * .58;
  return { y: HAUT, h: total };
}

/* ================= LE CIEL ================= */
function ciel(){
  let s = `<defs>
    <linearGradient id="z-ciel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#2f7fb8"/>
      <stop offset="34%"  stop-color="#5a9fc8"/>
      <stop offset="64%"  stop-color="#8fbdd6"/>
      <stop offset="86%"  stop-color="#bccfd6"/>
      <stop offset="100%" stop-color="#e2d8c0"/></linearGradient>
    <linearGradient id="z-eau" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#7fbcc8"/>
      <stop offset="18%"  stop-color="#4a98b4"/>
      <stop offset="60%"  stop-color="#2a7192"/>
      <stop offset="100%" stop-color="#1a5878"/></linearGradient>
    <linearGradient id="z-quai" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#c9bda0"/>
      <stop offset="22%"  stop-color="#d6cbaf"/>
      <stop offset="100%" stop-color="#bfb296"/></linearGradient>
    <radialGradient id="z-soleil" cx="0.5" cy="0.5">
      <stop offset="0%" stop-color="#fffef4" stop-opacity=".9"/>
      <stop offset="34%" stop-color="#ffefc8" stop-opacity=".4"/>
      <stop offset="100%" stop-color="#ffd8a0" stop-opacity="0"/></radialGradient>
  </defs>`;
  s += `<rect x="0" y="${HAUT}" width="${W}" height="${(sol(3000)-HAUT).toFixed(1)}"
    fill="url(#z-ciel)"/>`;
  s += `<ellipse cx="106" cy="${(HAUT+70).toFixed(0)}" rx="140" ry="96"
    fill="url(#z-soleil)" opacity=".72"/>`;
  s += `<circle cx="106" cy="${(HAUT+66).toFixed(0)}" r="13" fill="#fffef8"/>`;
  s += `<g class="nuages">`;
  for (let i = 0; i < 7; i++){
    const cx = -70 + rnd(i+3)*620, cy = HAUT + 24 + rnd(i+11)*150, w = 32 + rnd(i)*46;
    s += `<g opacity="${(.1 + rnd(i+5)*.12).toFixed(2)}" fill="#fff">
      <ellipse cx="${cx.toFixed(0)}" cy="${cy.toFixed(0)}" rx="${w.toFixed(0)}" ry="5"/>
      <ellipse cx="${(cx+w*.32).toFixed(0)}" cy="${(cy-4).toFixed(0)}" rx="${(w*.5).toFixed(0)}" ry="3.6"/>
      <ellipse cx="${(cx-w*.4).toFixed(0)}" cy="${(cy-2).toFixed(0)}" rx="${(w*.3).toFixed(0)}" ry="3"/></g>`;
  }
  s += `</g>`;
  return s;
}

/* ================= L'EAU ================= */
function eau(){
  const yh = sol(3000), yb = sol(D_BORD);
  let s = `<rect x="0" y="${yh.toFixed(1)}" width="${W}" height="${(yb-yh+2).toFixed(1)}"
    fill="url(#z-eau)"/>`;
  /* le large par la passe */
  s += `<rect x="176" y="${(yh-px(24,3000)).toFixed(1)}" width="128"
    height="${px(24,3000).toFixed(1)}" fill="${voiler('#9ab4c4', 3000)}" opacity=".5"/>`;
  /* le reflet des quais */
  s += `<rect x="0" y="${sol(D_VILLE).toFixed(1)}" width="176" height="${px(14,D_VILLE).toFixed(1)}"
    fill="#c9b898" opacity=".14"/>`;
  s += `<rect x="304" y="${sol(D_VILLE).toFixed(1)}" width="176" height="${px(14,D_VILLE).toFixed(1)}"
    fill="#c9b898" opacity=".14"/>`;
  /* la houle */
  for (let n = 0; n < 6; n++){
    const d = 900 / Math.pow(n + 1, 1.3);
    const y = sol(d), amp = px(.3, d), esp = px(9, d);
    if (y > yb - 2 || y < yh) continue;
    s += `<g class="onde o${n % 4}">`;
    for (let i = 0; i < 3; i++){
      const yy = y + i * esp * .4;
      if (yy > yb - 2) break;
      let p = `M-100 ${yy.toFixed(1)} `;
      for (let k = 0; k < 16; k++) p += `q${(esp*.5).toFixed(1)} ${(-amp).toFixed(1)} ${esp.toFixed(1)} 0 `;
      s += `<path d="${p}" stroke="#fff" stroke-width="${Math.max(.5, amp*.3).toFixed(2)}"
        fill="none" opacity="${(.2 - n*.024).toFixed(2)}"/>`;
    }
    s += `</g>`;
  }
  return s;
}

/* ============================================================
   TON QUAI — la scène, de 62 m à 13 m
   ============================================================ */

/* le sol, avec un pavage qui s'élargit en descendant */
function pave(){
  const yb = sol(D_BORD);
  let s = `<path d="M0 ${(yb-2).toFixed(1)} h${W} v6 H0 Z" fill="#0e3a58" opacity=".18"/>`;
  s += `<rect x="0" y="${yb.toFixed(1)}" width="${W}" height="${(BAS-yb+4).toFixed(1)}"
    fill="url(#z-quai)"/>`;
  s += `<rect x="0" y="${yb.toFixed(1)}" width="${W}" height="2.6" fill="#efe5ca"/>`;
  /* les rangées de dalles */
  let d = D_BORD, i = 0;
  while (d > D_PRES - 1 && i < 40){
    const y1 = sol(d), d2 = d / 1.13, y2 = sol(d2);
    if (y1 > BAS) break;
    const n = Math.max(3, Math.round(9 - i * .3));
    for (let c = 0; c < n; c++)
      s += `<path d="M${(c*W/n).toFixed(1)} ${y1.toFixed(1)} L${((c+1)*W/n - 1.4).toFixed(1)} ${y1.toFixed(1)}
        L${((c+1)*W/n - 1.6).toFixed(1)} ${Math.min(y2,BAS).toFixed(1)} L${(c*W/n).toFixed(1)} ${Math.min(y2,BAS).toFixed(1)} Z"
        fill="${rnd(i*17+c) > .5 ? '#dbd0b4' : '#c9be9f'}" opacity=".4"/>`;
    d = d2; i++;
  }
  /* les rails de grue, deux lignes qui fuient */
  s += `<g opacity=".22">`;
  [.3, .7].forEach(k => {
    const xa = W * (.5 + (k - .5) * (D_BORD / 40)), xb2 = W * (.5 + (k - .5) * (D_BORD / 13));
    s += `<path d="M${xa.toFixed(1)} ${sol(D_BORD).toFixed(1)} L${xb2.toFixed(1)} ${BAS.toFixed(1)}"
      stroke="#8a7f66" stroke-width="3"/>`;
  });
  s += `</g>`;
  return s;
}

/* un homme, taillé pour sa distance */
function gens(x, d, hab, tete, geste){
  const y = sol(d), h = px(1.75, d);
  let s = `<g class="gens">`;
  s += `<ellipse cx="${x}" cy="${y.toFixed(1)}" rx="${(h*.22).toFixed(1)}"
    ry="${(h*.055).toFixed(1)}" fill="#3f3a30" opacity=".24"/>`;
  s += `<path d="M${(x-h*.07).toFixed(1)} ${y.toFixed(1)} v${(-h*.42).toFixed(1)}
    M${(x+h*.07).toFixed(1)} ${y.toFixed(1)} v${(-h*.42).toFixed(1)}"
    stroke="#3f3a30" stroke-width="${(h*.08).toFixed(1)}" stroke-linecap="round"/>`;
  s += `<path d="M${(x-h*.12).toFixed(1)} ${(y-h*.4).toFixed(1)}
    q0 ${(-h*.36).toFixed(1)} ${(h*.12).toFixed(1)} ${(-h*.36).toFixed(1)}
    q${(h*.12).toFixed(1)} 0 ${(h*.12).toFixed(1)} ${(h*.36).toFixed(1)} z" fill="${hab}"/>`;
  /* les bras */
  if (geste === 'porte')
    s += `<path d="M${(x-h*.12).toFixed(1)} ${(y-h*.66).toFixed(1)} l${(-h*.1).toFixed(1)} ${(h*.16).toFixed(1)}
      M${(x+h*.12).toFixed(1)} ${(y-h*.66).toFixed(1)} l${(h*.1).toFixed(1)} ${(h*.16).toFixed(1)}"
      stroke="${hab}" stroke-width="${(h*.075).toFixed(1)}" stroke-linecap="round"/>`;
  else if (geste === 'montre')
    s += `<path d="M${(x+h*.1).toFixed(1)} ${(y-h*.66).toFixed(1)} l${(h*.2).toFixed(1)} ${(-h*.1).toFixed(1)}"
      stroke="${hab}" stroke-width="${(h*.075).toFixed(1)}" stroke-linecap="round"/>`;
  s += `<circle cx="${x}" cy="${(y-h*.86).toFixed(1)}" r="${(h*.095).toFixed(1)}" fill="#c98f5e"/>`;
  if (tete)
    s += `<path d="M${(x-h*.1).toFixed(1)} ${(y-h*.93).toFixed(1)}
      a${(h*.1).toFixed(1)} ${(h*.09).toFixed(1)} 0 0 1 ${(h*.2).toFixed(1)} 0 z" fill="${tete}"/>`;
  return s + `</g>`;
}

/* une caisse */
function caisse(x, d, dy, ton){
  const y = sol(d) + (dy || 0), h = px(.85, d), l = px(1.15, d);
  const C = ton || '#a5825c';
  let s = `<g>`;
  s += `<ellipse cx="${(x+l*.5).toFixed(1)}" cy="${y.toFixed(1)}" rx="${(l*.56).toFixed(1)}"
    ry="${(h*.1).toFixed(1)}" fill="#3f3a30" opacity=".2"/>`;
  s += `<rect x="${x.toFixed(1)}" y="${(y-h).toFixed(1)}" width="${l.toFixed(1)}"
    height="${h.toFixed(1)}" rx="${(h*.06).toFixed(1)}" fill="${C}"/>`;
  s += `<rect x="${x.toFixed(1)}" y="${(y-h).toFixed(1)}" width="${l.toFixed(1)}"
    height="${(h*.13).toFixed(1)}" fill="#c9a374"/>`;
  s += `<rect x="${x.toFixed(1)}" y="${(y-h).toFixed(1)}" width="${(l*.2).toFixed(1)}"
    height="${h.toFixed(1)}" fill="#fff2d0" opacity=".13"/>`;
  s += `<path d="M${x.toFixed(1)} ${(y-h*.62).toFixed(1)} h${l.toFixed(1)}
    M${x.toFixed(1)} ${(y-h*.3).toFixed(1)} h${l.toFixed(1)}"
    stroke="#8a6a42" stroke-width="${(h*.05).toFixed(1)}" opacity=".7"/>`;
  return s + `</g>`;
}

/* un tonneau */
function tonneau(x, d){
  const y = sol(d), h = px(.95, d), l = px(.72, d);
  let s = `<g>`;
  s += `<ellipse cx="${x}" cy="${y.toFixed(1)}" rx="${(l*.6).toFixed(1)}" ry="${(h*.1).toFixed(1)}"
    fill="#3f2c1e" opacity=".22"/>`;
  s += `<path d="M${(x-l*.44).toFixed(1)} ${y.toFixed(1)} q${(-l*.1).toFixed(1)} ${(-h*.5).toFixed(1)} 0 ${(-h).toFixed(1)}
    h${(l*.88).toFixed(1)} q${(l*.1).toFixed(1)} ${(h*.5).toFixed(1)} 0 ${h.toFixed(1)} z" fill="#9a7448"/>`;
  s += `<path d="M${(x-l*.44).toFixed(1)} ${y.toFixed(1)} q${(-l*.1).toFixed(1)} ${(-h*.5).toFixed(1)} 0 ${(-h).toFixed(1)}
    h${(l*.24).toFixed(1)} q${(-l*.06).toFixed(1)} ${(h*.5).toFixed(1)} 0 ${h.toFixed(1)} z" fill="#b08a5c"/>`;
  s += `<path d="M${(x-l*.5).toFixed(1)} ${(y-h*.3).toFixed(1)} h${l.toFixed(1)}
    M${(x-l*.5).toFixed(1)} ${(y-h*.68).toFixed(1)} h${l.toFixed(1)}"
    stroke="#6d5334" stroke-width="${(h*.07).toFixed(1)}"/>`;
  s += `<ellipse cx="${x}" cy="${(y-h).toFixed(1)}" rx="${(l*.44).toFixed(1)}"
    ry="${(l*.14).toFixed(1)}" fill="#c9a374"/>`;
  return s + `</g>`;
}

/* une bitte d'amarrage */
function bitte(x, d){
  const y = sol(d), h = px(.62, d), l = px(.5, d);
  let s = `<ellipse cx="${x}" cy="${y.toFixed(1)}" rx="${(l*.9).toFixed(1)}"
    ry="${(l*.28).toFixed(1)}" fill="#3f3a30" opacity=".24"/>`;
  s += `<path d="M${(x-l*.5).toFixed(1)} ${y.toFixed(1)} q0 ${(-h).toFixed(1)} ${(l*.5).toFixed(1)} ${(-h).toFixed(1)}
    q${(l*.5).toFixed(1)} 0 ${(l*.5).toFixed(1)} ${h.toFixed(1)} z" fill="#4a4438"/>`;
  s += `<path d="M${(x-l*.5).toFixed(1)} ${y.toFixed(1)} q0 ${(-h).toFixed(1)} ${(l*.5).toFixed(1)} ${(-h).toFixed(1)}
    q${(l*.12).toFixed(1)} 0 ${(l*.18).toFixed(1)} ${(h*.12).toFixed(1)}
    q${(-l*.28).toFixed(1)} ${(h*.3).toFixed(1)} ${(-l*.28).toFixed(1)} ${(h*.88).toFixed(1)} z" fill="#6d6558"/>`;
  s += `<ellipse cx="${x}" cy="${(y-h).toFixed(1)}" rx="${(l*.68).toFixed(1)}"
    ry="${(l*.24).toFixed(1)}" fill="#5c5548"/>`;
  s += `<ellipse cx="${x}" cy="${(y-h-l*.14).toFixed(1)}" rx="${(l*.68).toFixed(1)}"
    ry="${(l*.24).toFixed(1)}" fill="#7a7264"/>`;
  return s;
}


/* ============================================================
   LA JOLIETTE — le port de commerce
   ============================================================ */

/* ---------- l'Estaque et les collines, au fond ---------- */
function collines(){
  const d = 6000, y = sol(d), h = px(240, d);
  const c = voiler('#8494a0', d);
  let s = `<path d="M-10 ${y} `;
  [[-10,.3],[46,.62],[104,.44],[164,.78],[222,.56],[282,.86],[338,.6],[396,.9],[444,.66],[490,.44]]
    .forEach(([x,k],i) => s += (i ? `Q${(x-18)} ${(y-h*k*1.1).toFixed(1)} ` : '') + `${x} ${(y-h*k).toFixed(1)} `);
  return s + `L490 ${y} Z" fill="${c}" opacity=".52"/>`;
}

/* ---------- la cathédrale de la Major, 1400 m ---------- */
function major(){
  const d = 1400, y = sol(d) - px(26, 1400), h = px(70, d), x = 386;
  const clair = voiler('#e4e0d0', d), fonce = voiler('#8a8878', d), dome = voiler('#6d8a80', d);
  let s = `<g>`;
  /* la nef, en bandes bicolores */
  s += `<rect x="${(x-h*.5).toFixed(1)}" y="${(y-h*.5).toFixed(1)}" width="${h.toFixed(1)}"
    height="${(h*.5).toFixed(1)}" fill="${clair}"/>`;
  s += `<g fill="${fonce}" opacity=".5">`;
  for (let k = 0; k < 4; k++)
    s += `<rect x="${(x-h*.5).toFixed(1)}" y="${(y-h*.46+k*h*.12).toFixed(1)}"
      width="${h.toFixed(1)}" height="${(h*.05).toFixed(1)}"/>`;
  s += `</g>`;
  /* la grande coupole */
  s += `<path d="M${(x-h*.2).toFixed(1)} ${(y-h*.5).toFixed(1)}
    a${(h*.2).toFixed(1)} ${(h*.24).toFixed(1)} 0 0 1 ${(h*.4).toFixed(1)} 0 z" fill="${dome}"/>`;
  s += `<path d="M${x} ${(y-h*.74).toFixed(1)} v${(-h*.08).toFixed(1)}" stroke="${dome}" stroke-width="1.4"/>`;
  /* les deux clochers */
  [[-.42, .82], [.42, .82]].forEach(([dx, k]) => {
    const tx = x + h * dx;
    s += `<rect x="${(tx-h*.09).toFixed(1)}" y="${(y-h*k).toFixed(1)}" width="${(h*.18).toFixed(1)}"
      height="${(h*(k-.1)).toFixed(1)}" fill="${clair}"/>`;
    s += `<g fill="${fonce}" opacity=".45">`;
    for (let q = 0; q < 3; q++)
      s += `<rect x="${(tx-h*.09).toFixed(1)}" y="${(y-h*k+h*.08+q*h*.13).toFixed(1)}"
        width="${(h*.18).toFixed(1)}" height="${(h*.045).toFixed(1)}"/>`;
    s += `</g>`;
    s += `<path d="M${(tx-h*.12).toFixed(1)} ${(y-h*k).toFixed(1)}
      a${(h*.12).toFixed(1)} ${(h*.13).toFixed(1)} 0 0 1 ${(h*.24).toFixed(1)} 0 z" fill="${dome}"/>`;
  });
  /* les deux petits dômes latéraux */
  [[-.24, .58], [.24, .58]].forEach(([dx, k]) => {
    const tx = x + h * dx;
    s += `<path d="M${(tx-h*.11).toFixed(1)} ${(y-h*k).toFixed(1)}
      a${(h*.11).toFixed(1)} ${(h*.12).toFixed(1)} 0 0 1 ${(h*.22).toFixed(1)} 0 z" fill="${dome}"/>`;
  });
  return s + `</g>`;
}

/* ---------- la tour de verre, 1600 m ---------- */
function tour(){
  const d = 1600, y = sol(d) - px(22, 1600), h = px(147, d), x = 438;
  const v = voiler('#8fa8bc', d), cl = voiler('#b0c4d4', d);
  let s = `<g>`;
  /* le fût incurvé */
  s += `<path d="M${(x-h*.09).toFixed(1)} ${y.toFixed(1)}
    C${(x-h*.09).toFixed(1)} ${(y-h*.5).toFixed(1)} ${(x-h*.05).toFixed(1)} ${(y-h*.8).toFixed(1)} ${(x-h*.02).toFixed(1)} ${(y-h).toFixed(1)}
    h${(h*.09).toFixed(1)}
    C${(x+h*.07).toFixed(1)} ${(y-h*.8).toFixed(1)} ${(x+h*.1).toFixed(1)} ${(y-h*.5).toFixed(1)} ${(x+h*.1).toFixed(1)} ${y.toFixed(1)} z"
    fill="${v}"/>`;
  s += `<path d="M${(x-h*.09).toFixed(1)} ${y.toFixed(1)}
    C${(x-h*.09).toFixed(1)} ${(y-h*.5).toFixed(1)} ${(x-h*.05).toFixed(1)} ${(y-h*.8).toFixed(1)} ${(x-h*.02).toFixed(1)} ${(y-h).toFixed(1)}
    h${(h*.03).toFixed(1)} C${(x-h*.02).toFixed(1)} ${(y-h*.7).toFixed(1)} ${(x-h*.05).toFixed(1)} ${(y-h*.4).toFixed(1)} ${(x-h*.05).toFixed(1)} ${y.toFixed(1)} z"
    fill="${cl}" opacity=".6"/>`;
  /* les bandes d'étages */
  s += `<g stroke="${cl}" stroke-width=".5" opacity=".4">`;
  for (let k = 1; k < 12; k++)
    s += `<path d="M${(x-h*.085).toFixed(1)} ${(y-h*k/12).toFixed(1)} h${(h*.18).toFixed(1)}"/>`;
  s += `</g>`;
  return s + `</g>`;
}

/* ---------- les Docks et les hangars du quai d'en face, 520 m ---------- */
function docks(){
  const d = 520, y = sol(d), he = px(3.3, d), hq = px(4, d);
  let s = '';
  /* le quai */
  s += `<rect x="0" y="${(y-hq).toFixed(1)}" width="${W}" height="${(hq+3).toFixed(1)}"
    fill="${voiler('#b6ab90', d)}"/>`;
  s += `<rect x="0" y="${(y-hq).toFixed(1)}" width="${W}" height="1.2" fill="${voiler('#d8cdb0', d)}"/>`;

  /* les Docks : un long bâtiment à arcades */
  const hd = px(18, d), xd = 286, ld = 148;
  s += `<rect x="${xd}" y="${(y-hd).toFixed(1)}" width="${ld}" height="${hd.toFixed(1)}"
    fill="${voiler('#dcd0b4', d)}"/>`;
  s += `<rect x="${xd}" y="${(y-hd).toFixed(1)}" width="${(ld*.16).toFixed(1)}"
    height="${hd.toFixed(1)}" fill="#fff6d8" opacity=".2"/>`;
  s += `<rect x="${(xd-2)}" y="${(y-hd).toFixed(1)}" width="${(ld+4)}" height="${(hd*.1).toFixed(1)}"
    fill="${voiler('#c4b596', d)}"/>`;
  /* les rangées de fenêtres */
  for (let r = 0; r < 4; r++)
    for (let c = 0; c < 18; c++)
      s += `<rect x="${(xd + 4 + c*7.9).toFixed(1)}" y="${(y - hd*.82 + r*hd*.2).toFixed(1)}"
        width="${(hd*.055).toFixed(1)}" height="${(hd*.12).toFixed(1)}"
        fill="${voiler('#6d7c88', d)}"/>`;
  /* les arcades du rez-de-chaussée */
  for (let c = 0; c < 9; c++)
    s += `<path d="M${(xd + 5 + c*16).toFixed(1)} ${y.toFixed(1)} v${(-hd*.14).toFixed(1)}
      a${(hd*.05).toFixed(1)} ${(hd*.05).toFixed(1)} 0 0 1 ${(hd*.1).toFixed(1)} 0
      v${(hd*.14).toFixed(1)} z" fill="${voiler('#5c5548', d)}" opacity=".6"/>`;

  /* les hangars bas, à gauche */
  for (let i = 0; i < 5; i++){
    const x = -10 + i * 62, hh = px(11, d) * (.8 + rnd(i) * .4), lh = 56;
    s += `<rect x="${x}" y="${(y-hh).toFixed(1)}" width="${lh}" height="${hh.toFixed(1)}"
      fill="${voiler(['#c4bda8','#b8b19c','#cdc6b0'][i%3], d)}"/>`;
    s += `<path d="M${(x-2)} ${(y-hh).toFixed(1)} h${(lh+4)} l${(-6)} ${(-hh*.16).toFixed(1)}
      h${(lh-8)} z" fill="${voiler('#8a8578', d)}"/>`;
    /* les portes */
    for (let c = 0; c < 3; c++)
      s += `<rect x="${(x + 8 + c*16).toFixed(1)}" y="${(y-hh*.5).toFixed(1)}" width="10"
        height="${(hh*.5).toFixed(1)}" fill="${voiler('#6d6558', d)}"/>`;
  }
  return s;
}

/* ---------- les portiques à conteneurs, 380 m ---------- */
function portiques(){
  const d = 380, y = sol(d), h = px(60, d);
  const c = voiler('#c9843a', d), cs = voiler('#a06428', d), m = voiler('#8a9299', d);
  let s = '';
  [96, 208, 316, 420].forEach((x, i) => {
    const hh = h * (.9 + rnd(i) * .2);
    s += `<g class="portique p${i}">`;
    /* les quatre jambes */
    [[-.3, -.3], [.3, .3]].forEach(([a, b]) => {
      s += `<path d="M${(x + hh*a*.9).toFixed(1)} ${y.toFixed(1)} L${(x + hh*b*.62).toFixed(1)} ${(y-hh*.72).toFixed(1)}"
        stroke="${cs}" stroke-width="${(hh*.035).toFixed(1)}"/>`;
    });
    s += `<path d="M${(x-hh*.28).toFixed(1)} ${y.toFixed(1)} v${(-hh*.72).toFixed(1)}
      M${(x+hh*.28).toFixed(1)} ${y.toFixed(1)} v${(-hh*.72).toFixed(1)}"
      stroke="${c}" stroke-width="${(hh*.042).toFixed(1)}"/>`;
    /* les traverses */
    s += `<path d="M${(x-hh*.3).toFixed(1)} ${(y-hh*.34).toFixed(1)} h${(hh*.6).toFixed(1)}"
      stroke="${cs}" stroke-width="${(hh*.022).toFixed(1)}"/>`;
    /* la poutre supérieure, qui déborde vers l'eau */
    s += `<path d="M${(x-hh*.62).toFixed(1)} ${(y-hh*.74).toFixed(1)} h${(hh*1.1).toFixed(1)}"
      stroke="${c}" stroke-width="${(hh*.05).toFixed(1)}"/>`;
    /* la flèche relevée */
    s += `<path d="M${(x+hh*.42).toFixed(1)} ${(y-hh*.76).toFixed(1)} L${(x+hh*.6).toFixed(1)} ${(y-hh).toFixed(1)}"
      stroke="${c}" stroke-width="${(hh*.042).toFixed(1)}"/>`;
    /* la cabine et le chariot */
    s += `<rect x="${(x-hh*.5).toFixed(1)}" y="${(y-hh*.72).toFixed(1)}" width="${(hh*.1).toFixed(1)}"
      height="${(hh*.08).toFixed(1)}" fill="${m}"/>`;
    /* le câble et le spreader */
    if (i % 2 === 0){
      s += `<path d="M${(x-hh*.45).toFixed(1)} ${(y-hh*.64).toFixed(1)} v${(hh*.3).toFixed(1)}"
        stroke="${m}" stroke-width="1"/>`;
      s += `<rect x="${(x-hh*.53).toFixed(1)}" y="${(y-hh*.34).toFixed(1)}" width="${(hh*.16).toFixed(1)}"
        height="${(hh*.04).toFixed(1)}" fill="${cs}"/>`;
    }
    s += `</g>`;
  });
  return s;
}

/* ---------- le ferry à quai, 240 m ---------- */
function ferry2(){
  const d = 290, y = sol(d), h = px(21, d), l = px(112, d), x = 10;
  const blanc = voiler('#f2ede2', d), coque = voiler('#2f4a5c', d), rouge = voiler('#b8483a', d);
  let s = `<g>`;
  s += `<ellipse cx="${(x+l*.5).toFixed(1)}" cy="${(y+h*.06).toFixed(1)}" rx="${(l*.5).toFixed(1)}"
    ry="${(h*.06).toFixed(1)}" fill="#0e4a68" opacity=".2"/>`;
  /* la coque */
  s += `<path d="M${x} ${(y-h*.34).toFixed(1)} q${(l*.03).toFixed(1)} ${(h*.28).toFixed(1)}
    ${(l*.09).toFixed(1)} ${(h*.34).toFixed(1)} h${(l*.82).toFixed(1)}
    q${(l*.06).toFixed(1)} ${(-h*.03).toFixed(1)} ${(l*.09).toFixed(1)} ${(-h*.34).toFixed(1)} z"
    fill="${coque}"/>`;
  s += `<path d="M${x} ${(y-h*.34).toFixed(1)} h${l.toFixed(1)} v${(-h*.05).toFixed(1)}
    h${(-l).toFixed(1)} z" fill="${rouge}"/>`;
  /* les ponts blancs */
  s += `<path d="M${(x+l*.04).toFixed(1)} ${(y-h*.39).toFixed(1)} h${(l*.92).toFixed(1)}
    v${(-h*.24).toFixed(1)} h${(-l*.92).toFixed(1)} z" fill="${blanc}"/>`;
  s += `<path d="M${(x+l*.1).toFixed(1)} ${(y-h*.63).toFixed(1)} h${(l*.74).toFixed(1)}
    v${(-h*.18).toFixed(1)} h${(-l*.74).toFixed(1)} z" fill="${blanc}"/>`;
  /* les hublots */
  for (let k = 0; k < 26; k++)
    s += `<rect x="${(x+l*.07+k*l*.033).toFixed(1)}" y="${(y-h*.55).toFixed(1)}"
      width="${(l*.015).toFixed(1)}" height="${(h*.07).toFixed(1)}" fill="${voiler('#5c7a8c', d)}"/>`;
  /* la passerelle et la cheminée */
  s += `<path d="M${(x+l*.62).toFixed(1)} ${(y-h*.81).toFixed(1)} h${(l*.2).toFixed(1)}
    v${(-h*.12).toFixed(1)} h${(-l*.2).toFixed(1)} z" fill="${blanc}"/>`;
  s += `<path d="M${(x+l*.68).toFixed(1)} ${(y-h*.93).toFixed(1)} h${(l*.09).toFixed(1)}
    v${(-h*.16).toFixed(1)} h${(-l*.09).toFixed(1)} z" fill="${rouge}"/>`;
  s += `<path d="M${(x+l*.68).toFixed(1)} ${(y-h*1.06).toFixed(1)} h${(l*.09).toFixed(1)} v${(-h*.03).toFixed(1)}
    h${(-l*.09).toFixed(1)} z" fill="${voiler('#2f3a44', d)}"/>`;
  /* la rampe arrière, baissée sur le quai */
  s += `<path d="M${(x+l*.02).toFixed(1)} ${(y-h*.3).toFixed(1)} l${(-l*.06).toFixed(1)} ${(h*.32).toFixed(1)}
    h${(l*.05).toFixed(1)} l${(l*.05).toFixed(1)} ${(-h*.3).toFixed(1)} z" fill="${voiler('#4a5560', d)}"/>`;
  return s + `</g>`;
}

/* ---------- les piles de conteneurs, 300 m ---------- */
function conteneurs(){
  const d = 300, y = sol(d), h = px(2.6, d), l = px(12, d);
  const TONS = ['#c2603a','#3f6b9a','#8a5a6a','#5c8f6a','#b8863a','#7a4a8a','#c9a83a'];
  let s = '';
  for (let p = 0; p < 7; p++){
    const x = 214 + p * (l * .52);
    const n = 2 + Math.floor(rnd(p + 3) * 3);
    for (let k = 0; k < n; k++){
      const c = voiler(TONS[(p * 3 + k) % 7], d);
      s += `<rect x="${x.toFixed(1)}" y="${(y - h*(k+1)).toFixed(1)}" width="${(l*.5).toFixed(1)}"
        height="${(h*.94).toFixed(1)}" fill="${c}"/>`;
      s += `<rect x="${x.toFixed(1)}" y="${(y - h*(k+1)).toFixed(1)}" width="${(l*.5).toFixed(1)}"
        height="${(h*.16).toFixed(1)}" fill="#fff" opacity=".16"/>`;
      s += `<g stroke="#000" stroke-width=".4" opacity=".14">`;
      for (let q = 1; q < 5; q++)
        s += `<path d="M${(x + q*l*.1).toFixed(1)} ${(y - h*(k+1)).toFixed(1)} v${(h*.94).toFixed(1)}"/>`;
      s += `</g>`;
    }
  }
  return s;
}

/* ---------- la digue du large, tout au fond ---------- */
function digue(){
  const d = 2600, y = sol(d), h = px(10, d);
  let s = `<rect x="0" y="${(y-h).toFixed(1)}" width="${W}" height="${h.toFixed(1)}"
    fill="${voiler('#8a8878', d)}" opacity=".7"/>`;
  /* le petit phare */
  s += `<rect x="292" y="${(y-h*3.2).toFixed(1)}" width="${(h*.7).toFixed(1)}"
    height="${(h*2.2).toFixed(1)}" fill="${voiler('#e0dcd0', d)}"/>`;
  s += `<rect x="292" y="${(y-h*2.4).toFixed(1)}" width="${(h*.7).toFixed(1)}"
    height="${(h*.5).toFixed(1)}" fill="${voiler('#c2603a', d)}"/>`;
  return s;
}

/* ============================================================
   TON QUAI — le terminal, de 62 m à 13 m
   ============================================================ */

/* un conteneur, au premier plan */
function conteneur(x, d, dy, ton){
  const y = sol(d) + (dy || 0), h = px(2.6, d), l = px(6.1, d);
  const C = ton || '#c2603a';
  let s = `<g>`;
  s += `<ellipse cx="${(x+l*.5).toFixed(1)}" cy="${y.toFixed(1)}" rx="${(l*.54).toFixed(1)}"
    ry="${(h*.09).toFixed(1)}" fill="#3f3a30" opacity=".2"/>`;
  s += `<rect x="${x.toFixed(1)}" y="${(y-h).toFixed(1)}" width="${l.toFixed(1)}"
    height="${h.toFixed(1)}" fill="${C}"/>`;
  s += `<rect x="${x.toFixed(1)}" y="${(y-h).toFixed(1)}" width="${l.toFixed(1)}"
    height="${(h*.13).toFixed(1)}" fill="#fff" opacity=".17"/>`;
  s += `<rect x="${x.toFixed(1)}" y="${(y-h*.14).toFixed(1)}" width="${l.toFixed(1)}"
    height="${(h*.14).toFixed(1)}" fill="#000" opacity=".14"/>`;
  /* les nervures */
  s += `<g stroke="#000" stroke-width="${(l*.006).toFixed(2)}" opacity=".16">`;
  for (let q = 1; q < 13; q++)
    s += `<path d="M${(x + q*l/13).toFixed(1)} ${(y-h*.86).toFixed(1)} v${(h*.72).toFixed(1)}"/>`;
  s += `</g>`;
  /* les ferrures d'angle */
  [[0,0],[l-h*.14,0],[0,h*.86],[l-h*.14,h*.86]].forEach(([a,b]) =>
    s += `<rect x="${(x+a).toFixed(1)}" y="${(y-h+b).toFixed(1)}" width="${(h*.14).toFixed(1)}"
      height="${(h*.14).toFixed(1)}" fill="#000" opacity=".2"/>`);
  /* les portes, à droite */
  s += `<path d="M${(x+l*.94).toFixed(1)} ${(y-h*.88).toFixed(1)} v${(h*.76).toFixed(1)}"
    stroke="#000" stroke-width="${(l*.008).toFixed(2)}" opacity=".22"/>`;
  return s + `</g>`;
}

/* le portique du quai, énorme, au-dessus du joueur */
function portiqueProche(){
  const d = 96, y = sol(d), h = px(56, d);
  const c = '#d08a3c', cs = '#a8642a', m = '#8a9299';
  let s = `<g>`;
  /* les jambes */
  [-1, 1].forEach(sg => {
    const x = 62 + sg * h * .26;
    s += `<path d="M${(x - sg*h*.02).toFixed(1)} ${y.toFixed(1)} v${(-h*.66).toFixed(1)}"
      stroke="${c}" stroke-width="${(h*.036).toFixed(1)}"/>`;
    /* le sabot sur le rail */
    s += `<rect x="${(x - h*.03).toFixed(1)}" y="${(y - h*.03).toFixed(1)}" width="${(h*.06).toFixed(1)}"
      height="${(h*.03).toFixed(1)}" fill="${m}"/>`;
  });
  /* les croisillons */
  s += `<g stroke="${cs}" stroke-width="${(h*.014).toFixed(1)}" opacity=".8">`;
  for (let k = 0; k < 2; k++){
    const ya = y - h * (.12 + k * .18), yb = y - h * (.3 + k * .18);
    s += `<path d="M${(62-h*.26).toFixed(1)} ${ya.toFixed(1)} L${(62+h*.26).toFixed(1)} ${yb.toFixed(1)}
      M${(62+h*.26).toFixed(1)} ${ya.toFixed(1)} L${(62-h*.26).toFixed(1)} ${yb.toFixed(1)}"/>`;
  }
  s += `</g>`;
  /* la poutre haute */
  s += `<path d="M${(62-h*.32).toFixed(1)} ${(y-h*.68).toFixed(1)} h${(h*1.5).toFixed(1)}"
    stroke="${c}" stroke-width="${(h*.045).toFixed(1)}"/>`;
  return s + `</g>`;
}

/* le portique en entier tient dans le cadre : on le coupe en haut */
function quaiJoliette(){
  let s = pave();

  /* les bittes du bord */
  [[60, 40], [60, 158], [60, 300], [60, 442]].forEach(([d, x]) => s += bitte(x, d));

  /* la rangée de conteneurs du fond */
  [[52, 6, '#3f6b9a'], [52, 92, '#c2603a'], [52, 178, '#5c8f6a'],
   [52, 264, '#b8863a'], [52, 350, '#8a5a6a']].forEach(([d, x, c]) => s += conteneur(x, d, 0, c));
  /* la deuxième couche */
  const h52 = px(2.6, 52);
  [[52, 48, '#c9a83a'], [52, 220, '#7a4a8a']].forEach(([d, x, c]) =>
    s += conteneur(x, d, -h52 * 1.02, c));

  /* les dockers */
  s += gens(150, 42, '#c9843a', '#e8c060', 'montre');
  s += gens(184, 40, '#4a5f74', '#e8c060', null);
  s += gens(330, 36, '#6d5c4a', '#e8c060', 'porte');

  /* un conteneur au milieu, plus près */
  s += conteneur(288, 30, 0, '#3f6b9a');
  s += conteneur(74, 28, 0, '#b8483a');

  /* les palettes et les fûts */
  s += tonneau(408, 34);
  s += tonneau(430, 32);
  s += caisse(206, 26);
  s += caisse(210, 23, 0, '#96754a');

  /* le cordage et la grosse bitte, tout devant */
  const dc = 24, yc = sol(dc), rc = px(1.1, dc);
  s += `<ellipse cx="128" cy="${yc.toFixed(1)}" rx="${(rc*1.1).toFixed(1)}"
    ry="${(rc*.3).toFixed(1)}" fill="#3f3a30" opacity=".2"/>`;
  for (let k = 3; k >= 0; k--)
    s += `<ellipse cx="128" cy="${(yc - k*rc*.18).toFixed(1)}" rx="${(rc*(1-k*.1)).toFixed(1)}"
      ry="${(rc*(.3-k*.028)).toFixed(1)}" fill="none"
      stroke="${k%2 ? '#c9b58c' : '#b8a276'}" stroke-width="${(rc*.19).toFixed(1)}"/>`;
  s += bitte(384, 18);

  /* un conteneur énorme, tout au premier plan à droite */
  s += conteneur(300, 15, 0, '#5c8f6a');

  /* les mouettes */
  s += `<g class="mouettePosee">
    <ellipse cx="252" cy="${(sol(46)-px(.36,46)).toFixed(1)}" rx="${px(.5,46).toFixed(1)}"
      ry="${px(.3,46).toFixed(1)}" fill="#f2efe6"/>
    <circle cx="${(252+px(.34,46)).toFixed(1)}" cy="${(sol(46)-px(.62,46)).toFixed(1)}"
      r="${px(.2,46).toFixed(1)}" fill="#f6f3ea"/></g>`;
  [[120, 380, sol(120)-96], [190, 100, sol(190)-74]].forEach(([dm, x, y0], i) => {
    const e = px(1.2, dm);
    s += `<g class="volee v${i}" opacity="${(.5 - i*.12).toFixed(2)}">`;
    for (let k = 0; k < 3; k++)
      s += `<path d="M${(x+k*e*2.4).toFixed(1)} ${(y0+k*e*.9).toFixed(1)}
        q${(e*.5).toFixed(1)} ${(-e*.42).toFixed(1)} ${e.toFixed(1)} 0
        q${(e*.5).toFixed(1)} ${(-e*.42).toFixed(1)} ${e.toFixed(1)} 0"
        stroke="#f2efe6" stroke-width="${(e*.16).toFixed(2)}" fill="none" stroke-linecap="round"/>`;
    s += `</g>`;
  });
  return s;
}

function laJoliette(){
  return ciel() + collines() + digue() + major() + tour() + eau() + docks()
       + portiques() + conteneurs() + ferry2() + quaiJoliette();
}


function dessiner(){
  const v = cadrer(innerWidth, innerHeight);
  document.getElementById('sc').innerHTML =
    '<svg viewBox="0 ' + v.y.toFixed(1) + ' ' + W + ' ' + v.h.toFixed(1) + '" '
    + 'preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">'
    + laJoliette() + '</svg>';
}
dessiner();
let t = null;
addEventListener('resize', () => { clearTimeout(t); t = setTimeout(dessiner, 200); });
