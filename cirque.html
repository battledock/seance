<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#17110b" id="tc">
<title>Battle Dock — Le cirque</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="couleurs.css?v=2">
<style>
/* ============================================================
   LE CIRQUE BATTAGLINI — Ajaccio
   Rouge et or, une toile qui s'affaisse, des ampoules qui ne
   marchent pas toutes. Le luxe fatigué d'une troupe qui n'est
   jamais repartie.
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none}
html,body{min-height:100%;background:var(--nuit-bois);color:#f6e6d8;
  font-family:'Nunito',system-ui,sans-serif}

#sc{position:fixed;left:0;right:0;top:0;height:54%;overflow:hidden;
  opacity:0;transition:opacity .34s ease}
#sc.pret{opacity:1}
#sc svg{display:block;width:100%;height:100%}
/* le fondu vers le bas, et un vignettage qui referme les bords :
   c'est ce qui donne l'impression d'un regard, pas d'une image */
#sc::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(ellipse 120% 86% at 50% 42%,
      rgba(20,8,16,0) 42%, rgba(20,8,16,.55) 100%),
    linear-gradient(180deg,rgba(42,20,32,.34) 0,rgba(42,20,32,0) 26%,
      rgba(42,20,32,.7) 78%,#2a1420 100%)}
/* un grain très fin, pour que les aplats ne soient pas plats */
#sc::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;
  opacity:.06;mix-blend-mode:overlay;
  background-image:repeating-conic-gradient(#fff 0 0.0006turn,#000 0 0.0012turn);
  background-size:3px 3px}

.tete{position:fixed;left:0;right:0;top:0;z-index:8;display:flex;align-items:center;
  gap:10px;padding:calc(env(safe-area-inset-top) + 14px) 14px 0}
.tete .ret{flex:0 0 40px;height:40px;border-radius:11px;cursor:pointer;
  border:3px solid #f6e6d8;background:rgba(42,20,32,.5);display:flex;
  align-items:center;justify-content:center;backdrop-filter:blur(8px)}
.tete .ret svg{width:17px;height:17px;stroke:#f6e6d8;fill:none;stroke-width:2.4;
  stroke-linecap:round;stroke-linejoin:round}
.tete .ou{flex:1;min-width:0}
.tete .ou b{display:block;font-family:'DM Serif Display',Georgia,serif;font-size:23px;
  line-height:1.1;text-shadow:0 2px 12px rgba(20,6,14,.7)}
.tete .ou span{display:block;font-size:9px;letter-spacing:.2em;text-transform:uppercase;
  color:rgba(246,230,216,.6);font-weight:800;margin-top:3px}

.w{position:fixed;left:0;right:0;top:49%;bottom:0;z-index:5;overflow-y:auto;
  padding:0 16px calc(env(safe-area-inset-bottom) + 28px)}
.w::-webkit-scrollbar{display:none}

/* ---------- ce qui se dit ---------- */
.dit{padding-top:20px;display:flex;flex-direction:column;gap:16px}
/* la narration est en romain, discrète ; la parole est en serif,
   plus grande, sans guillemets tapageurs : elle porte seule. */
.dit p{font-size:14.5px;line-height:1.75;color:rgba(246,230,216,.7);
  opacity:0;transform:translateY(10px);animation:venir .7s forwards}
.dit p.parle{font-family:'DM Serif Display',Georgia,serif;font-weight:400;
  color:#fff;font-size:21px;line-height:1.45;padding-left:16px;
  border-left:3px solid #d4a03a;letter-spacing:.005em}
.dit p.mamma{color:#e8c8a8;font-style:italic;padding-left:16px;
  border-left:3px solid rgba(246,230,216,.26);font-size:14px}
@keyframes venir{to{opacity:1;transform:none}}

h2{font-size:9px;letter-spacing:.22em;text-transform:uppercase;font-weight:900;
  color:rgba(246,230,216,.42);margin:24px 2px 11px;
  display:flex;justify-content:space-between;align-items:baseline}
h2 em{font-style:normal;color:#d4a03a;letter-spacing:.1em}

/* ---------- les choix ---------- */
.choix{display:flex;flex-direction:column;gap:9px}
.choix button{width:100%;text-align:left;padding:14px 16px;border-radius:14px;
  cursor:pointer;font-family:inherit;position:relative;overflow:hidden;
  border:2px solid rgba(246,230,216,.2);
  background:linear-gradient(180deg,rgba(86,32,52,.7),rgba(56,20,36,.7));
  transition:transform .13s,border-color .2s,background .2s}
.choix button::after{content:"›";position:absolute;right:15px;top:50%;
  transform:translateY(-50%);font-size:20px;color:rgba(246,230,216,.28)}
.choix button.vif::after{color:#d4a03a}
.choix button:active{transform:scale(.987)}
.choix button:disabled{opacity:.45;cursor:default}
.choix button b{display:block;font-size:16px;color:#f6e6d8;font-weight:700;
  line-height:1.35;padding-right:22px}
.choix button b .px{float:right;font-size:11.5px;font-weight:800;color:#d4a03a;
  padding-left:10px}
.choix button span{display:block;font-size:11.5px;color:rgba(246,230,216,.42);
  margin-top:4px;line-height:1.45;padding-right:22px}
.choix button.vif{border-color:#d4a03a;background:rgba(120,58,20,.5)}

.go{width:100%;padding:15px;border-radius:13px;cursor:pointer;margin-top:6px;
  border:3px solid #2a1420;background:#d4a03a;color:#2a1420;
  font-family:inherit;font-size:16px;font-weight:900}
.go:disabled{background:rgba(246,230,216,.14);color:rgba(246,230,216,.4);
  border-color:transparent;cursor:default}
.go:active:not(:disabled){transform:translateY(2px)}

/* ---------- la troupe ---------- */
.gens{display:flex;flex-direction:column;gap:9px}
.p{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:12px;
  background:rgba(70,26,44,.45);border:2px solid rgba(246,230,216,.12)}
.p .f{flex:0 0 38px;height:38px;border-radius:10px;overflow:hidden;
  background:#3e1c2e;border:2px solid rgba(246,230,216,.24)}
.p .f svg{display:block;width:100%;height:100%}
.p .t{flex:1;min-width:0}
.p .t b{display:block;font-size:13.5px}
.p .t i{display:block;font-style:normal;font-size:9px;letter-spacing:.14em;
  text-transform:uppercase;color:rgba(212,160,58,.75);font-weight:800;margin-top:2px}
.p .t span{display:block;font-size:12px;color:rgba(246,230,216,.55);margin-top:6px;
  line-height:1.55}

/* ---------- les cinq chèvres ---------- */
.rang{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.ch{border-radius:11px;overflow:hidden;cursor:pointer;background:#3e1c2e;
  border:2.5px solid rgba(246,230,216,.2);transition:transform .13s,border-color .2s}
.ch:active{transform:scale(.95)}
.ch.regardee{border-color:#d4a03a;box-shadow:0 0 0 3px rgba(212,160,58,.25)}
.ch.non{opacity:.35}
.ch svg{display:block;width:100%;height:auto}
.ch b{display:block;text-align:center;font-size:11px;padding:4px 0 6px;
  color:rgba(246,230,216,.6);font-weight:800}

/* la troupe se replie : on la consulte, elle ne s'impose pas */
.troupe{margin-top:26px;border-top:1px solid rgba(246,230,216,.12);padding-top:14px}
.troupe summary{list-style:none;cursor:pointer;font-size:9px;letter-spacing:.22em;
  text-transform:uppercase;font-weight:900;color:rgba(246,230,216,.42);
  display:flex;justify-content:space-between;align-items:center}
.troupe summary::-webkit-details-marker{display:none}
.troupe summary::after{content:"+";font-size:16px;letter-spacing:0}
.troupe[open] summary::after{content:"−"}
.troupe .gens{margin-top:12px}

.mot{font-size:12.5px;line-height:1.7;color:rgba(246,230,216,.45);margin-top:18px;
  text-align:center;padding:0 6px}
.fait{padding:14px 16px;border-radius:13px;background:rgba(46,74,46,.5);
  border:2px solid rgba(140,224,168,.34);font-size:13.5px;line-height:1.65;
  color:#bfe8c8}
.rien{padding:24px 16px;text-align:center;font-size:13px;line-height:1.7;
  color:rgba(246,230,216,.5)}

/* ---------- ce qui bouge sous la toile ---------- */
.ampoule{animation:clignote 4s ease-in-out infinite}
.a1{animation-delay:-1.2s} .a2{animation-delay:-2.6s} .a3{animation-delay:-3.4s}
.a4{animation-duration:6s} .a5{animation-delay:-.6s;animation-duration:5s}
@keyframes clignote{0%,100%{opacity:1}44%{opacity:1}48%{opacity:.35}52%{opacity:1}}
.fanion{animation:flotte 3.6s ease-in-out infinite;
  transform-box:fill-box;transform-origin:top left}
.f2{animation-delay:-1.1s} .f3{animation-delay:-2.2s} .f4{animation-delay:-.5s}
@keyframes flotte{0%,100%{transform:rotate(0)}50%{transform:rotate(4deg)}}
.fumee{animation:monte 9s ease-out infinite}
@keyframes monte{0%{transform:translate(0,0);opacity:0}
  20%{opacity:.4}100%{transform:translate(14px,-70px);opacity:0}}
/* rien n'est parfaitement immobile : la toile respire, la vieille
   aussi, la lanterne vacille, la chèvre remue la queue */
.respire{animation:souffle 5.4s ease-in-out infinite;transform-box:fill-box;
  transform-origin:50% 100%}
@keyframes souffle{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.018)}}
.toile{animation:onduler 8s ease-in-out infinite;transform-box:fill-box;
  transform-origin:50% 0}
@keyframes onduler{0%,100%{transform:skewX(0)}50%{transform:skewX(.5deg)}}
.vacille{animation:flamme 2.6s ease-in-out infinite}
@keyframes flamme{0%,100%{opacity:1}30%{opacity:.82}55%{opacity:1}72%{opacity:.9}}
.queue{animation:remue 2.2s ease-in-out infinite;transform-box:fill-box;
  transform-origin:0 50%}
@keyframes remue{0%,100%{transform:rotate(0)}50%{transform:rotate(-16deg)}}

@media (prefers-reduced-motion:reduce){*{animation:none !important}}

/* ---------- la piste : le numéro se joue en plein écran ---------- */
#piste{position:fixed;inset:0;z-index:70;background:#3a1420;display:none;
  flex-direction:column;padding:calc(env(safe-area-inset-top) + 12px) 14px
  calc(env(safe-area-inset-bottom) + 16px)}
#piste.on{display:flex}
.pi-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.pi-h span{font-family:'DM Serif Display',Georgia,serif;font-size:21px}
.pi-h button{width:36px;height:36px;border-radius:10px;cursor:pointer;
  border:2.5px solid rgba(246,230,216,.4);background:transparent;color:#f6e6d8;
  font-size:15px;font-family:inherit}
.pi-sc{flex:1;min-height:0;border-radius:16px;overflow:hidden;
  border:3px solid #d4a03a;background:#2a1018;position:relative;
  touch-action:manipulation}
.pi-sc svg{display:block;width:100%;height:100%}
.pi-b{display:flex;gap:8px;margin-top:10px}
.pi-s{flex:1;text-align:center;padding:9px 4px;border-radius:11px;
  background:rgba(70,26,44,.6);border:2px solid rgba(246,230,216,.14)}
.pi-s i{display:block;font-style:normal;font-size:8px;letter-spacing:.14em;
  text-transform:uppercase;color:rgba(246,230,216,.45);font-weight:800}
.pi-s b{display:block;font-size:19px;margin-top:3px}
.pi-m{font-size:12.5px;line-height:1.55;color:rgba(246,230,216,.5);
  text-align:center;margin:11px 0}

/* ---------- le rideau, avant le vrai passage ---------- */
.rideau{position:absolute;inset:0;overflow:hidden;background:#2a0c14}
.rideau i{position:absolute;top:0;bottom:0;width:52%;
  background:repeating-linear-gradient(90deg,#a8323a 0 14px,#7d1a20 14px 28px);
  border-bottom:5px solid #d4a03a}
.rideau .rg{left:0;animation:ouvreG 1.2s .25s cubic-bezier(.5,0,.3,1) forwards}
.rideau .rd{right:0;animation:ouvreD 1.2s .25s cubic-bezier(.5,0,.3,1) forwards}
@keyframes ouvreG{to{transform:translateX(-100%)}}
@keyframes ouvreD{to{transform:translateX(100%)}}
.rideau b{position:absolute;left:0;right:0;top:44%;text-align:center;
  font-family:'DM Serif Display',Georgia,serif;font-size:23px;color:#f0d69a;
  z-index:2;opacity:0;animation:annonce 1.5s forwards}
@keyframes annonce{0%{opacity:0}22%{opacity:1}72%{opacity:1}100%{opacity:0}}

/* le compte à rebours du vrai passage */
.rebours{position:absolute;inset:0;display:flex;align-items:center;
  justify-content:center;background:#2a0c14}
.rebours b{font-family:'DM Serif Display',Georgia,serif;font-size:96px;color:#f0d69a;
  animation:tombe2 .72s ease-out}
.rebours b.go2{font-size:46px;color:#d4a03a}
@keyframes tombe2{0%{transform:scale(1.9);opacity:0}
  30%{transform:scale(1);opacity:1}100%{transform:scale(.94);opacity:.9}}

/* ---------- l'affiche de la semaine ---------- */
.aff{margin-top:12px;border-radius:13px;overflow:hidden;
  border:2px solid rgba(212,160,58,.4)}
.af{display:flex;align-items:center;gap:10px;padding:8px 12px;
  background:rgba(70,26,44,.5);border-bottom:1px solid rgba(246,230,216,.09)}
.af:last-child{border-bottom:0}
.af.moi{background:rgba(120,58,20,.6)}
.af i{font-style:normal;flex:0 0 18px;font-weight:900;color:#d4a03a;font-size:13px}
.af .pf{flex:0 0 28px;height:28px;border-radius:7px;overflow:hidden;background:#3e1c2e}
.af .pf svg{display:block;width:100%;height:100%}
.af b{flex:1;min-width:0;font-size:13.5px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.af .sc{flex:0 0 auto;font-size:14px;font-weight:900;color:#f6e6d8}

/* le résultat du passage, en grand */
.issue2{padding:28px 20px;text-align:center}
.issue2 b{display:block;font-family:'DM Serif Display',Georgia,serif;font-size:46px;
  color:#d4a03a;line-height:1}
.issue2 i{display:block;font-style:normal;font-size:9.5px;letter-spacing:.2em;
  text-transform:uppercase;color:rgba(246,230,216,.45);font-weight:800;margin-top:6px}
.issue2 p{font-size:15px;line-height:1.7;margin-top:22px;color:rgba(246,230,216,.85)}
.issue2 span{display:block;margin-top:20px;font-size:15px;font-weight:800;color:#8ce0a8}
.issue2 .jt{margin-top:8px;color:#d4a03a}

#charge{position:fixed;inset:0;z-index:90;background:#2a1420;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:16px;
  transition:opacity .45s}
#charge.parti{opacity:0;pointer-events:none}
#charge .ti{font-family:'DM Serif Display',Georgia,serif;font-size:22px;color:#d4a03a;
  letter-spacing:.06em}
#charge .fl{width:110px;height:3px;border-radius:2px;background:rgba(212,160,58,.2);
  overflow:hidden}
#charge .fl i{display:block;width:38%;height:100%;background:#d4a03a;
  animation:va 1.15s ease-in-out infinite}
@keyframes va{0%{transform:translateX(-115%)}100%{transform:translateX(275%)}}
</style>
</head>
<body>

<div id="charge"><div class="ti">LE CIRQUE</div><div class="fl"><i></i></div></div>

<div id="sc"></div>

<div class="tete">
  <button class="ret" id="ret" aria-label="Retour">
    <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <span class="ou"><b>Le cirque Battaglini</b><span>La place — Ajaccio</span></span>
</div>

<div class="w" id="w"></div>

<div id="piste">
  <div class="pi-h">
    <span id="pi-tt">Ton numéro</span>
    <button id="pi-x" aria-label="Sortir">✕</button>
  </div>
  <div class="pi-sc" id="pi-sc"></div>
  <div class="pi-b">
    <span class="pi-s"><i>Attrapées</i><b id="pi-a">0</b></span>
    <span class="pi-s"><i>Suite</i><b id="pi-l">0</b></span>
    <span class="pi-s"><i id="pi-t3">Belles prises</i><b id="pi-r">0</b></span>
  </div>
  <p class="pi-m" id="pi-m">Touche l'écran quand une massue passe dans le cercle.</p>
  <button class="go" id="pi-go">Commencer</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="bd.js?v=5"></script>
<script src="son.js?v=2"></script>
<script>
function rnd(s){ var x = Math.sin(s * 127.1) * 43758.5; return x - Math.floor(x); }

/* mélanger deux teintes : c'est ce qui permet d'éclairer ou
   d'assombrir une même toile selon le côté où elle est. */
function mel2(a, b, k){
  function h(c){ return [parseInt(c.slice(1,3),16), parseInt(c.slice(3,5),16),
    parseInt(c.slice(5,7),16)]; }
  var A = h(a), B = h(b), o = '#';
  for (var i = 0; i < 3; i++){
    var v = Math.round(A[i] + (B[i] - A[i]) * k).toString(16);
    o += v.length < 2 ? '0' + v : v;
  }
  return o;
}

/* ============================================================
   LE DÉCOR — le chapiteau, un soir
   ============================================================ */
function chapiteau(){
  var W = 480, H = 620;
  var s = '<defs>'
    + '<linearGradient id="c-ciel" x1="0" y1="0" x2="0" y2="1">'
    +   '<stop offset="0%" stop-color="#1e1030"/>'
    +   '<stop offset="52%" stop-color="#4a2038"/>'
    +   '<stop offset="100%" stop-color="#8a4030"/></linearGradient>'
    + '<radialGradient id="c-halo" cx="0.5" cy="0.5">'
    +   '<stop offset="0%" stop-color="#ffd88a" stop-opacity=".5"/>'
    +   '<stop offset="100%" stop-color="#ffd88a" stop-opacity="0"/></radialGradient>'
    + '</defs>';

  s += '<rect x="0" y="0" width="' + W + '" height="' + H + '" fill="url(#c-ciel)"/>';

  /* quelques étoiles, du côté sombre */
  for (var e = 0; e < 26; e++)
    s += '<circle cx="' + (rnd(e * 3) * W).toFixed(0) + '" cy="'
      + (rnd(e * 7) * 210).toFixed(0) + '" r="' + (0.8 + rnd(e) * 1.2).toFixed(1)
      + '" fill="#fff4d8" opacity="' + (.2 + rnd(e * 5) * .5).toFixed(2) + '"/>';

  /* les toits de la ville, derrière */
  for (var t = 0; t < 40; t++){
    var tx = -10 + t * 13, th = 26 + rnd(t * 3) * 44;
    s += '<rect x="' + tx.toFixed(0) + '" y="' + (438 - th).toFixed(0) + '" width="'
      + (12 + rnd(t) * 5).toFixed(0) + '" height="' + (th + 40).toFixed(0) + '" fill="'
      + ['#3a2030','#472838','#2e1a28'][t % 3] + '" opacity=".9"/>';
    /* une fenêtre éclairée de temps en temps */
    if (rnd(t * 11) > .68)
      s += '<rect x="' + (tx + 4).toFixed(0) + '" y="' + (452 - th).toFixed(0)
        + '" width="5" height="7" fill="#ffcf78" opacity=".75"/>';
  }

  /* ---------- le chapiteau ---------- */
  var cx = 240, base = 470, haut = 168, larg = 208;

  /* le halo des ampoules autour */
  s += '<ellipse cx="' + cx + '" cy="' + (base - 90) + '" rx="250" ry="180"'
    + ' fill="url(#c-halo)"/>';

  /* le mât et son fanion */
  s += '<path d="M' + cx + ' ' + haut + ' v-38" stroke="#6d4028" stroke-width="5"/>';
  s += '<path class="fanion" d="M' + cx + ' ' + (haut - 38) + ' l34 11 l-34 11 z"'
    + ' fill="#d4a03a" stroke="#3e1c2e" stroke-width="2.4"/>';

  /* la toile : des fuseaux rouges et crème, un peu affaissés */
  for (var q = 0; q < 8; q++){
    var a1 = -Math.PI / 2 + (q - 4) * .2, a2 = -Math.PI / 2 + (q - 3) * .2;
    var x1 = cx + Math.cos(a1) * larg, x2 = cx + Math.cos(a2) * larg;
    /* le bord du bas ondule : la toile pend entre les mâts */
    var creux = 16 + Math.abs(q - 3.5) * 3;
    s += '<path d="M' + cx + ' ' + haut
      + ' Q' + ((cx + x1) / 2).toFixed(0) + ' ' + (haut + 120)
      + ' ' + x1.toFixed(0) + ' ' + base
      + ' q' + ((x2 - x1) / 2).toFixed(0) + ' ' + creux + ' ' + (x2 - x1).toFixed(0) + ' 0'
      + ' Q' + ((cx + x2) / 2).toFixed(0) + ' ' + (haut + 120) + ' ' + cx + ' ' + haut
      + ' Z" fill="' + (q % 2 ? '#c9302c' : '#f2e2c4') + '"/>';
  }
  /* la couture du sommet */
  s += '<ellipse cx="' + cx + '" cy="' + haut + '" rx="16" ry="7" fill="#8a2420"/>';

  /* le galon d'or, en festons */
  var fest = 'M' + (cx - larg) + ' ' + base;
  for (var f = 0; f < 8; f++){
    var xa = cx - larg + f * (larg * 2 / 8);
    fest += ' q' + (larg / 8).toFixed(0) + ' 20 ' + (larg * 2 / 8).toFixed(0) + ' 0';
  }
  s += '<path d="' + fest + '" stroke="#d4a03a" stroke-width="6" fill="none"/>';

  /* les ampoules du pourtour, dont certaines lâchent */
  for (var b = 0; b < 15; b++){
    var bx = cx - larg + 8 + b * ((larg * 2 - 16) / 14);
    var by = base + 12 + Math.sin(b / 14 * Math.PI * 8) * 6;
    s += '<circle class="ampoule a' + (b % 6) + '" cx="' + bx.toFixed(0) + '" cy="'
      + by.toFixed(0) + '" r="4.6" fill="' + (b === 4 || b === 11 ? '#6d5a3a' : '#ffe08a')
      + '"/>';
    if (b !== 4 && b !== 11)
      s += '<circle class="ampoule a' + (b % 6) + '" cx="' + bx.toFixed(0) + '" cy="'
        + by.toFixed(0) + '" r="11" fill="#ffe08a" opacity=".2"/>';
  }

  /* l'entrée : deux pans écartés, et le noir dedans */
  s += '<path d="M' + (cx - 46) + ' ' + base + ' v-96 q46 -30 92 0 v96 z" fill="#20101c"/>';
  s += '<path d="M' + (cx - 46) + ' ' + base + ' v-96 q-22 -6 -34 6 l6 90 z"'
    + ' fill="#c9302c"/>';
  s += '<path d="M' + (cx + 46) + ' ' + base + ' v-96 q22 -6 34 6 l-6 90 z"'
    + ' fill="#a82420"/>';
  /* la lumière qui sort de l'entrée */
  s += '<path d="M' + (cx - 40) + ' ' + base + ' l14 -70 h52 l14 70 z"'
    + ' fill="#ffcf78" opacity=".2"/>';

  /* l'enseigne */
  s += '<rect x="' + (cx - 92) + '" y="' + (base - 148) + '" width="184" height="40"'
    + ' rx="8" fill="#3e1c2e" stroke="#d4a03a" stroke-width="3.4"/>';
  s += '<text x="' + cx + '" y="' + (base - 120) + '" text-anchor="middle"'
    + ' font-family="Georgia,serif" font-size="22" fill="#d4a03a"'
    + ' letter-spacing="2">BATTAGLINI</text>';

  /* ---------- la place, devant ---------- */
  s += '<rect x="0" y="' + base + '" width="' + W + '" height="' + (H - base)
    + '" fill="#4a3028"/>';
  for (var p = 0; p < 90; p++)
    s += '<ellipse cx="' + (rnd(p * 3) * W).toFixed(0) + '" cy="'
      + (base + 6 + rnd(p * 7) * (H - base)).toFixed(0) + '" rx="'
      + (3 + rnd(p) * 7).toFixed(0) + '" ry="' + (1.6 + rnd(p * 5) * 2.6).toFixed(0)
      + '" fill="' + ['#54382e','#3e2822','#5e4034'][p % 3] + '" opacity=".7"/>';

  /* la roulotte, à gauche */
  s += '<g>';
  s += '<rect x="14" y="' + (base - 74) + '" width="104" height="66" rx="6"'
    + ' fill="#2e5a4a" stroke="#1a2e26" stroke-width="3"/>';
  s += '<path d="M8 ' + (base - 74) + ' h116 l-10 -16 h-96 z" fill="#c9302c"/>';
  for (var w = 0; w < 3; w++)
    s += '<rect x="' + (26 + w * 30) + '" y="' + (base - 62) + '" width="20" height="22"'
      + ' rx="3" fill="#ffcf78" opacity="' + (w === 1 ? '.85' : '.3') + '"/>';
  s += '<circle cx="40" cy="' + (base - 4) + '" r="13" fill="#3e2820"'
    + ' stroke="#6d4a30" stroke-width="3"/>';
  s += '<circle cx="96" cy="' + (base - 4) + '" r="13" fill="#3e2820"'
    + ' stroke="#6d4a30" stroke-width="3"/>';
  /* la cheminée et sa fumée */
  s += '<rect x="94" y="' + (base - 104) + '" width="12" height="22" fill="#4a3028"/>';
  for (var m = 0; m < 3; m++)
    s += '<circle class="fumee" cx="100" cy="' + (base - 108) + '" r="'
      + (5 + m * 2) + '" fill="#e8d8c8" opacity=".3"'
      + ' style="animation-delay:-' + (m * 3) + 's"/>';
  s += '</g>';

  /* les fanions tendus entre la roulotte et le chapiteau */
  for (var g = 0; g < 6; g++){
    var gx = 120 + g * 20, gy = base - 108 + Math.sin(g / 5 * Math.PI) * 12;
    s += '<path class="fanion f' + (g % 4) + '" d="M' + gx + ' ' + gy.toFixed(0)
      + ' l13 0 l-6.5 15 z" fill="' + ['#d4a03a','#c9302c','#2e5a4a'][g % 3] + '"/>';
  }

  /* Rosine, attachée à un piquet, qui mange quelque chose */
  s += chevre(392, base - 6, 1.15, '#d8cfc0');
  s += '<path d="M370 ' + (base - 4) + ' v-26" stroke="#6d4a30" stroke-width="4"/>';
  s += '<path d="M370 ' + (base - 26) + ' q12 8 18 -2" stroke="#8a7050"'
    + ' stroke-width="2" fill="none"/>';

  return s;
}

/* ---------- une chèvre ----------
   robe, cornes, œil et clochette varient : c'est ce qui permet
   de les distinguer au concours. */
function chevre(x, y, e, robe, cornes, oeil, clochette){
  var c = robe || '#d8cfc0';
  var f = '#3a2a22';
  var s = '<g transform="translate(' + x + ',' + y + ') scale(' + (e || 1) + ')">';

  /* l'ombre */
  s += '<ellipse cx="0" cy="2" rx="34" ry="6" fill="#20101c" opacity=".3"/>';
  /* les pattes */
  [[-20,0],[-9,1],[9,1],[20,0]].forEach(function(p){
    s += '<path d="M' + p[0] + ' -26 v' + (24 + p[1]) + '" stroke="' + f
      + '" stroke-width="5" stroke-linecap="round"/>';
    s += '<path d="M' + p[0] + ' ' + (-2 + p[1]) + ' h4" stroke="#1e1410"'
      + ' stroke-width="5" stroke-linecap="round"/>';
  });
  /* le corps */
  s += '<ellipse cx="0" cy="-38" rx="30" ry="18" fill="' + c + '"/>';
  s += '<ellipse cx="-6" cy="-42" rx="22" ry="11" fill="#ffffff" opacity=".22"/>';
  /* la queue, relevée, qui remue */
  s += '<path class="queue" d="M28 -44 l10 -8 l-2 9 z" fill="' + c + '"/>';
  /* le cou et la tête */
  s += '<path d="M-24 -44 q-14 -6 -20 -20 l12 -6 q8 12 16 16 z" fill="' + c + '"/>';
  s += '<ellipse cx="-46" cy="-70" rx="14" ry="10" fill="' + c + '"/>';
  /* le museau */
  s += '<ellipse cx="-58" cy="-64" rx="7" ry="6" fill="#efe6da"/>';
  s += '<circle cx="-61" cy="-65" r="1.6" fill="' + f + '"/>';
  /* l'oreille tombante */
  s += '<path d="M-40 -78 q-10 -8 -18 -4 q8 6 16 8 z" fill="' + c + '"/>';
  s += '<path d="M-40 -78 q-10 -8 -18 -4 q8 6 16 8 z" fill="#00000018"/>';

  /* les cornes : droites, recourbées, ou pas de cornes */
  var k = cornes === undefined ? 1 : cornes;
  if (k === 0)
    s += '<path d="M-44 -80 q-2 -16 4 -22 M-36 -80 q0 -16 6 -20" stroke="' + f
      + '" stroke-width="4" fill="none" stroke-linecap="round"/>';
  if (k === 1)
    s += '<path d="M-44 -80 q-6 -18 6 -24 q-4 10 0 22 M-36 -80 q-4 -16 8 -20'
      + ' q-6 8 -2 18" stroke="' + f + '" stroke-width="4" fill="none"'
      + ' stroke-linecap="round"/>';

  /* l'œil : rond, mi-clos, ou fermé */
  var o = oeil === undefined ? 0 : oeil;
  if (o === 0){
    s += '<ellipse cx="-50" cy="-73" rx="4" ry="3.4" fill="#efe6da"/>';
    s += '<rect x="-52" y="-74.4" width="4" height="2.6" rx="1.3" fill="' + f + '"/>';
  } else if (o === 1){
    s += '<path d="M-54 -73 q4 -3 8 0" stroke="' + f + '" stroke-width="2.6"'
      + ' fill="none" stroke-linecap="round"/>';
  } else {
    s += '<ellipse cx="-50" cy="-73" rx="4.4" ry="4" fill="#efe6da"/>';
    s += '<circle cx="-50" cy="-73" r="2.4" fill="' + f + '"/>';
  }

  /* la barbiche */
  s += '<path d="M-56 -56 q-2 10 2 14 q4 -6 3 -14 z" fill="' + c + '"/>';

  /* la clochette, pour celles qui en portent une */
  if (clochette){
    s += '<path d="M-34 -56 q10 6 20 2" stroke="#8a2420" stroke-width="3" fill="none"/>';
    s += '<path d="M-26 -50 q-4 8 4 10 q8 -2 4 -10 z" fill="#d4a03a"'
      + ' stroke="#8a6a20" stroke-width="1.6"/>';
    s += '<circle cx="-22" cy="-39" r="2" fill="#8a6a20"/>';
  }
  return s + '</g>';
}

/* ---------- les portraits de la troupe ---------- */
function portrait(k){
  var s = '<svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">';
  s += '<rect width="60" height="60" fill="#3e1c2e"/>';
  if (k === 'don'){
    /* costume, nœud papillon, et le nez rouge */
    s += '<path d="M8 60 q4 -22 22 -24 q18 2 22 24 z" fill="#241820"/>';
    s += '<path d="M22 40 h16 l-8 20 z" fill="#f2e8dc"/>';
    s += '<path d="M30 44 l-7 -4 v8 z M30 44 l7 -4 v8 z" fill="#c9302c"/>';
    s += '<ellipse cx="30" cy="26" rx="15" ry="17" fill="#c9925e"/>';
    s += '<path d="M15 22 q0 -16 15 -16 q15 0 15 16 q-4 -9 -15 -9 q-11 0 -15 9 z"'
      + ' fill="#2e2028"/>';
    s += '<circle cx="24" cy="26" r="2.4" fill="#241820"/>';
    s += '<circle cx="36" cy="26" r="2.4" fill="#241820"/>';
    s += '<path d="M22 20 q4 -3 8 -1 M32 19 q4 -2 8 1" stroke="#2e2028"'
      + ' stroke-width="2.4" fill="none" stroke-linecap="round"/>';
    /* la moustache et le nez rouge */

    s += '<circle cx="30" cy="31" r="5" fill="#e0352c" stroke="#8a2420" stroke-width="1.6"/>';
  }
  if (k === 'mamma'){
    s += '<path d="M6 60 q6 -20 24 -22 q18 2 24 22 z" fill="#2a1a24"/>';
    s += '<ellipse cx="30" cy="28" rx="14" ry="16" fill="#c9a88e"/>';
    /* le fichu noir */
    s += '<path d="M14 26 q2 -18 16 -18 q14 0 16 18 q-2 -8 -16 -8 q-14 0 -16 8 z"'
      + ' fill="#1a1218"/>';
    s += '<path d="M14 26 q-4 20 6 30 h20 q10 -10 6 -30 q-4 12 -16 12 q-12 0 -16 -12 z"'
      + ' fill="#1a1218"/>';
    /* les yeux, très petits, très attentifs */
    s += '<path d="M22 28 q3 -2 6 0 M32 28 q3 -2 6 0" stroke="#241820"'

    s += '<path d="M25 37 q5 2 10 0" stroke="#8a6058" stroke-width="1.8" fill="none"/>';
    /* les rides */
    s += '<path d="M18 22 h6 M36 22 h6" stroke="#a8846a" stroke-width="1.4"/>';
  }
  if (k === 'ghjuvanni'){
    /* le clown blanc : maquillage complet, et l'air éteint */
    s += '<path d="M6 60 q6 -20 24 -22 q18 2 24 22 z" fill="#f2e8dc"/>';
    s += '<circle cx="18" cy="46" r="4" fill="#c9302c"/>';
    s += '<circle cx="42" cy="46" r="4" fill="#2e5a4a"/>';
    s += '<ellipse cx="30" cy="26" rx="15" ry="17" fill="#f6f0e6"/>';
    /* le sourcil peint, très haut : c'est ça qui fait le clown blanc */
    s += '<path d="M20 16 q4 -6 9 -2" stroke="#2e2028" stroke-width="2.6"'
      + ' fill="none" stroke-linecap="round"/>';
    s += '<path d="M31 14 q5 -4 9 2" stroke="#2e2028" stroke-width="2.6"'
      + ' fill="none" stroke-linecap="round"/>';
    /* les yeux baissés, avec la larme peinte */
    s += '<path d="M20 27 q4 3 8 0 M32 27 q4 3 8 0" stroke="#2e2028"'
      + ' stroke-width="2.2" fill="none" stroke-linecap="round"/>';
    s += '<path d="M24 31 l-1.4 6" stroke="#3a6a9a" stroke-width="2.4"'
      + ' stroke-linecap="round"/>';
    /* la bouche : le trait descend */
    s += '<path d="M23 39 q7 -4 14 0" stroke="#c9302c" stroke-width="3"'
      + ' fill="none" stroke-linecap="round"/>';
    s += '<circle cx="30" cy="33" r="4" fill="#e0352c"/>';
    /* la houppe */
    s += '<path d="M30 9 q-4 -7 2 -8 q6 1 2 8 z" fill="#c9302c"/>';
  }
  if (k === 'surveillant'){
    s += '<path d="M8 60 q4 -20 22 -22 q18 2 22 22 z" fill="#4a5a44"/>';
    s += '<ellipse cx="30" cy="27" rx="14" ry="16" fill="#c9925e"/>';
    s += '<path d="M14 20 q4 -12 16 -12 q12 0 16 12 z" fill="#3e3428"/>';
    /* il louche à force de surveiller */
    s += '<circle cx="24" cy="27" r="2.6" fill="#241820"/>';
    s += '<circle cx="35" cy="27" r="2.6" fill="#241820"/>';
    s += '<path d="M24 39 h12" stroke="#8a6058" stroke-width="2"/>';
    /* son carnet */
    s += '<rect x="38" y="42" width="14" height="18" rx="2" fill="#e8dcc8"'
      + ' stroke="#3a2a22" stroke-width="1.6"/>';
    s += '<path d="M41 47 h8 M41 51 h8 M41 55 h5" stroke="#8a7a68" stroke-width="1.2"/>';
  }
  if (k === 'rosine'){
    s += '<rect width="60" height="60" fill="#4a3028"/>';
    s += '<g transform="translate(46,52) scale(0.62)">'
      + chevre(0, 0, 1, '#d8cfc0', 1, 0, true) + '</g>';
  }
  return s + '</svg>';
}

/* ============================================================
   LES SCÈNES
   Chaque moment de l'histoire a son décor. On ne reste jamais
   devant la même image : la place, la roulotte, le chapiteau
   vide, le quai de nuit, la piste, l'arrière du chapiteau.
   ============================================================ */

/* ---------- la lumière ----------
   Une lampe, un halo, une poussière : ce sont ces trois choses
   qui font qu'une scène plate devient une scène. */
function halo(x, y, rx, ry, c, o){
  var u = 'h' + Math.round(x + y * 7);
  return '<defs><radialGradient id="' + u + '" cx="0.5" cy="0.5">'
    + '<stop offset="0%" stop-color="' + c + '" stop-opacity="' + o + '"/>'
    + '<stop offset="100%" stop-color="' + c + '" stop-opacity="0"/></radialGradient></defs>'
    + '<ellipse cx="' + x + '" cy="' + y + '" rx="' + rx + '" ry="' + ry
    + '" fill="url(#' + u + ')"/>';
}

/* la poussière qui flotte dans un faisceau */
function poussiere(x, y, w, h, n){
  var s = '';
  for (var i = 0; i < (n || 14); i++)
    s += '<circle class="fumee" cx="' + (x + rnd(i * 5) * w).toFixed(0) + '" cy="'
      + (y + rnd(i * 9) * h).toFixed(0) + '" r="' + (1.2 + rnd(i) * 1.6).toFixed(1)
      + '" fill="#ffeec8" opacity="' + (.3 + rnd(i * 3) * .4).toFixed(2)
      + '" style="animation-delay:-' + (i * .7).toFixed(1) + 's"/>';
  return s;
}

/* une masse sombre au tout premier plan : c'est elle qui creuse
   la profondeur, en plaçant le regard derrière quelque chose */
function avantPlan(d){
  return '<path d="' + d + '" fill="#150a12" opacity=".82"/>';
}

/* le fond de nuit, commun : ciel, étoiles, toits */
function nuit(h){
  var s = '<defs>'
    + '<linearGradient id="n-ciel" x1="0" y1="0" x2="0" y2="1">'
    +   '<stop offset="0%" stop-color="#1e1030"/>'
    +   '<stop offset="52%" stop-color="#4a2038"/>'
    +   '<stop offset="100%" stop-color="#8a4030"/></linearGradient></defs>';
  s += '<rect x="0" y="0" width="480" height="' + h + '" fill="url(#n-ciel)"/>';
  for (var e = 0; e < 26; e++)
    s += '<circle cx="' + (rnd(e * 3) * 480).toFixed(0) + '" cy="'
      + (rnd(e * 7) * (h * .34)).toFixed(0) + '" r="' + (0.8 + rnd(e) * 1.2).toFixed(1)
      + '" fill="#fff4d8" opacity="' + (.2 + rnd(e * 5) * .5).toFixed(2) + '"/>';
  return s;
}

function toits(yb){
  var s = '';
  for (var t = 0; t < 40; t++){
    var tx = -10 + t * 13, th = 26 + rnd(t * 3) * 44;
    s += '<rect x="' + tx.toFixed(0) + '" y="' + (yb - th).toFixed(0) + '" width="'
      + (12 + rnd(t) * 5).toFixed(0) + '" height="' + (th + 44).toFixed(0) + '" fill="'
      + ['#3a2030','#472838','#2e1a28'][t % 3] + '" opacity=".9"/>';
    if (rnd(t * 11) > .68)
      s += '<rect x="' + (tx + 4).toFixed(0) + '" y="' + (yb + 14 - th).toFixed(0)
        + '" width="5" height="7" fill="#ffcf78" opacity=".75"/>';
  }
  return s;
}

function pave(yb, h){
  var s = '<rect x="0" y="' + yb + '" width="480" height="' + h + '" fill="#4a3028"/>';
  for (var p = 0; p < 90; p++)
    s += '<ellipse cx="' + (rnd(p * 3) * 480).toFixed(0) + '" cy="'
      + (yb + 6 + rnd(p * 7) * h).toFixed(0) + '" rx="' + (3 + rnd(p) * 7).toFixed(0)
      + '" ry="' + (1.6 + rnd(p * 5) * 2.6).toFixed(0) + '" fill="'
      + ['#54382e','#3e2822','#5e4034'][p % 3] + '" opacity=".7"/>';
  return s;
}

/* ---------- 1. la place, et le chapiteau planté dessus ---------- */
function scPlace(){
  var s = nuit(620) + toits(438);
  var cx = 240, base = 470, haut = 168, larg = 208;
  s += '<defs><radialGradient id="c-halo" cx="0.5" cy="0.5">'
    + '<stop offset="0%" stop-color="#ffd88a" stop-opacity=".5"/>'
    + '<stop offset="100%" stop-color="#ffd88a" stop-opacity="0"/></radialGradient></defs>';
  s += '<ellipse cx="' + cx + '" cy="' + (base - 90) + '" rx="250" ry="180"'
    + ' fill="url(#c-halo)"/>';
  s += '<path d="M' + cx + ' ' + haut + ' v-38" stroke="#6d4028" stroke-width="5"/>';
  s += '<path class="fanion" d="M' + cx + ' ' + (haut - 38) + ' l34 11 l-34 11 z"'
    + ' fill="#d4a03a" stroke="#3e1c2e" stroke-width="2.4"/>';
  /* Les fuseaux de toile. Chacun prend la lumière différemment :
     le soleil de la place vient de la gauche, donc les fuseaux de
     droite s'assombrissent. Et la toile est vieille : elle plisse. */
  for (var q = 0; q < 8; q++){
    var a1 = -Math.PI / 2 + (q - 4) * .2, a2 = -Math.PI / 2 + (q - 3) * .2;
    var x1 = cx + Math.cos(a1) * larg, x2 = cx + Math.cos(a2) * larg;
    var creux = 16 + Math.abs(q - 3.5) * 3;
    /* la courbure varie : la toile ne tombe pas droit */
    var ventre = 120 + Math.sin(q * 1.7) * 14;
    var lum = 1 - Math.abs(q - 2.4) / 9;          /* 1 à gauche, moins à droite */
    var c = q % 2
      ? mel2('#c9302c', '#5c1418', 1 - lum)
      : mel2('#f2e2c4', '#a8906c', 1 - lum);
    var d1 = 'M' + cx + ' ' + haut + ' Q' + ((cx + x1) / 2).toFixed(0) + ' '
      + (haut + ventre).toFixed(0) + ' ' + x1.toFixed(0) + ' ' + base
      + ' q' + ((x2 - x1) / 2).toFixed(0) + ' ' + creux + ' ' + (x2 - x1).toFixed(0) + ' 0'
      + ' Q' + ((cx + x2) / 2).toFixed(0) + ' ' + (haut + ventre).toFixed(0)
      + ' ' + cx + ' ' + haut + ' Z';
    s += '<path d="' + d1 + '" fill="' + c + '"/>';
    /* la couture entre deux fuseaux, et son ombre */
    s += '<path d="M' + cx + ' ' + haut + ' Q' + ((cx + x1) / 2).toFixed(0) + ' '
      + (haut + ventre).toFixed(0) + ' ' + x1.toFixed(0) + ' ' + base
      + '" stroke="#00000030" stroke-width="3" fill="none"/>';
    /* deux plis mous, là où la toile a pris le pli du rangement */
    for (var pl = 0; pl < 2; pl++){
      var t = .42 + pl * .28;
      var mx = cx + (x1 - cx) * t, my = haut + ventre * t * 1.5;
      s += '<path d="M' + mx.toFixed(0) + ' ' + my.toFixed(0)
        + ' q' + ((x2 - x1) * .3).toFixed(0) + ' ' + (14 + pl * 6)
        + ' ' + ((x2 - x1) * .82).toFixed(0) + ' ' + (2 + pl * 3)
        + '" stroke="#00000018" stroke-width="' + (7 - pl * 2)
        + '" fill="none" stroke-linecap="round"/>';
    }
  }
  /* le côté droit reste dans l'ombre du soir */
  s += '<path d="M' + cx + ' ' + haut + ' L' + (cx + larg) + ' ' + base
    + ' L' + (cx + larg * .3) + ' ' + (base + 14) + ' Z" fill="#2a0e18" opacity=".22"/>';
  s += '<ellipse cx="' + cx + '" cy="' + haut + '" rx="16" ry="7" fill="#8a2420"/>';
  var fest = 'M' + (cx - larg) + ' ' + base;
  for (var f = 0; f < 8; f++)
    fest += ' q' + (larg / 8).toFixed(0) + ' 20 ' + (larg * 2 / 8).toFixed(0) + ' 0';
  s += '<path d="' + fest + '" stroke="#d4a03a" stroke-width="6" fill="none"/>';
  for (var b = 0; b < 15; b++){
    var bx = cx - larg + 8 + b * ((larg * 2 - 16) / 14);
    var by = base + 12 + Math.sin(b / 14 * Math.PI * 8) * 6;
    s += '<circle class="ampoule a' + (b % 6) + '" cx="' + bx.toFixed(0) + '" cy="'
      + by.toFixed(0) + '" r="4.6" fill="' + (b === 4 || b === 11 ? '#6d5a3a' : '#ffe08a')
      + '"/>';
    if (b !== 4 && b !== 11)
      s += '<circle class="ampoule a' + (b % 6) + '" cx="' + bx.toFixed(0) + '" cy="'
        + by.toFixed(0) + '" r="11" fill="#ffe08a" opacity=".2"/>';
  }
  s += '<path d="M' + (cx - 46) + ' ' + base + ' v-96 q46 -30 92 0 v96 z" fill="#20101c"/>';
  s += '<path d="M' + (cx - 46) + ' ' + base + ' v-96 q-22 -6 -34 6 l6 90 z" fill="#c9302c"/>';
  s += '<path d="M' + (cx + 46) + ' ' + base + ' v-96 q22 -6 34 6 l-6 90 z" fill="#a82420"/>';
  s += '<path d="M' + (cx - 40) + ' ' + base + ' l14 -70 h52 l14 70 z"'
    + ' fill="#ffcf78" opacity=".2"/>';
  s += '<rect x="' + (cx - 92) + '" y="' + (base - 148) + '" width="184" height="40"'
    + ' rx="8" fill="#3e1c2e" stroke="#d4a03a" stroke-width="3.4"/>';
  s += '<text x="' + cx + '" y="' + (base - 120) + '" text-anchor="middle"'
    + ' font-family="Georgia,serif" font-size="22" fill="#d4a03a"'
    + ' letter-spacing="2">BATTAGLINI</text>';
  s += pave(base, 150);
  s += roulotte(14, base);
  for (var g = 0; g < 6; g++){
    var gx = 120 + g * 20, gy = base - 108 + Math.sin(g / 5 * Math.PI) * 12;
    s += '<path class="fanion f' + (g % 4) + '" d="M' + gx + ' ' + gy.toFixed(0)
      + ' l13 0 l-6.5 15 z" fill="' + ['#d4a03a','#c9302c','#2e5a4a'][g % 3] + '"/>';
  }
  s += chevre(392, base - 6, 1.15, '#d8cfc0');
  s += '<path d="M370 ' + (base - 4) + ' v-26" stroke="#6d4a30" stroke-width="4"/>';

  /* la lumière chaude qui traîne au ras du pavé */
  s += halo(240, base + 30, 300, 60, '#ffcf78', .16);
  /* deux badauds de dos, en silhouette : on est derrière eux */
  s += avantPlan('M-10 620 q30 -120 74 -122 q44 2 74 122 z');
  s += avantPlan('M330 620 q26 -104 64 -106 q38 2 64 106 z');
  s += '<circle cx="64" cy="482" r="30" fill="#150a12" opacity=".82"/>';
  s += '<circle cx="394" cy="500" r="26" fill="#150a12" opacity=".82"/>';
  /* le chapeau de l'un des deux */
  s += '<path d="M28 470 h72 l-10 -22 h-52 z" fill="#150a12" opacity=".82"/>';
  return s;
}

function roulotte(x, base){
  var s = '<g>';
  s += '<rect x="' + x + '" y="' + (base - 74) + '" width="104" height="66" rx="6"'
    + ' fill="#2e5a4a" stroke="#1a2e26" stroke-width="3"/>';
  s += '<path d="M' + (x - 6) + ' ' + (base - 74) + ' h116 l-10 -16 h-96 z" fill="#c9302c"/>';
  for (var w = 0; w < 3; w++)
    s += '<rect x="' + (x + 12 + w * 30) + '" y="' + (base - 62) + '" width="20"'
      + ' height="22" rx="3" fill="#ffcf78" opacity="' + (w === 1 ? '.85' : '.3') + '"/>';
  s += '<circle cx="' + (x + 26) + '" cy="' + (base - 4) + '" r="13" fill="#3e2820"'
    + ' stroke="#6d4a30" stroke-width="3"/>';
  s += '<circle cx="' + (x + 82) + '" cy="' + (base - 4) + '" r="13" fill="#3e2820"'
    + ' stroke="#6d4a30" stroke-width="3"/>';
  s += '<rect x="' + (x + 80) + '" y="' + (base - 104) + '" width="12" height="22"'
    + ' fill="#4a3028"/>';
  for (var m = 0; m < 3; m++)
    s += '<circle class="fumee" cx="' + (x + 86) + '" cy="' + (base - 108) + '" r="'
      + (5 + m * 2) + '" fill="#e8d8c8" opacity=".3" style="animation-delay:-'
      + (m * 3) + 's"/>';
  return s + '</g>';
}

/* ---------- un homme, de face, en pied ----------
   sert pour Don, Pasquale et Ghjuvanni : le costume change,
   la carcasse est la même. */
function homme(x, y, e, q){
  var s = '<g transform="translate(' + x + ',' + y + ') scale(' + e + ')">';

  s += '<ellipse cx="0" cy="4" rx="46" ry="9" fill="#1a0e16" opacity=".34"/>';
  /* les jambes */

    + '" stroke-width="22" stroke-linecap="round"/>';
  s += '<path d="M-26 0 h20 M6 0 h20" stroke="#160e14" stroke-width="9"'
    + ' stroke-linecap="round"/>';
  /* le torse */
  s += '<path d="M-34 -62 q-6 -66 34 -70 q40 4 34 70 z" fill="' + (q.haut || '#2e2028') + '"/>';
  if (q.chemise)
    s += '<path d="M-13 -128 h26 l-6 62 h-14 z" fill="' + q.chemise + '"/>';
  if (q.noeud)
    s += '<path d="M0 -120 l-11 -6 v12 z M0 -120 l11 -6 v12 z" fill="' + q.noeud + '"/>';
  if (q.gilet){
    s += '<path d="M-32 -62 q-4 -58 18 -66 l6 66 z" fill="' + q.gilet + '"/>';
    s += '<path d="M32 -62 q4 -58 -18 -66 l-6 66 z" fill="' + q.gilet + '"/>';
  }
  /* les bras */
  s += '<path d="M-32 -112 q-24 26 -20 62 M32 -112 q24 26 20 62" stroke="'
    + (q.haut || '#2e2028') + '" stroke-width="17" fill="none" stroke-linecap="round"/>';
  s += '<circle cx="-50" cy="-48" r="8" fill="' + peau + '"/>';
  s += '<circle cx="50" cy="-48" r="8" fill="' + peau + '"/>';
  /* la tête */
  s += '<ellipse cx="0" cy="-152" rx="24" ry="27" fill="' + (q.blanc || peau) + '"/>';
  if (q.cheveux)
    s += '<path d="M-24 -158 q2 -26 24 -26 q22 0 24 26 q-8 -14 -24 -14 q-16 0 -24 14 z"'
      + ' fill="' + q.cheveux + '"/>';
  /* les yeux */
  if (q.tristesse){
    s += '<path d="M-16 -152 q6 5 12 0 M4 -152 q6 5 12 0" stroke="' + f
      + '" stroke-width="2.8" fill="none" stroke-linecap="round"/>';
    s += '<path d="M-11 -146 l-2 9" stroke="#3a6a9a" stroke-width="3"'
      + ' stroke-linecap="round"/>';
    s += '<path d="M-18 -168 q7 -9 14 -3 M4 -171 q8 -6 14 3" stroke="' + f
      + '" stroke-width="3" fill="none" stroke-linecap="round"/>';
    s += '<path d="M-11 -134 q11 -6 22 0" stroke="#c9302c" stroke-width="3.4"'
      + ' fill="none" stroke-linecap="round"/>';
  } else {
    s += '<circle cx="-9" cy="-154" r="3" fill="' + f + '"/>';
    s += '<circle cx="9" cy="-154" r="3" fill="' + f + '"/>';
    s += '<path d="M-15 -164 q6 -4 12 -1 M3 -165 q6 -3 12 1" stroke="'
      + (q.cheveux || f) + '" stroke-width="3" fill="none" stroke-linecap="round"/>';
  }
  if (q.moustache)
    s += '<path d="M-13 -140 q13 -6 26 0 q-7 6 -13 6 q-6 0 -13 -6 z" fill="' + f + '"/>';
  if (q.nez)
    s += '<circle cx="0" cy="-144" r="7.4" fill="#e0352c" stroke="#8a2420"'
      + ' stroke-width="2"/>';
  if (q.houppe)
    s += '<path d="M0 -180 q-6 -11 3 -12 q9 1 3 12 z" fill="#c9302c"/>';
  if (q.carnet){
    s += '<rect x="46" y="-52" width="18" height="24" rx="2" fill="#e8dcc8"'
      + ' stroke="#3a2a22" stroke-width="2"/>';
    s += '<path d="M50 -46 h10 M50 -41 h10 M50 -36 h6" stroke="#8a7a68"'
      + ' stroke-width="1.4"/>';
  }
  return s + '</g>';
}

/* ---------- Don Battaglini, en pied ----------
   Un homme large, court sur pattes, qui parle avec les mains.
   Le ventre tend le gilet ; les bras ne sont jamais au repos. */
function don(x, y, e){
  var s = '<g transform="translate(' + x + ',' + y + ') scale(' + e + ')">';

    + ' stroke-linecap="round"/>';

    + ' q10 26 -2 70 z" fill="#241820"/>';

  /* les revers du costume */

  /* la chaîne de montre, sur le gilet */
  s += '<path d="M-18 -96 q14 12 28 2" stroke="#d4a03a" stroke-width="2.4" fill="none"/>';
  /* les bras : ouverts, en train d'expliquer */
  s += '<path d="M-36 -122 q-40 16 -48 52" stroke="#241820" stroke-width="20"'
    + ' fill="none" stroke-linecap="round"/>';
  s += '<path d="M36 -122 q42 12 44 54" stroke="#241820" stroke-width="20"'

  s += '<ellipse cx="82" cy="-64" rx="11" ry="9" fill="' + peau + '"'

  /* le cou épais, presque absent */
  s += '<path d="M-11 -140 h22 v12 h-22 z" fill="#b07c4e"/>';
  /* la tête, large */
  s += '<ellipse cx="0" cy="-160" rx="27" ry="28" fill="' + peau + '"/>';

  s += '<path d="M-27 -158 q-3 20 10 26 M27 -158 q3 20 -10 26" stroke="#b07c4e"'
    + ' stroke-width="5" fill="none" opacity=".5"/>';
  /* les cheveux gominés, raie sur le côté */
  s += '<path d="M-27 -166 q2 -28 27 -28 q25 0 27 28 q-10 -16 -27 -16 q-17 0 -27 16 z"'
    + ' fill="#2e2028"/>';
  s += '<path d="M-10 -190 q18 4 26 18" stroke="#4a3a40" stroke-width="3" fill="none"/>';
  /* les sourcils, hauts, expressifs */
  s += '<path d="M-18 -174 q8 -6 15 -2 M3 -176 q8 -4 15 2" stroke="#2e2028"'
    + ' stroke-width="3.6" fill="none" stroke-linecap="round"/>';
  s += '<circle cx="-10" cy="-162" r="3.2" fill="' + f + '"/>';

  /* la moustache épaisse */
  s += '<path d="M-16 -144 q16 -7 32 0 q-8 8 -16 8 q-8 0 -16 -8 z" fill="#2e2028"/>';
  /* et le nez rouge, qu'il n'enlève jamais */
  s += '<circle cx="0" cy="-150" r="8.4" fill="#e0352c" stroke="#8a2420"'
    + ' stroke-width="2.2"/>';
  s += '<circle cx="-3" cy="-153" r="2.6" fill="#ff8a7a" opacity=".8"/>';

/* ---------- 2. Don sort de la roulotte ---------- */
function scRoulotte(){
  var s = nuit(620) + toits(430) + pave(452, 168);
  /* le flanc de la roulotte, gros plan */
  s += '<rect x="-20" y="150" width="330" height="304" rx="10" fill="#2e5a4a"'
    + ' stroke="#1a2e26" stroke-width="5"/>';
  s += '<path d="M-30 152 h350 l-16 -26 h-318 z" fill="#c9302c"/>';

  s += '<text x="140" y="216" text-anchor="middle" font-family="Georgia,serif"'
    + ' font-size="30" fill="#d4a03a" letter-spacing="3">CIRCO</text>';
  s += '<text x="140" y="250" text-anchor="middle" font-family="Georgia,serif"'
    + ' font-size="19" fill="#e8c88a" opacity=".8" letter-spacing="2">BATTAGLINI</text>';
  /* la porte ouverte, la lumière dedans */
  s += '<rect x="176" y="256" width="108" height="198" fill="#20101c"/>';
  s += '<rect x="176" y="256" width="108" height="198" fill="#ffcf78" opacity=".18"/>';
  s += '<path d="M284 256 h34 v198 h-34 z" fill="#24483c"/>';
  /* les marches */
  s += '<path d="M170 454 h124 l14 22 h-152 z" fill="#3e2820"/>';
  /* Don, sur les marches, à contre-jour */
  s += don(230, 452, 1.06);
  /* deux ampoules au-dessus de la porte */
  s += '<circle class="ampoule" cx="200" cy="248" r="5" fill="#ffe08a"/>';
  s += '<circle class="ampoule a2" cx="262" cy="248" r="5" fill="#ffe08a"/>';
  /* la chèvre, au coin, qui observe */
  s += chevre(408, 470, 1.05, '#d8cfc0');

  s += '<path d="M180 260 L280 260 L340 620 L120 620 Z" fill="#ffcf78" opacity=".1"/>';
  s += halo(230, 340, 150, 190, '#ffcf78', .2);
  s += poussiere(190, 280, 100, 160, 10);

  s += '<path d="M4 484 h44 v10 h-44 z" fill="#d4a03a" opacity=".4"/>';
  return s;
}

/* ---------- 3. dedans : le chapiteau vide et la Mamma ---------- */
function scDedans(){
  var s = '<rect x="0" y="0" width="480" height="620" fill="#3a1420"/>';
  /* la toile vue de l'intérieur : les fuseaux convergent au mât */
  for (var q = 0; q < 10; q++){
    var x1 = -60 + q * 66, x2 = -60 + (q + 1) * 66;
    s += '<path d="M240 -40 L' + x1 + ' 300 L' + x2 + ' 300 Z" fill="'
      + (q % 2 ? '#8a2420' : '#c9302c') + '" opacity=".9"/>';
  }
  s += '<ellipse cx="240" cy="-10" rx="30" ry="14" fill="#20101c"/>';
  /* le mât central */
  s += '<rect x="232" y="0" width="16" height="330" fill="#5c4229"/>';
  s += '<rect x="232" y="0" width="5" height="330" fill="#7d5c3a"/>';
  /* les gradins, dans l'ombre */
  for (var r = 0; r < 5; r++)
    s += '<path d="M0 ' + (300 + r * 22) + ' h480 v18 h-480 z" fill="'
      + ['#2e1620','#361a26'][r % 2] + '"/>';
  /* la piste, en sciure, un rond de lumière */
  s += '<defs><radialGradient id="d-pist" cx="0.5" cy="0.5">'
    + '<stop offset="0%" stop-color="#e8c890"/>'
    + '<stop offset="100%" stop-color="#a8804c"/></radialGradient></defs>';
  s += '<ellipse cx="240" cy="500" rx="270" ry="106" fill="url(#d-pist)"/>';
  s += '<ellipse cx="240" cy="500" rx="270" ry="106" fill="none" stroke="#c9302c"'
    + ' stroke-width="9"/>';
  for (var g = 0; g < 60; g++)
    s += '<circle cx="' + (rnd(g * 3) * 480).toFixed(0) + '" cy="'
      + (410 + rnd(g * 7) * 180).toFixed(0) + '" r="' + (1 + rnd(g) * 2).toFixed(1)
      + '" fill="#c9a878" opacity=".5"/>';
  /* le fauteuil de la Mamma, au premier rang, seul */
  s += '<g transform="translate(240,470)">';
  s += '<ellipse cx="0" cy="52" rx="60" ry="12" fill="#20101c" opacity=".4"/>';
  s += '<path d="M-42 48 v-72 q0 -20 20 -20 h44 q20 0 20 20 v72 z" fill="#6d2028"/>';
  s += '<path d="M-42 -14 h84 v14 h-84 z" fill="#8a2c34"/>';
  s += '<path d="M-46 48 v-56 q-10 4 -10 22 v34 z M46 48 v-56 q10 4 10 22 v34 z"'
    + ' fill="#5c1a22"/>';
  /* la vieille, de dos. Minuscule dans un fauteuil trop grand :
     c'est tout ce qu'il y a à comprendre d'elle. */
  s += '<g class="respire">';
  s += '<ellipse cx="0" cy="-16" rx="26" ry="30" fill="#1a1218"/>';
  /* les plis du châle sur ses épaules */
  s += '<path d="M-24 -22 q24 -14 48 0" stroke="#2a2028" stroke-width="3"'
    + ' fill="none" opacity=".7"/>';
  s += '<path d="M-20 -8 q20 -12 40 0" stroke="#2a2028" stroke-width="2.6"'
    + ' fill="none" opacity=".6"/>';
  /* la frange du châle */
  for (var fr = 0; fr < 9; fr++)
    s += '<path d="M' + (-22 + fr * 5.5) + ' 12 v7" stroke="#2a2028"'
      + ' stroke-width="1.8" opacity=".7"/>';
  s += '<ellipse cx="0" cy="-48" rx="17" ry="19" fill="#1a1218"/>';
  s += '<path d="M-15 -52 q15 -12 30 0 q-4 -20 -15 -20 q-11 0 -15 20 z" fill="#141018"/>';
  /* une mèche blanche qui dépasse du fichu */
  s += '<path d="M-13 -44 q-5 6 -3 13" stroke="#c9c0b4" stroke-width="2.4"'
    + ' fill="none" opacity=".7"/>';
  s += '</g>';
  /* sa canne, appuyée au fauteuil */
  s += '<path d="M50 44 q6 -50 2 -78" stroke="#5c4229" stroke-width="4" fill="none"/>';
  s += '<path d="M52 -34 q10 -4 10 6" stroke="#5c4229" stroke-width="4" fill="none"/>';
  s += '</g>';
  /* le faisceau du projecteur, franc, et la poussière dedans */
  s += '<path d="M228 8 L108 500 L372 500 Z" fill="#ffe0a0" opacity=".1"/>';
  s += '<path d="M234 8 L182 500 L298 500 Z" fill="#fff0c8" opacity=".08"/>';
  s += halo(240, 500, 230, 90, '#ffe8b8', .22);
  s += poussiere(150, 120, 180, 360, 20);
  /* le dossier du gradin d'où l'on regarde */
  s += avantPlan('M-10 620 v-70 h500 v70 z');
  s += '<path d="M-10 552 h500 v10 h-500 z" fill="#4a2430" opacity=".8"/>';
  return s;
}

/* ---------- 4. le quai, de nuit : on embarque la chèvre ---------- */
function scQuai(){
  var s = nuit(620);
  /* la mer */
  s += '<rect x="0" y="330" width="480" height="140" fill="#1a3a4a"/>';
  for (var k = 0; k < 30; k++)
    s += '<path d="M' + (rnd(k * 3) * 460).toFixed(0) + ' '
      + (338 + rnd(k * 5) * 124).toFixed(0) + ' h' + (12 + rnd(k * 7) * 40).toFixed(0)
      + '" stroke="#8ab0c0" stroke-width="1.6" opacity="'
      + (.1 + rnd(k) * .2).toFixed(2) + '"/>';
  /* la lune et son chemin sur l'eau */
  s += '<circle cx="392" cy="96" r="30" fill="#f4ecd0" opacity=".9"/>';
  s += '<circle cx="380" cy="88" r="26" fill="#4a2038" opacity=".5"/>';
  s += '<path d="M374 330 L410 330 L470 470 L320 470 Z" fill="#f4ecd0" opacity=".12"/>';
  /* le quai, au premier plan */
  s += '<rect x="0" y="452" width="480" height="168" fill="#3e3028"/>';
  for (var b = 0; b < 16; b++)
    s += '<path d="M0 ' + (460 + b * 10) + ' h480" stroke="#2e231e" stroke-width="2"'
      + ' opacity=".5"/>';
  /* la bitte d'amarrage et la corde */
  s += '<path d="M56 452 v-34 q0 -10 12 -10 q12 0 12 10 v34 z" fill="#2e2620"/>';
  s += '<ellipse cx="68" cy="410" rx="16" ry="6" fill="#4a3c30"/>';
  s += '<path d="M84 420 q60 26 128 10" stroke="#8a7050" stroke-width="4" fill="none"/>';
  /* la barque, amarrée, et la planche */
  s += '<path d="M200 452 q80 -14 190 0 l-16 40 q-80 12 -158 0 z" fill="#6d4a30"'
    + ' stroke="#3e2820" stroke-width="4"/>';
  s += '<path d="M206 452 q78 -12 178 0" stroke="#a8804c" stroke-width="5" fill="none"/>';
  s += '<path d="M300 448 v-90" stroke="#5c4229" stroke-width="6"/>';
  s += '<path d="M300 358 q46 20 40 60 l-40 -8 z" fill="#e8dcc0" opacity=".9"/>';
  /* la planche d'embarquement */
  s += '<path d="M140 470 L232 440 l8 14 L148 484 z" fill="#8a6a48"'
    + ' stroke="#3e2820" stroke-width="3"/>';
  /* Rosine sur la planche, tranquille */
  s += chevre(196, 462, 1.16, '#d8cfc0', 1, 0, true);
  /* Pasquale, au bord, qui note */
  s += homme(78, 560, .82, { haut:'#4a5a44', bas:'#3a4438', cheveux:'#3e3428',
    carnet:true });
  /* une lanterne posée sur le quai */
  s += '<g transform="translate(420,540)">';
  s += '<path d="M-12 0 h24 l-4 -26 h-16 z" fill="#3e2820"/>';
  s += '<rect class="vacille" x="-9" y="-24" width="18" height="20" fill="#ffcf78"'
    + ' opacity=".9"/>';
  s += '<path d="M-13 -26 h26 l-13 -10 z" fill="#2e2018"/>';
  s += '<circle cx="0" cy="-14" r="34" fill="#ffcf78" opacity=".14"/>';
  s += '</g>';
  /* la halo de la lanterne, couché sur les planches */
  s += halo(420, 540, 170, 90, '#ffcf78', .18);
  /* une brume basse sur l'eau, qui mange le pied de la barque */
  s += '<ellipse cx="240" cy="452" rx="330" ry="26" fill="#8ab0c0" opacity=".16"/>';
  s += '<ellipse cx="150" cy="446" rx="180" ry="16" fill="#8ab0c0" opacity=".12"/>';
  /* le reflet de la barque, brouillé */
  s += '<path d="M212 470 q78 12 166 0 l-10 22 q-72 10 -146 0 z" fill="#6d4a30"'
    + ' opacity=".18"/>';
  /* un cordage lové, au tout premier plan */
  s += avantPlan('M-10 620 v-84 q60 -26 128 -6 q-46 22 -50 90 z');
  for (var c = 0; c < 4; c++)
    s += '<path d="M' + (-4 + c * 6) + ' ' + (560 + c * 12) + ' q54 -20 106 -4"'
      + ' stroke="#241620" stroke-width="7" fill="none" opacity=".9"/>';
  return s;
}

/* ---------- 5. le retour : Don écoute le verdict ---------- */
function scRetour(){
  var s = scDedans();
  /* Don debout sur la piste, dos au fauteuil */
  s += don(150, 520, 1.02);
  /* Rosine à côté de lui, rendue */
  s += chevre(340, 528, 1.1, '#d8cfc0', 1, 0, true);
  return s;
}

/* ---------- 6. la piste, les cinq bêtes alignées ---------- */
function scConcours(){
  var s = scDedans();
  /* les cinq, en rang sur la piste, vues de loin */
  for (var i = 0; i < 5; i++)
    s += chevre(66 + i * 88, 512 + (i % 2 ? 6 : 0), .62,
      ['#d8cfc0','#a89078','#6d5c4e','#efe6da','#c9b8a0'][i], i % 3, (i + 1) % 3, i % 2 === 0);
  /* Pasquale les surveille, à gauche */
  s += homme(30, 560, .7, { haut:'#4a5a44', bas:'#3a4438', cheveux:'#3e3428',
    carnet:true });

  s += '<rect x="300" y="418" width="86" height="60" rx="4" fill="#8a6a48"'
    + ' stroke="#4a3628" stroke-width="3"/>';
  s += '<path d="M300 442 h86" stroke="#4a3628" stroke-width="2.4"/>';
  s += '<rect x="318" y="368" width="60" height="50" rx="4" fill="#9a7a54"'
    + ' stroke="#4a3628" stroke-width="3"/>';
  /* Ghjuvanni assis sur une caisse, effondré */
  s += '<g transform="translate(206,500)">';
  s += '<ellipse cx="10" cy="8" rx="52" ry="10" fill="#1a0e16" opacity=".34"/>';
  s += '<rect x="-56" y="-56" width="104" height="62" rx="5" fill="#8a6a48"'
    + ' stroke="#4a3628" stroke-width="3"/>';
  /* les jambes pendantes, chaussures immenses */
  s += '<path d="M-16 -56 v40 M16 -56 v40" stroke="#f2e8dc" stroke-width="20"'

  s += '<ellipse cx="-24" cy="-12" rx="20" ry="9" fill="#c9302c"/>';
  s += '<ellipse cx="26" cy="-12" rx="20" ry="9" fill="#2e5a4a"/>';

  s += '<circle cx="-44" cy="-54" r="8" fill="#f6f0e6"/>';
  s += '<circle cx="44" cy="-54" r="8" fill="#f6f0e6"/>';
  /* la tête, penchée */
  s += '<g transform="rotate(-8)">';
  s += '<ellipse cx="0" cy="-140" rx="25" ry="28" fill="#f6f0e6"/>';
  s += '<path d="M-17 -142 q7 6 14 0 M3 -142 q7 6 14 0" stroke="#2e2028"'
    + ' stroke-width="3" fill="none" stroke-linecap="round"/>';
  s += '<path d="M-12 -135 l-2 10" stroke="#3a6a9a" stroke-width="3.4"'
    + ' stroke-linecap="round"/>';
  s += '<path d="M-19 -158 q8 -10 15 -3 M4 -161 q9 -7 15 3" stroke="#2e2028"'
    + ' stroke-width="3.2" fill="none" stroke-linecap="round"/>';
  s += '<path d="M-12 -122 q12 -7 24 0" stroke="#c9302c" stroke-width="3.6"'
    + ' fill="none" stroke-linecap="round"/>';
  s += '<circle cx="0" cy="-130" r="6" fill="#e0352c"/>';
  s += '<path d="M0 -168 q-6 -11 3 -12 q9 1 3 12 z" fill="#c9302c"/>';
  s += '</g></g>';
  /* une caisse libre à côté : la place où tu peux t'asseoir */
  s += '<rect x="356" y="486" width="76" height="48" rx="4" fill="#7d5e42"'
    + ' stroke="#4a3628" stroke-width="3"/>';
  /* la lumière du chapiteau filtre par une déchirure de la toile */

/* ---------- 8. le final : tout le monde sous le chapiteau ---------- */
function scFinal(){
  var s = scDedans();
  /* les gradins se remplissent : des silhouettes serrées */
  for (var r = 0; r < 4; r++)
    for (var i = 0; i < 14; i++){

      s += '<circle cx="' + x + '" cy="' + y + '" r="9" fill="'
        + ['#2a1620','#33202c','#241a24'][i % 3] + '"/>';

        + ['#3a2430','#442c3a'][i % 2] + '"/>';
    }
  /* le faisceau tombe au centre : c'est là que tu te tiens */
  s += '<path d="M228 20 L146 560 L334 560 Z" fill="#ffe0a0" opacity=".16"/>';
  s += '<ellipse cx="240" cy="546" rx="92" ry="30" fill="#ffe8b8" opacity=".22"/>';
  /* toi, au centre, de dos */
  s += '<g transform="translate(240,556)">';
  s += '<ellipse cx="0" cy="6" rx="34" ry="8" fill="#1a0e16" opacity=".4"/>';
  s += '<path d="M-14 -46 v44 M14 -46 v44" stroke="#3a2a24" stroke-width="17"'
    + ' stroke-linecap="round"/>';
  s += '<path d="M-26 -48 q-5 -50 26 -54 q31 4 26 54 z" fill="#5c6a70"/>';
  s += '<path d="M-24 -86 q-19 20 -15 48 M24 -86 q19 20 15 48" stroke="#5c6a70"'
    + ' stroke-width="14" fill="none" stroke-linecap="round"/>';
  s += '<ellipse cx="0" cy="-116" rx="19" ry="21" fill="#c9925e"/>';
  s += '<path d="M-19 -122 q2 -20 19 -20 q17 0 19 20 q-6 -10 -19 -10 q-13 0 -19 10 z"'
    + ' fill="#3a2a22"/>';
  s += '</g>';
  /* Don, un peu en retrait */
  s += don(102, 548, .84);
  /* Ghjuvanni de l'autre côté */
  s += homme(384, 548, .84, { haut:'#f2e8dc', bas:'#f2e8dc', blanc:'#f6f0e6',
    tristesse:true, houppe:true });
  /* Rosine, évidemment */
  s += chevre(320, 566, .8, '#d8cfc0', 1, 0, true);
  /* le halo au sol, et la poussière dans le cône */
  s += halo(240, 552, 160, 60, '#ffe8b8', .3);
  s += poussiere(160, 60, 160, 420, 22);
  /* les têtes du premier rang, en contre-jour : on est dans le public */
  var T = [[34,600,40],[128,614,34],[352,614,34],[446,600,40]];
  T.forEach(function(t){
    s += '<circle cx="' + t[0] + '" cy="' + t[1] + '" r="' + t[2]

      + (t[2] + 20) + ' ' + (t[2] * 2 + 16) + ' 0 z" fill="#150a12"/>';

/* ============================================================
   POSER UN DÉCOR
   On enchaîne en fondu : la scène d'avant s'efface pendant que
   la nouvelle arrive. On ne saute jamais d'une image à l'autre.
   ============================================================ */
var SCENES = {
  place: scPlace, roulotte: scRoulotte, dedans: scDedans, quai: scQuai,
  retour: scRetour, concours: scConcours, derriere: scDerriere, final: scFinal
};
/* chaque lieu a sa température : le quai est froid, le chapiteau
   est chaud. C'est ce qui fait qu'on sent où l'on est avant
   même d'avoir regardé. */
var TEINTES = {
  place:    '#2a1420', roulotte: '#2e1620', dedans:  '#3a1420',
  quai:     '#16283a', retour:   '#3a1420', concours:'#3a1420',
  derriere: '#241428', final:    '#3e1620'
};
var SC = null;

function decor(quoi){
  var k = quoi || SC || 'place';
  var change = (k !== SC);
  SC = k;
  var el = document.getElementById('sc');
  var f = SCENES[k] || scPlace;
  /* le fond de la page suit le lieu, et la barre du téléphone aussi */
  var t = TEINTES[k] || '#2a1420';
  document.body.style.transition = 'background .7s';
  document.body.style.background = t;
  var tc = document.getElementById('tc');
  if (tc) tc.setAttribute('content', t);
  if (change && el.innerHTML){
    el.style.opacity = '0';
    setTimeout(function(){
      el.innerHTML = '<svg viewBox="0 0 480 620" preserveAspectRatio="xMidYMax slice"'
        + ' xmlns="http://www.w3.org/2000/svg">' + f() + '</svg>';
      el.style.opacity = '1';
    }, 320);
    return;
  }
  el.innerHTML = '<svg viewBox="0 0 480 620" preserveAspectRatio="xMidYMax slice"'
    + ' xmlns="http://www.w3.org/2000/svg">' + f() + '</svg>';
  requestAnimationFrame(function(){ el.classList.add('pret'); });
}

var C = null, AL = null, VISE = null;

function eur(n){ return Math.round(Number(n) || 0).toLocaleString('fr-FR'); }

function dits(L){
  return '<div class="dit">' + L.map(function(p, i){
    var cl = p[0] === '«' ? ' class="parle"' : (p[0] === '~' ? ' class="mamma"' : '');
    return '<p' + cl + ' style="animation-delay:' + (.1 + i * .55).toFixed(2) + 's">'
      + (p[0] === '~' ? p.slice(1) : p) + '</p>';
  }).join('') + '</div>';
}

/* ---------- l'entrée : on te présente la maison ---------- */
function scenePremiere(){
  return dits([

      + "roulotte, un nez rouge sur le visage.",
    "« Nous avons un problème avec une chèvre. »"

function sceneProbleme(){
  return dits([
    "« Rosine a mangé un acte de propriété. Ou un contrat. Les avis divergent. »",

      + "d'ici, toute la ville le saura demain. »",
    "Il se retourne. Au premier rang, sa mère hoche la tête, une fois.",
    "« Voilà. C'est décidé. »"
  ]);
}

/* ---------- les blocs d'action, selon où on en est ---------- */
function blocEmbarquer(){
  if (C.chevre)
    return '<h2>Rosine</h2><div class="fait">Elle est dans ta cale. '
      + 'Le vétérinaire est à Marseille.</div>';
  if (C.vet) return '';
  var dur = C.cale_libre < 1;
  return '<h2>Ce qu\'on te demande</h2><div class="choix">'
    + '<button class="vif" id="c-embarquer"' + (dur ? ' disabled' : '') + '>'
    + '<b>Embarquer Rosine</b><span>'
    + (dur ? 'Ta cale est pleine' : 'Une place de cale, discrètement')
    + '</span></button></div>';
}

function blocRendre(){
  if (!C.vet || !C.chevre) return '';
  return '<h2>De retour</h2><div class="choix">'
    + '<button class="vif" id="c-rendre"><b>Rendre la chèvre et le verdict</b>'
    + '</button></div>';
}

function blocConcours(){
  if (!C.vet || C.chevre || C.concours_gagne) return '';
  if (!AL) return '';
  var g = AL.chevres || [], hors = AL.ecartees || [];
  var fini = AL.reste < 1;

  var h = '<h2 class="dx">Laquelle est Rosine ?'
    + (fini ? '<em style="color:rgba(246,230,216,.4)">demain</em>'
            : '<em>' + AL.reste + ' essai' + (AL.reste > 1 ? 's' : '') + '</em>')
    + '</h2>';

  h += '<div class="rang">' + g.map(function(z){
      var barree = hors.indexOf(z.n) >= 0;
      return '<div class="ch' + (AL.mamma === z.n ? ' regardee' : '')
        + (barree || fini ? ' non' : '') + '"'
        + (barree || fini ? '' : ' data-n="' + z.n + '"') + '>'
        + '<svg viewBox="-70 -100 140 110" xmlns="http://www.w3.org/2000/svg">'
        + chevre(0, 0, .82, ['#d8cfc0','#a89078','#6d5c4e','#efe6da'][z.robe],
            z.cornes, z.oeil, z.clochette)
        + (barree
            ? '<path d="M-52 -78 L44 -6 M44 -78 L-52 -6" stroke="#c9302c"'
              + ' stroke-width="7" stroke-linecap="round" opacity=".8"/>'
            : '')
        + '</svg><b>' + z.n + '</b></div>';
    }).join('') + '</div>';

  /* trois essais ratés ne doivent pas fermer la porte sans un mot */
  if (fini){
    h += AL.rachat
      ? '<p class="mot">Elles sont rentrées à l\'étable. Reviens demain.</p>'
      : '<div class="choix" style="margin-top:14px">'
        + '<button class="vif" id="c-registre"'
        + (AL.euros < AL.prix_registre ? ' disabled' : '') + '>'
        + '<b>Consulter le registre de Pasquale</b>'
        + '<span>' + (AL.euros < AL.prix_registre
            ? 'Il en veut ' + AL.prix_registre + ' €'
            : AL.prix_registre + ' € — trois mois de notes sur ces bêtes') + '</span>'
        + '</button></div>';
  } else if (AL.mamma){
    h += '<p class="mot">La Mamma en regarde une.</p>';
  }
  return h;
}

/* aller derrière le chapiteau est un déplacement : le décor change */
var DERRIERE = false;

function blocRire(){
  if (!C.vu_don || C.rire) return C.rire
    ? '<h2>Ghjuvanni</h2><div class="fait">Il a ri. Une fois.</div>'

    + '<div class="choix">'
    + '<button data-r="blague"><b>Lui raconter une blague</b></button>'
    + '<button data-r="tomber"><b>Te prendre les pieds dans une corde</b></button>'

    + '<button data-r="rien"><b>T\'asseoir sans rien dire</b></button>'
    + '</div>';
}

function blocFinal(){
  if (!C.concours_gagne || C.fin) return '';
  return dits(['« Alors ? Dis-nous. »'])
    + '<div class="choix" style="margin-top:18px">'
    + '<button data-f="verite"><b>Dire le verdict</b></button>'
    + '<button data-f="silence"><b>Ne rien dire</b></button>'
    + '<button data-f="chevre"><b>Demander la chèvre</b></button>'
    + '</div>';
}

/* ---------- ton numéro, et l'affiche de la semaine ---------- */
var NUM = null;

function blocNumero(){
  if (!C.fin || !NUM || !NUM.ok) return '';
  var A = NUM.affiche || [];
  var h = '<h2 class="dx">L\'affiche'
    + '<em>' + NUM.reste_j + ' jour' + (NUM.reste_j > 1 ? 's' : '') + '</em></h2>';

  h += '<div class="choix">';
  h += NUM.joue
    ? '<div class="fait">Tu es passé cette semaine — <b>' + NUM.mon_score
      + ' points</b>, ' + NUM.mes_attrapes + ' massues attrapées.</div>'

      + '<span>Un passage par semaine</span></button>';
  h += '<button id="c-repet"><b>Répéter</b>'

  if (A.length)
    h += '<div class="aff">' + A.map(function(z, i){
        return '<div class="af' + (z.moi ? ' moi' : '') + '">'
          + '<i>' + (i + 1) + '</i>'
          + '<span class="pf">' + BD.avatarSVG({ avatar: z.avatar }) + '</span>'
          + '<b>' + z.qui + '</b><span class="sc">' + z.score + '</span></div>';
      }).join('') + '</div>';
  else
    h += '<p class="mot">Personne n\'est encore monté cette semaine.</p>';

    h += '<p class="mot">Record de tous les temps : <b>' + NUM.record.score
