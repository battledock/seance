/* ---------- la boutique de la maison Battaglini ---------- */
var BOU = null;

function blocBoutique(){
  if (!C.fin || !BOU || !BOU.ok) return '';
  var A = BOU.articles || [];
  var h = '<h2 class="dx">La roulotte<em>' + BOU.jetons + ' jetons</em></h2>';
  h += '<div class="choix">' + A.map(function(a){
      var dur = a.pris || BOU.jetons < a.prix;
      return '<button data-b="' + a.k + '"' + (dur ? ' disabled' : '')
        + (a.k === 'massue' ? ' class="vif"' : '') + '>'
        + '<b>' + a.nom + '<span class="px">' + (a.pris ? 'à toi' : a.prix + ' jetons')
        + '</span></b>'
        + '<span>' + a.note + '</span></button>';
    }).join('') + '</div>';
  if (!BOU.jetons)
    h += '<p class="mot">Les jetons ne se gagnent qu\'en piste.</p>';
  return h;
}

function blocTroupe(){
  /* elle ne doit pas manger l'écran : on la range sous un titre
     qu'on ouvre si on veut. */
  return '<details class="troupe"><summary>La troupe</summary><div class="gens">'
    + (C.gens || []).map(function(g){
        return '<div class="p"><span class="f">' + portrait(g.k) + '</span>'
          + '<span class="t"><b>' + g.nom + '</b><i>' + g.quoi + '</i></span></div>';
      }).join('') + '</div></details>';
}

/* le décor suit l'histoire, sans qu'on ait à y penser */
function ouEnEstOn(){
  if (!C.vu_don) return 'place';
  if (C.fin) return 'final';
  if (C.concours_gagne) return 'final';
  if (C.vet && !C.chevre) return 'concours';
  if (C.vet && C.chevre) return 'retour';
  if (C.chevre) return 'quai';
  return 'roulotte';
}

function poser(){
  var s = '';
  if (!C.vu_don){
    decor('place');
    s = scenePremiere();
    document.getElementById('w').innerHTML = s;
    document.getElementById('c-ecouter').onclick = entrer;
    return;
  }
  decor(ouEnEstOn());
  if (C.etape === 1 && !C.chevre && !C.vet) s += sceneProbleme();
  s += blocEmbarquer() + blocRendre() + blocConcours() + blocFinal()
     + blocRire() + blocNumero() + blocBoutique();
  if (C.fin)
    s += '<h2>Ce qui s\'est passé</h2><div class="fait">'
      + { verite:'Tu as dit la vérité. La Mamma s\'est levée.',
          silence:'Tu n\'as rien dit. La maison Battaglini te doit quelque chose.',
          chevre:'Tu as demandé la chèvre. Tu l\'as eue.' }[C.fin] + '</div>';
  s += blocTroupe();
  document.getElementById('w').innerHTML = s;
  brancher();
}

function brancher(){
  var g = document.getElementById('c-derriere');
  if (g) g.onclick = function(){
    DERRIERE = true; decor('derriere');
    document.getElementById('w').innerHTML = blocRire() + blocTroupe();
    brancher();
  };
  var e = document.getElementById('c-embarquer');
  if (e) e.onclick = embarquer;
  var r = document.getElementById('c-rendre');
  if (r) r.onclick = rendre;
  document.querySelectorAll('[data-n]').forEach(function(b){
    b.onclick = function(){ designer(+b.dataset.n); };
  });
  var reg = document.getElementById('c-registre');
  if (reg) reg.onclick = registre;
  var nm = document.getElementById('c-numero');
  if (nm) nm.onclick = function(){ ouvrirPiste(false); };
  var rp = document.getElementById('c-repet');
  if (rp) rp.onclick = function(){ ouvrirPiste(true); };
  document.querySelectorAll('[data-b]').forEach(function(b){
    b.onclick = function(){ acheter(b.dataset.b, b); };
  });
  document.querySelectorAll('[data-r]').forEach(function(b){
    b.onclick = function(){ faireRire(b.dataset.r); };
  });
  document.querySelectorAll('[data-f]').forEach(function(b){
    b.onclick = function(){ final(b.dataset.f); };
  });
}

/* ============================================================
   LE NUMÉRO — LE JONGLAGE
   Des massues montent, décrivent leur arc, redescendent. Il faut
   toucher l'écran quand l'une passe dans le cercle de la main.
   Plus tu en attrapes, plus elles arrivent vite.
   ============================================================ */
var JEU = null, MEILLEUR = 0, REPETITION = false;

function jeuNeuf(){
  return { t:0, massues:[], suivante:900, attrapes:0, suite:0, plusLong:0,
    ratees:0, parfaites:0, juge:null, jugeT:-9999, secousse:0,
    fini:false, debut:performance.now(), duree:62000, eclat:0 };
}

function lancerMassue(J){
  var g = Math.random() < .5 ? -1 : 1;
  J.massues.push({
    x0: 50 + g * (14 + Math.random() * 16),
    x1: 50 - g * (14 + Math.random() * 16),
    h: .52 + Math.random() * .3,
    /* devant le public, ça va plus vite : on ne répète plus */
    v: (REPETITION ? 2600 : 2200) - Math.min(1200, J.attrapes * 46),
    ne: J.t, prise:false, ratee:false,
    c: ['#d4a03a','#c9302c','#e8dcc0','#6ab0a0'][Math.floor(Math.random() * 4)]
  });
}

function ouEnEst(m, t){ return (t - m.ne) / m.v; }

/* ---------- le chapiteau vide, en plein jour ----------
   La répétition se fait la porte ouverte : lumière plate, gradins
   nus, la piste pas balayée. Rien pour t'aider, rien pour te porter. */
function fondRepetition(w, h, J){
  var s = '<defs><linearGradient id="r-toile" x1="0" y1="0" x2="0" y2="1">'
    + '<stop offset="0%" stop-color="#4a3a34"/>'
    + '<stop offset="100%" stop-color="#6d5648"/></linearGradient>'
    + '<radialGradient id="r-sol" cx="0.5" cy="1">'
    + '<stop offset="0%" stop-color="#c9ac80"/>'
    + '<stop offset="100%" stop-color="#8a6c48"/></radialGradient></defs>';
  s += '<rect x="0" y="0" width="' + w + '" height="' + h + '" fill="url(#r-toile)"/>';
  /* le jour qui entre par l'ouverture, à gauche */
  s += '<path d="M0 0 L' + (w*.34).toFixed(0) + ' 0 L' + (w*.62).toFixed(0) + ' ' + h
    + ' L0 ' + h + ' Z" fill="#f0e2c0" opacity=".08"/>';
  /* les fuseaux de toile, à peine lisibles */
  for (var q = 0; q < 7; q++)
    s += '<path d="M' + (w/2) + ' -30 L' + (q * w / 6).toFixed(0) + ' ' + h
      + '" stroke="#000" stroke-width="2" opacity=".1"/>';
  /* les bancs vides */
  for (var b = 0; b < 3; b++)
    s += '<rect x="-10" y="' + (h * (.3 + b * .07)).toFixed(0) + '" width="'
      + (w + 20) + '" height="' + (h * .035).toFixed(0) + '" fill="#3e3028"'
      + ' opacity=".5"/>';
  s += '<ellipse cx="' + (w/2) + '" cy="' + (h + h*.18).toFixed(0) + '" rx="'
    + (w*.78).toFixed(0) + '" ry="' + (h*.34).toFixed(0) + '" fill="url(#r-sol)"/>';
  return s;
}

/* ---------- le vrai passage : le chapiteau plein, le soir ----------
   Deux poursuites croisées, la toile rouge et or, la piste cerclée,
   et trois rangs de public qui se lèvent quand ça monte. */
function fondPassage(w, h, J){
  var s = '<defs>'
    + '<linearGradient id="p-toile" x1="0" y1="0" x2="0" y2="1">'
    +   '<stop offset="0%" stop-color="#2a0c14"/>'
    +   '<stop offset="100%" stop-color="#5c1420"/></linearGradient>'
    + '<radialGradient id="p-sol" cx="0.5" cy="1">'
    +   '<stop offset="0%" stop-color="#f0d49a"/>'
    +   '<stop offset="70%" stop-color="#c9a068"/>'
    +   '<stop offset="100%" stop-color="#7d5230"/></radialGradient>'
    + '<radialGradient id="p-halo" cx="0.5" cy="0.5">'
    +   '<stop offset="0%" stop-color="#ffe8b8" stop-opacity=".4"/>'
    +   '<stop offset="100%" stop-color="#ffe8b8" stop-opacity="0"/></radialGradient>'
    + '</defs>';
  s += '<rect x="0" y="0" width="' + w + '" height="' + h + '" fill="url(#p-toile)"/>';

  /* les fuseaux rouge et crème, qui convergent tout en haut */
  for (var q = 0; q < 9; q++){
    var x1 = -w * .3 + q * (w * 1.6 / 9), x2 = -w * .3 + (q + 1) * (w * 1.6 / 9);
    s += '<path d="M' + (w/2) + ' -40 L' + x1.toFixed(0) + ' ' + (h * .52).toFixed(0)
      + ' L' + x2.toFixed(0) + ' ' + (h * .52).toFixed(0) + ' Z" fill="'
      + (q % 2 ? '#7d1a20' : '#a8323a') + '" opacity=".9"/>';
  }
  s += '<ellipse cx="' + (w/2) + '" cy="-34" rx="' + (w*.09).toFixed(0)
    + '" ry="14" fill="#3a0c14"/>';

  /* les guirlandes d'ampoules, en festons */
  for (var g = 0; g < 12; g++){
    var gx = -6 + g * (w + 12) / 11;
    var gy = h * .2 + Math.sin(g / 11 * Math.PI * 3) * h * .035;
    var on = (g + Math.floor(J.t / 260)) % 3 !== 0;
    s += '<circle cx="' + gx.toFixed(0) + '" cy="' + gy.toFixed(0) + '" r="3.6"'
      + ' fill="' + (on ? '#ffe08a' : '#8a6a3a') + '"/>';
    if (on)
      s += '<circle cx="' + gx.toFixed(0) + '" cy="' + gy.toFixed(0) + '" r="10"'
        + ' fill="#ffe08a" opacity=".18"/>';
  }

  /* le public : trois rangs, qui se lèvent avec la suite */
  var lev = Math.min(1, J.suite / 20);
  for (var r = 0; r < 3; r++){
    var ry = h * (.3 + r * .062) + Math.sin(J.t / 400 + r) * lev * 3;
    var n = 11 + r * 2;
    for (var i = 0; i < n; i++){
      var px = -8 + i * (w + 16) / (n - 1);
      var rr = (h * .026) * (1 - r * .1);
      s += '<circle cx="' + px.toFixed(0) + '" cy="' + ry.toFixed(0) + '" r="'
        + rr.toFixed(1) + '" fill="' + ['#2a1620','#361c28','#241420'][i % 3] + '"/>';
      s += '<path d="M' + (px - rr * 1.5).toFixed(0) + ' ' + (ry + rr * 3.4).toFixed(0)
        + ' q' + (rr * 1.5).toFixed(0) + ' -' + (rr * 3).toFixed(0) + ' '
        + (rr * 3).toFixed(0) + ' 0 z" fill="#2a1620"/>';
      /* quelques visages attrapent la lumière */
      if ((i + r) % 4 === 0)
        s += '<circle cx="' + (px - rr * .3).toFixed(0) + '" cy="'
          + (ry - rr * .2).toFixed(0) + '" r="' + (rr * .5).toFixed(1)
          + '" fill="#c9925e" opacity="' + (.3 + lev * .4).toFixed(2) + '"/>';
    }
  }

  /* les deux poursuites, croisées sur la main */
  var mx = w / 2, my = h * .74;
  [[w * .12, -1], [w * .88, 1]].forEach(function(o){
    s += '<path d="M' + o[0].toFixed(0) + ' 0 L' + (mx - w * .2).toFixed(0) + ' '
      + (my + h * .1).toFixed(0) + ' L' + (mx + w * .2).toFixed(0) + ' '
      + (my + h * .1).toFixed(0) + ' Z" fill="#ffe8b8" opacity=".07"/>';
  });
  s += '<ellipse cx="' + mx + '" cy="' + my.toFixed(0) + '" rx="' + (w*.44).toFixed(0)
    + '" ry="' + (h*.3).toFixed(0) + '" fill="url(#p-halo)"/>';

  /* la piste, cerclée de rouge et or */
  s += '<ellipse cx="' + (w/2) + '" cy="' + (h + h*.16).toFixed(0) + '" rx="'
    + (w*.82).toFixed(0) + '" ry="' + (h*.36).toFixed(0) + '" fill="url(#p-sol)"/>';
  s += '<ellipse cx="' + (w/2) + '" cy="' + (h + h*.16).toFixed(0) + '" rx="'
    + (w*.82).toFixed(0) + '" ry="' + (h*.36).toFixed(0) + '" fill="none"'
    + ' stroke="#a8323a" stroke-width="9"/>';
  s += '<ellipse cx="' + (w/2) + '" cy="' + (h + h*.16 + 7).toFixed(0) + '" rx="'
    + (w*.82).toFixed(0) + '" ry="' + (h*.36).toFixed(0) + '" fill="none"'
    + ' stroke="#d4a03a" stroke-width="3.4" opacity=".8"/>';

  /* la poussière dans les faisceaux */
  for (var d = 0; d < 12; d++){
    var dx = mx + Math.sin(J.t / 2600 + d * 2.1) * w * .3;
    var dy = h * .18 + ((J.t / 26 + d * 90) % (h * .7));
    s += '<circle cx="' + dx.toFixed(0) + '" cy="' + dy.toFixed(0) + '" r="1.7"'
      + ' fill="#ffeec8" opacity=".4"/>';
  }
  return s;
}

function dessinerPiste(J, w, h){
  var my = h * .74, mx = w / 2;
  var s = REPETITION ? fondRepetition(w, h, J) : fondPassage(w, h, J);

  /* Le cercle de la main. Il s'allume quand une massue entre dans la
     fenêtre, et l'anneau se referme à mesure qu'elle approche du
     point parfait : on voit venir le bon moment, on ne le devine pas. */
  var proche = null, best = 9;
  J.massues.forEach(function(m){
    if (m.prise || m.ratee) return;
    var p = ouEnEst(m, J.t);
    if (p > .74 && p < 1.12){
      var d = Math.abs(p - .94);
      if (d < best){ best = d; proche = m; }
    }
  });
  var R = w * .17;
  s += '<circle cx="' + mx + '" cy="' + my.toFixed(0) + '" r="' + R.toFixed(0)
    + '" fill="none" stroke="rgba(246,230,216,.22)" stroke-width="3"/>';
  if (proche){
    /* l'anneau de visée : plus il est petit, plus c'est l'instant */
    var pr = 1 - Math.min(1, best / .2);
    s += '<circle cx="' + mx + '" cy="' + my.toFixed(0) + '" r="'
      + (R + 30 * (1 - pr)).toFixed(0) + '" fill="none" stroke="#ffe08a"'
      + ' stroke-width="' + (2 + 4 * pr).toFixed(1) + '" opacity="'
      + (.3 + .6 * pr).toFixed(2) + '"/>';
    if (pr > .55)
      s += '<circle cx="' + mx + '" cy="' + my.toFixed(0) + '" r="' + R.toFixed(0)
        + '" fill="#ffe08a" opacity="' + (.16 * pr).toFixed(2) + '"/>';
  }
  /* les deux mains du jongleur, de part et d'autre du cercle */
  [-1, 1].forEach(function(g){
    var hx = mx + g * R * .96;
    s += '<ellipse cx="' + hx.toFixed(0) + '" cy="' + (my + R * .5).toFixed(0)
      + '" rx="' + (R * .26).toFixed(0) + '" ry="' + (R * .19).toFixed(0)
      + '" fill="#e8dcc0" stroke="#2a1018" stroke-width="2.4"/>';
    s += '<path d="M' + hx.toFixed(0) + ' ' + (my + R * .68).toFixed(0)
      + ' v' + (h * .1).toFixed(0) + '" stroke="#f2e8dc" stroke-width="'
      + (R * .3).toFixed(0) + '" stroke-linecap="round"/>';
  });

  J.massues.forEach(function(m){
    var p = ouEnEst(m, J.t);
    if (p < 0 || p > 1.25 || m.prise) return;
    var x = (m.x0 + (m.x1 - m.x0) * p) / 100 * w;
    var y = my - Math.sin(Math.PI * Math.min(1, p)) * h * m.h;
    var a = p * 720 + (m.x1 > m.x0 ? 0 : 180);
    s += '<g transform="translate(' + x.toFixed(1) + ',' + y.toFixed(1)
      + ') rotate(' + a.toFixed(0) + ')">';
    /* devant le public, les massues portent des rubans qui traînent */
    if (!REPETITION){
      for (var tr = 1; tr < 4; tr++){
        var pt = p - tr * .022;
        if (pt < 0) continue;
        var tx = (m.x0 + (m.x1 - m.x0) * pt) / 100 * w;
        var ty = my - Math.sin(Math.PI * Math.min(1, pt)) * h * m.h;
        s += '<circle cx="' + (tx - x).toFixed(1) + '" cy="' + (ty - y).toFixed(1)
          + '" r="' + (5 - tr).toFixed(1) + '" fill="' + m.c + '" opacity="'
          + (.26 - tr * .06).toFixed(2) + '"/>';
      }
    }
    s += '<path d="M0 14 L0 -6" stroke="#e8dcc0" stroke-width="5" stroke-linecap="round"/>';
    s += '<ellipse cx="0" cy="-13" rx="7" ry="10" fill="' + m.c
      + '" stroke="#2a1018" stroke-width="2.4"/>';
    if (!REPETITION)
      s += '<ellipse cx="-2" cy="-16" rx="2.6" ry="4" fill="#ffffff" opacity=".45"/>';
    s += '<circle cx="0" cy="16" r="3.4" fill="#c9b48a"/>';
    s += '</g>';
    if (m.ratee)
      s += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1)
        + '" r="16" fill="none" stroke="#c9302c" stroke-width="3" opacity=".6"/>';
  });

  if (J.eclat > 0)
    s += '<circle cx="' + mx + '" cy="' + my.toFixed(0) + '" r="'
      + (w*.17 + J.eclat*26).toFixed(0) + '" fill="none" stroke="#ffe08a"'
      + ' stroke-width="' + (5*J.eclat).toFixed(1) + '" opacity="'
      + J.eclat.toFixed(2) + '"/>';

  /* les confettis : ils tombent quand la suite devient sérieuse,
     et seulement devant le public. On les mérite. */
  if (!REPETITION && J.suite >= 10){
    var n = Math.min(26, 6 + J.suite);
    for (var cf = 0; cf < n; cf++){
      var vit = 60 + (cf % 7) * 26;
      var cy = ((J.t / 1000 * vit) + cf * 137) % (h + 60) - 30;
      var cx2 = ((cf * 89) % 100) / 100 * w + Math.sin(J.t / 700 + cf) * 14;
      s += '<rect x="' + cx2.toFixed(0) + '" y="' + cy.toFixed(0) + '" width="5"'
        + ' height="9" rx="1.4" fill="'
        + ['#d4a03a','#c9302c','#f2e8dc','#6ab0a0'][cf % 4] + '" opacity=".8"'
        + ' transform="rotate(' + ((J.t / 4 + cf * 40) % 360).toFixed(0) + ' '
        + (cx2 + 2).toFixed(0) + ' ' + (cy + 4).toFixed(0) + ')"/>';
    }
  }

  /* le mot du jugé, qui monte et s'efface */
  if (J.juge && J.t - J.jugeT < 620){
    var k = (J.t - J.jugeT) / 620;
    var coul = J.juge === 'Belle prise' ? '#ffe08a'
             : J.juge === 'Bien' ? '#8ce0a8'
             : J.juge === 'De justesse' ? '#e8dcc0' : '#c9302c';
    s += '<text x="' + mx + '" y="' + (my - R - 18 - k * 26).toFixed(0) + '"'
      + ' text-anchor="middle" font-family="Georgia,serif" font-size="'
      + (22 - k * 3).toFixed(0) + '" fill="' + coul + '" opacity="'
      + (1 - k).toFixed(2) + '">' + J.juge + '</text>';
  }

  /* les massues qu'il te reste à laisser tomber */
  if (!REPETITION){
    for (var vi = 0; vi < 3; vi++)
      s += '<circle cx="' + (18 + vi * 17) + '" cy="30" r="6" fill="'
        + (vi < 3 - J.ratees ? '#d4a03a' : 'none') + '" stroke="#d4a03a"'
        + ' stroke-width="2"/>';
  }

  /* la suite en cours, quand elle vaut la peine d'être vue */
  if (J.suite >= 5)
    s += '<text x="' + (w - 16) + '" y="30" text-anchor="end"'
      + ' font-family="Georgia,serif" font-size="' + (20 + Math.min(14, J.suite / 4)).toFixed(0)
      + '" fill="#d4a03a" opacity=".85">' + J.suite + ' d\'affilée</text>';

  var reste = Math.max(0, 1 - (performance.now() - J.debut) / J.duree);
  var final = J.t > J.duree - 10000;
  s += '<rect x="0" y="' + (h-6) + '" width="' + (w*reste).toFixed(0)
    + '" height="6" fill="' + (final ? '#c9302c' : '#d4a03a') + '" opacity=".8"/>';
  if (final)
    s += '<text x="16" y="30" font-family="Georgia,serif" font-size="19"'
      + ' fill="#c9302c" opacity=".9">Le final</text>';
  return s;
}

function boucleJeu(){
  if (!JEU || JEU.fini) return;
  var el = document.getElementById('pi-sc');
  var w = el.clientWidth, h = el.clientHeight;
  var maintenant = performance.now();
  JEU.t = maintenant - JEU.debut;

  /* le rythme se resserre avec les prises, et le final accélère
     franchement : les dix dernières secondes sont un morceau à part */
  var final = JEU.t > JEU.duree - 10000;
  if (JEU.t > JEU.suivante){
    lancerMassue(JEU);
    var ecart = REPETITION
      ? Math.max(620, 1350 - JEU.attrapes * 24)
      : Math.max(500, 1150 - JEU.attrapes * 30);
    JEU.suivante = JEU.t + (final ? ecart * .58 : ecart);
  }
  JEU.massues.forEach(function(m){
    if (!m.prise && !m.ratee && ouEnEst(m, JEU.t) > 1.1){
      m.ratee = true; JEU.ratees++; JEU.suite = 0;
      JEU.juge = 'Au sol'; JEU.jugeT = JEU.t;
      BD.vibrer(26); BD.sonner('refus');
    }
  });
  /* devant le public, trois massues au sol et Don arrête tout.
     En répétition, on ramasse et on recommence. */
  if (!REPETITION && JEU.ratees >= 3){ finirNumero(); return; }
  JEU.massues = JEU.massues.filter(function(m){ return ouEnEst(m, JEU.t) < 1.35; });
  if (JEU.eclat > 0) JEU.eclat = Math.max(0, JEU.eclat - .06);

  el.innerHTML = '<svg viewBox="0 0 ' + w + ' ' + h + '"'
    + ' xmlns="http://www.w3.org/2000/svg">' + dessinerPiste(JEU, w, h) + '</svg>';
  document.getElementById('pi-a').textContent = JEU.attrapes;
  document.getElementById('pi-l').textContent = JEU.suite;
  document.getElementById('pi-r').textContent = REPETITION
    ? JEU.parfaites
    : (3 - JEU.ratees);

  if (maintenant - JEU.debut > JEU.duree){ finirNumero(); return; }
  requestAnimationFrame(boucleJeu);
}

function attraper(){
  if (!JEU || JEU.fini) return;
  var pris = null, mieux = 9;
  JEU.massues.forEach(function(m){
    if (m.prise || m.ratee) return;
    var p = ouEnEst(m, JEU.t), d = Math.abs(p - .94);
    if (p > .78 && p < 1.1 && d < mieux){ mieux = d; pris = m; }
  });
  if (pris){
    pris.prise = true;
    JEU.attrapes++; JEU.suite++;
    JEU.plusLong = Math.max(JEU.plusLong, JEU.suite);
    JEU.eclat = 1;
    /* le jugé : au centre de la fenêtre, c'est une belle prise,
       et le public le sent avant de le savoir */
    if (mieux < .035){ JEU.parfaites++; JEU.juge = 'Belle prise'; JEU.jugeT = JEU.t; }
    else if (mieux < .085){ JEU.juge = 'Bien'; JEU.jugeT = JEU.t; }
    else { JEU.juge = 'De justesse'; JEU.jugeT = JEU.t; }
    BD.vibrer(mieux < .035 ? [6, 20, 10] : 8); BD.sonner('massue');
  } else {
    JEU.suite = 0;
    JEU.juge = 'Dans le vide'; JEU.jugeT = JEU.t;
  }
}

async function finirNumero(){
  if (!JEU || JEU.fini) return;
  JEU.fini = true;
  var a = JEU.attrapes, l = JEU.plusLong, r = JEU.ratees;

  if (REPETITION){
    MEILLEUR = Math.max(MEILLEUR, a * 10 + l * 10);
    document.getElementById('pi-m').innerHTML = 'Répétition finie — <b>' + a
      + '</b> attrapées, suite de <b>' + l + '</b> — ' + (a * 10 + l * 10)
      + ' points. Ton meilleur : ' + MEILLEUR + '.';
    var g = document.getElementById('pi-go');
    g.style.display = ''; g.disabled = false; g.textContent = 'Recommencer';
    g.onclick = demarrerNumero;
    return;
  }

  document.getElementById('pi-m').textContent = 'Le rideau tombe…';
  var x;
  try { x = await BD.agir('mon_numero',
    { p_attrapes: a, p_plus_long: l, p_ratees: JEU.ratees }); }
  catch(e){ x = null; }
  if (!x || !x.ok){
    document.getElementById('pi-m').textContent = "Le public s'est déjà dispersé.";
    return;
  }
  document.getElementById('pi-sc').innerHTML = '<div class="issue2">'
    + '<b>' + x.score + '</b><i>points · ' + x.rang + 'e cette semaine</i>'
    + '<p>' + x.mot + '</p>'
    + '<span>+ ' + x.prime + ' € · + ' + x.xp + ' XP</span>'
    + '<span class="jt">+ ' + x.jetons + ' jetons de cirque</span></div>';
  var g2 = document.getElementById('pi-go');
  g2.style.display = ''; g2.textContent = 'Descendre de la piste';
  g2.onclick = fermerPiste;
}

function ouvrirPiste(repet){
  REPETITION = !!repet;
  var t3 = document.getElementById('pi-t3');
  if (t3) t3.textContent = repet ? 'Belles prises' : 'Vies';
  document.getElementById('piste').className = 'on';
  document.getElementById('pi-tt').textContent = repet ? 'Répétition' : 'Ton numéro';
  document.getElementById('pi-r').textContent = '0';
  document.getElementById('pi-a').textContent = '0';
  document.getElementById('pi-l').textContent = '0';
  document.getElementById('pi-m').textContent = repet
    ? 'Personne ne regarde. Autant en profiter.'
    : 'Une fois par semaine. Le public est là.';
  document.getElementById('pi-sc').innerHTML = '';
  var g = document.getElementById('pi-go');
  g.style.display = ''; g.disabled = false; g.textContent = 'Commencer';
  g.onclick = demarrerNumero;
}

function demarrerNumero(){
  var el = document.getElementById('pi-sc');
  document.getElementById('pi-go').style.display = 'none';
  document.getElementById('pi-m').textContent =
    'Touche quand une massue passe dans le cercle.';

  /* devant le public, le rideau s'ouvre avant qu'on lance */
  if (!REPETITION){
    el.innerHTML = '<div class="rideau"><i class="rg"></i><i class="rd"></i>'
      + '<b>Mesdames, messieurs…</b></div>';
    setTimeout(function(){
      /* le roulement de tambour : trois, deux, un */
      el.innerHTML = '<div class="rebours"><b id="reb">3</b></div>';
      var mots = ['3', '2', '1', 'À toi'], k = 0;
      (function pas(){
        var t = document.getElementById('reb');
        if (!t) return;
        t.textContent = mots[k];
        t.className = k === 3 ? 'go2' : '';
        BD.vibrer(k === 3 ? 50 : 16);
        k++;
        if (k < mots.length) setTimeout(pas, 720);
        else setTimeout(function(){
          JEU = jeuNeuf();
          requestAnimationFrame(boucleJeu);
        }, 520);
      })();
    }, 1450);
    return;
  }
  JEU = jeuNeuf();
  requestAnimationFrame(boucleJeu);
}

function fermerPiste(){
  if (JEU) JEU.fini = true;
  JEU = null;
  document.getElementById('piste').className = '';
  charger();
}

document.getElementById('pi-sc').addEventListener('pointerdown', function(e){
  e.preventDefault(); attraper();
});
document.getElementById('pi-x').onclick = fermerPiste;

/* ---------- ce qu'on demande au serveur ---------- */
async function entrer(){
  var b = document.getElementById('c-ecouter');
  b.disabled = true;
  /* il te fait entrer : on quitte la place pour la roulotte,
     puis le chapiteau quand il se retourne vers sa mère */
  decor('roulotte');
  document.getElementById('w').innerHTML = sceneProbleme();
  setTimeout(function(){ decor('dedans'); }, 3400);
  try { await BD.agir('cirque_entrer'); } catch(e){}
  setTimeout(charger, 4200);
}

async function embarquer(){
  var b = document.getElementById('c-embarquer');
  b.disabled = true;
  var x;
  try { x = await BD.agir('cirque_embarquer'); } catch(e){ x = null; }
  if (x && x.ok) await charger();
  else b.querySelector('span').textContent = 'Pas maintenant.';
}

async function rendre(){
  var b = document.getElementById('c-rendre');
  b.disabled = true;
  var x;
  try { x = await BD.agir('cirque_rendre'); } catch(e){ x = null; }
  if (!x || !x.ok){ b.querySelector('span').textContent = 'Pas maintenant.'; return; }
  decor('retour');
  document.getElementById('w').innerHTML = dits([x.mot]);
  setTimeout(charger, 3400);
}

async function designer(n){
  var x;
  try { x = await BD.agir('cirque_designer', { p_n: n }); } catch(e){ x = null; }
  if (!x || !x.ok) return;
  document.getElementById('w').innerHTML = dits([x.mot]);
  setTimeout(charger, x.bon ? 3600 : 2400);
}

async function acheter(k, b){
  b.disabled = true;
  var x;
  try { x = await BD.agir('acheter_au_cirque', { p_k: k }); } catch(e){ x = null; }
  if (!x || !x.ok){
    b.querySelector('span').textContent = x && x.pourquoi === 'pas_assez'
      ? 'Il te faut ' + x.faut + ' jetons.' : 'Pas maintenant.';
    return;
  }
  BD.sonner('piece');
  document.getElementById('w').innerHTML = dits([x.mot]);
  setTimeout(charger, 2800);
}

async function registre(){
  var b = document.getElementById('c-registre');
  b.disabled = true;
  var x;
  try { x = await BD.agir('cirque_registre'); } catch(e){ x = null; }
  if (!x || !x.ok){ b.querySelector('span').textContent = 'Pas maintenant.'; return; }
  document.getElementById('w').innerHTML = dits([x.mot]);
  setTimeout(charger, 3200);
}

async function faireRire(quoi){
  var x;
  try { x = await BD.agir('cirque_faire_rire', { p_quoi: quoi }); } catch(e){ x = null; }
  if (!x || !x.ok) return;
  document.getElementById('w').innerHTML = dits([x.mot]);
  if (x.ri) BD.vibrer([18, 70, 18, 70, 30]); BD.sonner('piece');
  setTimeout(charger, x.ri ? 4200 : 2600);
}

async function final(quoi){
  var x;
  try { x = await BD.agir('cirque_final', { p_choix: quoi }); } catch(e){ x = null; }
  if (!x || !x.ok) return;
  document.getElementById('w').innerHTML = dits([x.mot, '~' + x.gain]);
  setTimeout(charger, 5200);
}

async function charger(){
  var r;
  try { r = await BD.agir('au_cirque'); } catch(e){ leverAube(); return; }
  leverAube();
  if (!r || !r.ok){
    document.getElementById('w').innerHTML = '<p class="rien">'
      + (r && r.pourquoi === 'pas_ici'
          ? 'Le chapiteau est à Ajaccio. Il n\'a pas bougé depuis trois mois.'
          : 'Le rideau est baissé.') + '</p>';
    return;
  }
  C = r;
  /* le concours ne s'ouvre qu'une fois la chèvre revenue */
  if (C.vet && !C.chevre && !C.concours_gagne){
    try { AL = await BD.agir('cirque_alignee'); } catch(e){ AL = null; }
    if (AL && !AL.ok) AL = null;
  } else AL = null;
  /* l'affiche de la semaine, une fois l'histoire close */
  if (C.fin){
    try { NUM = await BD.agir('le_numero'); } catch(e){ NUM = null; }
    if (NUM && !NUM.ok) NUM = null;
    try { BOU = await BD.agir('la_boutique_du_cirque'); } catch(e){ BOU = null; }
    if (BOU && !BOU.ok) BOU = null;
  } else { NUM = null; BOU = null; }
  poser();
}

var AUBE = false;
function leverAube(){
  if (AUBE) return;
  AUBE = true;
  var c = document.getElementById('charge');
  if (!c) return;
  c.classList.add('parti');
  setTimeout(function(){ c.remove(); }, 500);
}
setTimeout(leverAube, 6000);

document.getElementById('ret').onclick = function(){ location.href = 'hub.html?v=7'; };

decor();
charger();

var t = null;
/* la barre d'adresse qui se cache envoie un resize : on ne redessine
   que si le cadre a vraiment changé, sinon l'écran clignote */
let __L = innerWidth, __H = innerHeight, __t = null;
function surRedimension(refaire){
  const dl = Math.abs(innerWidth - __L), dh = Math.abs(innerHeight - __H);
  if (dl < 2 && dh < 120) return;
  __L = innerWidth; __H = innerHeight;
  clearTimeout(__t);
  __t = setTimeout(refaire, 220);
}
addEventListener('resize', () => surRedimension(decor));
</script>
