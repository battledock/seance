<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e08a45">
<title>Battle Dock Life — accueil</title>
<style>
:root{--trait:#2a1710;--creme:#fdf3e0;--sable:#f2e2c0;
  --ocre:#f2b134;--ocre-b:#b07d12;--terre:#c9563a;--terre-b:#8f3520;
  --eau:#2a7d85;--eau-b:#175258;--bois:#8a5a2e;--bois-b:#573716}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0e3f47;color:var(--trait);
  font-family:"Arial Rounded MT Bold","Trebuchet MS",Verdana,sans-serif;font-weight:700;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font-family:inherit;font-weight:700;border:0;background:none;color:inherit;cursor:pointer;width:100%}
canvas{image-rendering:pixelated;display:block}
#decor{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
#voile{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,225,180,.10) 0%,transparent 28%,rgba(20,10,4,.55) 100%)}
.app{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;
  padding:calc(12px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom))}
.logo{width:min(430px,100%)}
.logo svg{width:100%;height:auto;filter:drop-shadow(0 8px 10px rgba(20,10,4,.55))}
.heros{flex:1;display:flex;align-items:flex-end;justify-content:center;width:100%;min-height:140px}
.heros canvas{width:min(320px,96%);height:auto;filter:drop-shadow(0 10px 10px rgba(20,10,4,.5))}
.fiche{width:min(430px,100%);background:var(--creme);border:3px solid var(--trait);border-radius:18px;
  box-shadow:0 6px 0 rgba(20,10,4,.5);padding:11px 13px;display:flex;align-items:center;gap:11px;
  margin-bottom:11px}
.fiche .qui{flex:1;min-width:0}
.fiche .nom{font-size:15px;text-transform:uppercase}
.fiche .det{font-family:"Trebuchet MS",sans-serif;font-weight:400;font-size:12px;color:#6b4c34;margin-top:3px}
.fiche .sous{flex:0 0 auto;background:var(--ocre);border:3px solid var(--trait);border-radius:12px;
  padding:7px 10px;font-size:14px;box-shadow:0 3px 0 var(--ocre-b)}
.menu{width:min(430px,100%);display:grid;gap:10px}
.bt{display:flex;align-items:center;gap:11px;text-align:left;border:3px solid var(--trait);
  border-radius:16px;padding:14px;font-size:17px;text-transform:uppercase;
  background:var(--ocre);box-shadow:0 5px 0 var(--ocre-b)}
.bt canvas{width:26px;height:26px;flex:0 0 auto}
.bt span{flex:1}
.bt em{font-style:normal;opacity:.55;font-size:15px}
.bt.terre{background:var(--terre);color:var(--creme);box-shadow:0 5px 0 var(--terre-b)}
.bt.eau{background:var(--eau);color:var(--creme);box-shadow:0 5px 0 var(--eau-b)}
.bt.bois{background:var(--bois);color:var(--creme);box-shadow:0 5px 0 var(--bois-b)}
.bt:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.45)}
.bt[disabled]{opacity:.55}
.pied{margin-top:10px;font-family:"Trebuchet MS",sans-serif;font-weight:400;font-size:11px;
  color:rgba(253,243,224,.75);text-shadow:0 1px 3px rgba(0,0,0,.6)}
</style>
</head>
<body>
<canvas id="decor" width="270" height="480"></canvas><div id="voile"></div>

<div class="app">
  <div class="logo" id="logo"></div>
  <div class="heros"><canvas id="heros" width="220" height="150"></canvas></div>

  <div class="fiche" id="fiche">
    <div class="qui"><div class="nom" id="f-nom">ELIAS</div>
      <div class="det" id="f-det">Docker simple · jour 12 · Mardi</div></div>
    <div class="sous" id="f-sous">180 €</div>
  </div>

  <div class="menu">
    <button class="bt terre"><canvas class="ic" data-ic="reprendre"></canvas><span>Reprendre ta vie</span><em>▸</em></button>
    <button class="bt"><canvas class="ic" data-ic="neuf"></canvas><span>Nouvelle vie</span><em>▸</em></button>
    <button class="bt bois"><canvas class="ic" data-ic="casque"></canvas><span>Ton docker</span><em>▸</em></button>
    <button class="bt eau" disabled><canvas class="ic" data-ic="gants"></canvas><span>Le combat — bientôt</span><em>✕</em></button>
  </div>
  <div class="pied">Sauvegarde locale · v0.1</div>
</div>

<script src="bdf.js"></script>
<script>
const $=id=>document.getElementById(id);
const {dessinerDocker,lookDefaut,px}=BDF;

/* ---------- logo ---------- */
$('logo').innerHTML=`
<svg viewBox="0 0 520 200" xmlns="http://www.w3.org/2000/svg">
 <defs>
  <linearGradient id="or" x1="0" y1="0" x2="0" y2="1">
   <stop offset="0%" stop-color="#fff3c4"/><stop offset="42%" stop-color="#f7c948"/>
   <stop offset="76%" stop-color="#e09b16"/><stop offset="100%" stop-color="#a86c08"/>
  </linearGradient>
  <linearGradient id="mer" x1="0" y1="0" x2="0" y2="1">
   <stop offset="0%" stop-color="#7fe0e6"/><stop offset="55%" stop-color="#2a7d85"/>
   <stop offset="100%" stop-color="#0f4a50"/>
  </linearGradient>
 </defs>
 <g font-family="Arial Black, Arial, sans-serif" text-anchor="middle">
  <text x="260" y="58" font-size="40" font-style="italic" fill="#fdf3e0"
        stroke="#2a1710" stroke-width="12" paint-order="stroke" letter-spacing="6">BATTLE DOCK</text>
  <text x="260" y="152" font-size="112" font-style="italic" fill="url(#mer)"
        stroke="#2a1710" stroke-width="18" paint-order="stroke" letter-spacing="4">LIFE</text>
  <text x="260" y="148" font-size="112" font-style="italic" fill="rgba(255,255,255,.28)"
        letter-spacing="4" clip-path="inset(0 0 66% 0)">LIFE</text>
  <text x="260" y="185" font-size="19" fill="#fdf3e0" stroke="#2a1710" stroke-width="7"
        paint-order="stroke" letter-spacing="7">UNE VIE SUR LE PORT</text>
 </g>
 <g stroke="#2a1710" stroke-width="6" fill="url(#or)">
   <rect x="60" y="96" width="16" height="54" rx="7"/><rect x="444" y="96" width="16" height="54" rx="7"/>
 </g>
</svg>`;

/* ---------- icônes ---------- */
function icone(cv,t){
  cv.width=32;cv.height=32;
  const g=cv.getContext('2d');g.imageSmoothingEnabled=false;g.clearRect(0,0,32,32);
  if(t==='reprendre'){px(g,7,6,4,20,'#fdf3e0');px(g,13,10,4,12,'#fdf3e0');
    px(g,19,7,4,18,'#fdf3e0');px(g,7,28,18,3,'#fdf3e0');}
  if(t==='neuf'){px(g,14,6,5,21,'#2a1710');px(g,7,13,19,5,'#2a1710');}
  if(t==='casque'){px(g,7,11,18,9,'#f2b134');px(g,4,19,24,4,'#b07d12');px(g,13,7,6,4,'#f2b134');}
  if(t==='gants'){px(g,4,12,11,11,'#f0e2c8');px(g,3,15,3,5,'#d8c8a8');
    px(g,17,12,11,11,'#f0e2c8');px(g,26,15,3,5,'#d8c8a8');}
}
document.querySelectorAll('canvas.ic').forEach(c=>icone(c,c.dataset.ic));

/* ---------- décor : la rade au crépuscule ---------- */
const dg=$('decor').getContext('2d');dg.imageSmoothingEnabled=false;
const DW=270,DH=480,MER=250;
function decor(t){
  const g=dg.createLinearGradient(0,0,0,MER);
  g.addColorStop(0,'#5d3a6b');g.addColorStop(.3,'#c95f52');
  g.addColorStop(.62,'#f0a05a');g.addColorStop(1,'#ffd79a');
  dg.fillStyle=g;dg.fillRect(0,0,DW,MER);
  const sy=MER-44;
  const h=dg.createRadialGradient(180,sy,6,180,sy,88);
  h.addColorStop(0,'rgba(255,236,170,.85)');h.addColorStop(1,'rgba(255,190,110,0)');
  dg.fillStyle=h;dg.fillRect(60,sy-95,240,190);
  dg.fillStyle='#fff0bd';dg.beginPath();dg.arc(180,sy,25,0,7);dg.fill();
  dg.fillStyle='rgba(255,220,190,.32)';
  for(let i=0;i<4;i++){const x=((t/(130+i*60))+i*95)%(DW+90)-45;
    dg.fillRect(x,48+i*22,62,7);dg.fillRect(x+12,41+i*22,36,7);}
  // Notre-Dame de la Garde
  dg.fillStyle='#6b3b34';dg.beginPath();dg.moveTo(150,MER);dg.quadraticCurveTo(214,112,272,MER);dg.fill();
  const bx=208;
  dg.fillStyle='#e8d6b4';dg.fillRect(bx-16,92,34,26);
  for(let i=0;i<4;i++)px(dg,bx-12+i*8,100,4,10,'#8a6a4a');
  dg.fillStyle='#e8d6b4';dg.fillRect(bx-5,56,12,38);
  dg.fillStyle='#f2c95a';dg.fillRect(bx-4,44,10,12);
  // fort à gauche
  dg.fillStyle='#5e352f';dg.beginPath();dg.moveTo(-10,MER);dg.quadraticCurveTo(38,166,108,MER);dg.fill();
  dg.fillStyle='#3f2a26';dg.fillRect(8,176,38,MER-176);
  for(let i=0;i<4;i++)dg.fillRect(8+i*10,170,6,7);
  // ville
  for(let i=0;i<22;i++){
    const x=i*13-4,hh=20+((i*37)%28),y=MER-hh;
    dg.fillStyle=i%3?'#4a2f2c':'#402926';dg.fillRect(x,y,12,hh);
    for(let f=0;f<3;f++)if((i*7+f*5)%4===0){
      dg.fillStyle=Math.sin(t/900+i+f)>-.2?'rgba(255,206,120,.9)':'rgba(255,206,120,.35)';
      dg.fillRect(x+3+(f%2)*5,y+5+f*6,3,3);}
  }
  // mer
  const m=dg.createLinearGradient(0,MER,0,DH);
  m.addColorStop(0,'#2b7d84');m.addColorStop(1,'#0c343b');
  dg.fillStyle=m;dg.fillRect(0,MER,DW,DH-MER);
  for(let i=0;i<16;i++){const y=MER+4+i*8,w=50-i*2+Math.sin(t/400+i)*10;
    dg.fillStyle='rgba(255,214,150,'+(0.28-i*0.015)+')';
    dg.fillRect(180-w/2+Math.sin(t/500+i*1.3)*5,y,w,3);}
  for(let i=0;i<18;i++){const y=MER+8+i*12,dx=Math.sin(t/700+i)*8;
    dg.fillStyle='rgba(255,255,255,.09)';
    dg.fillRect(dx+((i*53)%DW)-30,y,24,2);}
  dg.strokeStyle='rgba(253,243,224,.75)';dg.lineWidth=2;
  for(let i=0;i<3;i++){const x=((t/(75+i*30))+i*110)%(DW+50)-25,
    y=66+i*24+Math.sin(t/500+i)*8,o=Math.sin(t/110+i*2)*4;
    dg.beginPath();dg.moveTo(x-6,y);dg.lineTo(x,y-o);dg.lineTo(x+6,y);dg.stroke();}
}

/* ---------- quai + docker ---------- */
const hg=$('heros').getContext('2d');hg.imageSmoothingEnabled=false;
const look=Object.assign(lookDefaut(),{nom:'ELIAS',carrure:'solide',teint:2,cheveux:'court',cheveuxC:1,
  barbe:'ombre',haut:'marcel',hautC:6,bas:'jean',basC:1,ceinture:'cuir',pieds:'brodequins',
  tete:'rien',visage:'curedent',mains:'nues',dos:'sac',arme:'aucune',expression:'decide'});
function quai(g,W,y,t){
  g.fillStyle='rgba(12,52,59,.5)';g.fillRect(0,y+18,W,60);
  for(let i=0;i<5;i++){g.fillStyle='rgba(255,255,255,.09)';
    g.fillRect((((i*67)+Math.sin(t/600+i)*10)%W)-20,y+24+i*9,28,2);}
  g.fillStyle='#c9a97a';g.fillRect(0,y,W,18);
  g.fillStyle='#e0c393';g.fillRect(0,y,W,4);
  g.fillStyle='#a8875c';g.fillRect(0,y+14,W,4);
  for(let x=-6;x<W;x+=34)g.fillStyle='#a8875c',g.fillRect(x,y+4,3,10);
  g.fillStyle='#2a1710';g.fillRect(0,y+18,W,3);
  const bx=W-34;
  g.fillStyle='#3f4a52';g.fillRect(bx,y-14,12,15);
  g.fillStyle='#586570';g.fillRect(bx-2,y-19,16,6);
  g.strokeStyle='#d9a95a';g.lineWidth=3;g.beginPath();g.moveTo(bx+2,y-8);
  g.quadraticCurveTo(bx-42,y+10+Math.sin(t/900)*2,bx-82,y-2);g.stroke();
  g.fillStyle='#9a6238';g.fillRect(14,y-20,26,20);
  g.fillStyle='#c08a52';g.fillRect(14,y-20,26,3);
  g.fillStyle='#4a2916';g.fillRect(14,y-12,26,3);
}
(function boucle(t){
  requestAnimationFrame(boucle);
  decor(t);
  hg.clearRect(0,0,220,150);
  quai(hg,220,112,t);
  hg.save();hg.translate(110,112);
  hg.fillStyle='rgba(20,10,4,.3)';hg.beginPath();hg.ellipse(0,1,16,4,0,0,7);hg.fill();
  dessinerDocker(hg,{look,etat:(Math.floor(t/3000)%4===3)?'gagne':'debout',coup:null,sol:1,sens:1,garde:0,stun:0},t);
  hg.restore();
})(0);

/* ---------- la sauvegarde réelle si elle existe ---------- */
try{
  const s=JSON.parse(localStorage.getItem('bdlife.v1')||'null');
  if(s){
    const J=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
    const P={secu:'Sécurité',bequille:'Béquille',docker:'Docker simple',taquet:'Taquet terre',
      pointeur:'Pointeur',chauffeur:'Chauffeur',chef:'Chef de service'};
    $('f-nom').textContent=(s.look&&s.look.nom)||'ELIAS';
    $('f-det').textContent=(P[s.poste]||'Sécurité')+' · jour '+s.jour+' · '+J[(s.jour-1)%7];
    $('f-sous').textContent=s.euros+' €';
    if(s.look)Object.assign(look,s.look);
  }
}catch(x){}
</script>
</body>
</html>
