<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <title>Programmation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css?v=2ab9afab">
  <style>
    /* Style minimal du voile : il doit couvrir l'écran avant même
       que base.css soit arrivé, sinon on aperçoit la page nue. */
    body{margin:0;background:#0a0406}
    .contenu,.entete,.navBas{opacity:0}
    #voileChargement{position:fixed;inset:0;z-index:500;display:flex;flex-direction:column;
      align-items:center;justify-content:center;gap:20px;
      background:radial-gradient(ellipse at 50% 42%,#2a1018,#0a0406 72%)}
  </style>
</head>
<body>

<div class="voileChargement" id="voileChargement" role="status" aria-live="polite">
  <svg class="vcBobine" viewBox="0 0 74 74" aria-hidden="true">
    <g class="roue">
      <circle cx="37" cy="37" r="32" fill="none" stroke="#caa24a" stroke-width="3"/>
      <circle cx="37" cy="37" r="7" fill="#caa24a"/>
      <g fill="#caa24a" opacity=".85">
        <circle cx="37" cy="16" r="5.4"/><circle cx="55" cy="47" r="5.4"/><circle cx="19" cy="47" r="5.4"/>
      </g>
    </g>
    <circle class="pellicule" cx="37" cy="37" r="32" fill="none"
      stroke="#f7dd9a" stroke-width="1.6" opacity=".6"/>
  </svg>
  <div class="vcNom">Séance</div>
  <div class="vcTexte">On allume le projecteur…</div>
  <div class="vcPiste"><i></i></div>
</div>

<main class="contenu salleProg">
  <div class="tentureP g" aria-hidden="true"></div>
  <div class="tentureP d" aria-hidden="true"></div>
  <div class="appliqueP g" aria-hidden="true"><i></i></div>
  <div class="appliqueP d" aria-hidden="true"><i></i></div>

  <!-- le fronton lumineux -->
  <div class="fronton">
    <h1>Programmation</h1>
    <p id="sousTitre">À l'affiche aujourd'hui</p>
  </div>

  <!-- les trois vues -->
  <nav class="segments" id="segments" role="tablist">
    <button role="tab" class="on" data-vue="affiche" aria-selected="true">À l'affiche</button>
    <button role="tab" data-vue="catalogue" aria-selected="false">Prochains films</button>
    <button role="tab" data-vue="evenements" aria-selected="false">Événements</button>
  </nav>

  <!-- le carrousel : une affiche par séance du jour -->
  <div class="carrousel">
    <button class="flecheC g" id="flecheG" aria-label="Précédent">‹</button>
    <button class="flecheC d" id="flecheD" aria-label="Suivant">›</button>
    <div class="pisteAffiches" id="pisteAffiches"></div>
  </div>

  <!-- la plaque du jour -->
  <div class="ligneJour">
    <div class="plaqueJour" id="plaqueJour">Aujourd'hui</div>
    <div class="badgeJour">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/>
        <path d="M3 10h18M8 3v4M16 3v4"/></svg>
      <span id="badgeJourTxt">Jour 1</span>
    </div>
  </div>

  <!-- le tableau détaillé -->
  <div class="tableauProg" id="tableauProg"></div>
  <div id="zoneValidation"></div>

  <!-- Bob -->
  <div class="blocBob blocBobProg">
    <div class="bob"><svg viewBox="0 0 120 150" aria-label="Bob">
      <path d="M32 112 Q18 122 22 138" stroke="#8a2f3c" stroke-width="12" fill="none" stroke-linecap="round"/>
      <ellipse cx="60" cy="118" rx="34" ry="30" fill="#8a2f3c"/>
      <path d="M44 104 L60 140 L76 104 Z" fill="#e8b84b"/>
      <g class="brasAnim">
        <path d="M88 108 Q104 96 100 78" stroke="#8a2f3c" stroke-width="12" fill="none" stroke-linecap="round"/>
        <circle cx="100" cy="74" r="7" fill="#f0c9a0"/>
      </g>
      <circle cx="60" cy="70" r="26" fill="#f0c9a0"/>
      <path d="M40 78 Q50 86 60 79 Q70 86 80 78 Q72 92 60 84 Q48 92 40 78" fill="#4a3527"/>
      <path d="M44 60 Q51 55 57 59 M63 59 Q69 55 76 60" stroke="#4a3527" stroke-width="4" fill="none" stroke-linecap="round"/>
      <circle cx="51" cy="66" r="2.6" fill="#1c1210"/><circle cx="69" cy="66" r="2.6" fill="#1c1210"/>
      <path d="M34 56 Q60 34 86 56 L86 50 Q60 28 34 50 Z" fill="#571520"/>
      <rect x="52" y="44" width="16" height="7" rx="2" fill="#e8b84b"/>
    </svg></div>
    <div class="bulle">
      <b>Bob — homme à tout faire officiel</b>
      <span id="bulleProg">…</span>
    </div>
  </div>
</main>

<script type="module" src="js/pages/programmation.js?v=2ab9afab"></script>
</body>
</html>
