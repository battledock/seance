<script type="module">
import {
  V2, chargeEtat, monCinema, chargeOffre, previsionJournee, peutOuvrir, synchronise, faireRelache,
  ouvrirLesPortes, signerLicence, poserSeance, retirerSeance,
  nettoyer, reparer, agrandir, ameliorer, reapprovisionner, embaucher, congedier,
  chargeTarifsEquipement, apercuAgrandissement,
  constructionsPossibles, construire, reviserTarifs,
  decompteEtoiles, seuilRentabilite, echeances, historique,
  messageErreurV2, requeteTable
} from "./js/v2/api.js?v=becf21cb";
import { rendFacade, surveilleTaille } from "./js/v2/facade.js?v=becf21cb";
import { rendGrille, rendResume, rendPiedGrille, echappe } from "./js/v2/grille.js?v=becf21cb";
import { rendCatalogue, ouvrePanneau } from "./js/v2/films.js?v=becf21cb";
import { rendBarreNav } from "./js/v2/icones.js?v=becf21cb";

/* ============================================================
   L'ASSEMBLAGE

   Cinq vues, un état. On recharge l'état après chaque action qui
   modifie le monde, et on ne redessine que ce qui a changé : la
   façade coûte cher, on ne la refait pas pour un nettoyage.
   ============================================================ */

const $ = id => document.getElementById(id);
const eur = n => Math.round(Number(n) || 0).toLocaleString("fr") + " €";
let vue = "cinema", onglet = "nouveautes";
let etat = null, offre = null, prevision = null, peut = null, tarifsEq = null;

/* ---------- messages ---------- */
let minuteurToast = null;
function dit(msg, grave){
  const t = $("toast");
  t.textContent = msg;
  t.className = "toast on" + (grave ? " grave" : "");
  clearTimeout(minuteurToast);
  minuteurToast = setTimeout(() => t.className = "toast", 2800);
}

/* ---------- l'en-tête de la façade ---------- */
function rendEntete(){
  const c = etat.cinema;
  $("hNom").textContent = c.nom;
  $("hArgent").textContent = eur(c.tresorerie);
  $("hArgent").className = "fArg" + (c.tresorerie < 0 ? " dette" : "");
  $("hJour").textContent = "Jour " + c.jour;

  const n = Math.round(c.etoiles);
  let h = "";
  for(let i = 1; i <= 5; i++){
    const p = i <= n;
    h += `<svg viewBox="0 0 24 24" fill="${p ? "#f0c96a" : "none"}"
      stroke="${p ? "#f0c96a" : "rgba(255,255,255,.3)"}" stroke-width="1.8">
      <path d="M12 2l3 6.5 7 .9-5 4.9 1.2 7L12 18l-6.2 3.3L7 14.3l-5-4.9 7-.9z"/></svg>`;
  }
  $("hEtoiles").innerHTML = h + `<i>${Number(c.etoiles).toFixed(1).replace(".",",")}</i>`;
}

/* ---------- les alertes ---------- */
const ACTIONS = {
  nettoyer:        {t:"Nettoyer",       f:(a) => nettoyer(a.salle_id)},
  reparer:         {t:"Réparer",        f:(a) => reparer(a.salle_id)},
  embaucher:       {t:"Embaucher",      f:() => embaucher("caisse")},
  reapprovisionner:{t:"Réassortir",     f:() => reapprovisionner(600)}
};
function rendAlertes(){
  const l = (etat.alertes || []).slice(0, 2);
  $("alertes").innerHTML = l.map((a, i) => `
    <div class="fAl ${a.gravite === "haute" ? "haute" : ""}">
      <span class="pt"></span><p>${echappe(a.texte)}</p>
      ${ACTIONS[a.action] ? `<button data-a="${i}">${ACTIONS[a.action].t}</button>` : ""}
    </div>`).join("");

  $("alertes").querySelectorAll("[data-a]").forEach(b =>
    b.addEventListener("click", async () => {
      const a = l[Number(b.dataset.a)];
      b.disabled = true; b.textContent = "…";
      const r = await ACTIONS[a.action].f(a);
      if(r.erreur){ dit(messageErreurV2(r), true); b.disabled = false; }
      else { dit("C'est fait."); await rafraichit(true); }
    }));
}

/* ---------- l'ouverture ---------- */
function rendBoutonOuvrir(){
  const b = $("btnOuvrir");
  const ok = peut?.ouvrable;
  const tout = peut?.raison === "TOUT_EN_TRAVAUX";

  b.disabled = false;
  b.dataset.mode = ok ? "ouvrir" : tout ? "relache" : "programmer";
  b.textContent = ok ? "Ouvrir les portes"
    : tout ? "Faire relâche"
    : "Composer la journée";

  $("sousOuvrir").textContent = tout
    ? "Toutes vos salles sont en chantier. Les charges tombent quand même."
    : !ok ? "Aucune séance à l'affiche aujourd'hui"
    : prevision && prevision.seances?.length
    ? `${prevision.seances.length} séance${prevision.seances.length>1?"s":""} · `
      + `${prevision.spectateurs} spectateurs attendus`
      + (prevision.refuses ? ` · ${prevision.refuses} refusés` : "")
    : "Rien au programme aujourd'hui";
}

/* ---------- les salles ---------- */
const EQUIPEMENTS = [
  ["fauteuils","Fauteuils"], ["ecran","Écran"], ["son","Son"],
  ["projecteur","Projecteur"], ["decoration","Décoration"]
];
function rendSalles(){
  const s = etat.salles || [];
  $("sSousTitre").textContent =
    `${s.length} salle${s.length>1?"s":""} · ${s.reduce((t,x)=>t+x.places,0)} places · `
    + `${etat.equipe?.en_poste ?? 0} employés`;

  $("salles").innerHTML = s.map(x => {
    /* ce que coûterait le prochain palier de chaque équipement,
       et ce qu'il apporterait — un achat doit se décider avant,
       pas se découvrir une fois payé */
    const lignes = EQUIPEMENTS.map(([c,n]) => {
      const niv = x[c] || 0;
      const suivant = tarifsEq?.[c]?.[niv + 1];
      const cher = suivant && suivant.cout > etat.cinema.tresorerie;
      return `<div class="eq">
        <span class="nmEq"><b>${n}</b>${suivant
          ? `<small>${echappe(suivant.nom)}</small>` : `<small>au maximum</small>`}</span>
        <span class="niv">${[1,2,3,4,5].map(i =>
          `<i class="${i <= niv ? "on" : ""}"></i>`).join("")}</span>
        <button class="px ${cher ? "cher" : ""}" data-salle="${x.id}" data-eq="${c}"
          ${niv >= 5 || cher ? "disabled" : ""}>${
            niv >= 5 ? "max" : suivant ? eur(suivant.cout) : "—"}</button>
      </div>`;
    }).join("");

    const coutNettoyage = Math.round(x.places * 0.55 + (100 - x.proprete) * 1.2);
    const coutReparation = Math.round((100 - x.etat) * (8 + x.places * 0.12));
    const coutAgrandir = Math.round(2200 + (x.places - 50) * 46);

    return `<div class="carteSalle">
      <div class="salleTete">
        <div class="salleInfo"><b>${echappe(x.nom)}</b>
          <div class="meta">${x.places} places · ${x.type}</div>
          ${x.en_travaux
            ? `<span class="tag travaux">Fermée · rouvre au jour ${x.rouvre_au_jour}</span>`
            : ""}</div>
      </div>
      <div class="jauges">
        <div class="jg"><div class="lb"><span>Propreté</span><b>${x.proprete} %</b></div>
          <div class="barre"><i style="width:${x.proprete}%;background:${
            x.proprete >= 70 ? "#2a8a4a" : x.proprete >= 45 ? "#c9a24a" : "#c05a3a"}"></i></div></div>
        <div class="jg"><div class="lb"><span>État</span><b>${x.etat} %</b></div>
          <div class="barre"><i style="width:${x.etat}%;background:${
            x.etat >= 70 ? "#2a8a4a" : x.etat >= 45 ? "#c9a24a" : "#c05a3a"}"></i></div></div>
      </div>
      <div class="equipList">${lignes}</div>
      <div class="actions">
        <button data-act="nettoyer" data-salle="${x.id}" ${x.proprete >= 98 ? "disabled" : ""}>
          Nettoyer<small>${x.proprete >= 98 ? "déjà propre" : eur(coutNettoyage)}</small></button>
        <button data-act="reparer" data-salle="${x.id}"
          ${x.etat >= 98 || x.en_travaux ? "disabled" : ""}>
          Réparer<small>${x.en_travaux ? "en travaux"
            : x.etat >= 98 ? "en bon état" : eur(coutReparation)}</small></button>
        <button data-act="agrandir" data-salle="${x.id}" ${x.en_travaux ? "disabled" : ""}>
          Agrandir<small>${x.en_travaux ? "en travaux" : "+15 pl. · " + eur(coutAgrandir)}</small></button>
      </div>
    </div>`;
  }).join("");

  /* Construire est la vraie décision de croissance : elle mérite
     sa place au bas de la liste, pas un onglet séparé. */
  $("salles").insertAdjacentHTML("beforeend",
    `<button class="construire" id="btnConstruire">+ Construire une salle</button>`);
  $("btnConstruire").addEventListener("click", ouvreConstruction);

  $("salles").querySelectorAll("[data-eq]").forEach(b =>
    b.addEventListener("click", () => agit(() => ameliorer(b.dataset.salle, b.dataset.eq))));
  $("salles").querySelectorAll("[data-act]").forEach(b =>
    b.addEventListener("click", async () => {
      /* agrandir engage du personnel : on prévient avant */
      if(b.dataset.act === "agrandir"){
        const a = await apercuAgrandissement(b.dataset.salle);
        if(a.ok && a.data.embauches_necessaires > 0){
          if(!confirm(a.data.avertissement + "\n\nContinuer ?")) return;
        }
      }
      const f = {nettoyer, reparer, agrandir}[b.dataset.act];
      agit(() => f(b.dataset.salle));
    }));
}

/* ============================================================
   CONSTRUIRE UNE SALLE

   Cinq formats. Les plus rares demandent de la réputation, pas
   un niveau : on ne confie pas un grand format à un cinéma qui
   ne tient pas ses salles. Chaque blocage dit sa raison.
   ============================================================ */
function coupeSalle(type){
  const C = {
    standard:{rangs:5, base:6, ecran:{w:150,h:44}, dossier:"#8a2436", assise:"#6a1a2a",
      mur:"#241a1e", sol:"#1a1216", halo:"#ffd98a", op:.14, courbe:.10},
    premium: {rangs:4, base:5, ecran:{w:160,h:48}, dossier:"#7a2a4a", assise:"#5a1c36",
      mur:"#281a24", sol:"#1e141c", halo:"#ffcfa0", op:.18, courbe:.16},
    vip:     {rangs:3, base:4, ecran:{w:148,h:46}, dossier:"#8a4a7a", assise:"#6a3458",
      mur:"#2a1c28", sol:"#201620", halo:"#ffd0e0", op:.22, courbe:.22},
    "4dx":   {rangs:4, base:5, ecran:{w:166,h:50}, dossier:"#2a6a8a", assise:"#1c4a68",
      mur:"#16222c", sol:"#101820", halo:"#9ad8ff", op:.20, courbe:.14},
    imax:    {rangs:7, base:8, ecran:{w:236,h:58}, dossier:"#7a2030", assise:"#5a1422",
      mur:"#1a1014", sol:"#120c10", halo:"#ffe0b0", op:.16, courbe:.06}
  }[type] || null;
  if(!C) return "";
  const W = 290, H = 112, cx = W / 2;
  let sieges = "";
  for(let r = C.rangs - 1; r >= 0; r--){
    const t = r / Math.max(1, C.rangs - 1);
    const ech = 1 - t * 0.46;
    const zone = H - (C.ecran.h + 20);
    const y = H - 8 - t * zone * 0.96;
    const nb = C.base + Math.round(r * 1.4);
    const lw = 13 * ech, gap = 3 * ech;
    const x0 = cx - (nb * (lw + gap) - gap) / 2;
    const hd = 10 * ech, ha = 3.6 * ech;
    for(let i = 0; i < nb; i++){
      const d = (i - (nb - 1) / 2) / Math.max(1, (nb - 1) / 2);
      const yy = y + d * d * C.courbe * 12 * ech;
      const x = x0 + i * (lw + gap);
      sieges += `<g opacity="${(0.52 + t * 0.42).toFixed(2)}">
        <rect x="${x.toFixed(1)}" y="${(yy - hd).toFixed(1)}" width="${lw.toFixed(1)}"
          height="${hd.toFixed(1)}" rx="${(2.2*ech).toFixed(1)}" fill="${C.dossier}"/>
        <rect x="${(x + lw*.12).toFixed(1)}" y="${(yy - hd + 1.1*ech).toFixed(1)}"
          width="${(lw*.76).toFixed(1)}" height="${(hd*.5).toFixed(1)}"
          rx="${(1.4*ech).toFixed(1)}" fill="#fff" opacity=".10"/>
        <rect x="${(x - .8*ech).toFixed(1)}" y="${yy.toFixed(1)}"
          width="${(lw + 1.6*ech).toFixed(1)}" height="${ha.toFixed(1)}"
          rx="${(1.1*ech).toFixed(1)}" fill="${C.assise}"/></g>`;
    }
  }
  const ew = C.ecran.w, eh = C.ecran.h, ex = cx - ew/2, ey = 10;
  const g = "g" + type.replace(/[^a-z0-9]/g,"");
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice">
    <defs>
      <linearGradient id="m${g}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="${C.mur}"/><stop offset="1" stop-color="${C.sol}"/></linearGradient>
      <linearGradient id="e${g}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#f4efe2"/><stop offset=".55" stop-color="#ddd6c4"/>
        <stop offset="1" stop-color="#c4bca8"/></linearGradient>
      <radialGradient id="h${g}" cx=".5" cy=".28" r=".62">
        <stop offset="0" stop-color="${C.halo}" stop-opacity="${C.op}"/>
        <stop offset="1" stop-color="${C.halo}" stop-opacity="0"/></radialGradient>
      <linearGradient id="f${g}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="${C.halo}" stop-opacity=".22"/>
        <stop offset="1" stop-color="${C.halo}" stop-opacity="0"/></linearGradient>
    </defs>
    <rect width="${W}" height="${H}" fill="url(#m${g})"/>
    <path d="M0 0 L${ex-14} ${ey-3} L${ex-14} ${ey+eh+9} L0 ${H} Z" fill="#000" opacity=".26"/>
    <path d="M${W} 0 L${ex+ew+14} ${ey-3} L${ex+ew+14} ${ey+eh+9} L${W} ${H} Z"
      fill="#000" opacity=".26"/>
    <path d="M${cx} 0 L${ex+6} ${ey+eh+4} L${ex+ew-6} ${ey+eh+4} Z" fill="url(#f${g})"/>
    <ellipse cx="${cx}" cy="${ey+eh/2}" rx="${ew*.82}" ry="${eh*1.15}" fill="url(#h${g})"/>
    <rect x="${ex-4}" y="${ey-4}" width="${ew+8}" height="${eh+8}" rx="2" fill="#0d0a0c"/>
    <rect x="${ex}" y="${ey}" width="${ew}" height="${eh}" rx="1" fill="url(#e${g})"/>
    <path d="M${ex} ${ey+eh} L${ex+ew*.34} ${ey} L${ex+ew*.52} ${ey}
             L${ex+ew*.12} ${ey+eh} Z" fill="#fff" opacity=".16"/>
    <rect x="${ex-4}" y="${ey-4}" width="${ew+8}" height="${eh+8}" rx="2" fill="none"
      stroke="#caa24a" stroke-width="1.2" opacity=".55"/>
    ${sieges}</svg>`;
}

async function ouvreConstruction(){
  const p = $("panConstruire");
  p.classList.add("ouvert");
  $("consListe").innerHTML = `<div class="cVide">Un instant…</div>`;
  /* cette fonction rend le tableau directement, pas une enveloppe
     {ok, data} : le traiter comme les autres vidait la liste et
     faisait sortir un minimum infini. */
  const l = await constructionsPossibles();
  if(!Array.isArray(l) || l.length === 0){
    $("consListe").innerHTML =
      `<div class="cVide">Impossible de charger les formats de salle.</div>`;
    return;
  }
  const n = (etat.salles || []).length;
  $("consSous").textContent = `${n} salle${n>1?"s":""} sur 8 · `
    + `${Number(etat.cinema.etoiles).toFixed(1).replace(".",",")} étoiles · ${eur(etat.cinema.tresorerie)}`;

  /* Un panneau où rien n'est cliquable ressemble à une panne. On
     dit franchement ce qui manque, et à partir de quand ce sera
     possible. */
  const faisables = l.filter(t => t.possible).length;
  const moinsCher = Math.min(...l.map(t => Number(t.cout) || 0).filter(v => v > 0));
  const entete = faisables > 0 ? "" : `
    <div class="consVide">
      <b>Rien n'est encore à votre portée</b>
      <span>La salle la moins chère coûte ${eur(moinsCher)} et vous avez
        ${eur(etat.cinema.tresorerie)}. Une salle de plus double votre capacité —
        c'est le plus gros pas du jeu, il se prépare.</span>
    </div>`;

  $("consListe").innerHTML = entete + l.map(t => `
    <div class="typeS ${t.possible ? "" : "bloque"}">
      <div class="typeVue">${coupeSalle(t.type)}
        <span class="typeBadge">${t.places} places</span></div>
      <div class="typeCorps">
        <div class="typeT"><b>${echappe(t.nom)}</b><span class="px">${eur(t.cout)}</span></div>
        <p class="typeD">${echappe(t.description)}</p>
        <div class="typeStats">
          <div><b>${t.places}</b><span>places</span></div>
          <div><b>${t.bonus_prix > 0 ? "+" + fmt(t.bonus_prix) : "—"}</b><span>tarif</span></div>
          <div><b>${t.embauches}</b><span>embauches</span></div>
        </div>
        ${t.possible
          ? `<button class="typeAct" data-type="${t.type}">Construire · ${eur(t.cout)}</button>`
          : `<div class="typeBloc">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9">
                <rect x="4" y="11" width="16" height="10" rx="2"/>
                <path d="M8 11V7a4 4 0 018 0v4"/></svg>
              ${echappe(t.blocage || "")}</div>`}
      </div>
    </div>`).join("");

  $("consListe").querySelectorAll("[data-type]").forEach(b =>
    b.addEventListener("click", async () => {
      b.disabled = true; b.textContent = "Les travaux commencent…";
      const c = await construire(b.dataset.type);
      if(c.erreur){ dit(messageErreurV2(c), true); b.disabled = false; return; }
      ferme("panConstruire");
      dit(`${c.data.type} · ${c.data.equipe.manque > 0
        ? c.data.equipe.manque + " embauche(s) à prévoir" : "prête bientôt"}`);
      await rafraichit(true);
    }));
}

/* ============================================================

   Deux postes sont obligatoires pour ouvrir : la caisse et le
   ménage. Les autres se choisissent. Manquer de personnel
   n'empêche pas d'ouvrir, mais allonge les files et pèse sur la
   note — un cinéma mal tenu se voit.

   dépense quotidienne et qu'on doit pouvoir la justifier.
   ============================================================ */
const POSTES_DISPO = [
  {c:"caisse",     n:"Caisse",       s:48,
   d:"Vend les billets. Sans elle, la file décourage une partie du public."},
  {c:"menage",     n:"Ménage",       s:42,
   d:"Nettoie entre les séances. La propreté est le premier facteur de votre note."},
  {c:"projection", n:"Projection",   s:58,
   d:"Un projectionniste par salle au-delà de la première."},
  {c:"securite",   n:"Sécurité",     s:52,
   d:"Rassure les séances tardives et les grosses affluences."},
  {c:"confiserie", n:"Confiserie",   s:45,
   d:"Tient le comptoir. Sans personne, une partie des ventes se perd."}
];

async function ouvreEquipe(){
  $("panEquipe").classList.add("ouvert");
  $("eqCorps").innerHTML = `<div class="cVide">Un instant…</div>`;
  const l = await requeteTable(
    "v2_personnel?select=id,poste,salaire,obligatoire&order=embauche_le")
    .catch(() => null);
  if(!l){ dit("Impossible de lire votre équipe.", true); return; }
  rendEquipe(l);
}

function rendEquipe(l){
  const eq = etat.equipe || {};
  const masse = l.reduce((t, p) => t + Number(p.salaire), 0);
  $("eqSous").textContent =
    `${l.length} personne${l.length>1?"s":""} · ${eur(masse)} par jour`;

  const compte = {};
  for(const p of l) compte[p.poste] = (compte[p.poste] || 0) + 1;

  $("eqCorps").innerHTML = `
    <div class="eqBilan ${eq.manque > 0 ? "court" : "ok"}">
      <b>${eq.manque > 0
        ? `Il vous manque ${eq.manque} personne${eq.manque>1?"s":""}`
        : "Votre équipe suffit"}</b>
      <span>${eq.manque > 0
        ? "Les files s'allongent et votre note en souffre."
        : `Pour ${(etat.salles||[]).reduce((t,x)=>t+x.places,0)} places, il en faut ${eq.requis}.`}</span>
    </div>

    <div class="groupe">En poste</div>

      return `<div class="eqLigne">
        <span class="eqNom"><b>${inf.n}</b><small>${echappe(inf.d)}</small></span>
        <span class="eqSal">${eur(p.salaire)}<i>par jour</i></span>
        <button class="eqX" data-vire="${p.id}" ${p.obligatoire ? "disabled" : ""}
          title="${p.obligatoire ? "Poste obligatoire" : "Congédier"}">
          ${p.obligatoire ? "requis" : "congédier"}</button>
      </div>`;
    }).join("")}

    <div class="groupe">Embaucher</div>
    ${POSTES_DISPO.map(p => `
      <button class="eqAdd" data-embauche="${p.c}">
        <span class="eqNom"><b>${p.n}</b><small>${p.d}</small></span>
        <span class="eqPlus">+ ${eur(p.s)}<i>par jour</i></span>
      </button>`).join("")}`;

  $("eqCorps").querySelectorAll("[data-embauche]").forEach(b =>

      dit("Embauché.");
      await rafraichit(true);

  $("eqCorps").querySelectorAll("[data-vire]").forEach(b =>

      b.disabled = true;
      const r = await congedier(b.dataset.vire);
      if(r.erreur){ dit(messageErreurV2(r), true); b.disabled = false; return; }
      dit("C'est fait.");
      await rafraichit(true);
      ouvreEquipe();
    }));
}

/* ============================================================
   LA GRILLE TARIFAIRE

   Cinq tarifs, révisables une fois toutes les deux semaines. Le
   prix moyen n'est pas un réglage : il naît du mélange des
   publics du quartier. On le montre pendant qu'on bouge les
   curseurs, pour que la conséquence soit visible avant de
   valider.
   ============================================================ */
const PUBLICS = [
  {c:"plein",    n:"Plein tarif", hint:"26 à 59 ans",  sens:"faible"},
  {c:"etudiant", n:"Étudiant",    hint:"moins de 26 ans", sens:"très forte"},
  {c:"senior",   n:"Senior",      hint:"60 ans et plus",  sens:"forte"},
  {c:"enfant",   n:"Enfant",      hint:"moins de 14 ans", sens:"forte"},
  {c:"matinee",  n:"Matinée",     hint:"avant 13 h",      sens:"très forte"}
];
let brouillon = null;

function ouvreTarifs(){
  const t = etat.tarifs || {};
  if(!t.revisable){
    dit(`Vos tarifs sont fixés jusqu'au jour ${t.revisable_au_jour}.`, true);
    return;
  }
  brouillon = {plein:+t.plein, etudiant:+t.etudiant, senior:+t.senior,
               enfant:+t.enfant, matinee:+t.matinee};
  $("panTarifs").classList.add("ouvert");
  rendTarifs();
}

function rendTarifs(){
  $("tarifsListe").innerHTML = PUBLICS.map(p => `
    <div class="tarif">
      <div class="tTete"><div class="g"><div class="nm">${p.n}</div>
        <div class="part">${p.hint} · sensibilité ${p.sens}</div></div>
        <div class="px" id="px_${p.c}">${fmt(brouillon[p.c])}</div></div>
      <input type="range" min="4" max="20" step="0.5" value="${brouillon[p.c]}"
        data-t="${p.c}">
    </div>`).join("");
  $("tarifsListe").querySelectorAll("[data-t]").forEach(i =>
    i.addEventListener("input", () => {
      brouillon[i.dataset.t] = parseFloat(i.value);
      $("px_" + i.dataset.t).textContent = fmt(brouillon[i.dataset.t]);
      majApercuTarifs();
    }));
  majApercuTarifs();
}

/* les parts du quartier, pour montrer le prix moyen sans
   solliciter le serveur à chaque mouvement de curseur */
const PARTS = {
  quartier_populaire: {plein:.34, etudiant:.22, senior:.18, enfant:.26},
  quartier_etudiant:  {plein:.26, etudiant:.48, senior:.10, enfant:.16},
  quartier_bourgeois: {plein:.52, etudiant:.14, senior:.24, enfant:.10},
  quartier_familial:  {plein:.38, etudiant:.12, senior:.16, enfant:.34}
};
function majApercuTarifs(){
  const parts = PARTS[etat.cinema.quartier] || PARTS.quartier_populaire;
  let moyen = 0;
  for(const k in parts) moyen += brouillon[k] * parts[k];
  const actuel = Number(etat.tarifs?.prix_moyen || 0);
  const d = moyen - actuel;
  $("tApercu").innerHTML = `
    <div class="tAp"><b>${fmt(moyen)}</b><span>prix moyen</span></div>
    <div class="tAp"><b>${fmt(brouillon.matinee)}</b><span>en matinée</span></div>
    <div class="tAp"><b class="${d >= 0 ? "" : "v"}">${d >= 0 ? "+" : "−"}${
      fmt(Math.abs(d))}</b><span>écart</span></div>`;
}

async function validerTarifs(){
  const b = $("tValider");
  b.disabled = true; b.textContent = "On affiche les nouveaux prix…";
  const r = await reviserTarifs(brouillon);
  if(r.erreur){
    dit(messageErreurV2(r), true);
    b.disabled = false; b.textContent = "Valider pour quinze jours";
    return;
  }
  ferme("panTarifs");
  dit(`Grille validée · prix moyen ${fmt(r.data.prix_moyen_soiree)}`);
  await rafraichit(true);
  b.disabled = false; b.textContent = "Valider pour quinze jours";
}

function ferme(id){
  const p = $(id);
  p.classList.remove("ouvert");
}

async function agit(fn){
  const r = await fn();

  return true;
}

async function remplitCompte(){
  const [d, sl, ec, hi] = await Promise.all([
    decompteEtoiles(), seuilRentabilite(), echeances(), historique(30).catch(() => [])
  ]);
  if(d.ok) rendEtoiles(d.data);
  if(sl.ok) rendSeuil(sl.data);
  const j = Array.isArray(hi) ? hi : [];
  rendCourbe(j);
  if(j.length){
    const v = Number(j[0].resultat || 0);
    $("kSous").textContent = `jour ${etat.cinema.jour} · hier ${
      v >= 0 ? "+" : "−"}${eur(Math.abs(v))} · ${j[0].spectateurs} spectateurs`;
  } else {
    $("kSous").textContent = `jour ${etat.cinema.jour} · aucune journée jouée`;
  }
  if(ec.ok) rendEcheances(ec.data || []);
}

/* ── le seuil de rentabilité ── */
function rendSeuil(s){
  const el = $("blocSeuil"); if(!el) return;
  const capa = Math.max(1, s.capacite_jour);
  const attendus = prevision?.spectateurs ?? null;
  const pS = Math.min(100, s.seuil / capa * 100);
  const pA = attendus == null ? null : Math.min(100, attendus / capa * 100);

  el.innerHTML = `
    <div class="blocT"><b>Il vous faut ${s.seuil} spectateur${s.seuil>1?"s":""}</b>
      <span>par jour</span></div>
    <div class="seuilVis">
      <div class="piste"></div>
      ${pA != null ? `<div class="rempli" style="width:${pA.toFixed(0)}%"></div>` : ""}
      <div class="marque" style="left:${pS.toFixed(0)}%"></div>
      <div class="etiq" style="left:${pS.toFixed(0)}%">seuil</div>
      <div class="bas" style="left:${pS.toFixed(0)}%;color:#7a726a">${s.seuil}</div>
      ${pA != null && Math.abs(pA - pS) > 12
        ? `<div class="bas" style="left:${pA.toFixed(0)}%;color:${

      <b class="r">${eur(s.charges)}</b></div>
    <div class="sLg"><span>Ce que vous gardez par billet<small>après taxes et distributeur (${
      Math.round(s.taux_location_moyen * 100)} %)</small></span>
      <b>${fmt(s.garde_par_billet)}</b></div>
    ${s.marge_confiserie > 0
      ? `<div class="sLg"><span>Marge confiserie par spectateur</span>
          <b>${fmt(s.marge_confiserie)}</b></div>` : ""}
    <div class="sLg"><span>Au-delà du seuil, chaque spectateur rapporte</span>
      <b class="v">${fmt(s.marge_par_spectateur)}</b></div>`;
}

/* ── la courbe des trente jours ── */
function rendCourbe(h){
  const el = $("blocCourbe"); if(!el) return;
  const j = h.slice().reverse();
  if(j.length < 2){
    el.innerHTML = `<div class="blocT"><b>Trésorerie</b><span>—</span></div>
      <div class="cVide">Ouvrez quelques journées et votre courbe apparaîtra ici.</div>`;
    return;
  }
  /* on reconstitue la trésorerie à rebours depuis aujourd'hui */
  const fin = Number(etat.cinema.tresorerie);
  const vals = [];
  let v = fin;
  for(let i = j.length - 1; i >= 0; i--){ vals.unshift(v); v -= Number(j[i].resultat || 0); }
  vals.unshift(v);

  const mx = Math.max(...vals), mn = Math.min(...vals);
  const X = i => i / (vals.length - 1) * 300;
  const Y = x => 140 - (x - mn) / Math.max(1, mx - mn) * 117 - 11;
  let d = `M${X(0).toFixed(1)} ${Y(vals[0]).toFixed(1)}`;
  for(let i = 0; i < vals.length - 1; i++){
    const x0 = X(i), y0 = Y(vals[i]), x1 = X(i+1), y1 = Y(vals[i+1]), cx = (x0+x1)/2;
    d += ` C${cx.toFixed(1)} ${y0.toFixed(1)} ${cx.toFixed(1)} ${y1.toFixed(1)} ${x1.toFixed(1)} ${y1.toFixed(1)}`;
  }
  /* les creux : une chute forte d'un jour à l'autre est un achat */
  const creux = [];
  for(let i = 1; i < vals.length; i++)
    if(vals[i] < vals[i-1] * 0.82) creux.push(i);

  const spect = j.reduce((t,x) => t + (x.spectateurs||0), 0) / j.length;
  const res = j.reduce((t,x) => t + Number(x.resultat||0), 0) / j.length;
  const capa = (etat.salles||[]).reduce((t,x)=>t+x.places,0) * 5;

  el.innerHTML = `
    <div class="blocT"><b>Trésorerie</b><span>${j.length} journée${j.length>1?"s":""} jouée${
      j.length>1?"s":""}</span></div>
    <div class="grand">
      <svg viewBox="0 0 300 140" preserveAspectRatio="none">
        <defs><linearGradient id="gcpt" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#caa24a" stop-opacity=".26"/>
          <stop offset="1" stop-color="#caa24a" stop-opacity="0"/></linearGradient></defs>
        <g stroke="#efe8dc" stroke-width="1" vector-effect="non-scaling-stroke">
          <line x1="0" y1="35" x2="300" y2="35"/><line x1="0" y1="70" x2="300" y2="70"/>
          <line x1="0" y1="105" x2="300" y2="105"/></g>
        <path d="${d} L300 140 L0 140 Z" fill="url(#gcpt)"/>
        <path d="${d}" fill="none" stroke="#a8862a" stroke-width="2"
          vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>
        ${creux.map(i => `<circle cx="${X(i).toFixed(1)}" cy="${Y(vals[i]).toFixed(1)}" r="3"
          fill="#fff" stroke="#c05a3a" stroke-width="2"
          vector-effect="non-scaling-stroke"/>`).join("")}
        <circle cx="300" cy="${Y(vals[vals.length-1]).toFixed(1)}" r="4" fill="#a8862a"
          stroke="#fff" stroke-width="2.5" vector-effect="non-scaling-stroke"/>
      </svg>
    </div>
    <div class="grLeg"><span>${eur(vals[0])}</span>
      ${creux.length ? `<span style="color:#c05a3a">● les achats</span>` : "<span></span>"}
      <span>aujourd'hui · ${eur(fin)}</span></div>
    <div class="moy">
      <div class="moyC"><b>${Math.round(spect)}</b><span>spect./jour</span></div>
      <div class="moyC"><b>${capa ? Math.round(spect / capa * 100) : 0} %</b>
        <span>remplissage</span></div>
      <div class="moyC"><b class="${res>=0?"v":"r"}">${res>=0?"+":"−"}${
        eur(Math.abs(res))}</b><span>par jour</span></div>
    </div>`;
}

/* ---------- la programmation ---------- */
async function ouvreCase({salleId, heure, seanceId}){
  const salle = (etat.salles || []).find(s => s.id === salleId);
  if(!salle) return;
  ouvrePanneau({
    salle, heure, seanceId, offre,
    surPoser: async (sortieId, dejaSigne, duree) => {
      if(!dejaSigne){
        const s = await signerLicence(sortieId, duree);
        if(s.erreur){ dit(messageErreurV2(s), true); return; }
      }
      const p = await poserSeance(salleId, sortieId, heure);
      if(p.erreur){ dit(messageErreurV2(p), true); return; }
      dit(`${p.data.titre} à ${heure}`);
      await rafraichit();
    },
    surRetirer: async (id) => {
      const r = await retirerSeance(id);
      if(r.erreur){ dit(messageErreurV2(r), true); return; }
      dit("Créneau libéré.");
      await rafraichit();
    }
  });
}

/* ---------- l'ouverture des portes ---------- */
async function ouvrir(){
  const b = $("btnOuvrir");
  /* rien au programme : le bouton conduit là où l'on programme */
  if(b.dataset.mode === "programmer"){ montre("grille"); return; }
  /* si tout est en chantier, le même bouton fait passer la journée */
  if(b.dataset.mode === "relache"){
    b.disabled = true; b.textContent = "Portes closes…";
    const r = await faireRelache();
    if(r.erreur){ dit(messageErreurV2(r), true); rendBoutonOuvrir(); return; }
    dit(`Relâche · ${Math.round(r.data.charges)} € de charges`);
    await rafraichit();
    return;
  }
  b.disabled = true; b.textContent = "La séance commence…";
  /* la journée qu'on vient de clore : c'est elle que le bilan
     détaillera, pas celle qui commence */
  const journeeClose = V2.journeeId;
  const r = await ouvrirLesPortes();
  if(r.erreur){ dit(messageErreurV2(r), true); rendBoutonOuvrir(); return; }
  sessionStorage.setItem("v2_bilan", JSON.stringify(r.data));
  if(journeeClose) sessionStorage.setItem("v2_journee", journeeClose);
  location.href = "v2-bilan.html";
}

/* ---------- navigation ---------- */
/* La barre ne se contente pas de ranger : elle signale. Un
   créneau libre, une nouveauté du jour, une salle sale — on sait
   où aller sans y aller. */
function alertesBarre(){
  const a = {};
  /* La grille n'appelle qu'une chose : rien n'est programmé et
     la journée attend. Compter les créneaux vides n'apprenait
     rien — un cinéma n'a pas vocation à remplir ses cinq
     créneaux tous les jours. */
  const salles = (etat.salles || []).filter(s => !s.en_travaux);
  if(salles.length && (prevision?.seances || []).length === 0) a.grille = true;

  const nouv = (offre?.nouveautes || []).filter(f => f.jours_avant === 0).length;
  if(nouv > 0) a.films = nouv;

  const sales = (etat.salles || []).filter(s => s.proprete < 55 || s.etat < 55).length;
  if(sales > 0) a.salles = sales;

  if(etat.cinema.tresorerie < 0) a.compte = true;
  return a;
}

function rendBarre(){
  rendBarreNav($("nav"), vue, alertesBarre());
  $("nav").querySelectorAll("button[data-v]").forEach(b =>
    b.addEventListener("click", () => montre(b.dataset.v)));
}

function montre(v){
  vue = v;
  for(const s of document.querySelectorAll(".vue")) s.classList.add("masque");
  $("vue" + v[0].toUpperCase() + v.slice(1)).classList.remove("masque");
  rendBarre();
  document.body.classList.toggle("sombre", v === "cinema");
  if(v === "cinema") refaitFacade();
}

/* ---------- rafraîchissement ---------- */
let facadeFaite = false;
function refaitFacade(){
  if(!etat) return;
  const seances = (prevision?.seances || []).map(s => ({
    heure: s.heure, titre: s.titre, genre: s.genre
  }));
  rendFacade($("scene"), etat, seances);
  facadeFaite = true;
}

async function rafraichit(sansOffre){
  etat = await chargeEtat();
  if(!etat) return;
  prevision = await previsionJournee();
  peut = (await peutOuvrir()).data || null;
  if(!sansOffre) offre = await chargeOffre();

  /* Chaque vue se dessine dans son propre filet : si l'une casse,
     les autres restent lisibles. Sans ça, une erreur dans le
     catalogue laisse aussi les salles et le compte vides, et on
     cherche la panne au mauvais endroit. */
  const dessine = (nom, fn) => {
    try{ fn(); }
    catch(e){ console.error("[Séance v2] rendu " + nom, e); }
  };
  dessine("entete",    rendEntete);
  dessine("alertes",   rendAlertes);
  dessine("ouvrir",    rendBoutonOuvrir);
  dessine("resume",    () => rendResume($("gResume"), prevision));
  dessine("grille",    () => rendGrille($("grille"), etat, prevision, ouvreCase));
  dessine("pied",      () => rendPiedGrille($("gPied"), prevision, peut, ouvrir));
  dessine("catalogue", () => rendCatalogue($("catalogue"), offre, onglet, signer));
  dessine("salles",    rendSalles);
  dessine("compte",    rendCompte);
  dessine("barre",     rendBarre);
  $("gJour").textContent = "jour " + etat.cinema.jour;
  $("fSousTitre").textContent = `jour ${etat.cinema.jour} · `
    + `${Number(etat.cinema.etoiles).toFixed(1).replace(".",",")} étoiles`;
  if(vue === "cinema") refaitFacade();
}

async function signer(sortieId, duree){
  const r = await signerLicence(sortieId, duree);
  if(r.erreur){ dit(messageErreurV2(r), true); return; }
  dit(`${r.data.titre} · licence signée`);
  await rafraichit();
}

/* ---------- démarrage ---------- */
(async function(){
  try{
    const c = await monCinema();
    if(!c){ location.replace("v2-nouveau.html"); return; }
    tarifsEq = await chargeTarifsEquipement().catch(() => null);
    /* on remet le monde à l'heure avant d'afficher quoi que ce soit */
    await synchronise().catch(() => null);
    await rafraichit();

    $("cOnglets").querySelectorAll("button").forEach(b =>
      b.addEventListener("click", () => {
        onglet = b.dataset.o;
        $("cOnglets").querySelectorAll("button").forEach(x =>
          x.classList.toggle("on", x === b));
        rendCatalogue($("catalogue"), offre, onglet, signer);
        $("catalogue").scrollTo({left:0, behavior:"smooth"});
      }));
    $("btnOuvrir").addEventListener("click", ouvrir);
    document.querySelectorAll("[data-ferme]").forEach(b =>
      b.addEventListener("click", () => ferme(b.dataset.ferme)));
    /* toucher le voile ferme aussi : c'est le geste attendu */
    for(const id of ["panConstruire", "panTarifs", "panEquipe"]){
      $(id).addEventListener("click", e => { if(e.target === $(id)) ferme(id); });
    }
    $("tValider").addEventListener("click", validerTarifs);
    surveilleTaille($("scene"), refaitFacade);
    document.body.classList.add("sombre");
  }catch(e){
    console.error("[Séance v2]", e);
    dit("Impossible de joindre le serveur.", true);
  }finally{
    const v = $("chg");
    v.classList.add("sorti");
    setTimeout(() => v.remove(), 300);
  }
})();
</script>
