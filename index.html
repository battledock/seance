<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Séance — faites vivre votre cinéma</title>
<meta name="description" content="Séance — un jeu de gestion de cinéma de quartier.
  Programmez vos films, remplissez la salle, faites vivre votre cinéma.">
<meta name="theme-color" content="#7c1424">
<meta property="og:type" content="website">
<meta property="og:title" content="Séance">
<meta property="og:description" content="Soixante places, un projecteur qui chauffe,
  et un public à convaincre chaque soir.">
<meta property="og:locale" content="fr_FR">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Outfit:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --or:#c9982f; --orClair:#f0d89a; --orSombre:#8a6c2a;
  --encre:#1a120c; --texte:#4a3a2c; --gris:#665a42;
  --ivoire:#fdfcf9; --papier:#f6f2e9;
  --velours:#8c2331; --veloursF:#5a0e1a; --veloursO:#7c1424;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

/* ─────────────────────────────────────────────────────────
   CONFORT TACTILE

   Sur cette page on fait glisser des volets au doigt : le
   navigateur interprète volontiers un geste un peu vif comme
   une sélection de texte ou un double-tap de zoom.

   · touch-action:manipulation supprime le zoom du double-tap
     sans toucher au pincement, qui reste disponible pour qui
     en a besoin.
   · la sélection est coupée sur le décor et les libellés,
     mais laissée intacte sur les champs de saisie — sinon on
     ne peut plus corriger son email.
   ───────────────────────────────────────────────────────── */
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
body{
  margin:0;background:#e6e0d4;color:#1a1210;
  font-family:'Outfit',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;min-height:100dvh;
  display:flex;align-items:center;justify-content:center;
  padding:20px;
}

/* ------------------------------------------------------------
   LA CARTE POSTALE

   Une photo du cinéma, le titre, une phrase, deux boutons.
   Le fond clair est celui du reste du jeu ; le léger biais et
   l'ombre portée suffisent à évoquer l'objet posé sur une table.
   ------------------------------------------------------------ */
.scene{width:100%;max-width:360px}

.carte{
  background:#fdfaf3;border-radius:5px;
  padding:15px 15px 17px;
  box-shadow:0 14px 34px rgba(40,26,20,.24), 0 2px 5px rgba(40,26,20,.1);
  transform:rotate(-1.1deg);
  animation:poseCarte .6s cubic-bezier(.2,.9,.3,1) both;
}
@keyframes poseCarte{
  from{opacity:0;transform:translateY(20px) rotate(-3deg)}
  to{opacity:1;transform:rotate(-1.1deg)}
}

.cpImage{height:196px;border-radius:2px;overflow:hidden;position:relative;background:#c8dce4}
.cpImage svg{width:100%;height:100%;display:block}

.cpTitre{
  font-family:'Marcellus',Georgia,serif;font-weight:400;
  font-size:30px;letter-spacing:.2em;text-indent:.2em;
  color:#1a1210;text-align:center;margin:16px 0 0;
}
.cpMot{
  font-size:11.5px;color:#6a5f56;line-height:1.65;text-align:center;
  margin-top:9px;font-style:italic;
}
.cpTrait{height:1px;background:#e6ded0;margin:15px 0 13px}

.btnJouer{
  width:100%;padding:15px;border:none;border-radius:11px;cursor:pointer;
  background:#8a1c2c;color:#ffeec4;
  font-family:'Marcellus',Georgia,serif;font-size:14.5px;letter-spacing:.1em;
  box-shadow:0 3px 12px rgba(138,28,44,.24);
}
.btnJouer:active{transform:translateY(1px);box-shadow:0 1px 6px rgba(138,28,44,.24)}

.lien{
  display:block;width:100%;margin-top:8px;padding:13px;
  background:#fff;border:1px solid #ddd2c4;border-radius:11px;cursor:pointer;
  font-family:'Outfit',system-ui,sans-serif;font-size:12.5px;color:#5a5048;
}
.lien:active{background:#faf7f2}

.mention{
  text-align:center;font-size:9px;color:#b0a494;
  margin-top:11px;letter-spacing:.05em;
}

@media (max-height:640px){
  .cpImage{height:150px}
  .cpTitre{font-size:26px;margin-top:13px}
}

.voileAuth{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;
  background:rgba(20,12,10,.55);animation:paraitre .25s ease-out}
@keyframes paraitre{from{opacity:0}to{opacity:1}}
.feuille{width:100%;max-width:520px;margin:0 auto;max-height:92dvh;overflow-y:auto;
  border-radius:20px 20px 0 0;background:var(--ivoire);border-top:3px solid var(--or);
  padding:14px 20px calc(22px + env(safe-area-inset-bottom));
  animation:monte .34s cubic-bezier(.2,1,.3,1)}
@keyframes monte{from{transform:translateY(100%)}to{transform:none}}
.poignee{width:40px;height:4px;border-radius:2px;background:rgba(36,26,18,.18);margin:0 auto 16px}
.feuille h3{font-family:'Marcellus',serif;font-size:21px;letter-spacing:.05em;color:var(--encre);
  text-align:center}
.bobMot{display:flex;gap:11px;align-items:flex-start;margin-top:14px;padding:12px 13px;
  border-radius:12px;background:rgba(140,35,49,.05);border:1px solid rgba(140,35,49,.14)}
.bobTete{flex:none;width:42px;height:42px;border-radius:50%;overflow:hidden;background:#f7ecd6;
  border:2px solid var(--orSombre)}
.bobTete svg{width:100%;height:100%;display:block}
.bobMot p{font-family:Georgia,serif;font-size:12.5px;line-height:1.5;font-style:italic;
  color:#3a2a1c;padding-top:2px}
.champ{margin-top:12px}
.champ label{display:block;font-size:9.5px;font-weight:300;letter-spacing:.16em;
  text-transform:uppercase;color:var(--gris);margin-bottom:5px}
.champ input{width:100%;padding:15px 14px;border-radius:12px;font-size:16px;
  font-family:'Outfit',system-ui,sans-serif;color:var(--encre);background:#fff;
  border:1.5px solid rgba(36,26,18,.16);transition:border-color .2s,box-shadow .2s}
.champ input:focus{outline:none;border-color:var(--or);
  box-shadow:0 0 0 3px rgba(201,152,47,.18)}
.btnAuth{width:100%;margin-top:18px;padding:17px;border:none;border-radius:14px;cursor:pointer;
  background:linear-gradient(180deg,#ffe89a,#c9982f);color:#2a1704;font-family:'Marcellus',serif;
  font-size:16px;letter-spacing:.12em;text-transform:uppercase;
  box-shadow:0 5px 0 var(--orSombre),0 10px 22px rgba(138,108,42,.28)}
.btnAuth:active{transform:translateY(4px);box-shadow:0 1px 0 var(--orSombre)}
.btnAuth:disabled{opacity:.5;box-shadow:none;transform:none}
.bascule{display:block;width:100%;margin-top:10px;padding:12px;background:none;border:none;
  cursor:pointer;color:var(--gris);font-size:12.5px;font-weight:300;text-decoration:underline}
.fermerAuth{position:absolute;top:10px;right:14px;width:34px;height:34px;border-radius:50%;
  border:none;background:rgba(36,26,18,.07);color:var(--gris);font-size:17px;cursor:pointer}
.feuille{position:relative}
.fondu{transition:opacity .8s;opacity:1}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-height:640px){
  
  
  
  
  
}
</style>
</head>
<body>

<div class="scene">
  <!-- ------------------------------------------------------------
       LA CARTE POSTALE

       L'entrée était une scène de théâtre : lambrequin, rideaux de
       velours, enseigne à ampoules. Beaucoup de décor pour une page
       dont le rôle est d'expliquer le jeu en trois secondes.

       On la remplace par une carte postale : une photo du cinéma,
       le titre, une phrase manuscrite, deux boutons. Fond clair,
       comme le reste du jeu depuis la refonte.
       ------------------------------------------------------------ -->
  <div class="carte">
    <div class="cpImage">
      <svg viewBox="0 0 260 132" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
        <defs>
          <linearGradient id="cpCiel" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#8ec0d8"/><stop offset=".62" stop-color="#c8dce4"/>
            <stop offset="1" stop-color="#e2dac6"/></linearGradient>
          <linearGradient id="cpMur" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#f2e8d6"/><stop offset="1" stop-color="#e0d5c0"/></linearGradient>
          <radialGradient id="cpHalo" cx=".5" cy=".5" r=".5">
            <stop offset="0" stop-color="#f0c96a" stop-opacity=".42"/>
            <stop offset="1" stop-color="#f0c96a" stop-opacity="0"/></radialGradient>
        </defs>
        <rect width="260" height="132" fill="url(#cpCiel)"/>
        <g fill="#fff" opacity=".5">
          <ellipse cx="46" cy="26" rx="26" ry="9"/><ellipse cx="58" cy="21" rx="17" ry="8"/>
          <ellipse cx="208" cy="18" rx="22" ry="8"/></g>
        <rect x="0" y="84" width="260" height="48" fill="#d8cdb8"/>
        <rect x="10" y="40" width="54" height="48" fill="#e6dbc8"/>
        <rect x="196" y="36" width="54" height="52" fill="#e6dbc8"/>
        <g fill="#cbbea7">
          <rect x="18" y="48" width="9" height="11"/><rect x="34" y="48" width="9" height="11"/>
          <rect x="18" y="65" width="9" height="11"/><rect x="34" y="65" width="9" height="11"/>
          <rect x="205" y="44" width="9" height="11"/><rect x="221" y="44" width="9" height="11"/>
          <rect x="205" y="61" width="9" height="11"/><rect x="221" y="61" width="9" height="11"/></g>
        <rect x="62" y="28" width="136" height="60" fill="url(#cpMur)"/>
        <rect x="62" y="24" width="136" height="6" rx="1.5" fill="#d6c9b4"/>
        <ellipse cx="130" cy="44" rx="72" ry="22" fill="url(#cpHalo)"/>
        <rect x="76" y="34" width="108" height="20" rx="2" fill="#2a1810"/>
        <rect x="76" y="34" width="108" height="20" rx="2" fill="none"
          stroke="#caa24a" stroke-width="1.6"/>
        <text x="130" y="48" text-anchor="middle" font-family="Marcellus,Georgia,serif"
          font-size="10" fill="#ffeec4" letter-spacing="3.4">CINÉMA</text>
        <g fill="#e8b94a">
          <circle cx="84" cy="31" r="1.5"/><circle cx="99" cy="31" r="1.5"/>
          <circle cx="114" cy="31" r="1.5"/><circle cx="130" cy="31" r="1.5"/>
          <circle cx="146" cy="31" r="1.5"/><circle cx="161" cy="31" r="1.5"/>
          <circle cx="176" cy="31" r="1.5"/></g>
        <rect x="68" y="60" width="124" height="5" rx="1.5" fill="#c9a24a" opacity=".5"/>
        <rect x="76" y="68" width="22" height="20" fill="#c8bba6"/>
        <rect x="118" y="66" width="24" height="22" fill="#8a1c2c" opacity=".78"/>
        <rect x="162" y="68" width="22" height="20" fill="#c8bba6"/>
        <g fill="#b8a890"><circle cx="56" cy="70" r="2.6"/><circle cx="204" cy="70" r="2.6"/></g>
      </svg>
    </div>

    <h1 class="cpTitre">Séance</h1>
    <p class="cpMot">« Il y a un vieux cinéma au bout de la rue.<br>
      Personne n'y va plus. Tu devrais le voir. »</p>

    <div class="cpTrait"></div>

    <button class="btnJouer">Ouvrir mon cinéma</button>
    <button class="lien">J'ai déjà un cinéma</button>
    <div class="mention">Gratuit · sans installation</div>
  </div>
</div>

<script>
/* ═══════════ les quatre vignettes ═══════════ */




/* Le carrousel de volets et ses quatre illustrations vivaient ici.
   La carte postale dit la même chose en un écran : plus rien à faire
   défiler, plus de points de pagination à synchroniser. */

/* ═══════════ L'IDENTIFICATION ═══════════ */
const SB_URL = "https://zpfkekiavlfphialvphi.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpwZmtla2lhdmxmcGhpYWx2cGhpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3Mjc4MzIsImV4cCI6MjEwMTMwMzgzMn0.ORa4y_AMjuWbxboKm3o6Jn7ryYjkOm4mSgLa2Schv98";
const REPLIQUES = {
  accueil:[
    "Éteins ton téléphone ! …Ah non, c'est toi le téléphone. Bon, remplis la fiche alors.",
    "Bienvenue dans MA salle. Choisis un fauteuil. Pas le 12. Le 12 sait ce qu'il a fait.",
    "T'arrives pile pour l'avant-programme : moi. Quarante secondes de gloire, profite."
  ],
  connexion:"Un habitué ! J'ai gardé ta place au chaud. Enfin, le chauffage est en panne, mais l'intention y est.",
  inscription:"Un NOUVEAU gérant ! La salle t'appartiendra. Le balcon aussi. Enfin, quand il sera réparé. Un jour.",
  emailFocus:"Ton email. Promis, je m'en sers que pour les urgences. Genre quand je perds la bobine. Littéralement.",
  mdpFocus:"Ton secret. Le mien ? Le « son mono d'époque », c'est juste que l'enceinte droite est morte.",
  pseudoFocus:"Réfléchis : ce nom sera projeté en ouverture. En très grand. Mes fautes de frappe aussi.",
  verif:"Je vérifie dans le grand cahier… il est dans la cabine… attends, je remonte l'escalier…",
  impression:"J'imprime ton billet depuis la cabine ! Si tu entends un bruit de mobylette, tout va bien.",
  refuse:"Coupez ! C'est pas les bons identifiants. On la refait, et cette fois avec conviction.",
  dejaLa:"Mais je te CONNAIS toi ! Passe par « J'ai ma carte », petit comédien.",
  courtMdp:"6 caractères minimum. Mon code de coffre est plus long. C'est 000000, mais y'a de l'intention.",
  vide:"Faut remplir la fiche ! Une séance sans billet, c'est du cinéma en plein air. Et il pleut.",
  confirme:"Billet réservé ! Va confirmer ton email. Je lance pas le film sans toi. J'ai que toi.",
  bienvenue:"Billet validé ! Silence dans la salle… noir… PROJECTION !",
  reseau:"Le réseau est en panne. Comme le projecteur en 1987. On s'en est remis. Enfin, presque."
};

const teteBob = `<svg viewBox="30 40 60 60" aria-hidden="true">
  <circle cx="60" cy="70" r="26" fill="#f0c9a0"/>
  <path d="M40 78 Q50 86 60 79 Q70 86 80 78 Q72 92 60 84 Q48 92 40 78" fill="#4a3527"/>
  <path d="M44 60 Q51 55 57 59 M63 59 Q69 55 76 60" stroke="#4a3527" stroke-width="4"
    fill="none" stroke-linecap="round"/>
  <circle cx="51" cy="66" r="2.6" fill="#1c1210"/><circle cx="69" cy="66" r="2.6" fill="#1c1210"/>
  <path d="M34 56 Q60 34 86 56 L86 50 Q60 28 34 50 Z" fill="#571520"/>
  <rect x="52" y="44" width="16" height="7" rx="2" fill="#e8b84b"/></svg>`;

let mode = "inscription", voile = null;

function parle(t){
  const p = document.getElementById("motBob");
  if(p) p.textContent = t;
}

function ouvreAuth(m){
  mode = m;
  const inscrit = mode === "inscription";
  voile = document.createElement("div");
  voile.className = "voileAuth";
  voile.innerHTML = `<div class="feuille">
    <button class="fermerAuth" id="fermerAuth" aria-label="Fermer">✕</button>
    <div class="poignee"></div>
    <h3>${inscrit ? "Ouvrir ton cinéma" : "Te reconnecter"}</h3>

    <div class="bobMot"><span class="bobTete">${teteBob}</span>
      <p id="motBob">${inscrit ? REPLIQUES.inscription : REPLIQUES.connexion}</p></div>

    ${inscrit ? `<div class="champ"><label for="pseudo">Ton nom de gérant</label>
      <input id="pseudo" type="text" autocomplete="nickname" maxlength="24"
        placeholder="Eliasse"></div>` : ""}

    <div class="champ"><label for="email">Adresse email</label>
      <input id="email" type="email" autocomplete="email" inputmode="email"
        placeholder="toi@exemple.fr"></div>

    <div class="champ"><label for="mdp">Mot de passe</label>
      <input id="mdp" type="password" placeholder="six caractères au minimum"
        autocomplete="${inscrit ? "new-password" : "current-password"}"></div>

    <button class="btnAuth" id="btnAuth">${inscrit ? "Ouvrir le cinéma" : "Entrer"}</button>
    <button class="bascule" id="bascule">${inscrit
      ? "J'ai déjà un cinéma · me reconnecter"
      : "Je n'ai pas encore de cinéma · en ouvrir un"}</button>
  </div>`;
  document.body.appendChild(voile);

  voile.addEventListener("click", e=>{ if(e.target === voile) fermeAuth(); });
  document.getElementById("fermerAuth").onclick = fermeAuth;
  document.getElementById("bascule").onclick = ()=>{
    fermeAuth(); ouvreAuth(inscrit ? "connexion" : "inscription");
  };
  document.getElementById("btnAuth").onclick = envoie;

  /* Bob commente les champs, comme avant */
  const e = document.getElementById("email");
  const m2 = document.getElementById("mdp");
  const p = document.getElementById("pseudo");
  if(e) e.onfocus = ()=>parle(REPLIQUES.emailFocus);
  if(m2) m2.onfocus = ()=>parle(REPLIQUES.mdpFocus);
  if(p) p.onfocus = ()=>parle(REPLIQUES.pseudoFocus);
  [e, m2, p].forEach(ch=>{ if(ch) ch.addEventListener("keydown", ev=>{
    if(ev.key === "Enter") envoie(); }); });
  setTimeout(()=>{ (p || e).focus(); }, 340);
}

function fermeAuth(){ if(voile){ voile.remove(); voile = null; } }

async function envoie(){
  const inscrit = mode === "inscription";
  const email = (document.getElementById("email").value || "").trim();
  const mdp = document.getElementById("mdp").value || "";
  const pseudo = inscrit ? (document.getElementById("pseudo").value || "").trim() : "";
  const btn = document.getElementById("btnAuth");

  if(!email || !mdp || (inscrit && !pseudo)){ parle(REPLIQUES.vide); return; }
  if(mdp.length < 6){ parle(REPLIQUES.courtMdp); return; }

  btn.disabled = true;
  parle(inscrit ? REPLIQUES.impression : REPLIQUES.verif);

  const endpoint = SB_URL + (inscrit ? "/auth/v1/signup" : "/auth/v1/token?grant_type=password");
  const corps = inscrit ? {email, password: mdp, data:{pseudo}} : {email, password: mdp};

  try{
    const rep = await fetch(endpoint, {method:"POST",
      headers:{"Content-Type":"application/json","apikey":SB_KEY},
      body:JSON.stringify(corps)});
    const data = await rep.json();

    if(!rep.ok){
      const err = (data.error_description || data.msg || "").toLowerCase();
      if(err.includes("invalid login")) parle(REPLIQUES.refuse);
      else if(err.includes("already registered")) parle(REPLIQUES.dejaLa);
      else parle("La machine dit : « " + (data.error_description || data.msg || rep.status)
                 + " ». J'y comprends rien non plus, elle est belge.");
      btn.disabled = false;
      return;
    }

    if(data.access_token){
      localStorage.setItem("rex_session", JSON.stringify({
        access_token: data.access_token,
        refresh_token: data.refresh_token,
        user_id: data.user?.id,
        pseudo: data.user?.user_metadata?.pseudo || pseudo || ""
      }));
      /* Le jeu a été refondu : plus de chargement intermédiaire, on
         entre directement. v2.html renvoie lui-même vers la création
         si le joueur n'a pas encore de cinéma. */
      localStorage.setItem("rex_dest", "v2.html");
      parle(REPLIQUES.bienvenue);
      setTimeout(()=>{
        document.body.classList.add("fondu");
        document.body.style.opacity = "0";
        setTimeout(()=>{ location.href = "v2.html"; }, 820);
      }, 700);
      return;
    }
    /* inscription sans jeton : l'email doit être confirmé */
    parle(REPLIQUES.confirme);
    btn.disabled = false;
  }catch(err){
    parle(REPLIQUES.reseau);
    btn.disabled = false;
  }
}

document.querySelector(".btnJouer").onclick = ()=>ouvreAuth("inscription");
document.querySelector(".lien").onclick = ()=>ouvreAuth("connexion");

/* déjà connecté : on file directement à la projection */
if(localStorage.getItem("rex_session")) location.href = "v2.html";

</script>
</body>
</html>
