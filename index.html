<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --nuit:#050d16;
  --eau:#0a1c2e;
  --quai:#122b42;
  --acier:#1e3d59;
  --brume:#7fa3c0;
  --sable:#e8e2d4;
  --ocre:#e0913a;
  --ocre-fonce:#a3611f;
  --rouille:#c1502e;
  --erreur:#e05c4a;
  --ok:#4fb286;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--nuit);
  color:var(--sable);
  font-family:'Barlow',system-ui,sans-serif;
  overflow-x:hidden;
  overscroll-behavior:none;
}

/* ---------- FOND ---------- */
#fond{
  position:fixed;inset:0;
  width:100%;height:100%;
  z-index:0;
  pointer-events:none;
}
#fond svg{width:100%;height:100%;display:block}

.voile{
  position:fixed;inset:0;z-index:1;pointer-events:none;
  background:
    radial-gradient(120% 60% at 50% 8%, rgba(224,145,58,.10), transparent 60%),
    linear-gradient(180deg, rgba(5,13,22,.15) 0%, rgba(5,13,22,.55) 45%, rgba(5,13,22,.93) 78%, var(--nuit) 100%);
}

/* ---------- STRUCTURE ---------- */
.ecran{
  position:relative;z-index:2;
  min-height:100dvh;
  display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 44px) 24px calc(env(safe-area-inset-bottom) + 28px);
}
.haut{flex:1;display:flex;flex-direction:column;justify-content:flex-start}

.marque{text-align:center}
.marque .sur{
  font-size:10px;letter-spacing:.42em;text-transform:uppercase;
  color:var(--brume);margin-bottom:10px;padding-left:.42em;
}
.marque h1{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(48px,15vw,68px);
  line-height:.88;letter-spacing:.02em;
  color:var(--sable);
}
.marque .sous{
  margin-top:12px;font-size:13px;color:var(--brume);
  letter-spacing:.02em;
}

/* ---------- CARTE ---------- */
.carte{
  margin-top:auto;
  background:rgba(10,24,38,.72);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(127,163,192,.16);
  border-radius:18px;
  padding:6px 20px 22px;
}

.onglets{
  display:flex;gap:4px;
  margin:0 -6px 20px;
  border-bottom:1px solid rgba(127,163,192,.14);
}
.onglet{
  flex:1;background:none;border:0;
  font-family:'Barlow',sans-serif;
  font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  color:var(--brume);
  padding:16px 0 13px;cursor:pointer;
  position:relative;transition:color .2s;
}
.onglet[aria-selected="true"]{color:var(--sable)}
.onglet[aria-selected="true"]::after{
  content:"";position:absolute;left:14%;right:14%;bottom:-1px;
  height:2px;background:var(--ocre);border-radius:2px;
}

.champ{margin-bottom:15px}
.champ label{
  display:block;
  font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--brume);margin-bottom:7px;
}
.boite{position:relative;display:flex;align-items:center}
.champ input{
  width:100%;
  background:rgba(5,13,22,.55);
  border:1px solid rgba(127,163,192,.2);
  border-radius:10px;
  padding:14px 15px;
  font-family:'Barlow',sans-serif;font-size:16px;
  color:var(--sable);
  transition:border-color .2s, background .2s;
}
.champ input::placeholder{color:rgba(127,163,192,.45)}
.champ input:focus{
  outline:none;
  border-color:var(--ocre);
  background:rgba(5,13,22,.8);
}
.champ input:disabled{opacity:.5}
.oeil{
  position:absolute;right:4px;
  background:none;border:0;padding:10px 12px;
  color:var(--brume);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  cursor:pointer;
}

.aide{margin-top:6px;font-size:11px;color:rgba(127,163,192,.7)}

.principal{
  width:100%;
  margin-top:6px;
  background:var(--ocre);
  border:0;border-radius:10px;
  padding:16px;
  font-family:'Barlow',sans-serif;
  font-size:13px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
  color:#1a0f02;
  cursor:pointer;
  transition:transform .12s, background .2s;
}
.principal:active{transform:scale(.985);background:var(--ocre-fonce)}
.principal:disabled{opacity:.55;cursor:default}

.bascule{
  margin-top:16px;text-align:center;
  font-size:13px;color:var(--brume);
}
.bascule button{
  background:none;border:0;padding:0;
  font-family:'Barlow',sans-serif;font-size:13px;font-weight:600;
  color:var(--ocre);cursor:pointer;text-decoration:underline;text-underline-offset:3px;
}

.message{
  display:none;
  margin-bottom:14px;
  padding:11px 13px;border-radius:9px;
  font-size:13px;line-height:1.4;
}
.message.visible{display:block}
.message.erreur{background:rgba(224,92,74,.12);border:1px solid rgba(224,92,74,.35);color:#f0a99f}
.message.ok{background:rgba(79,178,134,.12);border:1px solid rgba(79,178,134,.35);color:#9adcbf}

.pied{
  margin-top:18px;text-align:center;
  font-size:10px;letter-spacing:.2em;text-transform:uppercase;
  color:rgba(127,163,192,.42);
}

.masque{display:none}

/* ---------- ANIMATION ---------- */
@keyframes clignote{0%,42%{opacity:1}50%,92%{opacity:.08}100%{opacity:1}}
@keyframes clignote-lent{0%,60%{opacity:.9}70%,100%{opacity:.15}}
@keyframes houle{0%{transform:translateX(0)}50%{transform:translateX(-14px)}100%{transform:translateX(0)}}
.feu{animation:clignote 4s infinite}
.feu-2{animation:clignote-lent 6.5s infinite}
.vague{animation:houle 9s ease-in-out infinite}
.vague-2{animation:houle 13s ease-in-out infinite reverse}

@media (prefers-reduced-motion:reduce){
  .feu,.feu-2,.vague,.vague-2{animation:none}
}
@media (min-width:520px){
  .ecran{max-width:440px;margin:0 auto}
}
</style>

<main class="ecran">
  <div class="haut">
    <div class="marque">
      <p class="sur">Port de Marseille</p>
      <h1>Battledock</h1>
    </div>
  </div>

  <section class="carte">
    <div class="onglets" role="tablist">
      <button class="onglet" id="ong-inscription" role="tab" aria-selected="true" aria-controls="form-inscription">Inscription</button>
      <button class="onglet" id="ong-connexion" role="tab" aria-selected="false" aria-controls="form-connexion">Connexion</button>
    </div>

    <div class="message" id="message" role="status" aria-live="polite"></div>

    <!-- INSCRIPTION -->
    <div id="form-inscription" role="tabpanel" aria-labelledby="ong-inscription">
      <div class="champ">
        <label for="i-email">Adresse e-mail</label>
        <div class="boite">
          <input type="email" id="i-email" autocomplete="email" inputmode="email" placeholder="ton adresse mail" enterkeyhint="next">

      <div class="champ">
        <label for="i-mdp">Mot de passe</label>
        <div class="boite">
          <input type="password" id="i-mdp" autocomplete="new-password" placeholder="8 caractères minimum" enterkeyhint="go">
          <button type="button" class="oeil" data-cible="i-mdp">Voir</button>

      </div>

      <button class="principal" id="btn-inscription">Continuer</button>

    <!-- CONNEXION -->
    <div id="form-connexion" class="masque" role="tabpanel" aria-labelledby="ong-connexion">
      <div class="champ">
        <label for="c-email">Adresse e-mail</label>
        <div class="boite">
          <input type="email" id="c-email" autocomplete="email" inputmode="email" placeholder="ton adresse mail" enterkeyhint="next">
        </div>
      </div>

      <div class="champ">
        <label for="c-mdp">Mot de passe</label>
        <div class="boite">
          <input type="password" id="c-mdp" autocomplete="current-password" placeholder="••••••••" enterkeyhint="go">
          <button type="button" class="oeil" data-cible="c-mdp">Voir</button>
        </div>
      </div>

      <button class="principal" id="btn-connexion">Continuer</button>

      <p class="bascule">Pas encore embauché ? <button type="button" data-aller="inscription">Créer un compte</button></p>

    <p class="pied">version 1.0 · 09.08.26 · 15h00</p>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="bd.js"></script>
<script>
const SUPABASE_URL = 'https://zpfkekiavlfphialvphi.supabase.co';
const SUPABASE_KEY = 'sb_publishable__dfR2lEOwKjhhtavvJEvGw_KVACZnHP';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = id => document.getElementById(id);

const vues = {
  inscription: { onglet: $('ong-inscription'), form: $('form-inscription') },
  connexion:   { onglet: $('ong-connexion'),   form: $('form-connexion') }
};

function afficher(nom){
  for (const [cle, v] of Object.entries(vues)){
    const actif = cle === nom;
    v.onglet.setAttribute('aria-selected', actif);
    v.form.classList.toggle('masque', !actif);
  }
  cacherMessage();
}

Object.entries(vues).forEach(([cle, v]) => v.onglet.addEventListener('click', () => afficher(cle)));
document.querySelectorAll('[data-aller]').forEach(b =>
  b.addEventListener('click', () => afficher(b.dataset.aller))
);

document.querySelectorAll('.oeil').forEach(b => {
  b.addEventListener('click', () => {
    const champ = $(b.dataset.cible);
    const cache = champ.type === 'password';
    champ.type = cache ? 'text' : 'password';
    b.textContent = cache ? 'Cacher' : 'Voir';
  });
});

const boiteMsg = $('message');
function montrerMessage(texte, type = 'erreur'){
  boiteMsg.textContent = texte;
  boiteMsg.className = 'message visible ' + type;
}
function cacherMessage(){ boiteMsg.className = 'message'; }

const emailValide = v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);

function verifierInscription(){
  const email = $('i-email').value.trim();
  const mdp   = $('i-mdp').value;

  if (!emailValide(email)) return 'Cette adresse e-mail n\u2019est pas valide.';
  if (mdp.length < 8) return 'Le mot de passe fait 8 caractères minimum.';
  return null;
}

function verifierConnexion(){
  const email = $('c-email').value.trim();
  const mdp   = $('c-mdp').value;
  if (!emailValide(email)) return 'Cette adresse e-mail n\u2019est pas valide.';
  if (!mdp) return 'Entre ton mot de passe.';
  return null;
}

const traduire = m => {
  const t = (m || '').toLowerCase();
  if (t.includes('invalid login')) return 'E-mail ou mot de passe incorrect.';
  if (t.includes('already registered') || t.includes('already been registered')) return 'Cette adresse est déjà inscrite. Connecte-toi.';
  if (t.includes('email not confirmed')) return 'Confirme ton e-mail avant de te connecter.';
  if (t.includes('rate limit') || t.includes('too many')) return 'Trop de tentatives. Attends une minute.';
  if (t.includes('password')) return 'Mot de passe refusé : 8 caractères minimum.';
  if (t.includes('failed to fetch') || t.includes('network')) return 'Pas de connexion au serveur. Réessaie.';
  return m || 'Une erreur est survenue. Réessaie.';
};

function occuper(btn, texte){
  btn.dataset.libelle = btn.dataset.libelle || btn.textContent;
  btn.disabled = true;
  btn.textContent = texte;
  btn.closest('[role="tabpanel"]').querySelectorAll('input').forEach(c => c.disabled = true);
}
function liberer(btn){
  btn.disabled = false;
  btn.textContent = btn.dataset.libelle;
  btn.closest('[role="tabpanel"]').querySelectorAll('input').forEach(c => c.disabled = false);
}

$('btn-inscription').addEventListener('click', async () => {
  const erreur = verifierInscription();
  if (erreur) return montrerMessage(erreur);
  cacherMessage();

  const btn = $('btn-inscription');
  occuper(btn, 'Embauche en cours…');
  try {
    const { data, error } = await sb.auth.signUp({
      email: $('i-email').value.trim(),
      password: $('i-mdp').value
    });
    if (error) throw error;

    if (data.session) {
      montrerMessage('Compte créé. Bienvenue sur le quai.', 'ok');
      setTimeout(() => location.href = 'personnage.html', 800);
    } else {
      montrerMessage('Compte créé. Ouvre ton e-mail pour confirmer ton adresse.', 'ok');
      liberer(btn);
    }
  } catch (e) {
    montrerMessage(traduire(e.message));
    liberer(btn);
  }
});

$('btn-connexion').addEventListener('click', async () => {
  const erreur = verifierConnexion();
  if (erreur) return montrerMessage(erreur);
  cacherMessage();

  const btn = $('btn-connexion');
  occuper(btn, 'Connexion…');
  try {
    const { error } = await sb.auth.signInWithPassword({
      email: $('c-email').value.trim(),
      password: $('c-mdp').value
    });
    if (error) throw error;
    montrerMessage('Connexion validée.', 'ok');
    setTimeout(async () => {
      const d = await BD.charger();
      location.href = d && d.pseudo ? (BD.PAGES[d.etape] || 'jeu.html') : 'personnage.html';
    }, 500);
  } catch (e) {
    montrerMessage(traduire(e.message));
    liberer(btn);
  }
});

sb.auth.getSession().then(async ({ data }) => {
  if (data.session){
    const d = await BD.charger();
    location.replace(d && d.pseudo ? (BD.PAGES[d.etape] || 'jeu.html') : 'personnage.html');
  }
});

document.querySelectorAll('input').forEach(champ => {
  champ.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    const form = champ.closest('[role="tabpanel"]');
    const champs = [...form.querySelectorAll('input')];
    const suivant = champs[champs.indexOf(champ) + 1];
    if (suivant) suivant.focus();
    else form.querySelector('.principal').click();
  });
  champ.addEventListener('input', cacherMessage);
});
</script>
</body>
</html>
