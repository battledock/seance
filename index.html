<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#17131f">
<title>Val</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   VAL — l'accueil

   Le décor est peint en pixels, en cinq plans qui ne bougent
   pas à la même vitesse. Tout est calculé à partir de la
   largeur réelle de l'écran : rien n'est figé à 390 px.
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none}
html,body{height:100%;overflow:hidden;background:#17131f;
  font-family:'Outfit',system-ui,sans-serif;color:#f6efe2}
canvas{image-rendering:pixelated;image-rendering:-moz-crisp-edges}

#decor{position:fixed;inset:0;overflow:hidden}
#decor canvas{position:absolute;left:0;top:0;display:block}
/* le fondu qui pose le texte : nul en haut, total en bas */
#voile{position:fixed;inset:0;pointer-events:none;
  background:
    radial-gradient(120% 62% at 50% 8%,rgba(255,214,150,.16),transparent 62%),
    linear-gradient(180deg,rgba(23,19,31,.42) 0%,rgba(23,19,31,0) 22%,
      rgba(23,19,31,.05) 44%,rgba(23,19,31,.68) 70%,#17131f 92%)}

/* ---------------- LA MARQUE ---------------- */
.marque{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top) + 40px);
  text-align:center;z-index:3;padding:0 26px}
.filet{display:flex;align-items:center;justify-content:center;gap:11px;
  color:rgba(246,239,226,.5)}
.filet i{display:block;width:26px;height:1px;background:currentColor;opacity:.6}
.filet span{font-size:9.5px;font-weight:700;letter-spacing:.38em;
  text-transform:uppercase}
.marque h1{margin-top:13px;font-family:'Fraunces',Georgia,serif;font-weight:700;
  font-size:clamp(52px,17vw,78px);line-height:.92;letter-spacing:-.015em;
  color:#fdf7ea;text-shadow:0 2px 0 rgba(58,32,18,.28),0 14px 40px rgba(12,8,20,.55)}
.marque .ss{margin-top:12px;font-size:14.5px;font-weight:500;line-height:1.5;
  color:rgba(246,239,226,.82);text-shadow:0 2px 14px rgba(12,8,20,.7)}

/* ---------------- LA CARTE ---------------- */
.carte{position:fixed;left:0;right:0;bottom:0;z-index:4;
  padding:0 16px calc(env(safe-area-inset-bottom) + 16px)}
.dedans{background:rgba(28,23,38,.72);backdrop-filter:blur(22px) saturate(140%);
  -webkit-backdrop-filter:blur(22px) saturate(140%);
  border:1px solid rgba(255,255,255,.11);border-radius:26px;
  padding:15px 17px 17px;
  box-shadow:0 -1px 0 rgba(255,255,255,.06) inset,0 24px 60px rgba(8,5,14,.6)}

/* les trois chiffres, en frise */
.frise{display:flex;align-items:center;justify-content:center;gap:0;
  margin-bottom:14px}
.frise div{flex:1;text-align:center}
.frise b{display:block;font-family:'Fraunces',Georgia,serif;font-size:19px;
  font-weight:700;color:#f5c96a}
.frise span{display:block;margin-top:1px;font-size:9.5px;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;color:rgba(246,239,226,.46)}
.frise i{width:1px;height:26px;background:rgba(255,255,255,.1)}

.onglets{display:flex;gap:3px;padding:3px;border-radius:13px;
  background:rgba(0,0,0,.28)}
.onglets button{flex:1;padding:11px;border:0;border-radius:10px;background:none;
  color:rgba(246,239,226,.5);font-family:inherit;font-size:13px;font-weight:700;
  cursor:pointer;transition:.2s}
.onglets button[aria-selected="true"]{background:rgba(246,239,226,.11);
  color:#f6efe2;box-shadow:0 1px 0 rgba(255,255,255,.08) inset}

.champ{margin-top:11px}
.champ label{display:block;font-size:10px;font-weight:700;letter-spacing:.15em;
  text-transform:uppercase;color:rgba(246,239,226,.44);margin-bottom:6px}
.boite{display:flex;align-items:center;gap:10px;padding:14px 15px;
  border-radius:14px;background:rgba(0,0,0,.26);
  border:1px solid rgba(255,255,255,.09);transition:.2s}
.boite:focus-within{border-color:rgba(245,201,106,.55);
  box-shadow:0 0 0 3px rgba(245,201,106,.13)}
.boite canvas{width:16px;height:16px;flex:0 0 16px;opacity:.75}
.boite input{flex:1;min-width:0;border:0;background:none;color:#f6efe2;
  font-family:inherit;font-size:15px;font-weight:500;
  -webkit-user-select:text;user-select:text}
.boite input:focus{outline:none}
.boite input::placeholder{color:rgba(246,239,226,.28)}
.boite .voir{font-size:10.5px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:rgba(246,239,226,.42);cursor:pointer}

.principal{position:relative;width:100%;margin-top:15px;padding:16px;border:0;
  border-radius:15px;cursor:pointer;overflow:hidden;
  background:linear-gradient(180deg,#f7cf76,#eab13f);
  color:#3a2405;font-family:inherit;font-size:15.5px;font-weight:800;
  box-shadow:0 8px 24px rgba(234,177,63,.26),
    0 1px 0 rgba(255,255,255,.5) inset;transition:transform .1s}
.principal:active{transform:translateY(2px)}
/* un reflet qui passe lentement : ça suffit à donner de la matière */
.principal::after{content:'';position:absolute;top:0;bottom:0;width:34%;
  left:-40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),
  transparent);animation:lueur 5.5s ease-in-out infinite}
@keyframes lueur{0%,62%{left:-40%}88%,100%{left:120%}}

.pied{margin-top:13px;text-align:center;font-size:12.5px;font-weight:500;
  color:rgba(246,239,226,.42)}
.pied b{color:#f5c96a;font-weight:700}
.note{margin-top:9px;text-align:center;font-size:11px;
  color:rgba(246,239,226,.28)}

@media (prefers-reduced-motion:reduce){ *{animation:none !important} }
</style>
<style>
/* ---- ce que la logique existante attend en plus ---- */
.masque{display:none}
.message{max-height:0;overflow:hidden;opacity:0;transition:.25s;
  margin-top:0;text-align:center;font-size:13px;font-weight:600;
  border-radius:12px;padding:0 13px}
.message.visible{max-height:120px;opacity:1;margin-top:12px;padding:11px 13px}
.message.erreur{background:rgba(201,82,74,.18);color:#f0a49c;
  border:1px solid rgba(201,82,74,.4)}
.message.ok{background:rgba(110,168,85,.18);color:#a8d98c;
  border:1px solid rgba(110,168,85,.4)}
.principal:disabled{opacity:.6;cursor:default}
.principal:disabled::after{display:none}
input:disabled{opacity:.5}
</style>
</head>
<body>

<div id="decor"><canvas id="scene"></canvas></div>
<div id="voile"></div>

<div class="marque">
  <p class="filet"><i></i><span>Un vallon à bâtir</span><i></i></p>
  <h1>Val</h1>
  <p class="ss">Pose tes bâtiments, place tes villageois,<br>
    et laisse le vallon travailler sans toi.</p>
</div>

<div class="carte">
  <div class="dedans">

    <div class="frise">
      <div><b>5</b><span>bâtiments</span></div><i></i>
      <div><b>12</b><span>villageois</span></div><i></i>
      <div><b>8 h</b><span>hors ligne</span></div>
    </div>

    <div class="onglets" role="tablist">
      <button role="tab" id="ong-inscription" aria-selected="true"
              aria-controls="form-inscription">Créer un vallon</button>
      <button role="tab" id="ong-connexion" aria-selected="false"
              aria-controls="form-connexion">Reprendre</button>
    </div>

    <div id="form-inscription" role="tabpanel" aria-labelledby="ong-inscription">
      <div class="champ">
        <label for="i-email">Adresse e-mail</label>
        <div class="boite"><canvas class="i-mail"></canvas>
          <input type="email" id="i-email" autocomplete="email"
                 placeholder="ton adresse"></div>
      </div>
      <div class="champ">
        <label for="i-mdp">Mot de passe</label>
        <div class="boite"><canvas class="i-cle"></canvas>
          <input type="password" id="i-mdp" autocomplete="new-password"
                 placeholder="8 caractères minimum">
          <span class="voir oeil" data-cible="i-mdp">Voir</span></div>
      </div>
      <button class="principal" id="btn-inscription">Commencer</button>
      <p class="pied">Tu as déjà un vallon ?
        <b data-aller="connexion">Le reprendre</b></p>
    </div>

    <div id="form-connexion" role="tabpanel" aria-labelledby="ong-connexion"
         class="masque">
      <div class="champ">
        <label for="c-email">Adresse e-mail</label>
        <div class="boite"><canvas class="i-mail"></canvas>
          <input type="email" id="c-email" autocomplete="email"
                 placeholder="ton adresse"></div>
      </div>
      <div class="champ">
        <label for="c-mdp">Mot de passe</label>
        <div class="boite"><canvas class="i-cle"></canvas>
          <input type="password" id="c-mdp" autocomplete="current-password"
                 placeholder="ton mot de passe">
          <span class="voir oeil" data-cible="c-mdp">Voir</span></div>
      </div>
      <button class="principal" id="btn-connexion">Entrer</button>
      <p class="pied">Pas encore de vallon ?
        <b data-aller="inscription">En créer un</b></p>
    </div>

    <div class="message" id="message" role="status" aria-live="polite"></div>
    <p class="note">Gratuit · rien à installer</p>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="bd.js?v=6"></script>
<script src="son.js?v=2"></script>

<script>
/* ============================================================
   LE DÉCOR
   Cinq plans, dessinés à partir de la largeur réelle : collines
   lointaines, lac, île, village, herbes du premier plan. Chaque
   plan a sa propre vitesse — c'est ce qui creuse l'image.
   ============================================================ */
const cv = document.getElementById('scene'), cx = cv.getContext('2d');
let F = 0, W = 0, H = 0, Z = 2;

const C = {
  /* le ciel d'une fin d'après-midi, en cinq paliers */
  c1:'#3f2a52', c2:'#6b3f63', c3:'#b25f5c', c4:'#e08a53', c5:'#f5b96a',
  soleil:'#fff0c4', halo:'#ffd98f',
  loin:'#4a3a63', loin2:'#5c4a75',        /* les collines du fond */
  moyen:'#3d5a52', moyen2:'#4a6b5e',      /* la crête intermédiaire */
  eau:'#2a4a6b', eau2:'#3a6488', eau3:'#5a8cae', ecume:'#c4e2ee',
  herbe:'#4a7a3a', herbeC:'#5c9147', herbeS:'#3a6230', herbeN:'#2c4d26',
  terre:'#8a6a45', terreS:'#6b5136',
  bois:'#a87448', boisC:'#c08f5e', boisS:'#7a5230', boisN:'#4e3320',
  toit:'#c9524a', toitC:'#e0685c', toitS:'#9c3a34',
  pierre:'#8b919c', pierreC:'#a8aeb8', pierreS:'#6e7480',
  creme:'#f6efe2', or:'#f5c96a', encre:'#1c1626'
};
function p(x, y, l, h, c){ cx.fillStyle = c; cx.fillRect(x, y, l, h); }
/* le tramage : la seule façon honnête de fondre deux aplats */
function trame(x, y, l, h, c){
  for (let j = 0; j < h; j++)
    for (let i = 0; i < l; i++)
      if ((i + j) % 2 === 0) p(x + i, y + j, 1, 1, c);
}
function bruit(x, n){
  const v = Math.sin(x * 127.1) * 43758.5453;
  return Math.floor((v - Math.floor(v)) * n);
}

function cadrer(){
  Z = window.innerWidth > 620 ? 3 : 2;
  W = Math.ceil(window.innerWidth / Z);
  H = Math.ceil(window.innerHeight / Z);
  cv.width = W; cv.height = H;
  cv.style.width = W * Z + 'px'; cv.style.height = H * Z + 'px';
  cx.imageSmoothingEnabled = false;
}

/* ---- une crête de collines, tracée en dents douces ---- */
function crete(base, ampl, periode, phase, couleur, ombre){
  const haut = [];
  for (let x = 0; x < W; x++){
    const y = Math.round(base
      + Math.sin((x + phase) / periode) * ampl
      + Math.sin((x + phase) / (periode * .37)) * (ampl * .34));
    haut.push(y);
    p(x, y, 1, H - y, couleur);
  }
  /* la lumière sur la ligne de crête, l'ombre juste dessous */
  for (let x = 0; x < W; x++){
    p(x, haut[x], 1, 2, ombre);
    if (x > 0 && haut[x] < haut[x - 1]) p(x, haut[x], 1, 3, ombre);
  }
  return haut;
}

function peindre(){
  const HOR = Math.round(H * .34);            /* l'horizon */
  const RIVE = Math.round(H * .40);           /* le bord de la rive */

  /* ---------- 1. le ciel ---------- */
  p(0, 0, W, H, C.c1);
  const bandes = [[.00, C.c1], [.09, C.c2], [.17, C.c3], [.24, C.c4], [.29, C.c5]];
  bandes.forEach(function(b, i){
    const y = Math.round(H * b[0]);
    const y2 = i < bandes.length - 1 ? Math.round(H * bandes[i + 1][0]) : HOR;
    p(0, y, W, y2 - y, b[1]);
    /* on trame la jonction, pour éviter la barre nette */
    if (i >= 2) trame(0, y - 3, W, 6, bandes[i - 1][1]);
  });

  /* ---------- 2. le soleil et son halo ---------- */
  const sx = Math.round(W * .66), sy = HOR - Math.round(H * .05);
  const r = Math.round(Math.min(W, H) * .05);
  for (let k = 4; k > 0; k--){
    const rr = r + k * 5;
    cx.globalAlpha = .05 * k;
    cx.fillStyle = C.halo;
    cx.beginPath(); cx.arc(sx, sy, rr, 0, 6.284); cx.fill();
    cx.globalAlpha = 1;
  }
  cx.fillStyle = C.soleil;
  cx.beginPath(); cx.arc(sx, sy, r, 0, 6.284); cx.fill();
  /* des nuages plats qui dérivent devant */
  [[.18, .08, 1], [.72, .14, .7], [.4, .05, .5]].forEach(function(n, i){
    const x = Math.round(((F / (14 + i * 9) + n[0] * W) % (W + 80)) - 40);
    const y = Math.round(H * n[1]), e = n[2];
    const l = Math.round(38 * e);
    p(x, y, l, 3, 'rgba(255,232,200,.24)');
    p(x + 6, y - 3, Math.round(l * .6), 3, 'rgba(255,232,200,.18)');
    p(x - 5, y + 3, Math.round(l * .8), 2, 'rgba(255,232,200,.12)');
  });
  /* les oiseaux */
  [[.2, .07], [.28, .1], [.75, .06]].forEach(function(o, i){
    const x = Math.round(((F / 6 + o[0] * W * 2) % (W + 40)) - 20);
    const y = Math.round(H * o[1]) + Math.round(Math.sin(F / 40 + i) * 2);
    const b = Math.floor(F / 9 + i) % 2;
    p(x, y, 3, 1, 'rgba(28,22,38,.55)');
    p(x + 3, y - b, 2, 1, 'rgba(28,22,38,.55)');
    p(x + 5, y, 3, 1, 'rgba(28,22,38,.55)');
  });

  /* ---------- 3. les collines, deux plans ---------- */
  crete(HOR - Math.round(H * .032), H * .018, W / 2.6, 0, C.loin, C.loin2);
  crete(HOR - Math.round(H * .009), H * .013, W / 3.8, W * .4, '#43485f', '#565b74');

  /* ---------- 4. le lac ---------- */
  p(0, HOR, W, RIVE - HOR, C.eau2);
  p(0, HOR + Math.round((RIVE - HOR) * .55), W, RIVE - HOR, C.eau);
  trame(0, HOR + Math.round((RIVE - HOR) * .45), W, 8, C.eau2);
  /* une brume au ras de l'eau : elle recule les collines */
  trame(0, HOR, W, 5, '#c9a2a8');
  /* le chemin de lumière, sous le soleil */
  const n = Math.max(5, Math.round((RIVE - HOR) / 6));
  for (let i = 0; i < n; i++){
    const y = HOR + 2 + i * 5;
    const l = 5 + i * 3;
    const d = Math.round(Math.sin(F / 24 + i * .9) * 2);
    /* deux traits courts plutôt qu'une barre : ça scintille au lieu de barrer */
    p(sx - l + d, y, Math.round(l * .7), 1, 'rgba(255,226,168,.6)');
    p(sx + Math.round(l * .2) + d, y, Math.round(l * .6), 1, 'rgba(255,226,168,.42)');
  }
  /* les reflets, à deux vitesses */
  for (let i = 0; i < Math.round(W / 9); i++){
    const x = (i * 27 + Math.floor(F / (i % 2 ? 20 : 30)) * (i % 2 ? 1 : -1))
              % (W + 30) - 15;
    p(x, HOR + 3 + (i % 9) * 4, 6, 1, C.eau3);
  }
  /* une barque, qui tangue */
  const bx = Math.round(W * .2), by = HOR + Math.round((RIVE - HOR) * .42)
    + Math.round(Math.sin(F / 42) * 1.4);
  p(bx, by + 5, 20, 4, C.encre);
  p(bx + 2, by + 4, 16, 1, C.boisC);
  p(bx + 9, by - 10, 1, 11, C.encre);
  p(bx + 10, by - 9, 7 + (Math.floor(F / 34) % 2), 9, C.creme);
  p(bx + 10, by - 9, 7, 2, C.toit);

  /* ---------- 5. la rive et l'île ---------- */
  /* le trait de côte ondule légèrement, tuile par tuile */
  const cote = [];
  for (let x = 0; x < W; x++){
    cote.push(RIVE + Math.round(Math.sin(x / 17) * 2 + Math.sin(x / 6.3) * 1.2));
  }
  for (let x = 0; x < W; x++){
    const y = cote[x];
    const o = 1 + Math.round((Math.sin(F / 26 + x / 9) + 1) * 1.2);
    p(x, y - o, 1, o, C.ecume);                 /* l'écume, qui bat */
    p(x, y, 1, 4, '#d8c496');                   /* le sable */
    p(x, y + 4, 1, H - y, C.herbe);             /* l'herbe */
    p(x, y + 4, 1, 2, C.herbeS);
  }
  /* des touffes, stables d'une image à l'autre */
  for (let x = 0; x < W; x += 3){
    const g = bruit(x * 3.7, 9), y = cote[x] + 8;
    if (g < 2) p(x, y + g * 5, 2, 2, C.herbeC);
    if (g === 5) p(x, y + 12, 3, 2, C.herbeS);
  }

  /* ---------- 6. le village ---------- */
  const sol = Math.round(H * .465);
  maison(Math.round(W * .12), sol, 1);
  moulin(Math.round(W * .74), sol - 6);
  maison(Math.round(W * .46), sol + 6, .85);
  arbre(Math.round(W * .3), sol + 2, 1);
  arbre(Math.round(W * .63), sol + 8, .8);
  arbre(Math.round(W * .89), sol - 2, .9);
  /* deux villageois sur le sentier */
  [[0, 0], [1, 70]].forEach(function(g, i){
    const x = Math.round(((F / 3 + g[1]) % (W + 30)) - 15);
    const y = sol + 16 + i * 12, pas = Math.floor(F / 10) % 2;
    p(x - 1, y + 13, 8, 2, 'rgba(28,22,38,.22)');
    p(x, y, 6, 3, '#6b4a2e');
    p(x, y + 3, 6, 4, '#e0ac82');
    p(x, y + 7, 6, 5, i ? '#4a7ec0' : C.toit);
    p(x + (pas ? 0 : 1), y + 12, 2, 2, C.encre);
    p(x + (pas ? 4 : 3), y + 12, 2, 2, C.encre);
  });

  /* ---------- 7. le premier plan, flou par la masse ---------- */
  const bas = Math.round(H * .50);
  p(0, bas + 6, W, H, C.herbeN);
  for (let x = 0; x < W; x += 2){
    const g = bruit(x * 1.9, 5);
    /* une base continue, puis des brins qui dépassent : la masse d'abord */
    const h = 4 + Math.round(Math.sin(x / 9) * 2) + g
      + Math.round(Math.sin(F / 34 + x / 13) * 1.1);
    p(x, bas + 6 - h, 2, h, C.herbeN);
    if (g === 4) p(x, bas + 2 - h, 1, 4, C.herbeN);
    if (g < 2) p(x, bas + 6 - h, 1, 2, C.herbeS);
  }
  /* quelques lucioles, qui montent puis s'éteignent */
  for (let i = 0; i < 7; i++){
    const t = (F / 2 + i * 90) % 420;
    const x = Math.round((i * 53 + Math.sin(t / 30 + i) * 12) % W);
    const y = Math.round(bas - t / 4);
    const a = Math.max(0, .8 - t / 520);
    p(x, y, 1, 1, 'rgba(255,224,140,' + a.toFixed(2) + ')');
  }
}

/* ---- les bâtiments du village ---- */
function maison(X, Y, e){
  const l = Math.round(26 * e), h = Math.round(15 * e);
  p(X, Y + 2, l + 4, 2, 'rgba(28,22,38,.2)');
  p(X, Y - h, l, h, C.encre);
  p(X + 1, Y - h + 1, l - 2, h - 2, C.creme);
  p(X + 1, Y - h + 1, l - 2, 2, '#fffaf0');
  p(X + 1, Y - 4, l - 2, 3, '#cbbda6');
  p(X + 1, Y - h + 1, 2, h - 2, C.bois);        /* les colombages */
  p(X + l - 3, Y - h + 1, 2, h - 2, C.bois);
  p(X - 2, Y - h - Math.round(9 * e), l + 4, Math.round(10 * e), C.encre);
  p(X - 1, Y - h - Math.round(8 * e), l + 2, Math.round(8 * e), C.toit);
  p(X - 1, Y - h - Math.round(8 * e), l + 2, 3, C.toitC);
  p(X - 1, Y - h - 1, l + 2, 2, C.toitS);
  const px = X + Math.round(l * .42);
  p(px, Y - Math.round(10 * e), Math.round(7 * e), Math.round(10 * e), C.encre);
  p(px + 1, Y - Math.round(9 * e), Math.round(5 * e), Math.round(9 * e), C.boisN);
  /* la fenêtre allumée, qui vacille */
  const lu = (F % 130) < 112 ? C.or : '#ffe6a0';
  p(X + 3, Y - Math.round(11 * e), 5, 5, C.encre);
  p(X + 4, Y - Math.round(10 * e), 3, 3, lu);
  /* la cheminée et sa fumée */
  p(X + l - 8, Y - h - Math.round(13 * e), 4, 5, C.encre);
  p(X + l - 7, Y - h - Math.round(12 * e), 2, 4, C.pierreS);
  for (let i = 0; i < 3; i++){
    const m = (F / 3.2 + i * 11) % 34;
    p(X + l - 7 + Math.round(Math.sin((F + i * 40) / 22) * 2),
      Y - h - Math.round(13 * e) - m, 2, 2,
      'rgba(246,239,226,' + (.3 - m / 118).toFixed(2) + ')');
  }
}

function moulin(X, Y){
  p(X - 2, Y + 2, 22, 2, 'rgba(28,22,38,.2)');
  p(X, Y - 26, 18, 26, C.encre);                /* la tour */
  p(X + 1, Y - 25, 16, 24, C.pierre);
  p(X + 1, Y - 25, 16, 3, C.pierreC);
  p(X + 13, Y - 22, 4, 21, C.pierreS);
  p(X + 6, Y - 10, 6, 10, C.encre);
  p(X + 7, Y - 9, 4, 9, C.boisN);
  p(X - 1, Y - 32, 20, 7, C.encre);             /* le toit */
  p(X, Y - 31, 18, 5, C.toit);
  p(X, Y - 31, 18, 2, C.toitC);
  /* les ailes tournent : quatre pales, une rotation lente */
  const a = F / 55, cxx = X + 9, cyy = Y - 21;
  for (let k = 0; k < 4; k++){
    const t = a + k * 1.5708;
    for (let d = 3; d < 15; d++){
      p(Math.round(cxx + Math.cos(t) * d), Math.round(cyy + Math.sin(t) * d),
        2, 2, d > 6 ? C.creme : C.boisS);
    }
  }
  p(cxx - 1, cyy - 1, 3, 3, C.encre);
}

function arbre(X, Y, e){
  const v = Math.floor((F + X * 7) / 60) % 2;
  const h = Math.round(11 * e);
  p(X, Y + 2, Math.round(14 * e), 2, 'rgba(28,22,38,.2)');

  p(X + Math.round(6 * e), Y - h, Math.round(2 * e), h, C.boisS);
  const a = X + v, t = Math.round(16 * e);
  p(a + Math.round(5 * e), Y - h - t, Math.round(6 * e), 3, C.encre);
  p(a + Math.round(2 * e), Y - h - t + 3, Math.round(12 * e), 5, C.encre);
  p(a + Math.round(1 * e), Y - h - t + 8, Math.round(14 * e), 5, C.encre);
  p(a + Math.round(4 * e), Y - h - t + 13, Math.round(8 * e), 4, C.encre);
  p(a + Math.round(6 * e), Y - h - t + 1, Math.round(4 * e), 3, C.herbeC);
  p(a + Math.round(3 * e), Y - h - t + 4, Math.round(10 * e), 4, C.herbeC);
  p(a + Math.round(2 * e), Y - h - t + 8, Math.round(12 * e), 4, C.herbe);
  p(a + Math.round(5 * e), Y - h - t + 12, Math.round(6 * e), 3, C.herbeS);
}

const $ = id => document.getElementById(id);

const vues = {
  inscription: { onglet: $('ong-inscription'), form: $('form-inscription') },
  connexion:   { onglet: $('ong-connexion'),   form: $('form-connexion') }
};

function afficher(nom){

    champ.type = cache ? 'text' : 'password';
    b.textContent = cache ? 'Cacher' : 'Voir';

const boiteMsg = $('message');
function montrerMessage(texte, type = 'erreur'){
  boiteMsg.textContent = texte;
  boiteMsg.className = 'message visible ' + type;
}
function cacherMessage(){ boiteMsg.className = 'message'; }

const emailValide = v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);

function verifierInscription(){
  const email = $('i-email').value.trim();
  const mdp   = $('i-mdp').value;

  if (!emailValide(email)) return 'Cette adresse e-mail n\u2019est pas valide.';
  if (mdp.length < 8) return 'Le mot de passe fait 8 caractères minimum.';
  return null;
}

function verifierConnexion(){
  const email = $('c-email').value.trim();
  const mdp   = $('c-mdp').value;
  if (!emailValide(email)) return 'Cette adresse e-mail n\u2019est pas valide.';
  if (!mdp) return 'Entre ton mot de passe.';
  return null;
}

const traduire = m => {
  const t = (m || '').toLowerCase();
  if (t.includes('invalid login')) return 'E-mail ou mot de passe incorrect.';
  if (t.includes('already registered') || t.includes('already been registered')) return 'Cette adresse est déjà inscrite. Connecte-toi.';
  if (t.includes('email not confirmed')) return 'Confirme ton e-mail avant de te connecter.';
  if (t.includes('rate limit') || t.includes('too many')) return 'Trop de tentatives. Attends une minute.';
  if (t.includes('password')) return 'Mot de passe refusé : 8 caractères minimum.';
  if (t.includes('failed to fetch') || t.includes('network')) return 'Pas de connexion au serveur. Réessaie.';
  return m || 'Une erreur est survenue. Réessaie.';
};

function occuper(btn, texte){
  btn.dataset.libelle = btn.dataset.libelle || btn.textContent;
  btn.disabled = true;
  btn.textContent = texte;
  btn.closest('[role="tabpanel"]').querySelectorAll('input').forEach(c => c.disabled = true);
}
function liberer(btn){
  btn.disabled = false;
  btn.textContent = btn.dataset.libelle;
  btn.closest('[role="tabpanel"]').querySelectorAll('input').forEach(c => c.disabled = false);
}

$('btn-inscription').addEventListener('click', async () => {
  const erreur = verifierInscription();
  if (erreur) return montrerMessage(erreur);
  cacherMessage();

  const btn = $('btn-inscription');

      liberer(btn);
    }
  } catch (e) {
    montrerMessage(traduire(e.message));
    liberer(btn);
  }
});
