<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f1ea">
<title>Battle Dock Life</title>
<style>
:root{
  --fond:#f3f1ec; --carte:#ffffff; --encre:#2b2a27; --doux:#8a867e;
  --vert:#4fa832; --vert-f:#3d8626; --champ:#f4f2ec; --bord:#e4e0d6;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:var(--fond);color:var(--encre);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px 18px;
  position:relative;overflow:hidden;
  background:linear-gradient(180deg,#cfe9f6 0%,#e6f2f7 30%,#f7ecd6 48%,#e3f0d2 58%,#c6e2ac 100%)}
#fond{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#fond .soleil{position:absolute;left:50%;top:6%;transform:translateX(-50%);width:110px;height:110px;
  border-radius:50%;background:#fff2bd;box-shadow:0 0 90px 36px rgba(255,242,189,.6)}
#fond .n{position:absolute;background:#fff;border-radius:40px;opacity:.9;
  animation:derive 60s linear infinite}
#fond .n2{animation-duration:88s;opacity:.75}
@keyframes derive{from{transform:translateX(-30vw)}to{transform:translateX(120vw)}}
#fond .colline{position:absolute;border-radius:50%}
#fond .c1{left:-14%;bottom:-16%;width:78%;padding-top:52%;background:#bfdfa0}
#fond .c2{right:-18%;bottom:-13%;width:82%;padding-top:50%;background:#a9cd88}
#fond .c3{left:22%;bottom:-24%;width:72%;padding-top:50%;background:#cbe7b2}
.carte{position:relative;z-index:1}
button,input{font-family:inherit;font-size:16px}

.carte{width:100%;max-width:380px;background:var(--carte);border-radius:26px;padding:28px 22px 24px;
  box-shadow:0 1px 2px rgba(43,42,39,.05),0 16px 40px rgba(50,60,45,.2)}

.marque{text-align:center;margin-bottom:24px}
.marque h1{font-size:26px;font-weight:650;letter-spacing:-.4px}
.marque p{font-size:14px;color:var(--doux);margin-top:5px}

.onglets{display:flex;background:var(--champ);border-radius:14px;padding:4px;margin-bottom:18px}
.onglets button{flex:1;border:0;background:none;color:var(--doux);padding:10px;border-radius:11px;
  font-weight:600;font-size:14.5px;cursor:pointer;transition:.18s}
.onglets button.on{background:var(--carte);color:var(--encre);
  box-shadow:0 1px 2px rgba(43,42,39,.08),0 2px 8px rgba(43,42,39,.06)}

label{display:block;font-size:13px;color:var(--doux);margin:0 0 6px 3px}
.champ{position:relative;margin-bottom:14px}
.champ input{width:100%;background:var(--champ);border:1.5px solid transparent;border-radius:15px;
  padding:15px 44px 15px 15px;color:var(--encre);outline:none;transition:.18s}
.champ input::placeholder{color:#b3aea4}
.champ input:focus{background:var(--carte);border-color:var(--vert)}
.champ .oeil{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:38px;height:38px;
  border:0;background:none;color:var(--doux);cursor:pointer;font-size:15px}

.jouer{width:100%;border:0;border-radius:16px;padding:16px;margin-top:6px;
  background:linear-gradient(180deg,#67c447,var(--vert));color:#fff;font-size:17px;font-weight:650;
  cursor:pointer;box-shadow:0 5px 0 var(--vert-f),0 10px 22px rgba(79,168,50,.28);transition:.06s}
.jouer:active{transform:translateY(4px);box-shadow:0 1px 0 var(--vert-f)}
.jouer:disabled{opacity:.6;box-shadow:0 5px 0 #b9b5ac}

.sep{display:flex;align-items:center;gap:12px;margin:20px 0 16px}
.sep i{flex:1;height:1px;background:var(--bord)}
.sep span{font-size:12px;color:#b3aea4;font-style:normal}

.invite{width:100%;border:1.5px solid var(--bord);background:none;border-radius:15px;padding:14px;
  color:var(--encre);font-size:14.5px;font-weight:600;cursor:pointer}
.invite:active{background:var(--champ)}

.msg{font-size:13.5px;line-height:1.5;border-radius:12px;padding:11px 13px;margin-bottom:14px;display:none}
.msg.on{display:block}
.msg.err{background:#fdeceb;color:#a3312a}
.msg.ok{background:#eaf5e4;color:#2f6b22}
.pied{text-align:center;font-size:12.5px;color:#b3aea4;margin-top:18px}
</style>
</head>
<body>
<div id="fond">
  <div class="soleil"></div>
  <div class="n" style="left:0;top:12%;width:120px;height:34px"></div>
  <div class="n" style="left:0;top:10%;width:70px;height:38px;animation-delay:-4s"></div>
  <div class="n n2" style="left:0;top:22%;width:96px;height:28px;animation-delay:-30s"></div>
  <div class="colline c1"></div><div class="colline c2"></div><div class="colline c3"></div>
</div>
<div class="carte">
  <div class="marque">
    <h1>Battle Dock Life</h1>
    <p id="sous">Content de te revoir.</p>
  </div>

  <div class="onglets">
    <button id="t-co" class="on">Connexion</button>
    <button id="t-in">Inscription</button>
  </div>

  <div class="msg" id="msg"></div>

  <div id="bloc-pseudo" style="display:none">
    <label for="pseudo">Pseudo</label>
    <div class="champ"><input id="pseudo" autocomplete="nickname" maxlength="20" placeholder="Comment on t'appelle"></div>
  </div>

  <label for="email">Adresse e-mail</label>
  <div class="champ"><input id="email" type="email" autocomplete="email" placeholder="toi@exemple.fr"></div>

  <label for="mdp">Mot de passe</label>
  <div class="champ">
    <input id="mdp" type="password" autocomplete="current-password" placeholder="••••••••">
    <button class="oeil" id="oeil" aria-label="Afficher le mot de passe">👁</button>
  </div>

  <button class="jouer" id="valider">Jouer</button>

  <div class="sep"><i></i><span>ou</span><i></i></div>
  <button class="invite" id="invite">Continuer sans compte</button>

  <div class="pied">Ta partie est sauvegardée sur ton compte.</div>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const SB_URL='https://zpfkekiavlfphialvphi.supabase.co';
const SB_KEY='sb_publishable__dfR2lEOwKjhhtavvJEvGw_KVACZnHP';
const sb=createClient(SB_URL,SB_KEY);

const $=id=>document.getElementById(id);
let mode='co';

function afficher(t,type){const m=$('msg');m.textContent=t;m.className='msg on '+(type||'');}
function cacher(){$('msg').className='msg';}

function basculer(m){
  mode=m;cacher();
  $('t-co').classList.toggle('on',m==='co');
  $('t-in').classList.toggle('on',m==='in');
  $('bloc-pseudo').style.display=m==='in'?'block':'none';
  $('sous').textContent=m==='co'?'Content de te revoir.':'Deux champs et c’est parti.';
  $('valider').textContent=m==='co'?'Jouer':'Créer mon compte';
  $('mdp').autocomplete=m==='co'?'current-password':'new-password';
}
$('t-co').onclick=()=>basculer('co');
$('t-in').onclick=()=>basculer('in');
$('oeil').onclick=()=>{const c=$('mdp');c.type=c.type==='password'?'text':'password';};

$('valider').onclick=async()=>{
  const email=$('email').value.trim(), mdp=$('mdp').value, pseudo=$('pseudo').value.trim();
  if(!email||!mdp){afficher('Il manque l’e-mail ou le mot de passe.','err');return;}
  if(mode==='in'&&pseudo.length<3){afficher('Choisis un pseudo d’au moins 3 caractères.','err');return;}
  if(mode==='in'&&mdp.length<8){afficher('Le mot de passe doit faire au moins 8 caractères.','err');return;}
  const b=$('valider');b.disabled=true;b.textContent='Un instant…';cacher();
  try{
    if(mode==='co'){
      const {error}=await sb.auth.signInWithPassword({email,password:mdp});
      if(error)throw error;
      location.href='jeu.html';
    }else{
      const {error}=await sb.auth.signUp({email,password:mdp,options:{data:{pseudo}}});
      if(error)throw error;
      afficher('Compte créé. Vérifie ta boîte mail pour confirmer, puis connecte-toi.','ok');
      basculer('co');
    }
  }catch(e){
    const t=(e&&e.message)||'';
    afficher(/Invalid login/i.test(t)?'E-mail ou mot de passe incorrect.':
      /already registered/i.test(t)?'Cette adresse a déjà un compte.':
      'Ça n’a pas marché : '+t,'err');
  }finally{b.disabled=false;b.textContent=mode==='co'?'Jouer':'Créer mon compte';}
};
$('invite').onclick=()=>{try{localStorage.setItem('bdl.invite','1');}catch(x){}location.href='jeu.html';};
document.addEventListener('keydown',e=>{if(e.key==='Enter')$('valider').click();});
sb.auth.getSession().then(({data})=>{if(data.session)location.href='jeu.html';});
</script>
</body>
</html>
