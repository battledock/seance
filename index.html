<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d97b46">
<title>Battle Dock Life</title>
<style>
:root{
  --trait:#2a1710;--creme:#fdf3e0;--sable:#f2e2c0;
  --ocre:#f2b134;--ocre-b:#b07d12;
  --terre:#c9563a;--terre-b:#8f3520;
  --eau:#2a7d85;--eau-b:#175258;
  --bois:#8a5a2e;--bois-b:#573716;
  --pierre:#9aa0a6;--pierre-b:#5f6469;
  --vert:#5f8f57;--vert-b:#3a5c34;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#e6d4b0;color:var(--trait);
  font-family:"Arial Rounded MT Bold","Trebuchet MS",Verdana,sans-serif;font-weight:700;
  -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior:none}
button{font-family:inherit;font-weight:700;border:0;background:none;color:inherit;cursor:pointer}
canvas{image-rendering:pixelated;display:block}
.app{position:fixed;inset:0;display:flex;flex-direction:column}

/* ---------- barre du haut ---------- */
.haut{flex:0 0 auto;display:flex;align-items:center;gap:8px;
  padding:calc(9px + env(safe-area-inset-top)) 12px 9px;background:#3a2a1c;color:var(--creme);
  border-bottom:3px solid var(--trait)}
.haut .jour{font-size:14px;text-transform:uppercase}
.haut .heure{font-size:13px;opacity:.75}
.haut .esp{flex:1}
.haut .sou{background:var(--ocre);color:var(--trait);border:3px solid var(--trait);border-radius:12px;
  padding:6px 11px;font-size:14px;box-shadow:0 3px 0 var(--ocre-b)}

/* ---------- scène ---------- */
.scene{flex:0 0 auto;position:relative;background:#1d6b72;border-bottom:3px solid var(--trait)}
.scene canvas{width:100%;height:auto}
.lieu{position:absolute;left:10px;top:10px;background:rgba(42,23,16,.75);color:var(--creme);
  border-radius:10px;padding:6px 10px;font-size:11px;text-transform:uppercase;letter-spacing:.06em}

/* ---------- jauges ---------- */
.jauges{flex:0 0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:9px 12px;
  background:var(--sable);border-bottom:3px solid var(--trait)}
.jg{text-align:center}
.jg .n{font-size:9px;text-transform:uppercase;color:#6b4c34;letter-spacing:.04em}
.jg .b{height:12px;border:3px solid var(--trait);border-radius:8px;background:#e0cba0;
  margin-top:4px;overflow:hidden}
.jg .b i{display:block;height:100%;transition:width .25s}
.jg.bas .b i{animation:cli .8s infinite}
@keyframes cli{50%{opacity:.45}}

/* ---------- onglets ---------- */
.onglets{flex:0 0 auto;display:flex;gap:7px;padding:9px 12px;background:var(--sable)}
.onglets button{flex:1;border:3px solid var(--trait);border-radius:13px;padding:9px 2px;font-size:11px;
  text-transform:uppercase;background:var(--bois);color:var(--creme);box-shadow:0 4px 0 var(--bois-b)}
.onglets button.on{background:var(--ocre);color:var(--trait);box-shadow:0 4px 0 var(--ocre-b)}
.onglets button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.4)}

/* ---------- liste d'actions ---------- */
.corps{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px calc(16px + env(safe-area-inset-bottom));
  background:#e6d4b0}
.act{width:100%;display:flex;align-items:center;gap:11px;text-align:left;
  border:3px solid var(--trait);border-radius:16px;padding:12px;margin-bottom:10px;
  background:var(--creme);box-shadow:0 5px 0 rgba(42,23,16,.45)}
.act:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(42,23,16,.45)}
.act[disabled]{opacity:.45}
.act canvas{width:34px;height:34px;flex:0 0 auto}
.act .txt{flex:1;min-width:0}
.act .t{font-size:15px;text-transform:uppercase}
.act .d{font-family:"Trebuchet MS",sans-serif;font-weight:400;font-size:12px;color:#6b4c34;margin-top:3px}
.act .cout{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.act .cout span{font-size:10px;border-radius:999px;padding:3px 7px;border:2px solid var(--trait)}
.act .cout .p{background:#cfe6c8}.act .cout .m{background:#f2c9c0}
.titre{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:#6b4c34;margin:4px 0 9px;
  display:flex;align-items:center;gap:8px}
.titre::after{content:"";flex:1;height:3px;background:rgba(107,76,52,.28);border-radius:2px}

/* ---------- fiche docker ---------- */
.carte{border:3px solid var(--trait);border-radius:16px;background:var(--creme);padding:13px;
  box-shadow:0 5px 0 rgba(42,23,16,.45);margin-bottom:11px}
.ligne{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;
  border-bottom:2px solid rgba(107,76,52,.18);font-size:13px}
.ligne:last-child{border-bottom:0}
.ligne .v{color:var(--terre)}
.comp{margin-top:8px}
.comp .n{display:flex;justify-content:space-between;font-size:11px;text-transform:uppercase;color:#6b4c34}
.comp .b{height:11px;border:3px solid var(--trait);border-radius:7px;background:#e0cba0;margin-top:4px;overflow:hidden}
.comp .b i{display:block;height:100%;background:linear-gradient(90deg,var(--ocre),var(--terre))}

/* ---------- journal ---------- */
.msg{border-left:6px solid var(--ocre);background:#fff8e8;border-radius:10px;padding:9px 11px;
  font-family:"Trebuchet MS",sans-serif;font-weight:400;font-size:12.5px;color:#4a3524;margin-bottom:7px}
.msg b{font-family:inherit;font-weight:700;color:var(--trait)}
.msg.mal{border-left-color:var(--terre)}
.msg.bien{border-left-color:var(--vert)}

/* ---------- fenêtre ---------- */
#fen{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;
  background:rgba(42,23,16,.8);padding:20px}
#fen.on{display:flex}
#fen .b{width:min(340px,94%);background:var(--creme);border:4px solid var(--trait);border-radius:20px;
  box-shadow:0 8px 0 rgba(0,0,0,.4);padding:16px;max-height:86vh;overflow-y:auto}
#fen h2{font-size:19px;text-transform:uppercase;font-style:italic;margin-bottom:8px}
#fen p{font-family:"Trebuchet MS",sans-serif;font-weight:400;font-size:13px;line-height:1.6;color:#4a3524}
.gros{width:100%;border:3px solid var(--trait);border-radius:15px;padding:14px;font-size:16px;
  text-transform:uppercase;background:var(--ocre);box-shadow:0 5px 0 var(--ocre-b);margin-top:11px}
.gros.terre{background:var(--terre);color:var(--creme);box-shadow:0 5px 0 var(--terre-b)}
.gros.eau{background:var(--eau);color:var(--creme);box-shadow:0 5px 0 var(--eau-b)}
.gros:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.4)}
</style>
</head>
<body>
<div class="app">
  <div class="haut">
    <div><div class="jour" id="h-jour">Lundi 1</div><div class="heure" id="h-heure">07:00</div></div>
    <div class="esp"></div>
    <div class="sou" id="h-sous">0 €</div>
  </div>

  <div class="scene"><canvas id="scene" width="240" height="112"></canvas><div class="lieu" id="h-lieu">Chez toi</div></div>

  <div class="jauges" id="jauges"></div>
  <div class="onglets" id="onglets"></div>
  <div class="corps" id="corps"></div>
</div>

<div id="fen"><div class="b" id="fen-b"></div></div>

<script src="bdf.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const {dessinerDocker,lookDefaut,px}=BDF;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ================= état ================= */
const POSTES=[
  {id:'secu',    nom:'Sécurité',        taux:11,exp:0,   req:{}},
  {id:'bequille',nom:'Béquille',        taux:13,exp:120, req:{force:2}},
  {id:'docker',  nom:'Docker simple',   taux:15,exp:320, req:{force:3,endurance:2}},
  {id:'taquet',  nom:'Taquet terre',    taux:18,exp:650, req:{force:5,endurance:3}},
  {id:'pointeur',nom:'Pointeur',        taux:21,exp:1100,req:{reputation:4,endurance:4}},
  {id:'chauffeur',nom:'Chauffeur',      taux:25,exp:1700,req:{conduite:4,force:4}},
  {id:'chef',    nom:'Chef de service', taux:32,exp:2600,req:{reputation:7,conduite:5,endurance:5}}
];
const JOURS=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];

const neuf=()=>({
  look:Object.assign(lookDefaut(),{nom:'ELIAS',carrure:'solide',teint:2,cheveux:'court',cheveuxC:1,
    barbe:'ombre',haut:'marcel',hautC:6,bas:'jean',basC:1,ceinture:'cuir',pieds:'brodequins',
    tete:'rien',visage:'rien',mains:'nues',dos:'rien',arme:'aucune',expression:'neutre'}),
  jour:1,heure:7,euros:180,
  energie:80,faim:70,moral:65,forme:45,
  poste:'secu',exp:0,quarts:0,
  comp:{force:1,endurance:1,conduite:0,reputation:1},
  loyer:320,prochainLoyer:7,lieu:'maison',
  journal:[],aTravaille:false
});
let e=neuf();
const CLE='bdlife.v1';
try{const b=localStorage.getItem(CLE);if(b)e=Object.assign(neuf(),JSON.parse(b));}catch(x){}
const sauver=()=>{try{localStorage.setItem(CLE,JSON.stringify(e));}catch(x){}};
const poste=()=>POSTES.find(p=>p.id===e.poste)||POSTES[0];

/* ================= décors ================= */
function scene(g,t){
  const W=240,H=112,SOL=92;
  g.clearRect(0,0,W,H);
  const nuit=e.heure<6||e.heure>=21, soir=e.heure>=18&&e.heure<21;
  if(e.lieu==='maison'){
    const m=g.createLinearGradient(0,0,0,SOL);
    m.addColorStop(0,nuit?'#2a2438':'#8c7a63');m.addColorStop(1,nuit?'#1d1a2a':'#6f5f4b');
    g.fillStyle=m;g.fillRect(0,0,W,SOL);
    px(g,0,0,W,6,nuit?'#191627':'#5c4e3d');
    // fenêtre
    px(g,150,18,54,42,nuit?'#0f1b2a':'#7fb3c9');
    px(g,150,18,54,4,'#4a3a2c');px(g,176,18,3,42,'#4a3a2c');px(g,150,38,54,3,'#4a3a2c');
    if(nuit){px(g,162,26,5,5,'#f2e2a0');for(let i=0;i<8;i++)px(g,153+((i*13)%48),22+((i*9)%34),1,1,'#dfe6ef');}
    // lit
    px(g,8,58,66,26,'#8a5a2e');px(g,8,52,20,10,'#e8dcc0');px(g,8,64,66,4,'#c9563a');
    // table + lampe
    px(g,196,60,34,6,'#6b4429');px(g,200,66,4,20,'#6b4429');
    px(g,206,44,10,16,nuit?'#f2c46a':'#d8c8a8');
    if(nuit){const h=g.createRadialGradient(211,52,4,211,52,44);
      h.addColorStop(0,'rgba(242,196,106,.35)');h.addColorStop(1,'rgba(242,196,106,0)');
      g.fillStyle=h;g.fillRect(160,10,110,90);}
    px(g,0,SOL,W,H-SOL,'#5c3d24');px(g,0,SOL,W,3,'#7a5334');
    for(let x=0;x<W;x+=22)px(g,x,SOL,2,H-SOL,'#452c19');
  }else if(e.lieu==='port'){
    const c=g.createLinearGradient(0,0,0,SOL);
    if(nuit){c.addColorStop(0,'#131a2a');c.addColorStop(1,'#25384a');}
    else if(soir){c.addColorStop(0,'#8a4a5a');c.addColorStop(1,'#f0a05a');}
    else{c.addColorStop(0,'#7fc0d8');c.addColorStop(1,'#cfe2e8');}
    g.fillStyle=c;g.fillRect(0,0,W,SOL);
    g.strokeStyle=nuit?'#0f1722':'#3f5560';g.lineWidth=3;
    g.beginPath();g.moveTo(46,SOL);g.lineTo(46,22);g.lineTo(128,32);g.stroke();
    g.beginPath();g.moveTo(46,22);g.lineTo(20,40);g.stroke();
    const o=Math.sin(t/900)*4;
    g.beginPath();g.moveTo(104,30);g.lineTo(104+o,56);g.stroke();
    px(g,98+o,56,14,10,nuit?'#0f1722':'#3f5560');
    [[140,60,44,32,'#2a6b72'],[190,64,42,28,'#c9563a'],[8,66,32,26,'#8a5a2e']].forEach(([x,y,w,h,col])=>{
      px(g,x,y,w,h,col);px(g,x,y,w,3,'#ffffff33');
      for(let i=6;i<w;i+=8)px(g,x+i,y+4,2,h-8,'#00000022');});
    px(g,0,SOL,W,H-SOL,'#a8875c');px(g,0,SOL,W,4,'#c9a97a');
    for(let x=-4;x<W;x+=30)px(g,x,SOL+4,3,H-SOL-4,'#8a6a44');
  }else{ // ville
    const c=g.createLinearGradient(0,0,0,SOL);
    if(nuit){c.addColorStop(0,'#1a1630');c.addColorStop(1,'#38304a');}
    else{c.addColorStop(0,'#f0c98a');c.addColorStop(1,'#f3ded0');}
    g.fillStyle=c;g.fillRect(0,0,W,SOL);
    for(let i=0;i<9;i++){
      const x=i*28-6,h=34+((i*23)%34),y=SOL-h;
      px(g,x,y,26,h,i%2?'#c9a07a':'#b58a63');px(g,x,y,26,3,'#8a6a4a');
      for(let f=0;f<3;f++)for(let k=0;k<2;k++)
        px(g,x+5+k*11,y+8+f*10,6,6,nuit?(((i+f+k)%3)?'#3a3550':'#f2d488'):'#7d5c46');
    }
    // auvent
    px(g,150,52,60,8,'#c9563a');for(let i=0;i<6;i++)px(g,150+i*10,52,5,8,'#f2e2c0');
    px(g,0,SOL,W,H-SOL,'#7d7266');px(g,0,SOL,W,3,'#988d80');
    for(let x=0;x<W;x+=18)px(g,x,SOL+6,10,2,'#6b6156');
  }
  if(nuit){g.fillStyle='rgba(20,16,40,.35)';g.fillRect(0,0,W,H);}
  // le docker
  g.save();g.translate(112,SOL+6);
  g.fillStyle='rgba(0,0,0,.28)';g.beginPath();g.ellipse(0,0,15,4,0,0,7);g.fill();
  const etat=(e.energie<20)?'touche':(e.moral>75?'gagne':'debout');
  dessinerDocker(g,{look:e.look,etat,coup:null,sol:1,sens:1,garde:0,stun:0},t);
  g.restore();
}

/* ================= icônes ================= */
function icone(cv,t){
  cv.width=34;cv.height=34;
  const g=cv.getContext('2d');g.imageSmoothingEnabled=false;g.clearRect(0,0,34,34);
  switch(t){
    case 'lit':px(g,3,14,28,12,'#8a5a2e');px(g,3,10,10,8,'#f0e2c8');px(g,3,20,28,3,'#c9563a');
      px(g,3,26,4,5,'#5c3a1a');px(g,27,26,4,5,'#5c3a1a');break;
    case 'assiette':px(g,5,12,24,12,'#f0ece2');px(g,9,15,16,6,'#c9563a');
      px(g,5,24,24,3,'#c9c3bb');px(g,14,6,3,7,'#9aa0a6');break;
    case 'douche':px(g,14,4,4,10,'#9aa0a6');px(g,8,12,16,5,'#c9c3bb');
      for(let i=0;i<4;i++)px(g,10+i*4,19+((i%2)*4),2,6,'#7fb3c9');break;
    case 'tele':px(g,4,8,26,18,'#3a3a44');px(g,7,11,20,12,'#7fb3c9');
      px(g,14,26,6,4,'#2a2a30');px(g,9,30,16,3,'#2a2a30');break;
    case 'grue':px(g,6,6,3,24,'#5f6b72');px(g,6,6,20,3,'#5f6b72');px(g,23,9,2,10,'#8a8577');
      px(g,20,19,8,6,'#c9563a');px(g,3,28,10,4,'#3f4a52');break;
    case 'sup':px(g,5,14,24,12,'#f2b134');px(g,8,10,6,6,'#c9563a');px(g,20,10,6,6,'#c9563a');
      px(g,5,26,24,3,'#b07d12');break;
    case 'caces':px(g,4,10,26,16,'#f0ece2');px(g,4,10,26,4,'#2a7d85');
      px(g,7,18,12,2,'#8d8073');px(g,7,22,8,2,'#8d8073');px(g,22,17,5,7,'#f2b134');break;
    case 'halt':px(g,7,8,20,20,'#c9563a');px(g,7,8,20,4,'#e0806a');px(g,12,16,10,3,'#f0ece2');break;
    case 'sport':px(g,4,14,6,7,'#3a3a44');px(g,24,14,6,7,'#3a3a44');px(g,9,16,16,3,'#5f6b72');
      px(g,2,16,3,3,'#3a3a44');px(g,29,16,3,3,'#3a3a44');break;
    case 'course':px(g,13,4,8,8,'#e0aa7e');px(g,11,12,12,10,'#2a7d85');
      px(g,8,22,6,9,'#3a3a44');px(g,20,22,6,9,'#3a3a44');px(g,23,13,7,4,'#e0aa7e');break;
    case 'verre':px(g,10,6,14,4,'#f0ece2');px(g,11,10,12,10,'#f2b134');px(g,13,20,8,6,'#c9c3bb');
      px(g,9,26,16,3,'#c9c3bb');break;
    case 'panier':px(g,5,12,24,16,'#8a5a2e');px(g,5,12,24,3,'#c08a52');px(g,11,6,12,6,'#5c3a1a');
      px(g,9,16,4,8,'#4f8f57');px(g,17,16,6,6,'#c9563a');break;
    case 'ciseaux':px(g,8,6,3,14,'#9aa0a6');px(g,22,6,3,14,'#9aa0a6');
      px(g,6,22,8,8,'#3a3a44');px(g,20,22,8,8,'#3a3a44');break;
    case 'cine':px(g,4,8,26,18,'#2a2a30');px(g,7,11,20,12,'#f2e2c0');
      for(let i=0;i<4;i++){px(g,4,9+i*5,3,3,'#8d8073');px(g,27,9+i*5,3,3,'#8d8073');}break;
    case 'papiers':px(g,6,6,20,24,'#f0ece2');px(g,6,6,20,4,'#c9563a');
      px(g,9,15,14,2,'#8d8073');px(g,9,19,10,2,'#8d8073');px(g,9,23,12,2,'#8d8073');break;
  }
}

/* ================= actions ================= */
function A(o){return o;}
const ACTIONS={
maison:[
 A({id:'dormir',nom:'Dormir',ic:'lit',d:'Huit heures. Ça remet tout d’aplomb.',h:8,

],
port:[

],
ville:[
 A({id:'sport',nom:'Salle de sport',ic:'sport',d:'Fonte et corde à sauter.',h:2,cout:11,
    besoin:{energie:20},ef:{energie:-18,faim:-14,forme:+16,moral:+4},comp:{force:1}}),
 A({id:'course',nom:'Courir sur la Corniche',ic:'course',d:'Une heure face au vent.',h:1,
    besoin:{energie:15},ef:{energie:-14,faim:-12,forme:+11,moral:+7},comp:{endurance:1}}),
 A({id:'bar',nom:'Boire un coup avec les collègues',ic:'verre',d:'On refait le quai. Ça se sait.',h:3,cout:24,
    ef:{moral:+18,energie:-8,faim:+8},comp:{reputation:1}}),
 A({id:'marche',nom:'Marché de Noailles',ic:'panier',d:'Remplir le frigo pour la semaine.',h:1,cout:34,
    ef:{faim:+22,moral:+5}}),
 A({id:'coiffeur',nom:'Coiffeur',ic:'ciseaux',d:'Ça change un homme.',h:1,cout:19,ef:{moral:+12}}),
 A({id:'cine',nom:'Cinéma',ic:'cine',d:'Trois heures ailleurs.',h:3,cout:13,ef:{moral:+17,energie:-4,faim:-10}})
]
};

/* ================= moteur ================= */
let ongletActif='maison';
const LIEU={maison:'maison',port:'port',ville:'ville'};

function peut(a){
  if(a.cout&&e.euros<a.cout)return 'Il te manque '+(a.cout-e.euros)+' €';
  if(a.besoin&&a.besoin.energie&&e.energie<a.besoin.energie)return 'Trop crevé';
  if(a.h&&e.heure+a.h>26)return 'Trop tard, il faut dormir';
  return null;
}
function journal(txt,type){e.journal.unshift({txt,type:type||''});if(e.journal.length>7)e.journal.pop();}

function faire(a){
  const bl=peut(a);if(bl)return;
  if(a.cout)e.euros-=a.cout;
  for(const k in (a.ef||{}))e[k]=clamp(e[k]+a.ef[k],0,100);
  for(const k in (a.comp||{}))e.comp[k]=Math.min(10,e.comp[k]+a.comp[k]);

  if(a.travail){
    const p=poste();
    const rendement=.65+e.forme/300+e.energie/400;
    const paie=Math.round(p.taux*a.travail*(a.mult||1)*rendement);
    e.euros+=paie;e.exp+=Math.round(a.travail*(6+e.comp.endurance));e.quarts++;
    e.comp.reputation=Math.min(10,e.comp.reputation+(e.quarts%4===0?1:0));
    journal('Quart de '+a.travail+' h comme <b>'+p.nom+'</b> — <b>'+paie+' €</b>.','bien');
    e.aTravaille=true;
  }
  if(a.embauche){
    if(Math.random()<.45+e.comp.reputation*.04){
      const p=poste(),paie=Math.round(p.taux*4*.9);
      e.euros+=paie;e.exp+=20;e.energie=clamp(e.energie-24,0,100);e.faim=clamp(e.faim-14,0,100);
      journal('Embauché pour un demi-quart : <b>'+paie+' €</b>.','bien');
    }else journal('Personne n’a été pris ce matin. Deux heures perdues.','mal');
  }
  if(a.comp&&a.comp.conduite)journal('Une journée de formation en plus. Conduite : '+e.comp.conduite+'/10.');
  if(a.promotion)promotion();

  e.heure+=a.h||0;
  if(!a.travail&&!a.embauche&&!a.promotion&&a.id!=='dormir')journal(a.nom+'.');
  if(a.id==='dormir')journal('Nuit complète. Réveil en forme.','bien');

  while(e.heure>=24)finJournee();
  sauver();rendre();
}

function promotion(){
  const i=POSTES.findIndex(p=>p.id===e.poste);
  const s=POSTES[i+1];
  if(!s){fenetre('Rien au-dessus','Tu es chef de service. Personne ne te donnera mieux sur ce port.');return;}
  const manque=[];
  if(e.exp<s.exp)manque.push((s.exp-e.exp)+' points d’expérience');
  for(const k in s.req)if(e.comp[k]<s.req[k])manque.push(k+' '+e.comp[k]+'/'+s.req[k]);
  if(manque.length){
    fenetre('Refusé','Pour passer <b>'+s.nom+'</b>, il te manque :<br>· '+manque.join('<br>· '));
    journal('Demande de poste refusée.','mal');
  }else{
    e.poste=s.id;e.moral=clamp(e.moral+18,0,100);
    fenetre('Promu','Tu passes <b>'+s.nom+'</b>. '+s.taux+' € de l’heure à partir de maintenant.');
    journal('Promotion : <b>'+s.nom+'</b> !','bien');
  }
}

function finJournee(){
  e.heure-=24;e.jour++;
  e.faim=clamp(e.faim-14,0,100);
  e.energie=clamp(e.energie-6,0,100);
  e.forme=clamp(e.forme-2,0,100);
  if(e.faim<15){e.moral=clamp(e.moral-14,0,100);e.energie=clamp(e.energie-10,0,100);
    journal('Tu t’es couché le ventre vide.','mal');}
  if(!e.aTravaille&&JOURS[(e.jour-2)%7]!=='Dimanche')e.moral=clamp(e.moral-4,0,100);
  e.aTravaille=false;
  if(e.jour>=e.prochainLoyer){
    e.prochainLoyer+=7;
    if(e.euros>=e.loyer){e.euros-=e.loyer;journal('Loyer payé : <b>'+e.loyer+' €</b>.');}
    else{e.moral=clamp(e.moral-28,0,100);
      journal('Loyer impayé. Le propriétaire est passé.','mal');}
  }
}

/* ================= rendu ================= */
function jauge(nom,val,couleur){
  return '<div class="jg'+(val<20?' bas':'')+'"><div class="n">'+nom+'</div>'+
    '<div class="b"><i style="width:'+val+'%;background:'+couleur+'"></i></div></div>';
}
function rendre(){
  e.lieu=LIEU[ongletActif]||'maison';
  $('h-jour').textContent=JOURS[(e.jour-1)%7]+' '+e.jour;
  $('h-heure').textContent=String(Math.floor(e.heure)).padStart(2,'0')+':00';
  $('h-sous').textContent=e.euros+' €';
  $('h-lieu').textContent={maison:'Chez toi',port:'Le port',ville:'La ville',fiche:'Chez toi'}[ongletActif]||'Chez toi';
  $('jauges').innerHTML=
    jauge('Énergie',e.energie,'linear-gradient(90deg,#f2b134,#c9563a)')+
    jauge('Faim',e.faim,'linear-gradient(90deg,#8fd699,#4f8f57)')+
    jauge('Moral',e.moral,'linear-gradient(90deg,#7fc9d8,#2a7d85)')+
    jauge('Forme',e.forme,'linear-gradient(90deg,#e0806a,#8f3520)');

  const ong=[['maison','Chez toi'],['port','Le port'],['ville','La ville'],['fiche','Fiche']];
  $('onglets').innerHTML=ong.map(([id,n])=>
    '<button data-o="'+id+'"'+(ongletActif===id?' class="on"':'')+'>'+n+'</button>').join('');

  const c=$('corps');c.innerHTML='';
  if(ongletActif==='fiche'){
    const p=poste(),s=POSTES[POSTES.findIndex(x=>x.id===e.poste)+1];
    const co=(n,k)=>'<div class="comp"><div class="n"><span>'+n+'</span><span>'+e.comp[k]+'/10</span></div>'+
      '<div class="b"><i style="width:'+(e.comp[k]*10)+'%"></i></div></div>';
    c.innerHTML='<div class="carte">'+
      '<div class="ligne"><span>Poste</span><span class="v">'+p.nom+'</span></div>'+
      '<div class="ligne"><span>Taux horaire</span><span class="v">'+p.taux+' €</span></div>'+
      '<div class="ligne"><span>Expérience</span><span class="v">'+e.exp+(s?' / '+s.exp:'')+'</span></div>'+
      '<div class="ligne"><span>Quarts faits</span><span class="v">'+e.quarts+'</span></div>'+
      '<div class="ligne"><span>Loyer</span><span class="v">'+e.loyer+' € · jour '+e.prochainLoyer+'</span></div>'+
      '</div><div class="carte">'+co('Force','force')+co('Endurance','endurance')+
      co('Conduite','conduite')+co('Réputation','reputation')+'</div>'+
      '<div class="titre">Ces jours-ci</div>'+
      (e.journal.length?e.journal.map(j=>'<div class="msg '+j.type+'">'+j.txt+'</div>').join('')
        :'<div class="msg">Rien à signaler.</div>')+
      '<button class="gros eau" id="bt-combat">Le combat, plus tard ▸</button>';
  }else{
    const t=document.createElement('div');t.className='titre';
    t.textContent={maison:'À la maison',port:'Sur le port',ville:'En ville'}[ongletActif];
    c.appendChild(t);
    ACTIONS[ongletActif].forEach(a=>{
      const bl=peut(a);
      const b=document.createElement('button');b.className='act';if(bl)b.disabled=true;
      const cv=document.createElement('canvas');
      const z=document.createElement('div');z.className='txt';
      const cout=[];
      if(a.h)cout.push('<span>'+a.h+' h</span>');
      if(a.cout)cout.push('<span class="m">-'+a.cout+' €</span>');
      if(a.travail)cout.push('<span class="p">+'+Math.round(poste().taux*a.travail*(a.mult||1)*.85)+' € env.</span>');
      for(const k in (a.ef||{})){
        if(k==='energie'&&a.ef[k]<0)continue;
        cout.push('<span class="'+(a.ef[k]>0?'p':'m')+'">'+(a.ef[k]>0?'+':'')+a.ef[k]+' '+
          {energie:'énergie',faim:'faim',moral:'moral',forme:'forme'}[k]+'</span>');
      }
      z.innerHTML='<div class="t">'+a.nom+'</div><div class="d">'+(bl?bl:a.d)+'</div>'+
        '<div class="cout">'+cout.join('')+'</div>';
      b.append(cv,z);b.onclick=()=>faire(a);
      c.appendChild(b);icone(cv,a.ic);
    });
  }
}
document.addEventListener('click',ev=>{
  const o=ev.target.closest('[data-o]');
  if(o){ongletActif=o.dataset.o;rendre();}
  if(ev.target.id==='bt-combat')fenetre('Bientôt',
    'Le jeu de combat est mis de côté le temps de construire cette vie. Il reviendra comme événement du soir.');
});
function fenetre(titre,txt){
  $('fen-b').innerHTML='<h2>'+titre+'</h2><p>'+txt+'</p>'+
    '<button class="gros" id="fen-ok">D’accord</button>';
  $('fen-ok').onclick=()=>$('fen').classList.remove('on');
  $('fen').classList.add('on');
}
const sc=$('scene').getContext('2d');sc.imageSmoothingEnabled=false;
(function boucle(t){requestAnimationFrame(boucle);scene(sc,t);})(0);
rendre();
</script>
