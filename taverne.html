<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#150e09">
<title>Battle Dock — La taverne</title>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none}
html,body{height:100%;overflow:hidden;background:#150e09;
  font-family:'Courier Prime',monospace;color:#fff}

#sc{position:fixed;left:0;right:0;top:0;height:52%;overflow:hidden;
  opacity:0;transition:opacity .5s}
#sc.pret{opacity:1}
#sc svg{display:block;width:100%;height:100%}
#sc::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(21,14,9,.3) 0,rgba(21,14,9,0) 26%,
    rgba(21,14,9,.72) 80%,rgba(21,14,9,.99) 100%)}

.tete{position:fixed;left:0;right:0;top:0;z-index:6;
  padding:calc(env(safe-area-inset-top) + 14px) 16px 0;display:flex;align-items:center;gap:11px}
.tete .ret{flex:0 0 40px;height:40px;border-radius:9px;
  border:1.5px solid rgba(255,255,255,.24);background:rgba(28,18,11,.6);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  display:flex;align-items:center;justify-content:center;cursor:pointer}
.tete .ret svg{width:18px;height:18px;stroke:#f0d0a0;fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}
.tete .ou{flex:1;min-width:0;background:rgba(28,18,11,.6);
  border:1.5px solid rgba(255,255,255,.2);border-radius:9px;padding:7px 13px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.tete .ou b{display:block;font-size:14px;font-weight:700;color:#f6e4c8}
.tete .ou span{display:block;font-size:8px;letter-spacing:.18em;text-transform:uppercase;
  color:rgba(246,228,200,.5);margin-top:2px}

.w{position:fixed;left:0;right:0;top:47%;bottom:0;z-index:5;overflow-y:auto;
  padding:0 20px calc(env(safe-area-inset-bottom) + 20px)}
.w::-webkit-scrollbar{display:none}

.dit{padding-top:22px;display:flex;flex-direction:column;gap:12px}
.dit p{font-size:15px;line-height:1.72;color:rgba(246,232,208,.86);
  font-family:system-ui,sans-serif;
  opacity:0;transform:translateY(8px);animation:venir .6s forwards}
.dit p.parle{color:#fff;font-size:16px;padding-left:14px;
  border-left:2.5px solid rgba(240,196,106,.6)}
@keyframes venir{to{opacity:1;transform:none}}

.tt{font-size:7.5px;letter-spacing:.22em;text-transform:uppercase;
  color:rgba(246,228,200,.4);margin:24px 2px 11px}

/* le tableau des cours, comme une ardoise */
.ard{background:rgba(24,20,16,.86);border:1.5px solid rgba(246,228,200,.16);
  border-radius:9px;overflow:hidden;
  box-shadow:0 8px 26px rgba(6,4,2,.5)}
.ard .li{display:flex;align-items:center;gap:12px;padding:14px 15px;
  border-bottom:1px solid rgba(246,228,200,.08)}
.ard .li:last-child{border-bottom:0}
.ard .li .nb{flex:0 0 20px;font-size:11px;color:rgba(246,228,200,.3)}
.ard .li .nm{flex:1;font-size:14px;color:#f6e8d0;font-weight:700}
.ard .li .mo{flex:0 0 auto;font-size:11.5px;font-family:system-ui,sans-serif;
  text-align:right;line-height:1.4}
.ard .li .mo em{display:block;font-style:normal;font-size:9.5px;
  color:rgba(246,228,200,.34);margin-top:3px}

.choix{display:flex;flex-direction:column;gap:10px;margin-top:22px;
  opacity:0;animation:venir .6s forwards}
.choix button{width:100%;text-align:left;padding:16px 17px;
  border:1.5px solid rgba(246,228,200,.2);border-radius:11px;
  background:rgba(38,26,17,.72);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);cursor:pointer;
  font-family:'Courier Prime',monospace;transition:all .16s}
.choix button:active{transform:scale(.987)}
.choix button b{display:block;font-size:15.5px;color:#f6e8d0;font-weight:700;line-height:1.4}
.choix button .s{display:block;font-size:12px;color:rgba(246,228,200,.5);margin-top:6px;
  font-family:system-ui,sans-serif;line-height:1.5}
.choix button .cle{display:inline-block;margin-top:9px;font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;padding:4px 10px;border-radius:12px;
  background:rgba(140,224,168,.16);color:#8ce0a8}
.choix button.ferme{opacity:.44;cursor:default;border-style:dashed}
.choix button.ferme .cle{background:rgba(224,138,106,.16);color:#e0a878}

/* le port qui s'ouvre */
.port{margin-top:22px;padding:20px;border-radius:12px;
  border:1.5px solid rgba(240,196,106,.4);background:rgba(52,38,20,.7);
  opacity:0;animation:venir .7s forwards;text-align:center}
.port .su{font-size:8.5px;letter-spacing:.28em;text-transform:uppercase;color:#f0c46a}
.port b{display:block;font-size:26px;font-weight:700;color:#f6e8d0;margin-top:10px}
.port .q{display:block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:rgba(246,228,200,.44);margin-top:6px}
.port .d{display:flex;justify-content:center;gap:22px;margin-top:16px}
.port .d span{font-size:11.5px;color:rgba(246,228,200,.62);font-family:system-ui,sans-serif}
.port .d span b{display:block;font-size:16px;color:#f0c46a;margin-top:3px}
.port button{width:100%;margin-top:18px;padding:15px;border:0;border-radius:9px;cursor:pointer;
  background:linear-gradient(180deg,#f6cd76,#dca94a);color:#1c1a16;
  font-family:'Courier Prime',monospace;font-size:13.5px;font-weight:700;letter-spacing:.06em}

.mot{font-size:11.5px;color:rgba(246,228,200,.44);line-height:1.7;
  margin:20px 4px 4px;font-family:system-ui,sans-serif;font-style:italic;text-align:center}

/* la porte fermée */
.ferme{padding:30px 22px;text-align:center}
.ferme .ic{width:52px;height:52px;border-radius:13px;margin:0 auto 18px;
  background:rgba(246,228,200,.1);display:flex;align-items:center;justify-content:center}
.ferme .ic svg{width:24px;height:24px;stroke:rgba(246,228,200,.6);fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.ferme b{display:block;font-size:18px;color:#f6e8d0;font-weight:700}
.ferme p{font-size:13.5px;line-height:1.75;color:rgba(246,228,200,.56);margin-top:13px;
  font-family:system-ui,sans-serif}
.ferme .jau{height:7px;border-radius:4px;background:rgba(246,228,200,.12);margin:20px 0 9px;
  overflow:hidden}
.ferme .jau i{display:block;height:100%;border-radius:4px;
  background:linear-gradient(90deg,#b8863a,#f0c46a)}
.ferme .sous{font-size:10.5px;color:rgba(246,228,200,.4);font-family:system-ui,sans-serif}

.lampe{animation:vacille 5s ease-in-out infinite}
@keyframes vacille{0%,100%{opacity:.92}42%{opacity:1}68%{opacity:.88}}
.nuria{animation:respire 7s ease-in-out infinite;transform-box:fill-box;
  transform-origin:50% 100%}
@keyframes respire{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.4px)}}
@media (prefers-reduced-motion:reduce){*{animation:none !important}}
</style>
</head>
<body>

<div id="sc"></div>

<div class="tete">
  <button class="ret" id="ret"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
  <span class="ou"><b>La taverne</b><span id="t-s">Barcelone</span></span>
</div>

<div class="w" id="w"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="bd.js?v=2"></script>
<script>
/* ============================================================
   QUATRE FAÇONS DE VOIR LA TAVERNE
   ============================================================ */
const W = 480;
function hx(c){ return [parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)]; }
function ch(a){ return '#'+a.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join(''); }
function mel(a,b,k){ const A=hx(a),B=hx(b); return ch([0,1,2].map(i=>A[i]+(B[i]-A[i])*k)); }
const rnd = s => { const x = Math.sin(s*127.1)*43758.5; return x - Math.floor(x); };
const rnd2 = (a,b) => { const x = Math.sin(a*127.1+b*311.7)*43758.5; return x - Math.floor(x); };
const OR = '#ffc878', NOIR = '#150e09';
const clair = (c,k) => mel(c, OR, k===undefined?.3:k);
const noir  = (c,k) => mel(c, NOIR, k===undefined?.3:k);

/* ============================================================
   A — AU COMPTOIR : elle est à un mètre, on ne voit qu'elle
   ============================================================ */
function angleA(avecElle){
  const H = 900;
  let s = `<defs>
    <radialGradient id="a-l" cx="0.44" cy="0.24">
      <stop offset="0%"  stop-color="#ffdea6" stop-opacity=".46"/>
      <stop offset="42%" stop-color="#c88a48" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#3a2416" stop-opacity="0"/></radialGradient>
    <linearGradient id="a-f" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#20150e"/>
      <stop offset="46%"  stop-color="#3c2a1c"/>
      <stop offset="100%" stop-color="#1a1209"/></linearGradient>
    <linearGradient id="a-c" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a5e34"/><stop offset="100%" stop-color="#4a3220"/></linearGradient>
  </defs>`;
  s += `<rect x="0" y="0" width="${W}" height="${H}" fill="url(#a-f)"/>`;
  /* la lampe, hors champ juste au-dessus */
  s += `<ellipse cx="212" cy="120" rx="380" ry="320" fill="url(#a-l)"/>`;

  /* --- l'étagère, en haut, avec ses bouteilles --- */
  [0, 1].forEach(r => {
    const y = 176 + r * 148;
    /* le fond de l'étagère, plus sombre */
    s += `<rect x="-20" y="${(y - 132).toFixed(0)}" width="520" height="132"
      fill="#1c130c" opacity=".5"/>`;
    for (let k = 0; k < 14; k++){
      const x = -12 + k * 37, h = 74 + rnd(r * 9 + k) * 44;
      const c = ['#4a6b48','#7a5a3a','#3f5a6b','#8a6a3a','#6d4a3a','#5a4a6b'][(r*14+k)%6];
      /* la bouteille */
      s += `<path d="M${x} ${y} v${(-h+22).toFixed(0)} q0 -8 5 -11 v-11 h9 v11 q5 3 5 11 V${y} z"
        fill="${noir(c, .3)}"/>`;
      /* le reflet vertical, côté lampe */
      s += `<rect x="${(x + 4).toFixed(0)}" y="${(y - h + 26).toFixed(0)}" width="4"
        height="${(h - 34).toFixed(0)}" fill="${clair(c, .55)}" opacity=".38"/>`;
    }
    /* la planche */
    s += `<rect x="-20" y="${y}" width="520" height="11" fill="${noir('#6d4a2c', .26)}"/>`;
    s += `<rect x="-20" y="${y}" width="520" height="3" fill="${clair('#a87a48', .3)}"
      opacity=".6"/>`;
  });

  /* --- le mur nu entre l'étagère et elle : on y met de la matière --- */
  for (let k = 0; k < 40; k++){
    const x = rnd(k * 7) * 520 - 20, y = 340 + rnd(k * 3) * 210;
    s += `<rect x="${x.toFixed(0)}" y="${y.toFixed(0)}"
      width="${(30 + rnd(k) * 46).toFixed(0)}" height="${(14 + rnd(k+2) * 10).toFixed(0)}" rx="2"
      fill="${rnd(k+5) > .5 ? '#4a3524' : '#2e2016'}" opacity=".3"/>`;
  }
  /* une ardoise accrochée au mur, à droite */
  s += `<rect x="352" y="356" width="128" height="150" rx="3" fill="#2a2420"/>`;
  s += `<rect x="358" y="362" width="116" height="138" rx="2" fill="#1c1a18"/>`;
  [0,1,2,3,4].forEach(q =>
    s += `<rect x="370" y="${380 + q*24}" width="${(58 + rnd(q*3)*36).toFixed(0)}" height="4"
      rx="2" fill="#c9bda0" opacity="${(.24 + rnd(q)*.2).toFixed(2)}"/>`);

  /* --- Núria, centrée, en buste bien visible --- */
  if (avecElle !== false) s += nuriaGrande(228, 604, 1);

  /* --- le comptoir, au premier plan : il est dans l'ombre --- */
  s += `<path d="M-20 748 h520 v${H} h-520 z" fill="url(#a-c)"/>`;
  /* le grain du bois */
  for (let k = 0; k < 26; k++){
    const yy = 772 + rnd(k * 5) * 130;
    s += `<path d="M${(-20 + rnd(k*3)*300).toFixed(0)} ${yy.toFixed(0)}
      h${(60 + rnd(k*7)*160).toFixed(0)}" stroke="#2a1c12"
      stroke-width="${(1 + rnd(k)*1.6).toFixed(1)}" opacity="${(.1 + rnd(k+3)*.16).toFixed(2)}"/>`;
  }
  /* les planches verticales */
  for (let k = 0; k < 15; k++)
    s += `<path d="M${(-16 + k*36)} 764 v${H}" stroke="#241810" stroke-width="1.6"
      opacity=".4"/>`;
  /* le chant du plateau, la seule chose qui capte la lampe */
  s += `<path d="M-20 748 h520 v18 h-520 z" fill="#7e5630"/>`;
  s += `<path d="M-20 745 h520 v7 h-520 z" fill="#a87a48" opacity=".72"/>`;

  /* --- ce qui est posé DESSUS, donc devant elle --- */
  /* le verre, à gauche */
  s += `<ellipse cx="86" cy="744" rx="34" ry="9" fill="#150e09" opacity=".4"/>`;
  s += `<path d="M56 742 l7 -74 h46 l7 74 z" fill="#b8b09a" opacity=".26"/>`;
  s += `<path d="M65 682 h39 l-4 52 h-31 z" fill="#c98a3a" opacity=".62"/>`;
  s += `<path d="M56 742 l7 -74 h11 l-4 74 z" fill="#f4f0e0" opacity=".28"/>`;
  s += `<ellipse cx="83" cy="668" rx="26" ry="6" fill="#e8e0cc" opacity=".3"/>`;
  /* le pichet, à droite */
  s += `<ellipse cx="404" cy="744" rx="42" ry="10" fill="#150e09" opacity=".4"/>`;
  s += `<path d="M368 742 q-10 -54 6 -80 q14 -8 34 -8 q20 0 34 8 q16 26 6 80 z"
    fill="#6d5238"/>`;
  s += `<path d="M368 742 q-10 -54 6 -80 q7 -4 16 -6 q-14 32 -8 86 z"
    fill="#9a7a52" opacity=".7"/>`;
  s += `<path d="M448 672 q24 8 20 32 q-4 20 -22 18" stroke="#6d5238"
    stroke-width="10" fill="none" stroke-linecap="round"/>`;
  s += `<ellipse cx="404" cy="656" rx="34" ry="8" fill="#4a3624"/>`;
  s += `<ellipse cx="400" cy="655" rx="26" ry="5" fill="#2a1c12"/>`;
  /* un torchon jeté sur le comptoir */
  s += `<path d="M188 744 q34 -14 74 -6 q34 8 52 4 l4 12 q-40 8 -76 -2 q-34 -8 -52 4 z"
    fill="#c9bda0" opacity=".7"/>`;
  return s;
}

/* ---------- Núria, vue de près ----------
   La lampe est au-dessus d'elle, un peu à gauche. */
function nuriaGrande(x, y, k){
  const peau  = '#dda87c', peauC = '#f2c89c', peauO = '#a9744c';
  const chev  = '#3a241c', chevC = '#5e3c2c';
  const robe  = '#7e3a48', robeC = '#a2596a', robeO = '#5a2634';
  const blanc = '#ece2cc';
  let s = `<g class="nuria">`;

  /* ---------- les épaules : étroites, pente douce ---------- */
  s += `<path d="M${x-138} ${y+240}
    C${x-134} ${y+130} ${x-96} ${y+74} ${x-52} ${y+56}
    q${52} ${-18} ${104} 0
    C${x+96} ${y+74} ${x+134} ${y+130} ${x+138} ${y+240} Z" fill="${robe}"/>`;
  /* le pli d'ombre sous le bras droit */
  s += `<path d="M${x+96} ${y+80} q34 46 40 160 l-30 0 q-6 -104 -34 -146 z"
    fill="${robeO}" opacity=".5"/>`;
  /* le côté que la lampe touche */
  s += `<path d="M${x-52} ${y+56} C${x-96} ${y+74} ${x-134} ${y+130} ${x-138} ${y+240}
    l32 0 q8 -98 44 -142 z" fill="${robeC}" opacity=".62"/>`;

  /* ---------- le corsage : un décolleté en V, discret ---------- */
  s += `<path d="M${x-40} ${y+62} q40 34 80 0 l10 22
    q-20 44 -50 62 q-30 -18 -50 -62 z" fill="${blanc}"/>`;
  s += `<path d="M${x-40} ${y+62} q20 17 40 25 v78 q-30 -18 -50 -62 z"
    fill="#fff" opacity=".28"/>`;
  /* le lacet */
  s += `<path d="M${x-14} ${y+96} l28 12 M${x-14} ${y+116} l28 12 M${x-14} ${y+136} l28 12"
    stroke="${peauO}" stroke-width="3" opacity=".5"/>`;

  /* ---------- le cou : effilé, pas un rectangle ---------- */
  s += `<path d="M${x-21} ${y+16} q3 34 -8 50 q29 18 58 0 q-11 -16 -8 -50 z" fill="${peauO}"/>`;
  s += `<path d="M${x-21} ${y+16} q3 34 -8 50 q14 9 29 11 v-61 z" fill="${peau}" opacity=".7"/>`;

  /* ---------- le visage : ovale, menton fin ---------- */
  s += `<path d="M${x-48} ${y-56}
    C${x-48} ${y-122} ${x-27} ${y-148} ${x} ${y-148}
    C${x+27} ${y-148} ${x+48} ${y-122} ${x+48} ${y-56}
    C${x+48} ${y-14} ${x+27} ${y+22} ${x} ${y+22}
    C${x-27} ${y+22} ${x-48} ${y-14} ${x-48} ${y-56} Z" fill="${peau}"/>`;
  s += `<path d="M${x} ${y-148} C${x-27} ${y-148} ${x-48} ${y-122} ${x-48} ${y-56}
    C${x-48} ${y-14} ${x-27} ${y+22} ${x} ${y+22} Z" fill="${peauC}" opacity=".52"/>`;
  /* les pommettes */
  s += `<ellipse cx="${x-27}" cy="${y-36}" rx="15" ry="10" fill="#c98070" opacity=".2"/>`;
  s += `<ellipse cx="${x+27}" cy="${y-36}" rx="15" ry="10" fill="#c98070" opacity=".16"/>`;

  /* ---------- les cheveux : chignon haut, mèches libres ---------- */
  /* le chignon, derrière la tête */
  s += `<ellipse cx="${x-4}" cy="${y-150}" rx="40" ry="30" fill="${chev}"/>`;
  s += `<ellipse cx="${x-16}" cy="${y-158}" rx="20" ry="14" fill="${chevC}" opacity=".5"/>`;
  /* la calotte, ondulée, dégagée du front */
  s += `<path d="M${x-50} ${y-82}
    C${x-54} ${y-136} ${x-30} ${y-160} ${x} ${y-160}
    C${x+30} ${y-160} ${x+54} ${y-136} ${x+50} ${y-82}
    C${x+44} ${y-116} ${x+24} ${y-126} ${x+2} ${y-124}
    C${x-24} ${y-122} ${x-42} ${y-110} ${x-50} ${y-82} Z" fill="${chev}"/>`;
  /* les mèches qui tombent devant les oreilles */
  s += `<path d="M${x-50} ${y-96} q-8 42 4 78 q6 -40 12 -70 z" fill="${chev}"/>`;
  s += `<path d="M${x+50} ${y-96} q10 44 -2 82 q-8 -42 -12 -74 z" fill="${chev}"/>`;
  /* le reflet, côté lampe */
  s += `<path d="M${x-38} ${y-128} C${x-24} ${y-146} ${x-2} ${y-152} ${x+12} ${y-148}
    C${x-8} ${y-142} ${x-26} ${y-134} ${x-36} ${y-120} Z" fill="${chevC}" opacity=".7"/>`;

  /* ---------- les sourcils : fins et arqués ---------- */
  s += `<path d="M${x-33} ${y-88} q16 -11 29 -4" stroke="${chev}" stroke-width="3.4"
    fill="none" stroke-linecap="round"/>`;
  s += `<path d="M${x+4} ${y-92} q13 -7 29 4" stroke="${chev}" stroke-width="3.4"
    fill="none" stroke-linecap="round"/>`;

  /* ---------- les yeux : en amande, cils ---------- */
  [[-19],[19]].forEach(([dx])=>{
    s += `<path d="M${x+dx-15} ${y-64} q15 -14 30 0 q-15 12 -30 0 z" fill="#f6ead8"/>`;
    s += `<circle cx="${x+dx}" cy="${y-64}" r="7" fill="#4a3020"/>`;
    s += `<circle cx="${x+dx}" cy="${y-64}" r="3.2" fill="#180e08"/>`;
    s += `<circle cx="${x+dx-3}" cy="${y-67}" r="2.2" fill="#fff" opacity=".9"/>`;
    /* la ligne de cils, plus marquée en haut */
    s += `<path d="M${x+dx-16} ${y-65} q16 -14 32 0" stroke="${chev}" stroke-width="3"
      fill="none" stroke-linecap="round"/>`;
  });

  /* ---------- le nez : léger ---------- */
  s += `<path d="M${x-1} ${y-52} q6 18 -3 23 q-4 2 -7 0"
    stroke="${peauO}" stroke-width="2.8" fill="none" stroke-linecap="round"
    stroke-linejoin="round" opacity=".7"/>`;

  /* ---------- la bouche : pleine, un coin relevé ---------- */
  s += `<path d="M${x-16} ${y-12} q8 -6 16 -4 q8 -3 16 2 q-8 12 -16 12 q-9 0 -16 -10 z"
    fill="#a8514e"/>`;
  s += `<path d="M${x-16} ${y-12} q16 6 32 -2" stroke="#7e3a3a" stroke-width="1.6"
    fill="none"/>`;
  s += `<path d="M${x-9} ${y-16} q9 -3 18 0" stroke="#c9807a" stroke-width="2"
    fill="none" stroke-linecap="round" opacity=".5"/>`;

  /* ---------- l'ombre sous le menton ---------- */
  s += `<path d="M${x-26} ${y+14} q26 15 52 0 q-26 24 -52 0 z" fill="${peauO}" opacity=".3"/>`;

  /* ---------- les boucles d'oreille, longues ---------- */
  [[-52],[52]].forEach(([dx])=>{
    s += `<path d="M${x+dx} ${y-48} v16" stroke="#c9a34a" stroke-width="2"/>`;
    s += `<circle cx="${x+dx}" cy="${y-26}" r="6.5" fill="#d4a94e"/>`;
    s += `<circle cx="${x+dx-2}" cy="${y-28}" r="2.4" fill="#f4dc9c"/>`;
  });
  return s + `</g>`;
}



let LA = true;   /* est-elle derrière son comptoir ? */
function decor(){
  let d = angleA(LA);
  /* si elle est partie, la salle est éteinte */
  if (!LA) d += '<rect x="0" y="0" width="480" height="900" fill="#0a0604" opacity=".58"/>';
  document.getElementById('sc').innerHTML =
    '<svg viewBox="0 0 480 900" preserveAspectRatio="xMidYMid slice" '
    + 'xmlns="http://www.w3.org/2000/svg">' + d + '</svg>';
  /* on ne montre la salle qu'une fois qu'on sait qui est là */
  document.getElementById('sc').classList.add('pret');
}

/* ce qu'elle dit du cours, en mots */
function mot(d, pr, precis){
  if (pr >= 18) return ['Le port en déborde', '#e08a6a', 'Personne n\'en veut plus'];
  if (pr >= 9)  return ['Il en arrive beaucoup', '#e0a878', 'Ça baisse depuis trois jours'];
  if (d >= 1.25) return ['On s\'arrache ça', '#8ce0a8', 'Apporte-en tant que tu peux'];
  if (d >= 1.05) return ['Ça se vend bien', '#c4d88a', 'Tu ne perdras pas ton temps'];
  if (d >= 0.85) return ['Le cours est correct', 'rgba(246,228,200,.6)', ''];
  return ['Ils en ont assez', '#e0a878', 'Attends quelques jours'];
}


function poserPartie(r){
  LA = false; decor();
  const h = r.reste_h || 1;
  const q = h > 24 ? Math.ceil(h/24) + (h > 48 ? ' jours' : ' jour') : h + ' heures';
  document.getElementById('t-s').textContent = 'Close';
  document.getElementById('w').innerHTML =
    '<div class="ferme"><span class="ic"><svg viewBox="0 0 24 24">'
    + '<path d="M7 11V7a5 5 0 0 1 10 0v4M5 11h14v10H5z"/></svg></span>'
    + '<b>Il y a un mot sur la porte</b>'
    + '<p>« Fermé. »<br>Rien d\'autre. Pas de date, pas d\'explication.</p>'
    + '<p class="sous" style="margin-top:18px">Un type balaie devant la boutique '

}

function poserFerme(r){

function poserArdit(){
  const W2 = document.getElementById('w');
  const assez = b => !b || Object.entries(b).every(([k,v]) => (MOI[k]||0) >= v);
  let s = '<div class="dit">' + ARDIT.dit.map((t,i) =>
    '<p class="' + (t.trim().startsWith('«') ? 'parle' : '') + '" '
    + 'style="animation-delay:' + (i*.5+.1).toFixed(2) + 's">' + t + '</p>').join('') + '</div>';
  s += '<div class="choix" style="animation-delay:' + (ARDIT.dit.length*.5+.4).toFixed(2) + 's">'
    + ARDIT.choix.map(c => {
      const ok = assez(c.besoin);
      let h = '<button data-a="' + c.k + '" class="' + (ok ? '' : 'ferme') + '">'
        + '<b>' + c.t + '</b><span class="s">' + c.s + '</span>';
      if (c.besoin){
        const [q,v] = Object.entries(c.besoin)[0];
        const N = { negociation:'Négociation', discussion:'Discussion' }[q];
        h += '<span class="cle">' + N + ' ' + v + (ok ? '' : ' — tu as ' + (MOI[q]||0)) + '</span>';
      }
      return h + '</button>';
    }).join('') + '</div>';
  W2.innerHTML = s;
  W2.querySelectorAll('[data-a]').forEach(b => {
    if (b.classList.contains('ferme')) return;
    b.onclick = () => conclure(b.dataset.a);
  });
}

async function conclure(issue){
  const W2 = document.getElementById('w');
  W2.querySelector('.choix').innerHTML =
    '<button disabled style="opacity:.5">…</button>';
  const r = await BD.agir('prendre_ardit', { p_issue: issue });
  const L = APRES_ARDIT[issue] || [];
  let s = '<div class="dit">' + L.map((t,i) =>
    '<p class="' + (t.trim().startsWith('«') ? 'parle' : '') + '" '
    + 'style="animation-delay:' + (i*.5+.1).toFixed(2) + 's">' + t + '</p>').join('') + '</div>';
  if (r.ok){
    const P = r.port;
    s += '<div class="port" style="animation-delay:' + (L.length*.5+.5).toFixed(2) + 's">'
      + '<p class="su">Un cap de plus</p><b>' + P.nom + '</b>'
      + '<span class="q">' + P.quoi + '</span>'
      + '<div class="d"><span>Traversée<b>' + P.jours + ' jours</b></span>'
      + '<span>Il te faudra<b>' + P.energie + ' d\'énergie</b></span></div>'
      + '<button id="ok">Aller voir ta barque</button></div>';
  }
  W2.innerHTML = s;
  const b = document.getElementById('ok');
  if (b) b.onclick = () => location.href = 'barcelone.html';
}

let AR = null;   /* où en est la quête d'Ardit */

function poserRetour(){
  /* si on ne sait plus ce qu'il a dit, on prend le retour le plus sobre
     plutôt que de ne rien afficher du tout */
  const R = RETOUR[(AR && AR.issue) || 'muet'] || RETOUR.muet;
  if (!R){
    document.getElementById('w').innerHTML =
      '<p class="mot">Elle attend, mais tu ne retrouves pas les mots. Reviens.</p>';
    return;
  }
  const W2 = document.getElementById('w');
  let s = '<div class="dit">' + R.dit.map((t,i) =>
    '<p class="' + (t.trim().startsWith('«') ? 'parle' : '') + '" '
    + 'style="animation-delay:' + (i*.5+.1).toFixed(2) + 's">' + t + '</p>').join('') + '</div>';
  s += '<div class="choix" style="animation-delay:' + (R.dit.length*.5+.4).toFixed(2) + 's">'
    + R.choix.map(c => '<button data-r="' + c.k + '">'
        + '<b>' + c.t + '</b><span class="s">' + c.s + '</span>'
        + '<span class="cle" style="background:rgba(255,255,255,.07);color:rgba(246,228,200,.5)">'
        + c.note + '</span></button>').join('') + '</div>';
  W2.innerHTML = s;
  W2.querySelectorAll('[data-r]').forEach(b =>
    b.onclick = () => conclureRetour(b.dataset.r));
}

async function conclureRetour(quoi){
  const W2 = document.getElementById('w');
  W2.querySelector('.choix').innerHTML = '<button disabled style="opacity:.5">…</button>';
  const r = await BD.agir('conclure_reponse', { p_issue: quoi });
  const L = (APRES_RETOUR[(AR && AR.issue) || 'muet'] || {})[quoi] || [];
  let s = '<div class="dit">' + L.map((t,i) =>
    '<p class="' + (t.trim().startsWith('«') ? 'parle' : '') + '" '
    + 'style="animation-delay:' + (i*.5+.1).toFixed(2) + 's">' + t + '</p>').join('') + '</div>';
  if (r.ok){
    const P = [];
    if (r.euros) P.push('+' + r.euros + ' €');
    if (r.reputation) P.push('+' + r.reputation + ' de réputation');
    if (r.xp) P.push('+' + r.xp + " points d'expérience");
    s += '<div class="port" style="animation-delay:' + (L.length*.5+.5).toFixed(2) + 's">'
      + '<p class="su">Le compte d\'Ardit</p><b style="font-size:20px">Réglé</b>'
      + '<div class="d" style="flex-wrap:wrap">'
      + P.map(t => '<span style="font-size:12.5px">' + t + '</span>').join('') + '</div>'
      + (r.objet && r.objet.nom
         ? '<p style="font-size:12.5px;color:#f0c46a;margin-top:14px;'
           + 'font-family:system-ui,sans-serif">' + r.objet.nom + '</p>' : '')
      + '<button id="ok2">Redescendre au port</button></div>';
  }
  W2.innerHTML = s;
  const b = document.getElementById('ok2');
  if (b) b.onclick = () => location.href =
    (r.niveau && r.niveau.monte) ? 'niveau.html' : 'rue.html';
}

function poser(r){
  LA = true; decor();
  const C = r.cours || [];
  let s = '<div class="dit">'
    + '<p style="animation-delay:.1s">Elle te voit entrer et elle ne bouge pas. '
    + 'Elle attend que tu arrives jusqu\'à elle.</p>'
    + '<p class="parle" style="animation-delay:.7s">« Alors. Qu\'est-ce qui t\'amène ? »</p>'
    + '<p style="animation-delay:1.3s">Tu demandes ce qui se vend en ce moment. '
    + 'Elle essuie un verre, sans se presser.</p>'
    + '<p class="parle" style="animation-delay:1.9s">'
    + (r.lien >= 30
       ? '« Approche. Je vais te dire exactement où ça en est. »'
       : '« Je peux te dire ce que j\'entends. Le reste, tu le verras bien. »')
    + '</p></div>';

  s += '<p class="tt">Ce qui se dit au port</p><div class="ard">'
    + C.map((c, i) => {
        const [t, coul, note] = mot(+c.demande, +c.pression, c.precis);
        return '<div class="li"><span class="nb">' + (i+1) + '</span>'
          + '<span class="nm">' + c.nom + '</span>'
          + '<span class="mo" style="color:' + coul + '">' + t
          + (c.precis && note ? '<em>' + note + '</em>' : '') + '</span></div>';
      }).join('') + '</div>';

  /* elle est revenue de Majorque : elle a quelque chose à dire */
  if (r.revenue && !localStorage.getItem('bd-nuria-revenue')){
    try { localStorage.setItem('bd-nuria-revenue', '1'); } catch(e){}
    s = '<div class="dit">'
      + '<p style="animation-delay:.1s">La taverne a rouvert. Elle est derrière '
      + 'son comptoir comme si elle n\'était jamais partie.</p>'
      + '<p style="animation-delay:.7s">Elle te voit. Elle ne dit rien tout de suite.</p>'
      + '<p class="parle" style="animation-delay:1.3s">« Il est mort mardi. »</p>'
      + '<p style="animation-delay:1.9s">Elle essuie le comptoir avec le plat de la main, '
      + 'un geste qui ne sert à rien.</p>'
      + '<p class="parle" style="animation-delay:2.5s">« J\'ai eu six jours. »</p>'
      + '<p style="animation-delay:3.1s">Elle te sert un verre que tu n\'as pas demandé, '
      + 'et elle va servir quelqu\'un d\'autre.</p></div>'
      + '<p class="mot" style="animation-delay:3.7s">Elle ne t\'a pas remercié. '
      + 'Elle n\'aura pas à le faire.</p>';
    document.getElementById('w').innerHTML = s;
    return;
  }

  /* selon où on en est avec Ardit */
  AR = r.ardit;
  if (!AR)
    s += '<div class="choix" style="animation-delay:2.6s">'
      + '<button id="parler"><b>« Tu as l\'air d\'avoir quelque chose à dire. »</b>'
      + '<span class="s">Elle t\'a regardé deux fois depuis que tu es entré.</span>'
      + '</button></div>';
  else if (AR.etape === 2 && AR.etat !== 'finie')
    s += '<div class="choix" style="animation-delay:2.6s">'
      + '<button id="rendre"><b>« Je reviens de Majorque. »</b>'
      + '<span class="s">Elle attend cette phrase depuis que tu es parti.</span>'
      + '</button></div>';
  else if (AR.etape === 1)
    s += '<p class="mot">« Vous êtes encore là ? Il est à Majorque, pas dans ma salle. »</p>';

  s += '<p class="mot">'
    + (r.lien >= 30
       ? 'Elle t\'en dit plus qu\'aux autres. Ça se mérite, et ça se garde.'
       : 'Elle te jauge encore. Reviens souvent, elle finira par en dire davantage.')
    + '</p>';
  document.getElementById('w').innerHTML = s;
  const p = document.getElementById('parler');
  if (p) p.onclick = poserArdit;
  const q = document.getElementById('rendre');
  if (q) q.onclick = poserRetour;
}

document.getElementById('ret').onclick = () => location.href = 'rue.html';

(async () => {
  let d;
  try {
    d = await BD.charger();
    if (!d){ location.href = 'index.html'; return; }
  } catch(e){ LA = true; decor(); return; }
  if (d.parti_le || d.port !== 'barcelone'){ location.href = 'jeu.html'; return; }

  const c = d.competences || {};
  MOI = { negociation: +c.negociation || 0, discussion: +c.discussion || 0 };
  const r = await BD.agir('la_taverne');
  if (r.ok) poser(r);
  else if (r.pourquoi === 'partie') poserPartie(r);
  else if (r.pourquoi === 'trop_tot') poserFerme(r);
  else if (r.pourquoi === 'elle_est_partie') poserPartie(r);
  else location.href = 'rue.html';
})();
