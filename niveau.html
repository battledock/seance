<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#101f2e">
<title>Battle Dock — Niveau</title>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=DM+Serif+Display&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="couleurs.css?v=2">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none}
html,body{height:100%;overflow:hidden;background:var(--nuit-mer);
  font-family:'Nunito',system-ui,sans-serif;color:#fff}

#fond{position:fixed;inset:0}
#fond svg{display:block;width:100%;height:100%}
#fond::after{content:"";position:absolute;inset:0;
  background:radial-gradient(ellipse 90% 70% at 50% 44%,
    rgba(11,26,42,.42) 0%, rgba(11,26,42,.86) 68%, rgba(9,20,34,.97) 100%)}

/* la lueur qui monte derrière le chiffre */
.lueur{position:fixed;left:50%;top:34%;transform:translate(-50%,-50%);
  width:340px;height:340px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(255,216,148,.3) 0%,rgba(255,200,120,.1) 42%,transparent 68%);
  opacity:0;animation:jaillir 1.6s .2s ease-out forwards}
@keyframes jaillir{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}
  60%{opacity:1}100%{opacity:.85;transform:translate(-50%,-50%) scale(1)}}

.page{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;
  overflow-y:auto;
  padding:calc(env(safe-area-inset-top) + 20px) 24px
          calc(env(safe-area-inset-bottom) + 24px)}
.page::-webkit-scrollbar{display:none}

/* le titre */
.haut{flex:0 0 auto;text-align:center;margin-top:6vh}
.page.charge .haut{margin-top:2vh}
.page.charge .haut .n{font-size:76px;line-height:1}
.page.charge .gains{margin:16px 0 0}
.page.charge .bas{margin-top:18px}
.haut .sur{font-size:9.5px;letter-spacing:.4em;text-transform:uppercase;
  color:rgba(255,255,255,.5);padding-left:.4em}
.haut .n{font-size:120px;font-weight:700;line-height:.86;margin-top:10px;
  color:#ffd894;text-shadow:0 0 60px rgba(255,200,120,.4),0 4px 30px rgba(4,12,22,.6)}
.haut .m{font-size:13px;color:rgba(255,255,255,.72);margin-top:14px;
  font-family:system-ui,sans-serif;line-height:1.6}

/* ce qu'on gagne */
.gains{flex:0 0 auto;display:flex;flex-direction:column;gap:11px;margin:auto 0;
  min-height:0;margin:20px 0}
.gain{display:flex;align-items:center;gap:14px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);
  border-radius:10px;padding:15px 16px;
  opacity:0;transform:translateX(-16px);
  animation:venir .6s cubic-bezier(.2,.85,.3,1) forwards}
.gain:nth-child(1){animation-delay:.9s}
.gain:nth-child(2){animation-delay:1.1s}
@keyframes venir{to{opacity:1;transform:none}}
.gain .ic{flex:0 0 40px;height:40px;border-radius:9px;
  display:flex;align-items:center;justify-content:center}
.gain .ic svg{width:21px;height:21px;fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.gain.pts .ic{background:rgba(240,196,106,.18)}
.gain.pts .ic svg{stroke:#f0c46a}
.gain.nrj .ic{background:rgba(140,224,168,.18)}
.gain.nrj .ic svg{stroke:#8ce0a8}
.gain .tx{flex:1;min-width:0}
.gain .tx b{display:block;font-size:15px;font-weight:700}
.gain .tx span{display:block;font-size:10.5px;color:rgba(255,255,255,.5);margin-top:3px;
  font-family:system-ui,sans-serif}
.gain .v{flex:0 0 auto;font-size:22px;font-weight:700}
.gain.pts .v{color:#f0c46a}
.gain.nrj .v{color:#8ce0a8}

/* le bouton */
.bas{flex:0 0 auto;margin-top:auto;padding-top:18px;opacity:0;animation:venir .6s 1.4s cubic-bezier(.2,.85,.3,1) forwards}
.bas button{width:100%;padding:18px;border:0;border-radius:9px;cursor:pointer;
  background:linear-gradient(180deg,#f6cd76,#dca94a);color:#1c1a16;
  box-shadow:0 6px 26px rgba(240,196,106,.34);
  font-family:'Nunito',system-ui,sans-serif;font-size:15px;font-weight:700;letter-spacing:.08em;
  transition:transform .12s}
.bas button:active{transform:scale(.984)}
.bas .sous{font-size:10.5px;color:rgba(255,255,255,.44);text-align:center;margin-top:11px;
  font-family:system-ui,sans-serif}

.o0{animation:v0 26s linear infinite}.o1{animation:v1 34s linear infinite}
.o2{animation:v0 44s linear infinite}.o3{animation:v1 56s linear infinite}
@keyframes v0{to{transform:translateX(60px)}}
@keyframes v1{to{transform:translateX(-60px)}}
.paill{animation:brille 3.2s ease-in-out infinite}
.p1{animation-duration:2s;animation-delay:-.5s}
.p2{animation-duration:4.4s;animation-delay:-1.7s}
.p3{animation-duration:1.6s;animation-delay:-.8s}
.p4{animation-duration:5.2s;animation-delay:-2.6s}
.p5{animation-duration:2.7s;animation-delay:-1.1s}
@keyframes brille{0%,100%{opacity:.1}45%{opacity:.9}}
.etoile{animation:scint 4s ease-in-out infinite}
.e1{animation-duration:5.6s;animation-delay:-1.4s}
.e2{animation-duration:3.2s;animation-delay:-2.6s}
.e3{animation-duration:6.8s;animation-delay:-.7s}
@keyframes scint{0%,100%{opacity:.15}50%{opacity:.7}}
@media (prefers-reduced-motion:reduce){*{animation:none !important}}

/* ---------- le feu d'artifice ---------- */
#feu{position:fixed;inset:0;z-index:9;pointer-events:none;
  mix-blend-mode:screen}
#feu svg{display:block;width:100%;height:100%}
/* la fusée qui monte */
.fusee{animation:monte var(--d) cubic-bezier(.15,.6,.5,1) forwards}
@keyframes monte{
  0%{opacity:0;transform:translateY(0)}
  8%{opacity:1}
  92%{opacity:1}
  100%{opacity:0;transform:translateY(var(--h))}}
/* l'éclat */
.ecl{opacity:0;animation:eclate var(--e) ease-out var(--r) forwards}
@keyframes eclate{
  0%{opacity:0;transform:scale(.05)}
  6%{opacity:1;transform:scale(.3)}
  46%{opacity:.9}
  100%{opacity:0;transform:scale(1)}}
/* les étincelles qui retombent */
.et{opacity:0;animation:tombe var(--e) cubic-bezier(.1,.5,.4,1) var(--r) forwards}
@keyframes tombe{
  0%{opacity:0;transform:translate(0,0) scale(1)}
  8%{opacity:1}
  70%{opacity:.8}
  100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(.3)}}
/* le halo qui éclaire le ciel un instant */
.halo{opacity:0;animation:flash var(--e) ease-out var(--r) forwards}
@keyframes flash{0%{opacity:0}8%{opacity:.34}100%{opacity:0}}

/* le grand chiffre pulse au rythme des tirs */
.page.cinq .haut .n{animation:battre 2.6s ease-in-out infinite}
@keyframes battre{0%,100%{filter:drop-shadow(0 4px 22px rgba(240,196,106,.3))}
  50%{filter:drop-shadow(0 4px 40px rgba(255,214,140,.62))}}
.gain.eur .ic{background:rgba(240,196,106,.14)}
.gain.eur .ic svg{stroke:#f0c46a}
.gain.eur .v{color:#f0c46a}
.gain.cal .ic{background:rgba(168,140,90,.16)}
.gain.cal .ic svg{stroke:#c9a374}
.gain.cal .v{color:#c9a374}
.gain.obj .ic{padding:4px;background:rgba(240,196,106,.1)}
.gain.obj .ic svg{width:100%;height:100%}
.gain.obj .v{font-size:12px;color:#8ce0a8}
.gain.obj .ic svg{stroke:none}
.page.cinq .haut .sur{color:#f0c46a}
.page.cinq .gain{border-color:rgba(240,196,106,.24)}

/* ---------- la voix des gens ----------
   Courier Prime ne sert plus qu'à ça : ce qu'un personnage dit.
   Le reste de la page est en Nunito, comme dans tout le jeu. */
.parle, .dit p.parle, .voix{
  font-family:'Courier Prime',monospace;letter-spacing:-.01em}
</style>
</head>

    <p class="sur">Tu passes</p>
    <p class="n" id="n">2</p>

  <div id="titre"></div>

  <div class="bas">

</div>

/* ============================================================
   LE FEU D'ARTIFICE — pour le cinquième palier
   ============================================================ */
const FEUX = ['#ffd88a','#9cf0b8','#ff88a4','#96c8ff','#ffb060','#d89aff'];

function feuDArtifice(){
  const el = document.createElement('div');
  el.id = 'feu';
  document.body.appendChild(el);
  const L = innerWidth, H = innerHeight;
  let s = '<svg viewBox="0 0 ' + L + ' ' + H + '" xmlns="http://www.w3.org/2000/svg">';

  /* neuf tirs, étalés dans le temps */
  for (let i = 0; i < 9; i++){
    const c = FEUX[i % FEUX.length];
    const x = L * (.12 + (i * .37) % .76);
    const yh = H * (.1 + ((i * .19) % .2));      /* où ça éclate */
    const mont = 1 + (i % 3) * .22;                /* durée de la montée */
    const dep = i * .58 + (i % 2) * .3;            /* quand ça part */
    const ecl = 1.5 + (i % 4) * .25;               /* durée de l'éclat */

    /* la traînée qui monte */
    s += '<g class="fusee" style="--d:' + mont.toFixed(2) + 's;--h:'
      + (yh - H).toFixed(0) + 'px;animation-delay:' + dep.toFixed(2) + 's">'
      + '<path d="M' + x.toFixed(0) + ' ' + H + ' v-14" stroke="' + c
      + '" stroke-width="2.2" stroke-linecap="round" opacity=".8"/>'
      + '<circle cx="' + x.toFixed(0) + '" cy="' + (H - 4) + '" r="2.4" fill="'
      + c + '"/></g>';

    const r = (dep + mont * .92).toFixed(2);

    /* le halo dans le ciel */
    s += '<circle class="halo" cx="' + x.toFixed(0) + '" cy="' + yh.toFixed(0)
      + '" r="' + (H * .1).toFixed(0) + '" fill="' + c
      + '" style="--e:' + ecl.toFixed(2) + 's;--r:' + r + 's"/>';

    /* le cœur de l'éclat */
    s += '<circle class="ecl" cx="' + x.toFixed(0) + '" cy="' + yh.toFixed(0)
      + '" r="' + (H * .05).toFixed(0) + '" fill="none" stroke="' + c
      + '" stroke-width="1.4" style="--e:' + ecl.toFixed(2) + 's;--r:' + r + 's"/>';

    /* les étincelles : une couronne qui s'ouvre et retombe */
    const n = 20 + (i % 3) * 6;
    for (let k = 0; k < n; k++){
      const a = (k / n) * Math.PI * 2 + i;
      const d2 = H * (.06 + (k % 4) * .016);
      const tx = Math.cos(a) * d2;
      const ty = Math.sin(a) * d2 + H * .05;      /* la gravité les tire vers le bas */
      s += '<circle class="et" cx="' + x.toFixed(0) + '" cy="' + yh.toFixed(0)
        + '" r="' + (2 + (k % 3) * .9).toFixed(1) + '" fill="'
        + (k % 5 === 0 ? '#fff8e0' : c) + '"'
        + ' style="--e:' + ecl.toFixed(2) + 's;--r:' + r + 's;--tx:'
        + tx.toFixed(0) + 'px;--ty:' + ty.toFixed(0) + 'px"/>';
    }
  }
  el.innerHTML = s + '</svg>';
  /* on nettoie quand c'est fini */
  setTimeout(() => el.remove(), 12000);
}

/* ============================================================
   LE PORT À L'AUBE — le socle : charte, lumière, matière
   ============================================================ */

const W = 480;
const OEIL = 11;
const FOCALE = 727;
const HORIZON = 214;

const px  = (m, d) => m * FOCALE / d;
const sol = d => HORIZON + OEIL * FOCALE / d;
const rnd = s => { const x = Math.sin(s * 127.1) * 43758.5; return x - Math.floor(x); };
const rnd2 = (a, b) => { const x = Math.sin(a * 127.1 + b * 311.7) * 43758.5; return x - Math.floor(x); };

/* ---------- le soleil ---------- */
/* bas sur l'horizon, un peu à gauche du milieu : c'est lui qui décide de tout */
const SOLEIL = { x: 196, y: 200, r: 15 };

/* ---------- les couleurs ---------- */
function hx(c){ return [parseInt(c.slice(1,3),16), parseInt(c.slice(3,5),16), parseInt(c.slice(5,7),16)]; }
function ch(a){ return '#' + a.map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2,'0')).join(''); }
function mel(a, b, k){ const A = hx(a), B = hx(b); return ch([0,1,2].map(i => A[i] + (B[i]-A[i]) * k)); }

/* la lumière du matin : dorée et rasante */
const OR   = '#ffcf8a';
const OMBRE= '#2a3f5c';   /* les ombres tirent vers le bleu */
const BRUME_C = '#e8c9a0';

/* une face éclairée */
const clair  = (c, k) => mel(c, OR, k === undefined ? .34 : k);
/* une face à l'ombre */
const sombre = (c, k) => mel(c, OMBRE, k === undefined ? .34 : k);
/* la brume selon la distance */
const brume = d => Math.min(.78, 1 - Math.exp(-d / 2100));
const voiler = (c, d) => mel(c, BRUME_C, brume(d) * .82);

/* ---------- le cadre ---------- */
let HAUT = -180, BAS = 900;
const D_BORD = 21;
function cadrer(l, h){
  const total = W * h / l;
  const yb = sol(D_BORD);
  HAUT = yb - total * .78;
  BAS  = yb + total * .22;
  return { y: HAUT, h: total };
}

/* ---------- les ombres portées ---------- */
/* le soleil est bas et à gauche : les ombres partent vers la droite et vers nous */
function ombreDe(x, ySol, larg, haut, d){
  /* plus l'objet est haut, plus l'ombre est longue */
  const lg = haut * 2.6, dec = haut * 1.5;
  return `<path d="M${(x).toFixed(1)} ${ySol.toFixed(1)}
    h${larg.toFixed(1)} l${dec.toFixed(1)} ${(lg*.34).toFixed(1)}
    h${(-larg*.9).toFixed(1)} z" fill="${OMBRE}" opacity=".2"/>`;
}

/* ---------- le grain : une texture discrète sur tout ---------- */
function grain(){
  return `<filter id="b-grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" seed="7"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope=".055"/></feComponentTransfer>
    <feComposite operator="in" in2="SourceGraphic"/></filter>`;
}


/* ============================================================
   LE CIEL ET L'EAU — l'aube
   ============================================================ */

function defs(){
  return `<defs>
  ${grain()}
  <linearGradient id="b-ciel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#1c3a68"/>
    <stop offset="14%"  stop-color="#2f5a8c"/>
    <stop offset="32%"  stop-color="#4d7ba8"/>
    <stop offset="52%"  stop-color="#7a9cbc"/>
    <stop offset="68%"  stop-color="#b0b4b8"/>
    <stop offset="80%"  stop-color="#dcb99a"/>
    <stop offset="90%"  stop-color="#f2c98e"/>
    <stop offset="97%"  stop-color="#ffd89a"/>
    <stop offset="100%" stop-color="#ffe4ae"/></linearGradient>

  <radialGradient id="b-halo" cx="0.5" cy="0.5">
    <stop offset="0%"   stop-color="#fff8e0" stop-opacity=".95"/>
    <stop offset="18%"  stop-color="#ffe0a4" stop-opacity=".62"/>
    <stop offset="46%"  stop-color="#ffc880" stop-opacity=".26"/>
    <stop offset="100%" stop-color="#ffb870" stop-opacity="0"/></radialGradient>

  <radialGradient id="b-disque" cx="0.5" cy="0.5">
    <stop offset="0%"   stop-color="#fffdf4"/>
    <stop offset="62%"  stop-color="#fff2c8"/>
    <stop offset="100%" stop-color="#ffdf9a"/></radialGradient>

  <linearGradient id="b-eau" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#c9a878"/>
    <stop offset="4%"   stop-color="#9a8f86"/>
    <stop offset="14%"  stop-color="#4a6480"/>
    <stop offset="34%"  stop-color="#2e4d70"/>
    <stop offset="66%"  stop-color="#22405f"/>
    <stop offset="100%" stop-color="#1a3350"/></linearGradient>

  <linearGradient id="b-quai" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#a09480"/>
    <stop offset="6%"   stop-color="#c4b092"/>
    <stop offset="26%"  stop-color="#d8c19c"/>
    <stop offset="62%"  stop-color="#cdb693"/>
    <stop offset="100%" stop-color="#b8a184"/></linearGradient>

  <linearGradient id="b-chemin" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#fff2d0" stop-opacity=".85"/>
    <stop offset="18%"  stop-color="#ffe0a8" stop-opacity=".5"/>
    <stop offset="52%"  stop-color="#ffcf88" stop-opacity=".2"/>
    <stop offset="100%" stop-color="#ffc070" stop-opacity="0"/></linearGradient>
  <linearGradient id="b-lat" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"   stop-color="#fff" stop-opacity="0"/>
    <stop offset="20%"  stop-color="#fff" stop-opacity=".45"/>
    <stop offset="50%"  stop-color="#fff" stop-opacity="1"/>
    <stop offset="80%"  stop-color="#fff" stop-opacity=".45"/>
    <stop offset="100%" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <mask id="b-mask-lat">
    <rect x="0" y="0" width="480" height="900" fill="url(#b-lat)"/></mask>
  <filter id="b-flou"><feGaussianBlur stdDeviation="3.4"/></filter>
  <filter id="b-flou2"><feGaussianBlur stdDeviation="9"/></filter>
  <linearGradient id="b-horizon" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#ffe0aa" stop-opacity="0"/>
    <stop offset="50%"  stop-color="#ffd9a0" stop-opacity=".55"/>
    <stop offset="100%" stop-color="#e8c090" stop-opacity="0"/></linearGradient>
  </defs>`;
}

/* ---------- le ciel ---------- */
function ciel(){
  let s = `<rect x="0" y="${HAUT}" width="${W}" height="${(sol(4000)-HAUT).toFixed(1)}"
    fill="url(#b-ciel)"/>`;

  /* le halo, très large */
  s += `<ellipse cx="${SOLEIL.x}" cy="${SOLEIL.y}" rx="260" ry="150"
    fill="url(#b-halo)"/>`;

  /* les nuages : des bandes fines, plus denses près de l'horizon,
     avec le dessous éclairé par le soleil rasant */
  s += `<g class="nuages">`;
  for (let i = 0; i < 26; i++){
    const t = i / 26;
    /* on tasse vers l'horizon */
    const cy = HAUT + 24 + Math.pow(t, .55) * (SOLEIL.y - HAUT - 40);
    const cx = -120 + rnd(i*3+1) * 720;
    const w  = (26 + rnd(i*5+2) * 96) * (1 - t * .48);
    const h  = (2.4 + rnd(i*7+3) * 4) * (1 - t * .5);
    /* plus on est près du soleil, plus le nuage est chaud */
    const dSol = Math.hypot(cx - SOLEIL.x, (cy - SOLEIL.y) * 1.7) / 300;
    const k = Math.max(0, 1 - dSol);
    const haut2 = mel('#5d7492', '#f0d0a8', k * .9);
    const bas2  = mel('#8fa0b4', '#ffdca4', Math.min(1, k * 1.25));
    const op = (.16 + rnd(i*11+4) * .3) * (1 - t * .3);
    s += `<g opacity="${op.toFixed(2)}">`;
    s += `<ellipse cx="${cx.toFixed(0)}" cy="${cy.toFixed(1)}" rx="${w.toFixed(0)}"
      ry="${h.toFixed(1)}" fill="${haut2}"/>`;
    s += `<ellipse cx="${(cx + w*.22).toFixed(0)}" cy="${(cy + h*.5).toFixed(1)}"
      rx="${(w*.72).toFixed(0)}" ry="${(h*.6).toFixed(1)}" fill="${bas2}"/>`;
    if (rnd(i*13+5) > .55)
      s += `<ellipse cx="${(cx - w*.4).toFixed(0)}" cy="${(cy - h*.4).toFixed(1)}"
        rx="${(w*.36).toFixed(0)}" ry="${(h*.5).toFixed(1)}" fill="${haut2}"/>`;
    s += `</g>`;
  }
  s += `</g>`;

  /* quelques étoiles qui s'éteignent, tout en haut */
  for (let i = 0; i < 22; i++){
    const y = HAUT + rnd(i*17+9) * 160;
    s += `<circle class="etoile e${i%4}" cx="${(rnd(i*19+2)*W).toFixed(0)}" cy="${y.toFixed(0)}"
      r="${(.5 + rnd(i*23+7)*.7).toFixed(2)}" fill="#fff"
      opacity="${(.5 * (1 - (y - HAUT) / 200)).toFixed(2)}"/>`;
  }

  /* le disque, posé juste au-dessus de l'horizon */
  s += `<circle cx="${SOLEIL.x}" cy="${SOLEIL.y}" r="${SOLEIL.r * 2.1}"
    fill="#ffd894" opacity=".3"/>`;
  s += `<circle class="disque" cx="${SOLEIL.x}" cy="${SOLEIL.y}" r="${SOLEIL.r}"
    fill="url(#b-disque)"/>`;
  return s;
}

/* ---------- l'eau ---------- */
function eau(){
  const yh = sol(4000), yb = sol(D_BORD);
  let s = `<rect x="0" y="${yh.toFixed(1)}" width="${W}" height="${(yb-yh+3).toFixed(1)}"
    fill="url(#b-eau)"/>`;
  /* la bande de brume qui fond ciel et eau */
  s += `<rect x="0" y="${(yh-7).toFixed(1)}" width="${W}" height="14" fill="url(#b-horizon)"/>`;
  /* le ciel se reflète dans l'eau : une frange claire sous l'horizon */
  s += `<rect x="0" y="${yh.toFixed(1)}" width="${W}" height="${(sol(700)-yh).toFixed(1)}"
    fill="#c9a878" opacity=".2"/>`;
  s += `<rect x="0" y="${sol(700).toFixed(1)}" width="${W}" height="${(sol(220)-sol(700)).toFixed(1)}"
    fill="#6d7f92" opacity=".12"/>`;

  /* le chemin du soleil : trois cônes superposés, flous, de plus en plus larges */
  s += `<g mask="url(#b-mask-lat)">`;
  [[16, 152, .9, 'b-flou2'], [11, 96, .7, 'b-flou'], [6, 52, .55, 'b-flou']]
    .forEach(([a, b2, op, f]) => {
      s += `<path d="M${(SOLEIL.x-a).toFixed(0)} ${yh.toFixed(1)}
        L${(SOLEIL.x+a).toFixed(0)} ${yh.toFixed(1)}
        C${(SOLEIL.x+b2*.5).toFixed(0)} ${(yh+(yb-yh)*.5).toFixed(1)}
         ${(SOLEIL.x+b2*.8).toFixed(0)} ${(yh+(yb-yh)*.8).toFixed(1)}
         ${(SOLEIL.x+b2).toFixed(0)} ${(yb+16).toFixed(1)}
        L${(SOLEIL.x-b2).toFixed(0)} ${(yb+16).toFixed(1)}
        C${(SOLEIL.x-b2*.8).toFixed(0)} ${(yh+(yb-yh)*.8).toFixed(1)}
         ${(SOLEIL.x-b2*.5).toFixed(0)} ${(yh+(yb-yh)*.5).toFixed(1)}
         ${(SOLEIL.x-a).toFixed(0)} ${yh.toFixed(1)} Z"
        fill="url(#b-chemin)" opacity="${op}" filter="url(#${f})"/>`;
    });
  s += `</g>`;

  /* les paillettes : de plus en plus grandes en approchant */
  for (let i = 0; i < 240; i++){
    const t = Math.pow(rnd(i*3+1), .7);
    const y = yh + 2 + t * (yb - yh - 4);
    const etal = 16 + t * 138;
    const x = SOLEIL.x + (rnd(i*7+2) - .5) * 2 * etal;
    const w = (1.2 + t * 15) * (.35 + rnd(i*11+3) * 1.05);
    const h = Math.max(.5, (.4 + t * 1.9) * (.5 + rnd(i*13+4)));
    const op = (.24 + rnd(i*17+5) * .58) * Math.pow(Math.max(0, 1 - Math.abs(x - SOLEIL.x) / (etal * 1.1)), 1.5);
    if (op <= .04) continue;
    s += `<rect class="paill p${i%6}" x="${(x-w/2).toFixed(1)}" y="${y.toFixed(1)}"
      width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="${(h/2).toFixed(1)}"
      fill="${i % 5 ? '#ffe9b4' : '#fffdf0'}" opacity="${op.toFixed(2)}"/>`;
  }

  /* la houle : des traits qui s'espacent en approchant */
  for (let n = 0; n < 9; n++){
    const d = 1400 / Math.pow(n + 1, 1.22);
    const y = sol(d), amp = px(.26, d), esp = px(8, d);
    if (y > yb - 2 || y < yh) continue;
    s += `<g class="onde o${n % 4}">`;
    for (let i = 0; i < 2; i++){
      const yy = y + i * esp * .42;
      if (yy > yb - 2) break;
      let p = `M-120 ${yy.toFixed(1)} `;
      for (let k = 0; k < 18; k++) p += `q${(esp*.5).toFixed(1)} ${(-amp).toFixed(1)} ${esp.toFixed(1)} 0 `;
      /* les vagues près du chemin lumineux sont dorées */
      s += `<path d="${p}" stroke="#c9dcea" stroke-width="${Math.max(.4, amp*.3).toFixed(2)}"
        fill="none" opacity="${(.13 - n*.011).toFixed(3)}"/>`;
    }
    s += `</g>`;
  }
  return s;
}

/* ---------- un reflet vertical, brisé par l'eau ---------- */
/* on répète des tranches horizontales décalées : c'est ce qui fait « eau » */
function reflet(x, larg, yBase, haut, couleur, force){
  let s = `<g opacity="${(force || .3)}">`;
  const n = Math.min(26, Math.max(6, Math.round(haut * .5)));
  for (let i = 0; i < n; i++){
    const t = i / n;
    const y = yBase + t * haut * .62;
    const dec = Math.sin(i * 1.7 + x) * (1.2 + t * 4.5);
    const w = larg * (1 + t * .12);
    const op = (1 - t) * (1 - t) * .9;
    s += `<rect x="${(x + dec - (w-larg)/2).toFixed(1)}" y="${y.toFixed(1)}"
      width="${w.toFixed(1)}" height="${(haut * .62 / n + .6).toFixed(1)}"
      fill="${couleur}" opacity="${op.toFixed(3)}"/>`;
  }
  return s + `</g>`;
}


/* le large, en fond */
function fond(){
  const el = document.getElementById('fond');
  const total = W * innerHeight / innerWidth;
  HAUT = HORIZON - total * .38;
  BAS  = HAUT + total;
  el.innerHTML = '<svg viewBox="0 ' + HAUT.toFixed(1) + ' ' + W + ' ' + total.toFixed(1) + '" '
    + 'preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">'
    + defs() + ciel() + eau() + '</svg>';
}
fond();

const MOTS = {
  2: "Cinq traversées, et on commence à te reconnaître sur les quais.",
  3: "Tu ne te perds plus. C'est déjà quelque chose.",
  4: "Les autres dockers te saluent maintenant.",
  5: "On te propose des choses qu'on ne propose pas à tout le monde.",
  6: "Ton nom circule d'un port à l'autre.",
  7: "On ne te prend plus pour un débutant.",
  8: "Tu commences à connaître les bonnes personnes."
};

(async () => {
  let d;
  try {
    d = await BD.charger();
    if (!d){ location.href = 'index.html'; return; }
  } catch(e){ return; }

  /* on n'affiche cet écran que s'il y a vraiment des points à placer */
  const pts = Number(d.points || 0);
  if (pts < 1){ retourner(d); return; }

  const niv = Number(d.niveau || 1);
  /* combien de niveaux d'un coup : deux points par niveau */
  const gagnes = Math.max(1, Math.round(pts / 2));

  document.getElementById('n').textContent = niv;

  /* ce que ce niveau apporte */
  const C = CADEAUX[niv] || { points:pts, energie:gagnes };
  document.getElementById('m').textContent = C.mot || MOTS[niv]
    || (gagnes > 1 ? 'Tu montes vite.' : 'Tu montes.');

  /* le cinquième : on tire le feu d'artifice */
  if (C.fete){
    document.querySelector('.page').classList.add('cinq');
    feuDArtifice();
  }

  const ICO = {
    pts:'<path d="M12 3l2.6 5.6L21 9.4l-4.6 4.3 1.2 6.3L12 17l-5.6 3 1.2-6.3L3 9.4l6.4-.8z"/>',
    nrj:'<path d="M13 2L4.5 13H11l-1 9 8.5-11H12z"/>',
    eur:'<path d="M16 6.5a6.5 6.5 0 1 0 0 11M4 10.5h9M4 14h9"/>',
    cal:'<path d="M4 9h16v11H4zM4 9l2.5-5h11L20 9M9.5 13h5"/>'
  };
  const G = [];
  G.push(['pts', 'Points de compétence', 'À placer où tu veux, dans ta fiche.',
    '+' + pts]);
  if (C.energie) G.push(['nrj', 'Énergie maximale',
    'Tu tiens plus longtemps en mer.', '+' + C.energie]);
  if (C.euros) G.push(['eur', 'Une prime', 'On te la doit depuis un moment.',
    '+' + C.euros + ' €']);
  if (C.cale) G.push(['cal', 'Une place de cale',
    'En plus de ce que porte ta barque.', '+' + C.cale]);

  let h = G.map(([k, t, s2, v]) =>
    '<div class="gain ' + k + '"><span class="ic"><svg viewBox="0 0 24 24">'
    + ICO[k] + '</svg></span><span class="tx"><b>' + t + '</b>'
    + '<span>' + s2 + '</span></span><span class="v">' + v + '</span></div>').join('');
  /* l'objet reçu, s'il y en a un */
  if (C.objet && OBJETS[C.objet])
    h += '<div class="gain obj"><span class="ic">' + OBJETS[C.objet].svg + '</span>'
      + '<span class="tx"><b>' + OBJETS[C.objet].nom + '</b>'
      + '<span>' + OBJETS[C.objet].note + '</span></span>'
      + '<span class="v">reçu</span></div>';
  document.getElementById('gains').innerHTML = h;
  /* beaucoup de choses à montrer : on resserre tout */
  if (G.length + (C.objet ? 1 : 0) > 2 || C.fete)
    document.querySelector('.page').classList.add('charge');

  document.getElementById('sous').textContent =
    "Prochain palier à " + (d.seuil_xp || 60) + " points d'expérience.";

  /* le bouton ouvre la fiche, là où l'on se trouve */
  document.getElementById('ok').onclick = () => retourner(d, true);
})();

function retourner(d, fiche){
  let ou = d.parti_le ? 'mer.html'
    : d.port === 'barcelone' ? 'barcelone.html'
    : d.port === 'palma' ? 'palma.html'
    : d.port === 'ajaccio' ? 'ajaccio.html'
    : 'jeu.html';
  /* si Toussaint attend avec la caisse, il passe avant */
  if (ou === 'jeu.html'){
    const aCaisse = (d.cale || []).some(o => o && o.quoi === 'caisse');
    const vecue = (d.rencontres || []).includes('caisse_toussaint');
    if (aCaisse && !vecue){ location.href = 'retour.html'; return; }
  }
  location.href = ou + (fiche ? '?fiche=1' : '');
}

let t = null;
addEventListener('resize', () => { clearTimeout(t); t = setTimeout(fond, 200); });
