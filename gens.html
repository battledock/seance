<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#f5a53a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Les gens — Battle Dock</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="chaud.css?v=2">
<style>
.qui{position:relative;padding:16px 17px;margin-bottom:13px;border-radius:18px;
  background:var(--creme);border:3px solid var(--encre);}
.qui .l1{display:flex;align-items:flex-start;gap:13px;margin-bottom:13px}
.qui .ini{flex:0 0 48px;height:48px;border-radius:14px;display:flex;
  align-items:center;justify-content:center;
  font-family:'DM Serif Display',Georgia,serif;font-size:23px;
  border:2.5px solid var(--encre)}
.qui .co{flex:1;min-width:0}
.qui .co b{display:block;font-family:'DM Serif Display',Georgia,serif;
  font-size:21px;line-height:1.1}
.qui .co .q{display:block;font-size:12.5px;font-weight:700;
  color:rgba(18,48,63,.6);margin-top:4px}
.qui .co .ou{display:block;font-size:11px;font-weight:600;
  color:rgba(18,48,63,.44);margin-top:3px}
.lien{margin-bottom:11px}
.lien .tt{display:flex;justify-content:space-between;gap:10px;margin-bottom:6px}
.lien .tt b{font-size:13px;font-weight:800}
.lien .tt span{font-family:'DM Serif Display',Georgia,serif;font-size:16px;
  color:rgba(18,48,63,.56)}
.lien .ba{height:11px;border-radius:7px;background:rgba(18,48,63,.1);
  border:2px solid var(--encre);overflow:hidden}
.lien .ba i{display:block;height:100%;transition:width .7s cubic-bezier(.3,.9,.3,1)}
.qui .mot{font-size:13px;font-weight:600;color:rgba(18,48,63,.66);line-height:1.5}
.qui.inconnu{background:rgba(253,246,230,.6);border-style:dashed;opacity:.75}
.qui.inconnu .ini{background:rgba(18,48,63,.1);color:rgba(18,48,63,.4)}
.qui.inconnu .mot{font-style:italic}
.qui.trahi{background:#fdeeeb}
</style>
</head>
<body>

<div class="pont">
  <div class="tete">
    <span class="q"><b>Les gens</b><span id="g-sous">—</span></span>
    <button class="retour" id="retour">‹ Retour</button>
  </div>
  <div id="corps" class="attend"></div>
  <p class="pied">Battle Dock — Marseille</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="bd.js?v=2"></script>
<script>
/* le contenu paraît d'un trait, une fois complet */
function paraitre(){
  const e = document.getElementById('corps');
  if (e){ e.classList.remove('attend'); e.classList.add('venu'); }
}

function couleur(v, trahi){
  if (trahi || v < 0) return '#e0533c';
  if (v >= 80) return '#f0a92e';
  if (v >= 50) return '#2f8a5c';
  if (v >= 20) return '#2d7ba8';
  return 'rgba(18,48,63,.22)';
}
function teinte(v, trahi){
  if (trahi || v < 0) return ['#e0533c', '#fff'];
  if (v >= 80) return ['#f0a92e', '#12303f'];
  if (v >= 50) return ['#2f8a5c', '#fff'];
  return ['#2d7ba8', '#fff'];
}

(async () => {
  const C = document.getElementById('corps');
  try {
    const d = await BD.charger();
    if (!d){ location.href = 'index.html'; return; }

    let G;
    try { G = await BD.agir('mes_liens'); } catch(e){ G = null; }
    if (!Array.isArray(G)) G = [];

    const connus = G.filter(g => g.connu);
    const autres = G.filter(g => !g.connu);
    document.getElementById('g-sous').textContent = connus.length
      ? connus.length + (connus.length > 1 ? ' personnes rencontrées' : ' personne rencontrée')
      : 'Tu n\'as encore croisé personne';

    function carte(g){
      const v = Number(g.valeur) || 0;
      const P = g.palier || {};
      const [f, c] = teinte(v, g.trahi);
      const pc = Math.max(2, Math.min(100, v < 0 ? Math.abs(v) : v));
      return '<div class="qui' + (g.connu ? '' : ' inconnu')
        + (g.trahi ? ' trahi' : '') + '">'
        + '<div class="l1">'
        +   '<span class="ini" style="background:' + f + ';color:' + c + '">'
        +     g.nom[0] + '</span>'
        +   '<span class="co"><b>' + g.nom + '</b>'
        +   '<span class="q">' + g.quoi + '</span>'
        +   '<span class="ou">' + g.ou
        +     (g.jours != null ? ' · vu ' + (g.jours < 1 ? "aujourd'hui"
              : g.jours === 1 ? 'hier' : 'il y a ' + g.jours + ' jours') : '')
        +   '</span></span>'
        + '</div>'
        + (g.connu
           ? '<div class="lien"><div class="tt"><b>' + (P.nom || '') + '</b>'
             + '<span>' + (v < 0 ? v : v + ' / 100') + '</span></div>'
             + '<div class="ba"><i style="width:' + pc + '%;background:'
             + couleur(v, g.trahi) + '"></i></div></div>'
             + '<p class="mot">' + (P.mot || '') + '</p>'
           : '<p class="mot">Tu ne l\'as pas encore rencontré.</p>')
        + '</div>';
    }

    let h = '';
    if (connus.length) h += connus.map(carte).join('');
    else h += '<p class="vide">Tu n\'as encore croisé personne.<br>'
      + 'Descends à terre dans les ports — ils sont tous quelque part.</p>';
    if (autres.length)
      h += '<p class="sec plus">Ceux que tu n\'as pas croisés</p>'
        + autres.map(carte).join('');
    C.innerHTML = h; paraitre();

  } catch(e){
    console.warn(e);
    C.innerHTML = '<p class="vide">Le port n\'a pas répondu.</p>'; paraitre();
  }
})();
document.getElementById('retour').onclick = () => location.href = 'hub.html?v=3';
</script>
</body>
</html>
