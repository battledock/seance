<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#8fb4c4" id="tc">
<title>Battle Dock — La vigie</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="couleurs.css?v=2">
<style>
/* ============================================================
   LA VIGIE DU MOULIN — Palma
   On monte à la galerie. En bas, la baie. Autour, la mer, et
   ce qu'on peut en apprendre quand on prend la peine de regarder.
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none}
html,body{min-height:100%;background:var(--nuit-mer);color:#fdf6e6;
  font-family:'Nunito',system-ui,sans-serif}

/* ---------- le décor, en haut ---------- */
#sc{position:fixed;left:0;right:0;top:0;height:44%;overflow:hidden;
  opacity:0;transition:opacity .6s}
#sc.pret{opacity:1}
#sc svg{display:block;width:100%;height:100%}
#sc::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(18,48,63,.18) 0,rgba(18,48,63,0) 34%,
    rgba(18,48,63,.72) 82%,rgba(18,48,63,1) 100%)}

.tete{position:fixed;left:0;right:0;top:0;z-index:8;display:flex;align-items:center;
  gap:10px;padding:calc(env(safe-area-inset-top) + 14px) 14px 0}
.tete .ret{flex:0 0 40px;height:40px;border-radius:11px;cursor:pointer;
  border:3px solid #fdf6e6;background:rgba(18,48,63,.4);display:flex;
  align-items:center;justify-content:center;backdrop-filter:blur(8px)}
.tete .ret svg{width:17px;height:17px;stroke:#fdf6e6;fill:none;stroke-width:2.4;
  stroke-linecap:round;stroke-linejoin:round}
.tete .ou{flex:1;min-width:0}
.tete .ou b{display:block;font-family:'DM Serif Display',Georgia,serif;font-size:23px;
  line-height:1.1;text-shadow:0 2px 12px rgba(8,24,38,.6)}
.tete .ou span{display:block;font-size:9px;letter-spacing:.2em;text-transform:uppercase;
  color:rgba(253,246,230,.6);font-weight:800;margin-top:3px}
.tete .eu{flex:0 0 auto;padding:8px 13px;border-radius:20px;background:#fdf6e6;
  color:#12303f;font-size:14px;font-weight:900}

.w{position:fixed;left:0;right:0;top:39%;bottom:0;z-index:5;overflow-y:auto;
  padding:0 14px calc(env(safe-area-inset-bottom) + 26px)}
.w::-webkit-scrollbar{display:none}

.dit{padding-top:14px}
.dit p{font-size:14.5px;line-height:1.7;color:rgba(253,246,230,.82);
  text-shadow:0 2px 10px rgba(8,24,38,.5)}

h2{font-size:9px;letter-spacing:.2em;text-transform:uppercase;font-weight:900;
  color:rgba(253,246,230,.45);margin:22px 2px 10px;
  display:flex;justify-content:space-between;align-items:baseline}
h2 em{font-style:normal;color:#f0c46a;letter-spacing:.1em}

/* ---------- la lunette ---------- */
.lunette{width:100%;padding:14px;border-radius:14px;cursor:pointer;
  border:3px solid #12303f;background:#f0a92e;color:#12303f;
  font-family:inherit;font-size:15px;font-weight:900;margin-top:6px}
.lunette:disabled{background:rgba(253,246,230,.12);color:rgba(253,246,230,.4);
  border-color:transparent;cursor:default}
.lunette:active:not(:disabled){transform:translateY(2px)}

/* ---------- la carte de la mer ---------- */
.carte{border-radius:14px;overflow:hidden;border:3px solid #fdf6e6;
  box-shadow:0 8px 26px rgba(6,18,28,.5)}
.carte svg{display:block;width:100%;height:auto}

/* ---------- les gens ---------- */
.gens{display:flex;flex-direction:column;gap:8px}
.g{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:13px;
  background:rgba(253,246,230,.07);border:2px solid rgba(253,246,230,.14)}
.g.mer{border-color:rgba(240,196,106,.4);background:rgba(240,169,46,.1)}
.g .av{flex:0 0 42px;height:42px;border-radius:9px;overflow:hidden;background:#dfe8ee;
  border:2px solid rgba(253,246,230,.5)}
.g .av svg{display:block;width:100%;height:100%}
.g .t{flex:1;min-width:0}
.g .t b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
/* un capitaine n'est pas un joueur : on le dit, discrètement */
.g .t b em{font-style:normal;font-size:8.5px;letter-spacing:.14em;
  text-transform:uppercase;font-weight:800;color:rgba(253,246,230,.4);
  border:1px solid rgba(253,246,230,.24);border-radius:9px;padding:1px 6px;
  margin-left:7px;vertical-align:1px}
.g.cap{background:rgba(253,246,230,.04)}
.g .t span{display:block;font-size:11px;color:rgba(253,246,230,.55);margin-top:3px}
.g .t .cale{display:block;font-size:11.5px;color:#f0c46a;margin-top:5px;font-weight:700}
.g .n{flex:0 0 auto;font-size:10px;font-weight:900;letter-spacing:.08em;
  padding:4px 9px;border-radius:12px;background:rgba(253,246,230,.14);
  color:rgba(253,246,230,.7)}

/* ---------- ce qui a été débarqué ---------- */
.arr{display:flex;flex-direction:column;gap:6px}
.a{display:flex;align-items:center;gap:10px;padding:10px 13px;border-radius:11px;
  background:rgba(253,246,230,.06);border:2px solid rgba(253,246,230,.1)}
.a .p{flex:0 0 6px;height:30px;border-radius:4px}
.a .t{flex:1;min-width:0}
.a .t b{display:block;font-size:13.5px}
.a .t span{display:block;font-size:10.5px;color:rgba(253,246,230,.5);margin-top:2px}
.a .q{flex:0 0 auto;text-align:right}
.a .q b{display:block;font-size:15px;font-weight:900}
.a .q span{display:block;font-size:9px;letter-spacing:.12em;text-transform:uppercase;
  color:rgba(253,246,230,.42);font-weight:800;margin-top:2px}

/* ---------- les ports ---------- */
.ports{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.p2{padding:11px 5px;border-radius:11px;text-align:center;
  background:rgba(253,246,230,.07);border:2px solid rgba(253,246,230,.14)}
.p2.plein{border-color:#f0c46a}
.p2 b{display:block;font-size:19px;font-weight:900}
.p2 span{display:block;font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;
  color:rgba(253,246,230,.5);font-weight:800;margin-top:3px}

.mot{font-size:12px;line-height:1.7;color:rgba(253,246,230,.4);margin-top:20px;
  text-align:center;padding:0 8px}
.rien{padding:22px 16px;text-align:center;font-size:13px;line-height:1.7;
  color:rgba(253,246,230,.5)}

/* ---------- les ailes tournent ---------- */
.ailes{animation:tourne 14s linear infinite;transform-origin:240px 300px}
@keyframes tourne{to{transform:rotate(360deg)}}
.mouette{animation:plane 22s linear infinite}
.m2{animation-duration:31s;animation-delay:-9s}
.m3{animation-duration:17s;animation-delay:-14s}
@keyframes plane{0%{transform:translate(-60px,0)}100%{transform:translate(560px,-30px)}}
@media (prefers-reduced-motion:reduce){*{animation:none !important}}

#charge{position:fixed;inset:0;z-index:90;background:#12303f;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:16px;
  transition:opacity .45s}
#charge.parti{opacity:0;pointer-events:none}
#charge .ti{font-family:'DM Serif Display',Georgia,serif;font-size:21px;color:#f0c46a}
#charge .fl{width:110px;height:3px;border-radius:2px;background:rgba(240,196,106,.2);
  overflow:hidden}
#charge .fl i{display:block;width:38%;height:100%;background:#f0c46a;
  animation:va 1.15s ease-in-out infinite}
@keyframes va{0%{transform:translateX(-115%)}100%{transform:translateX(275%)}}
</style>
</head>
<body>

<div id="charge"><div class="ti">La vigie</div><div class="fl"><i></i></div></div>

<div id="sc"></div>

<div class="tete">
  <button class="ret" id="ret" aria-label="Retour">
    <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <span class="ou"><b>La vigie</b><span>Les moulins — Palma</span></span>
  <span class="eu" id="eu">—</span>
</div>

<div class="w" id="w"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="bd.js?v=4"></script>
<script>
/* ============================================================
   LES BARQUES
   Le même dessin que sur la page de la barque : chaque palier a
   sa coque, sa voile et son gréement. C'est bien leur bateau
   qu'on voit, pas une vignette générique.
   ============================================================ */
let uidB = 0;




const rndB = s => { const x = Math.sin(s * 127.1) * 43758.5; return x - Math.floor(x); };
const BOIS  = ['#b58f60','#c9a374','#a5825c','#96754a','#8a6a42'];
function mel(a, b, k){ const A = hx(a), B = hx(b); return ch([0,1,2].map(i => A[i] + (B[i]-A[i]) * k)); }
function hx(c){ return [parseInt(c.slice(1,3),16), parseInt(c.slice(3,5),16), parseInt(c.slice(5,7),16)]; }
function ch(a){ return '#' + a.map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2,'0')).join(''); }
const rnd = s => { const x = Math.sin(s * 127.1) * 43758.5; return x - Math.floor(x); };



const CLAIR = '#e4c79c', SOMBRE = '#7a5c38', FOND = '#5c4930';

const PALIERS_B = [
  { n:1,  nom:"La coque nue",        prix:0,      places:1, kg:40,  vit:1.0,
    d:"Trois bordages et rien d'autre. Elle flotte, c'est déjà ça." },
  { n:2,  nom:"Le calfatage",        prix:900,    places:1, kg:45,  vit:1.0,
    d:"Étoupe et goudron dans les coutures. Elle ne prend plus l'eau." },
  { n:3,  nom:"Le banc de nage",     prix:1400,   places:1, kg:50,  vit:1.1,
    d:"On peut ramer assis. Ça change tout." },
  { n:4,  nom:"Les avirons",         prix:2200,   places:2, kg:60,  vit:1.3,
    d:"Deux avirons de frêne et leurs tolets." },
  { n:5,  nom:"Le plat-bord",        prix:3400,   places:2, kg:70,  vit:1.3,
    d:"Un liston tout autour. La coque ne travaille plus." },
  { n:6,  nom:"Le pontage avant",    prix:5000,   places:3, kg:85,  vit:1.4,
    d:"Un demi-pont à l'avant. Les caisses restent au sec." },
  { n:7,  nom:"Le mât de fortune",   prix:7200,   places:3, kg:95,  vit:1.7,
    d:"Une perche et un bout de toile. Ça tire quand le vent veut bien." },
  { n:8,  nom:"La voile latine",     prix:10000,  places:4, kg:110, vit:2.2,
    d:"Antenne et voile triangulaire. La vraie voile d'ici." },
  { n:9,  nom:"Le safran",           prix:13500,  places:4, kg:120, vit:2.3,
    d:"Un gouvernail et sa barre. Tu choisis où tu vas." },
  { n:10, nom:"La quille lestée",    prix:18000,  places:5, kg:140, vit:2.5,
    d:"Du plomb sous la quille. Elle ne se couche plus." },
  { n:11, nom:"Le tillac",           prix:23000,  places:6, kg:170, vit:2.6,
    d:"Un pont continu. On marche dessus sans regarder ses pieds." },
  { n:12, nom:"La cale fermée",      prix:29000,  places:8, kg:220, vit:2.6,
    d:"Un panneau, une cale étanche. Le double de marchandise." },
  { n:13, nom:"Le foc",              prix:36000,  places:8, kg:240, vit:3.1,
    d:"Un beaupré et un foc. Elle remonte enfin au vent." },
  { n:14, nom:"Le rouf",             prix:44000,  places:9, kg:270, vit:3.1,
    d:"Un abri sur le pont. On peut dormir à bord." },
  { n:15, nom:"Le second mât",       prix:54000,  places:10, kg:310, vit:3.6,
    d:"Un tapecul à l'arrière. Deux voiles valent mieux qu'une." },
  { n:16, nom:"Le bordé doublé",     prix:66000,  places:12, kg:380, vit:3.6,
    d:"Une seconde peau de bois. Elle encaisse le mauvais temps." },
  { n:17, nom:"Le treuil",           prix:80000,  places:14, kg:450, vit:3.7,
    d:"Un cabestan pour hisser seul. Plus besoin d'être trois." },
  { n:18, nom:"La chaloupe",         prix:96000,  places:15, kg:500, vit:3.7,
    d:"Une annexe sur le pont. On accoste où il n'y a pas de quai." },
  { n:19, nom:"Le pavillon",         prix:115000, places:16, kg:560, vit:3.8,
    d:"Tes couleurs en tête de mât. On te reconnaît de loin." },
  { n:20, nom:"Le grand caboteur",   prix:140000, places:20, kg:700, vit:4.2,
    d:"Coque doublée, trois voiles, un nom peint sur l'étrave. Ce n'est plus une barque." }
];

function barqueQ(n, route){
  const P = PALIERS_B[n-1];
  const L = 76 + n * 5.6;            /* longueur */
  const H = 15 + n * 0.62;           /* creux du bordé au-dessus de l'eau */
  const T = 6 + n * 0.34;            /* tirant d'eau */
  const cx = 150, flot = 122;
  const x0 = cx - L / 2;
  const g = v => (x0 + v).toFixed(1);
  const u = 'b' + (++uidB);
  let s = '';

  /* ---------- la ligne de sheer : le haut du bordé ---------- */
  /* étrave relevée à gauche, creux au milieu, poupe relevée à droite */
  const yEtrave = flot - H * 1.28;
  const yCreux  = flot - H * 0.92;
  const yPoupe  = flot - H * 1.12;
  const sheer = `M${g(0)} ${yEtrave.toFixed(1)}
    C${g(L*.2)} ${(yEtrave + (yCreux-yEtrave)*.9).toFixed(1)} ${g(L*.36)} ${yCreux.toFixed(1)} ${g(L*.54)} ${yCreux.toFixed(1)}
    C${g(L*.74)} ${yCreux.toFixed(1)} ${g(L*.9)} ${(yCreux + (yPoupe-yCreux)*.5).toFixed(1)} ${g(L)} ${yPoupe.toFixed(1)}`;

  /* ---------- la coque complète ---------- */
  const coque = sheer
    + ` L${g(L*.965)} ${(flot + T*.42).toFixed(1)}`
    + ` C${g(L*.78)} ${(flot + T).toFixed(1)} ${g(L*.24)} ${(flot + T).toFixed(1)} ${g(L*.055)} ${(flot + T*.3).toFixed(1)}`
    + ` Z`;

  s += `<defs><clipPath id="${u}"><path d="${coque}"/></clipPath></defs>`;

  /* reflet dans l'eau */
  s += `<ellipse cx="${cx}" cy="${(flot + T*.7).toFixed(1)}" rx="${(L*.5).toFixed(0)}" ry="4"
    fill="#0e4a68" opacity=".2"/>`;

  /* la chaloupe (18+), posée en travers du pont */
  if (n >= 18){
    s += `<g transform="translate(${g(L*.58)},${(yCreux - 3).toFixed(1)})">
      <path d="M0 0 q3 8 10 9 h20 q7 -1 10 -9 q-6 3 -13 3 H13 q-7 0 -13 -3 z" fill="#96754a"/>
      <path d="M-1 -2 q5 4 12 4 h18 q7 0 12 -4 v3 q-5 3 -12 3 H11 q-7 0 -12 -3 z" fill="#c9a374"/></g>`;
  }

  /* ---------- le corps de la coque ---------- */
  s += `<path d="${coque}" fill="${BOIS[2]}"/>`;

  /* les bordages : des courbes parallèles au sheer, découpées par la coque */
  const nb = Math.min(7, 3 + Math.floor(n / 3.4));
  s += `<g clip-path="url(#${u})">`;
  for (let i = 0; i < nb; i++){
    const dy = (H + T) * (i / nb);
    const c = BOIS[i % BOIS.length];
    s += `<path d="${sheer}" transform="translate(0,${dy.toFixed(1)})" fill="none"
      stroke="${c}" stroke-width="${((H + T) / nb * 1.5).toFixed(1)}"/>`;
  }
  /* les coutures calfatées (2+) */
  if (n >= 2){
    for (let i = 1; i < nb; i++){
      const dy = (H + T) * (i / nb);
      s += `<path d="${sheer}" transform="translate(0,${dy.toFixed(1)})" fill="none"
        stroke="#3a2c1e" stroke-width=".9" opacity=".45"/>`;
    }
  }
  /* les œuvres vives, sous la flottaison */
  s += `<rect x="0" y="${flot}" width="300" height="60"
    fill="${n >= 10 ? '#33454f' : '#6d5334'}" opacity="${n >= 10 ? '.9' : '.55'}"/>`;
  /* le bordé doublé (16+) */
  if (n >= 16)
    s += `<path d="${sheer}" transform="translate(0,${(H*.9).toFixed(1)})" fill="none"
      stroke="#6d5334" stroke-width="2.4" opacity=".7"/>`;
  s += `</g>`;

  /* ---------- le liston (5+) ---------- */
  if (n >= 5){
    s += `<path d="${sheer}" fill="none" stroke="${CLAIR}" stroke-width="${(2.4 + n*.06).toFixed(1)}"
      stroke-linecap="round"/>`;
  } else {
    s += `<path d="${sheer}" fill="none" stroke="${BOIS[0]}" stroke-width="2" stroke-linecap="round"/>`;
  }
  /* l'ourlet clair du dessus */
  s += `<path d="${sheer}" transform="translate(0,-1)" fill="none" stroke="#f0dcb4"
    stroke-width="1" opacity=".6"/>`;

  /* ---------- l'étrave et l'étambot ---------- */
  s += `<path d="M${g(0)} ${yEtrave.toFixed(1)} C${g(-2)} ${(yEtrave + H*.7).toFixed(1)}
    ${g(1)} ${(flot).toFixed(1)} ${g(L*.055)} ${(flot + T*.3).toFixed(1)}"
    fill="none" stroke="${SOMBRE}" stroke-width="2.6" stroke-linecap="round"/>`;
  s += `<path d="M${g(L)} ${yPoupe.toFixed(1)} L${g(L*.965)} ${(flot + T*.42).toFixed(1)}"
    stroke="${SOMBRE}" stroke-width="2.6" stroke-linecap="round" fill="none"/>`;

  /* ---------- l'intérieur, vu par-dessus le bordé ---------- */
  s += `<path d="${sheer}" transform="translate(0,2.2)" fill="none" stroke="${FOND}"
    stroke-width="${Math.max(2.2, H*.22).toFixed(1)}"/>`;

  /* ---------- le pont ---------- */
  const pont = (a, b, coul, clair) => {
    s += `<path d="${sheer}" transform="translate(0,2)" fill="none" stroke="${coul}"
      stroke-width="${Math.max(2.4, H*.2).toFixed(1)}"
      stroke-dasharray="${(L*(b-a)).toFixed(0)} ${L.toFixed(0)}"
      stroke-dashoffset="${(-L*a).toFixed(0)}"/>`;
    s += `<path d="${sheer}" transform="translate(0,.6)" fill="none" stroke="${clair}"
      stroke-width="1.2" stroke-dasharray="${(L*(b-a)).toFixed(0)} ${L.toFixed(0)}"
      stroke-dashoffset="${(-L*a).toFixed(0)}"/>`;
  };
  if (n >= 11)      pont(.03, .95, '#b8946a', '#dfc094');   /* tillac : pont continu */
  else if (n >= 6)  pont(.04, .34, '#b8946a', '#dfc094');   /* demi-pont avant */

  /* ---------- le banc de nage (3+) ---------- */
  if (n >= 3 && n < 11)
    s += `<rect x="${g(L*.4)}" y="${(yCreux + 1.6).toFixed(1)}" width="${(L*.22).toFixed(0)}"
      height="${Math.max(2, H*.14).toFixed(1)}" rx="1" fill="#8a6a42"/>`;

  /* ---------- les avirons (4+ jusqu'au pont) ---------- */
  if (n >= 4 && n < 11){
    [[L*.34, 'av-1'], [L*.62, 'av-2']].forEach(([dx, cl]) => {
      const ax = +g(dx), ay = yCreux + 1;
      const dep = (flot + 7) - ay;      /* la pelle plonge sous la flottaison */
      /* le tolet, point de pivot */
      s += `<rect x="${(ax-1.4).toFixed(1)}" y="${(ay-3.6).toFixed(1)}" width="2.8" height="4.4"
        rx="1" fill="#6d5334"/>`;
      s += `<g class="aviron ${cl}" style="transform-origin:${ax}px ${ay.toFixed(1)}px">`;
      /* le manche, vers l'intérieur et vers le haut */
      s += `<path d="M${ax} ${ay.toFixed(1)} l-13 -6" stroke="#96754a"
        stroke-width="2.2" stroke-linecap="round"/>`;
      s += `<circle cx="${(ax-13).toFixed(1)}" cy="${(ay-6).toFixed(1)}" r="1.6" fill="#8a6a42"/>`;
      /* le fût, vers l'extérieur et vers l'eau */
      s += `<path d="M${ax} ${ay.toFixed(1)} l21 ${dep.toFixed(1)}" stroke="#a5825c"
        stroke-width="2.4" stroke-linecap="round"/>`;
      /* la pelle */
      s += `<path d="M${(ax+19).toFixed(1)} ${(ay+dep-2).toFixed(1)}
        q5.4 1 7 6 q1.6 5.4 -2 7.4 q-3.8 2 -6.8 -1.6 q-3 -3.6 -1.6 -8.6 z" fill="#c9a374"/>`;
      s += `<path d="M${(ax+19.6).toFixed(1)} ${(ay+dep-1).toFixed(1)}
        q4.4 1.4 5.6 5.4" stroke="#dfc094" stroke-width="1.2" fill="none"/>`;
      s += `</g>`;
    });
  }

  /* ---------- le panneau de cale (12+) ---------- */
  if (n >= 12){
    s += `<rect x="${g(L*.46)}" y="${(yCreux - 1.4).toFixed(1)}" width="${(L*.15).toFixed(0)}"
      height="${Math.max(2.6, H*.12).toFixed(1)}" rx="1" fill="#8a6a42" stroke="#6d5334" stroke-width=".8"/>`;
  }

  /* ---------- le rouf (14+) ---------- */
  if (n >= 14){
    const rx = +g(L*.62), ry = yCreux - 1, rh = H*.5, rw = L*.2;
    s += `<path d="M${rx} ${ry.toFixed(1)} h${rw.toFixed(0)} v-${rh.toFixed(1)} h-${rw.toFixed(0)} z" fill="#c9a374"/>`;
    s += `<path d="M${(rx-2).toFixed(1)} ${(ry-rh).toFixed(1)} h${(rw+4).toFixed(0)} l-2.4 -3.4 h-${(rw-.8).toFixed(0)} z" fill="#8a4a3a"/>`;
    s += `<rect x="${(rx+2.6).toFixed(1)}" y="${(ry-rh+2.4).toFixed(1)}" width="${(rw*.26).toFixed(1)}"
      height="${(rh*.42).toFixed(1)}" fill="#6d8fa4" opacity=".85"/>`;
    s += `<rect x="${(rx+rw*.56).toFixed(1)}" y="${(ry-rh+2.4).toFixed(1)}" width="${(rw*.26).toFixed(1)}"
      height="${(rh*.42).toFixed(1)}" fill="#6d8fa4" opacity=".85"/>`;
  }

  /* ---------- le grand mât (7+) ---------- */
  const mxP = n >= 13 ? .34 : .46;
  if (n >= 7){
    const mx = +g(L * mxP);
    const pied = yCreux + 1;
    const mh = n >= 8 ? 46 + n * 2.3 : 32;
    s += `<path d="M${mx} ${pied.toFixed(1)} v-${mh.toFixed(0)}" stroke="#8a6a42"
      stroke-width="${(2 + n*.07).toFixed(1)}" stroke-linecap="round"/>`;
    s += `<path d="M${(mx-.7).toFixed(1)} ${pied.toFixed(1)} v-${mh.toFixed(0)}" stroke="#c9a374"
      stroke-width=".9" opacity=".7"/>`;
    const ay = pied - mh;

    if (n === 7){
      s += `<path class="voile" d="M${mx} ${(ay+5).toFixed(1)} q15 7 20 21 q-13 5 -20 4 z" fill="#ddd2b6"/>`;
      s += `<path d="M${mx} ${(ay+5).toFixed(1)} q15 7 20 21 q-8 3 -12 3 z" fill="#f0e8d2"/>`;
    } else {
      /* la voile latine : antenne inclinée sur toute la hauteur */
      s += `<path d="M${(mx-20).toFixed(1)} ${(ay + mh*.5).toFixed(1)} L${(mx+34).toFixed(1)} ${(ay-4).toFixed(1)}"
        stroke="#a5825c" stroke-width="2.2" stroke-linecap="round"/>`;
      s += `<path class="voile" d="M${(mx-18).toFixed(1)} ${(ay + mh*.48).toFixed(1)}
        L${(mx+32).toFixed(1)} ${(ay-3).toFixed(1)}
        Q${(mx+14).toFixed(1)} ${(ay + mh*.56).toFixed(1)} ${(mx+2).toFixed(1)} ${pied.toFixed(1)} Z" fill="#e4dbc0"/>`;
      s += `<path d="M${(mx-18).toFixed(1)} ${(ay + mh*.48).toFixed(1)}
        L${(mx+32).toFixed(1)} ${(ay-3).toFixed(1)}
        Q${(mx+20).toFixed(1)} ${(ay + mh*.38).toFixed(1)} ${(mx+8).toFixed(1)} ${(ay + mh*.62).toFixed(1)} Z" fill="#f6f0dc"/>`;
      s += `<g stroke="#c9bfa2" stroke-width=".7" opacity=".65">
        <path d="M${(mx-6).toFixed(1)} ${(ay+mh*.5).toFixed(1)} L${(mx+9).toFixed(1)} ${(pied-5).toFixed(1)}"/>
        <path d="M${(mx+9).toFixed(1)} ${(ay+mh*.26).toFixed(1)} L${(mx+15).toFixed(1)} ${(pied-11).toFixed(1)}"/></g>`;
      s += `<g stroke="#c9b58c" stroke-width=".8" opacity=".75">
        <path d="M${mx} ${(ay+5).toFixed(1)} L${g(L*.1)} ${(yCreux-1).toFixed(1)}"/>
        <path d="M${mx} ${(ay+5).toFixed(1)} L${g(L*.86)} ${(yCreux-1).toFixed(1)}"/></g>`;
    }
  }

  /* ---------- le foc et son beaupré (13+) ---------- */
  if (n >= 13){
    const bx = +g(-8), by = yEtrave - 3;
    const mx = +g(L*mxP), mh = 46 + n*2.3, ay = yCreux + 1 - mh;
    s += `<path d="M${g(L*.02)} ${(yEtrave+2).toFixed(1)} L${bx} ${by.toFixed(1)}"
      stroke="#a5825c" stroke-width="2.2" stroke-linecap="round"/>`;
    s += `<path class="voile" d="M${bx} ${by.toFixed(1)} L${mx} ${(ay + mh*.2).toFixed(1)}
      Q${(bx+17).toFixed(1)} ${(ay + mh*.66).toFixed(1)} ${(bx+12).toFixed(1)} ${(yEtrave+4).toFixed(1)} Z"
      fill="#eee6cc"/>`;
    s += `<path d="M${bx} ${by.toFixed(1)} L${mx} ${(ay + mh*.2).toFixed(1)}
      Q${(bx+24).toFixed(1)} ${(ay + mh*.5).toFixed(1)} ${(bx+20).toFixed(1)} ${(ay + mh*.8).toFixed(1)} Z"
      fill="#f8f2de"/>`;
  }

  /* ---------- le tapecul (15+) ---------- */
  if (n >= 15){
    const mx2 = +g(L*.86), mh2 = 30 + n, pied2 = yCreux + 1;
    s += `<path d="M${mx2} ${pied2.toFixed(1)} v-${mh2.toFixed(0)}" stroke="#8a6a42"
      stroke-width="2.2" stroke-linecap="round"/>`;
    s += `<path d="M${(mx2-12).toFixed(1)} ${(pied2 - mh2*.44).toFixed(1)} L${(mx2+18).toFixed(1)} ${(pied2 - mh2 + 2).toFixed(1)}"
      stroke="#a5825c" stroke-width="1.9" stroke-linecap="round"/>`;
    s += `<path class="voile" d="M${(mx2-10).toFixed(1)} ${(pied2 - mh2*.42).toFixed(1)}
      L${(mx2+16).toFixed(1)} ${(pied2 - mh2 + 3).toFixed(1)}
      Q${(mx2+5).toFixed(1)} ${(pied2 - mh2*.4).toFixed(1)} ${(mx2+2).toFixed(1)} ${pied2.toFixed(1)} Z"
      fill="#e4dbc0"/>`;
  }

  /* ---------- le safran (9+) ---------- */
  if (n >= 9){
    s += `<path d="M${g(L*.97)} ${(flot - H*.5).toFixed(1)} q6 4 6 ${(T*1.1).toFixed(1)}
      q0 ${(T*.5).toFixed(1)} -6 ${(T*.5).toFixed(1)} z" fill="#7a5c38"/>`;
    s += `<path d="M${g(L*.94)} ${(yPoupe + 2).toFixed(1)} l13 -6" stroke="#a5825c"
      stroke-width="2" stroke-linecap="round"/>`;
  }

  /* ---------- le treuil (17+) ---------- */
  if (n >= 17){
    const tx = +g(L*.44);
    s += `<rect x="${(tx-4.4).toFixed(1)}" y="${(yCreux - 6).toFixed(1)}" width="9" height="6" rx="2" fill="#5c6a74"/>`;
    s += `<circle cx="${tx}" cy="${(yCreux - 3).toFixed(1)}" r="2.2" fill="#8a9299"/>`;
  }

  /* ---------- le pavillon (19+) ---------- */
  if (n >= 19){
    const mx = +g(L * mxP), mh = 46 + n * 2.3, tete = yCreux + 1 - mh;
    /* la drisse et le petit mât de pavillon */
    s += `<path d="M${mx} ${tete.toFixed(1)} v-9" stroke="#8a6a42" stroke-width="1.6" stroke-linecap="round"/>`;
    /* le pavillon, qui claque */
    s += `<g class="pavillon" style="transform-origin:${mx}px ${(tete-8).toFixed(1)}px">`;
    s += `<path d="M${mx} ${(tete-9).toFixed(1)} q9 1.6 17 -1.4 q-2 4 0 7.4 q-8 3 -17 1.4 z" fill="#c74a33"/>`;
    s += `<path d="M${mx} ${(tete-9).toFixed(1)} q9 1.6 17 -1.4 q-1 2 -.6 3.6 q-8 2.4 -16.4 1 z" fill="#e0684a"/>`;
    s += `</g>`;
  }

  /* ---------- le nom peint (20) ---------- */
  if (n >= 20)
    s += `<text x="${g(L*.1)}" y="${(flot - H*.34).toFixed(1)}" font-family="Georgia,serif"
      font-size="8.4" letter-spacing="1.2" fill="#f2e6c8" opacity=".85">LA ZIZOUIN</text>`;

  /* ---------- l'eau, selon l'allure ---------- */
  /* la proue est à gauche : le sillage traîne derrière, donc à droite */
  if (route){
    const nv = Math.max(2, Math.round(P.vit * 1.6));
    for (let i = 0; i < nv; i++)
      s += `<path class="sillage sl${i % 3}" d="M${g(L + 4 + i*4)} ${(flot + 1 + i*2.6).toFixed(1)}
        q${(16+i*7).toFixed(0)} 2 ${(30+i*13).toFixed(0)} 0"
        stroke="#fff" stroke-width="${(1.6 - i*.16).toFixed(2)}" fill="none"
        opacity="${(.44 - i*.05).toFixed(2)}"/>`;
    /* la moustache d'étrave, elle, est bien à l'avant */
    s += `<path class="etrave" d="M${g(-3)} ${(flot - 1).toFixed(1)} q-9 4 -19 3"
      stroke="#fff" stroke-width="2" fill="none" opacity=".55"/>`;
    s += `<path class="etrave e2" d="M${g(1)} ${(flot + 2.4).toFixed(1)} q-8 4 -17 3"
      stroke="#fff" stroke-width="1.4" fill="none" opacity=".36"/>`;
    /* le remous sous la poupe */
    s += `<ellipse class="remous" cx="${g(L + 2)}" cy="${(flot + 3).toFixed(1)}" rx="9" ry="2.4"
      fill="#fff" opacity=".24"/>`;
  } else {
    /* au mouillage : la chaîne d'ancre à l'étrave */
    s += `<path d="M${g(L*.03)} ${(yEtrave + 4).toFixed(1)} q-4 8 -3 16"
      stroke="#6d6a62" stroke-width="1.4" fill="none" stroke-dasharray="2 1.6"/>`;
    s += `<path d="M${g(-4)} ${(flot + 2).toFixed(1)} q22 3 40 0"
      stroke="#fff" stroke-width="1.2" fill="none" opacity=".26"/>`;
  }

  return s;
}


/* ============================================================
   LE DÉCOR — la galerie du moulin
   ============================================================ */
function moulin(){
  var W = 480, H = 640;
  var s = '<defs>'
    + '<linearGradient id="v-ciel" x1="0" y1="0" x2="0" y2="1">'
    +   '<stop offset="0%" stop-color="#2f6ba0"/>'
    +   '<stop offset="42%" stop-color="#8ab4cc"/>'
    +   '<stop offset="78%" stop-color="#d8d4c0"/>'
    +   '<stop offset="100%" stop-color="#efd6a8"/></linearGradient>'
    + '<linearGradient id="v-mer" x1="0" y1="0" x2="0" y2="1">'
    +   '<stop offset="0%" stop-color="#5e9aa8"/>'
    +   '<stop offset="100%" stop-color="#24597a"/></linearGradient>'
    + '</defs>';

  s += '<rect x="0" y="0" width="' + W + '" height="360" fill="url(#v-ciel)"/>';
  s += '<circle cx="384" cy="112" r="130" fill="#ffd98a" opacity=".22"/>';
  s += '<circle cx="384" cy="112" r="19" fill="#fff4d8" opacity=".85"/>';

  /* des nuages étirés, très haut */
  for (var i = 0; i < 7; i++)
    s += '<ellipse cx="' + (rnd(i * 11) * 560 - 40).toFixed(0) + '" cy="'
      + (30 + rnd(i * 7) * 150).toFixed(0) + '" rx="' + (44 + rnd(i * 3) * 110).toFixed(0)
      + '" ry="' + (3 + rnd(i * 5) * 7).toFixed(0) + '" fill="#fff6e0" opacity="'
      + (.14 + rnd(i) * .2).toFixed(2) + '"/>';

  /* la mer, jusqu'à l'horizon */
  s += '<rect x="0" y="252" width="' + W + '" height="150" fill="url(#v-mer)"/>';
  for (var k = 0; k < 26; k++)
    s += '<path d="M' + (rnd(k * 3) * 460).toFixed(0) + ' '
      + (258 + rnd(k * 5) * 130).toFixed(0) + ' h' + (14 + rnd(k * 7) * 48).toFixed(0)
      + '" stroke="#fdf6e6" stroke-width="1.6" opacity="'
      + (.1 + rnd(k) * .2).toFixed(2) + '"/>';

  /* la ville en contrebas, et la Seu */
  s += '<rect x="0" y="392" width="' + W + '" height="34" fill="#a8845e" opacity=".9"/>';
  for (var t = 0; t < 56; t++){
    var tx = -8 + t * 9, th = 8 + rnd(t * 3) * 20;
    s += '<rect x="' + tx.toFixed(0) + '" y="' + (402 - th).toFixed(0) + '" width="'
      + (8 + rnd(t) * 4).toFixed(0) + '" height="' + (th + 28).toFixed(0) + '" fill="'
      + ['#c9a882','#b8926a','#d4b48c','#a8845e'][t % 4] + '" opacity="'
      + (.75 + rnd(t * 5) * .25).toFixed(2) + '"/>';
    s += '<path d="M' + (tx - 1).toFixed(0) + ' ' + (402 - th).toFixed(0) + ' h'
      + (10 + rnd(t) * 4).toFixed(0) + ' l-2 -4 h-6 z" fill="#a05a3a" opacity=".85"/>';
  }
  s += '<path d="M60 402 v-70 q0 -15 13 -15 h60 q13 0 13 15 v70 z" fill="#e0cba0"/>';
  for (var c = 0; c < 5; c++)
    s += '<rect x="' + (64 + c * 18) + '" y="342" width="7" height="60" fill="#c4ac82"/>';
  s += '<rect x="140" y="306" width="19" height="96" fill="#d8c49a"/>';
  s += '<path d="M138 306 h23 l-11 -17 z" fill="#a8896a"/>';

  /* ---------- le moulin, au premier plan ---------- */
  /* le fût, tronconique, chaulé */
  s += '<path d="M170 640 L196 336 h88 l26 304 z" fill="#efe6d4"/>';
  s += '<path d="M170 640 L196 336 h30 l-14 304 z" fill="#fdf8ec"/>';
  s += '<path d="M284 336 l26 304 h-32 l-16 -304 z" fill="#d6ccb8"/>';
  /* les rangs de pierre */
  for (var r = 0; r < 9; r++){
    var y = 372 + r * 30;
    s += '<path d="M' + (192 - r * 1.2).toFixed(0) + ' ' + y + ' L'
      + (288 + r * 1.6).toFixed(0) + ' ' + y + '" stroke="#c9bfa8" stroke-width="2"'
      + ' opacity=".55"/>';
  }
  /* la porte et une fenêtre */
  s += '<path d="M224 640 v-74 q16 -12 32 0 v74 z" fill="#6d5238"/>';
  s += '<rect x="228" y="440" width="24" height="30" rx="4" fill="#5c4a34"/>';
  s += '<rect x="231" y="443" width="18" height="24" rx="3" fill="#8fb4c4" opacity=".7"/>';

  /* la galerie où l'on se tient */
  s += '<path d="M158 344 h164 v14 h-164 z" fill="#8a6a48"/>';
  s += '<path d="M158 344 h164 v5 h-164 z" fill="#b09070"/>';
  for (var b = 0; b < 15; b++)
    s += '<rect x="' + (162 + b * 11) + '" y="322" width="4" height="22" rx="2"'
      + ' fill="#8a6a48"/>';
  s += '<path d="M158 320 h164 v5 h-164 z" fill="#a08058"/>';

  /* le toit conique */
  s += '<path d="M188 336 L240 262 L292 336 z" fill="#8a5a3a"/>';
  s += '<path d="M188 336 L240 262 L240 336 z" fill="#a86a44"/>';
  for (var q = 0; q < 7; q++)
    s += '<path d="M' + (196 + q * 13) + ' 336 L240 ' + (268 + q * 2)
      + '" stroke="#6d4630" stroke-width="1.6" opacity=".4"/>';

  /* l'arbre et les quatre ailes */
  s += '<g class="ailes">';
  for (var a = 0; a < 4; a++){
    var an = a * 90;
    s += '<g transform="rotate(' + an + ' 240 300)">';
    /* le bras */
    s += '<rect x="236" y="140" width="8" height="160" rx="3" fill="#6d5238"/>';
    /* la toile tendue sur le cadre */
    s += '<path d="M244 152 h44 v128 h-44 z" fill="#f4ecd8" opacity=".92"/>';
    s += '<path d="M244 152 h44 v128 h-44 z" fill="none" stroke="#6d5238"'
      + ' stroke-width="3"/>';
    for (var l = 0; l < 5; l++)
      s += '<path d="M' + (250 + l * 8) + ' 152 v128" stroke="#c9b48a"'
        + ' stroke-width="1.6" opacity=".8"/>';
    s += '</g>';
  }
  s += '<circle cx="240" cy="300" r="13" fill="#5c4229"/>';
  s += '<circle cx="240" cy="300" r="6" fill="#8a6a42"/>';
  s += '</g>';

  /* trois mouettes, qui passent */
  for (var m = 0; m < 3; m++)
    s += '<path class="mouette m' + (m + 1) + '" d="M' + (40 + m * 30) + ' '
      + (120 + m * 46) + ' q9 -8 18 0 q9 -8 18 0" stroke="#fdf6e6"'
      + ' stroke-width="2.6" fill="none" opacity=".7" stroke-linecap="round"/>';

  return s;
}

/* ============================================================
   LA CARTE DE LA MÉDITERRANÉE
   Une fois la lunette en main, on ne lit plus une liste : on voit
   la mer, les quatre ports, et les barques posées dessus. Celles
   qui sont en route glissent le long de leur trait.
   ============================================================ */
var CW = 640, CH = 420;
/* où l'on place chaque port sur la carte */
var LIEUX = {
  anse:      { x: 470, y:  86, nom:'Marseille' },
  ajaccio:   { x: 588, y: 196, nom:'Ajaccio'   },
  barcelone: { x: 132, y: 214, nom:'Barcelone' },
  palma:     { x: 322, y: 330, nom:'Palma'     }
};
var TRAITS = [['anse','barcelone'], ['anse','ajaccio'], ['barcelone','palma']];

function carte(G){
  var s = '<defs>'
    + '<linearGradient id="c-mer" x1="0" y1="0" x2="0" y2="1">'
    +   '<stop offset="0%" stop-color="#2f7d9a"/>'
    +   '<stop offset="100%" stop-color="#175370"/></linearGradient></defs>';
  s += '<rect x="0" y="0" width="' + CW + '" height="' + CH + '" fill="url(#c-mer)"/>';

  /* la houle, en tirets clairs */
  for (var k = 0; k < 60; k++)
    s += '<path d="M' + (rnd(k * 3) * CW).toFixed(0) + ' '
      + (rnd(k * 7) * CH).toFixed(0) + ' h' + (10 + rnd(k) * 26).toFixed(0)
      + '" stroke="#fdf6e6" stroke-width="1.6" opacity="'
      + (.07 + rnd(k * 5) * .12).toFixed(2) + '"/>';

  /* les côtes, esquissées */
  s += '<path d="M400 0 q40 40 74 46 q52 8 96 -12 L640 0 Z" fill="#c9a878" opacity=".5"/>';
  s += '<path d="M0 150 q60 24 96 62 q22 24 12 60 q-40 34 -108 26 L0 150 Z"'
    + ' fill="#c9a878" opacity=".5"/>';
  s += '<ellipse cx="600" cy="200" rx="58" ry="46" fill="#c9a878" opacity=".5"/>';
  s += '<ellipse cx="322" cy="344" rx="76" ry="40" fill="#c9a878" opacity=".55"/>';

  /* les routes, en pointillé */
  TRAITS.forEach(function(t){
    var a = LIEUX[t[0]], b = LIEUX[t[1]];
    s += '<path d="M' + a.x + ' ' + a.y + ' L' + b.x + ' ' + b.y + '"'
      + ' stroke="#fdf6e6" stroke-width="2.4" stroke-dasharray="7 9"'
      + ' opacity=".3" fill="none"/>';
  });

  /* les ports */
  Object.keys(LIEUX).forEach(function(k){
    var p = LIEUX[k];
    s += '<circle cx="' + p.x + '" cy="' + p.y + '" r="9" fill="#fdf6e6"'
      + ' stroke="#12303f" stroke-width="3.4"/>';
    s += '<text x="' + p.x + '" y="' + (p.y - 17) + '" text-anchor="middle"'
      + ' font-family="Georgia,serif" font-size="17" fill="#fdf6e6"'
      + ' stroke="#12303f" stroke-width="3.4" paint-order="stroke">'
      + p.nom + '</text>';
  });

  /* ---- les barques ---- */
  G.forEach(function(g, i){
    var x, y, sens = 1;
    if (g.ou === 'mer' && g.cap && LIEUX[g.cap]){
      /* en route : on la pose entre les deux ports, sur le trait */
      var b = LIEUX[g.cap];
      var a = LIEUX[g.depuis] || LIEUX.palma;
      x = a.x + (b.x - a.x) * .45;
      y = a.y + (b.y - a.y) * .45;
      sens = (b.x < a.x) ? -1 : 1;
    } else {
      var p = LIEUX[g.ou] || LIEUX.palma;
      /* plusieurs bateaux au même port : on les range autour */
      var n = g.rang || 0;
      x = p.x + (n % 2 ? 46 : -46) - 4;
      y = p.y + 30 + Math.floor(n / 2) * 40;
    }
    var e = 0.30;
    s += '<g transform="translate(' + x.toFixed(0) + ',' + (y - 26).toFixed(0) + ') '
      + 'scale(' + (sens * e) + ',' + e + ') translate(-150,-100)">'
      + barqueQ(Math.max(1, Math.min(20, g.barque || 1))) + '</g>';
    /* son nom sous la coque */
    s += '<text x="' + x.toFixed(0) + '" y="' + (y + 16).toFixed(0) + '"'
      + ' text-anchor="middle" font-family="Nunito,sans-serif" font-size="13"'
      + ' font-weight="800" fill="#fdf6e6" stroke="#12303f" stroke-width="3.4"'
      + ' paint-order="stroke">' + g.qui + '</text>';
    /* ce qu'elle porte, en petites caisses sur le pont */
    if (g.places)
      for (var c = 0; c < Math.min(6, g.places); c++)
        s += '<rect x="' + (x - 16 + c * 6).toFixed(0) + '" y="'
          + (y - 34).toFixed(0) + '" width="5" height="5" rx="1"'
          + ' fill="#f0c46a" stroke="#12303f" stroke-width="1.2"/>';
  });

  return s;
}

/* ============================================================
   LA PAGE
   ============================================================ */
var V = null;
var PORTS = { anse:'Marseille', barcelone:'Barcelone', palma:'Palma', ajaccio:'Ajaccio' };
function eur(n){ return Math.round(Number(n) || 0).toLocaleString('fr-FR'); }

/* la pression colore la marchandise : beaucoup débarqué, prix qui tombe */
function couleurPression(p){
  return p >= 12 ? '#e08a7a' : p >= 6 ? '#e0b070' : '#8ce0a8';
}

function ilYA(min){
  if (min === null || min === undefined) return 'jamais vu';
  if (min < 3) return 'à l\'instant';
  if (min < 60) return 'il y a ' + Math.round(min) + ' min';
  if (min < 1440) return 'il y a ' + Math.round(min / 60) + ' h';
  return 'il y a ' + Math.round(min / 1440) + ' j';
}

function poser(){
  document.getElementById('eu').textContent = eur(V.euros) + ' €';
  var s = '';

  s += '<div class="dit"><p>Le meunier te laisse monter. D\'ici, on voit la baie, '
    + 'et plus loin que la baie.</p></div>';

  /* ---- les ports ---- */
  s += '<h2>Où sont les gens</h2><div class="ports">'
    + (V.ports || []).map(function(p){
        return '<div class="p2' + (p.gens ? ' plein' : '') + '"><b>' + p.gens + '</b>'
          + '<span>' + p.nom + '</span></div>';
      }).join('') + '</div>';

  /* ---- la lunette ---- */
  if (!V.lunette)
    s += '<button class="lunette" id="lun">Emprunter la lunette — '
      + eur(V.prix) + ' €</button>'
      + '<p class="mot">Sans elle, tu vois les silhouettes. Avec elle, tu vois '
      + 'ce qu\'il y a dans les cales.</p>';

  var G = V.gens || [];

  /* ---- la carte : elle ne s'ouvre qu'avec la lunette ---- */
  if (V.lunette && G.length){
    /* on numérote ceux qui partagent un port, pour les ranger */
    var compte = {};
    G.forEach(function(g){
      var k = g.ou;
      g.rang = compte[k] = (compte[k] === undefined ? 0 : compte[k] + 1);
    });
    s += '<h2>La mer, d\'ici<em>à la lunette</em></h2>'
      + '<div class="carte"><svg viewBox="0 0 ' + CW + ' ' + CH + '"'
      + ' xmlns="http://www.w3.org/2000/svg">' + carte(G) + '</svg></div>'
      + '<p class="mot">Chaque barque est la vraie : son palier, sa voile, '
      + 'son gréement. Les caisses sur le pont sont ce qu\'elle porte.</p>';
  }

  /* ---- les gens ---- */
  s += '<h2>Ce que tu distingues' + (V.lunette ? '<em>à la lunette</em>' : '')
    + '</h2>';
  s += G.length
    ? '<div class="gens">' + G.map(function(g){
        var enMer = g.ou === 'mer';
        var lieu = enMer
          ? 'En mer, cap sur ' + (PORTS[g.cap] || g.cap)
          : 'À ' + (PORTS[g.ou] || g.ou);
        var cale = '';
        if (V.lunette){
          cale = (g.cale && g.cale.length)
            ? '<span class="cale">Dans sa cale : '
              + g.cale.map(function(e){
                  return e.nom + ' (' + e.places + ')';
                }).join(', ') + '</span>'
            : '<span class="cale" style="color:rgba(253,246,230,.4)">Cale vide</span>';
        }
        return '<div class="g' + (enMer ? ' mer' : '')
          + (g.capitaine ? ' cap' : '') + '">'
          + '<span class="av">' + BD.avatarSVG({ avatar: g.avatar }) + '</span>'
          + '<span class="t"><b>' + g.qui
          + (g.capitaine ? '<em>capitaine</em>' : '') + '</b>'
          + '<span>' + lieu + ' · ' + ilYA(g.vu) + '</span>' + cale + '</span>'
          + '<span class="n">nv ' + g.niveau + '</span></div>';
      }).join('') + '</div>'
    : '<p class="rien">La mer est vide. Tu es seul dehors aujourd\'hui.</p>';

  /* ---- ce qui a été débarqué ---- */
  var A = V.arrivages || [];
  s += '<h2>Ce qu\'on a débarqué<em>4 derniers jours</em></h2>';
  s += A.length
    ? '<div class="arr">' + A.map(function(a){
        return '<div class="a">'
          + '<span class="p" style="background:' + couleurPression(a.pression) + '"></span>'
          + '<span class="t"><b>' + a.nom + '</b>'
          + '<span>' + (PORTS[a.ou] || a.ou) + ' · ' + a.quand + '</span></span>'
          + '<span class="q"><b>' + a.places + '</b><span>places</span></span></div>';
      }).join('') + '</div>'
      + '<p class="mot">Le trait de gauche dit la pression du marché : vert, il y a '
      + 'de la place ; rouge, le port est saturé et les prix tombent.</p>'
    : '<p class="rien">Rien n\'a été débarqué ces jours-ci.</p>';

  document.getElementById('w').innerHTML = s;
  var l = document.getElementById('lun');
  if (l) l.onclick = prendre;
}

async function prendre(){
  var b = document.getElementById('lun');
  b.disabled = true; b.textContent = 'Le meunier la décroche…';
  var x;
  try { x = await BD.agir('prendre_la_lunette'); } catch(e){ x = null; }
  if (!x || !x.ok){
    b.disabled = false;
    b.textContent = x && x.pourquoi === 'trop_cher'
      ? 'Pas assez en poche' : 'Pas maintenant';
    return;
  }
  await charger();
}

async function charger(){
  var r;
  try { r = await BD.agir('la_vigie'); } catch(e){ leverAube(); return; }
  leverAube();
  if (!r || !r.ok){
    document.getElementById('w').innerHTML = '<p class="rien">'
      + (r && r.pourquoi === 'pas_ici'
          ? 'Le moulin est à Palma. Il faudra y monter en personne.'
          : 'La porte de la galerie est fermée.') + '</p>';
    return;
  }
  V = r; poser();
}

var AUBE = false;
function leverAube(){
  if (AUBE) return;
  AUBE = true;
  var c = document.getElementById('charge');
  if (!c) return;
  c.classList.add('parti');
  setTimeout(function(){ c.remove(); }, 500);
}
setTimeout(leverAube, 6000);

document.getElementById('ret').onclick = function(){ location.href = 'hub.html?v=3'; };

decor();
charger();

var t = null;
/* la barre d'adresse qui se cache envoie un resize : on ne redessine
   que si le cadre a vraiment changé, sinon l'écran clignote */
let __L = innerWidth, __H = innerHeight, __t = null;
function surRedimension(refaire){
  const dl = Math.abs(innerWidth - __L), dh = Math.abs(innerHeight - __H);
  if (dl < 2 && dh < 120) return;
  __L = innerWidth; __H = innerHeight;
  clearTimeout(__t);
  __t = setTimeout(refaire, 220);
}
addEventListener('resize', () => surRedimension(decor));
</script>
</body>
</html>
