<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#f5a53a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Les contrats — Battle Dock</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="couleurs.css?v=2">
<link rel="stylesheet" href="chaud.css?v=3">
<script>
/* ---------- le ciel du port où l'on se trouve ----------
   Posé avant la première image, pour ne pas ouvrir sur l'ocre de
   Marseille puis basculer. Le port est retenu par le hub. */
(function(){
  const C = { anse:['#f5a53a','#eeb455','#c9b978','#3f87a6','#2b6f92'],
    barcelone:['#e8873f','#c9686a','#8a5f84','#3f5f82','#1c3350'],
    palma:['#f6d97a','#e8b45c','#88b8a8','#2f92a4','#14566a'],
    ajaccio:['#e8a8a0','#c98fa0','#8f8fa8','#3f7f92','#17475c'] };
  let p = 'anse';
  try { p = localStorage.getItem('bd-port') || 'anse'; } catch(e){}
  const ci = C[p] || C.anse;
  const R = document.documentElement.style;
  ci.forEach((v, i) => R.setProperty('--h' + (i + 1), v));
  const m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', ci[0]);
})();

  /* le pied dit le port où l'on est, pas Marseille en toutes lettres */
  (function(){
    const N = { anse:'Marseille', barcelone:'Barcelone',
                palma:'Palma', ajaccio:'Ajaccio' };
    let p = 'anse';
    try { p = localStorage.getItem('bd-port') || 'anse'; } catch(e){}
    const el = document.querySelector('.pied');
    if (el) el.textContent = 'Battle Dock — ' + (N[p] || 'Marseille');
  })();
</script>
<style>
/* on recouvre le dégradé commun de chaud.css */
html{background:var(--h5,#2b6f92)}
body::before{background:linear-gradient(180deg,
  var(--h1,#f5a53a) 0%, var(--h2,#eeb455) 16%, var(--h3,#c9b978) 38%,
  var(--h4,#3f87a6) 70%, var(--h5,#2b6f92) 100%)}
</style>
<style>
/* la route */
.route{display:flex;align-items:center;gap:9px;padding:13px 15px;margin-bottom:13px;
  border-radius:16px;background:var(--creme);border:3px solid var(--encre);
  font-size:14px;font-weight:800}
.route .pt{width:10px;height:10px;border-radius:50%;background:var(--rouge);
  border:2px solid var(--encre);flex:0 0 10px}
.route .tr{flex:1;height:3px;border-radius:2px;
  background:repeating-linear-gradient(90deg,rgba(18,48,63,.4) 0 6px,transparent 6px 12px)}
.route .ar{font-size:17px;color:rgba(18,48,63,.5)}
/* la cale */
.cale{display:flex;align-items:center;gap:11px;padding:13px 15px;margin-bottom:18px;
  border-radius:16px;background:var(--creme2);border:3px solid var(--encre);
  font-size:13px;font-weight:600;color:rgba(18,48,63,.7)}
.cale .em{font-size:21px}
.cale b{font-weight:800;color:var(--encre)}
/* une offre */
.of{position:relative;padding:17px 18px;margin-bottom:13px;border-radius:18px;
  background:var(--creme);border:3px solid var(--encre);}
.of.top{background:#fff8e4;border-color:var(--encre)}
.of .ban{position:absolute;top:-3px;right:-3px;padding:6px 13px;
  border-radius:0 15px 0 14px;font-size:10px;font-weight:800;letter-spacing:.08em;
  text-transform:uppercase;background:var(--or);border:3px solid var(--encre)}
.of .l1{margin-bottom:6px;padding-right:96px}
.of .l1 b{font-family:'DM Serif Display',Georgia,serif;font-size:22px;line-height:1.1}
.of .no{font-size:13px;font-weight:600;color:rgba(18,48,63,.56);line-height:1.5;
  margin-bottom:14px}
.of .prix{display:flex;align-items:baseline;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.of .prix .mnt{font-family:'DM Serif Display',Georgia,serif;font-size:38px;
  line-height:1}
.of .prix .cmp{font-size:12px;font-weight:800}
.of .prix .cmp.plus{color:var(--vert)}
.of .prix .cmp.moins{color:var(--rouge)}
.of .prix .cmp.egal{color:rgba(18,48,63,.44)}
/* le marché */
.mk{padding:12px 13px;margin-bottom:14px;border-radius:13px;
  background:rgba(18,48,63,.05);border:2px solid rgba(18,48,63,.14)}
.mk .tt{display:flex;justify-content:space-between;gap:10px;font-size:10px;
  font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-bottom:7px;
  color:rgba(18,48,63,.5)}
.mk .ba{height:9px;border-radius:6px;background:rgba(18,48,63,.12);
  border:2px solid var(--encre);overflow:hidden}
.mk .ba i{display:block;height:100%}
.mk .ba i.bon{background:var(--vert)}
.mk .ba i.moy{background:var(--or)}
.mk .ba i.mal{background:var(--rouge)}
.mk .mo{font-size:12px;font-weight:600;margin-top:8px;line-height:1.45}
.mk .mo.bon{color:var(--vert)}
.mk .mo.moy{color:rgba(18,48,63,.6)}
.mk .mo.mal{color:var(--rouge)}
.of .l2{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.of /* une offre qu'on ne peut charger qu'en partie le dit franchement */
.et.part{background:rgba(240,169,46,.16);border-color:rgba(240,169,46,.5);
  color:#8a5a10}
.prix .sur{font-size:12px;font-weight:800;color:#a8763a;line-height:1.4}

.et{padding:6px 11px;border-radius:11px;font-size:11px;font-weight:800;
  white-space:nowrap;background:rgba(18,48,63,.08);
  border:2px solid rgba(18,48,63,.16)}
.of button{margin-left:auto;padding:12px 22px;border-radius:13px;cursor:pointer;
  background:var(--or);border:3px solid var(--encre);
  
  font-family:'DM Serif Display',Georgia,serif;font-size:17px;color:var(--encre)}
.of button:active{box-shadow:none}
.of.pris{background:#eaf6ee}
.of.pris .ban{background:var(--vert);color:#fff}
.of.pris .prix .mnt{color:var(--vert)}
.of .fait{margin-left:auto;font-size:13px;font-weight:800;color:var(--vert)}
.of.hors{opacity:.5}
.of.hors button{display:none}
.apprend{padding:15px 16px;border-radius:16px;background:rgba(253,246,230,.72);
  border:3px dashed rgba(18,48,63,.28);font-size:12.5px;font-weight:600;
  color:rgba(18,48,63,.62);line-height:1.6}
.apprend b{font-weight:800;color:var(--encre)}
.rien{text-align:center;padding:44px 22px;border-radius:18px;
  background:rgba(253,246,230,.7);border:3px dashed rgba(18,48,63,.3);
  font-size:14px;font-weight:600;color:rgba(18,48,63,.6);line-height:1.6}
</style>
</head>
<body>

<div class="pont">
  <div class="tete">
    <span class="q"><b>Les contrats</b><span id="c-sous">—</span></span>
    <button class="retour" id="retour">‹ Retour</button>
  </div>

  <div class="route" id="c-route"></div>
  <div class="cale" id="c-cale" style="display:none">
    <span class="em">⛵</span><span id="c-cale-t">—</span>
  </div>
  <div id="liste" class="attend"></div>
  <p class="pied">Battle Dock — Marseille</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="bd.js?v=4"></script>
<script src="son.js?v=1"></script>
<script>
/* le contenu paraît d'un trait, une fois complet */
function paraitre(){
  const e = document.getElementById('liste');
  if (e){ e.classList.remove('attend'); e.classList.add('venu'); }
}

const OU = { anse:'Marseille', marseille:'Marseille', barcelone:'Barcelone',
             palma:'Palma', ajaccio:'Ajaccio' };
const POURQUOI = {
  sans_bateau:"Il te faut une barque avant de charger quoi que ce soit.",
  pas_connu:"Personne ne te confie encore de marchandise ici.",
  pas_de_contrats:"On ne charge rien depuis ce port."
};

/* l'état du marché à destination, d'après ce qui y est déjà arrivé */
function marche(pression){
  const p = Number(pression) || 0;
  return {
    plein: Math.max(6, Math.round(100 * Math.pow(0.5, p / 6))),
    ton:   p < 2 ? 'bon' : p < 7 ? 'moy' : 'mal',
    titre: p < 2 ? 'Ils en manquent' : p < 7 ? 'Correct' : 'Saturé',
    mot:   p < 1 ? "Personne n'en a livré depuis des jours."
         : p < 2 ? "Presque rien n'est arrivé récemment."
         : p < 7 ? "Quelques caisses sont arrivées cette semaine."
         : "On en a beaucoup livré. Le prix remontera dans trois ou quatre jours."
  };
}

/* le prix comparé au cours normal */
function ecartPrix(demande){
  const e = Math.round((Number(demande) - 1) * 100);
  if (e >= 4)  return '<span class="cmp plus">+' + e + ' % sur le prix courant</span>';
  if (e <= -4) return '<span class="cmp moins">−' + Math.abs(e)
                    + ' % sur le prix courant</span>';
  return '<span class="cmp egal">au prix courant</span>';
}

async function dessiner(){
  const L = document.getElementById('liste');
  let r;
  try { r = await BD.agir('contrats_du_jour'); } catch(e){ r = null; }

  if (!r || !r.ok){
    L.innerHTML = '<p class="rien">'
      + ((r && POURQUOI[r.pourquoi]) || "Rien à charger pour l'instant.") + '</p>'; paraitre();
    return;
  }

  document.getElementById('c-route').innerHTML =
    '<span class="pt"></span>' + (OU[r.depuis] || r.depuis)
    + '<span class="tr"></span><span class="ar">›</span>'
    + (OU[r.vers] || r.vers);

  const C = r.contrats || [];
  /* ce qui pèse, c'est la cale elle-même : un chargement pris hier y est
     encore, même s'il n'apparaît pas dans les contrats du jour */
  const libre = (r.libre === undefined)
    ? (C.some(c => c.etat !== 'propose') ? 0 : r.places) : r.libre;
  const dedans = r.dedans || [];
  const dejaPris = libre <= 0;
  const cale = document.getElementById('c-cale');
  cale.style.display = 'flex';
  /* la chèvre n'est pas une marchandise : on la nomme à part */
  const laChevre = dedans.some(x => x.nom === 'Rosine');
  const marchand = dedans.filter(x => x.nom !== 'Rosine');
  document.getElementById('c-cale-t').innerHTML = dejaPris
    ? (marchand.length
        ? 'Ta cale porte déjà <b>' + marchand.map(x => x.nom).join(', ')
          + '</b> pour ' + (OU[marchand[0].vers] || marchand[0].vers)
          + (laChevre ? ', et une chèvre' : '')
          + '. Va livrer avant d\'en charger une autre.'
        : laChevre
          ? 'Il y a une chèvre dans ta cale. Elle prend de la place, '
            + 'et elle mange ce qu\'elle trouve.'
          : "Ta cale est prise. Va livrer avant d'en charger une autre.")
    : (laChevre
        ? 'Une chèvre occupe une place. Il t\'en reste <b>' + libre
          + '</b> — elle mangera un peu de ce que tu mets à côté.'
        : 'Ta cale prend <b>' + r.places + ' place' + (r.places > 1 ? 's' : '')
          + '</b> — une course, un chargement.');

  if (!C.length){
    L.innerHTML = '<p class="rien">Le quai est vide aujourd\'hui.<br>'
      + 'Reviens demain, on aura de quoi charger.</p>'; paraitre();
    return;
  }

  /* la meilleure offre encore libre, pour le ruban */
  const libres = C.filter(x => x.etat === 'propose');
  const mieux = libres.length > 1
    ? libres.reduce((a, b) => b.paie > a.paie ? b : a) : null;

  L.innerHTML = C.map(c => {
    const pris = c.etat !== 'propose'; paraitre();
    const hors = dejaPris && !pris;
    const m = marche(c.pression);
    return '<div class="of' + (pris ? ' pris' : '') + (hors ? ' hors' : '')
      + (c === mieux ? ' top' : '') + '">'
      + (pris ? '<span class="ban">Dans ta cale</span>'
         : c === mieux ? '<span class="ban">Le mieux payé</span>' : '')
      + '<div class="in">'
      + '<div class="l1"><b>' + c.nom + '</b></div>'
      + (c.note ? '<p class="no">' + c.note + '</p>' : '')
      + '<div class="prix"><span class="mnt">' + c.paie + ' €</span>'
      +   (c.reduit
            ? '<span class="sur">au lieu de ' + c.paie_pleine
              + ' € — ta cale n\'est pas vide</span>'
            : ecartPrix(c.demande)) + '</div>'
      + '<div class="mk">'
      +   '<div class="tt"><span>Le marché à ' + (OU[c.vers] || c.vers) + '</span>'
      +   '<span>' + m.titre + '</span></div>'
      +   '<div class="ba"><i class="' + m.ton + '" style="width:' + m.plein + '%"></i></div>'
      +   '<p class="mo ' + m.ton + '">' + m.mot + '</p>'
      + '</div>'
      + '<div class="l2">'
      +   '<span class="et">' + c.kg + ' kg</span>'
      +   '<span class="et' + (c.reduit ? ' part' : '') + '">'
      +     (c.places >= r.places ? 'Toute ta cale'
             : c.places + ' place' + (c.places > 1 ? 's' : '')
               + (c.reduit ? ' sur ' + c.places_offert : '')) + '</span>'
      +   (pris ? '<span class="fait">Chargé</span>'
           : hors ? ''
           : c.places < 1 ? '<span class="fait">Cale pleine</span>'
           : '<button data-id="' + c.id + '">Charger</button>')
      + '</div></div></div>';
  }).join('')
  + '<p class="apprend"><b>Le marché bouge.</b> Chaque caisse livrée quelque part y '
  + 'fait baisser le prix de cette marchandise. Ça remonte en trois ou quatre jours. '
  + 'Livrer ce dont ils manquent paie mieux.</p>';

  L.querySelectorAll('button[data-id]').forEach(b =>
    b.onclick = async () => {
      b.disabled = true; b.textContent = '…';
      let x = null;
      try { x = await BD.agir('prendre_contrat', { p_id: b.dataset.id }); } catch(e){}
      if (x && (x.ok || x.pris)){ dessiner(); return; }
      /* dire pourquoi, plutôt que de remettre le bouton comme si de rien */
      const P = { cale_pleine:'Cale pleine', en_mer:'Tu es en mer',
                  pas_ici:'Pas depuis ce port', introuvable:'Offre expirée' };
      b.textContent = (x && P[x.pourquoi]) || 'Impossible';
      if (x && x.pourquoi === 'cale_pleine'){ setTimeout(dessiner, 900); return; }
      setTimeout(() => { b.disabled = false; b.textContent = 'Charger'; }, 1400);
    });
}

(async () => {
  try {
    const d = await BD.charger();
    if (!d){ location.href = 'index.html'; return; }
    await dessiner();
  } catch(e){
    console.warn(e);
    document.getElementById('liste').innerHTML =
      '<p class="rien">Le quai n\'a pas répondu.</p>';
  }
})();

/* on revient d'où l'on vient : l'atelier de Pere renvoie chez lui */
document.getElementById('retour').onclick = () => {
  let ou = 'hub.html?v=3';
  try { if (sessionStorage.getItem('bd-venu') === 'pere') ou = 'pere.html'; } catch(e){}
  try { sessionStorage.removeItem('bd-venu'); } catch(e){}
  location.href = ou;
};
</script>
</body>
</html>
